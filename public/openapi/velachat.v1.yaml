openapi: 3.1.0
info:
  title: velaChat 本地 Runtime API
  version: 0.1.0
  summary: localhost-first、多客户端、多后端的 agent runtime API。
  description: |
    velaChat 为桌面、网页和手机客户端暴露本地 daemon API。
    daemon 是 source of truth；client 消费资源端点和可恢复事件流。
    对外 cursor 使用 event_id；daemon 内部映射到 epoch + seq。
servers:
  - url: http://127.0.0.1:3857/api/v1
    description: 本地 daemon
tags:
  - name: Runtime
  - name: Sessions
  - name: Input Events
  - name: Events
  - name: UI Read Models
  - name: Diagnostics
  - name: Requests
  - name: Backends
  - name: Nodes
  - name: Observability
paths:
  /sessions:
    get:
      tags: [Sessions]
      operationId: listSessions
      summary: 列出 sessions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AfterId'
      responses:
        '200':
          description: Session directory view。
          content:
            application/json:
              schema:
                type: object
                required: [sessions]
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: '#/components/schemas/SessionSummary'
                  cursor:
                    $ref: '#/components/schemas/CursorWindow'
    post:
      tags: [Sessions]
      operationId: createSession
      summary: 创建 session
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSessionRequest'
      responses:
        '201':
          description: 创建成功的 session。
          content:
            application/json:
              schema:
                type: object
                required: [session, cursor]
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  cursor:
                    $ref: '#/components/schemas/EventCursor'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{session_id}:
    get:
      tags: [Sessions]
      operationId: getSession
      summary: 获取 session view
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session view。
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{session_id}/agent-config:
    patch:
      tags: [Sessions]
      operationId: updateSessionAgentConfig
      summary: 更新 session 当前 agent 配置
      description: |
        Updates the session-level agent config preference. Running turns keep the
        resolved_agent_config that was frozen when their turn.started event was
        appended; new input commands use the updated session agent_config.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSessionAgentConfigRequest'
      responses:
        '200':
          description: Agent config updated.
          content:
            application/json:
              schema:
                type: object
                required: [session, effective_after, cursor]
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  effective_after:
                    type: string
                    enum: [current_session, next_turn]
                  cursor:
                    $ref: '#/components/schemas/EventCursor'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{session_id}/cancel:
    post:
      tags: [Input Events]
      operationId: cancelSession
      summary: 取消当前运行中的 turn
      description: |
        语义化 cancel command。Backend adapter 可映射到后端 cancel 机制；
        如果某些后端内部称为打断，也只能停留在 adapter 边界内。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Cancel 已被接受。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAck'
  /sessions/{session_id}/close:
    post:
      tags: [Sessions]
      operationId: closeSession
      summary: 关闭 session
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Close 已被接受。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedCommand'
  /sessions/{session_id}/archive:
    post:
      tags: [Sessions]
      operationId: archiveSession
      summary: 归档 session
      description: |
        Archives a session so it disappears from default active session lists.
        The session data remains available for future restore or permanent
        deletion flows.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Session archived.
          content:
            application/json:
              schema:
                type: object
                required: [session]
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
        '404':
          $ref: '#/components/responses/NotFound'
  /sessions/{session_id}/events:
    post:
      tags: [Input Events]
      operationId: sendSessionInputEvents
      summary: 向 session 投递用户输入事件
      description: |
        velaChat 的统一 input command surface。POST 进来的 input events 是用户意图，
        不是 canonical runtime facts；daemon 接受后才会 append canonical events。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSessionEventsRequest'
      responses:
        '202':
          description: Input events 已被接受、排队或拒绝。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandAck'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    get:
      tags: [Events]
      operationId: listSessionEvents
      summary: 获取 canonical event history
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AfterId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Canonical events。
          content:
            application/json:
              schema:
                type: object
                required: [events, cursor]
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/VelaEvent'
                  cursor:
                    $ref: '#/components/schemas/CursorWindow'
        '409':
          description: Cursor 已 stale，需要 reset。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncReset'
  /sessions/{session_id}/events/stream:
    get:
      tags: [Events]
      operationId: streamSessionEvents
      summary: 订阅 canonical session events
      description: |
        Server-Sent Events stream. Each SSE message uses the canonical event_id
        as the SSE id field. Clients may reconnect with after_id or Last-Event-ID.
        Request lifecycle events such as request.opened/request.resolved notify
        clients to refresh PendingRequestsView; clients must not render raw
        request events directly as chat transcript text.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AfterId'
      responses:
        '200':
          description: SSE stream of VelaEvent or sync.reset messages.
          content:
            text/event-stream:
              schema:
                type: string
  /events/stream:
    get:
      tags: [Events]
      operationId: streamWorkbenchEvents
      summary: 订阅 workbench-wide events
      parameters:
        - $ref: '#/components/parameters/AfterId'
      responses:
        '200':
          description: SSE stream of events across sessions and backend state.
          content:
            text/event-stream:
              schema:
                type: string
  /views/sessions:
    get:
      tags: [UI Read Models]
      operationId: getSessionListView
      summary: 获取 session sidebar / rail 投影
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/AfterId'
      responses:
        '200':
          description: SessionListView projection。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionListView'
  /sessions/{session_id}/views/session:
    get:
      tags: [UI Read Models]
      operationId: getSessionView
      summary: 获取当前 session 的 UI 投影
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: SessionView projection。
          content:
            application/json:
              schema:
                type: object
                required: [session, cursor]
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
                  cursor:
                    $ref: '#/components/schemas/EventCursor'
  /sessions/{session_id}/views/conversation:
    get:
      tags: [UI Read Models]
      operationId: getConversationView
      summary: 获取 ConversationView
      description: |
        Chat UI 的主输入。返回 conversation item window，而不是 raw events 或 timeline。
        Item cursor 用于列表分页；response cursor 仍是 event cursor，用于 live stream/reconnect/reset。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Limit'
        - name: direction
          in: query
          description: View window direction. Defaults to tail when omitted. before/after/around require anchor_item_id.
          schema:
            $ref: '#/components/schemas/ViewWindowDirection'
        - name: anchor_item_id
          in: query
          description: Opaque conversation item anchor used with direction=before|after|around. direction=tail must not include an anchor.
          schema:
            type: string
      responses:
        '200':
          description: Conversation projection。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationView'
        '409':
          $ref: '#/components/responses/Conflict'
  /sessions/{session_id}/views/requests:
    get:
      tags: [UI Read Models]
      operationId: getPendingRequestsView
      summary: 获取 PendingRequestsView
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RequestStatus'
      responses:
        '200':
          description: Pending requests projection。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingRequestsView'
  /sessions/{session_id}/views/diffs:
    get:
      tags: [UI Read Models]
      operationId: getDiffReviewView
      summary: 获取 DiffReviewView
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: Diff review projection。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiffReviewView'
  /sessions/{session_id}/diagnostics/timeline:
    get:
      tags: [Diagnostics]
      operationId: getSessionDiagnosticsTimeline
      summary: 获取 session diagnostics timeline
      description: |
        Diagnostics-only timeline，用于 audit、replay、debug、export。
        普通 UI surface 必须使用 ConversationView，不能直接消费 timeline 拼界面。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/Limit'
        - name: before_id
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Timeline projection。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelineProjection'
  /sessions/{session_id}/diagnostics/timeline/{item_id}:
    get:
      tags: [Diagnostics]
      operationId: getSessionDiagnosticsTimelineItem
      summary: 获取单个 session diagnostics timeline item
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timeline item。
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item:
                    $ref: '#/components/schemas/TimelineItem'
  /sessions/{session_id}/diagnostics/trace:
    get:
      tags: [Diagnostics]
      operationId: getSessionDiagnosticsTrace
      summary: 获取 session command/runtime trace
      description: |
        调试 command acceptance、backend raw output、normalization、projection invalidation 的链路。
        普通 UI surface 不应依赖 trace 构建界面。
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AfterId'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Diagnostic trace。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosticTrace'
  /requests/{request_id}:
    get:
      tags: [Requests]
      operationId: getRequest
      summary: 获取 request
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Agent request。
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request:
                    $ref: '#/components/schemas/AgentRequest'
  /backends:
    get:
      tags: [Backends]
      operationId: listBackends
      summary: 列出已配置 backends
      responses:
        '200':
          description: Backends 与 capabilities。
          content:
            application/json:
              schema:
                type: object
                required: [backends]
                properties:
                  backends:
                    type: array
                    items:
                      $ref: '#/components/schemas/Backend'
  /backends/{backend}:
    get:
      tags: [Backends]
      operationId: getBackend
      summary: 获取 backend details
      parameters:
        - $ref: '#/components/parameters/BackendKind'
      responses:
        '200':
          description: Backend details。
          content:
            application/json:
              schema:
                type: object
                required: [backend]
                properties:
                  backend:
                    $ref: '#/components/schemas/Backend'
  /backends/{backend}/probe:
    post:
      tags: [Backends]
      operationId: probeBackend
      summary: 探测 backend health
      parameters:
        - $ref: '#/components/parameters/BackendKind'
      responses:
        '200':
          description: Probe result。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendProbeResult'
  /node-providers:
    get:
      tags: [Nodes]
      operationId: listNodeProviders
      summary: 列出本机 velad 支持的 node providers
      description: |
        Node providers are transport/connectors for where velad may run, not
        agent backends. The first managed remote provider is native SSH.
      responses:
        '200':
          description: Node provider catalog。
          content:
            application/json:
              schema:
                type: object
                required: [schema, providers]
                properties:
                  schema:
                    type: string
                    const: velad.node_providers.v1
                  providers:
                    type: array
                    items:
                      $ref: '#/components/schemas/NodeProvider'
  /nodes:
    get:
      tags: [Nodes]
      operationId: listNodes
      summary: 列出已保存 nodes
      responses:
        '200':
          description: Saved nodes。
          content:
            application/json:
              schema:
                type: object
                required: [schema, nodes]
                properties:
                  schema:
                    type: string
                    const: velad.nodes.v1
                  nodes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Node'
    post:
      tags: [Nodes]
      operationId: createNode
      summary: 新增 SSH node
      description: |
        Password is write-only. velad stores it in the local OS credential
        store and only returns `secret_ref` plus `password_configured`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNodeRequest'
      responses:
        '201':
          description: Node created。
          content:
            application/json:
              schema:
                type: object
                required: [schema, node]
                properties:
                  schema:
                    type: string
                    const: velad.nodes.v1
                  node:
                    $ref: '#/components/schemas/Node'
  /runtime-targets:
    get:
      tags: [Nodes]
      operationId: listRuntimeTargets
      summary: 列出 local velad 可投影的 runtime targets
      description: |
        Runtime targets are connection-state projections derived from local
        runtime state and saved nodes. Remote targets start as disconnected
        until an SSH transport opens them.
      responses:
        '200':
          description: Runtime target projection。
          content:
            application/json:
              schema:
                type: object
                required: [schema, targets]
                properties:
                  schema:
                    type: string
                    const: velad.runtime_targets.v1
                  targets:
                    type: array
                    items:
                      $ref: '#/components/schemas/RuntimeTarget'
  /runtime-targets/{target_id}/connect:
    post:
      tags: [Nodes]
      operationId: connectRuntimeTarget
      summary: 连接 remote runtime target
      description: |
        Opens the target's native SSH transport, uploads or reuses the exact
        remote `velad` artifact, waits for the remote ready-file handshake,
        opens a local loopback tunnel, and verifies `/runtime-info`.
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime target connection state。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeTargetResponse'
        '502':
          description: SSH transport or remote runtime connection failed。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /runtime-targets/{target_id}/disconnect:
    post:
      tags: [Nodes]
      operationId: disconnectRuntimeTarget
      summary: 断开 remote runtime target
      description: |
        Requests graceful shutdown through the remote runtime endpoint over
        the local tunnel, then closes the SSH tunnel/session handle.
      parameters:
        - name: target_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Runtime target disconnected state。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeTargetResponse'
        '502':
          description: Remote shutdown or SSH cleanup failed。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /runtime-info:
    get:
      tags: [Runtime]
      operationId: getRuntimeInfo
      summary: 获取 local velad runtime 信息
      description: |
        Returns the same local runtime contract shape emitted as the bundled
        daemon's `velad.ready` stdout event.
      responses:
        '200':
          description: Local runtime info。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalRuntimeInfo'
  /runtime/shutdown:
    post:
      tags: [Runtime]
      operationId: shutdownRuntime
      summary: 请求 local velad 优雅退出
      description: |
        Requires `Authorization: Bearer <management-token>`. The token protects
        local runtime process control only; it does not change business API auth.
      responses:
        '200':
          description: Shutdown accepted。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuntimeShutdownAccepted'
        '403':
          description: Missing or invalid management token。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /observability/status:
    get:
      tags: [Observability]
      operationId: getObservabilityStatus
      summary: 获取本机观测存储状态
      responses:
        '200':
          description: Local observability status。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityStatus'
  /observability/recent-errors:
    get:
      tags: [Observability]
      operationId: listRecentObservabilityErrors
      summary: 查询最近错误
      parameters:
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent local errors。
          content:
            application/json:
              schema:
                type: object
                required: [errors]
                properties:
                  errors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ObservabilityErrorRecord'
  /observability/traces/{trace_id}:
    get:
      tags: [Observability]
      operationId: getObservabilityTrace
      summary: 查询单条 trace
      parameters:
        - name: trace_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Trace detail。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityTraceDetail'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/traces:
    post:
      tags: [Observability]
      operationId: ingestOtlpJsonTraces
      summary: 接收 OTLP/HTTP JSON traces
      servers:
        - url: http://127.0.0.1:3857
          description: 本地 daemon OTLP endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Trace payload accepted。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityIngestSummary'
  /v1/logs:
    post:
      tags: [Observability]
      operationId: ingestOtlpJsonLogs
      summary: 接收 OTLP/HTTP JSON logs
      servers:
        - url: http://127.0.0.1:3857
          description: 本地 daemon OTLP endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Log payload accepted。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservabilityIngestSummary'
components:
  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: request_id
      in: path
      required: true
      schema:
        type: string
    BackendKind:
      name: backend
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/BackendKind'
    AfterId:
      name: after_id
      in: query
      required: false
      schema:
        type: string
      description: Opaque event cursor；SSE 重连时等价于 Last-Event-ID。
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
  responses:
    NotFound:
      description: 资源不存在。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 资源状态冲突。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    LocalRuntimeInfo:
      type: object
      required: [type, runtime_protocol, api_protocol, otel_protocol, pid, listen_addr, api_base_url, otel_base_url, observability_base_url, version]
      properties:
        type:
          type: string
          enum: [velad.ready]
        runtime_protocol:
          type: string
          enum: [velad.local.v1]
        api_protocol:
          type: string
          enum: [velachat.v1]
        otel_protocol:
          type: string
          enum: [otlp.http.json]
        pid:
          type: integer
          minimum: 1
        listen_addr:
          type: string
        api_base_url:
          type: string
        otel_base_url:
          type: string
        observability_base_url:
          type: string
        version:
          type: string
    RuntimeShutdownAccepted:
      type: object
      required: [accepted]
      properties:
        accepted:
          type: boolean
    ObservabilityIngestSummary:
      type: object
      required: [accepted, spans, logs]
      properties:
        accepted:
          type: boolean
        spans:
          type: integer
          minimum: 0
        logs:
          type: integer
          minimum: 0
    ObservabilityStatus:
      type: object
      required: [enabled, spans, logs]
      properties:
        enabled:
          type: boolean
        spans:
          type: integer
          minimum: 0
        logs:
          type: integer
          minimum: 0
        raw_dir:
          type: string
          nullable: true
    ObservabilityTraceDetail:
      type: object
      required: [trace_id, spans]
      properties:
        trace_id:
          type: string
        spans:
          type: array
          items:
            $ref: '#/components/schemas/ObservabilitySpan'
    ObservabilitySpan:
      type: object
      required: [trace_id, span_id, name, attributes, observed_at]
      properties:
        trace_id:
          type: string
        span_id:
          type: string
        parent_span_id:
          type: string
          nullable: true
        name:
          type: string
        start_time_unix_nano:
          type: integer
          nullable: true
        end_time_unix_nano:
          type: integer
          nullable: true
        duration_ms:
          type: number
          nullable: true
        status_code:
          type: string
          nullable: true
        status_message:
          type: string
          nullable: true
        session_id:
          type: string
          nullable: true
        backend:
          type: string
          nullable: true
        error_message:
          type: string
          nullable: true
        attributes:
          type: object
          additionalProperties: true
        observed_at:
          type: string
          format: date-time
    ObservabilityErrorRecord:
      type: object
      required: [source, name, message, observed_at]
      properties:
        source:
          type: string
          enum: [span, log]
        trace_id:
          type: string
          nullable: true
        span_id:
          type: string
          nullable: true
        name:
          type: string
        message:
          type: string
        session_id:
          type: string
          nullable: true
        backend:
          type: string
          nullable: true
        observed_at:
          type: string
          format: date-time
    BackendKind:
      type: string
      enum: [codex, cloudagent, claude_code, pi, opencode, acp, qoder, vela_engine]
    ViewWindowDirection:
      type: string
      enum: [tail, before, after, around]
    SessionStatus:
      type: string
      enum: [starting, idle, running, waiting_for_input, canceling, failed, closed, archived]
    RequestStatus:
      type: string
      enum: [pending, approved, denied, answered, expired, cancelled]
    NodeProviderKind:
      type: string
      enum: [ssh]
    NodeAuthMethod:
      type: string
      enum: [password]
    RuntimeTargetKind:
      type: string
      enum: [local, remote]
    RuntimeTargetStatus:
      type: string
      enum: [connected, connecting, ready, degraded, reconnecting, disconnected, failed, error]
    NodeProvider:
      type: object
      required: [id, display_name, kind, auth_methods, secret_storage, capabilities, target_constraints]
      properties:
        id:
          $ref: '#/components/schemas/NodeProviderKind'
        display_name:
          type: string
        kind:
          $ref: '#/components/schemas/NodeProviderKind'
        auth_methods:
          type: array
          items:
            $ref: '#/components/schemas/NodeAuthMethod'
        secret_storage:
          type: string
          enum: [local_os_keyring]
        capabilities:
          type: object
          additionalProperties: true
        target_constraints:
          type: object
          required: [os, arch]
          properties:
            os:
              type: array
              items:
                type: string
                enum: [linux, darwin]
            arch:
              type: array
              items:
                type: string
                enum: [x86_64, amd64]
    SshNode:
      type: object
      required: [host, port, username]
      properties:
        host:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        username:
          type: string
    NodeTarget:
      type: object
      required: [os, arch]
      properties:
        os:
          type: string
          enum: [linux, darwin]
        arch:
          type: string
          enum: [x86_64]
    NodeAuth:
      type: object
      required: [method, password_configured]
      properties:
        method:
          $ref: '#/components/schemas/NodeAuthMethod'
        password_configured:
          type: boolean
        secret_ref:
          type: string
          nullable: true
      additionalProperties: false
    Node:
      type: object
      required: [id, provider, display_name, ssh, target, auth, created_at, updated_at]
      properties:
        id:
          type: string
        provider:
          $ref: '#/components/schemas/NodeProviderKind'
        display_name:
          type: string
        ssh:
          $ref: '#/components/schemas/SshNode'
        target:
          $ref: '#/components/schemas/NodeTarget'
        auth:
          $ref: '#/components/schemas/NodeAuth'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CreateNodeRequest:
      type: object
      required: [provider, ssh, auth]
      additionalProperties: false
      properties:
        provider:
          $ref: '#/components/schemas/NodeProviderKind'
        display_name:
          type: string
        ssh:
          $ref: '#/components/schemas/SshNode'
        auth:
          type: object
          required: [method, password]
          additionalProperties: false
          properties:
            method:
              $ref: '#/components/schemas/NodeAuthMethod'
            password:
              type: string
              writeOnly: true
        target:
          type: object
          additionalProperties: false
          properties:
            os:
              type: string
              enum: [linux, darwin]
            arch:
              type: string
              enum: [x86_64, amd64]
    RuntimeTarget:
      type: object
      required: [id, kind, provider, display_name, status, transport]
      properties:
        id:
          type: string
        kind:
          $ref: '#/components/schemas/RuntimeTargetKind'
        provider:
          type: string
          enum: [local, ssh]
        node_id:
          type: string
          nullable: true
        display_name:
          type: string
        status:
          $ref: '#/components/schemas/RuntimeTargetStatus'
        transport:
          type: object
          additionalProperties: true
        target:
          type: object
          additionalProperties: true
        compatibility:
          type: object
          additionalProperties: true
    RuntimeTargetResponse:
      type: object
      required: [schema, target]
      properties:
        schema:
          type: string
          const: velad.runtime_targets.v1
        target:
          $ref: '#/components/schemas/RuntimeTarget'
    CreateSessionRequest:
      type: object
      required: [backend, working_directory]
      properties:
        backend:
          $ref: '#/components/schemas/BackendKind'
        working_directory:
          type: string
        agent_config:
          $ref: '#/components/schemas/AgentConfig'
        model:
          deprecated: true
          description: Deprecated compatibility alias for agent_config.model.
          type: string
        title:
          type: string
        metadata:
          type: object
          additionalProperties: true
    UpdateSessionAgentConfigRequest:
      allOf:
        - $ref: '#/components/schemas/AgentConfig'
      minProperties: 1
    AgentConfig:
      type: object
      additionalProperties: false
      properties:
        model:
          type: string
        reasoning_effort:
          type: string
        permission_mode:
          $ref: '#/components/schemas/PermissionMode'
        feature_values:
          type: object
          additionalProperties: true
    ResolvedAgentConfig:
      allOf:
        - $ref: '#/components/schemas/AgentConfig'
        - type: object
          required: [backend]
          properties:
            backend:
              $ref: '#/components/schemas/BackendKind'
    PermissionMode:
      type: string
      enum: [read_only, auto, auto_review, full_access]
    SendSessionEventsRequest:
      type: object
      required: [events]
      properties:
        events:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ClientInputEvent'
        options:
          type: object
          additionalProperties: true
    ClientInputEvent:
      type: object
      required: [type]
      properties:
        type:
          $ref: '#/components/schemas/ClientInputEventType'
        content:
          type: array
          items:
            $ref: '#/components/schemas/InputPart'
        request_id:
          type: string
        result:
          type: string
          enum: [allow, deny]
        scope:
          type: string
          enum: [once, session, project]
        answer:
          type: string
        options:
          type: object
          additionalProperties: true
    ClientInputEventType:
      type: string
      enum:
        - user.message
        - user.tool_confirmation
        - user.custom_tool_result
        - user.request_answer
    InputPart:
      oneOf:
        - $ref: '#/components/schemas/TextInputPart'
        - $ref: '#/components/schemas/FileRefInputPart'
        - $ref: '#/components/schemas/ImageRefInputPart'
        - $ref: '#/components/schemas/ImageInputPart'
      discriminator:
        propertyName: type
    TextInputPart:
      type: object
      required: [type, text]
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
    FileRefInputPart:
      type: object
      required: [type, uri]
      properties:
        type:
          type: string
          enum: [file_ref]
        uri:
          type: string
    ImageRefInputPart:
      type: object
      required: [type, uri]
      properties:
        type:
          type: string
          enum: [image_ref]
        uri:
          type: string
    ImageInputPart:
      type: object
      required: [type, data, mime_type]
      properties:
        type:
          type: string
          enum: [image]
        data:
          description: Base64 encoded binary payload without a data URL prefix.
          type: string
        mime_type:
          description: Media type for image data, for example image/png.
          type: string
    SessionSummary:
      type: object
      required: [id, backend, status, title, updated_at]
      properties:
        id:
          type: string
        backend:
          $ref: '#/components/schemas/BackendKind'
        status:
          $ref: '#/components/schemas/SessionStatus'
        title:
          type: string
        agent_config:
          $ref: '#/components/schemas/AgentConfig'
        updated_at:
          type: string
          format: date-time
    SessionListItem:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required:
            - working_directory
            - created_at
            - last_activity_at
            - preview
            - pending_request_count
            - running
          properties:
            working_directory:
              type: string
            created_at:
              type: string
              format: date-time
            last_activity_at:
              type: string
              format: date-time
            preview:
              type: string
            pending_request_count:
              type: integer
              minimum: 0
            activity:
              $ref: '#/components/schemas/SessionActivity'
            running:
              type: boolean
            model:
              deprecated: true
              description: Deprecated compatibility alias for agent_config.model.
              type: string
              nullable: true
    Session:
      allOf:
        - $ref: '#/components/schemas/SessionSummary'
        - type: object
          required: [working_directory, created_at]
          properties:
            working_directory:
              type: string
            model:
              deprecated: true
              description: Deprecated compatibility alias for agent_config.model.
              type: string
            agent_config:
              $ref: '#/components/schemas/AgentConfig'
            runtime_info:
              $ref: '#/components/schemas/SessionRuntimeInfo'
            activity:
              $ref: '#/components/schemas/SessionActivity'
            operations:
              $ref: '#/components/schemas/SessionOperations'
            created_at:
              type: string
              format: date-time
            metadata:
              type: object
              additionalProperties: true
    SessionActivity:
      type: object
      required: [phase, attention, pending_request_count]
      properties:
        phase:
          type: string
          enum: [idle, starting, running, canceling]
          description: Current server-side turn execution phase. Waiting for user input is not running.
        attention:
          type: string
          enum: [none, waiting_for_user, error]
          description: Whether the session currently needs user or error attention.
        pending_request_count:
          type: integer
          minimum: 0
    SessionRuntimeInfo:
      type: object
      required: [provider]
      properties:
        provider:
          $ref: '#/components/schemas/BackendKind'
        native_session_id:
          description: Provider-native durable session handle when available; opaque to clients.
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        reasoning_effort:
          type: string
          nullable: true
        permission_mode:
          allOf:
            - $ref: '#/components/schemas/PermissionMode'
          nullable: true
        feature_values:
          type: object
          additionalProperties: true
    SessionOperations:
      type: object
      additionalProperties:
        $ref: '#/components/schemas/SessionOperation'
      properties:
        send_message:
          $ref: '#/components/schemas/SessionOperation'
        cancel:
          $ref: '#/components/schemas/SessionOperation'
        update_agent_config:
          allOf:
            - $ref: '#/components/schemas/SessionOperation'
            - type: object
              properties:
                effective_after:
                  type: string
                  enum: [current_session, next_turn]
        respond_to_request:
          $ref: '#/components/schemas/SessionOperation'
        rewind_conversation:
          $ref: '#/components/schemas/SessionOperation'
        rewind_files:
          $ref: '#/components/schemas/SessionOperation'
    SessionOperation:
      type: object
      required: [available]
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
    EventCursor:
      type: object
      required: [event_id, epoch, seq]
      properties:
        event_id:
          type: string
        epoch:
          type: integer
        seq:
          type: integer
    CursorWindow:
      type: object
      properties:
        epoch:
          type: integer
        from_seq:
          type: integer
        to_seq:
          type: integer
        next_event_id:
          type: string
        has_older:
          type: boolean
        has_newer:
          type: boolean
    VelaEvent:
      type: object
      required: [event_id, epoch, seq, session_id, type, created_at, payload]
      properties:
        event_id:
          type: string
        epoch:
          type: integer
        seq:
          type: integer
        session_id:
          type: string
        thread_id:
          type: string
        type:
          $ref: '#/components/schemas/VelaEventType'
        created_at:
          type: string
          format: date-time
        affected_views:
          type: array
          items:
            $ref: '#/components/schemas/AffectedView'
        source:
          type: object
          additionalProperties: true
        payload:
          type: object
          additionalProperties: true
        raw:
          type: object
          additionalProperties: true
    VelaEventType:
      type: string
      enum:
        - session.created
        - session.updated
        - session.config.updated
        - session.status.changed
        - session.closed
        - backend.status.changed
        - user.message.accepted
        - input.queued
        - input.rejected
        - turn.cancel.accepted
        - request.response.accepted
        - turn.started
        - turn.completed
        - turn.failed
        - turn.cancelled
        - assistant.message.started
        - assistant.message.delta
        - assistant.message.completed
        - assistant.reasoning.delta
        - assistant.reasoning.completed
        - tool.started
        - tool.updated
        - tool.output.delta
        - tool.completed
        - tool.failed
        - task.started
        - task.updated
        - task.completed
        - request.opened
        - request.updated
        - request.resolved
        - diff.updated
        - usage.updated
        - warning.raised
        - error.raised
        - projection.invalidated
    AffectedView:
      type: string
      enum:
        - sessions
        - session
        - conversation
        - requests
        - diffs
        - timeline
        - backends
        - workbench
    SyncReset:
      type: object
      required: [reason, views, latest_event_id]
      properties:
        reason:
          type: string
          enum: [stale_cursor, compacted, epoch_changed]
        views:
          type: array
          items:
            $ref: '#/components/schemas/AffectedView'
        latest_event_id:
          type: string
    SessionListView:
      type: object
      required: [sessions, cursor]
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/SessionListItem'
        cursor:
          $ref: '#/components/schemas/CursorWindow'
    ConversationView:
      type: object
      required: [session_id, items, window, cursor]
      properties:
        session_id:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/ConversationItem'
        window:
          $ref: '#/components/schemas/ConversationWindow'
        cursor:
          $ref: '#/components/schemas/EventCursor'
    ConversationItem:
      oneOf:
        - $ref: '#/components/schemas/UserMessageItem'
        - $ref: '#/components/schemas/AssistantMessageItem'
        - $ref: '#/components/schemas/TurnMetaItem'
        - $ref: '#/components/schemas/AgentWorkItem'
        - $ref: '#/components/schemas/StatusItem'
      discriminator:
        propertyName: kind
        mapping:
          user_message: '#/components/schemas/UserMessageItem'
          assistant_message: '#/components/schemas/AssistantMessageItem'
          turn_meta: '#/components/schemas/TurnMetaItem'
          agent_work: '#/components/schemas/AgentWorkItem'
          status: '#/components/schemas/StatusItem'
    ConversationWindow:
      type: object
      required: [has_older, has_newer]
      properties:
        first_item_id:
          type: string
          nullable: true
        last_item_id:
          type: string
          nullable: true
        anchor_item_id:
          type: string
          nullable: true
        has_older:
          type: boolean
        has_newer:
          type: boolean
    MessagePart:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, image, file_reference]
        text:
          type: string
        data:
          type: object
          additionalProperties: true
    ConversationItemBase:
      type: object
      required: [id, kind, created_at, updated_at, revision, status, source_event_ids, source_event_ranges]
      properties:
        id:
          type: string
          description: Opaque conversation item id. Clients must pass it back unchanged.
        kind:
          type: string
          enum: [user_message, assistant_message, turn_meta, agent_work, status]
        turn_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, running, streaming, completed, failed, cancelled]
        source_event_ids:
          type: array
          items:
            type: string
        source_event_ranges:
          type: array
          items:
            $ref: '#/components/schemas/SourceEventRange'
    UserMessageItem:
      allOf:
        - $ref: '#/components/schemas/ConversationItemBase'
        - type: object
          required: [kind, text]
          properties:
            kind:
              type: string
              enum: [user_message]
            text:
              type: string
            parts:
              type: array
              items:
                $ref: '#/components/schemas/MessagePart'
    AssistantMessageItem:
      allOf:
        - $ref: '#/components/schemas/ConversationItemBase'
        - type: object
          required: [kind, text]
          properties:
            kind:
              type: string
              enum: [assistant_message]
            text:
              type: string
            parts:
              type: array
              items:
                $ref: '#/components/schemas/MessagePart'
    TurnMetaItem:
      allOf:
        - $ref: '#/components/schemas/ConversationItemBase'
        - type: object
          required: [kind, turn_id]
          properties:
            kind:
              type: string
              enum: [turn_meta]
    AgentWorkItem:
      allOf:
        - $ref: '#/components/schemas/ConversationItemBase'
        - type: object
          required: [kind, title, event_range, detail]
          properties:
            kind:
              type: string
              enum: [agent_work]
            title:
              type: string
            summary:
              type: string
            detail:
              $ref: '#/components/schemas/AgentWorkItemDetail'
            event_range:
              $ref: '#/components/schemas/EventRange'
    StatusItem:
      allOf:
        - $ref: '#/components/schemas/ConversationItemBase'
        - type: object
          required: [kind, text]
          properties:
            kind:
              type: string
              enum: [status]
            text:
              type: string
    AgentWorkItemDetail:
      $ref: '#/components/schemas/AgentWorkToolDetail'
    AgentWorkToolDetail:
      description: UI-safe projected agent work detail. Provider raw events remain available only through diagnostics APIs.
      oneOf:
        - $ref: '#/components/schemas/AgentWorkShellDetail'
        - $ref: '#/components/schemas/AgentWorkFileDetail'
        - $ref: '#/components/schemas/AgentWorkSearchDetail'
        - $ref: '#/components/schemas/AgentWorkFetchDetail'
        - $ref: '#/components/schemas/AgentWorkGenericDetail'
      discriminator:
        propertyName: type
    AgentWorkShellDetail:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [shell]
        command:
          type: string
        cwd:
          type: string
        output:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        streams:
          type: array
          description: Accumulated stream chunks for live shell output. UI may use this for expandable command logs.
          items:
            $ref: '#/components/schemas/AgentWorkShellStream'
        exit_code:
          type: integer
        error:
          type: string
    AgentWorkShellStream:
      type: object
      required: [stream_id]
      properties:
        stream_id:
          type: string
          description: Stable logical stream identifier, usually stdout or stderr.
        stream:
          type: string
          deprecated: true
          description: Legacy alias for stream_id.
        text:
          type: string
          description: Accumulated text for this stream.
        last_delta:
          type: string
          description: Last observed chunk for this stream.
        chunk_count:
          type: integer
          minimum: 0
        last_sequence:
          type: integer
        last_chunk_id:
          type: string
    AgentWorkFileDetail:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [read, edit, write]
        file_path:
          type: string
        path:
          type: string
          deprecated: true
        content:
          type: string
        old_string:
          type: string
        new_string:
          type: string
        unified_diff:
          type: string
    AgentWorkSearchDetail:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [search]
        query:
          type: string
        mode:
          type: string
          enum: [code, web, files, unknown]
        content:
          type: string
        num_files:
          type: integer
        num_matches:
          type: integer
        duration_ms:
          type: integer
        truncated:
          type: boolean
    AgentWorkFetchDetail:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [fetch]
        url:
          type: string
        prompt:
          type: string
        result:
          type: string
        code:
          type: integer
        code_text:
          type: string
        bytes:
          type: integer
        duration_ms:
          type: integer
    AgentWorkGenericDetail:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [browser, mcp_tool, dynamic_tool, sub_agent, image_generation, image_view, plan, plain_text, unknown, tool]
      additionalProperties: true
    PendingRequestsView:
      type: object
      required: [requests, cursor]
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/AgentRequest'
        cursor:
          $ref: '#/components/schemas/CursorWindow'
    DiffReviewView:
      type: object
      required: [diffs, cursor]
      properties:
        diffs:
          type: array
          items:
            $ref: '#/components/schemas/DiffSummary'
        cursor:
          $ref: '#/components/schemas/CursorWindow'
    TimelineProjection:
      type: object
      required: [items, cursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineItem'
        cursor:
          $ref: '#/components/schemas/CursorWindow'
    EventRange:
      type: object
      properties:
        from_event_id:
          type: string
        to_event_id:
          type: string
    SourceEventRange:
      type: object
      required: [epoch, from_event_id, to_event_id, from_seq, to_seq]
      properties:
        epoch:
          type: integer
        from_event_id:
          type: string
        to_event_id:
          type: string
        from_seq:
          type: integer
        to_seq:
          type: integer
    TimelineItem:
      type: object
      required: [id, kind, status, parts]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [message, tool, request, diff, warning, task]
        role:
          type: string
          enum: [user, assistant, system, tool]
        status:
          type: string
          enum: [pending, streaming, completed, failed, cancelled]
        parts:
          type: array
          items:
            $ref: '#/components/schemas/TimelinePart'
        event_range:
          $ref: '#/components/schemas/EventRange'
    DiagnosticTrace:
      type: object
      required: [session_id, spans, cursor]
      properties:
        session_id:
          type: string
        spans:
          type: array
          items:
            $ref: '#/components/schemas/DiagnosticTraceSpan'
        cursor:
          $ref: '#/components/schemas/CursorWindow'
    DiagnosticTraceSpan:
      type: object
      required: [id, kind, created_at]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [command, backend_raw, normalization, projection, warning, error]
        created_at:
          type: string
          format: date-time
        event_id:
          type: string
        title:
          type: string
        summary:
          type: string
        data:
          type: object
          additionalProperties: true
    TimelinePart:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
        type:
          type: string
          enum: [text, code, tool_call, tool_result, file_diff, image, warning]
        text:
          type: string
        data:
          type: object
          additionalProperties: true
    DiffSummary:
      type: object
      required: [file_path, status]
      properties:
        file_path:
          type: string
        status:
          type: string
          enum: [added, modified, deleted, renamed]
        additions:
          type: integer
        deletions:
          type: integer
    AgentRequest:
      type: object
      required: [id, session_id, type, status, created_at]
      properties:
        id:
          type: string
        session_id:
          type: string
        type:
          type: string
          enum: [permission, question, tool_call, tool_confirmation, custom_input, other]
        status:
          $ref: '#/components/schemas/RequestStatus'
        title:
          type: string
        description:
          type: string
        payload:
          type: object
          additionalProperties: true
        backend_ref:
          description: Backend-specific reference used by adapters, such as a Qoder pending action event id.
          type: object
          additionalProperties: true
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
    Backend:
      type: object
      required: [kind, status, display_name, capabilities]
      properties:
        kind:
          $ref: '#/components/schemas/BackendKind'
        status:
          type: string
          enum: [loading, available, unavailable, degraded, error]
        status_message:
          type: string
        snapshot_protocol:
          type: string
        fetched_at:
          type: string
          format: date-time
        display_name:
          type: string
        capabilities:
          type: object
          required: [streaming, cancel, permission_requests, structured_diff, session_agent_config]
          properties:
            streaming:
              type: boolean
            reasoning_stream:
              type: boolean
            agent_work:
              type: boolean
            multimodal_input:
              type: boolean
            cancel:
              type: boolean
            permission_requests:
              type: boolean
            structured_diff:
              type: boolean
            session_agent_config:
              type: boolean
              description: Whether clients may send session-level agent_config updates such as model, reasoning_effort, or permission_mode for this backend.
            session_persistence:
              type: boolean
            history_resume:
              type: boolean
            mcp_servers:
              type: boolean
        models:
          type: array
          items:
            $ref: '#/components/schemas/BackendModel'
        permission_modes:
          type: array
          items:
            $ref: '#/components/schemas/PermissionModeOption'
        features:
          type: array
          items:
            $ref: '#/components/schemas/BackendFeature'
        diagnostics:
          type: object
          additionalProperties: true
    BackendModel:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        reasoning_efforts:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningEffortOption'
        metadata:
          type: object
          additionalProperties: true
    ReasoningEffortOption:
      type: object
      required: [id, label]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
    PermissionModeOption:
      type: object
      required: [id, label]
      properties:
        id:
          $ref: '#/components/schemas/PermissionMode'
        label:
          type: string
        description:
          type: string
        is_default:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
    BackendFeature:
      oneOf:
        - $ref: '#/components/schemas/BackendToggleFeature'
        - $ref: '#/components/schemas/BackendSelectFeature'
      discriminator:
        propertyName: type
    BackendToggleFeature:
      type: object
      required: [type, id, label, default_value]
      properties:
        type:
          type: string
          const: toggle
        id:
          type: string
        label:
          type: string
        description:
          type: string
        default_value:
          type: boolean
        metadata:
          type: object
          additionalProperties: true
    BackendSelectFeature:
      type: object
      required: [type, id, label, options]
      properties:
        type:
          type: string
          const: select
        id:
          type: string
        label:
          type: string
        description:
          type: string
        default_value:
          type: string
          nullable: true
        options:
          type: array
          items:
            $ref: '#/components/schemas/ReasoningEffortOption'
        metadata:
          type: object
          additionalProperties: true
    BackendProbeResult:
      type: object
      required: [backend, status]
      properties:
        backend:
          $ref: '#/components/schemas/BackendKind'
        status:
          type: string
          enum: [loading, available, unavailable, degraded, error]
        message:
          type: string
    CommandAck:
      oneOf:
        - $ref: '#/components/schemas/AcceptedCommandAck'
        - $ref: '#/components/schemas/QueuedCommandAck'
        - $ref: '#/components/schemas/RejectedCommandAck'
      discriminator:
        propertyName: status
        mapping:
          accepted: '#/components/schemas/AcceptedCommandAck'
          queued: '#/components/schemas/QueuedCommandAck'
          rejected: '#/components/schemas/RejectedCommandAck'
    AcceptedCommandAck:
      type: object
      required: [status, command_id, session_id, cursor]
      properties:
        status:
          type: string
          const: accepted
        command_id:
          type: string
        session_id:
          type: string
        turn_id:
          type: string
        cursor:
          $ref: '#/components/schemas/EventCursor'
    QueuedCommandAck:
      type: object
      required: [status, command_id, session_id, queued_message_id, cursor]
      properties:
        status:
          type: string
          const: queued
        command_id:
          type: string
        session_id:
          type: string
        queued_message_id:
          type: string
        cursor:
          $ref: '#/components/schemas/EventCursor'
    RejectedCommandAck:
      type: object
      required: [status, code, message]
      properties:
        status:
          type: string
          const: rejected
        code:
          type: string
          enum:
            - session_not_found
            - session_closed
            - permission_blocked
            - backend_unavailable
            - duplicate_command
        message:
          type: string
        command_id:
          type: string
        session_id:
          type: string
        cursor:
          $ref: '#/components/schemas/EventCursor'
    AcceptedCommand:
      allOf:
        - $ref: '#/components/schemas/AcceptedCommandAck'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
