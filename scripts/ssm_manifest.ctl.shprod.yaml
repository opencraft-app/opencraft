defaults:
  region: ap-shanghai
  version_id: SSM_Current
  age_recipients:
  - age1q4s9kt3h5n0fgmez4kyp7tsahgjhuxpyeteye8lp46kqkyvardusctl258
  # 上海尚未接入 LLMGateway；这些键出现后按非敏感策略配置明文输出。
  optional_plaintext_keys:
  - CTL_LLMGATEWAY_BASE_URL
  - CTL_LLMGATEWAY_DEFAULT_BASE_URL
  - CTL_LLMGATEWAY_DEFAULT_MODEL_ID
  - CTL_LLMGATEWAY_NEW_USER_ALLOWLIST
  - CTL_LLMGATEWAY_RENEWAL_MIGRATION_ALLOWLIST
items:
- id: ctl-conf-common
  secret_name: mono-shprod-ctl-conf-common
  namespace: ctl
  kubernetes_resource_name: ctl-conf-common
  kubernetes_resource_kind: ConfigMap
  output_path: argocd/secrets/shprod/ctl-conf-common.sops.yaml
  string_key: server_conf.toml
  labels:
    app.kubernetes.io/name: ctl
    app.kubernetes.io/managed-by: argocd
  annotations:
    managed-by: export_ssm_to_sops.py
- id: ctl-conf-rewrite
  secret_name: mono-shprod-ctl-conf-rewrite
  namespace: ctl
  kubernetes_resource_name: ctl-conf-rewrite
  kubernetes_resource_kind: ConfigMap
  output_path: argocd/secrets/shprod/ctl-conf-rewrite.sops.yaml
  string_key: server_conf_rewrite.toml
  labels:
    app.kubernetes.io/name: ctl
    app.kubernetes.io/managed-by: argocd
  annotations:
    managed-by: export_ssm_to_sops.py
- id: ctl-runtime-secrets
  secret_name: mono-shprod-ctl-runtime-secrets
  namespace: ctl
  kubernetes_resource_name: ctl-runtime-secrets
  kubernetes_resource_kind: Secret
  output_path: argocd/secrets/shprod/ctl-runtime-secrets.sops.yaml
  secret_type: Opaque
  labels:
    app.kubernetes.io/name: ctl
    app.kubernetes.io/managed-by: argocd
  annotations:
    managed-by: export_ssm_to_sops.py
