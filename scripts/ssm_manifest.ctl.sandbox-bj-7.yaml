defaults:
  region: ap-beijing
  version_id: SSM_Current
  age_recipients:
    - age1q4s9kt3h5n0fgmez4kyp7tsahgjhuxpyeteye8lp46kqkyvardusctl258

# sandbox-bj-7 是 trade 联调专属环境（playground/sandbox-bj-7 分支 fork 自
# sandbox-bj-5 baseline）。本 manifest 跟踪 sandbox-bj-7 独立的 SSM 真源,
# 支持 v1.7.21 ctl `/v1/bundles` 调 `trade.InquiryBatch` 询价链路所需的
# `[adapter.trade]` 段配置（BUG-01 v1.7.27 修复）。
#
# 对偶范式参考: ssm_manifest.ctl.beijing-sandbox.yaml。
items:
  - id: ctl-conf-common
    secret_name: mono-sandbox-bj-7-ctl-conf-common
    namespace: lightvela-playground-sandbox-bj-7
    kubernetes_resource_name: ctl-conf-common
    kubernetes_resource_kind: ConfigMap
    output_path: argocd/secrets/sandbox-bj-7/ctl-conf-common.sops.yaml
    string_key: server_conf.toml
    labels:
      app.kubernetes.io/name: ctl
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py

  # v1.7.28 BUG-15 修复 (2026-05-21):
  # ctl-runtime-secrets 之前没有 SSM 真源, 用 sandbox-bj-5 fork 出来时的 dummy 占位,
  # 导致 trade -> ctl /internal/ctl/passes/complete 调用 401 (Bearer token 不匹配,
  # ctl 期望 'dummy' 但 trade 发 LIGHTCLAW_INTERNAL_SERVICE_TOKEN 真值).
  # SSM 现含 CTL_INTERNAL_TOKEN + CTL_TEST_AIGATEWAY_INTERNAL_TOKEN 与 trade 一致的
  # 真值; export_ssm_to_sops.py 跑后 sops yaml 同步.
  - id: ctl-runtime-secrets
    secret_name: mono-sandbox-bj-7-ctl-runtime-secrets
    namespace: lightvela-playground-sandbox-bj-7
    kubernetes_resource_name: ctl-runtime-secrets
    kubernetes_resource_kind: Secret
    output_path: argocd/secrets/sandbox-bj-7/ctl-runtime-secrets.sops.yaml
    secret_type: Opaque
    labels:
      app.kubernetes.io/name: ctl
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py
