# Tokyo is an independently credentialed environment. Beijing manifests define
# only the resource shape and required key names; no Beijing value may be copied
# into any SSM item declared here. Managed database administrator credentials
# stay out of application SSM payloads and Kubernetes workloads.
defaults:
