# SSM source for Credit in beijing-sandbox. Values are managed in Tencent Cloud
# SSM and exported to the encrypted Kubernetes Secret with export_ssm_to_sops.py.
defaults:
  region: ap-beijing
  version_id: latest
  age_recipients:
    - age1q4s9kt3h5n0fgmez4kyp7tsahgjhuxpyeteye8lp46kqkyvardusctl258

items:
  - id: credit-runtime-secrets
    secret_name: mono-beijing-sandbox-credit-runtime-secrets
    namespace: credit
    kubernetes_resource_name: credit-runtime-secrets
    kubernetes_resource_kind: Secret
    output_path: argocd/secrets/beijing-sandbox/credit-runtime-secrets.sops.yaml
    secret_type: Opaque
    required_keys:
      - LIGHTCLAW_INTERNAL_SERVICE_TOKEN
      - CREDIT_DB_PASSWORD
      - CREDIT_REDIS_PASSWORD
      - LLMGATEWAY_INTERNAL_SERVICE_TOKEN
    labels:
      app.kubernetes.io/name: credit
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py
