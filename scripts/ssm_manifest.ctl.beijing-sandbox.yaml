defaults:
  region: ap-beijing
  version_id: SSM_Current
  age_recipients:
    - age1q4s9kt3h5n0fgmez4kyp7tsahgjhuxpyeteye8lp46kqkyvardusctl258

items:
  - id: ctl-conf-rewrite
    secret_name: mono-beijing-sandbox-ctl-conf-rewrite
    namespace: ctl
    kubernetes_resource_name: ctl-conf-rewrite
    kubernetes_resource_kind: ConfigMap
    output_path: argocd/secrets/beijing-sandbox/ctl-conf-rewrite.sops.yaml
    string_key: server_conf_rewrite.toml
    labels:
      app.kubernetes.io/name: ctl
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py

  - id: ctl-runtime-secrets
    secret_name: mono-beijing-sandbox-ctl-runtime-secrets
    namespace: ctl
    kubernetes_resource_name: ctl-runtime-secrets
    kubernetes_resource_kind: Secret
    output_path: argocd/secrets/beijing-sandbox/ctl-runtime-secrets.sops.yaml
    secret_type: Opaque
    # These values describe routing/topology policy, not credentials. Keep them
    # reviewable in Git while SOPS encrypts all remaining keys individually.
    plaintext_keys:
      - CTL_LLMGATEWAY_BASE_URL
      - CTL_LLMGATEWAY_DEFAULT_BASE_URL
      - CTL_LLMGATEWAY_DEFAULT_MODEL_ID
      - CTL_LLMGATEWAY_NEW_USER_ALLOWLIST
      - CTL_LLMGATEWAY_RENEWAL_MIGRATION_ALLOWLIST
    labels:
      app.kubernetes.io/name: ctl
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py
