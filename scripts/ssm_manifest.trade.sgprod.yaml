# SSM manifest for trade · sgprod
#
# The general CloudLadder HMAC authenticates every Trade route that explicitly
# opts into CloudLadder, including Credit sendResource. Do not replace it with
# the historical Billing-only environment key.
defaults:
  region: ap-singapore
  version_id: SSM_Current
  age_recipients:
    - age1q4s9kt3h5n0fgmez4kyp7tsahgjhuxpyeteye8lp46kqkyvardusctl258

items:
  - id: trade-runtime-secrets
    secret_name: mono-sgprod-trade-runtime-secrets
    required_keys:
      - TRADE_DB_PASSWORD
      - LIGHTCLAW_INTERNAL_SERVICE_TOKEN
      - TRADE_TENCENT_BILLING_SIGNATURE_KEY
      - JIFEI_BILLING_APP_ID
      - JIFEI_BILLING_APP_SECRET
      - TRADE_CLOUDLADDER_HMAC_SECRET
    namespace: trade
    kubernetes_resource_name: trade-runtime-secrets
    kubernetes_resource_kind: Secret
    output_path: argocd/secrets/sgprod/trade-runtime-secrets.sops.yaml
    secret_type: Opaque
    labels:
      app.kubernetes.io/name: trade
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py
