# SSM manifest for trade · beijing-sandbox（迭代 9C）
#
# 用途: 由 scripts/export_ssm_to_sops.py 读 Tencent Cloud SSM secret
#       并加密落到 argocd/secrets/beijing-sandbox/trade-runtime-secrets.sops.yaml
#
# 操作步骤（运维 / 有 SSM 权限的人执行；AI 不能直接生成加密文件）：
#
#   1. 在 Tencent Cloud SSM 创建 secret:
#      Name:   mono-beijing-sandbox-trade-runtime-secrets
#      Region: ap-beijing
#      SecretString (JSON): {
#        "TRADE_DB_PASSWORD": "<新建 trade DB user 后的密码>",
#        "LIGHTCLAW_INTERNAL_SERVICE_TOKEN": "<复用 ctl/payment 相同的 token>",
#        "TRADE_TENCENT_BILLING_SIGNATURE_KEY": "<jifei 同事提供;9B 期不连 jifei 可暂填占位字符串如 'placeholder-not-used'>"
#      }
#
#   2. 本地执行（需 age 私钥能 decrypt argocd/secrets/.sops.yaml）:
#      python3 scripts/export_ssm_to_sops.py \
#        --manifest scripts/ssm_manifest.trade.beijing-sandbox.yaml \
#        --only trade-runtime-secrets
#
#   3. 校验:
#      python3 scripts/scan_secrets.py argocd/secrets/beijing-sandbox/trade-runtime-secrets.sops.yaml
#
#   4. commit 生成的 sops yaml + push（合入 master 后 CI promote 到 gitops）
#
# DB 准备（与 SSM 写入并行执行）:
#   - 在北京 cynosdb 共用实例 10.15.224.4:3306 上以 root 创建库 + user
#   - 详见 argocd/services/trade/beijing-sandbox/README.md "数据库准备" 章节
defaults:
  region: ap-beijing
  version_id: SSM_Current
  age_recipients:
    - age1q4s9kt3h5n0fgmez4kyp7tsahgjhuxpyeteye8lp46kqkyvardusctl258

items:
  - id: trade-runtime-secrets
    secret_name: mono-beijing-sandbox-trade-runtime-secrets
    namespace: trade
    kubernetes_resource_name: trade-runtime-secrets
    kubernetes_resource_kind: Secret
    output_path: argocd/secrets/beijing-sandbox/trade-runtime-secrets.sops.yaml
    secret_type: Opaque
    labels:
      app.kubernetes.io/name: trade
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py
