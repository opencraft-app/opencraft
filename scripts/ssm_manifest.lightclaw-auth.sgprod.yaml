defaults:
  region: ap-singapore
  version_id: auth-federation-sg-20260824-2035
  age_recipients:
  - age1q4s9kt3h5n0fgmez4kyp7tsahgjhuxpyeteye8lp46kqkyvardusctl258
items:
- id: lightclaw-auth-secrets
  secret_name: mono-sgprod-lightclaw-auth-secrets
  # Required real-name keys in SSM payload:
  # TENCENT_REALNAME_SECRET_ID, TENCENT_REALNAME_SECRET_KEY,
  # TENCENT_REALNAME_ENDPOINT, REALNAME_ENCRYPTION_KEY.
  # Google OAuth keys in SSM payload:
  # LIGHTCLAW_GOOGLE_CLIENT_ID, LIGHTCLAW_GOOGLE_CLIENT_SECRET,
  # LIGHTCLAW_GOOGLE_REDIRECT_URI.
  # Tencent Cloud shadow/payment credentials shared with Tokyo production:
  # SHADOW_SECRET_ID, SHADOW_SECRET_KEY,
  # SHADOW_BILLING_SECRET_ID, SHADOW_BILLING_SECRET_KEY,
  # CLOUDLADDER_SHADOW_HMAC_SECRET and SHADOW_TENCENT_CALLBACK_TOKEN remain
  # aligned with the SG CloudLadder runtime; LIGHTCLAW_INTERNAL_SERVICE_TOKEN
  # remains SG-specific.
  required_keys:
  - SHADOW_SECRET_ID
  - SHADOW_SECRET_KEY
  - SHADOW_BILLING_SECRET_ID
  - SHADOW_BILLING_SECRET_KEY
  - CLOUDLADDER_SHADOW_HMAC_SECRET
  - SHADOW_TENCENT_CALLBACK_TOKEN
  - LIGHTCLAW_INTERNAL_SERVICE_TOKEN
  - LIGHTCLAW_OIDC_SIGNING_KEYS_JSON
  - LIGHTCLAW_FEDERATION_AEAD_KEYS_JSON
  - LIGHTCLAW_FEDERATION_NONCE_KEY
  - LIGHTCLAW_FEDERATION_CLIENTS_JSON
  namespace: user-auth
  kubernetes_resource_name: lightclaw-auth-secrets
  kubernetes_resource_kind: Secret
  output_path: argocd/secrets/sgprod/lightclaw-auth-secrets.sops.yaml
  secret_type: Opaque
  labels:
    app.kubernetes.io/name: lightclaw-auth
    app.kubernetes.io/managed-by: argocd
  annotations:
    managed-by: export_ssm_to_sops.py
