defaults:
  region: ap-hongkong
  version_id: SSM_Current
  age_recipients:
    - age1replace_me_with_your_argocd_public_key

items:
  - id: argocd-sample-demo
    secret_name: mono-hk-devops-argocd-sample-demo-secret
    namespace: argocd-sample
    kubernetes_resource_name: argocd-sample-demo
    kubernetes_resource_kind: Secret
    output_path: argocd/secrets/beijing-sandbox/argocd-sample-demo.sops.yaml
    secret_type: Opaque
    labels:
      app.kubernetes.io/name: argocd-sample
      app.kubernetes.io/managed-by: argocd
    annotations:
      managed-by: export_ssm_to_sops.py
    # If SecretString is not JSON, set string_key and the raw value will be
    # written under this key in stringData.
    # string_key: DEMO_SECRET
