{
  "version": 1,
  "classes": {
    "canonical": "当前一方工程知识、服务入口和机器契约说明。",
    "product": "面向用户的产品文档及产品协同知识。",
    "work": "方案、计划、交接和会议等阶段性工作产物。",
    "generated": "由构建或内容管线生成，不直接编辑。",
    "context": "从正式知识派生、供 Agent 路由消费的短 Context Pack。",
    "evaluation": "评测数据、模型输出与评分证据，禁止进入运行时路由。",
    "archive": "仅供追溯、默认不代表当前事实。",
    "vendor": "第三方 vendored 内容，由上游负责正文。",
    "upstream": "以 subtree 或固定上游谱系维护的项目内容。"
  },
  "rules": [
    {"class": "evaluation", "patterns": ["docs/context/evaluation/**"]},
    {"class": "generated", "patterns": ["frontend/src/.fumadocs-content/**", "**/generated/**"]},
    {"class": "vendor", "patterns": ["**/vendor/**", "third_party/**"]},
    {"class": "archive", "patterns": ["docs/archive/**", "docs/**/archive/**", "docs/international-doc-stash/**"]},
    {"class": "work", "patterns": ["docs/superpowers/**", "docs/proposals/**", "docs/handover/**"]},
    {"class": "product", "patterns": ["frontend/src/content/docs/**", "wiki/**"]},
    {"class": "context", "patterns": ["docs/context/**"]},
    {"class": "upstream", "patterns": ["new-api/**", "velagw/**", "velalink/**", "cloudagent/research/hermes-rs/**", "cloudagent/wisp/juicefs/**", "cloudagent/wisp/litestream-upstream/**"]},
    {"class": "canonical", "patterns": ["*.md", "*.mdx", "*.rst", "**/*.md", "**/*.mdx", "**/*.rst"]}
  ],
  "link_check": {
    "include": ["docs/*.md", "docs/**/*.md", "docs/*.mdx", "docs/**/*.mdx", "AGENTS.md", "README.md"],
    "excluded_roots": [
      "docs/archive",
      "docs/ctl-design/archive",
      "docs/international-doc-stash",
      "docs/superpowers",
      "docs/proposals",
      "docs/handover"
    ],
    "excluded_patterns": [
      "docs/context/evaluation/runs/**",
      "docs/context/evaluation/*-report.md",
      "docs/context/evaluation/*-audit.md",
      "docs/context/evaluation/case-studies.md"
    ],
    "excluded_links": [
      {
        "source": "new-api/README.md",
        "target": "./docs/BT.md",
        "reason": "上游 README 引用的教程未包含在当前 subtree pin；本仓库不伪造上游正文。"
      }
    ]
  }
}
