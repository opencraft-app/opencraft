server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml
        text/css
        text/plain;

    location = /healthz-web {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /_expo/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /v1/ {
        proxy_pass http://chatserver-canary.dep.svc.cluster.local;
        proxy_http_version 1.1;

        # chatserver-canary currently trusts its existing DevCloud public
        # origin. This first-party proxy keeps the browser same-origin while
        # presenting that established origin to the unchanged backend.
        proxy_set_header Host 9.135.236.64;
        proxy_set_header Origin http://9.135.236.64;
        proxy_set_header Referer http://9.135.236.64/;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
