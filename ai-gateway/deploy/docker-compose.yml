services:
  ai-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports: ["18080:18080"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      portkey:
        condition: service_started
    environment:
      - CONFIG_PATH=/app/config.yaml
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - DATABASE_URL=root:${MYSQL_PASSWORD:-gateway_dev}@tcp(mysql:3306)/ai_gateway?charset=utf8mb4&parseTime=True&loc=UTC&time_zone=%27%2B00%3A00%27
      - REDIS_ADDR=redis:6379
      - ADMIN_TOKEN=${ADMIN_TOKEN}
      - REGISTRY_TOKEN=${REGISTRY_TOKEN:-}
    volumes:
      - ./config.yaml:/app/config.yaml:ro

  portkey:
    image: portkeyai/gateway:latest
    ports: ["8787:8787"]

  mysql:
    image: mysql:8.0
    ports: ["3306:3306"]
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ai_gateway
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-gateway_dev}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  gateway-dashboard:
    build:
      context: ../../gateway-dashboard
      dockerfile: Dockerfile
    ports: ["13000:13000"]
    environment:
      - GATEWAY_API_URL=http://ai-gateway:18080
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    depends_on:
      - ai-gateway

volumes:
  mysql_data:
