host: localhost:18080
info:
  contact: {}
  description: AI Gateway SaaS - OpenAI-compatible API proxy with token billing, rate
    limiting, and multi-provider support.
  title: AI Gateway API
  version: "1.0"
paths:
  /api/admin/api-keys:
    get:
      description: List all API keys across all users with pagination. Includes user
        phone and status mapping.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      - description: Search by key prefix or name
        in: query
        name: search
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated API key list across all users
          schema:
            $ref: '#/definitions/handler.SwaggerAllApiKeyListResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: List all API keys
      tags:
      - Admin - API Keys
  /api/admin/api-keys/{id}:
    delete:
      description: Revoke (deactivate) an API key by its ID. The key will no longer
        be usable for authentication.
      parameters:
      - description: API Key ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: API key revoked successfully
          schema:
            $ref: '#/definitions/handler.SwaggerMessageResponse'
        "400":
          description: Bad request - invalid key ID or revocation failed
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Revoke API key
      tags:
      - Admin - API Keys
  /api/admin/cache:
    delete:
      description: Truncates the entire response cache table
      produces:
      - application/json
      responses:
        "200":
          description: Cache cleared
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Clear all cache
      tags:
      - Admin - Cache
  /api/admin/cache/config:
    get:
      description: Returns the current semantic cache configuration
      produces:
      - application/json
      responses:
        "200":
          description: Current cache configuration
          schema:
            $ref: '#/definitions/handler.CacheConfigResponse'
      summary: Get cache config
      tags:
      - Admin - Cache
    put:
      consumes:
      - application/json
      description: Partially update semantic cache configuration (PATCH semantics)
      parameters:
      - description: Update cache config request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCacheConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated cache configuration
          schema:
            $ref: '#/definitions/handler.CacheConfigResponse'
      summary: Update cache config
      tags:
      - Admin - Cache
  /api/admin/cache/stats:
    get:
      description: Returns semantic cache hit/miss statistics
      produces:
      - application/json
      responses:
        "200":
          description: Cache statistics
          schema:
            $ref: '#/definitions/service.CacheStats'
      summary: Get cache stats
      tags:
      - Admin - Cache
  /api/admin/cache/test-embedding:
    post:
      description: Tests the configured embedding provider by generating a test embedding
      produces:
      - application/json
      responses:
        "200":
          description: Test result with latency
          schema:
            additionalProperties: true
            type: object
        "502":
          description: Embedding provider error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Test embedding provider
      tags:
      - Admin - Cache
  /api/admin/config/routing:
    get:
      description: Returns the current routing configuration including circuit breaker
        and strategy settings
      produces:
      - application/json
      responses:
        "200":
          description: Current routing configuration
          schema:
            $ref: '#/definitions/handler.RoutingConfigResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Get routing config
      tags:
      - Admin - Config
  /api/admin/config/routing/circuit-breaker:
    put:
      consumes:
      - application/json
      description: Update circuit breaker configuration (PATCH semantics)
      parameters:
      - description: Circuit breaker config (all fields optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateCircuitBreakerRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated circuit breaker config
          schema:
            $ref: '#/definitions/handler.CircuitBreakerConfigResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Update circuit breaker config
      tags:
      - Admin - Config
  /api/admin/config/routing/strategy:
    put:
      consumes:
      - application/json
      description: Update Portkey routing strategy configuration and default auto-selected
        model (PATCH semantics)
      parameters:
      - description: Strategy config (all fields optional)
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.UpdatePortkeyStrategyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated routing config
          schema:
            $ref: '#/definitions/handler.RoutingConfigResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "500":
          description: Internal error
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Update routing strategy
      tags:
      - Admin - Config
  /api/admin/model-mappings:
    get:
      description: 返回所有模型映射规则，包含关联的提供商信息
      produces:
      - application/json
      responses:
        "200":
          description: Mapping list with provider details
          schema:
            $ref: '#/definitions/handler.SwaggerModelMappingListResponse'
      summary: 列出所有模型映射
      tags:
      - Admin - Model Mappings
    post:
      consumes:
      - application/json
      description: 创建模型名到提供商的映射规则，支持通配符（如 "gpt-4*", "claude-*"）
      parameters:
      - description: Create mapping request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.createModelMappingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created mapping
          schema:
            $ref: '#/definitions/handler.SwaggerModelMapping'
        "400":
          description: Bad request - missing fields or provider not found
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: 创建模型映射
      tags:
      - Admin - Model Mappings
  /api/admin/model-mappings/{id}:
    delete:
      description: 删除指定的模型映射规则
      parameters:
      - description: Mapping ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Mapping deleted successfully
          schema:
            $ref: '#/definitions/handler.SwaggerMessageResponse'
        "400":
          description: Invalid mapping ID format
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: 删除模型映射
      tags:
      - Admin - Model Mappings
    put:
      consumes:
      - application/json
      description: 更新指定模型映射规则的属性（部分更新，仅非 nil 字段会被修改）
      parameters:
      - description: Mapping ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Update mapping request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.updateModelMappingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated mapping
          schema:
            $ref: '#/definitions/handler.SwaggerModelMapping'
        "400":
          description: Bad request - invalid ID or provider not found
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: 更新模型映射
      tags:
      - Admin - Model Mappings
  /api/admin/model-mappings/resolve:
    get:
      description: 输入模型名，返回匹配的提供商列表（API key 已脱敏）
      parameters:
      - description: Model name to resolve (e.g. gpt-4, claude-3-opus)
        in: query
        name: model
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Resolved providers for the model
          schema:
            $ref: '#/definitions/handler.SwaggerResolveModelResponse'
      summary: 测试模型路由
      tags:
      - Admin - Model Mappings
  /api/admin/plans:
    get:
      description: List all subscription plans with pagination, optionally filtered
        by active status
      parameters:
      - description: Filter active plans only
        in: query
        name: active
        type: boolean
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated plan list
          schema:
            $ref: '#/definitions/handler.SwaggerPlanListResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: List plans
      tags:
      - Admin - Plans
    post:
      consumes:
      - application/json
      description: Create a new subscription plan with rate limits, allowed models,
        and token multipliers
      parameters:
      - description: Create plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SwaggerCreatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Created plan
          schema:
            $ref: '#/definitions/handler.SwaggerPlan'
        "400":
          description: Bad request - missing required fields or invalid rate limits
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Create plan
      tags:
      - Admin - Plans
  /api/admin/plans/{id}:
    delete:
      description: Soft delete a subscription plan by setting is_active to false
      parameters:
      - description: Plan ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Plan deleted successfully
          schema:
            $ref: '#/definitions/handler.SwaggerMessageResponse'
        "400":
          description: Invalid plan ID format
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "404":
          description: Plan not found
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Delete plan
      tags:
      - Admin - Plans
    get:
      description: Get a subscription plan by ID with full details
      parameters:
      - description: Plan ID (UUID)
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Plan details
          schema:
            $ref: '#/definitions/handler.SwaggerPlan'
        "400":
          description: Invalid plan ID format
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "404":
          description: Plan not found
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Get plan
      tags:
      - Admin - Plans
    put:
      consumes:
      - application/json
      description: Update an existing subscription plan (partial update, only non-nil
        fields are updated)
      parameters:
      - description: Plan ID (UUID)
        in: path
        name: id
        required: true
        type: string
      - description: Update plan request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.SwaggerUpdatePlanRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated plan
          schema:
            $ref: '#/definitions/handler.SwaggerPlan'
        "400":
          description: Bad request - invalid rate limits or request body
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "404":
          description: Plan not found
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: Update plan
      tags:
      - Admin - Plans
  /api/admin/providers:
    get:
      description: List all registered LLM providers with pagination (API keys masked
        in response)
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size (max 100)
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Paginated provider list
          schema:
            $ref: '#/definitions/handler.SwaggerProviderListResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
        "401":
          description: Unauthorized - invalid admin token
          schema:
            $ref: '#/definitions/handler.SwaggerErrorResponse'
      summary: List providers
      tags:
      - Admin - Providers
    post:
      consumes:
      - application/json
      description: Register a new LLM provider. The API key will be encrypted at rest
        and masked in the response.
      parameters:
      - description: Create provider request
        in: body
        name: request
