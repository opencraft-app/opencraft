apiVersion: v1
kind: Namespace
metadata:
  name: ai-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ai-gateway
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-gateway-runtime-config
  namespace: ai-gateway
data:
  MYSQL_HOST: "REPLACE_AI_GATEWAY_MYSQL_HOST"
  MYSQL_PORT: "REPLACE_AI_GATEWAY_MYSQL_PORT"
  MYSQL_ROOT_USER: "root"
  AI_GATEWAY_DB: "ai_gateway"
  AI_GATEWAY_DB_USER: "ai_gateway"
  REDIS_ADDR: "REPLACE_AI_GATEWAY_REDIS_ADDR"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-model-internal
  namespace: ai-gateway
  annotations:
    kubernetes.io/ingress.class: qcloud
    kubernetes.io/ingress.existLbId: REPLACE_AI_GATEWAY_MODEL_INTERNAL_LB_ID
    ingress.cloud.tencent.com/modification-protection: "false"
    ingress.cloud.tencent.com/direct-access: "true"
spec:
  ingressClassName: qcloud
  rules:
    - http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
          - path: /v1beta
            pathType: Prefix
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
          - path: /
            pathType: Exact
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-backend
  namespace: ai-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gateway-backend
  template:
    metadata:
      labels:
        app: gateway-backend
        app.kubernetes.io/name: gateway-backend
      annotations:
        ai-gateway.clawhub.dev/redeploy-at: "REPLACE_AI_GATEWAY_DEPLOYED_AT"
    spec:
      nodeSelector:
        pool: REPLACE_AI_GATEWAY_NODE_POOL
      initContainers:
        - name: wait-db-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: ai-gateway-runtime-config
            - secretRef:
                name: ai-gateway-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${AI_GATEWAY_DB_USER}" \
                --password="${AI_GATEWAY_DB_PASSWORD}" \
                -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='${AI_GATEWAY_DB}' AND TABLE_NAME IN ('users','providers','schema_migrations')" | grep -qx '3'; do
                echo "waiting for ai-gateway schema"
                sleep 3
              done
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: gateway-backend
      volumes:
        - name: gateway-config
          configMap:
            name: gateway-backend-config
            items:
              - key: config.yaml
                path: config.yaml
      containers:
        - name: aigateway
          image: REPLACE_AI_GATEWAY_IMAGE
          imagePullPolicy: Always
          env:
            - name: CONFIG_PATH
              value: /app/deploy/config.yaml
            - name: PORTKEY_BASE_URL
              value: http://127.0.0.1:8787
            - name: REDIS_ADDR
              valueFrom:
                configMapKeyRef:
                  name: ai-gateway-runtime-config
                  key: REDIS_ADDR
          envFrom:
            - secretRef:
                name: ai-gateway-runtime-secrets
          ports:
            - name: http
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: gateway-config
              mountPath: /app/deploy/config.yaml
              subPath: config.yaml
        - name: portkey
          image: REPLACE_AI_GATEWAY_IMAGE
          imagePullPolicy: Always
          command:
            - node
            - /app/portkey/node_modules/@portkey-ai/gateway/build/start-server.js
            - --port
            - "8787"
            - --headless
          ports:
            - name: portkey
              containerPort: 8787
          readinessProbe:
            httpGet:
              path: /
              port: portkey
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: portkey
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-backend
  namespace: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: gateway-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-model-ingress
  namespace: ai-gateway
spec:
  type: NodePort
  selector:
    app: gateway-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: ai-gateway
spec:
  type: ClusterIP
  selector:
    app: gateway-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-internal
  namespace: ai-gateway
  annotations:
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: REPLACE_AI_GATEWAY_INTERNAL_SUBNET_ID
  labels:
    app: gateway-backend
spec:
  type: LoadBalancer
  selector:
    app: gateway-backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway-backend
  namespace: ai-gateway
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gateway-backend
  minReplicas: 3
  maxReplicas: 15
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
