{
  "id": "cloudladdergateway",
  "name": "Cloud Ladder Gateway",
  "kind": "service",
  "path": "cloudladdergateway",
  "owner": "wisp/mono2-maintainers",
  "lifecycle": "active",
  "domains": ["subscription-entitlements", "release-gitops"],
