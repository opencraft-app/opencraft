  "runtime": "Go 服务与 Starlark 规则",
  "interfaces": ["proto/cloudladdergateway/v1/gateway.proto", "HMAC/mTLS proxy", "webhook"],
  "dependencies": ["trade", "external-billing"],
  "source_docs": ["cloudladdergateway/README.md", "cloudladdergateway/AGENTS.md", "cloudladdergateway/proto/cloudladdergateway/v1/gateway.proto"],
  "agent_entry": "cloudladdergateway/AGENTS.md",
  "service_docs": "cloudladdergateway/docs/README.md",
  "deploy": ["cloudladdergateway/k8s", "argocd/services/cloudladdergateway"],
  "generated_paths": ["cloudladdergateway/gen"]
}
