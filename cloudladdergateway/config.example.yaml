        X-Shadow-Callback-Token: CLOUDLADDER_TENCENT_CALLBACK_TOKEN

  - alias: lightclaw-auth-krsbx
    env_prefix: CLOUDLADDERGATEWAY_TENCENTCLOUD_ACCOUNT_CALLBACK_KRSBX
    upstream:
      base_url: "https://api-sandbox-kr-1.lightclaw.tech"
      timeout: 10s
      allowed_methods: ["POST"]
