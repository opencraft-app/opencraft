        X-Shadow-Callback-Token: CLOUDLADDER_TENCENT_CALLBACK_KRSBX_TOKEN

  - alias: lightclaw-auth-shprod
    env_prefix: CLOUDLADDERGATEWAY_TENCENTCLOUD_ACCOUNT_CALLBACK_SHPROD
    upstream:
      base_url: "https://api.lightvela.com"
      timeout: 10s
      allowed_methods: ["POST"]
      headers_from_env:
        X-Shadow-Callback-Token: CLOUDLADDER_TENCENT_CALLBACK_TOKEN

auth:
  # **联调期全局禁用 HMAC**（按 .tmp/integration-plan-2026-05-18.md §10 Q-INT-14=a +
  # P4-followup=a 拍板）。lightvela trade → clgateway → jifei 联调链路本期不签名，
  # 用 IP 白名单 + VPC 隔离做边界。**prod 切换前必须改回 true** 并完成 trade 端
  # HMAC 客户端改造（pkg/clientauth 加 SignHTTPRequest helper + jifeiclient.do
  # 注入 X-CloudLadder-Caller / Timestamp / Signature 3 个 header）。
  #
  # 注：master 代码引入了 allow_unauthenticated 白名单机制（精细化签名管控），
  # 但联调期保持 enabled=false 简化路径，不依赖白名单。后续 prod 切换时再改为
  # enabled=true + 配置 allow_unauthenticated 列表。
  enabled: false
  timestamp_skew: 5m
  # 历史 trade/jifei 联调链路还没有接入 HMAC，继续允许无签名访问；
  # shadow → TencentCloud API 隧道不在此列表内，必须使用 shadow caller 签名。
  allow_unauthenticated:
    - sandbox-cn
    - billing-trade-cn-test
    - billing-trade-cn-pre
    - billing-trade-cn-prod
    - billing-trade-intl-test
    - billing-trade-intl-pre
    - billing-trade-intl-prod
    - jifei-test
    - tencentcloud-account-callback-bjsbx
    - tencentcloud-account-callback-krsbx
    - tencentcloud-account-callback-shprod
    - lightvela-cloudapi-bj
    - lightvela-cloudapi-sh
  callers:
    - id: shadow
      secret_env: CLOUDLADDER_SHADOW_HMAC_SECRET
      routes:
        - tcapi-account-cn-dev
        - tcapi-billing-cn-dev
        - tcapi-billing-intl-test
        - tcapi-account-cn-test
        - tcapi-cam-cn-test
        - tcapi-sts-cn-test
        - tcapi-account-cn-prod
        - tcapi-cam-cn-prod
        - tcapi-sts-cn-prod
        - shadow-account-test
        - shadow-cam-test
        - shadow-sts-test
        - shadow-account-prod
        - shadow-cam-prod
        - shadow-sts-prod
        - shadow-billing-api-test
    - id: lightvela-trade
      secret_env: CLOUDLADDER_TRADE_HMAC_SECRET
      routes:
        - jifei-test
        - jifei-prod
        - jifei-billing-apigw-test
        - jifei-billing-apigw-prod
        - dianshi-price
        - dianshi-order
        - tcapi-billing-trade-intl-test

audit:
  service_name: cloudladdergateway
  stdout: true
  otlp:
    enabled: false
    # endpoint_url: "http://otel-collector:4318/v1/logs"
    # endpoint: "otel-collector:4318"
    insecure: true
    timeout: 5s

external_routes:
  - path: /internal/tencentcloud/account
    methods: ["POST"]
    route_id: tencentcloud-account-callback-shprod
    upstream_path: /auth/internal/tencentcloud/account
    auth_code_routes:
      - prefix: "bjsbx."
        route_id: tencentcloud-account-callback-bjsbx
      - prefix: "krsbx."
        route_id: tencentcloud-account-callback-krsbx
      - prefix: "shprod."
        route_id: tencentcloud-account-callback-shprod
    user_id_routes:
      - user_id: "u4912323654"
        route_id: tencentcloud-account-callback-bjsbx
    user_id_prefix_routes:
      - prefix: "bjsbx_"
        route_id: tencentcloud-account-callback-bjsbx
      - prefix: "krsbx_"
        route_id: tencentcloud-account-callback-krsbx
  - path: /cloudapi
    methods: ["POST"]
    route_id: lightvela-cloudapi-sh
    upstream_path: /cloudapi
    header_routes:
      - name: X-TC-Region
        value: ap-beijing
        route_id: lightvela-cloudapi-bj
      - name: X-TC-Region
        value: ap-shanghai
        route_id: lightvela-cloudapi-sh

routes:
  - id: sandbox-cn
    description: "Only mirror requests explicitly marked as sandbox traffic."
    callers: ["payment"]
    condition: 'request.method in ["GET", "POST"] and request.attributes.get("env") == "sandbox"'
    upstream:
      base_url: "https://httpbin.org"
      timeout: 10s
      allowed_methods: ["GET", "POST"]
      headers:
        X-CloudLadder-Source: "cloudladdergateway"
    webhooks:
      - id: mirror-to-staging
        url: "https://staging.example.com"
        mode: async
        forward_original: true
        condition: 'response.status_code < 500'
        timeout: 5s
        headers:
          X-CloudLadder-Webhook: "mirror-to-staging"

  # ===========================================================================
  # bj-7 独有：billing-query-via-polaris 路由（payment → IDC billing.service via 北极星）
  # （cherry-pick 自 c9b75d8a4 v1.7.29，c8a0962a6 merge 时被误删，2026-06-05 恢复）
  # ===========================================================================
  - id: billing-query-via-polaris
    description: "Resolve IDC billing service through Polaris sidecar."
    callers: ["payment"]
    condition: 'request.method == "POST"'
    upstream:
      scheme: http
      polaris:
        service: "billing.service"
        namespace: "Production"
      timeout: 10s
      allowed_methods: ["POST"]

  - id: billing-trade-cn-test
    description: "Proxy Tencent billing trade domestic test environment."
    callers: ["payment"]
    condition: 'request.method == "POST"'
    upstream:
      backend: billing-trade-cn-test

  # ===========================================================================
  # lightvela trade → jifei CGW 测试环境出向路由（询价 / 下单链路，PDF §国内站
  # 测试环境-业务提测，bj-7 直连 IP 变体）
  #
  # **重要**：clgateway 部署在 TKEx 联调集群，**未注入 polaris-sidecar**，所以
  # 此路由**禁止**改写成走 polaris 的形式（如 `backend: billing-trade-cn-test`
  # 会触发 `query polaris sidecar: connection refused`）。必须使用 IP 直连 +
  # Host header 重写。具体的 IP / Host 配置封装在 `backends:` 段的 `jifei-test`
  # alias 内（base_url=http://9.139.137.40 + Host: trade.itd.com），路由层只
  # 引用 alias 即可。
  #
  # 历史教训：master 94359403 引入 backends 段后，c9b75d8a4 merge 时把这条路由
  # "统一"成了 backend: billing-trade-cn-test alias（指向 polaris），导致联调环境
  # trade 询价链路全部 400（polaris sidecar refused），2026-06-05 切回 IP 直连
  # 形式（通过专门的 jifei-test backend alias 承载 IP + Host）。
  # ===========================================================================
  - id: jifei-test
    description: "lightvela trade → jifei CGW 测试环境出向路由（询价 / 下单链路，bj-7 直连 IP 变体；通过 jifei-test backend alias 走 IP 直连，禁止改成 polaris 形式）"
    callers: ["lightvela-trade"]
    condition: 'request.method == "POST"'
    upstream:
      backend: jifei-test

  # ===========================================================================
  # lightvela trade → jifei 计费网关（apigateway.billing.*）销毁链路出向路由
  # （cherry-pick 自 604530a7c，c8a0962a6 merge 时被误删，2026-06-05 恢复）
  #
  # 设计稿真源：
  #   - .tmp/trade-pass-destroy-design.md §2.1 §3.6 §11-G（Q-D-SIG-1~6 全部已拍板）
  # 协议参考：
  #   - .tmp/jifei_pdf_txt/计费网关-接入和签名算法.txt §签名算法（HMAC-SHA256 4 步）
  #   - .tmp/jifei_pdf_txt/计费网关对外协议介绍.txt §地址 §请求协议
  #   - .tmp/jifei_pdf_txt/【订购关系建设】资源中心对外cgw接口定义.md §1.1（字段集）
  #
  # **协议层差异**（与 jifei-test 路由严格区分）：
  #   - jifei-test：base_url=http://9.139.137.40 + Host: trade.itd.com（IP 直连
  #     + Host header 重写），承载 getPrice / generateDeals / generateDealsAndPay
  #     / queryDealStatus 等 "qcloud.price.*" + "qcloud.purchase.*" 等 CGW 业务
  #     接口，**不签名**，走 IP 白名单（Q47/Q51）。clgateway TKEx 集群无
  #     polaris-sidecar，禁止改成 backend: billing-trade-cn-test alias 形式。
  #   - jifei-billing-apigw-test：test.api-gateway.billing.tencentyun.com / 9.139.137.40
  #     / **强制 HMAC-SHA256 签名**（auth.appid + auth.timestamp + auth.nonce
  #     + auth.signature 注入到 envelope.interface.auth；签名密钥
  #     BILLING_APP_ID + BILLING_SECRET_KEY 通过 SSM + sops 注入到 trade env）
  #     承载 "qcloud.operation.ModifyResourceStatus"（PRE_DESTROY / PRE_ISOLATE 等
  #     资源状态变更接口；本期销毁链路 PRE_DESTROY 使用）。
  #
  # **签名注入位置**（Q-D-SIG-1=B 拍板）：
  #   trade jifeiclient 在出向请求 envelope marshal 完成后注入 interface.auth 4 字段，
  #   clgateway 此路由仅做透明 forward_http 转发，**不感知签名 / 不持有密钥**。
  #
  # **bj-7 直连 IP 变体**：clgateway 部署在 TKEx 环境（非 K8s 集群），其内置 CoreDNS
  # 10.0.43.133 不识别 *.tencentyun.com 内网域名，且未注入北极星 sidecar，所以走直连
  # IP 9.139.137.40（PDF §地址 测试环境直连 VIP）+ Host header 重写
  # test.api-gateway.billing.tencentyun.com（依赖 v1.7.6 B0 commit 0b60ac3d 的
  # Header.Set("Host") → req.Host = ... 修复，master b79013ac 后由 setRequestHeader
  # helper 接管，效果等价）。
  #
  # 链路语义（联调期，beijing-sandbox-bj-7 测试集群）：
  #   trade.lightvela.ModifyResourceStatus
  #     调 http://clgateway.test.polaris:8095/v1/proxy/jifei-billing-apigw-test/resource-center/interface
  #     → clgateway 提取 *path = /resource-center/interface
  #     → joinURL(base_url=http://9.139.137.40, path=/resource-center/interface)
  #       = http://9.139.137.40/resource-center/interface
  #     → upstream.headers.Host 重写为 test.api-gateway.billing.tencentyun.com
  #     → 直连 IP 转发到 jifei 计费网关测试环境
  #
  # **moduleName=resource-center**（Q-D-SIG-2 拍板）：URL 中 /{moduleName}/interface 段
  # 由 jifei 计费侧分配。trade 侧通过 env JIFEI_BILLING_GATEWAY_URL 配置完整 URL（含
  # /resource-center/interface 后缀），clgateway 仅按 *path 透传，不内嵌 moduleName 假设。
  # ===========================================================================
  - id: jifei-billing-apigw-test
    description: "lightvela trade → jifei 计费网关测试环境出向路由（销毁链路 ModifyResourceStatus 走带签名的计费网关协议，bj-7 直连 IP 变体）"
    # callers 字段在 auth.enabled=false 时无实际效果；切换 HMAC 后由 auth.callers
    # 注册的 lightvela-trade 自动生效。
    callers: ["lightvela-trade"]
    condition: 'request.method == "POST"'
    upstream:
      # base_url：PDF §地址 测试环境直连 VIP 9.139.137.40（域名
      # test.api-gateway.billing.tencentyun.com 在 clgateway TKEx 集群 CoreDNS 不可解析）。
      base_url: "http://9.139.137.40"
      timeout: 10s
      allowed_methods: ["POST"]
      headers:
        # Host header 重写：计费网关侧根据 Host 路由到对应模块，**必须**带这个 Host。
        # PDF §地址：测试环境域名 = test.api-gateway.billing.tencentyun.com
        Host: "test.api-gateway.billing.tencentyun.com"

