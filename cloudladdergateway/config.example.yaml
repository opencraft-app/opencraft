  # ===========================================================================
  # jifei → clgateway → trade 入向回调统一路由
  # （2026-06-15：从 sandbox-bj-7 联调形态切换为 beijing-sandbox 北京 2 预发布形态。
  # tkexgz / tkexsg 现网 clgateway 不再回调 sandbox-bj-7，sandbox-bj-7 联调期已结束。）
  #
  # 设计稿真源：.tmp/integration-plan-2026-05-18.md §10 Q-INT-10
  #
  # 历史回顾（保留供溯源）：
  #   - v1.7.8 B2 起初用 trade ClusterIP 直连，因 clgateway 跨 VPC 不可达，触发
  #     BUG-05 跨集群网络限制；v1.7.28 起改造为公网 HTTPS 通道。
  #   - sandbox-bj-7 阶段 base_url 为 https://api-sandbox-bj-7.lightclaw.tech，
  #     ingress 通过 trade-nodeport NodePort Service 直连 trade Pod。
  #
  # 链路语义（北京 2 预发布 beijing-sandbox，2026-06-15 起）：
  #   jifei 调 http://clgateway.<env>.polaris:8095/v1/proxy/jifei-callback/trade/jifei/callback
  #     → clgateway 提取 *path = /trade/jifei/callback
  #     → joinURL(base_url=https://lightclaw.tech, path=/trade/jifei/callback)
  #       = https://lightclaw.tech/trade/jifei/callback
  #     → 公网 HTTPS POST 到 lightclaw-public Ingress（北京 2 预发布主域 LB, 443 TLS 入口）
  #     → Ingress / catchall → service-gateway-ingress NodePort（lightclaw-gateway ns）
  #     → service-gateway Pod 按 routes 配置 path-prefix 匹配 trade-jifei-callback
  #       (argocd/services/service-gateway/beijing-sandbox/config.yaml: prefix=/trade/jifei/callback,
  #        access=public, methods=[POST,OPTIONS], upstream=http://trade.trade.svc.cluster.local)
  #     → 反代到 trade.trade.svc.cluster.local:80（跨 ns ClusterIP DNS）
  #     → trade Pod containerPort 8080 (httpapi server.go POST /trade/jifei/callback)
  #     → dispatcher 按 envelope.interface.interfaceName 三段式
  #     → lightvela.pass.* 10 个真 handler 之一（含 transferResource 资源迁移回调）
  #
  # 为什么走公网 HTTPS（而非内网）：
  #   - clgateway 部署在另一个集群（tkexgz 广州 / tkexsg 新加坡），跨 VPC 不可
  #     达 beijing-sandbox 集群内网 ClusterIP
  #   - 走公网 HTTPS 是 K8s 集群跨 VPC 通信的标准方案
  #   - lightclaw.tech 主域 ingress 已 443 启用，/ catchall 已反代到 service-gateway
  #
  # 与 sandbox-bj-7 联调形态的两个关键差异：
  #   1) base_url 从 https://api-sandbox-bj-7.lightclaw.tech 切到 https://lightclaw.tech
  #      （主域 path 模式，与 service-gateway routes 同款 path-prefix 反代）
  #   2) 不再走 trade-nodeport NodePort 直连 trade Pod，而是 lightclaw-public 主域
  #      ingress / catchall → service-gateway → trade.trade.svc ClusterIP，更对齐
  #      未来 shprod 现网形态（trade 不暴露 NodePort，统一走 service-gateway 反代）
  #
  # **不重写 Host header**：jifei 调 clgateway 时带的 Host 是 clgateway 入口域名;
  # 转发出去后 Host 自然是 lightclaw.tech（HTTPS TLS SNI 必须匹配）.
  # ===========================================================================
  - id: jifei-callback
    description: "jifei → clgateway → trade 入向回调统一 endpoint（POST /trade/jifei/callback，dispatcher 路由 10 个 lightvela.pass.* 真 handler，含 transferResource）"
    # callers 字段在 auth.enabled=false 时无实际效果，预留 jifei 占位便于现网切换前
    # 启用 HMAC（届时需要 jifei 同事侧也持有同一份 caller secret，对 lightvela 侧的
    # 入向回调请求做签名）。
    callers: ["jifei"]
    condition: 'request.method == "POST"'
    upstream:
      base_url: "https://lightclaw.tech"
      timeout: 10s
      allowed_methods: ["POST"]
    # 按影子账号 uin 把回调改派到各开发者的测试环境。
    #
    # 背景：jifei 侧只能配一个固定回调地址，但测试期有多个开发者环境需要各自收到自己
    # 订单的回调。计费把回调统一打到本 route，网关按 interface.para.uin 分派；表里没有
    # 的 uin（现网 / 预发布的真实用户）走上面的 base_url 兜底。
    #
    # 前提：每个开发者环境必须持有**不同的**影子账号 uin。共用同一个 jifei 测试账号时
    # 无法区分，这一步必须先落实，否则本机制无效。
    #
    # 改派目标不存在时网关返 404 而不是回落到兜底 —— 静默回落会让回调发货到别人的环境，
    # 那是 2026-08-05 跨环境脏数据事故的成因。
    #
    # 新增开发者不需要重新构建镜像：在工作负载上加
    #   CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_UIN_ROUTES=<uin>=<route_id>,<uin>=<route_id>
    # 即可整表覆盖；对应的 <route_id> route 也可以用 _BASE_URL 覆盖指向该开发者环境。
    uin_routes: []

  # 开发者个人测试环境的回调落点池。
  #
  # 这里只占位，base_url 是黑洞（127.0.0.1:9），必须由工作负载上的
  #   CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_DEV_<N>_BASE_URL
  # 覆盖成该开发者环境的可达地址，再配合上面 jifei-callback 的 uin_routes 生效。
  #
  # 预留成池子是为了「新增开发者只改 gitops 的环境变量、不用重建镜像」——
  # 加人时挑一个空位改两个 env（uin 映射 + base_url）即可。
  - id: jifei-callback-dev-1
    description: "开发者个人测试环境回调落点 1（base_url 必须由 env 覆盖）"
    callers: ["jifei"]
    condition: 'request.method == "POST"'
    upstream:
      base_url: "http://127.0.0.1:9"
      timeout: 10s
      allowed_methods: ["POST"]

  - id: jifei-callback-dev-2
    description: "开发者个人测试环境回调落点 2（base_url 必须由 env 覆盖）"
    callers: ["jifei"]
    condition: 'request.method == "POST"'
    upstream:
      base_url: "http://127.0.0.1:9"
      timeout: 10s
      allowed_methods: ["POST"]

  - id: jifei-callback-dev-3
    description: "开发者个人测试环境回调落点 3（base_url 必须由 env 覆盖）"
    callers: ["jifei"]
    condition: 'request.method == "POST"'
    upstream:
      base_url: "http://127.0.0.1:9"
      timeout: 10s
      allowed_methods: ["POST"]

