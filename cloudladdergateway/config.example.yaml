addr: ":8095"
max_body_bytes: 10485760

transport:
  max_idle_conns: 100
  max_idle_conns_per_host: 20
  idle_conn_timeout: 90s
  response_header_timeout: 30s
  tls_handshake_timeout: 10s
  expect_continue_timeout: 1s

discovery:
  polaris:
    sidecar_url: "http://127.0.0.1:8080"
    cache_ttl: 30s
    stale_on_error: true

auth:
  enabled: true
  timestamp_skew: 5m
  callers:
    - id: payment
      secret_env: CLOUDLADDER_PAYMENT_HMAC_SECRET
      routes: ["sandbox-cn"]

audit:
  service_name: cloudladdergateway
  stdout: true
  otlp:
    enabled: false
    # endpoint_url: "http://otel-collector:4318/v1/logs"
    # endpoint: "otel-collector:4318"
    insecure: true
    timeout: 5s

routes:
  - id: sandbox-cn
    description: "Only mirror requests explicitly marked as sandbox traffic."
    callers: ["payment"]
    condition: 'request.method in ["GET", "POST"] and request.attributes.get("env") == "sandbox"'
    upstream:
      base_url: "https://httpbin.org"
      timeout: 10s
      allowed_methods: ["GET", "POST"]
      headers:
        X-CloudLadder-Source: "cloudladdergateway"
    webhooks:
      - id: mirror-to-staging
        url: "https://staging.example.com"
        mode: async
        forward_original: true
        condition: 'response.status_code < 500'
        timeout: 5s
        headers:
          X-CloudLadder-Webhook: "mirror-to-staging"

  - id: billing-query-via-polaris
    description: "Resolve IDC billing service through Polaris sidecar."
    callers: ["payment"]
    condition: 'request.method == "POST"'
    upstream:
      scheme: http
      polaris:
        service: "billing.service"
        namespace: "Production"
      timeout: 10s
      allowed_methods: ["POST"]
