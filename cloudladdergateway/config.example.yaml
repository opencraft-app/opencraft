addr: ":8095"
max_body_bytes: 10485760

transport:
  max_idle_conns: 100
  max_idle_conns_per_host: 20
  idle_conn_timeout: 90s
  response_header_timeout: 30s
  tls_handshake_timeout: 10s
  expect_continue_timeout: 1s

discovery:
  polaris:
    sidecar_url: "http://127.0.0.1:8080"
    cache_ttl: 30s
    stale_on_error: true

backends:
  - alias: billing-trade-cn-test
    upstream:
      scheme: http
      polaris:
        service: "cloud.drouter.http"
        namespace: "Test"
      timeout: 5s
      allowed_methods: ["POST"]
      headers:
        Host: "trade.itd.com"

  # ===========================================================================
  # jifei-test backend：lightvela trade → jifei CGW 测试环境出向
  #
  # **重要**：clgateway 部署在 TKEx 联调集群，**未注入 polaris-sidecar**，所以
  # 这条 backend **不能**像 billing-trade-cn-test 那样写 polaris 形式（会触发
  # `query polaris sidecar: connection refused`），必须用 base_url 直连 IP +
  # Host header 重写。
  #
  # base_url：PDF §国内站测试环境-业务提测 §测试请求示例 中给出的 jifei CGW 测试
  # 环境直连 IP **9.139.137.40**（同一份 PDF host 列写的是 11.141.38.133，但 curl
  # 示例与 jifei 实际联调对接均使用 9.139.137.40，以联调实际生效 IP 为准；域名
  # trade.itd.com 在 clgateway TKEx 集群 CoreDNS 不可解析，实测
  # `dial tcp: lookup trade.itd.com on 10.0.43.133:53: no such host`）。
  #
  # Host header 重写：jifei CGW 侧根据 Host 路由到对应模块，**必须**带 trade.itd.com。
  # 依赖 v1.7.6 B0 commit 0b60ac3d 的 Header.Set("Host") → req.Host = ... 修复
  # （master b79013ac 后由 setRequestHeader helper 接管）。
  # ===========================================================================
  - alias: jifei-test
    upstream:
      base_url: "http://9.139.137.40"
      timeout: 10s
      allowed_methods: ["POST"]
      headers:
        Host: "trade.itd.com"

  # ===========================================================================
  # jifei-prod backend：lightvela trade → jifei CGW 现网出向
  # （v1.7.31 新增，2026-06-12 北京 2 预发布 trade 接入现网计费 + 未来 shprod 共用）
  #
  # **设计取舍**（与 jifei-test 严格区分）：
  #   - jifei-test：内网域名 trade.itd.com 在 TKEx CoreDNS 不可解析 → 必须 IP
  #     直连 9.139.137.40 + Host header 重写。
  #   - jifei-prod：公网域名 trade.tencentyun.com 在 TKEx CoreDNS 公网 DNS 可
  #     解析（11.187.170.119 / 11.187.188.7，2026-06-12 本地 nslookup 验证），
  #     且 PDF §地址 国内现网 明确「不推荐域名方式访问，推荐使用北极星」+「现网
  #     不要配置VIP访问」——本 clgateway TKEx 集群无 polaris-sidecar 跑不了北极
  #     星，所以走 PDF 兜底允许的「域名 + Host header 透传」方式。
  #
  # 协议层语义：与 jifei-test 完全相同（不签名、走 IP/uin 白名单）；jifei 后台
  # 按 envelope 内 ownerUin/loginUin 自动判断国内/国际站路由（v1.0 设计稿
  # B-DEPLOY-3 派生约束 2）。trade 端鉴权由 envelope.ownerUin（真实影子账号 uin）
  # 提供，X-Qcloud-User-Id header 不再注入（trade-platform.env::JIFEI_CGW_X_QCLOUD_USER_ID=""）。
  #
  # PDF 真源：.tmp/jifei_pdf_txt/交易环境&公共参数.md §国内现网环境
  #   url = http://trade.tencentyun.com/interfaces/interface.php
  #   host = trade.tencentyun.com
  #   北极星 = Production/1333953:131072
  # ===========================================================================
  - alias: jifei-prod
    upstream:
      base_url: "http://trade.tencentyun.com"
      timeout: 10s
      allowed_methods: ["POST"]
      headers:
        # Host header 与 base_url 的域名一致，显式重写以保证 jifei CGW 侧按 Host
        # 路由到对应模块（PDF §地址 现网域名 = trade.tencentyun.com）。
        Host: "trade.tencentyun.com"

  # ===========================================================================
  # jifei-billing-apigw-prod backend：lightvela trade → jifei 计费网关现网出向
  # （销毁链路 ModifyResourceStatus / PRE_DESTROY / PRE_ISOLATE 等带 HMAC-SHA256
  # 签名的 qcloud.operation.* 接口现网通道，v1.7.31 新增）
  #
  # 与 jifei-billing-apigw-test 完全对偶：协议层 HMAC-SHA256 签名仍由 trade
  # jifeiclient 在 envelope.interface.auth 4 字段注入（Q-D-SIG-1=B 拍板），
  # clgateway 仅做透明 forward_http 转发，不感知签名 / 不持有密钥；签名密钥
  # JIFEI_BILLING_APP_ID / JIFEI_BILLING_APP_SECRET 由 trade pod 通过 SSM + sops
  # 注入 trade-runtime-secrets。**用户 2026-06-12 拍板：jifei 现网计费签名密钥
  # 与测试环境共用同一组真值**——所以 beijing-sandbox / sandbox-bj-7 的
  # trade-runtime-secrets 里 JIFEI_BILLING_APP_ID/SECRET 字面量相同。
  #
  # PDF 真源：.tmp/jifei_pdf_txt/计费网关对外协议介绍.txt §国内现网环境（控制台）
  #   url = http://apigateway.billing.tencentyun.com/{moduleName}/interface
  #   vip = 9.223.99.242（PDF："现网不要配置vip访问"——禁止用 VIP，必须走 L5/
  #         北极星/域名）
  #   host = apigateway.billing.tencentyun.com
  #   北极星 = Production/2141825:65536
  # ===========================================================================
  - alias: jifei-billing-apigw-prod
    upstream:
      base_url: "http://apigateway.billing.tencentyun.com"
      timeout: 10s
      allowed_methods: ["POST"]
      headers:
        # Host header 重写：jifei 计费网关侧按 Host 路由到对应模块；PDF §地址
        # 现网域名 = apigateway.billing.tencentyun.com。
        Host: "apigateway.billing.tencentyun.com"

  # ===========================================================================
  # dianshi-price backend：lightvela trade → 点石活动询价（v1.7.x 点石活动接入；
  # 2026-06-24 新增）
  #
  # 协议参考：.tmp/点石询价（activity_price.activity.get_price）
  # 设计稿：.tmp/dianshi-activity-bundle-design.md §5.7
  #
  # **解析形态**（与 jifei-prod 域名 + Host 不同）：直接走 polaris-mesh DNS
  # 反查 opc-activity-price 服务，无需 polaris-sidecar——跳板机 2026-06-23 实测
  # 9.208.245.238:36000 标准 DNS 9.208.232.145 即可解析
  # opc-activity-price.production.polaris → 30.188.120.72 / 21.1.105.235 等多 IP，
  # tkexgz / tkexsg 黑石 TKE 集群 Pod 与 IDC 同张内网，无需额外 igate。
  #
  # **v0.5 拍板**（设计稿 §11 Q3=a）：不写 Host header，由 polaris 服务名直接路由。
  # 联调期若点石侧网关报告 Host 校验失败再切到「写对外域名 Host」形态。
  # ===========================================================================
  - alias: dianshi-price
    upstream:
      base_url: "http://opc-activity-price.production.polaris:10006"
      timeout: 10s
      allowed_methods: ["POST"]

  # ===========================================================================
  # dianshi-order backend：lightvela trade → 点石活动下单（v1.7.x 点石活动接入；
  # 2026-06-24 新增）
  #
  # 协议参考：.tmp/点石下单（HTTP POST /activity_web/activity/do_goods）
  # 设计稿：.tmp/dianshi-activity-bundle-design.md §5.7
  #
  # 与 dianshi-price 同款 polaris-mesh DNS 形态；trade 端在
  # DIANSHI_ORDER_BASE_URL 里把 /activity_web/activity/do_goods path 写满，
  # clgateway 仅按 *path 拼到 base_url 后部即可（与 jifei-billing-apigw-prod
  # 把 /resource-center/interface 写到 trade 侧 env 同款思路）。
  # 鉴权（check_sum = md5(uin + "_" + activity_id + "_" + secret_key)）由
  # trade dianshiclient 注入 envelope.para.check_sum，clgateway 透明转发不感知。
  # ===========================================================================
  - alias: dianshi-order
    upstream:
      # 端口 80：点石下单接口（do_goods）实际监听端口与询价（10006）不同
      base_url: "http://opc-dianshi-activity.production.polaris:80"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: billing-trade-cn-pre
    upstream:
      scheme: http
      polaris:
        service: "jf_trade_pre"
        namespace: "Pre-release"
      timeout: 5s
      allowed_methods: ["POST"]
      headers:
        Host: "pre.trade.billing.woa.com"

  - alias: billing-trade-cn-prod
    upstream:
      scheme: http
      polaris:
        service: "1333953:131072"
        namespace: "Production"
      timeout: 5s
      allowed_methods: ["POST"]
      headers:
        Host: "trade.tencentyun.com"

  - alias: billing-trade-intl-test
    upstream:
      scheme: http
      polaris:
        service: "cloud.drouter.http"
        namespace: "Test"
      timeout: 5s
      allowed_methods: ["POST"]
      headers:
        Host: "test.trade-intl.billing.tencentyun.com"

  - alias: billing-trade-intl-pre
    upstream:
      scheme: http
      polaris:
        service: "jf_trade_pre_intl"
        namespace: "Pre-release"
      timeout: 5s
      allowed_methods: ["POST"]
      headers:
        Host: "pre.trade.intl.billing.woa.com"

  - alias: billing-trade-intl-prod
    upstream:
      scheme: http
      polaris:
        service: "jf_intl_trade"
        namespace: "Production"
      timeout: 5s
      allowed_methods: ["POST"]
      headers:
        Host: "intl.trade.tencentyun.com"

  - alias: tcapi-account-cn-dev
    upstream:
      base_url: "https://account.dev.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-billing-cn-dev
    upstream:
      base_url: "https://billing.dev.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-billing-intl-test
    upstream:
      base_url: "https://billing.test.tencentcloudapi.com"
      timeout: 15s
      allowed_methods: ["POST"]

  - alias: tcapi-billing-trade-intl-test
    upstream:
      base_url: "https://billing.test.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-account-cn-test
    upstream:
      base_url: "https://account.test.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-cam-cn-test
    upstream:
      base_url: "https://cam.test.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-sts-cn-test
    upstream:
      base_url: "https://sts.test.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-account-cn-prod
    upstream:
      base_url: "https://account.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-cam-cn-prod
    upstream:
      base_url: "https://cam.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: tcapi-sts-cn-prod
    upstream:
      base_url: "https://sts.tencentcloudapi.com"
      timeout: 10s
      allowed_methods: ["POST"]

  - alias: lightclaw-auth-bjsbx
    env_prefix: CLOUDLADDERGATEWAY_TENCENTCLOUD_ACCOUNT_CALLBACK_BJSBX
    upstream:
      base_url: "https://lightclaw.tech"
      timeout: 10s
      allowed_methods: ["POST"]
