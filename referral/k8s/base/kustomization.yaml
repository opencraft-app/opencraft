apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - manifests.yaml
configMapGenerator:
  - name: referral-config
    namespace: referral
    literals:
      - REFERRAL_ENABLED=false
      - REFERRAL_PROCESSING_ENABLED=false
      - REFERRAL_ADDR=:8080
      - MYSQL_HOST=REPLACE_REFERRAL_MYSQL_HOST
      - MYSQL_PORT=REPLACE_REFERRAL_MYSQL_PORT
      - REFERRAL_DB=referral
      - REFERRAL_DB_USER=referral
      - REFERRAL_PUBLIC_BASE_URL=REPLACE_REFERRAL_PUBLIC_BASE_URL
      - REFERRAL_PULSAR_URL=REPLACE_REFERRAL_PULSAR_URL
      - REFERRAL_PULSAR_TOPIC=REPLACE_REFERRAL_PULSAR_TOPIC
      - REFERRAL_PULSAR_DLQ_TOPIC=REPLACE_REFERRAL_PULSAR_DLQ_TOPIC
      - REFERRAL_PULSAR_SUBSCRIPTION=lightvela-referral-worker
      - CTL_INTERNAL_BASE_URL=REPLACE_REFERRAL_CTL_INTERNAL_BASE_URL
      - REFERRAL_WORKER_POLL_INTERVAL=10s
      - REFERRAL_WORKER_BATCH_SIZE=50
      - REFERRAL_REWARD_LEASE_DURATION=30s
      - REFERRAL_CAMPAIGN_ID=REPLACE_REFERRAL_CAMPAIGN_ID
      - REFERRAL_CAMPAIGN_NAME=REPLACE_REFERRAL_CAMPAIGN_NAME
      - REFERRAL_CAMPAIGN_STATUS=active
      - REFERRAL_CAMPAIGN_STARTS_AT=REPLACE_REFERRAL_CAMPAIGN_STARTS_AT
      - REFERRAL_CAMPAIGN_ENDS_AT=REPLACE_REFERRAL_CAMPAIGN_ENDS_AT
      - REFERRAL_INVITER_CREDIT=500
      - REFERRAL_INVITEE_CREDIT=500
      - REFERRAL_VESTING_DAYS=0
      - REFERRAL_PENDING_TTL_DAYS=90
      - REFERRAL_MAX_REWARDS_PER_INVITER=50
      - REFERRAL_BUDGET_CREDIT=REPLACE_REFERRAL_BUDGET_CREDIT
