apiVersion: v1
kind: Namespace
metadata:
  name: referral
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: referral
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: referral
  namespace: referral
  labels:
    app: referral
spec:
  replicas: 2
  selector:
    matchLabels:
      app: referral
  template:
    metadata:
      labels:
        app: referral
    spec:
      nodeSelector:
        pool: REPLACE_REFERRAL_NODE_POOL
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: referral
      containers:
        - name: referral
          image: REPLACE_REFERRAL_IMAGE
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: referral-config
            - secretRef:
                name: referral-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 48Mi
            limits:
              cpu: 250m
              memory: 192Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: referral-worker
  namespace: referral
  labels:
    app: referral-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: referral-worker
  template:
    metadata:
      labels:
        app: referral-worker
    spec:
      nodeSelector:
        pool: REPLACE_REFERRAL_NODE_POOL
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: referral-worker
      containers:
        - name: referral-worker
          image: REPLACE_REFERRAL_IMAGE
          imagePullPolicy: Always
          command: ["/usr/local/bin/referral-worker"]
          envFrom:
            - configMapRef:
                name: referral-config
            - secretRef:
                name: referral-runtime-secrets
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: referral
  namespace: referral
  labels:
    app: referral
spec:
  selector:
    app: referral
  ports:
    - name: http
      port: 80
      targetPort: http
