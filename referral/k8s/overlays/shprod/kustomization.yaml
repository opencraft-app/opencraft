apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: ConfigMap
      name: referral-config
    patch: |-
      - op: replace
        path: /data/REFERRAL_ENABLED
        value: "true"
      - op: replace
        path: /data/REFERRAL_PROCESSING_ENABLED
        value: "true"
      - op: replace
        path: /data/MYSQL_HOST
        value: "10.15.192.13"
      - op: replace
        path: /data/MYSQL_PORT
        value: "3306"
      - op: replace
        path: /data/REFERRAL_DB
        value: "lightvela_referral"
      - op: replace
        path: /data/REFERRAL_PUBLIC_BASE_URL
        value: "https://lightvela.com"
      - op: replace
        path: /data/REFERRAL_PULSAR_URL
        value: "http://pulsar-vje938a9pgq4.eap-tiu5h8jq.tdmq-pulsar.ap-sh.qcloud.tencenttdmq.com:8080"
      - op: replace
        path: /data/REFERRAL_PULSAR_TOPIC
        value: "persistent://pulsar-vje938a9pgq4/lightvela-ref/lightvela.referral.events.v1"
      - op: replace
        path: /data/REFERRAL_PULSAR_DLQ_TOPIC
        value: "persistent://pulsar-vje938a9pgq4/lightvela-ref/lightvela.referral.events.v1-dlq"
      - op: replace
        path: /data/CTL_INTERNAL_BASE_URL
        value: "http://ctl-api.ctl.svc.cluster.local"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_ID
        value: "shanghai-launch-2026-09"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_NAME
        value: "好友邀请奖励"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_STATUS
        value: "active"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_STARTS_AT
        value: "2026-09-16T00:00:00+08:00"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_ENDS_AT
        value: "2026-12-31T23:59:59+08:00"
      - op: replace
        path: /data/REFERRAL_BUDGET_CREDIT
        value: "100000"
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector/pool
        value: "general-shprod"
  - target:
      kind: Deployment
      name: referral-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
