apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: ConfigMap
      name: referral-config
    patch: |-
      - op: replace
        path: /data/REFERRAL_ENABLED
        value: "true"
      - op: replace
        path: /data/REFERRAL_PROCESSING_ENABLED
        value: "false"
      - op: replace
        path: /data/MYSQL_HOST
        value: "10.15.224.4"
      - op: replace
        path: /data/MYSQL_PORT
        value: "3306"
      - op: replace
        path: /data/REFERRAL_PUBLIC_BASE_URL
        value: "https://lightclaw.pages.dev"
      - op: replace
        path: /data/REFERRAL_PULSAR_URL
        value: "http://pulsar-n57ovqb7r7gv.eap-vle3kjgi.tdmq.ap-bj.qcloud.tencenttdmq.com:8080"
      - op: replace
        path: /data/REFERRAL_PULSAR_TOPIC
        value: "persistent://pulsar-n57ovqb7r7gv/lightvela-ref/lightvela.referral.events.v1"
      - op: replace
        path: /data/REFERRAL_PULSAR_DLQ_TOPIC
        value: "persistent://pulsar-n57ovqb7r7gv/lightvela-ref/lightvela.referral.events.v1-dlq"
      - op: replace
        path: /data/CTL_INTERNAL_BASE_URL
        value: "http://ctl-api.ctl.svc.cluster.local"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_ID
        value: "beijing-pilot-2026-09"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_NAME
        value: "邀请返利内测"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_STARTS_AT
        value: "2026-09-15T00:00:00+08:00"
      - op: replace
        path: /data/REFERRAL_CAMPAIGN_ENDS_AT
        value: "2026-10-15T00:00:00+08:00"
      - op: replace
        path: /data/REFERRAL_BUDGET_CREDIT
        value: "100000"
  - target:
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/nodeSelector/pool
        value: "general-bj8"
  - target:
      kind: Deployment
      name: referral-worker
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
