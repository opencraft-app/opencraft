<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OpenCraft Bot 手机</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <main id="view"></main>
  <section id="office" hidden aria-label="办公室">
    <header class="ofbar"><button class="ic" id="ofback" data-do="view" data-id="list" aria-label="返回"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg></button><div class="ht"><h1>办公室</h1><p>所有人在一起，箭头是谁能找谁</p></div><button id="whole" class="btn sm" hidden>看全景</button></header>
    <div class="stage"><canvas id="stage" aria-label="办公室三维画面，点一个人看他能找谁"></canvas><div id="labels" aria-hidden="true"></div><div id="fail" hidden><b>这台设备打不开三维画面</b><span>同样的信息都在列表里。</span><button class="btn sm" data-do="view" data-id="list">回到列表</button></div></div>
    <div id="card" aria-live="polite"></div>
  </section>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="scene.js"></script>
<script src="app.js"></script>
</body>
</html>
