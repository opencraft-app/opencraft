.tabs button { flex: none; font: inherit; color: var(--ink-2); cursor: pointer; min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid var(--line); background: var(--card); white-space: nowrap; }

.tabs button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.frame { position: relative; border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: var(--stage); aspect-ratio: 4 / 3; max-width: 100%; }

@media (max-width: 640px) { .frame { aspect-ratio: 1 / 1; } .notes { grid-template-columns: 1fr; } h1 { font-size: 21px; } }
