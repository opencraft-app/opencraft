apiVersion: kro.run/v1alpha1
kind: ResourceGraphDefinition
metadata:
  name: llmsets.llmgateway.io
spec:
  schema:
    apiVersion: v1alpha1
    group: llmgateway.io
    kind: LLMSet
    scope: Namespaced
    spec:
      name: string
      newapiImage: string | default="calciumion/new-api@sha256:3125e24f119fa5e767563226a5208f2902b3faed3f27b69ea275b32c9f04a066"
      replicas: integer | default=1
      mysqlImage: string | default="mysql:8.4"
      redisImage: string | default="redis:7-alpine"
      mysqlRootPassword: string | default="123456"
      redisPassword: string | default="123456"
      databaseName: string | default="new-api"
      sessionSecret: string | default="llmgateway-local-session-secret"
    status:
      mysqlService: ${mysqlService.metadata.name}
      redisService: ${redisService.metadata.name}
      newapiService: ${newapiService.metadata.name}
      newapiClusterIP: ${newapiService.spec.clusterIP}
      availableReplicas: ${newapiDeployment.status.availableReplicas}
  resources:
    - id: mysqlService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-mysql
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-mysql
            app.kubernetes.io/component: mysql
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          selector:
            app.kubernetes.io/name: ${schema.spec.name}-mysql
          ports:
            - name: mysql
              protocol: TCP
              port: 3306
              targetPort: 3306

    - id: mysqlDeployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-mysql
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-mysql
            app.kubernetes.io/component: mysql
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}-mysql
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.spec.name}-mysql
                app.kubernetes.io/component: mysql
                app.kubernetes.io/part-of: llmgateway-kro-demo
            spec:
              containers:
                - name: mysql
                  image: ${schema.spec.mysqlImage}
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: MYSQL_ROOT_PASSWORD
                      value: ${schema.spec.mysqlRootPassword}
                    - name: MYSQL_DATABASE
                      value: ${schema.spec.databaseName}
                  ports:
                    - name: mysql
                      containerPort: 3306
                  readinessProbe:
                    exec:
                      command:
                        - sh
                        - -c
                        - mysqladmin ping -h 127.0.0.1 -uroot -p${schema.spec.mysqlRootPassword} --silent
                    initialDelaySeconds: 10
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 30
                  volumeMounts:
                    - name: mysql-data
                      mountPath: /var/lib/mysql
              volumes:
                - name: mysql-data
                  emptyDir:
                    sizeLimit: 512Mi

    - id: redisService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-redis
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-redis
            app.kubernetes.io/component: redis
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          selector:
            app.kubernetes.io/name: ${schema.spec.name}-redis
          ports:
            - name: redis
              protocol: TCP
              port: 6379
              targetPort: 6379

    - id: redisDeployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-redis
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-redis
            app.kubernetes.io/component: redis
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          replicas: 1
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}-redis
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.spec.name}-redis
                app.kubernetes.io/component: redis
                app.kubernetes.io/part-of: llmgateway-kro-demo
            spec:
              containers:
                - name: redis
                  image: ${schema.spec.redisImage}
                  imagePullPolicy: IfNotPresent
                  command:
                    - redis-server
                    - --requirepass
                    - ${schema.spec.redisPassword}
                  ports:
                    - name: redis
                      containerPort: 6379
                  readinessProbe:
                    exec:
                      command:
                        - redis-cli
                        - -a
                        - ${schema.spec.redisPassword}
                        - ping
                    initialDelaySeconds: 3
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 30

    - id: newapiService
      template:
        apiVersion: v1
        kind: Service
        metadata:
          name: ${schema.spec.name}-newapi
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-newapi
            app.kubernetes.io/component: new-api
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          selector:
            app.kubernetes.io/name: ${schema.spec.name}-newapi
          ports:
            - name: http
              protocol: TCP
              port: 3000
              targetPort: 3000

    - id: newapiDeployment
      template:
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: ${schema.spec.name}-newapi
          labels:
            app.kubernetes.io/name: ${schema.spec.name}-newapi
            app.kubernetes.io/component: new-api
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          replicas: ${schema.spec.replicas}
          selector:
            matchLabels:
              app.kubernetes.io/name: ${schema.spec.name}-newapi
          template:
            metadata:
              labels:
                app.kubernetes.io/name: ${schema.spec.name}-newapi
                app.kubernetes.io/component: new-api
                app.kubernetes.io/part-of: llmgateway-kro-demo
            spec:
              initContainers:
                - name: wait-for-dependencies
                  image: busybox:1.36
                  imagePullPolicy: IfNotPresent
                  command:
                    - sh
                    - -c
                    - |
                      until nc -z ${schema.spec.name}-mysql 3306; do echo "waiting for mysql"; sleep 2; done
                      until nc -z ${schema.spec.name}-redis 6379; do echo "waiting for redis"; sleep 2; done
              containers:
                - name: newapi
                  image: ${schema.spec.newapiImage}
                  imagePullPolicy: IfNotPresent
                  args:
                    - --log-dir
                    - /app/logs
                  env:
                    - name: SQL_DSN
                      value: root:${schema.spec.mysqlRootPassword}@tcp(${schema.spec.name}-mysql:3306)/${schema.spec.databaseName}?parseTime=true&loc=Local
                    - name: REDIS_CONN_STRING
                      value: redis://:${schema.spec.redisPassword}@${schema.spec.name}-redis:6379
                    - name: SESSION_SECRET
                      value: ${schema.spec.sessionSecret}
                    - name: TZ
                      value: Asia/Shanghai
                    - name: GLOBAL_API_RATE_LIMIT_ENABLE
                      value: "false"
                    - name: GLOBAL_WEB_RATE_LIMIT_ENABLE
                      value: "false"
                    - name: CRITICAL_RATE_LIMIT_ENABLE
                      value: "false"
                    - name: SEARCH_RATE_LIMIT_ENABLE
                      value: "false"
                    - name: BATCH_UPDATE_ENABLED
                      value: "true"
                    - name: NODE_NAME
                      value: ${schema.spec.name}
                  ports:
                    - name: http
                      containerPort: 3000
                  readinessProbe:
                    httpGet:
                      path: /api/status
                      port: http
                    initialDelaySeconds: 10
                    periodSeconds: 5
                    timeoutSeconds: 3
                    failureThreshold: 60
                  volumeMounts:
                    - name: newapi-logs
                      mountPath: /app/logs
              volumes:
                - name: newapi-logs
                  emptyDir: {}
