apiVersion: v1
kind: Secret
metadata:
  name: llmgateway-control-admin
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-control
    app.kubernetes.io/part-of: llmgateway-kro-demo
type: Opaque
stringData:
  token: test-cluster-token
  username: cluster-admin
  password: test-local-password
  internal-token: test-internal-token
  set-root-username: set-root
  set-root-password: test-local-password
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: llmgateway-mysql-init
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-mysql
    app.kubernetes.io/part-of: llmgateway-kro-demo
data:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS `llmgateway`;
---
apiVersion: v1
kind: Service
metadata:
  name: llmgateway-mysql
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-mysql
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  selector:
    app.kubernetes.io/name: llmgateway-mysql
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-mysql
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-mysql
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmgateway-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmgateway-mysql
        app.kubernetes.io/component: mysql
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "test-local-password"
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -ptest-local-password --silent
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: mysql-data
          emptyDir:
            sizeLimit: 1Gi
        - name: mysql-init
          configMap:
            name: llmgateway-mysql-init
---
apiVersion: v1
kind: Service
metadata:
  name: llmgateway-control
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-control
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  selector:
    app.kubernetes.io/name: llmgateway-control
  ports:
    - name: http
      protocol: TCP
      port: 18080
      targetPort: 18080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-control
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-control
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmgateway-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmgateway-control
        app.kubernetes.io/component: control-plane
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until nc -z llmgateway-mysql 3306; do echo "waiting for llmgateway mysql"; sleep 2; done
      containers:
        - name: control
          image: llmgateway:local
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/llmgateway-control
          env:
            - name: PORT
              value: "18080"
            - name: LLMGATEWAY_SQL_DSN
              value: root:test-local-password@tcp(llmgateway-mysql:3306)/llmgateway?parseTime=true&loc=UTC&charset=utf8mb4
            - name: LLMGATEWAY_KEY_ROUTE_CACHE_REDIS_URL
              value: redis://:test-local-password@shared-redis-a:6379/0
            - name: LLMGATEWAY_TRAFFIC_BASE_URL
              value: http://llmgateway-traffic:18080
            - name: LLMGATEWAY_TRAFFIC_PROBE_TIMEOUT
              value: 120s
            - name: CLUSTER_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: username
            - name: CLUSTER_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: password
            - name: CLUSTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: token
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: internal-token
            - name: NEWAPI_SET_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: set-root-username
            - name: NEWAPI_SET_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: set-root-password
            - name: LLMGATEWAY_DRAIN_WAIT
              value: 10s
            - name: LLMGATEWAY_SHUTDOWN_TIMEOUT
              value: 30s
          ports:
            - name: http
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
