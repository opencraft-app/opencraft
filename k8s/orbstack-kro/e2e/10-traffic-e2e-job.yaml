apiVersion: v1
kind: ConfigMap
metadata:
  name: llmgateway-traffic-e2e
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-traffic-e2e
    app.kubernetes.io/part-of: llmgateway-kro-demo
data:
  main.go: |
    package main

    import (
      "bytes"
      "encoding/json"
      "fmt"
      "io"
      "net/http"
      "net/url"
      "os"
      "strings"
      "time"
    )

    type apiEnvelope struct {
      Success bool            `json:"success"`
      Message string          `json:"message"`
      Data    json.RawMessage `json:"data"`
    }

    type managedSet struct {
      ID          string `json:"id"`
      Status      string `json:"status"`
      Setup       bool   `json:"setup"`
      AdminUserID int64  `json:"admin_user_id"`
    }

    type bundleState struct {
      SetID              string `json:"set_id"`
      Status             string `json:"status"`
      AppliedFingerprint string `json:"applied_fingerprint"`
    }

    type keyData struct {
      ExternalKey    string `json:"external_key"`
      SetID          string `json:"set_id"`
      UpstreamUserID int64  `json:"upstream_user_id"`
    }

    type userState struct {
      SetID          string `json:"set_id"`
      UpstreamUserID int64  `json:"upstream_user_id"`
    }

    type chatResponse struct {
      Model string `json:"model"`
    }

    var (
      controlURL  = strings.TrimRight(env("LLMGATEWAY_CONTROL_URL", "http://llmgateway-control:18080"), "/")
      trafficURL  = strings.TrimRight(env("LLMGATEWAY_TRAFFIC_URL", "http://llmgateway-traffic:18080"), "/")
      mockURL     = strings.TrimRight(env("LLMGATEWAY_E2E_MOCK_URL", "http://llmgateway-e2e-mock-openai:8080"), "/")
      adminToken  = os.Getenv("LLMGATEWAY_ADMIN_TOKEN")
      model       = env("LLMGATEWAY_E2E_MODEL", "llmgw-k8s-chat")
      upstreamKey = env("LLMGATEWAY_E2E_UPSTREAM_KEY", "sk-k8s-e2e")
      bundleID    = env("LLMGATEWAY_E2E_BUNDLE_ID", "k8s-e2e-openai")
      userID      = env("LLMGATEWAY_E2E_USER_ID", "k8s-e2e-user-"+fmt.Sprint(time.Now().Unix()))
      requiredSetPrefix = strings.TrimSpace(os.Getenv("LLMGATEWAY_E2E_REQUIRED_SET_PREFIX"))
    )

    func main() {
      must("llmgateway-control ready", waitReady(controlURL+"/readyz"))
      must("llmgateway-traffic ready", waitReady(trafficURL+"/readyz"))
      must("mock-openai ready", waitReady(mockURL+"/health"))

      sets := activeSets()
      upsertBundle()

      states := make([]bundleState, 0, len(sets))
      for _, set := range sets {
        states = append(states, applyBundle(set.ID))
      }

      key := createKey()
      grantTestQuota(key)
      response := chatWithControlPlanePropagationRetry(key.ExternalKey)

      syncedSets := make([]string, 0, len(states))
      for _, state := range states {
        syncedSets = append(syncedSets, state.SetID)
      }
      printJSON(struct {
        OK         bool     `json:"ok"`
        BundleID   string   `json:"bundle_id"`
        UserID     string   `json:"user_id"`
        RoutedSet  string   `json:"routed_set"`
        SetCount   int      `json:"set_count"`
        SyncedSets []string `json:"synced_sets"`
        ChatModel  string   `json:"chat_model"`
      }{
        OK:         true,
        BundleID:   bundleID,
        UserID:     userID,
        RoutedSet:  key.SetID,
        SetCount:   len(sets),
        SyncedSets: syncedSets,
        ChatModel:  response.Model,
      })
    }

    func activeSets() []managedSet {
      var sets []managedSet
      admin("GET", "/api/sets", nil, &sets)

      ready := make([]managedSet, 0, len(sets))
      for _, set := range sets {
        if set.Status == "active" && set.Setup && set.AdminUserID > 0 {
          ready = append(ready, set)
        }
      }
      if len(ready) == 0 {
        fail("no managed active sets found: %#v", sets)
      }
      if requiredSetPrefix != "" {
        matched := false
        for _, set := range ready {
          if strings.HasPrefix(set.ID, requiredSetPrefix) {
            matched = true
            break
          }
        }
        if !matched {
          fail("no managed active set matched required prefix %q: %#v", requiredSetPrefix, ready)
        }
      }
      return ready
    }

    func upsertBundle() {
      ratio := mustJSON(map[string]int{model: 1})
      body := map[string]any{
        "id":          bundleID,
        "name":        "K8s E2E OpenAI-compatible channel",
        "description": "Created by k8s/orbstack-kro/e2e.",
        "spec": map[string]any{
          "version": 1,
          "kind":    "newapi-channel-bundle",
          "options": []map[string]string{
            {"key": "CompletionRatio", "value": ratio},
            {"key": "ModelRatio", "value": ratio},
          },
          "channels": []map[string]any{{
            "id":       "k8s-e2e-openai",
            "name":     "K8s E2E OpenAI-compatible channel",
            "type":     1,
            "key":      upstreamKey,
            "base_url": mockURL,
            "models":   model,
            "group":    "default",
            "priority": 100,
            "weight":   0,
            "status":   "enabled",
          }},
        },
      }
      admin("POST", "/api/channel-bundles", body, nil)
    }

    func applyBundle(setID string) bundleState {
      var state bundleState
      path := "/api/channel-bundles/" + url.PathEscape(bundleID) + "/apply"
      admin("POST", path, map[string]any{"set_id": setID}, &state)
      if state.Status != "synced" || state.AppliedFingerprint == "" {
        fail("bundle sync to set %s failed: %#v", setID, state)
      }
      return state
    }

    func createKey() keyData {
      var key keyData
      admin("POST", "/api/users/"+url.PathEscape(userID)+"/keys", nil, &key)
      if key.ExternalKey == "" {
        fail("create api key returned %#v", key)
      }

      var state userState
      admin("GET", "/api/admin/users/"+url.PathEscape(userID)+"/state", nil, &state)
      if key.SetID == "" {
        key.SetID = state.SetID
      }
      key.UpstreamUserID = state.UpstreamUserID
      if key.SetID == "" || key.UpstreamUserID == 0 {
        fail("user state did not return set/upstream user: key=%#v state=%#v", key, state)
      }
      return key
    }

    func grantTestQuota(key keyData) {
      path := "/_llmgateway_console/" + url.PathEscape(key.SetID) + "/api/user/manage"
      body := map[string]any{
        "id":     key.UpstreamUserID,
        "action": "add_quota",
        "mode":   "add",
        "value":  100000000,
      }
      raw := requestJSON("POST", controlURL+path, body, map[string]string{
        "Authorization": "Bearer " + adminToken,
        "Accept":        "application/json",
      }, 60*time.Second)
      var envelope apiEnvelope
      must("decode grant quota response", json.Unmarshal(raw, &envelope))
      if !envelope.Success {
        fail("grant quota failed: %s", string(raw))
      }
    }

    func chatWithControlPlanePropagationRetry(apiKey string) chatResponse {
      body := map[string]any{
        "model": model,
        "messages": []map[string]string{
          {"role": "system", "content": "You are a helpful assistant."},
          {"role": "user", "content": "你好"},
        },
        "stream": false,
      }

      deadline := time.Now().Add(180 * time.Second)
      for {
        status, raw := requestJSONResponse("POST", trafficURL+"/v1/chat/completions", body, map[string]string{
          "Authorization": "Bearer " + apiKey,
          "Accept":        "application/json",
        }, 90*time.Second)
        if status >= 200 && status < 300 {
          if !strings.Contains(string(raw), "llmgateway k8s e2e") {
            fail("traffic chat did not reach mock upstream: %s", string(raw))
          }
          var response chatResponse
          must("decode chat response", json.Unmarshal(raw, &response))
          return response
        }
        retryablePropagation := status == http.StatusBadRequest && strings.Contains(string(raw), "model_price_error")
        retryablePropagation = retryablePropagation || status == http.StatusServiceUnavailable &&
          (strings.Contains(string(raw), "model_not_found") || strings.Contains(string(raw), "No available channel"))
        if retryablePropagation {
          if time.Now().Before(deadline) {
            time.Sleep(5 * time.Second)
            continue
          }
          fail("channel and pricing propagation did not reach traffic runtime before timeout: %s", string(raw))
        }
        fail("POST %s failed: %d %s", trafficURL+"/v1/chat/completions", status, string(raw))
      }
    }

    func admin(method, path string, body any, out any) {
      raw := requestJSON(method, controlURL+path, body, map[string]string{
        "Authorization": "Bearer " + adminToken,
        "Accept":        "application/json",
      }, 60*time.Second)
      var envelope apiEnvelope
      must("decode admin response "+path, json.Unmarshal(raw, &envelope))
      if !envelope.Success {
        fail("admin %s %s returned %s", method, path, string(raw))
      }
      if out != nil && len(envelope.Data) > 0 {
        must("decode admin data "+path, json.Unmarshal(envelope.Data, out))
      }
    }

    func waitReady(endpoint string) error {
      deadline := time.Now().Add(180 * time.Second)
      var lastErr error
      for time.Now().Before(deadline) {
        req, err := http.NewRequest("GET", endpoint, nil)
        if err != nil {
          return err
        }
        resp, err := (&http.Client{Timeout: 10 * time.Second}).Do(req)
        if err == nil {
          io.Copy(io.Discard, resp.Body)
          resp.Body.Close()
          if resp.StatusCode == http.StatusOK {
            return nil
          }
          lastErr = fmt.Errorf("status %d", resp.StatusCode)
        } else {
          lastErr = err
        }
        time.Sleep(3 * time.Second)
      }
      return lastErr
    }

    func requestJSON(method, endpoint string, body any, headers map[string]string, timeout time.Duration) []byte {
      status, raw := requestJSONResponse(method, endpoint, body, headers, timeout)
      if status < 200 || status >= 300 {
        fail("%s %s failed: %d %s", method, endpoint, status, string(raw))
      }
      return raw
    }

    func requestJSONResponse(method, endpoint string, body any, headers map[string]string, timeout time.Duration) (int, []byte) {
      var reader io.Reader
      if body != nil {
        payload, err := json.Marshal(body)
        must("encode request "+endpoint, err)
        reader = bytes.NewReader(payload)
      }
      req, err := http.NewRequest(method, endpoint, reader)
      must("build request "+endpoint, err)
      if body != nil {
        req.Header.Set("Content-Type", "application/json")
      }
      for key, value := range headers {
        req.Header.Set(key, value)
      }

      resp, err := (&http.Client{Timeout: timeout}).Do(req)
      must("send request "+endpoint, err)
      defer resp.Body.Close()
      raw, err := io.ReadAll(resp.Body)
      must("read response "+endpoint, err)
      return resp.StatusCode, raw
    }

    func env(key, fallback string) string {
      if value := os.Getenv(key); value != "" {
        return value
      }
      return fallback
    }

    func mustJSON(value any) string {
      raw, err := json.Marshal(value)
      must("marshal json", err)
      return string(raw)
    }

    func printJSON(value any) {
      raw, err := json.Marshal(value)
      must("print summary", err)
      fmt.Println(string(raw))
    }

    func must(context string, err error) {
      if err != nil {
        fail("%s: %v", context, err)
      }
    }

    func fail(format string, args ...any) {
      fmt.Fprintf(os.Stderr, format+"\n", args...)
      os.Exit(1)
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llmgateway-traffic-e2e
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-traffic-e2e
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmgateway-traffic-e2e
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: golang:1.25-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /tmp/llmgateway-e2e
          command:
            - go
            - run
            - /opt/llmgateway-e2e/main.go
          env:
            - name: LLMGATEWAY_CONTROL_URL
              value: http://llmgateway-control:18080
            - name: LLMGATEWAY_TRAFFIC_URL
              value: http://llmgateway-traffic:18080
            - name: LLMGATEWAY_E2E_MOCK_URL
              value: http://llmgateway-e2e-mock-openai:8080
            - name: LLMGATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: token
            - name: LLMGATEWAY_E2E_MODEL
              value: llmgw-k8s-chat
            - name: LLMGATEWAY_E2E_UPSTREAM_KEY
              value: sk-k8s-e2e
          volumeMounts:
            - name: runner-script
              mountPath: /opt/llmgateway-e2e
              readOnly: true
      volumes:
        - name: runner-script
          configMap:
            name: llmgateway-traffic-e2e
