apiVersion: batch/v1
kind: Job
metadata:
  name: llmgateway-traffic-autoscale-e2e
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-traffic-autoscale-e2e
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmgateway-traffic-autoscale-e2e
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: golang:1.25-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /tmp/llmgateway-e2e
          command:
            - go
            - run
            - /opt/llmgateway-e2e/main.go
          env:
            - name: LLMGATEWAY_CONTROL_URL
              value: http://llmgateway-control:18080
            - name: LLMGATEWAY_TRAFFIC_URL
              value: http://llmgateway-traffic:18080
            - name: LLMGATEWAY_E2E_MOCK_URL
              value: http://llmgateway-e2e-mock-openai:8080
            - name: LLMGATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: token
            - name: LLMGATEWAY_E2E_MODEL
              value: llmgw-k8s-chat
            - name: LLMGATEWAY_E2E_UPSTREAM_KEY
              value: sk-k8s-e2e
            - name: LLMGATEWAY_E2E_REQUIRED_SET_PREFIX
              value: set-e2e
          volumeMounts:
            - name: runner-script
              mountPath: /opt/llmgateway-e2e
              readOnly: true
      volumes:
        - name: runner-script
          configMap:
            name: llmgateway-traffic-e2e
