apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmgateway-set-manager
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-set-manager
    app.kubernetes.io/part-of: llmgateway-kro-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmgateway-set-manager
  namespace: llmgateway-kro-demo
rules:
  - apiGroups: ["llmgateway.io"]
    resources: ["llmfleets"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmgateway-set-manager
  namespace: llmgateway-kro-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmgateway-set-manager
subjects:
  - kind: ServiceAccount
    name: llmgateway-set-manager
    namespace: llmgateway-kro-demo
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llmgateway-set-manager
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-set-manager
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: llmgateway-set-manager
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          serviceAccountName: llmgateway-set-manager
          restartPolicy: OnFailure
          containers:
            - name: manager
              image: llmgateway:local
              imagePullPolicy: IfNotPresent
              command: ["/usr/local/bin/llmgateway-set-manager"]
              env:
                - name: POD_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: LLMGATEWAY_SET_MANAGER_FLEET
                  value: fleet-demo
                - name: LLMGATEWAY_SET_MANAGER_SOURCE
                  value: kro
                - name: LLMGATEWAY_CONTROL_URL
                  value: http://llmgateway-control:18080
                - name: LLMGATEWAY_INTERNAL_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: llmgateway-control-admin
                      key: internal-token
                - name: LLMGATEWAY_SET_UPGRADE_LEASE_SECONDS
                  value: "90"
                - name: LLMGATEWAY_SET_UPGRADE_PROBE_MODEL
                  value: llmgw-k8s-chat
