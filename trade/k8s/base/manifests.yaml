# trade 服务 k8s 基础描述（迭代 9A）
#
# 设计基线：
# - 与 payment / ctl 保持同构（按 mono 根 AGENTS.md "统一发布模型"）
# - 独立 namespace `trade`（与 ctl/payment 共用 user-auth 的旧模式不同；Q-DEPLOY-01）
# - 监听 :8080，健康路径 /healthz（trade/internal/httpapi/server.go 行 80 实测）
# - 配置项映射到 trade/internal/config/config.go::Load 的 envOrDefault 一一对应
# - 敏感凭证全部走 secretRef（详见 trade-implementation-plan.md §1 迭代 9C）
# - imagePullSecrets 沿用 mono 既有 TCR 三件套（与 payment/ctl 一致）
#
# 占位符（由 deploy-facing argocd/services/trade/common/ Component 的
# replacements 从 trade-platform-values configmap 注入；详见
# argocd/services/trade/common/kustomization.yaml）：
#   REPLACE_TRADE_IMAGE         — 镜像 tag, 如 lightclaw-bj8.tencentcloudcr.com/lightclaw/trade:bj8-<sha>
#   REPLACE_TRADE_NODE_POOL     — 北京/上海集群的节点池标签
#   REPLACE_TRADE_MYSQL_HOST    — DB host (北京 cynosdb 共用 10.15.224.4)
#   REPLACE_TRADE_MYSQL_PORT    — DB port (默认 3306)
#
apiVersion: v1
kind: Namespace
metadata:
  name: trade
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: trade
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: trade-config
  namespace: trade
data:
  # --- 进程基础 ---
  TRADE_ADDR: ":8080"

  # --- 跨服务反向 RPC base url ---
  # ctl-api / shadow svc 名按 mono 各自仓 k8s/base 真源；端口走 svc 80 → 容器 8080
  CTL_INTERNAL_BASE_URL: "http://ctl-api.ctl.svc.cluster.local"
  SHADOW_INTERNAL_BASE_URL: "http://shadow.shadow.svc.cluster.local"

  # --- jifei 出向（Q51 / Q58 / Q60；联调期由 overlay configmap-patch 覆盖为真实值）---
  # 注意：本仓 base 里只放语义安全的默认值；真实 CGW 网关 IP / 域名 + Host header 在
  # overlay 里按环境特化（北京 stub 与上海正式不同 endpoint）。
  JIFEI_CGW_GATEWAY_URL: ""
  JIFEI_CGW_HOST_HEADER: ""
  # JIFEI_CGW_X_QCLOUD_USER_ID（v1.7.4 D9 新增）：仅测试环境带（测试 uin 如 700000164995），
  # 现网为空字符串（部署侧出口 IP 鉴权，jifeiclient 跳过 header 注入）。
  JIFEI_CGW_X_QCLOUD_USER_ID: ""
  # JIFEI_BILLING_APIGW_URL（销毁链路 Q-D-SIG-1~6 新增）：jifei 计费网关 ModifyResourceStatus
  # 入口 URL（HMAC-SHA256 签名分支，与 JIFEI_CGW_GATEWAY_URL 的 jifei-test 路由严格区分）。
  # base 留空字符串占位；真实值由 deploy-facing common Component 从
  # trade-platform-values configmap 通过 replacements 注入。
  # 该 key 必须显式存在（即使空串），否则 kustomize replacement 找不到 target field 报错。
  JIFEI_BILLING_APIGW_URL: ""
  # TRADE_SHADOW_MOCK_ENABLED（v1.7.28 BUG-02 修复 / 新增）：仅联调测试环境启用
  # （"true"/"1"/"yes"/"on"，大小写不敏感），现网必须为 "false"/"0"/空字符串。
  # 启用后 trade 启动时改注入 mockShadowClient（cmd/trade/shadow_mock.go），任意
  # externalUserId 都映射到固定 mock binding {Uin:"700000164995", AppID:"251202221"}，
  # 跳过 shadow HTTP 调用。base 留空字符串占位；overlay 通过 replacements 注入真值。
  TRADE_SHADOW_MOCK_ENABLED: ""
  # TRADE_INQUIRY_FALLBACK_UIN / TRADE_INQUIRY_FALLBACK_APP_ID：
  # 仅新购询价在用户没有 shadow binding 时使用的展示兜底身份。付费下单仍强校验真实
  # shadow binding。两者必须同进同退；都为空表示关闭兜底。
  TRADE_INQUIRY_FALLBACK_UIN: ""
  TRADE_INQUIRY_FALLBACK_APP_ID: ""
  TRADE_JIFEI_COMPONENT_NAME: "trade"
  TRADE_JIFEI_PROTOCOL_VERSION: "1.0"
  TRADE_JIFEI_OUR_INTERFACE_PREFIX: "lightvela"

  # --- v1.7.x 国际站接入：站点标识 ---
  # LIGHTVELA_SITE_KIND（trade-international-site-design v1.1 §3.1 A1 / B1）：
  #   - "cn"   → 国内站（缺省 / 兼容现有部署）；trade 出向 jifei envelope.resInfo
  #     使用广州 region (1/100001) + currency=CNY；envelope.interface.extraPara
  #     不写 site/language（omitempty 跳过）。
  #   - "intl" → 国际站；trade 出向使用新加坡 region (9/900001) + currency=USD；
  #     extraPara 写 site="2" language="en"（PDF 协议字面量映射，B-PROTO-5）。
  #   - 其他值（含空字符串、bogus、"sg"、"kr" 等）→ 由 config.normalizeSiteKind
  #     兜底为 "cn"，与 ctl/shadow/sandbox 的 env 缺省一致行为对齐。
  #
  # 真实取值由 deploy-facing common Component 通过 replacements 从
  # trade-platform-values configmap (trade-platform.env) 注入：
  #   - 北京 sandbox-bj-7 / 上海 shprod 等国内集群 → "cn"
  #   - 新加坡 / 国际站集群 sgprod                  → "intl"
  LIGHTVELA_SITE_KIND: "REPLACE_TRADE_SITE_KIND"

  # --- 2026-06-12 北京 2 预发布接入：region 字段 override ---
  # LIGHTVELA_TRADE_REGION：trade 出向 jifei 协议的 region 字面量运行时 override。
  #   - 取值为腾讯云 region API 字面量（kebab-case 全小写），已注册：
  #     · "ap-guangzhou" → 1 / 100001 / "广州"
  #     · "ap-beijing"   → 8 / 800001 / "北京"（北京 2 预发布使用）
  #     · "ap-shanghai"  → 4 / 400001 / "上海"（上海正式使用）
  #     · "ap-singapore" → 9 / 900001 / "Singapore"
  #   - 留空字符串 → 按 LIGHTVELA_SITE_KIND 兜底（cn → 广州 / intl → 新加坡）。
  #   - 未注册字面量（例："ap-tokyo" / "bj" 拼写错误）→ trade 启动 fail-fast。
  # 本字段与 LIGHTVELA_SITE_KIND 解耦：可以“国内站身份 cn + region 字段北京”（北京 2 预发布场景）。
  # 真实取值由 deploy-facing common Component 通过 replacements 从 trade-platform-values
  # configmap (trade-platform.env) 注入：overlay 未配时保持空字符串。
  LIGHTVELA_TRADE_REGION: ""

  # DIANSHI_PRICE_BASE_URL / DIANSHI_ORDER_BASE_URL（点石活动接入 v1.7.x）：
  # trade → clgateway 的点石询价 / 下单出向地址。两者同进同退，trade Load 期会
  # fail-fast 拦只配一边的跛脚状态；都为空 = main.go 不装配 ActivityResolver +
  # DianshiClient + ActivityStore，inquiry / placeorder / createresource 退化到
  # v1.7.x 历史行为（jifei 单路径），与 LIGHTVELA_TRADE_REGION 同款"空字符串
  # 即 disable"语义。真实取值由 deploy-facing common Component 通过 replacements
  # 从 trade-platform-values configmap (trade-platform.env) 注入；overlay 未配
  # 时保持空字符串，common/kustomization.yaml replacements 强引用本字段不能删除。
  # 设计稿：.tmp/dianshi-activity-bundle-design.md §5.7 / §5.8
  DIANSHI_PRICE_BASE_URL: ""
  DIANSHI_ORDER_BASE_URL: ""

  # --- DB ---
  # MYSQL_HOST / MYSQL_PORT 由 deploy-facing common Component 用 replacements
  # 从 trade-platform-values configmap 注入；TRADE_DB_PASSWORD 走 secret。
  MYSQL_HOST: "REPLACE_TRADE_MYSQL_HOST"
  MYSQL_PORT: "REPLACE_TRADE_MYSQL_PORT"
  TRADE_DB: "trade"
  TRADE_DB_USER: "trade"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade
  namespace: trade
  labels:
    app: trade
spec:
  replicas: 2
  selector:
    matchLabels:
      app: trade
  template:
    metadata:
      labels:
        app: trade
    spec:
      nodeSelector:
        pool: REPLACE_TRADE_NODE_POOL
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: trade
      containers:
        - name: trade
          image: REPLACE_TRADE_IMAGE
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: trade-config
            - secretRef:
                name: trade-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: trade
  namespace: trade
  labels:
    app: trade
spec:
  selector:
    app: trade
  ports:
    - name: http
      port: 80
      targetPort: http
