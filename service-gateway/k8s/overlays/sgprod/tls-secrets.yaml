# Manual-only TLS binding for sgprod.
# This file is intentionally NOT included in the default sgprod kustomization.
# Daily deploys must not overwrite qcloud_cert_id, so apply this file only when
# initially binding or explicitly rotating the Tencent Cloud certificate.
apiVersion: v1
kind: Secret
metadata:
  name: api-lightvela-ai-tls
  annotations:
    qcloud_cert_id: XV7Zeg81
type: Opaque
stringData:
  qcloud_cert_id: XV7Zeg81
