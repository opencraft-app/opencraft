apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: delete-shared-namespace.yaml
  - path: delete-shared-serviceaccount.yaml
  - path: collaboration-gateway-token-env-patch.yaml
  - target:
      kind: ConfigMap
      name: service-gateway-platform-values
    patch: |-
      - op: add
        path: /data/SERVICE_GATEWAY_REALNAME_WALL_ENABLED
        value: "false"
