map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Diagnostic fields only; forwarded values are observations, not authorization.
map $http_origin $workbench_origin {
    default "-";
    "~*^(https?://[a-z0-9.-]+(?::[0-9]+)?)(?:/|$)" $1;
}
map $http_referer $workbench_referer_origin {
    default "-";
    "~*^(https?://[a-z0-9.-]+(?::[0-9]+)?)(?:/|$)" $1;
}
map $http_x_forwarded_proto $workbench_forwarded_proto {
    default "-";
    "~*^(https?|https?, ?https?)$" $1;
}
map $http_x_forwarded_for $workbench_forwarded_for {
    default "-";
    "~^[0-9a-fA-F:., ]{1,512}$" $http_x_forwarded_for;
}
map $http_user_agent $workbench_user_agent {
    default "-";
    "~^(.{0,512})" $1;
}
map $http_sec_fetch_site $workbench_fetch_site {
    default "-";
    "~^(same-origin|same-site|cross-site|none)$" $1;
}
map $http_sec_fetch_mode $workbench_fetch_mode {
    default "-";
    "~^(navigate|cors|no-cors|same-origin|websocket)$" $1;
}
map $http_sec_fetch_dest $workbench_fetch_dest {
    default "-";
    "~^(document|iframe|empty|script|style|image|font|worker|serviceworker|audio|video)$" $1;
}

# Never log $request/$request_uri/$args, Cookie, Authorization or request bodies.
log_format opencraft_access_json escape=json
    '{"time":"$time_iso8601","request_id":"$request_id",'
    '"connection":"$connection","connection_requests":"$connection_requests",'
    '"peer":"$remote_addr","forwarded_for":"$workbench_forwarded_for",'
    '"host":"$host","scheme":"$scheme","forwarded_proto":"$workbench_forwarded_proto",'
    '"method":"$request_method","path":"$uri","protocol":"$server_protocol",'
    '"status":$status,"bytes":$body_bytes_sent,"request_time":"$request_time",'
    '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"upstream_header_time":"$upstream_header_time",'
    '"upstream_response_time":"$upstream_response_time",'
    '"origin":"$workbench_origin","referer_origin":"$workbench_referer_origin",'
    '"user_agent":"$workbench_user_agent","fetch_site":"$workbench_fetch_site",'
    '"fetch_mode":"$workbench_fetch_mode","fetch_dest":"$workbench_fetch_dest"}';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name workbench.example.com "";

    access_log /var/log/nginx/opencraft-access.log opencraft_access_json;
    add_header X-OpenCraft-Request-ID $request_id always;

    client_max_body_size 0;

    location / {
        proxy_pass http://9.134.163.40:80;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 5s;
        proxy_send_timeout 1d;
        proxy_read_timeout 1d;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
