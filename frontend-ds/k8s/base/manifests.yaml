apiVersion: v1
kind: Namespace
metadata:
  name: frontend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: frontend
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: preview-lightclaw-public
  namespace: frontend
  annotations:
    kubernetes.io/ingress.class: qcloud
    ingress.cloud.tencent.com/modification-protection: "false"
    ingress.cloud.tencent.com/tke-service-config: preview-lightclaw-public-config
    ingress.cloud.tencent.com/direct-access: "true"
    ingress.cloud.tencent.com/rewrite-support: "true"
    ingress.cloud.tencent.com/auto-rewrite: "true"
spec:
  ingressClassName: qcloud
  tls:
    - hosts:
        - REPLACE_FRONTEND_PUBLIC_HOST
      secretName: REPLACE_FRONTEND_TLS_SECRET_NAME
  rules:
    - host: REPLACE_FRONTEND_PUBLIC_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-web-ingress
                port:
                  number: 80
---
apiVersion: cloud.tencent.com/v1alpha1
kind: TkeServiceConfig
metadata:
  name: preview-lightclaw-public-config
  namespace: frontend
spec:
  loadBalancer:
    l7Listeners:
      - protocol: HTTP
        port: 80
        domains:
          - domain: REPLACE_FRONTEND_PUBLIC_HOST
            rules:
              - url: /
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_FRONTEND_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
      - protocol: HTTPS
        port: 443
        defaultServer: REPLACE_FRONTEND_PUBLIC_HOST
        domains:
          - domain: REPLACE_FRONTEND_PUBLIC_HOST
            rules:
              - url: /
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_FRONTEND_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-web
  namespace: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend-web
  template:
    metadata:
      labels:
        app: frontend-web
      annotations:
        frontend.lightclaw.dev/redeploy-at: "REPLACE_FRONTEND_DEPLOYED_AT"
    spec:
      nodeSelector:
        pool: REPLACE_FRONTEND_NODE_POOL
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: frontend-web
      containers:
        - name: frontend
          image: REPLACE_FRONTEND_IMAGE
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web
  namespace: frontend
spec:
  selector:
    app: frontend-web
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-web-ingress
  namespace: frontend
spec:
  type: NodePort
  selector:
    app: frontend-web
  ports:
    - name: http
      port: 80
      targetPort: http
