# Deployment-only: four immutable registry digests; no build context or host code.
name: ${COMPOSE_PROJECT_NAME:?Set a unique deployment name}
x-runtime: &runtime
  platform: linux/amd64
  init: true
  restart: unless-stopped
  user: "${OPENCRAFT_UID:?Set UID}:${OPENCRAFT_GID:?Set GID}"
  network_mode: host
  logging:
    driver: local
    options: {max-size: "10m", max-file: "3"}
x-environment: &environment
  OPENCRAFT_DATA_DIR: ${OPENCRAFT_DATA_DIR:-/var/lib/opencraft}
  OPENCRAFT_EXECUTION_DIR: ${OPENCRAFT_EXECUTION_DIR:-/var/lib/opencraft/execution}
  OPENCRAFT_WORKSPACE_DIR: ${OPENCRAFT_WORKSPACE_DIR:-/workspace}
  OPENCRAFT_BROWSER_DATA_DIR: ${OPENCRAFT_BROWSER_DATA_DIR:-${OPENCRAFT_EXECUTION_DIR:-/var/lib/opencraft/execution}/browser}
  OPENCRAFT_LOG_DIR: ${OPENCRAFT_LOG_DIR:-/var/log/opencraft}
  OPENCRAFT_CODEX_PROJECTLESS_DIR: ${OPENCRAFT_CODEX_PROJECTLESS_DIR:-${OPENCRAFT_WORKSPACE_DIR:-/workspace}/sessions/codex}
  OPENCRAFT_DSH_PROJECTLESS_DIR: ${OPENCRAFT_DSH_PROJECTLESS_DIR:-${OPENCRAFT_WORKSPACE_DIR:-/workspace}/sessions/dsh}
  OPENCRAFT_GATEWAY_HOME: ${OPENCRAFT_DATA_DIR:-/var/lib/opencraft}/home/gateway
  OPENCRAFT_HANDS_CPUS: ${OPENCRAFT_HANDS_CPUS:-2}
  OPENCRAFT_HANDS_MEMORY_BYTES: ${OPENCRAFT_HANDS_MEMORY_BYTES:-4294967296}
  OPENCRAFT_PROXY_MODE: external
  OPENCRAFT_PROXY_PORT: ${OPENCRAFT_PROXY_PORT:?Set proxy port}
x-data: &data
  type: bind
  source: ${OPENCRAFT_HOST_DATA_DIR:?Set host state directory}
  target: ${OPENCRAFT_DATA_DIR:-/var/lib/opencraft}
  bind: {create_host_path: false}
x-execution: &execution
  type: bind
  source: ${OPENCRAFT_HOST_EXECUTION_DIR:?Set host execution directory}
  target: ${OPENCRAFT_EXECUTION_DIR:-/var/lib/opencraft/execution}
  bind: {create_host_path: false}
x-workspace: &workspace
  type: bind
  source: ${OPENCRAFT_HOST_WORKSPACE_DIR:?Set host workspace directory}
  target: ${OPENCRAFT_WORKSPACE_DIR:-/workspace}
  bind: {create_host_path: false}
x-logs: &logs
  type: bind
  source: ${OPENCRAFT_HOST_LOG_DIR:?Set host log directory}
  target: ${OPENCRAFT_LOG_DIR:-/var/log/opencraft}
  read_only: true
  bind: {create_host_path: false}
x-health: &health
  interval: 10s
  timeout: 12s
  start_period: 30s
  retries: 12
services:
  hands:
    <<: *runtime
    image: ${OPENCRAFT_HANDS_IMAGE:?Set Hands repository digest}
    entrypoint: ["/opt/opencraft/bin/node", "/opt/opencraft/runtime/container-service.mjs", "hands"]
    cpus: ${OPENCRAFT_HANDS_CPUS:-2}
    mem_limit: ${OPENCRAFT_HANDS_MEMORY_BYTES:-4294967296}
    pids_limit: 4096
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SETUID, SETGID, SYS_CHROOT]
    environment:
      <<: *environment
      HOME: ${OPENCRAFT_EXECUTION_DIR:-/var/lib/opencraft/execution}
      OPENCRAFT_HANDS_EXECUTION_SOCKET: ${OPENCRAFT_EXECUTION_DIR:-/var/lib/opencraft/execution}/exec-owner.sock
      OPENCRAFT_HANDS_EXECUTION_TOKEN: ${OPENCRAFT_EXECUTION_DIR:-/var/lib/opencraft/execution}/exec-owner.token
      OPENCRAFT_CODEX_EXECUTABLE: /opt/opencraft/runtime/codex/bin/codex
    volumes:
      - *execution
      - *workspace
      - *logs
      - type: bind
        source: ${OPENCRAFT_HOST_HANDS_LOG_DIR:-${OPENCRAFT_HOST_LOG_DIR}/hands}
        target: ${OPENCRAFT_LOG_DIR:-/var/log/opencraft}/hands
        bind: {create_host_path: false}
    healthcheck:
      <<: *health
      test: ["CMD", "/opt/opencraft/bin/opencraft-health", "hands"]
    stop_grace_period: 30s
  proxy:
    <<: *runtime
    image: ${OPENCRAFT_PROXY_IMAGE:?Set Proxy repository digest}
    entrypoint: ["/opt/opencraft/bin/node", "/opt/opencraft/runtime/container-service.mjs", "proxy"]
    pid: host
    environment: *environment
    volumes:
      - *data
      - *execution
      - *workspace
      - *logs
      - type: bind
        source: ${OPENCRAFT_HOST_LOG_DIR}/proxy
        target: ${OPENCRAFT_LOG_DIR:-/var/log/opencraft}/proxy
        bind: {create_host_path: false}
    healthcheck:
      <<: *health
      test: ["CMD", "/opt/opencraft/bin/opencraft-health", "proxy"]
    stop_grace_period: 60s
  brain:
    <<: *runtime
    image: ${OPENCRAFT_BRAIN_IMAGE:?Set Brain repository digest}
    entrypoint: ["/opt/opencraft/bin/node", "/opt/opencraft/runtime/container-service.mjs", "brain"]
    pid: host
    environment: *environment
    volumes:
      - *data
      - *execution
      - *workspace
      - *logs
      - type: bind
        source: ${OPENCRAFT_HOST_LOG_DIR}/brain
        target: ${OPENCRAFT_LOG_DIR:-/var/log/opencraft}/brain
        bind: {create_host_path: false}
    depends_on:
      hands: {condition: service_healthy}
      proxy: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "/opt/opencraft/bin/opencraft-health", "brain"]
    stop_grace_period: 60s
  gateway:
    <<: *runtime
    image: ${OPENCRAFT_GATEWAY_IMAGE:?Set Gateway repository digest}
    entrypoint: ["/opt/opencraft/bin/node", "/opt/opencraft/runtime/container-service.mjs", "gateway"]
    pid: host
    environment:
      <<: *environment
      OPENCRAFT_BROWSER_OWNER_SOCKET: ${OPENCRAFT_BROWSER_OWNER_SOCKET:-${OPENCRAFT_EXECUTION_DIR:-/var/lib/opencraft/execution}/browser/owner.sock}
      OPENCRAFT_USER_PLUGIN_DIRECTORY: ${OPENCRAFT_DATA_DIR:-/var/lib/opencraft}/user-plugins
    command: ["--host", "${OPENCRAFT_BIND_HOST:-127.0.0.1}", "--port", "${OPENCRAFT_PORT:?Set Gateway port}", "--data-dir", "${OPENCRAFT_DATA_DIR:-/var/lib/opencraft}", "--access-control", "--engines", "dsh,pi", "--default-engine", "pi"]
    volumes:
      - *data
      - *execution
      - *workspace
      - *logs
      - type: bind
        source: ${OPENCRAFT_HOST_LOG_DIR}/gateway
        target: ${OPENCRAFT_LOG_DIR:-/var/log/opencraft}/gateway
        bind: {create_host_path: false}
    depends_on:
      brain: {condition: service_healthy}
      hands: {condition: service_healthy}
    healthcheck:
      <<: *health
      test: ["CMD", "/opt/opencraft/bin/node", "-e", "fetch('http://127.0.0.1:${OPENCRAFT_PORT}/health').then(async r=>{const b=await r.json();if(!r.ok||!b.ok||b.hosts?.['local-codex']?.state!=='ready')process.exit(1)}).catch(()=>process.exit(1))"]
    stop_grace_period: 30s
