# CTL 全链路告警规则
# 分层：P0（立即响应）/ P1（30分钟内处理）/ P2（工作时间处理）

groups:
  - name: openclaw_p0_critical
    rules:
      - alert: TaskFailureRateHigh
        expr: rate(task_failed_total[5m]) > 0.1
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "任务失败率突增"
          description: "过去 5 分钟任务失败率 > 0.1/s，当前值 {{ $value | printf \"%.2f\" }}/s"
          runbook_url: "docs/runbooks/task-failure-rate-high.md"

      - alert: APIErrorRateHigh
        expr: >
          sum(rate(openclaw_api_request_total{status_code=~"5.."}[5m]))
          /
          (sum(rate(openclaw_api_request_total[5m])) > 0)
          > 0.05
        for: 2m
        labels:
          severity: P0
        annotations:
          summary: "API 5xx 错误率 > 5%"
          description: "过去 5 分钟 API 5xx 错误率超过 5%，当前值 {{ $value | printf \"%.2f\" }}"
          runbook_url: "docs/runbooks/api-error-rate-high.md"

      - alert: TaskStuckRunning
        expr: openclaw_task_stuck_running_total > 0
        for: 1m
        labels:
          severity: P0
        annotations:
          summary: "有任务卡在 RUNNING 超过 10 分钟"
          description: "task_name={{ $labels.task_name }}，卡住任务数 {{ $value }}"
          runbook_url: "docs/runbooks/task-stuck-running.md"

  - name: openclaw_p1_warning
    rules:
      - alert: TaskRetryNearLimit
        expr: openclaw_task_retry_near_limit_total > 0
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "有任务重试次数逼近上限（80%）"
          description: "task_name={{ $labels.task_name }}，逼近上限任务数 {{ $value }}"
          runbook_url: "docs/runbooks/task-retry-near-limit.md"

      - alert: TaskFailedAccumulating
        expr: openclaw_task_status_total{status="FAILED"} > 10
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "FAILED 任务堆积超过 10 个"
          description: "task_name={{ $labels.task_name }}，FAILED 任务数 {{ $value }}"
          runbook_url: "docs/runbooks/task-failed-accumulating.md"

      - alert: SandboxAPILatencyHigh
        expr: histogram_quantile(0.99, sum by (le) (rate(openclaw_sandbox_api_duration_seconds_bucket[5m]))) > 10
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "沙箱 API P99 延迟 > 10s"
          description: "沙箱 API P99 延迟当前值 {{ $value | printf \"%.2f\" }}s"
          runbook_url: "docs/runbooks/sandbox-api-latency-high.md"

      - alert: DBPoolExhaustion
        expr: openclaw_db_pool_in_use / openclaw_db_pool_max_open > 0.8
        for: 5m
        labels:
          severity: P1
        annotations:
          summary: "DB 连接池使用率 > 80%"
          description: "DB 连接池使用率当前值 {{ $value | printf \"%.2f\" }}"
          runbook_url: "docs/runbooks/db-pool-exhaustion.md"

      - alert: RemoteCommandFailureRateHigh
        expr: >
          sum(rate(openclaw_remote_command_total{result!="success"}[10m]))
          /
          (sum(rate(openclaw_remote_command_total[10m])) > 0)
          > 0.05
        for: 10m
        labels:
          severity: P1
        annotations:
          summary: "远程命令失败率 > 5%"
          description: "过去 10 分钟远程命令失败率超过 5%，当前值 {{ $value | printf \"%.2f\" }}"
          runbook_url: "docs/runbooks/remote-command-failure-rate-high.md"

      - alert: RemoteCommandTimeoutRateHigh
        expr: >
          sum(rate(openclaw_remote_command_total{result="timeout"}[10m]))
          /
          (sum(rate(openclaw_remote_command_total[10m])) > 0)
          > 0.02
        for: 10m
        labels:
          severity: P1
        annotations:
          summary: "远程命令超时率 > 2%"
          description: "过去 10 分钟远程命令超时率超过 2%，当前值 {{ $value | printf \"%.2f\" }}"
          runbook_url: "docs/runbooks/remote-command-timeout-rate-high.md"

  - name: openclaw_p2_info
    rules:
      - alert: APILatencyP99High
        expr: histogram_quantile(0.99, sum by (le) (rate(openclaw_api_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "API P99 延迟 > 1s"
          description: "API P99 延迟当前值 {{ $value | printf \"%.2f\" }}s"
          runbook_url: "docs/runbooks/api-latency-p99-high.md"

      - alert: BypassLockFailureRate
        expr: rate(bypass_execution_total{result="lock_failed"}[1h]) > 0.5
        for: 30m
        labels:
          severity: P2
        annotations:
          summary: "Bypass 锁竞争频繁"
          description: "过去 1 小时 Bypass 锁竞争率 > 0.5/s，当前值 {{ $value | printf \"%.2f\" }}/s"
          runbook_url: "docs/runbooks/bypass-lock-failure-rate.md"

      - alert: RedisPoolMissRate
        expr: >
          rate(openclaw_redis_pool_misses_total[5m])
          /
          ((rate(openclaw_redis_pool_hits_total[5m]) + rate(openclaw_redis_pool_misses_total[5m])) > 0)
          > 0.1
        for: 10m
        labels:
          severity: P2
        annotations:
          summary: "Redis 连接池未命中率 > 10%"
          description: "client={{ $labels.client }}，未命中率当前值 {{ $value | printf \"%.2f\" }}"
          runbook_url: "docs/runbooks/redis-pool-miss-rate.md"
