# Alertmanager 配置
# 本地开发用，生产环境使用云服务

global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default'
  routes:
    - match:
        severity: P0
      repeat_interval: 15m
      receiver: 'default'
    - match:
        severity: P1
      repeat_interval: 1h
      receiver: 'default'

receivers:
  - name: 'default'
    # receiver 先设为空，后续可接企微/webhook
