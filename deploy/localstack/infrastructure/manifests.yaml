            - name: FAKE_QQ_APP_ID
              value: local-qq-app-id
            - name: FAKE_QQ_DEFAULT_USER
              value: local
            - name: MOCK_CONTROL_BASE_URL
              value: http://mock-control:19060
          ports:
            - name: http
              containerPort: 19010
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: script
              mountPath: /mock/server.mjs
              subPath: server.mjs
      volumes:
        - name: script
          configMap:
            name: fake-qq-oauth
---
