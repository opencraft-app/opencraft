            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
apiVersion: batch/v1
kind: Job
metadata:
  name: localstack-databases
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app: localstack-databases
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: localstack-infra-secrets
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -ec
            - until mysqladmin ping -hmysql -uroot --silent; do sleep 2; done
      containers:
        - name: databases
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_PWD
              valueFrom:
                secretKeyRef:
                  name: localstack-infra-secrets
                  key: MYSQL_ROOT_PASSWORD
          command:
            - sh
            - -ec
            - mysql -hmysql -uroot < /init/001-databases.sql
          volumeMounts:
            - name: init
              mountPath: /init
      volumes:
        - name: init
          configMap:
            name: mysql-init
