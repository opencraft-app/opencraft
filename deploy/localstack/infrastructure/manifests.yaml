apiVersion: v1
kind: Namespace
metadata:
  name: localstack-system
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-authentication-plugin=mysql_native_password
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: localstack-infra-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command:
                - sh
                - "-ec"
                - mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD}"
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d/001-databases.sql
              subPath: 001-databases.sql
      volumes:
        - name: init
          configMap:
            name: mysql-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - "-ec"
            - exec redis-server --appendonly yes --requirepass "${REDIS_PASSWORD}"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: localstack-infra-secrets
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - "-ec"
                - redis-cli -a "${REDIS_PASSWORD}" ping | grep -q PONG
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mock-control
spec:
  selector:
    app: mock-control
  ports:
    - name: http
      port: 19060
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-control
  template:
    metadata:
      labels:
        app: mock-control
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: mock-control
          image: lightclaw-local/mock-control:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: MOCK_CONTROL_PORT
              value: "19060"
            - name: MOCK_CONTROL_FIXTURES_DIR
              value: /app/fixtures
            - name: MOCK_DEVELOPMENT_SMS_CODE
              value: "123456"
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_DATABASE
              value: mock_control
            - name: MYSQL_USER
              value: mock_control
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: localstack-infra-secrets
                  key: MOCK_CONTROL_DB_PASSWORD
          ports:
            - name: http
              containerPort: 19060
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: fake-qq-oauth
spec:
  selector:
    app: fake-qq-oauth
  ports:
    - name: http
      port: 19010
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-qq-oauth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-qq-oauth
  template:
    metadata:
      labels:
        app: fake-qq-oauth
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: fake-qq-oauth
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /mock/server.mjs
          env:
