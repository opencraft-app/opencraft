spec:
  selector:
    app: fake-jifei
  ports:
    - name: http
      port: 19020
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-jifei
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fake-jifei
  template:
    metadata:
      labels:
        app: fake-jifei
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: fake-jifei
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /mock/server.mjs
          env:
            - name: FAKE_JIFEI_PORT
              value: "19020"
            - name: FAKE_JIFEI_CALLBACK_URL
              value: http://trade.trade.svc.cluster.local/trade/jifei/callback
            - name: FAKE_JIFEI_DATABASE_PATH
              value: /data/fake-jifei.sqlite
          ports:
            - name: http
              containerPort: 19020
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: script
              mountPath: /mock/server.mjs
              subPath: server.mjs
            - name: data
              mountPath: /data
      volumes:
        - name: script
          configMap:
            name: fake-jifei
        - name: data
          persistentVolumeClaim:
            claimName: fake-jifei-data
---
apiVersion: v1
kind: Service
metadata:
  name: fake-tencentcloud
spec:
  selector:
    app: fake-tencentcloud
  ports:
    - name: http
      port: 19030
      targetPort: http
    - name: https
      port: 19443
      targetPort: https
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-tencentcloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-tencentcloud
  template:
    metadata:
      labels:
        app: fake-tencentcloud
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: fake-tencentcloud
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /mock/server.mjs
          env:
            - name: FAKE_TENCENTCLOUD_PORT
              value: "19030"
            - name: FAKE_TENCENTCLOUD_TLS_PORT
              value: "19443"
            - name: FAKE_TENCENTCLOUD_TLS_CERT
              value: /mock/tls/tls.crt
            - name: FAKE_TENCENTCLOUD_TLS_KEY
              value: /mock/tls/tls.key
            - name: MOCK_CONTROL_BASE_URL
              value: http://mock-control:19060
          ports:
            - name: http
              containerPort: 19030
            - name: https
              containerPort: 19443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: script
              mountPath: /mock/server.mjs
              subPath: server.mjs
            - name: tls
              mountPath: /mock/tls
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: fake-tencentcloud
        - name: tls
          secret:
            secretName: fake-tencentcloud-tls
