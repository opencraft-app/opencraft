spec:
  selector:
    app: fake-envd
  ports:
    - name: grpc-web
      port: 19050
      targetPort: grpc-web
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-envd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fake-envd
  template:
    metadata:
      labels:
        app: fake-envd
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: fake-envd
          image: lightclaw-local/fake-envd:dev
          imagePullPolicy: IfNotPresent
