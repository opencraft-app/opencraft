apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../subscription/k8s/base
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: subscription-config
    namespace: user-auth
    behavior: merge
    literals:
      - SUBSCRIPTION_ALLOWED_ORIGINS=http://localhost:8085,http://localhost:5173
      - PAYMENT_INTERNAL_BASE_URL=http://payment.user-auth.svc.cluster.local
      - AI_GATEWAY_BASE_URL=http://gateway.ai-gateway.svc.cluster.local
      - SUBSCRIPTION_FREE_PLAN_ID=free
      - SUBSCRIPTION_LITE_PLAN_ID=lite
      - SUBSCRIPTION_PRO_PLAN_ID=pro
      - MYSQL_HOST=mysql.localstack-system.svc.cluster.local
      - MYSQL_PORT=3306
      - SUBSCRIPTION_DB=subscription
      - SUBSCRIPTION_DB_USER=subscription
secretGenerator:
  - name: subscription-runtime-secrets
    namespace: user-auth
    envs:
      - secrets.defaults.env
images:
  - name: REPLACE_SUBSCRIPTION_IMAGE
    newName: lightclaw-local/subscription
    newTag: dev
patches:
  - target:
      kind: ServiceAccount
      name: default
      namespace: user-auth
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: user-auth
  - target:
      kind: Deployment
      name: subscription
      namespace: user-auth
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
      - op: replace
        path: /spec/template/metadata/annotations/subscription.clawhub.dev~1redeploy-at
        value: localstack
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
labels:
  - pairs:
      app.kubernetes.io/part-of: lightclaw-localstack
    includeSelectors: false
    includeTemplates: true
