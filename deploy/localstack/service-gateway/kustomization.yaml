apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../service-gateway/k8s/base/manifests.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: service-gateway-config
    namespace: lightclaw-gateway
    files:
      - config.yaml
  - name: service-gateway-platform-values
    namespace: lightclaw-gateway
    literals:
      - SERVICE_GATEWAY_REALNAME_WALL_ENABLED=false
      - SERVICE_GATEWAY_VIBEBASE_INTERNAL_TOKEN=local-vibebase-token
secretGenerator:
  - name: service-gateway-runtime-secrets
    namespace: lightclaw-gateway
    envs:
      - secrets.defaults.env
images:
  - name: REPLACE_SERVICE_GATEWAY_IMAGE
    newName: lightclaw-local/service-gateway
    newTag: dev
patches:
  - target:
      kind: ServiceAccount
      name: default
      namespace: lightclaw-gateway
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: default
        namespace: lightclaw-gateway
  - target:
      kind: Deployment
      name: service-gateway
      namespace: lightclaw-gateway
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/nodeSelector
      - op: remove
        path: /spec/template/spec/topologySpreadConstraints
      - op: replace
        path: /spec/template/metadata/annotations/service-gateway.clawhub.dev~1redeploy-at
        value: localstack
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      kind: Ingress
      name: lightclaw-public
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: lightclaw-public
  - target:
      kind: TkeServiceConfig
      name: lightclaw-public-config
    patch: |-
      $patch: delete
      apiVersion: cloud.tencent.com/v1alpha1
      kind: TkeServiceConfig
      metadata:
        name: lightclaw-public-config
  - target:
      kind: Service
      name: service-gateway-ingress
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: service-gateway-ingress
  - target:
      kind: ServiceMonitor
      name: service-gateway
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: service-gateway
labels:
  - pairs:
      app.kubernetes.io/part-of: lightclaw-localstack
    includeSelectors: false
    includeTemplates: true
