apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localstack-system
resources:
  - job.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: localstack-seed
    files:
      - 005-auth-invites.sql=../../local/mysql/seed/005-auth-invites.sql
      - 010-subscription-plans.sql=../../local/mysql/seed/010-subscription-plans.sql
      - 020-sandbox-mock-pool.sql=../../local/mysql/seed/020-sandbox-mock-pool.sql
      - 025-ai-gateway-plans.sql=../../local/mysql/seed/025-ai-gateway-plans.sql
      - 030-ctl-bundles.sql=../../local/mysql/seed/030-ctl-bundles.sql
      - 040-trade-bundles.sql=../../local/mysql/seed/040-trade-bundles.sql
labels:
  - pairs:
      app.kubernetes.io/part-of: lightclaw-localstack
    includeSelectors: false
    includeTemplates: true
