apiVersion: v1
kind: Service
metadata:
  name: shadow-trade-adapter
  namespace: shadow
spec:
  selector:
    app: shadow-trade-adapter
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow-trade-adapter
  namespace: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shadow-trade-adapter
  template:
    metadata:
      labels:
        app: shadow-trade-adapter
        app.kubernetes.io/part-of: lightclaw-localstack
    spec:
      containers:
        - name: adapter
          image: node:22-alpine
          imagePullPolicy: IfNotPresent
          command:
            - node
            - /adapter/server.mjs
          env:
            - name: PORT
              value: "18080"
            - name: SHADOW_BASE_URL
              value: http://shadow.shadow.svc.cluster.local
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: SHADOW_INTERNAL_SERVICE_TOKEN
          ports:
            - name: http
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          volumeMounts:
            - name: script
              mountPath: /adapter/server.mjs
              subPath: server.mjs
      volumes:
        - name: script
          configMap:
            name: shadow-trade-adapter
