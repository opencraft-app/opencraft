apiVersion: v1
kind: Namespace
metadata:
  name: shadow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-config
  namespace: shadow
data:
  SHADOW_HTTP_ADDR: ":8080"
  SHADOW_PROVIDER: "tencent"
  SHADOW_PLATFORM: "lightclaw-local"
  SHADOW_STORAGE_DRIVER: "sqlite"
  SHADOW_STORAGE_DSN: "file:/var/lib/shadow/shadow.db?_pragma=busy_timeout(5000)"
  SHADOW_REGION: "ap-guangzhou"
  SHADOW_BILLING_MODE: "fake"
  SHADOW_CLOUDLADDER_ENABLED: "true"
  SHADOW_REQUEST_TIMEOUT: "10s"
  SHADOW_AUTH_CODE_TTL: "10m"
  SHADOW_FREE_TRIAL_ACTIVITY_ID: "15152"
  SHADOW_FREE_TRIAL_ACT_ID: "134393"
  SHADOW_FREE_TRIAL_SUB_PRODUCT_CODE: "sp_tced_saas"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shadow
  namespace: shadow
  labels:
    app: shadow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shadow
  template:
    metadata:
      labels:
        app: shadow
    spec:
      containers:
        - name: shadow
          image: REPLACE_SHADOW_IMAGE
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: shadow-config
            - secretRef:
                name: shadow-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: shadow-data
              mountPath: /var/lib/shadow
      volumes:
        - name: shadow-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shadow
  namespace: shadow
  labels:
    app: shadow
spec:
  selector:
    app: shadow
  ports:
    - name: http
      port: 80
      targetPort: http
