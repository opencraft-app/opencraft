server {
    listen 8080;
    server_name lightvela.tencent.com www.lightvela.tencent.com;
    absolute_redirect off;
    port_in_redirect off;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 302 https://lightvela.com$request_uri;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # A real WeChat browser obtains openid through OAuth. Localstack hands the
    # initial bridge request to an explicit fake external service; the callback
    # returns here with openid and continues through the real payment page.
    location = /auth/wechat-pay {
        if ($arg_openid = "") {
            return 302 http://localhost:19040/auth/wechat-pay?$args;
        }
        try_files $uri /index.html;
    }

    location = /dashboard {
        return 301 https://$http_host/dashboard/settings;
    }

    location = /dashboard/ {
        return 301 https://$http_host/dashboard/settings;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
