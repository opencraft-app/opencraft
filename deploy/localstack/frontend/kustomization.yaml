apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: localstack-frontend
resources:
  - manifests.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: frontend-nginx
    files:
      - default.conf=nginx.conf
labels:
  - pairs:
      app.kubernetes.io/part-of: lightclaw-localstack
    includeSelectors: false
    includeTemplates: true
