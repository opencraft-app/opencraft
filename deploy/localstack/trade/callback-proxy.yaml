apiVersion: v1
kind: ConfigMap
metadata:
  name: trade-callback-proxy
  namespace: trade
data:
  default.conf: |
    server {
      listen 8080 default_server;
      server_name _;

      location = /healthz {
        proxy_pass http://trade.trade.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
      }

      location = /trade/jifei/callback {
        proxy_pass http://trade.trade.svc.cluster.local;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
      }

      location / {
        return 404;
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-callback-proxy
  namespace: trade
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trade-callback-proxy
  template:
    metadata:
      labels:
        app: trade-callback-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: config
          configMap:
            name: trade-callback-proxy
---
apiVersion: v1
kind: Service
metadata:
  name: trade-callback-proxy
  namespace: trade
spec:
  selector:
    app: trade-callback-proxy
  ports:
    - name: http
      port: 80
      targetPort: http
