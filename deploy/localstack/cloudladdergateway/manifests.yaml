apiVersion: v1
kind: Namespace
metadata:
  name: cloudladdergateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudladdergateway
  namespace: cloudladdergateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudladdergateway
  template:
    metadata:
      labels:
        app: cloudladdergateway
    spec:
      containers:
        - name: cloudladdergateway
          image: lightclaw-local/cloudladdergateway:dev
          imagePullPolicy: IfNotPresent
          env:
            - name: CLOUDLADDERGATEWAY_CONFIG
              value: /etc/cloudladdergateway/config.yaml
          envFrom:
            - secretRef:
                name: cloudladdergateway-runtime-secrets
          ports:
            - name: http
              containerPort: 8095
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          volumeMounts:
            - name: config
              mountPath: /etc/cloudladdergateway/config.yaml
              subPath: config.yaml
      volumes:
        - name: config
          configMap:
            name: cloudladdergateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: cloudladdergateway
  namespace: cloudladdergateway
spec:
  selector:
    app: cloudladdergateway
  ports:
    - name: http
      port: 8095
      targetPort: http
