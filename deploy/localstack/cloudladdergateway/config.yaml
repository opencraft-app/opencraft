addr: ":8095"
max_body_bytes: 10485760

transport:
  max_idle_conns: 100
  max_idle_conns_per_host: 20
  idle_conn_timeout: 90s
  response_header_timeout: 30s
  tls_handshake_timeout: 10s
  expect_continue_timeout: 1s

discovery:
  polaris:
    sidecar_url: http://127.0.0.1:9
    cache_ttl: 30s
    stale_on_error: true

auth:
  enabled: true
  timestamp_skew: 5m
  allow_unauthenticated:
    - jifei-test
  callers:
    - id: shadow
      secret_env: CLOUDLADDER_SHADOW_HMAC_SECRET
      routes:
        - tcapi-account-cn-test
        - tcapi-cam-cn-test
        - tcapi-sts-cn-test

audit:
  service_name: cloudladdergateway-local
  stdout: true
  otlp:
    enabled: false

backends:
  - alias: jifei-local
    upstream:
      base_url: http://fake-jifei.localstack-system.svc.cluster.local:19020
      timeout: 10s
      allowed_methods: [POST]
      headers:
        Host: trade.itd.com
  - alias: tcapi-account-local
    upstream:
      base_url: http://fake-tencentcloud.localstack-system.svc.cluster.local:19030
      timeout: 10s
      allowed_methods: [POST]
      headers:
        Host: account.test.tencentcloudapi.com
  - alias: tcapi-cam-local
    upstream:
      base_url: http://fake-tencentcloud.localstack-system.svc.cluster.local:19030
      timeout: 10s
      allowed_methods: [POST]
      headers:
        Host: cam.test.tencentcloudapi.com
  - alias: tcapi-sts-local
    upstream:
      base_url: http://fake-tencentcloud.localstack-system.svc.cluster.local:19030
      timeout: 10s
      allowed_methods: [POST]
      headers:
        Host: sts.test.tencentcloudapi.com

routes:
  - id: jifei-test
    description: Local Trade to fake Jifei CGW boundary.
    condition: 'request.method == "POST"'
    upstream:
      backend: jifei-local
  - id: tcapi-account-cn-test
    description: Local Shadow account API signed tunnel.
    mode: signed_http_tunnel
    callers: [shadow]
    condition: 'request.method == "POST"'
    upstream:
      backend: tcapi-account-local
  - id: tcapi-cam-cn-test
    description: Local Shadow CAM API signed tunnel.
    mode: signed_http_tunnel
    callers: [shadow]
    condition: 'request.method == "POST"'
    upstream:
      backend: tcapi-cam-local
  - id: tcapi-sts-cn-test
    description: Local Shadow STS API signed tunnel.
    mode: signed_http_tunnel
    callers: [shadow]
    condition: 'request.method == "POST"'
    upstream:
      backend: tcapi-sts-local
