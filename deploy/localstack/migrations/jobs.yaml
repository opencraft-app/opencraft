apiVersion: batch/v1
kind: Job
metadata:
  name: lightclaw-auth-migrate
  namespace: user-auth
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: lightclaw-local/lightclaw-auth:dev
          imagePullPolicy: IfNotPresent
          command: [lightclaw-auth-migrate]
          envFrom:
            - configMapRef:
                name: lightclaw-auth-config
            - secretRef:
                name: lightclaw-auth-secrets
---
