apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-migrate
  namespace: sandbox
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: lightclaw-local/sandbox-migrate:dev
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              db_url="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/${MYSQL_DB}?multiStatements=true"
              migrate -path /migrations -database "${db_url}" up
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
---
