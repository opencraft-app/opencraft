# Production external-MySQL overlay template.
#
# This file is intentionally not directly deployable. Copy it into an
# environment overlay, replace every REPLACE_* value, and keep secrets in SOPS,
# SSM, or another secret manager.

vitess:
  images:
    vtctld: REPLACE_TCR_REGISTRY/temporal-vitess/vitess-lite:REPLACE_PINNED_TAG
    vtadmin: REPLACE_TCR_REGISTRY/temporal-vitess/vtadmin:REPLACE_PINNED_TAG
    vtgate: REPLACE_TCR_REGISTRY/temporal-vitess/vitess-lite:REPLACE_PINNED_TAG
    vttablet: REPLACE_TCR_REGISTRY/temporal-vitess/vitess-lite:REPLACE_PINNED_TAG

  topologyEtcd:
    enabled: false

  vschema:
    image: REPLACE_TCR_REGISTRY/temporal-vitess/vitess-lite:REPLACE_PINNED_TAG
    temporalAdminToolsImage: REPLACE_TCR_REGISTRY/temporal-vitess/temporal-admin-tools:REPLACE_TEMPORAL_TAG
    argoHooks:
      enabled: true
      hook: Sync
      syncWave: "20"
      deletePolicy: BeforeHookCreation,HookSucceeded

  cluster:
    globalLockserver:
      enabled: true
      implementation: etcd2
      address: REPLACE_MANAGED_ETCD_HOST_PORT
      rootPath: /vitess/temporal-vitess-prod/global

    externalDatastore:
      user: vt_dba
      credentialsSecret:
        create: false
        name: temporal-vitess-external-mysql
        key: credentials.json

    vtgate:
      replicas: 3
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 2Gi

    vtctld:
      replicas: 3
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 1Gi

    vtadmin:
      enabled: true
      replicas: 2
      apiResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      webResources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi

    vttablet:
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 2Gi

    keyspaces:
      - name: temporal
        externalShards:
          - keyRange: {}
            host: REPLACE_TEMPORAL_MYSQL_HOST
            port: 3306
            database: temporal

      - name: temporal_sharded
        externalShards:
          - keyRange:
              end: "80"
            host: REPLACE_TEMPORAL_SHARDED_LEFT_MYSQL_HOST
            port: 3306
            database: temporal_sharded
          - keyRange:
              start: "80"
            host: REPLACE_TEMPORAL_SHARDED_RIGHT_MYSQL_HOST
            port: 3306
            database: temporal_sharded

      - name: temporal_visibility
        externalShards:
          - keyRange: {}
            host: REPLACE_TEMPORAL_VISIBILITY_MYSQL_HOST
            port: 3306
            database: temporal_visibility

temporal:
  schema:
    useHelmHooks: false
    backoffLimit: 60
    ttlSecondsAfterFinished: "2592000"

  server:
    replicaCount: 2
    frontend:
      replicaCount: 3
      readinessProbeOverride:
        tcpSocket:
          port: rpc
    history:
      replicaCount: 3
    matching:
      replicaCount: 3
    worker:
      replicaCount: 2
    config:
      logLevel: "info"
      namespaces:
        create: true
        namespace:
          - name: default
            retention: 7d
      persistence:
        numHistoryShards: 4096
        datastores:
          default:
            sql:
              maxConns: 100
              maxIdleConns: 50
              maxConnLifetime: 1h
          visibility:
            sql:
              maxConns: 50
              maxIdleConns: 25
              maxConnLifetime: 1h
    additionalInitContainers:
      - name: wait-for-vtgate
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z vitess-vtgate-mysql 3306; do
              echo "waiting for Vitess VTGate"
              sleep 5
            done
      - name: wait-for-temporal-routing
        image: REPLACE_TCR_REGISTRY/temporal-vitess/vitess-lite:REPLACE_PINNED_TAG
        command:
          - sh
          - -c
          - |
            until /vt/bin/vtctldclient --server=vitess-vtctld:15999 GetRoutingRules | grep -q 'temporal_sharded.executions'; do
              echo "waiting for Temporal sharded routing rules"
              sleep 5
            done

  admintools:
    enabled: true
    additionalInitContainers:
      - name: wait-for-vtgate
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z vitess-vtgate-mysql 3306; do
              echo "waiting for Vitess VTGate before Temporal schema"
              sleep 5
            done
      - name: wait-for-temporal-vschema
        image: REPLACE_TCR_REGISTRY/temporal-vitess/vitess-lite:REPLACE_PINNED_TAG
        command:
          - sh
          - -c
          - |
            until /vt/bin/vtctldclient --server=vitess-vtctld:15999 GetVSchema temporal_sharded | grep -q '"sharded": true'; do
              echo "waiting for Temporal sharded VSchema"
              sleep 5
            done
      - name: wait-for-temporal-keyspaces
        image: REPLACE_TCR_REGISTRY/temporal-vitess/vitess-lite:REPLACE_PINNED_TAG
        command:
          - sh
          - -c
          - |
            for db in temporal temporal_sharded temporal_visibility; do
              until mysql -h vitess-vtgate-mysql -P 3306 -u user -D "$db" -e 'select 1' >/dev/null 2>&1; do
                echo "waiting for healthy Vitess primary in $db"
                sleep 5
              done
            done

  web:
    enabled: true
