# Single-MySQL E2E overlay template.
#
# Use this before the four-MySQL production-like topology. It validates the
# Temporal -> VTGate -> VTTablet -> external MySQL path with one MySQL instance
# and separate schemas for each logical shard. Replace every REPLACE_* value
# before installing.

vitess:
  topologyEtcd:
    enabled: true

  cluster:
    globalLockserver:
      enabled: true
      implementation: etcd2
      address: ""
      rootPath: /vitess/temporal-vitess-e2e/global

    externalDatastore:
      user: vt_dba
      credentialsSecret:
        create: false
        name: temporal-vitess-external-mysql
        key: credentials.json

    vtgate:
      replicas: 1
    vtctld:
      replicas: 1
    vtadmin:
      enabled: true
      replicas: 1

    keyspaces:
      - name: temporal
        externalShards:
          - keyRange: {}
            host: REPLACE_SINGLE_MYSQL_HOST
            port: 3306
            database: temporal

      - name: temporal_sharded
        externalShards:
          - keyRange:
              end: "80"
            host: REPLACE_SINGLE_MYSQL_HOST
            port: 3306
            database: temporal_sharded_00_80
          - keyRange:
              start: "80"
            host: REPLACE_SINGLE_MYSQL_HOST
            port: 3306
            database: temporal_sharded_80_ff

      - name: temporal_visibility
        externalShards:
          - keyRange: {}
            host: REPLACE_SINGLE_MYSQL_HOST
            port: 3306
            database: temporal_visibility

temporal:
  server:
    replicaCount: 1
    frontend:
      replicaCount: 1
      readinessProbeOverride:
        tcpSocket:
          port: rpc
    history:
      replicaCount: 1
    matching:
      replicaCount: 1
    worker:
      replicaCount: 1
    config:
      logLevel: "info"
      namespaces:
        create: true
        namespace:
          - name: default
            retention: 1d
      persistence:
        numHistoryShards: 4096
        datastores:
          default:
            sql:
              maxConns: 20
              maxIdleConns: 10
              maxConnLifetime: 1h
          visibility:
            sql:
              maxConns: 10
              maxIdleConns: 5
              maxConnLifetime: 1h

  admintools:
    enabled: true

  web:
    enabled: true
