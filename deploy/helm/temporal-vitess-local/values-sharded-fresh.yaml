vitess:
  operator:
    priorityClasses:
      create: true
      use: false
  vschema:
    enabled: true
    tables:
      shardId:
        - activity_info_maps
        - buffered_events
        - chasm_node_maps
        - child_execution_info_maps
        - current_chasm_executions
        - current_executions
        - executions
        - history_immediate_tasks
        - history_node
        - history_scheduled_tasks
        - history_tree
        - replication_tasks
        - replication_tasks_dlq
        - request_cancel_info_maps
        - shards
        - signal_info_maps
        - signals_requested_sets
        - timer_info_maps
        - timer_tasks
        - transfer_tasks
        - visibility_tasks
      rangeHash:
        - task_queues
        - task_queues_v2
        - tasks
        - tasks_v2
      vindexed:
        build_id_to_task_queue: namespace_id
        cluster_membership: membership_partition
        cluster_metadata: metadata_partition
        cluster_metadata_info: metadata_partition
        namespace_metadata: partition_id
        namespaces: partition_id
        nexus_endpoints: id
        nexus_endpoints_partition_status: id
        queue: queue_type
        queue_messages: queue_type
        queue_metadata: queue_type
        queues: queue_type
        schema_update_history: version_partition
        schema_version: version_partition
        task_queue_user_data: namespace_id
      reference: []
temporal:
  server:
    config:
      persistence:
        numHistoryShards: 4096
    additionalInitContainers:
      - name: wait-for-vtgate
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z vitess-vtgate-mysql 3306; do
              echo "waiting for Vitess VTGate"
              sleep 5
            done
      - name: wait-for-temporal-routing
        image: vitess/lite:latest
        command:
          - sh
          - -c
          - |
            until /vt/bin/vtctldclient --server=vitess-vtctld:15999 GetRoutingRules | grep -q 'temporal_sharded.executions'; do
              echo "waiting for Temporal sharded routing rules"
              sleep 5
            done
  admintools:
    additionalInitContainers:
      - name: wait-for-vtgate
        image: busybox:1.36
        command:
          - sh
          - -c
          - |
            until nc -z vitess-vtgate-mysql 3306; do
              echo "waiting for Vitess VTGate before Temporal schema"
              sleep 5
            done
      - name: wait-for-temporal-vschema
        image: vitess/lite:latest
        command:
          - sh
          - -c
          - |
            until /vt/bin/vtctldclient --server=vitess-vtctld:15999 GetVSchema temporal_sharded | grep -q '"sharded": true'; do
              echo "waiting for Temporal sharded VSchema"
              sleep 5
            done
      - name: wait-for-temporal-keyspaces
        image: vitess/lite:latest
        command:
          - sh
          - -c
          - |
            for db in temporal temporal_sharded temporal_visibility; do
              until mysql -h vitess-vtgate-mysql -P 3306 -u user -D "$db" -e 'select 1' >/dev/null 2>&1; do
                echo "waiting for healthy Vitess primary in $db"
                sleep 5
              done
            done
