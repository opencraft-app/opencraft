{{- if .Values.vitess.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.vitess.operator.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.vitess.operator.serviceAccountName }}-backup-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
rules:
  - apiGroups: ["planetscale.com"]
    resources:
      - vitessshards
      - vitessshards/status
      - vitessshards/finalizers
      - vitessbackups
      - vitessbackups/status
      - vitessbackups/finalizers
      - vitessbackupstorages
      - vitessbackupstorages/status
      - vitessbackupstorages/finalizers
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "temporal-vitess-local.fullname" . }}-vitess-operator
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods, services, endpoints, persistentvolumeclaims, events, configmaps, secrets]
    verbs: ["*"]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets, statefulsets]
    verbs: ["*"]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: ["*"]
  - apiGroups: [apps]
    resourceNames: [vitess-operator]
    resources: [deployments/finalizers]
    verbs: [update]
  - apiGroups: [planetscale.com]
    resources:
      - vitessclusters
      - vitessclusters/status
      - vitessclusters/finalizers
      - vitesscells
      - vitesscells/status
      - vitesscells/finalizers
      - vitesskeyspaces
      - vitesskeyspaces/status
      - vitesskeyspaces/finalizers
      - vitessshards
      - vitessshards/status
      - vitessshards/finalizers
      - etcdlockservers
      - etcdlockservers/status
      - etcdlockservers/finalizers
      - vitessbackups
      - vitessbackups/status
      - vitessbackups/finalizers
      - vitessbackupstorages
      - vitessbackupstorages/status
      - vitessbackupstorages/finalizers
      - vitessbackupschedules
      - vitessbackupschedules/status
      - vitessbackupschedules/finalizers
    verbs: ["*"]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: ["*"]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.vitess.operator.serviceAccountName }}-backup-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Values.vitess.operator.serviceAccountName }}-backup-storage
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vitess.operator.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "temporal-vitess-local.fullname" . }}-vitess-operator
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "temporal-vitess-local.fullname" . }}-vitess-operator
subjects:
  - kind: ServiceAccount
    name: {{ .Values.vitess.operator.serviceAccountName }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.vitess.operator.priorityClasses.create }}
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vitess
value: 1000
globalDefault: false
description: Vitess local sandbox components.
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: vitess-operator-control-plane
value: 5000
globalDefault: false
description: Vitess operator control plane for the local sandbox.
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vitess-operator
  namespace: {{ .Release.Namespace }}
  labels:
    app: vitess-operator
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vitess-operator
  template:
    metadata:
      labels:
        app: vitess-operator
    spec:
      serviceAccountName: {{ .Values.vitess.operator.serviceAccountName }}
      {{- if .Values.vitess.operator.priorityClasses.use }}
      priorityClassName: vitess-operator-control-plane
      {{- end }}
      securityContext:
        fsGroup: 999
      containers:
        - name: vitess-operator
          image: {{ .Values.vitess.operator.image | quote }}
          imagePullPolicy: {{ .Values.vitess.operator.imagePullPolicy }}
          command: [vitess-operator]
          args:
            - --logtostderr
            - -v={{ .Values.vitess.operator.verbosity }}
          env:
            - name: WATCH_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PS_OPERATOR_POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: PS_OPERATOR_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: vitess-operator
          resources:
            {{- toYaml .Values.vitess.operator.resources | nindent 12 }}
{{- end }}
