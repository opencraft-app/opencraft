{{- if .Values.vitess.topologyEtcd.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.vitess.topologyEtcd.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: topology-etcd
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: topology-etcd
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: client
      port: 2379
      targetPort: 2379
    - name: peer
      port: 2380
      targetPort: 2380
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.vitess.topologyEtcd.serviceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/component: topology-etcd
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: topology-etcd
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: topology-etcd
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      initContainers:
        - name: fix-etcd-data-permissions
          image: {{ .Values.vitess.topologyEtcd.initPermissionsImage | quote }}
          command:
            - sh
            - -c
            - chown -R 1001:1001 /var/etcd
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/etcd
      containers:
        - name: etcd
          image: {{ .Values.vitess.topologyEtcd.image | quote }}
          command:
            - /opt/bitnami/etcd/bin/etcd
          args:
            - --name=topology-etcd-1
            - --data-dir=/var/etcd
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://{{ .Values.vitess.topologyEtcd.serviceName }}:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://{{ .Values.vitess.topologyEtcd.serviceName }}:2380
            - --initial-cluster=topology-etcd-1=http://{{ .Values.vitess.topologyEtcd.serviceName }}:2380
            - --initial-cluster-state=new
            - --initial-cluster-token={{ .Release.Name }}-topology-etcd
          env:
            - name: ETCDCTL_API
              value: "3"
            - name: ETCD_AUTO_COMPACTION_MODE
              value: revision
            - name: ETCD_AUTO_COMPACTION_RETENTION
              value: "1000"
          ports:
            - name: client
              containerPort: 2379
            - name: peer
              containerPort: 2380
          readinessProbe:
            exec:
              command:
                - /opt/bitnami/etcd/bin/etcdctl
                - endpoint
                - health
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - /opt/bitnami/etcd/bin/etcdctl
                - endpoint
                - status
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.vitess.topologyEtcd.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/etcd
      volumes:
        - name: data
          emptyDir: {}
{{- end }}
