{{- if .Values.vitess.cluster.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vitess.cluster.configSecretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
type: Opaque
stringData:
  users.json: |
    {
      "user": [{
        "UserData": "user",
        "Password": ""
      }]
    }
  rbac.yaml: |
    rules:
    - resource: "*"
      actions:
        - "get"
        - "create"
        - "put"
        - "ping"
      subjects: ["*"]
      clusters: ["*"]
  init_db.sql: |
    SET @original_super_read_only=IF(@@global.super_read_only=1, 'ON', 'OFF');
    SET GLOBAL super_read_only='OFF';
    SET sql_log_bin = 0;

    DROP USER IF EXISTS ''@'%', ''@'localhost', 'root'@'%';
    DROP DATABASE IF EXISTS test;

    CREATE USER 'vt_dba'@'localhost';
    GRANT ALL ON *.* TO 'vt_dba'@'localhost';
    GRANT GRANT OPTION ON *.* TO 'vt_dba'@'localhost';
    GRANT PROXY ON ''@'' TO 'vt_dba'@'localhost' WITH GRANT OPTION;

    CREATE USER 'vt_app'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_app'@'localhost';

    CREATE USER 'vt_appdebug'@'localhost';
    GRANT SELECT, SHOW DATABASES, PROCESS ON *.* TO 'vt_appdebug'@'localhost';

    CREATE USER 'vt_allprivs'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_allprivs'@'localhost';

    CREATE USER 'vt_repl'@'%';
    GRANT REPLICATION SLAVE ON *.* TO 'vt_repl'@'%';

    CREATE USER 'vt_filtered'@'localhost';
    GRANT SELECT, INSERT, UPDATE, DELETE, CREATE, DROP, RELOAD, PROCESS, FILE,
      REFERENCES, INDEX, ALTER, SHOW DATABASES, CREATE TEMPORARY TABLES,
      LOCK TABLES, EXECUTE, REPLICATION SLAVE, REPLICATION CLIENT, CREATE VIEW,
      SHOW VIEW, CREATE ROUTINE, ALTER ROUTINE, CREATE USER, EVENT, TRIGGER
      ON *.* TO 'vt_filtered'@'localhost';

    CREATE USER 'vt_monitoring'@'localhost';
    GRANT SELECT, PROCESS, SUPER, REPLICATION CLIENT, RELOAD ON *.* TO 'vt_monitoring'@'localhost';
    GRANT SELECT, UPDATE, DELETE, DROP ON performance_schema.* TO 'vt_monitoring'@'localhost';

    SET GLOBAL super_read_only=IFNULL(@original_super_read_only, 'ON');
{{- if not .Values.vitess.cluster.globalLockserver.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "temporal-vitess-local.fullname" . }}-etcd-wrapper
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
data:
  etcd: |
    #!/bin/sh
    exec /opt/bitnami/etcd/bin/etcd "$@"
  etcdctl: |
    #!/bin/sh
    exec /opt/bitnami/etcd/bin/etcdctl "$@"
{{- end }}
{{- if .Values.vitess.cluster.externalDatastore.credentialsSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.vitess.cluster.externalDatastore.credentialsSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.vitess.cluster.externalDatastore.credentialsSecret.key }}: |
    {{- toJson .Values.vitess.cluster.externalDatastore.credentialsSecret.credentials | nindent 4 }}
{{- end }}
---
apiVersion: planetscale.com/v2
kind: VitessCluster
metadata:
  name: {{ .Values.vitess.cluster.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
spec:
  images:
    vtctld: {{ .Values.vitess.images.vtctld | quote }}
    vtadmin: {{ .Values.vitess.images.vtadmin | quote }}
    vtgate: {{ .Values.vitess.images.vtgate | quote }}
    vttablet: {{ .Values.vitess.images.vttablet | quote }}
  {{- if .Values.vitess.cluster.globalLockserver.enabled }}
  {{- $globalLockserverAddress := .Values.vitess.cluster.globalLockserver.address }}
  {{- if and (not $globalLockserverAddress) .Values.vitess.topologyEtcd.enabled }}
  {{- $globalLockserverAddress = printf "%s:2379" .Values.vitess.topologyEtcd.serviceName }}
  {{- end }}
  globalLockserver:
    external:
      implementation: {{ .Values.vitess.cluster.globalLockserver.implementation | quote }}
      address: {{ required "vitess.cluster.globalLockserver.address is required when no topologyEtcd service is enabled" $globalLockserverAddress | quote }}
      rootPath: {{ .Values.vitess.cluster.globalLockserver.rootPath | quote }}
  {{- else }}
  globalLockserver:
    etcd:
      image: {{ .Values.vitess.cluster.globalLockserver.etcd.image | quote }}
      dataVolumeClaimTemplate:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.vitess.cluster.globalLockserver.etcd.storage }}
      initContainers:
        - name: fix-etcd-data-permissions
          image: {{ .Values.vitess.cluster.globalLockserver.etcd.initPermissionsImage | quote }}
          command:
            - sh
            - -c
            - chown -R 1001:1001 /var/etcd
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: data
              mountPath: /var/etcd
              subPath: etcd
      extraVolumes:
        - name: etcd-wrapper
          configMap:
            name: {{ include "temporal-vitess-local.fullname" . }}-etcd-wrapper
            defaultMode: 0555
      extraVolumeMounts:
        - name: etcd-wrapper
          mountPath: /usr/local/bin/etcd
          subPath: etcd
        - name: etcd-wrapper
          mountPath: /usr/local/bin/etcdctl
          subPath: etcdctl
  {{- end }}
  cells:
    - name: {{ .Values.vitess.cluster.cell }}
      gateway:
        authentication:
          static:
            secret:
              name: {{ .Values.vitess.cluster.configSecretName }}
              key: users.json
        replicas: {{ .Values.vitess.cluster.vtgate.replicas }}
        extraFlags:
          log-format: text
        resources:
          {{- toYaml .Values.vitess.cluster.vtgate.resources | nindent 10 }}
  vitessDashboard:
    cells:
      - {{ .Values.vitess.cluster.cell }}
    extraFlags:
      security-policy: read-only
      log-format: text
    replicas: {{ .Values.vitess.cluster.vtctld.replicas }}
    resources:
      {{- toYaml .Values.vitess.cluster.vtctld.resources | nindent 6 }}
  {{- if .Values.vitess.cluster.vtadmin.enabled }}
  vtadmin:
    rbac:
      name: {{ .Values.vitess.cluster.configSecretName }}
      key: rbac.yaml
    cells:
      - {{ .Values.vitess.cluster.cell }}
    apiAddresses:
      - http://localhost:14001
    replicas: {{ .Values.vitess.cluster.vtadmin.replicas }}
    readOnly: false
    apiResources:
      {{- toYaml .Values.vitess.cluster.vtadmin.apiResources | nindent 6 }}
    webResources:
      {{- toYaml .Values.vitess.cluster.vtadmin.webResources | nindent 6 }}
  {{- end }}
  {{- if .Values.vitess.cluster.keyspaces }}
  keyspaces:
    {{- range .Values.vitess.cluster.keyspaces }}
    {{- $keyspaceName := .name }}
    {{- if not .externalShards }}
      {{- fail (printf "vitess.cluster.keyspaces[%s].externalShards is required; this chart is external MySQL only" $keyspaceName) }}
    {{- end }}
    - name: {{ .name }}
      durabilityPolicy: none
      turndownPolicy: Immediate
      partitionings:
        - custom:
            shards:
              {{- range .externalShards }}
              {{- $start := default "" .keyRange.start }}
              {{- $end := default "" .keyRange.end }}
              - {{- if or $start $end }}
                keyRange:
                  {{- if $start }}
                  start: {{ $start | quote }}
                  {{- end }}
                  {{- if $end }}
                  end: {{ $end | quote }}
                  {{- end }}
                {{- else }}
                keyRange: {}
                {{- end }}
                databaseInitScriptSecret:
                  name: {{ $.Values.vitess.cluster.configSecretName }}
                  key: init_db.sql
                tabletPools:
                  - cell: {{ $.Values.vitess.cluster.cell }}
                    type: {{ default "externalmaster" .tabletType }}
                    replicas: {{ default 1 .tabletReplicas }}
                    vttablet:
                      extraFlags:
                        db-charset: utf8mb4
                        log-format: text
                      resources:
                        {{- toYaml $.Values.vitess.cluster.vttablet.resources | nindent 24 }}
                    externalDatastore:
                      user: {{ default $.Values.vitess.cluster.externalDatastore.user .user | quote }}
                      host: {{ required "externalShards[].host is required" .host | quote }}
                      port: {{ default 3306 .port }}
                      database: {{ default $keyspaceName .database | quote }}
                      credentialsSecret:
                        name: {{ default $.Values.vitess.cluster.externalDatastore.credentialsSecret.name .credentialsSecretName | quote }}
                        key: {{ default $.Values.vitess.cluster.externalDatastore.credentialsSecret.key .credentialsSecretKey | quote }}
              {{- end }}
    {{- end }}
  {{- else }}
  keyspaces: []
  {{- end }}
  updateStrategy:
    type: Immediate
{{- end }}
