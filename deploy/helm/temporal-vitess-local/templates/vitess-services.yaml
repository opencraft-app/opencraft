{{- if .Values.vitess.cluster.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.vitess.vtgateServiceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    planetscale.com/cluster: {{ .Values.vitess.cluster.name }}
    planetscale.com/component: vtgate
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.vitess.vtctldServiceName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "temporal-vitess-local.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    planetscale.com/cluster: {{ .Values.vitess.cluster.name }}
    planetscale.com/component: vtctld
  ports:
    - name: grpc
      port: 15999
      targetPort: 15999
      protocol: TCP
    - name: http
      port: 15000
      targetPort: 15000
      protocol: TCP
{{- end }}
