apiVersion: v1
kind: Namespace
metadata:
  name: frontend-preview
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: frontend-preview
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staticpages
  namespace: frontend-preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staticpages
  template:
    metadata:
      labels:
        app: staticpages
      annotations:
        staticpages.lightclaw.dev/redeploy-at: REPLACE_STATICPAGES_DEPLOYED_AT
    spec:
      nodeSelector:
        pool: REPLACE_STATICPAGES_NODE_POOL
      containers:
        - name: staticpages
          image: REPLACE_STATICPAGES_IMAGE
          imagePullPolicy: Always
          args:
            - serve
            - --api
            - --proxy
            - --config
            - /etc/staticpages/config.yaml
          envFrom:
            - secretRef:
                name: staticpages-runtime-secrets
          ports:
            - name: proxy
              containerPort: 8080
            - name: api
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: api
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: config
              mountPath: /etc/staticpages/config.yaml
              subPath: config.yaml
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: staticpages-config
---
apiVersion: v1
kind: Service
metadata:
  name: staticpages
  namespace: frontend-preview
  labels:
    app: staticpages
spec:
  selector:
    app: staticpages
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
    - name: api
      port: 8081
      targetPort: api
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: staticpages-preview
  namespace: frontend-preview
  annotations:
    kubernetes.io/ingress.class: qcloud
    ingress.cloud.tencent.com/modification-protection: "false"
    ingress.cloud.tencent.com/direct-access: "true"
spec:
  ingressClassName: qcloud
  rules:
    - host: REPLACE_STATICPAGES_API_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: staticpages
                port:
                  name: api
    - host: REPLACE_STATICPAGES_PREVIEW_WILDCARD_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: staticpages
                port:
                  name: proxy
