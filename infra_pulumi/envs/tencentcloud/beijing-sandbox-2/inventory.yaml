env_name: beijing-sandbox-2
cloud: tencentcloud
region: ap-beijing
zone_primary: ap-beijing-8
env_short: bj82

network:
  vpc_cidr: 10.16.0.0/12
  support_subnet_key: support
  sandbox_pool_subnet_keys:
    - pool-a
    - pool-b
    - pool-c
    - pool-d
    - pool-e
    - pool-f
    - support

domains:
  public_api: https://api-bj82.lightclaw.tech
  admin: https://admin-bj82.lightclaw.tech
  frontend_static: https://bj82.lightclaw.pages.dev

stacks:
  tke:
    cluster_version: "1.30.0"
    network_type: VPC-CNI
    service_cidr: 172.18.255.0/24
    vpc_cni_type: tke-route-eni
    cluster_cidr: 172.18.0.0/16
    subnet_id: __SUPPORT_SUBNET_ID__
    availability_zone: ap-beijing-8
    cluster_internet: true
    cluster_internet_cidrs:
      - 0.0.0.0/0
    instance_type: SA9.MEDIUM2
    node_pool_min_size: 1
    node_pool_desired_capacity: 15
    node_pool_max_size: 20
    worker_img_id: img-1tmhysjj
    node_pool_public_ingress_ports:
      - 18080
      - 8084
      - 32050
      - 32299
      - 32331
      - 32310
      - 32498
      - 30671

  cynosdb:
    availability_zone: ap-beijing-8
    db_version: "8.0"
    subnet_id: __SUPPORT_SUBNET_ID__
    cluster_cidr: 172.18.0.0/16
    instance_cpu_core: 2
    instance_memory_size: 4
    storage_limit: 100

  networking:
    primary_nat_gateway_name: NATGW
    secondary_nat_gateway_name: def
    primary_eips:
      eip-bj82-primary-01: { bandwidth: 200 }
    secondary_eips:
      eip-bj82-secondary-01: { bandwidth: 200 }
    route_table_name: default
    snat_subnets:
      pool-a:
        availability_zone: ap-beijing-4
        description: claw-subnet-bj82-1
      pool-b:
        availability_zone: ap-beijing-5
        description: claw-subnet-bj82-2
      pool-c:
        availability_zone: ap-beijing-6
        description: claw-subnet-bj82-3
      pool-d:
        availability_zone: ap-beijing-7
        description: claw-subnet-bj82-4
      pool-e:
        availability_zone: ap-beijing-8
        description: claw-subnet-bj82-5
      pool-f:
        availability_zone: ap-beijing-6
        description: claw-subnet-bj82-6
      support:
        availability_zone: ap-beijing-8
        description: claw-subnet-bj82-support

  security:
    sandbox_sg:
      security_group_name: sandbox-isolated-sg
      description: "Isolated sandbox instances: ingress only from TKE node SG, egress to internet"
      ingress:
        - ACCEPT#__TKE_NODE_SECURITY_GROUP_ID__#ALL#ALL#allow from tke node sg
        - ACCEPT#172.18.0.0/16#ALL#ALL#allow from tke pod cidr
      egress:
        - ACCEPT#0.0.0.0/0#ALL#ALL#allow outbound to internet and vpc

  redis:
    ctl_mq:
      availability_zone: ap-beijing-8
      mem_size: 1024
      type_id: 18
      subnet_id: __SUPPORT_SUBNET_ID__
      redis_shard_num: 3
      redis_replicas_num: 1
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__
    sandbox_route:
      availability_zone: ap-beijing-8
      mem_size: 1024
      type_id: 18
      subnet_id: __SUPPORT_SUBNET_ID__
      redis_shard_num: 8
      redis_replicas_num: 3
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__

  tcr:
    instance_type: basic
    namespace_name: lightclaw
    open_public_operation: true
    tags:
      env: beijing-sandbox-2
      app: lightclaw
    pull_service_account_name: lightclaw-pull
    pull_service_account_duration_days: 3650

  storage:
    manage_cam_access: false

  monitoring:
    cls_logs:
      logset_name: clawhub-beijing-sandbox-2
      topic_name: service-gateway-access
    ctl_cls_logs:
      topic_name: ctl-runtime
    sandbox_cls_logs:
      topic_name: sandbox-runtime

  compute:
    jumpserver:
      availability_zone: ap-beijing-8
      instance_type: SA9.MEDIUM2
      instance_charge_type: POSTPAID_BY_HOUR
      system_disk_type: CLOUD_PREMIUM
      system_disk_size: 50
      subnet_id: __SUPPORT_SUBNET_ID__
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__
      user_data_raw: |
        #!/bin/bash
        apt-get update
        apt-get install -y curl
