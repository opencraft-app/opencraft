env_name: sgprod
cloud: tencentcloud
region: ap-singapore
zone_primary: ap-singapore-2
env_short: sgprod

network:
  support_subnet_key: support
  sandbox_pool_subnet_keys:
    - pool-a
    - pool-b
    - pool-c
    - pool-d
    - pool-e
    - pool-f
    - support

domains:
  public_api: https://api.lightvela.ai
  admin: https://admin.lightvela.ai
  frontend_static: https://lightvela.ai
  model_api_internal: http://llm.lightvela.ai

stacks:
  tke:
    cluster_name: tke-sgprod
    node_pool_name: general-sgprod
    cluster_version: "1.30.0"
    network_type: VPC-CNI
    service_cidr: 10.48.255.0/24
    vpc_cni_type: tke-route-eni
    cluster_cidr: 172.20.0.0/16
    subnet_id: __SUPPORT_SUBNET_ID__
    availability_zone: ap-singapore-2
    cluster_internet: true
    cluster_internet_cidrs:
      - 0.0.0.0/0
    instance_type: SA5.LARGE8
    node_pool_min_size: 1
    node_pool_desired_capacity: 10
    node_pool_max_size: 30
    node_pool_system_disk_type: CLOUD_BSSD
    node_pool_system_disk_size: 50
    manage_scale_worker: false
    worker_img_id: img-mmytdhbn
    node_pool_public_ingress_ports:
      - 18080
      - 8084
      - 32050
      - 32299
      - 32331
      - 32310
      - 32498
      - 30671

  cynosdb:
    availability_zone: ap-singapore-2
    db_version: "8.0"
    subnet_id: __SUPPORT_SUBNET_ID__
    cluster_cidr: 172.20.0.0/16
    instance_cpu_core: 2
    instance_memory_size: 4
    storage_limit: 100

  networking:
    primary_nat_gateway_name: NATGW
    secondary_nat_gateway_name: def
    primary_eips:
      eip-sgprod-primary-01: { bandwidth: 200 }
      eip-sgprod-primary-02: { bandwidth: 200 }
      eip-sgprod-primary-03: { bandwidth: 200 }
      eip-sgprod-primary-04: { bandwidth: 200 }
      eip-sgprod-primary-05: { bandwidth: 200 }
      eip-sgprod-primary-06: { bandwidth: 200 }
      eip-sgprod-primary-07: { bandwidth: 200 }
      eip-sgprod-primary-08: { bandwidth: 200 }
      eip-sgprod-primary-09: { bandwidth: 200 }
      eip-sgprod-primary-10: { bandwidth: 200 }
    secondary_eips:
      eip-sgprod-secondary-01: { bandwidth: 200 }
    route_table_name: default
    snat_subnets:
      pool-a:
        availability_zone: ap-singapore-2
        description: claw-subnet-sgprod-1
      pool-b:
        availability_zone: ap-singapore-1
        description: claw-subnet-sgprod-2
      pool-c:
        availability_zone: ap-singapore-3
        description: claw-subnet-sgprod-3
      pool-d:
        availability_zone: ap-singapore-4
        description: claw-subnet-sgprod-4
      pool-e:
        availability_zone: ap-singapore-1
        description: claw-subnet-sgprod-5
      pool-f:
        availability_zone: ap-singapore-2
        description: claw-subnet-sgprod-6
      support:
        availability_zone: ap-singapore-2
        description: claw-subnet-sgprod-support

  security:
    sandbox_sg:
      security_group_name: sandbox-isolated-sg
      description: "Isolated sandbox instances: ingress open, egress only to allowlisted private IPs and public internet"
      ingress:
        - ACCEPT#0.0.0.0/0#ALL#ALL#allow all inbound
      egress:
        - ACCEPT#169.254.0.23/32#80#TCP#allow tencent metadata http
        - ACCEPT#183.60.83.19/32#53#UDP#allow tencent default dns udp
        - ACCEPT#183.60.83.19/32#53#TCP#allow tencent default dns tcp
        - ACCEPT#183.60.82.98/32#53#UDP#allow tencent default dns udp
        - ACCEPT#183.60.82.98/32#53#TCP#allow tencent default dns tcp
        - DROP#10.0.0.0/8#ALL#ALL#deny private 10/8 except allowlist above
        - DROP#172.16.0.0/12#ALL#ALL#deny private 172.16/12
        - DROP#192.168.0.0/16#ALL#ALL#deny private 192.168/16
        - DROP#169.254.0.0/16#ALL#ALL#deny link-local and metadata
        - ACCEPT#0.0.0.0/0#ALL#ALL#allow public internet

  redis:
    ctl_mq:
      availability_zone: ap-singapore-2
      mem_size: 1024
      type_id: 18
      subnet_id: __SUPPORT_SUBNET_ID__
      redis_shard_num: 3
      redis_replicas_num: 1
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__
    sandbox_route:
      availability_zone: ap-singapore-2
      mem_size: 1024
      type_id: 18
      subnet_id: __SUPPORT_SUBNET_ID__
      redis_shard_num: 8
      redis_replicas_num: 3
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__

  tcr:
    instance_type: basic
    namespace_name: lightclaw
    open_public_operation: true
    tags:
      env: sgprod
      app: lightclaw
    pull_service_account_name: lightclaw-pull
    pull_service_account_duration_days: 3650

  storage:
    manage_cam_access: false

  monitoring:
    cls_logs:
      logset_name: clawhub-sgprod
      topic_name: service-gateway-access
    ctl_cls_logs:
      topic_name: ctl-runtime
    sandbox_cls_logs:
      topic_name: sandbox-runtime

  compute:
    jumpserver:
      availability_zone: ap-singapore-2
      instance_type: SA5.MEDIUM2
      instance_charge_type: POSTPAID_BY_HOUR
      system_disk_type: CLOUD_BSSD
      system_disk_size: 50
      subnet_id: __SUPPORT_SUBNET_ID__
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__
      user_data_raw: |
        #!/bin/bash
        apt-get update
        apt-get install -y curl
