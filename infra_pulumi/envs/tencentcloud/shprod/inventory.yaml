env_name: shprod
cloud: tencentcloud
region: ap-shanghai
zone_primary: ap-shanghai-5
env_short: shprod

network:
  support_subnet_key: support
  sandbox_pool_subnet_keys:
    - pool-a
    - pool-b
    - pool-c
    - pool-d
    - pool-e
    - pool-f
    - support

domains:
  public_api: https://api.lightclaw.cn
  admin: https://admin.lightclaw.cn
  frontend_static: https://preview.lightclaw.cn
  model_api_internal: http://llm.lightclaw.site

stacks:
  tke:
    cluster_name: tke-shprod
    node_pool_name: general-shprod
    cluster_version: "1.30.0"
    network_type: VPC-CNI
    service_cidr: 10.16.255.0/24
    vpc_cni_type: tke-route-eni
    cluster_cidr: 172.17.0.0/16
    subnet_id: __SUPPORT_SUBNET_ID__
    availability_zone: ap-shanghai-5
    cluster_internet: true
    cluster_internet_cidrs:
      - 0.0.0.0/0
    instance_type: SA9.LARGE8
    node_pool_min_size: 1
    node_pool_desired_capacity: 50
    node_pool_max_size: 80
    worker_img_id: img-ks5zyolj
    node_pool_public_ingress_ports:
      - 18080
      - 8084
      - 32050
      - 32299
      - 32331
      - 32310
      - 32498
      - 30671
      - 32661

  cynosdb:
    availability_zone: ap-shanghai-5
    db_version: "8.0"
    subnet_id: __SUPPORT_SUBNET_ID__
    cluster_cidr: 172.17.0.0/16
    instance_cpu_core: 2
    instance_memory_size: 4
    storage_limit: 100

  networking:
    primary_nat_gateway_name: NATGW
    secondary_nat_gateway_name: def
    primary_eips:
      eip-shprod-primary-01: { bandwidth: 200 }
      eip-shprod-primary-02: { bandwidth: 200 }
      eip-shprod-primary-03: { bandwidth: 200 }
      eip-shprod-primary-04: { bandwidth: 200 }
      eip-shprod-primary-05: { bandwidth: 200 }
      eip-shprod-primary-06: { bandwidth: 200 }
      eip-shprod-primary-07: { bandwidth: 200 }
      eip-shprod-primary-08: { bandwidth: 200 }
      eip-shprod-primary-09: { bandwidth: 200 }
      eip-shprod-primary-10: { bandwidth: 200 }
    secondary_eips:
      eip-shprod-secondary-01: { bandwidth: 200 }
    route_table_name: default
    snat_subnets:
      pool-a:
        availability_zone: ap-shanghai-5
        description: claw-subnet-shprod-1
      pool-b:
        availability_zone: ap-shanghai-2
        description: claw-subnet-shprod-2
      pool-c:
        availability_zone: ap-shanghai-5
        description: claw-subnet-shprod-3
      pool-d:
        availability_zone: ap-shanghai-2
        description: claw-subnet-shprod-4
      pool-e:
        availability_zone: ap-shanghai-5
        description: claw-subnet-shprod-5
      pool-f:
        availability_zone: ap-shanghai-2
        description: claw-subnet-shprod-6
      support:
        availability_zone: ap-shanghai-5
        description: claw-subnet-shprod-support

  security:
    sandbox_sg:
      security_group_name: sandbox-isolated-sg
      description: "Isolated sandbox instances: ingress open, egress only to allowlisted private IPs and public internet"
      ingress:
        - ACCEPT#0.0.0.0/0#ALL#ALL#allow all inbound
      egress:
        - ACCEPT#10.15.192.110/32#80#TCP#allow internal llm http
        - ACCEPT#10.15.192.110/32#443#TCP#allow internal llm https
        - ACCEPT#169.254.0.23/32#80#TCP#allow tencent metadata http
        - ACCEPT#183.60.83.19/32#53#UDP#allow tencent default dns udp
        - ACCEPT#183.60.83.19/32#53#TCP#allow tencent default dns tcp
        - ACCEPT#183.60.82.98/32#53#UDP#allow tencent default dns udp
        - ACCEPT#183.60.82.98/32#53#TCP#allow tencent default dns tcp
        - DROP#10.0.0.0/8#ALL#ALL#deny private 10/8 except allowlist above
        - DROP#172.16.0.0/12#ALL#ALL#deny private 172.16/12
        - DROP#192.168.0.0/16#ALL#ALL#deny private 192.168/16
        - DROP#169.254.0.0/16#ALL#ALL#deny link-local and metadata
        - ACCEPT#0.0.0.0/0#ALL#ALL#allow public internet

  redis:
    ctl_mq:
      availability_zone: ap-shanghai-5
      mem_size: 1024
      type_id: 18
      subnet_id: __SUPPORT_SUBNET_ID__
      redis_shard_num: 3
      redis_replicas_num: 1
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__
    sandbox_route:
      availability_zone: ap-shanghai-5
      mem_size: 1024
      type_id: 18
      subnet_id: __SUPPORT_SUBNET_ID__
      redis_shard_num: 8
      redis_replicas_num: 3
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__

  notify:
    enabled: true
    manage_triggers: false
    triggers_enabled: false
    test_allowlist_enabled: false
    db_user: ctl_notify_reader
    db_host: 10.15.192.13
    db_port: 3306
    db_secret_name: mono-shprod-notify-scan-probe-db
    redis_host: 10.15.192.90
    redis_port: 6379
    redis_secret_name: mono-shprod-notify-redis
    vpc_id: vpc-2y7p1lk6
    subnet_id: subnet-38xcw327
    cls_logset_id: b8d8704e-0904-4343-bb80-e08c08a3e92b
    cls_topic_id: 3c16d897-bf5f-41f1-8395-347c80018b7d
    sms_sdk_app_id: "1401097405"
    sms_sign_name: "腾讯云"
    sms_template_id: "2699772"
    expiry_windows_days: "7,0"
    sms_qps: 15
    sms_burst: 1
    scan_page_size: 500
    worker_batch_size: 200
    worker_max_messages: 10000
    scanner_cron: "0 0 9 * * * *"
    worker_cron: "0 */15 * * * * *"
    scanner_function_name: lightvela-notify-scanner-sh
    worker_function_name: lightvela-notify-worker-sh

  tcr:
    instance_type: basic
    namespace_name: lightclaw
    open_public_operation: true
    tags:
      env: shprod
      app: lightclaw
    pull_service_account_name: lightclaw-pull
    pull_service_account_duration_days: 3650

  monitoring:
    cls_logs:
      logset_name: clawhub-shprod
      topic_name: service-gateway-access
    ctl_cls_logs:
      topic_name: ctl-runtime
    sandbox_cls_logs:
      topic_name: sandbox-runtime

  compute:
    jumpserver:
      availability_zone: ap-shanghai-5
      instance_type: SA9.MEDIUM2
      instance_charge_type: POSTPAID_BY_HOUR
      system_disk_type: CLOUD_PREMIUM
      system_disk_size: 50
      subnet_id: __SUPPORT_SUBNET_ID__
      security_groups:
        - __TKE_NODE_SECURITY_GROUP_ID__
      user_data_raw: |
        #!/bin/bash
        apt-get update
        apt-get install -y curl
