apiVersion: v1
kind: Namespace
metadata:
  name: cloudagent
  labels:
    cloudagent.dev/environment: shprod
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: cloudagent
  labels:
    cloudagent.dev/environment: shprod
data:
  GATEWAY_ADDR: ":8080"
  GATEWAY_DATA_DIR: "/tmp/gateway-data"
  GATEWAY_WORKER_MODE: "agent_injected"
  GATEWAY_AGS_REQUEST_TIMEOUT_SECONDS: "300"
  GATEWAY_DEFAULT_TENANT_ID: "tenant-live"
  GATEWAY_DEFAULT_PROJECT_ID: "project-live"
  TOKENHUB_MODEL: "minimax-m2.7"
  GATEWAY_AGS_DOMAIN: "ap-shanghai.tencentags.com"
  GATEWAY_AGS_API_URL: "https://api.ap-shanghai.tencentags.com"
  E2B_DOMAIN: "ap-shanghai.tencentags.com"
  GATEWAY_AGENT_OUTER_RUNTIME: "wisp"
  GATEWAY_AGS_TEMPLATE: "REPLACE_ME_SHPROD_AGS_TEMPLATE"
  GATEWAY_AGENT_SIDECAR_INNER_TEMPLATE: "REPLACE_ME_SHPROD_AGS_TEMPLATE"
  GATEWAY_AGENT_SIDECAR_URL: "REPLACE_ME_SHPROD_CLOUDAGENT_SIDECAR_URL"
  GATEWAY_AGENT_SIDECAR_SHA256: "REPLACE_ME_SHPROD_CLOUDAGENT_SIDECAR_SHA256"
  GATEWAY_SANDBOX_HOST_URL: "REPLACE_ME_SHPROD_SANDBOX_HOST_URL"
  GATEWAY_SANDBOX_HOST_SHA256: "REPLACE_ME_SHPROD_SANDBOX_HOST_SHA256"
  GATEWAY_WISP_SMH_LIBRARY_ID: "smh37laghvp09llc"
  GATEWAY_WISP_SMH_ACCESS_DOMAIN: "https://smh37laghvp09llc.ap-shanghai.api.tencentsmh.cn"
  GATEWAY_WISP_PACKAGE_URL: "https://cloudagent-sidecar-shanghai-1388575217.cos.ap-shanghai.myqcloud.com/workspace/20260528/wisp-linux-amd64-20260528T061826Z-8ceda87c563b.erofs"
  GATEWAY_TALOS_TEMPLATE: "tpl-pool-s3h-ivanbgliu-1"
  CLOUDAGENT_WEB_SEARCH_PROVIDER: "tencent_wsa"
  TENCENTCLOUD_WSA_ENDPOINT: "https://api.wsa.cloud.tencent.com/SearchPro"
  GATEWAY_REDIS_ADDR: "10.5.1.41:6379"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-public
  namespace: cloudagent
  annotations:
    kubernetes.io/ingress.class: qcloud
    ingress.cloud.tencent.com/tke-service-config: gateway-public-config
    ingress.cloud.tencent.com/modification-protection: "false"
    ingress.cloud.tencent.com/direct-access: "true"
    ingress.cloud.tencent.com/pass-to-target: "true"
    ingress.cloud.tencent.com/rewrite-support: "true"
    ingress.cloud.tencent.com/auto-rewrite: "true"
spec:
  ingressClassName: qcloud
  rules:
    - host: REPLACE_CLOUDAGENT_GATEWAY_PUBLIC_HOST
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
          - path: /acp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 80
          - path: /readyz
            pathType: Exact
            backend:
              service:
                name: gateway
                port:
                  number: 80
---
apiVersion: cloud.tencent.com/v1alpha1
kind: TkeServiceConfig
metadata:
  name: gateway-public-config
  namespace: cloudagent
spec:
  loadBalancer:
    l7Listeners:
      - protocol: HTTP
        port: 80
        domains:
          - domain: REPLACE_CLOUDAGENT_GATEWAY_PUBLIC_HOST
            rules:
              - url: /v1
                forwardType: HTTP
                healthCheck: &cloudagentGatewayHealthCheck
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /readyz
                  httpCheckDomain: REPLACE_CLOUDAGENT_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: GET
                  httpCode: 2
              - url: /acp
                forwardType: HTTP
                healthCheck: *cloudagentGatewayHealthCheck
              - url: /ws
                forwardType: HTTP
                healthCheck: *cloudagentGatewayHealthCheck
              - url: =/healthz
                forwardType: HTTP
                healthCheck: *cloudagentGatewayHealthCheck
              - url: =/readyz
                forwardType: HTTP
                healthCheck: *cloudagentGatewayHealthCheck
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cloudagent
  labels:
    app.kubernetes.io/name: gateway
    cloudagent.dev/environment: shprod
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        cloudagent.dev/environment: shprod
    spec:
      imagePullSecrets:
        - name: tcr-regcred
      containers:
        - name: gateway
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
          env:
            - name: GATEWAY_AGS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-runtime-secrets
                  key: GATEWAY_AGS_API_KEY
            - name: GATEWAY_TOKENHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-runtime-secrets
                  key: GATEWAY_TOKENHUB_API_KEY
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-runtime-secrets
                  key: GATEWAY_API_KEY
                  optional: true
            - name: GATEWAY_TALOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-runtime-secrets
                  key: GATEWAY_TALOS_API_KEY
                  optional: true
            - name: TENCENTCLOUD_WSA_APIKEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-wsa-search-secrets
                  key: TENCENTCLOUD_WSA_APIKEY
                  optional: true
            - name: GATEWAY_WISP_SMH_LIBRARY_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudagent-wisp-secrets
                  key: GATEWAY_WISP_SMH_LIBRARY_SECRET
            - name: GATEWAY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudagent-redis-secrets
                  key: GATEWAY_REDIS_PASSWORD
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cloudagent
  labels:
    app.kubernetes.io/name: gateway
    cloudagent.dev/environment: shprod
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      nodePort: 32661
      targetPort: http
