apiVersion: v1
kind: Namespace
metadata:
  name: cloudagent
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-config
  namespace: cloudagent
data:
  GATEWAY_ADDR: ":8080"
  GATEWAY_DATA_DIR: "/tmp/gateway-data"
  GATEWAY_WORKER_MODE: "agent_injected"
  GATEWAY_AGS_REQUEST_TIMEOUT_SECONDS: "300"
  GATEWAY_DEFAULT_TENANT_ID: "tenant-live"
  GATEWAY_DEFAULT_PROJECT_ID: "project-live"
  TOKENHUB_MODEL: "minimax-m2.7"
  E2B_DOMAIN: "ap-beijing.tencentags.com"
  GATEWAY_TALOS_TEMPLATE: "498c6c11-74d7-426e-bdb1-13d8aa73997e"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: cloudagent
  labels:
    app.kubernetes.io/name: gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
    spec:
      imagePullSecrets:
        - name: tcr-regcred
      containers:
        - name: gateway
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-runtime
          readinessProbe:
            httpGet:
              path: /v1/models
              port: http
              httpHeaders:
                - name: X-Tenant-ID
                  value: tenant-live
                - name: X-Project-ID
                  value: project-live
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /v1/models
              port: http
              httpHeaders:
                - name: X-Tenant-ID
                  value: tenant-live
                - name: X-Project-ID
                  value: project-live
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: cloudagent
  labels:
    app.kubernetes.io/name: gateway
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: gateway
  ports:
    - name: http
      port: 80
      targetPort: http
