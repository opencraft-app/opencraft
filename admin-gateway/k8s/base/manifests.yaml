apiVersion: v1
kind: Namespace
metadata:
  name: lightclaw-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: lightclaw-gateway
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-lightclaw-public
  namespace: lightclaw-gateway
  annotations:
    kubernetes.io/ingress.class: qcloud
    ingress.cloud.tencent.com/modification-protection: "false"
    ingress.cloud.tencent.com/tke-service-config: admin-lightclaw-public-config
    ingress.cloud.tencent.com/direct-access: "true"
    ingress.cloud.tencent.com/rewrite-support: "true"
    ingress.cloud.tencent.com/auto-rewrite: "true"
spec:
  ingressClassName: qcloud
  tls:
    - hosts:
        - REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
      secretName: REPLACE_ADMIN_GATEWAY_TLS_SECRET_NAME
  rules:
    - host: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
      http:
        paths:
          - path: /admin/ops
            pathType: Prefix
            backend:
              service:
                name: admin-gateway-ingress
                port:
                  number: 80
          - path: /admin/gateway
            pathType: Prefix
            backend:
              service:
                name: admin-gateway-ingress
                port:
                  number: 80
          - path: /admin/api
            pathType: Prefix
            backend:
              service:
                name: admin-gateway-ingress
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-gateway-ingress
                port:
                  number: 80
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: admin-gateway-ingress
                port:
                  number: 80
---
apiVersion: cloud.tencent.com/v1alpha1
kind: TkeServiceConfig
metadata:
  name: admin-lightclaw-public-config
  namespace: lightclaw-gateway
spec:
  loadBalancer:
    l7Listeners:
      - protocol: HTTP
        port: 80
        domains:
          - domain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
            rules:
              - url: /admin/ops
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /admin/gateway
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /admin/api
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /healthz
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
      - protocol: HTTPS
        port: 443
        defaultServer: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
        domains:
          - domain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
            rules:
              - url: /admin/ops
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /admin/gateway
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /admin/api
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
              - url: /healthz
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /healthz
                  httpCheckDomain: REPLACE_ADMIN_GATEWAY_PUBLIC_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-gateway
  namespace: lightclaw-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-gateway
  template:
    metadata:
      labels:
        app: admin-gateway
      annotations:
        admin-gateway.clawhub.dev/redeploy-at: REPLACE_ADMIN_GATEWAY_DEPLOYED_AT
    spec:
      nodeSelector:
        pool: REPLACE_ADMIN_GATEWAY_NODE_POOL
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: admin-gateway
      containers:
        - name: gateway
          image: REPLACE_ADMIN_GATEWAY_IMAGE
          imagePullPolicy: Always
          env:
            - name: SERVICE_GATEWAY_ADDR
              value: ":8085"
            - name: SERVICE_GATEWAY_CONFIG_FILE
              value: /etc/admin-gateway/config.yaml
            - name: SERVICE_GATEWAY_ADMIN_BASIC_AUTH_USER
              valueFrom:
                secretKeyRef:
                  name: admin-gateway-runtime-secrets
                  key: SERVICE_GATEWAY_ADMIN_BASIC_AUTH_USER
            - name: SERVICE_GATEWAY_ADMIN_BASIC_AUTH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-gateway-runtime-secrets
                  key: SERVICE_GATEWAY_ADMIN_BASIC_AUTH_PASSWORD
            - name: SERVICE_GATEWAY_ADMIN_BASIC_AUTH_REALM
              value: "Lightclaw Admin Gateway - browser password only; Light Gateway token on next page"
            - name: SERVICE_GATEWAY_ADMIN_BRIDGE_COOKIE_HOSTS
              valueFrom:
                configMapKeyRef:
                  name: admin-gateway-platform-values
                  key: ADMIN_GATEWAY_BRIDGE_COOKIE_HOSTS
                  optional: true
            - name: SERVICE_GATEWAY_ADMIN_BRIDGE_COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-gateway-runtime-secrets
                  key: SERVICE_GATEWAY_ADMIN_BRIDGE_COOKIE_SECRET
                  optional: true
          volumeMounts:
            - name: config
              mountPath: /etc/admin-gateway/config.yaml
              subPath: config.yaml
          ports:
            - name: http
              containerPort: 8085
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: config
          configMap:
            name: admin-gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: admin-gateway
  namespace: lightclaw-gateway
  labels:
    app: admin-gateway
    metrics-target: "true"
spec:
  selector:
    app: admin-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: admin-gateway-ingress
  namespace: lightclaw-gateway
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: admin-gateway
  ports:
    - name: http
      port: 80
      nodePort: 32331
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: admin-gateway
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames:
      - lightclaw-gateway
  selector:
    matchLabels:
      metrics-target: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
