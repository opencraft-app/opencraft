apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightclaw-gateway

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: admin-lightclaw-public
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: admin.lightclaw.site
      - op: replace
        path: /spec/tls/0/hosts/0
        value: admin.lightclaw.site
      - op: replace
        path: /spec/tls/0/secretName
        value: admin-lightclaw-site-tls
  - target:
      kind: TkeServiceConfig
      name: admin-lightclaw-public-config
    patch: |-
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/domain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/rules/0/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/rules/1/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/rules/2/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/rules/3/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/rules/4/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/defaultServer
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/domain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/rules/0/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/rules/1/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/rules/2/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/rules/3/healthCheck/httpCheckDomain
        value: admin.lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/rules/4/healthCheck/httpCheckDomain
        value: admin.lightclaw.site

configMapGenerator:
  - name: admin-gateway-config
    files:
      - generated/config.yaml
  - name: admin-gateway-platform-values
    envs:
      - generated/platform.env

secretGenerator:
  - name: admin-gateway-runtime-secrets
    envs:
      - generated/admin-gateway-runtime-secrets.env

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: admin-gateway-platform-values
      fieldPath: data.ADMIN_GATEWAY_IMAGE
    targets:
      - select:
          kind: Deployment
          name: admin-gateway
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: admin-gateway-platform-values
      fieldPath: data.ADMIN_GATEWAY_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: admin-gateway
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: admin-gateway-platform-values
      fieldPath: data.ADMIN_GATEWAY_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: admin-gateway
        fieldPaths:
          - spec.template.metadata.annotations.[admin-gateway.clawhub.dev/redeploy-at]
  - source:
      kind: ConfigMap
      name: admin-gateway-platform-values
      fieldPath: data.ADMIN_GATEWAY_CLS_TOPIC_ID
    targets:
      - select:
          kind: LogConfig
          name: admin-gateway-access
        fieldPaths:
          - spec.clsDetail.topicId
