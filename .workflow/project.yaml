# ============================================================================
# OpenSpec 项目上下文配置模板
# ============================================================================
#
# 📋 使用说明:
#   1. 此文件由 feai install 自动复制为 .workflow/project.yaml
#   2. 替换 {{占位符}} 为项目实际内容
#   3. 删除不需要的章节（但建议保留结构完整性）
#   4. 填写越详细，AI 的理解和辅助能力越强
#
# 💡 提示:
#   - 首次填写可以让 AI 辅助分析项目代码后自动生成
#   - context 字段使用 YAML 多行文本格式（|）
#   - 内容会作为 AI Agent 的全局项目理解上下文
#
# 📁 工作流核心目录布局（由 feai install 写入用户项目）:
#   .workflow/project.yaml      ← 本文件（工作流主配置）
#   .workflow/agents/           ← Agent 角色定义
#   .workflow/rules/            ← 全局规则
#   .workflow/checklists/       ← 阶段门禁
#   openspec/                   ← 业务产物（用户填）：specs / changes / plan.md
#   .codebuddy/                 ← AI 工具配置（仅 IDE 相关：skills / commands / mcp.json）
#
# 模板版本: v1.4.0 (v0.15.0：工作流核心从 .codebuddy/workflow/ 抽到项目根 .workflow/，
#                  彻底解耦 AI 工具配置与工作流，对所有 IDE 中立)
# ============================================================================

schema: spec-driven

# ============================================================================
# 工作流配置（v0.9.0 新增，v0.13.0 增强）
# ============================================================================
workflow:
  # 工作流模式：single_agent（单 Agent，所有角色由一个 AI 扮演）
  #            multi_agent（多 Agent，按角色派发：leader/planner/implementer/developer/reviewer）
  mode: single_agent

  # 需求规模分级（唯一判定规则见 .workflow/rules/flow-cost.md）
  # S（小）: 明确目标的局部修复 / 文案 / 样式调整
  # M（中）: 单一边界内的局部多文件功能 / 组件或流程调整
  # L（大）: 跨模块 / 高风险契约 / 完整流程
  size_levels:
    S:
      description: "小需求（明确目标的局部修复 / 文案 / 样式调整）"
      criteria: "默认用于单一目标、局部产品或技术边界内的低风险修复、文案、样式、小交互或已有流程局部调整；不涉及跨服务协作、公共 API 契约、数据迁移、权限、鉴权、计费、发布或批量操作；目标文件和任务条数仅作参考，不是硬门槛"
      openspec: ["plan.md"]              # 必须产物清单
      agent_mode: single_agent           # 推荐 agent 模式
      requires_plan: true                # 仍要求 plan.md（哪怕只有 1 个 - [ ] 任务）（G3）
      requires_leader: false
    M:
      description: "中等需求（局部多文件功能 / 组件或流程调整）"
      criteria: "确实需要正式方案、多个阶段验证、多个相互依赖的状态或接口，或超出一个局部边界但仍属于单一产品或技术域；仅文件多、描述长或一次补充确认不触发 M；未命中 L 级可靠性条件"
      openspec: ["proposal.md", "spec.md", "plan.md"]
      agent_mode: single_agent
      requires_plan: true
      requires_leader: false
    L:
      description: "大需求（跨模块 / 高风险契约 / 完整流程）"
      criteria: "显式 --full，或跨服务/跨多个业务模块、公共 API 契约、权限/鉴权/计费/发布/数据迁移、新增核心主流程、灰度/回滚或跨团队交付变更"
      openspec: ["proposal.md", "spec.md", "plan.md"]
      agent_mode: multi_agent
      requires_plan: true
      requires_leader: true

  # 兼容旧字段（v0.9.0 ~ v0.12.x）：scale_levels 等同 size_levels
  # 新项目优先使用 size_levels；老项目仍可使用 scale_levels（工具读取时同时识别两个字段）
  # scale_levels: 不再单独定义，等同上方 size_levels 配置

  # 禁止工具（G19）：AI 在本项目中绝不能用这些工具替代工作流
  forbidden_tools:
    - EnterPlanMode      # IDE 内置 plan mode 会绕过 openspec/plan.md
    - ExitPlanMode

  # 规划产物路径（G21）
  plan_output_path: "openspec/"

  # 禁止的规划产物路径（G21）：写到这些路径不被视为有效产物
  forbidden_plan_paths:
    - ".codebuddy/plans/"
    - "docs/plans/"

  # 步骤追踪（G20）：执行跨阶段工作流时必须输出步骤编号
  progress_reporting:
    mode: milestone
    long_running_update_seconds: 60
    decision_cards_without_step_prefix: true
context_loading:
  # P0：必读，每次都加载
  P0:
    - .workflow/project.yaml   # 工作流主配置
    - .workflow/rules/global.md # 全局规则（铁律）
    - openspec/plan.md                   # 业务执行计划（当前需求级记忆）
    - openspec/current_state.md          # 项目级长期记忆（历史归档清单 + 上一需求摘要）
    - AGENTS.md                          # 多 IDE 索引（CodeBuddy / Claude / Cursor 通用）
  # P1：按需加载（提到相关功能时）
  P1:
    - openspec/specs/**/*.md             # 业务规格
    - .workflow/rules/**/*.md  # 工作流规则补充
  # P2：仅在调试 / 排错场景加载
  P2:
    - openspec/changes/**/*.md           # 业务变更记录
  # P3：仅在归档场景加载
  P3:
    - openspec/changes/archive/**/*.md

# ============================================================================
# 阶段门禁（v0.9.0 新增，v0.13.0 增强：每阶段绑定 owner）
# 每个阶段完成后必须对照对应的 checklist 自检
# ============================================================================
gates:
  required:
    - planning           # 规划阶段：.workflow/checklists/gate-planning.md
    - implementation     # 实现阶段：.workflow/checklists/gate-implementation.md
    - verification       # 验证阶段：.workflow/checklists/gate-verification.md
    - archive            # 归档阶段：.workflow/checklists/gate-archive.md
  # 门禁结论只能是三种之一
  result_options: [pass, reject, conditional_pass]

  # 阶段 → owner 绑定（multi_agent 模式下生效，single_agent 模式下默认 default agent 全部承担）
  stage_gates:
    - { stage: planning,        owner: planner,     gate: .workflow/checklists/gate-planning.md }
    - { stage: implementation,  owner: developer,   gate: .workflow/checklists/gate-implementation.md }
    - { stage: verification,    owner: reviewer,    gate: .workflow/checklists/gate-verification.md }
    - { stage: archive,         owner: leader,      gate: .workflow/checklists/gate-archive.md }

# ============================================================================
# 多 Agent 团队拓扑（v0.13.0 新增）
# 仅当 workflow.mode = multi_agent、需求规模 = L，或 M 级明确选择团队协作时生效
# 由 Leader 按 standby/trigger 规则串行唤醒
# ============================================================================
multi_agent:
  # 创建策略：on-demand（按需）或 always（默认全员待命）
  creation_strategy: on-demand
  team_members:
    - id: leader
      agent_file: .workflow/agents/leader.md
      role: "总控调度与审核"
    - id: planner
      agent_file: .workflow/agents/planner.md
      role: "需求分析 + 架构设计 + 输出 OpenSpec 产物"
      standby: true
    - id: implementer
      agent_file: .workflow/agents/implementer.md
      role: "UI / 界面还原（可选，仅当任务涉及设计稿还原时唤醒）"
      standby: true
      trigger: ui_implementation_required
    - id: developer
      agent_file: .workflow/agents/developer.md
      role: "代码实现（TDD 驱动）"
      standby: true
    - id: reviewer
      agent_file: .workflow/agents/reviewer.md
      role: "测试验证 + 知识沉淀 + 归档"
      standby: true

# ============================================================================
# 依赖插件清单（v0.13.0 新增 — G16）
# 工作流启动前必须校验这些 skill 是否可用，缺失则中止并提示用户安装
# ============================================================================
dependencies:
  plugins:
    - name: superpowers
      source: superpowers-marketplace
      required: true
      skills:
        - brainstorming
        - writing-plans
        - test-driven-development
        - subagent-driven-development
        - dispatching-parallel-agents
        - systematic-debugging
        - verification-before-completion

# ============================================================================
# 可选能力清单（v0.9.0 新增）
# 通过 `feai cap enable <id>` 启用对应 capability
# 已启用的 capability 会贡献额外的 checklist / rules / agents 段落
# ============================================================================
capabilities:
  # 已启用的能力 ID（由 `feai cap enable/disable` 自动维护，不要手动改）
  enabled: []
  # 可用能力清单（仅供参考，实际可用项以 `feai cap list` 为准）
  available:
    - id: figma-fidelity
      description: "Figma 设计稿还原 + 双轨回验（数值 + 视觉）"
    - id: e2e-playwright
      description: "Playwright E2E 两段式流程（Planner 写场景 + Reviewer 实现）"

# ============================================================================
# 项目业务上下文（context）
# ============================================================================
#
# ⚠️ 本仓库 (wisp/mono2) 是 Monorepo，前端业务上下文已由用户长期手工维护在：
#   👉 frontend/openspec/config.yaml （context: 段，~250 行高保真上下文）
#
# 该文件覆盖：项目概述 / 技术栈 / 入口与初始化流程 / 路由结构（含国内 vs 国际站差异）/
# 状态管理（Session/OpenClaw/Repository Provider）/ API 请求层（Repository Pattern）/
# 核心 API 列表（Auth/Plan/Bot Repository）/ 公共组件（ui/domain/site 三层）/
# 自定义 Hooks / 工具函数（lib/）/ i18n（中文即 key 方案）/ 构建与部署 / 领域模型。
#
# 本段（.workflow/project.yaml 的 context:）只做软引用，不重复内容，避免双写漂移。
# AI 在 P0 阶段读到本段时，**必须**继续打开 frontend/openspec/config.yaml 读取业务上下文。
#
# 维护方式：业务上下文变更时直接修改 frontend/openspec/config.yaml，
#          无需同步本文件。再次运行 /feai-init 也会保持本软引用形态。
# ============================================================================
context: |
  # ⚠️ 业务上下文软引用（feai-init v3.1.0 · 方案 C）

  本项目业务上下文由用户长期手工维护在子目录文件：

      frontend/openspec/config.yaml （context: 段）

  AI 加载到 .workflow/project.yaml 后，**必须**继续打开上述文件读取实际内容，
  包括但不限于：项目概述、技术栈、入口与初始化、路由结构、状态管理、
  API 请求层、核心 API 列表、公共组件、自定义 Hooks、工具函数、i18n、
  构建与部署脚本、领域模型。

  ## 为什么不在此处展开？

  1. wisp/mono2 是 Monorepo，前端项目位于 frontend/ 子目录，业务上下文天然
     属于该子目录维护的内容；
  2. frontend/openspec/config.yaml 已存在并由用户长期维护（订阅页路由、国内/
     国际站差异等场景持续更新），是事实上的单一来源（single source of truth）；
  3. 双写会导致 drift 风险——用户改其一即可，本文件作为软引用保持稳定。

  ## 仓库速览（最小辅助索引，正文请去 frontend/openspec/config.yaml）

  - 仓库类型: Go 微服务 Monorepo + 前端子目录 (`frontend/`)
  - 前端项目根 (projectRoot): `frontend`
  - 前端技术栈: Next.js 16 (App Router · static export) + React 19 + TypeScript 5.9
                + Tailwind v4 + Fumadocs MDX + 纯 React Context 状态管理
                （react-router-dom v7 仅作部分页面兼容依赖；Vite 7 / Vitest 4 仅用于测试，非构建主链）
  - 区域化构建: 国内站 `pnpm build:cn` + 国际站 `pnpm build:global`（均输出 Next static export `out/`）
                由 `src/lib/region.ts` 暴露 `isCN` / `isGlobal` 编译期常量
  - 部署形态: 国际站 Cloudflare Pages (`pnpm deploy:cf`) / EdgeOne Pages (`pnpm deploy:eo`)；
              国内站 shprod Kubernetes Pod（走 monorepo 根 release 脚本）
  - 测试目录约定: 被测文件同级 `__tests__/`，国际站专属测试 `*.global.test.tsx`；运行 `pnpm test`
  - 静态检查门禁: `pnpm check`（tsc --noEmit）；i18n 门禁 `pnpm i18n:check`
  - 路径别名: `@/*` → `src/*`、`@next-site/*` → `next-site/*`、`collections/*` → `.source/*`（详见 frontend/tsconfig.json）

  ## 后续如何更新业务上下文

  - 直接编辑 `frontend/openspec/config.yaml` 的 `context:` 段
  - 重新运行 `/feai-init` 不会覆盖本软引用
