apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: user-auth

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: nextgen-dashboard-platform-values
    envs:
      - generated/platform.env

secretGenerator:
  - name: nextgen-dashboard-runtime-secrets
    envs:
      - generated/nextgen-dashboard-runtime-secrets.env

replacements:
  - source:
      kind: ConfigMap
      name: nextgen-dashboard-platform-values
      fieldPath: data.NEXTGEN_DASHBOARD_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: nextgen-dashboard
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: nextgen-dashboard-platform-values
      fieldPath: data.NEXTGEN_DASHBOARD_IMAGE
    targets:
      - select:
          kind: Deployment
          name: nextgen-dashboard
        fieldPaths:
          - spec.template.spec.containers.0.image
          - spec.template.spec.containers.1.image
  - source:
      kind: ConfigMap
      name: nextgen-dashboard-platform-values
      fieldPath: data.NEXTGEN_DASHBOARD_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: nextgen-dashboard
        fieldPaths:
          - spec.template.metadata.annotations.[nextgen-dashboard.clawhub.dev/redeploy-at]
