apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ctl

resources:
  - serviceaccount.yaml
  - deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: workers-platform-values
    envs:
      - generated/platform.env

replacements:
  - source:
      kind: ConfigMap
      name: workers-platform-values
      fieldPath: data.WORKERS_IMAGE
    targets:
      - select:
          kind: Deployment
          name: website-deployer
        fieldPaths:
          - spec.template.spec.containers.[name=website-deployer].image
  - source:
      kind: ConfigMap
      name: workers-platform-values
      fieldPath: data.WORKERS_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: website-deployer
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
