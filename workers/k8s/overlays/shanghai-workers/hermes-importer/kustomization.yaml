apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: temporal-workers

resources:
- serviceaccount.yaml
- worker-deployment.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: workers-hermes-importer-platform-values
  envs:
  - generated/platform.env

replacements:
- source:
    kind: ConfigMap
    name: workers-hermes-importer-platform-values
    fieldPath: data.WORKERS_IMAGE
  targets:
  - select:
      kind: WorkerDeployment
      name: hermes-import-worker
    fieldPaths:
    - spec.template.spec.containers.[name=hermes-import-worker].image
