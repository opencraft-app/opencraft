apiVersion: v1
kind: ServiceAccount
metadata:
  name: website-deployer
  namespace: ctl
# 这三个 pull secret 已存在于 shprod 集群的 ctl namespace（实例级 TCR 凭据）。
# 它们同时挂在 ctl namespace 的 default ServiceAccount 上，ctl 三个 Deployment 就靠它拉镜像。
# 这里显式声明，避免依赖 default SA 的隐式行为。
imagePullSecrets:
- name: tcr.ipsqcloudregistrykey
- name: tcr.ipstcr-regcred
- name: tcr.ipstcr-lightclaw-secret
