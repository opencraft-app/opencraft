apiVersion: apps/v1
kind: Deployment
metadata:
  name: website-deployer
  namespace: ctl
  labels:
    app: website-deployer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: website-deployer
  template:
    metadata:
      labels:
        app: website-deployer
    spec:
      serviceAccountName: website-deployer
      terminationGracePeriodSeconds: 30
      nodeSelector:
        pool: REPLACE_WORKERS_NODE_POOL
      containers:
      - name: website-deployer
        image: REPLACE_WORKERS_IMAGE
        imagePullPolicy: IfNotPresent
        command:
        - /usr/local/bin/website-deployer
        env:
        # 集群内 DNS。worker 与 ctl 同集群同 namespace，代码默认值也是这个地址。
        - name: CTL_BASE_URL
          value: "http://ctl-api.ctl.svc.cluster.local"
        # 制品 zip 流式写临时文件，峰值内存仅几 KB/部署，不随并发线性增长。
        - name: MAX_CONCURRENCY
          value: "16"
        - name: POLL_INTERVAL_SECONDS
          value: "10"
        # fail-closed：Redis 同时承担跨 Pod 的 COS 上传令牌桶，不允许降级。
        - name: WEBSITE_REQUIRE_REDIS_LIMITER
          value: "true"
        - name: WEBSITE_COS_UPLOADS_PER_MINUTE
          value: "8000"
        - name: REDIS_ADDR
          valueFrom:
            secretKeyRef:
              name: website-deployer-secrets
              key: REDIS_ADDR
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: website-deployer-secrets
              key: REDIS_PASSWORD
        # 必须与 ctl 侧 ctl-runtime-secrets 中的同名 key 取值完全一致，否则 worker 全部 claim 401。
        - name: WEBSITE_INTERNAL_API_TOKEN
          valueFrom:
            secretKeyRef:
              name: website-deployer-secrets
              key: WEBSITE_INTERNAL_API_TOKEN
        # 二期固定使用独立 COS 单桶。
        - name: WEBSITE_COS_BUCKET
          valueFrom:
            configMapKeyRef:
              name: workers-platform-values
              key: WEBSITE_COS_BUCKET
        - name: WEBSITE_COS_REGION
          valueFrom:
            configMapKeyRef:
              name: workers-platform-values
              key: WEBSITE_COS_REGION
        - name: WEBSITE_COS_SECRET_ID
          valueFrom:
            secretKeyRef:
              name: website-deployer-secrets
              key: WEBSITE_COS_SECRET_ID
        - name: WEBSITE_COS_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: website-deployer-secrets
              key: WEBSITE_COS_SECRET_KEY
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 1000m
            memory: 512Mi
