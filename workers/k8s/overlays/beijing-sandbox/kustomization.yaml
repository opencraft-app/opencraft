apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: temporal-workers

resources:
- ../../base
- website-deployer

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
- name: workers-platform-values
  envs:
  - generated/platform.env

secretGenerator:
- name: workers-runtime-secrets
  envs:
  - generated/workers-runtime-secrets.env

replacements:
- source:
    kind: ConfigMap
    name: workers-platform-values
    fieldPath: data.WORKERS_IMAGE
  targets:
  - select:
      kind: Deployment
      name: rescue-exporter-worker
    fieldPaths:
    - spec.template.spec.containers.[name=rescue-exporter-worker].image
- source:
    kind: ConfigMap
    name: workers-platform-values
    fieldPath: data.WORKERS_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: rescue-exporter-worker
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: workers-platform-values
    fieldPath: data.WORKERS_TEMPORAL_ADDRESS
  targets:
  - select:
      kind: ConfigMap
      name: rescue-exporter-worker-config
    fieldPaths:
    - data.TEMPORAL_ADDRESS
- source:
    kind: ConfigMap
    name: workers-platform-values
    fieldPath: data.WORKERS_TEMPORAL_NAMESPACE
  targets:
  - select:
      kind: ConfigMap
      name: rescue-exporter-worker-config
    fieldPaths:
    - data.TEMPORAL_NAMESPACE
