version: v2.0
name: 发布 frontend

on:
  push:
    branches: [ master ]
    paths:
      - frontend/**
      - argocd/services/frontend/**
      - argocd/apps/*/frontend.yaml
  manual: enabled

concurrency:
  group: mono2-master-release
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_RELEASE_MATRIX:
    value: cn-cf,global-cf
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 发布 frontend
    jobs:
      release:
        name: 构建并发布 frontend 矩阵
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 打印 frontend 发布上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "FRONTEND_RELEASE_MATRIX=${{ variables.FRONTEND_RELEASE_MATRIX }}"
              echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
              echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
          - id: prepare
            name: 准备 frontend 发布标签
            if: ${{ variables.PIPELINE_MODE }} != 'promote'
            shell: bash
            run: |
              SHORT_SHA="${{ ci.sha }}"
              SHORT_SHA="${SHORT_SHA:0:12}"
              echo "::set-output name=tag::frontend-${SHORT_SHA}"
          - name: 发布 frontend Pages 矩阵
            if: ${{ variables.PIPELINE_MODE }} != 'promote'
            shell: bash
            env:
              CLOUDFLARE_API_TOKEN: ${{ settings.CLOUDFLARE_API_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID: ${{ settings.CLOUDFLARE_ACCOUNT_ID }}
              EDGEONE_API_TOKEN: ${{ settings.EDGEONE_API_TOKEN }}
              VITE_AUTH_API_BASE_URL: https://lightclaw.tech
              CLOUDFLARE_PAGES_COMMIT_HASH: ${{ ci.sha }}
              CLOUDFLARE_PAGES_COMMIT_MESSAGE: Cloudflare Pages deploy from frontend pipeline
              FRONTEND_RELEASE_MATRIX: ${{ variables.FRONTEND_RELEASE_MATRIX }}
            run: |
              echo "============================================================"
              echo "frontend 发布决策：进入 Pages 矩阵发布流程"
              echo "触发原因：PIPELINE_MODE=${{ variables.PIPELINE_MODE }}，满足非 promote 构建发布条件"
              echo "发布矩阵：${FRONTEND_RELEASE_MATRIX}"
              echo "发布模型：CI 只选择矩阵项，组合定义以 frontend/release-matrix.json 为准"
              echo "发布来源：branch=${{ ci.branch }} sha=${{ ci.sha }}"
              echo "下一步：安装依赖并执行 pnpm release:matrix"
              echo "============================================================"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              ci_load_cloudflare_credentials
              ci_load_edgeone_credentials
              ci_ensure_node
              ci_ensure_pnpm

              "$NODE_BIN" --version
              "$NPM_BIN" --version

              cd "$REPO_ROOT/frontend"
              rm -rf node_modules
              "$PNPM_BIN" --version
              "$PNPM_BIN" install --no-frozen-lockfile
              "$PNPM_BIN" release:matrix
          - name: 手动发布 frontend 到 GitOps
            if: ${{ variables.PIPELINE_MODE }} == 'promote'
            shell: bash
            run: |
              SOURCE_SHA="${{ variables.SOURCE_SHA }}"
              if [ -z "$SOURCE_SHA" ]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              if [ -z "$SOURCE_SHA" ]; then
                echo "SOURCE_SHA 为空，且 ci.sha 不可用；无法手动发布 frontend 到 GitOps。" >&2
                exit 1
              fi
              echo "============================================================"
              echo "frontend 发布决策：进入 GitOps 手动发布流程"
              echo "触发原因：PIPELINE_MODE=${{ variables.PIPELINE_MODE }}，满足 promote 发布条件"
              echo "目标环境：${{ variables.TARGET_ENV }}"
              echo "源码提交：$SOURCE_SHA"
              echo "提交来源：SOURCE_SHA 为空时自动回退到本次手动选择的 ci.sha=${{ ci.sha }}"
              echo "下一步：把 frontend 镜像发布内容投影到 gitops 并创建发布 MR"
              echo "============================================================"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              bash .ci/runtime/promote_bundle_image_to_gitops.sh frontend frontend "${{ variables.TARGET_ENV }}" "$SOURCE_SHA"
