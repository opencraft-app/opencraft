version: v2.0
name: 构建 frontend

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
      - playground/sandbox-kr-*
    paths:
      - frontend/**
      - opencraft/apps/workbench-web/**
      - opencraft/packages/**
      - opencraft/plugins/**
      - opencraft/package.json
      - opencraft/package-lock.json
      - argocd/services/frontend/**
      - argocd/apps/*/frontend.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-frontend
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_RELEASE_MATRIX:
    value: cf:cn-lightvela-staging,cf:global-lightvela-intl-staging
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_ARTIFACT_MATRIX:
    value: cf:cn-lightvela-staging,cf:global-lightvela-intl-staging,eo:cn-lightvela-prod-next,eo:global-lightvela-intl-prod-next
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 构建 frontend
    jobs:
      release:
        name: 构建 frontend
        runs-on:
          self-hosted: true
          pool-name: cn-pool
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
              enableVirtualMergeBranch: false
          - name: 固定 Playground 构建提交
            shell: bash
            env:
              PIN_MODE: ${{ variables.PIPELINE_MODE }}
              PIN_SOURCE_SHA: ${{ variables.SOURCE_SHA }}
              PIN_CI_SHA: ${{ ci.sha }}
              PIN_BRANCH: ${{ ci.branch }}
            run: |
              if [[ "$PIN_MODE" != "playground-build" ]]; then
                exit 0
              fi
              if [[ -z "$PIN_CI_SHA" || "$PIN_CI_SHA" == *'${{'* ]]; then
                PIN_CI_SHA="${BK_CI_GIT_HEAD_COMMITS%%,*}"
              fi
              if [[ -z "$PIN_BRANCH" || "$PIN_BRANCH" == *'${{'* ]]; then
                PIN_BRANCH="${BK_CI_GIT_REPO_BRANCH:-${DEVOPS_GIT_REPO_BRANCH:-}}"
              fi
              if [[ ! "$PIN_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
                echo "playground-build requires an exact selected master commit" >&2
                exit 1
              fi
              if [[ -n "$PIN_CI_SHA" && "$PIN_SOURCE_SHA" != "$PIN_CI_SHA" ]]; then
                echo "playground-build requires an exact selected master commit" >&2
                exit 1
              fi
              if [[ -n "$PIN_BRANCH" && "$PIN_BRANCH" != "master" ]]; then
                echo "playground-build requires an exact selected master commit" >&2
                exit 1
              fi
              git fetch --no-tags origin master
              if ! git merge-base --is-ancestor "$PIN_SOURCE_SHA" FETCH_HEAD; then
                echo "playground-build source commit is not on origin/master: $PIN_SOURCE_SHA" >&2
                exit 1
              fi
              git -c advice.detachedHead=false checkout --detach --quiet "$PIN_SOURCE_SHA"
              test "$(git rev-parse HEAD)" = "$PIN_SOURCE_SHA"
          - name: 打印 frontend 构建上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "FRONTEND_RELEASE_MATRIX=${{ variables.FRONTEND_RELEASE_MATRIX }}"
              echo "FRONTEND_ARTIFACT_MATRIX=${{ variables.FRONTEND_ARTIFACT_MATRIX }}"
              echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
              echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
          - id: prepare
            name: 准备 frontend 构建标签
            shell: bash
            run: |
              PIPELINE_MODE_VALUE="${{ variables.PIPELINE_MODE }}"
              if [[ "$PIPELINE_MODE_VALUE" == "promote" || "$PIPELINE_MODE_VALUE" == "edgeone-release" ]]; then
                echo "skip build tag step because PIPELINE_MODE=${PIPELINE_MODE_VALUE}"
                exit 0
              fi
              SHORT_SHA='${{ ci.sha }}'
              if [[ -z "$SHORT_SHA" || "$SHORT_SHA" == *'${{'* ]]; then
                SHORT_SHA="${BK_CI_GIT_HEAD_COMMITS%%,*}"
              fi
              if [[ "$PIPELINE_MODE_VALUE" == "playground-build" ]]; then
                SOURCE_SHA="${{ variables.SOURCE_SHA }}"
                TARGET_ENV="${{ variables.TARGET_ENV }}"
                if [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" != "$SHORT_SHA" ]]; then
                  echo "playground-build requires SOURCE_SHA to equal the checked-out master commit: source=${SOURCE_SHA:-empty} checkout=${SHORT_SHA:-empty}" >&2
                  exit 1
                fi
                if [[ "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
                  echo "playground-build checkout mismatch: HEAD=$(git rev-parse HEAD) source=$SOURCE_SHA" >&2
                  exit 1
                fi
                case "$TARGET_ENV" in
                  sandbox-bj-*|sandbox-kr-*)
                    ;;
                  *)
                    echo "playground-build only supports sandbox-bj-* or sandbox-kr-*: ${TARGET_ENV:-empty}" >&2
                    exit 1
                    ;;
                esac
                SHORT_SHA="$(printf '%.12s' "$SOURCE_SHA")"
                echo "::set-output name=tag::frontend-${TARGET_ENV}-${SHORT_SHA}"
                exit 0
              fi
              SHORT_SHA="$(printf '%.12s' "$SHORT_SHA")"
              case "${{ ci.branch }}" in
                playground/sandbox-bj-*|playground/sandbox-kr-*)
                  PLAYGROUND_ENV="${{ ci.branch }}"
                  PLAYGROUND_ENV="${PLAYGROUND_ENV#playground/}"
                  echo "::set-output name=tag::frontend-${PLAYGROUND_ENV}-${SHORT_SHA}"
                  ;;
                *)
                  echo "::set-output name=tag::frontend-${SHORT_SHA}"
                  ;;
              esac
          - name: 构建 frontend artifact 全矩阵
            shell: bash
            env:
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              VITE_AUTH_API_BASE_URL: https://lightclaw.tech
              FRONTEND_ARTIFACT_MATRIX: ${{ variables.FRONTEND_ARTIFACT_MATRIX }}
              FRONTEND_ARTIFACT_MODE: required
              FRONTEND_ARTIFACT_EXISTING_POLICY: reuse
              FRONTEND_ARTIFACT_REPOSITORY: lightclaw-shprod.tencentcloudcr.com/lightclaw/frontend-pages
              FRONTEND_ARTIFACT_SOURCE_SHA: ${{ ci.sha }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" || "${{ variables.PIPELINE_MODE }}" == "edgeone-release" || "${{ variables.PIPELINE_MODE }}" == "playground-build" ]]; then
                echo "skip artifact build step because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              case "${{ ci.branch }}" in
                master)
                  ;;
                playground/sandbox-bj-*|playground/sandbox-kr-*)
                  echo "skip frontend artifact matrix build for playground branch ${{ ci.branch }}: shared Pages artifacts are master-only"
                  exit 0
                  ;;
                *)
                  echo "skip frontend artifact matrix build for non-master branch ${{ ci.branch }}: shared Pages artifacts are master-only"
                  exit 0
                  ;;
              esac
              echo "============================================================"
              echo "frontend 发布决策：进入 artifact 全矩阵构建归档流程"
              echo "artifact 矩阵：${FRONTEND_ARTIFACT_MATRIX}"
              echo "artifact 仓库：${FRONTEND_ARTIFACT_REPOSITORY}"
              echo "artifact source sha：${FRONTEND_ARTIFACT_SOURCE_SHA}"
              echo "发布模型：仅 build/archive/verify，不发布 Pages"
              echo "============================================================"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              ci_set_registry_credentials shprod
              ci_ensure_oras
              ci_ensure_node
              ci_ensure_pnpm

              "$NODE_BIN" --version
              "$NPM_BIN" --version

              OPENCRAFT_SOURCE_REVISION="${FRONTEND_ARTIFACT_SOURCE_SHA}"
              OPENCRAFT_SHORT_SHA="$(printf '%.12s' "$OPENCRAFT_SOURCE_REVISION")"
              cd "$REPO_ROOT/opencraft"
              "$NPM_BIN" ci
              OPENCRAFT_BUILD_ID="embedded-${OPENCRAFT_SHORT_SHA}" \
                OPENCRAFT_SOURCE_REVISION="$OPENCRAFT_SOURCE_REVISION" \
                "$NPM_BIN" run build:embedded-workbench:release
              export OPENCRAFT_EMBED_DIST_DIR="$REPO_ROOT/opencraft/apps/workbench-web/dist-embedded-workbench"
              test -f "$OPENCRAFT_EMBED_DIST_DIR/embedded-workbench.js"
              test -f "$OPENCRAFT_EMBED_DIST_DIR/.vite/manifest.json"

              cd "$REPO_ROOT/frontend"
              rm -rf node_modules
              "$PNPM_BIN" --version
              "$PNPM_BIN" install --frozen-lockfile
              "$PNPM_BIN" build:release-artifacts
          - name: 发布 frontend Cloudflare 预发 artifact 矩阵
            shell: bash
            env:
              CLOUDFLARE_API_TOKEN: ${{ settings.CLOUDFLARE_API_TOKEN }}
              CLOUDFLARE_ACCOUNT_ID: ${{ settings.CLOUDFLARE_ACCOUNT_ID }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              VITE_AUTH_API_BASE_URL: https://lightclaw.tech
              CLOUDFLARE_PAGES_COMMIT_HASH: ${{ ci.sha }}
              CLOUDFLARE_PAGES_COMMIT_MESSAGE: Cloudflare Pages deploy from archived frontend artifact
              FRONTEND_RELEASE_MATRIX: ${{ variables.FRONTEND_RELEASE_MATRIX }}
              FRONTEND_ARTIFACT_REPOSITORY: lightclaw-shprod.tencentcloudcr.com/lightclaw/frontend-pages
              FRONTEND_ARTIFACT_SOURCE_SHA: ${{ ci.sha }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" || "${{ variables.PIPELINE_MODE }}" == "edgeone-release" || "${{ variables.PIPELINE_MODE }}" == "playground-build" ]]; then
                echo "skip Cloudflare artifact release step because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              case "${{ ci.branch }}" in
                master)
                  ;;
                playground/sandbox-bj-*|playground/sandbox-kr-*)
                  echo "skip Cloudflare artifact release for playground branch ${{ ci.branch }}: shared Cloudflare staging is master-only"
                  exit 0
                  ;;
                *)
                  echo "skip Cloudflare artifact release for non-master branch ${{ ci.branch }}: shared Cloudflare staging is master-only"
                  exit 0
                  ;;
              esac
              echo "============================================================"
              echo "frontend 发布决策：进入 Cloudflare 预发 artifact 发布流程"
              echo "发布矩阵：${FRONTEND_RELEASE_MATRIX}"
              echo "artifact 仓库：${FRONTEND_ARTIFACT_REPOSITORY}"
              echo "artifact source sha：${FRONTEND_ARTIFACT_SOURCE_SHA}"
              echo "发布模型：从 TCR 拉取已归档产物，校验后发布 Cloudflare，不现场构建"
              echo "============================================================"
              matrix_without_separators="${FRONTEND_RELEASE_MATRIX//,/}"
              matrix_without_separators="${matrix_without_separators//[[:space:]]/}"
              if [[ -z "$matrix_without_separators" ]]; then
                echo "FRONTEND_RELEASE_MATRIX is empty; skip Cloudflare artifact release"
                exit 0
              fi
              IFS=',' read -ra release_combos <<< "$FRONTEND_RELEASE_MATRIX"
              for combo in "${release_combos[@]}"; do
                combo="${combo//[[:space:]]/}"
                if [[ -z "$combo" ]]; then
                  continue
                fi
                if [[ "$combo" != cf:* ]]; then
                  echo "frontend Cloudflare artifact release only allows cf:* combos; rejected ${combo}" >&2
                  exit 1
                fi
              done
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              ci_load_cloudflare_credentials
              ci_set_registry_credentials shprod
              ci_ensure_oras
              ci_ensure_node
              ci_ensure_pnpm

              "$NODE_BIN" --version
              "$NPM_BIN" --version

              cd "$REPO_ROOT/frontend"
              "$PNPM_BIN" --version
              "$PNPM_BIN" install --frozen-lockfile
              "$PNPM_BIN" release:cf:artifact
          - name: 构建 frontend GitOps 镜像
            shell: bash
            env:
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_KR1_PASSWORD: ${{ settings.TCR_KR1_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              TCR_SGPROD_PASSWORD: ${{ settings.TCR_SGPROD_PASSWORD }}
            run: |
              PIPELINE_MODE_VALUE="${{ variables.PIPELINE_MODE }}"
              if [[ "$PIPELINE_MODE_VALUE" == "promote" || "$PIPELINE_MODE_VALUE" == "edgeone-release" ]]; then
                echo "skip GitOps image build step because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}"
              export REMOTE_URL GITOPS_BRANCH BUILD_TAG_OVERRIDE
              resolve_playground_envs() {
                local configured="$1"
                local branch_env="$2"
                case "$configured" in
                  ""|auto|__branch__)
                    printf '%s' "$branch_env"
                    ;;
                  *)
                    printf '%s' "$configured"
                    ;;
                esac
              }
              if [[ "$PIPELINE_MODE_VALUE" == "playground-build" ]]; then
                SOURCE_BRANCH='${{ ci.branch }}'
                if [[ -z "$SOURCE_BRANCH" || "$SOURCE_BRANCH" == *'${{'* ]]; then
                  SOURCE_BRANCH="${BK_CI_GIT_REPO_BRANCH:-${DEVOPS_GIT_REPO_BRANCH:-}}"
                fi
                SOURCE_SHA="${{ variables.SOURCE_SHA }}"
                CI_SHA_VALUE='${{ ci.sha }}'
                if [[ -z "$CI_SHA_VALUE" || "$CI_SHA_VALUE" == *'${{'* ]]; then
                  CI_SHA_VALUE="${BK_CI_GIT_HEAD_COMMITS%%,*}"
                fi
                TARGET_ENV="${{ variables.TARGET_ENV }}"
                if [[ "$SOURCE_BRANCH" != "master" ]]; then
                  echo "playground-build must run from master, got ${SOURCE_BRANCH:-empty}" >&2
                  exit 1
                fi
                if [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" != "$CI_SHA_VALUE" || "$(git rev-parse HEAD)" != "$SOURCE_SHA" ]]; then
                  echo "playground-build source mismatch: source=${SOURCE_SHA:-empty} ci=${CI_SHA_VALUE:-empty} head=$(git rev-parse HEAD)" >&2
                  exit 1
                fi
                case "$TARGET_ENV" in
                  sandbox-bj-*|sandbox-kr-*)
                    ;;
                  *)
                    echo "playground-build only supports sandbox-bj-* or sandbox-kr-*: ${TARGET_ENV:-empty}" >&2
                    exit 1
                    ;;
                esac
                BUILD_ENVS="$TARGET_ENV"
                AUTO_PIN_ENVS="$TARGET_ENV"
                echo "Playground 发布决策：master 精确提交 $SOURCE_SHA 构建并自动 pin ${TARGET_ENV}"
              else
              case "${{ ci.branch }}" in
                master)
                  echo "skip GitOps image build for master: frontend production uses archived EdgeOne artifacts"
                  exit 0
                  ;;
                playground/sandbox-bj-*|playground/sandbox-kr-*)
                  PLAYGROUND_ENV="${{ ci.branch }}"
                  PLAYGROUND_ENV="${PLAYGROUND_ENV#playground/}"
                  BUILD_ENVS="$(resolve_playground_envs "auto" "$PLAYGROUND_ENV")"
                  AUTO_PIN_ENVS="$(resolve_playground_envs "auto" "$PLAYGROUND_ENV")"
                  echo "Playground 发布决策：分支 ${{ ci.branch }} 自动映射目标环境 ${PLAYGROUND_ENV}"
                  ;;
                *)
                  echo "unsupported source branch for release: ${{ ci.branch }}" >&2
                  exit 1
                  ;;
              esac
              fi
              echo "BUILD_ENVS=${BUILD_ENVS}"
              echo "AUTO_PIN_ENVS=${AUTO_PIN_ENVS}"
              bash .ci/runtime/build_and_promote_to_gitops.sh frontend frontend "${BUILD_ENVS}" "${AUTO_PIN_ENVS}"
          - name: 手动发布 frontend 到 GitOps
            shell: bash
            run: |
              PIPELINE_MODE_VALUE="${{ variables.PIPELINE_MODE }}"
              case "$PIPELINE_MODE_VALUE" in
                promote)
                  ;;
                *)
                  echo "skip promote step because PIPELINE_MODE=${PIPELINE_MODE_VALUE}"
                  exit 0
                  ;;
              esac
              SOURCE_SHA="${{ variables.SOURCE_SHA }}"
              CI_SHA_VALUE='${{ ci.sha }}'
              if [[ -z "$CI_SHA_VALUE" || "$CI_SHA_VALUE" == *'${{'* ]]; then
                CI_SHA_VALUE="${BK_CI_GIT_HEAD_COMMITS%%,*}"
              fi
              SOURCE_SHA_ORIGIN="variables.SOURCE_SHA"
              if [ -z "$SOURCE_SHA" ]; then
                SOURCE_SHA="$CI_SHA_VALUE"
                SOURCE_SHA_ORIGIN="ci.sha"
              fi
              if [ -z "$SOURCE_SHA" ]; then
                echo "SOURCE_SHA 为空，且 ci.sha 不可用；无法手动发布 frontend 到 GitOps。" >&2
                exit 1
              fi
              echo "============================================================"
              echo "frontend 发布决策：进入 GitOps 手动发布流程"
              echo "触发原因：PIPELINE_MODE=${PIPELINE_MODE_VALUE}，满足 promote 发布条件"
              echo "目标环境：${{ variables.TARGET_ENV }}"
              echo "源码提交：$SOURCE_SHA"
              echo "提交来源：${SOURCE_SHA_ORIGIN}"
              if [ "$SOURCE_SHA_ORIGIN" = "ci.sha" ]; then
                echo "SOURCE_SHA 为空，已回退到本次手动选择的 ci.sha"
              fi
              echo "注意：promote 模式只投影已存在镜像到 GitOps，不构建 TCR 镜像"
              echo "下一步：把 frontend 镜像发布内容投影到 gitops 并创建发布 MR"
              echo "============================================================"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              bash .ci/runtime/promote_bundle_image_to_gitops.sh frontend frontend "${{ variables.TARGET_ENV }}" "$SOURCE_SHA"

  - name: 确认发起 frontend EdgeOne 正式站发布候选
    if: "${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    check-in:
      reviews:
        flows:
          - name: 确认发起 frontend EdgeOne 正式站发布候选
            reviewers: [ "skipzhang", "pablozhong", "erichuyuehu", "sarahzzhang", "mingyuxiao", "xinqishang" ]
        description: |
          本阶段确认是否允许本次 frontend 构建发起 EdgeOne 正式站发布候选。

          点击通过后，流水线会并行发起两个独立的 EdgeOne 正式站发布子流水线：
          - 发布 frontend EdgeOne 国内正式站
          - 发布 frontend EdgeOne 国际正式站

          子流水线仍会各自执行正式发布前的 check-in；本阶段只控制是否允许从本次构建发起生产发布候选。
      timeout-hours: 24
    jobs:
      approve:
        name: 等待确认发起 frontend EdgeOne 正式站发布候选
        runs-on:
          self-hosted: true
          pool-name: cn-pool
        steps:
          - name: frontend EdgeOne 正式站发布候选已确认
            shell: bash
            run: |
              echo "frontend EdgeOne production release candidate fan-out approved"

  - name: 自动发起 frontend EdgeOne 正式站发布候选
    if: "${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    jobs:
      plan:
        name: 打印 frontend EdgeOne 子流水线调用计划
        runs-on:
          self-hosted: true
          pool-name: cn-pool
        steps:
          - name: 打印调用计划
            shell: bash
            run: |
              ARTIFACT_SOURCE_SHA='${{ ci.sha }}'
              if [[ -z "$ARTIFACT_SOURCE_SHA" || "$ARTIFACT_SOURCE_SHA" == *'${{'* ]]; then
                ARTIFACT_SOURCE_SHA="${BK_CI_GIT_HEAD_COMMITS%%,*}"
              fi
              echo "============================================================"
              echo "frontend 发布决策：原生 Stream 子流水线发起 EdgeOne 正式站发布候选"
              echo "artifact source sha：${ARTIFACT_SOURCE_SHA}"
              echo "fan-out：cn / intl 两个 job 并行调用两个独立发布流水线"
              echo "独立审批：由两个目标发布流水线各自 check-in，互不阻塞"
              echo "发布动作：本阶段只发起子流水线，不直接发布 EdgeOne"
              echo "============================================================"

      cn:
        name: 发起 frontend EdgeOne 国内正式站发布候选
        depend-on:
          - plan
        steps:
          - name: 调用 frontend EdgeOne 国内正式站子流水线
            uses: "SubPipelineExecStream@1.*"
            with:
              repositoryType: "URL"
              repositoryFromUrl: "https://git.woa.com/wisp/mono2.git"
              targetBranchFromUrl: "master"
              targetPathFromUrl: ".ci/frontend-edgeone-lightvela.yml"
              buildInfo: ""
              paramsInput:
                - key: "FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA"
                  value: "${{ ci.sha }}"
                - key: "FRONTEND_EDGEONE_ARTIFACT_REF"
                  value: ""

      intl:
        name: 发起 frontend EdgeOne 国际正式站发布候选
        depend-on:
          - plan
        steps:
          - name: 调用 frontend EdgeOne 国际正式站子流水线
            uses: "SubPipelineExecStream@1.*"
            with:
              repositoryType: "URL"
              repositoryFromUrl: "https://git.woa.com/wisp/mono2.git"
              targetBranchFromUrl: "master"
              targetPathFromUrl: ".ci/frontend-edgeone-lightvela-intl.yml"
              buildInfo: ""
              paramsInput:
                - key: "FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA"
                  value: "${{ ci.sha }}"
                - key: "FRONTEND_EDGEONE_ARTIFACT_REF"
                  value: ""
