version: v2.0
name: release-frontend

on:
  push:
    branches: [ master ]
    paths:
      - frontend/**
      - argocd/services/frontend/**
      - argocd/apps/*/frontend.yaml
      - scripts/build-release-image.py
      - scripts/resolve_release_bundle.py
      - scripts/release_bundle_lib.py
      - scripts/release-bundles.yaml
      - scripts/project_release_bundle.py
      - scripts/update_image_pin.py
      - scripts/pin_image_to_gitops.sh
      - scripts/promote_bundle_image_to_gitops.sh
  manual: enabled

concurrency:
  group: mono2-master-release
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

jobs:
  release:
    runs-on:
      self-hosted: true
      pool-name: env
    env:
      GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
    steps:
      - checkout: self
        with:
          fetchDepth: 50
      - name: debug-context
        shell: bash
        run: |
          echo "ci.event=${{ ci.event }}"
          echo "ci.branch=${{ ci.branch }}"
          echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
          echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
          echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
      - id: prepare
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        shell: bash
        run: |
          SHORT_SHA="${{ ci.sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"
          echo "::set-output name=tag::frontend-${SHORT_SHA}"
      - name: deploy-beijing-cloudflare
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ settings.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ settings.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: lightclaw
          VITE_AUTH_API_BASE_URL: https://lightclaw.tech
          CLOUDFLARE_PAGES_COMMIT_HASH: ${{ ci.sha }}
        run: |
          CF_API_TOKEN_FILE="${CLOUDFLARE_API_TOKEN_FILE:-/etc/lightclaw-ci/cloudflare_api_token}"
          CF_ACCOUNT_ID_FILE="${CLOUDFLARE_ACCOUNT_ID_FILE:-/etc/lightclaw-ci/cloudflare_account_id}"
          NODE_VERSION="${NODE_VERSION_OVERRIDE:-22.12.0}"
          NODE_DIST="node-v${NODE_VERSION}-linux-x64"
          NODE_ARCHIVE="${NODE_DIST}.tar.xz"
          NODE_CACHE_ROOT="${HOME}/.cache/lightclaw-ci/node"
          NODE_INSTALL_DIR="${NODE_CACHE_ROOT}/${NODE_DIST}"

          if [[ -r "$CF_API_TOKEN_FILE" ]]; then
            export CLOUDFLARE_API_TOKEN="$(tr -d '\r\n' < "$CF_API_TOKEN_FILE")"
            echo "cloudflare api token loaded from file:$CF_API_TOKEN_FILE"
          else
            echo "cloudflare api token loaded from settings"
          fi

          if [[ -r "$CF_ACCOUNT_ID_FILE" ]]; then
            export CLOUDFLARE_ACCOUNT_ID="$(tr -d '\r\n' < "$CF_ACCOUNT_ID_FILE")"
            echo "cloudflare account id loaded from file:$CF_ACCOUNT_ID_FILE"
          else
            echo "cloudflare account id loaded from settings"
          fi

          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

          mkdir -p "$NODE_CACHE_ROOT"
          if [[ ! -x "${NODE_INSTALL_DIR}/bin/node" ]]; then
            curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${NODE_ARCHIVE}" -o "${NODE_CACHE_ROOT}/${NODE_ARCHIVE}"
            tar -xJf "${NODE_CACHE_ROOT}/${NODE_ARCHIVE}" -C "$NODE_CACHE_ROOT"
          fi
          export PATH="${NODE_INSTALL_DIR}/bin:${PATH}"

          node --version
          npm --version

          npm install -g pnpm@10.32.1

          cd frontend
          rm -rf node_modules
          pnpm --version
          pnpm install --no-frozen-lockfile
          pnpm build
          pnpm deploy:cf
      - name: promote-manual
        if: ${{ variables.PIPELINE_MODE }} == 'promote'
        shell: bash
        run: |
          test -n "${{ variables.SOURCE_SHA }}"
          REMOTE_URL="git@git.woa.com:wisp/mono2.git" \
          GITOPS_BRANCH=gitops \
          bash scripts/promote_bundle_image_to_gitops.sh frontend frontend "${{ variables.TARGET_ENV }}" "${{ variables.SOURCE_SHA }}"
