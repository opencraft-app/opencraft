version: v2.0
name: 构建 service-gateway

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - service-gateway/**
      - argocd/services/service-gateway/**
      - argocd/apps/*/service-gateway.yaml
      - argocd/secrets/*/service-gateway-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template:
    path: .ci/templates/service-release.yml
    variables:
      SERVICE: service-gateway
      BUNDLE: service-gateway
      DISPLAY_NAME: service-gateway
