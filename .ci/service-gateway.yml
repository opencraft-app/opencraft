version: v2.0
name: 构建 service-gateway

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
    paths:
      - service-gateway/**
      - argocd/services/service-gateway/**
      - argocd/apps/*/service-gateway.yaml
      - argocd/secrets/*/service-gateway-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-service-gateway
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  # Refresh compiled Stream pipeline after service-release template changes.
  parameters:
    SERVICE: service-gateway
    BUNDLE: service-gateway
    DISPLAY_NAME: service-gateway
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
