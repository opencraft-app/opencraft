version: v2.0
name: release-service-gateway

on:
  push:
    branches: [ master ]
    paths:
      - admin-gateway/**
      - service-gateway/**
      - argocd/services/admin-gateway/**
      - argocd/services/service-gateway/**
      - argocd/apps/*/admin-gateway.yaml
      - argocd/apps/*/service-gateway.yaml
      - argocd/secrets/*/admin-gateway-runtime-secrets.sops.yaml
      - argocd/secrets/*/service-gateway-runtime-secrets.sops.yaml
  manual: enabled

concurrency:
  group: mono2-master-release
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

jobs:
  release:
    runs-on:
      self-hosted: true
      pool-name: env
    env:
      GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
    steps:
      - checkout: self
        with:
          fetchDepth: 50
      - name: debug-context
        shell: bash
        run: |
          echo "ci.event=${{ ci.event }}"
          echo "ci.branch=${{ ci.branch }}"
          echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
          echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
          echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
      - id: prepare
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        shell: bash
        run: |
          SHORT_SHA="${{ ci.sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"
          echo "::set-output name=tag::service-gateway-${SHORT_SHA}"
      - name: build-and-promote-beijing
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        shell: bash
        env:
          TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
          TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
        run: |
          source .ci/init.sh
          ci_init_repo_root
          REMOTE_URL="git@git.woa.com:wisp/mono2.git" \
          GITOPS_BRANCH=gitops \
          BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}" \
          bash scripts/build_and_promote_to_gitops.sh service-gateway service-gateway,admin-gateway beijing-sandbox,shprod beijing-sandbox
      - name: promote-manual
        if: ${{ variables.PIPELINE_MODE }} == 'promote'
        shell: bash
        run: |
          test -n "${{ variables.SOURCE_SHA }}"
          source .ci/init.sh
          ci_init_repo_root
          REMOTE_URL="git@git.woa.com:wisp/mono2.git" \
          GITOPS_BRANCH=gitops \
          bash scripts/promote_bundle_image_to_gitops.sh service-gateway service-gateway,admin-gateway "${{ variables.TARGET_ENV }}" "${{ variables.SOURCE_SHA }}"
