version: v2.0
name: 构建 trade

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
      - playground/sandbox-kr-*
    paths:
      - trade/**
      - argocd/services/trade/**
      - argocd/apps/shprod/trade.yaml
      - argocd/projects/shprod-trade.yaml
      - argocd/apps/sgprod/trade.yaml
      - argocd/projects/sgprod-trade.yaml
      - argocd/catalogs/sandbox/beijing-sandbox/trade.yaml
      - argocd/catalogs/playground/beijing-playground/*/trade.yaml
      - argocd/catalogs/playground/seoul-playground/*/trade.yaml
      - argocd/secrets/*/trade-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-trade
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  # Refresh compiled Stream pipeline after service-release template changes.
  parameters:
    SERVICE: trade
    BUNDLE: trade
    DISPLAY_NAME: trade
    DEFAULT_TARGET_ENV: beijing-sandbox
    # sgprod 加入构建矩阵以支持新加坡现网国际站计费上线；
    # 与 ctl / lightclaw-auth / payment 等服务保持一致，AUTO_PIN 仍只含
    # beijing-sandbox —— 正式环境（shprod / sgprod）必须人工触发 promote 并由人合并
    # 发布 MR，不自动跟随 master。
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    ENABLE_MASTER_PROD_DB_MIGRATION: true
    ENABLE_MASTER_PROD_PROMOTE: true
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
