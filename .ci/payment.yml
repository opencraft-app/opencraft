version: v2.0
name: 构建 payment

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - payment/**
      - argocd/services/payment/**
      - argocd/apps/*/payment.yaml
      - argocd/secrets/*/payment-runtime-secrets.sops.yaml
  manual: enabled

concurrency:
  group: mono2-master-release
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 构建 payment
    jobs:
      release:
        name: 构建 payment 镜像
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 打印 payment 构建上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
              echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
          - id: prepare
            name: 准备 payment 构建标签
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              SHORT_SHA="${{ ci.sha }}"
              SHORT_SHA="${SHORT_SHA:0:12}"
              echo "::set-output name=tag::payment-${SHORT_SHA}"
          - name: 构建并推进 payment 北京测试
            shell: bash
            env:
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}"
              export REMOTE_URL GITOPS_BRANCH BUILD_TAG_OVERRIDE
              case "${{ ci.branch }}" in
                master)
                  BUILD_ENVS="beijing-sandbox,shprod"
                  AUTO_PIN_ENVS="beijing-sandbox"
                  ;;
                playground/sandbox-bj-2)
                  BUILD_ENVS="beijing-sandbox-2"
                  AUTO_PIN_ENVS="beijing-sandbox-2"
                  ;;
                *)
                  echo "unsupported source branch for release: ${{ ci.branch }}" >&2
                  exit 1
                  ;;
              esac
              echo "BUILD_ENVS=${BUILD_ENVS}"
              echo "AUTO_PIN_ENVS=${AUTO_PIN_ENVS}"
              bash .ci/runtime/build_and_promote_to_gitops.sh payment payment "${BUILD_ENVS}" "${AUTO_PIN_ENVS}"
          - name: 手动发布 payment 到 GitOps
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "promote" ]]; then
                echo "skip promote step because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              SOURCE_SHA="${{ variables.SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
                echo "SOURCE_SHA not provided; default to ci.sha=$SOURCE_SHA"
              fi
              test -n "$SOURCE_SHA"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              bash .ci/runtime/promote_bundle_image_to_gitops.sh payment payment "${{ variables.TARGET_ENV }}" "$SOURCE_SHA"
