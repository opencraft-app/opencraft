version: v2.0
name: 构建 payment

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - payment/**
      - argocd/services/payment/**
      - argocd/apps/*/payment.yaml
      - argocd/secrets/*/payment-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template:
    path: .ci/templates/service-release.yml
    variables:
      SERVICE: payment
      BUNDLE: payment
      DISPLAY_NAME: payment
