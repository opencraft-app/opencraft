version: v2.0
name: 构建 credit

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
    paths:
      - credit/**
      - argocd/services/credit/**
      - argocd/catalogs/playground/beijing-playground/*/credit.yaml
      - argocd/secrets/*/credit-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-credit
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: credit
    BUNDLE: credit
    DISPLAY_NAME: credit
    DEFAULT_TARGET_ENV: sandbox-bj-7
    MASTER_BUILD_ENVS: sandbox-bj-7
    MASTER_AUTO_PIN_ENVS: sandbox-bj-7
    ENABLE_MASTER_PROD_DB_MIGRATION: true
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
