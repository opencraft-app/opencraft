version: v2.0
name: 构建 credit

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
      - playground/sandbox-kr-*
    paths:
      - credit/**
      - argocd/services/credit/**
      - argocd/catalogs/sandbox/beijing-sandbox/credit.yaml
      - argocd/catalogs/playground/beijing-playground/*/credit.yaml
      - argocd/catalogs/playground/seoul-playground/*/credit.yaml
      - argocd/catalogs/playground/tokyo-playground/*/credit.yaml
      - argocd/apps/*/credit.yaml
      - argocd/projects/*-credit.yaml
      - argocd/services/trade/*/patch-credit.yaml
      - argocd/services/trade/sandbox-jp-*/patch-playground-db.yaml
      - argocd/services/service-gateway/beijing-sandbox/config.yaml
      - argocd/services/service-gateway/sandbox-jp-*/config.yaml
      - argocd/services/service-gateway/shprod/config.yaml
      - argocd/services/service-gateway/sgprod/config.yaml
      - argocd/secrets/*/credit-runtime-secrets.sops.yaml
      - scripts/ssm_manifest.credit.*.yaml
      - scripts/ssm_manifest.runtime.sandbox-jp-1.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-credit
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: credit
    BUNDLE: credit
    DISPLAY_NAME: credit
    DEFAULT_TARGET_ENV: beijing-sandbox
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    ENABLE_MASTER_PROD_DB_MIGRATION: true
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
