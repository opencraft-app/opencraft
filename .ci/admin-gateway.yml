version: v2.0
name: 构建 admin-gateway

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
      - playground/sandbox-kr-*
    paths:
      - admin-gateway/**
      - service-gateway/Dockerfile
      - service-gateway/**
      - argocd/services/admin-gateway/**
      - argocd/apps/*/admin-gateway.yaml
      - argocd/secrets/*/admin-gateway-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-admin-gateway
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  # Refresh compiled Stream pipeline after service-release template changes.
  parameters:
    SERVICE: admin-gateway
    BUNDLE: admin-gateway
    DISPLAY_NAME: admin-gateway
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
