version: v2.0
name: 验证 OpenCraft

on:
  push:
    branches:
      - master
    paths:
      - opencraft/**
      - frontend/src/pages/marketing/**
      - frontend/src/components/domain/**
      - frontend/src/components/ui/**
      - frontend/src/contexts/**
      - frontend/src/domain/**
      - frontend/src/i18n/**
      - frontend/src/lib/**
      - frontend/src/observability/**
      - frontend/src/repositories/**
      - frontend/src/services/**
      - frontend/public/assets/skills/**
      - frontend/public/tat-hermes-web-proxy-sw.js
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-opencraft-validation
  cancel-in-progress: true
  queue-length: 1
  queue-timeout-minutes: 120

stages:
  - name: 验证 OpenCraft
    jobs:
      gate:
        name: 运行 OpenCraft 完整门禁
        runs-on:
          self-hosted: true
          pool-name: cn-pool
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
              enableVirtualMergeBranch: false
          - name: 校验 OpenCraft
            shell: bash
            run: |
              set -euo pipefail
              bash opencraft/checks/guard.sh
