version: v2.0
name: 北京沙箱族 GitOps 漂移审计

on:
  schedules:
    cron: "*/2 * * * *"
    branches: [ master ]
    always: true
  manual: enabled

stages:
  - name: 北京沙箱族 GitOps 漂移审计
    jobs:
      audit:
        name: 对比北京沙箱族 origin/gitops 与 live Argo
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          WEWORK_DRIFT_AUDIT_WEBHOOK: ${{ settings.WEWORK_DRIFT_AUDIT_WEBHOOK }}
          WEWORK_DRIFT_AUDIT_WEBHOOK_FALLBACK: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=a7c3f30c-7dcc-42e7-9f92-440b26216119"
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 执行北京沙箱族 GitOps 漂移审计
            shell: bash
            run: |
              source .ci/init.sh
              ci_init_repo_root
              ci_require_commands git python3
              git fetch --tags origin master gitops
              status=0
              for env in beijing-sandbox beijing-sandbox-2; do
                echo "============================================================"
                echo "GitOps 漂移审计：${env}"
                echo "说明：对比 origin/gitops catalog/AppSet 期望态与 live Argo 实际状态"
                echo "============================================================"
                if ! python3 .ci/runtime/commands/audit_gitops_drift.py \
                  --repo-root "$REPO_ROOT" \
                  --env "$env" \
                  --gitops-ref origin/gitops; then
                  status=1
                fi
              done
              exit "$status"
