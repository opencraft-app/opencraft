version: v2.0
name: 构建 ctl 东京

on:
  push:
    branches:
      - master
      - playground/sandbox-jp-*
    paths:
      - ctl/**
      - argocd/services/ctl/**
      - argocd/apps/*/ctl.yaml
      - argocd/secrets/*/ctl-conf-common.sops.yaml
      - argocd/secrets/*/ctl-conf-rewrite.sops.yaml
      - argocd/secrets/*/ctl-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-tokyo-ctl
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: ctl
    BUNDLE: ctl
    DISPLAY_NAME: ctl 东京
    DEFAULT_TARGET_ENV: sandbox-jp-1
    MASTER_BUILD_ENVS: sandbox-jp-1
    MASTER_AUTO_PIN_ENVS: sandbox-jp-1
    ENABLE_MASTER_PROD_PROMOTE: false
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
