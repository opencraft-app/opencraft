version: v2.0
name: gitops-promotion-check

on:
  push:
    branches:
      - promote-*

stages:
  - name: GitOps MR 前置验收
    jobs:
      validate:
        name: 静态验收与严格 Kustomize 验收
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 校验 promote 分支
            shell: bash
            env:
              SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
              SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/release-bundles.yaml" \
                ".ci/runtime/update_image_pin.py" \
                ".ci/runtime/project_release_bundle.py" \
                ".ci/runtime/release_bundle_lib.py" \
                ".ci/runtime/gitops_merge_request.py" \
                ".ci/runtime/verify_gitops_release.py" \
                ".ci/runtime/validate_gitops_static.py" \
                ".ci/runtime/validate_gitops_kustomize.py"
              ci_init_repo_root
              git diff --name-only HEAD~1..HEAD || true
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/update_image_pin.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/project_release_bundle.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/validate_gitops_static.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/validate_gitops_kustomize.py" --help >/dev/null
              python3 -m py_compile \
                "${CI_RUNTIME_DIR}/.ci/runtime/release_bundle_lib.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/gitops_merge_request.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/verify_gitops_release.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/validate_gitops_static.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/validate_gitops_kustomize.py"
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-*)
                  ci_require_gitops_validation_tools
                  ci_prepare_sops_age_key
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/validate_gitops_static.py" \
                    --repo-root "$REPO_ROOT" \
                    --env beijing-sandbox \
                    --bundle-manifest "${CI_RUNTIME_DIR}/.ci/runtime/release-bundles.yaml"
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/validate_gitops_kustomize.py" \
                    --repo-root "$REPO_ROOT" \
                    --env beijing-sandbox
                  ;;
                *)
                  echo "skip Beijing AppSet GitOps validation for ${{ ci.branch }}"
                  ;;
              esac
              echo "gitops promotion check passed"

  - name: 自动合并 GitOps MR
    jobs:
      auto_merge:
        name: 等待检查通过并合并 MR
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 自动合并北京 promote MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/gitops_merge_request.py"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/gitops_merge_request.py" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --title "Auto-merge existing Beijing GitOps MR" \
                    --description "Auto-merge existing Beijing GitOps MR from promote branch tail." \
                    --auto-merge \
                    --remove-source-branch
                  ;;
                *)
                  echo "skip auto-merge for ${{ ci.branch }}"
                  ;;
              esac

  - name: Argo 收敛验收
    jobs:
      verify_convergence:
        name: 校验 Synced/Healthy 与 workload image
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 校验 Argo 收敛并评论 MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/verify_gitops_release.py"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/verify_gitops_release.py" \
                    --repo-root "$REPO_ROOT" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops
                  ;;
                *)
                  echo "skip Argo convergence verification for ${{ ci.branch }}"
                  ;;
              esac

  - name: 清理 promote 分支
    jobs:
      cleanup_branch:
        name: GitOps 合并后清理源分支
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 清理北京 promote 分支
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/gitops_cleanup_source_branch.py"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/gitops_cleanup_source_branch.py" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --wait-seconds 120 \
                    --poll-seconds 5
                  ;;
                *)
                  echo "skip branch cleanup for ${{ ci.branch }}"
                  ;;
              esac
