version: v2.0
name: gitops-promotion-check

on:
  push:
    branches:
      - promote-*

jobs:
  validate:
    runs-on:
      self-hosted: true
      pool-name: env
    steps:
      - checkout: self
        with:
          fetchDepth: 50
      - name: verify-gitops-promotion
        shell: bash
        run: |
          echo "ci.event=${{ ci.event }}"
          echo "ci.branch=${{ ci.branch }}"
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          git diff --name-only HEAD~1..HEAD || true
          python3 scripts/update_image_pin.py --help >/dev/null
          python3 scripts/project_release_bundle.py --help >/dev/null
          python3 -m py_compile scripts/release_bundle_lib.py
          python3 -m py_compile scripts/gitops_merge_request.py
          python3 -m py_compile scripts/verify_gitops_release.py
          echo "gitops promotion check passed"
      - name: auto-merge-beijing-promote-mr
        shell: bash
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        run: |
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          case "${{ ci.branch }}" in
            promote-beijing-sandbox-*)
              python3 scripts/gitops_merge_request.py \
                --source-branch "${{ ci.branch }}" \
                --target-branch gitops \
                --title "Auto-merge existing Beijing GitOps MR" \
                --description "Auto-merge existing Beijing GitOps MR from promote branch tail." \
                --auto-merge \
                --remove-source-branch
              ;;
            *)
              echo "skip auto-merge for ${{ ci.branch }}"
              ;;
          esac
      - name: verify-argocd-convergence-and-comment-mr
        shell: bash
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        run: |
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          case "${{ ci.branch }}" in
            promote-beijing-sandbox-*)
              python3 scripts/verify_gitops_release.py \
                --repo-root "$REPO_ROOT" \
                --source-branch "${{ ci.branch }}" \
                --target-branch gitops
              ;;
            *)
              echo "skip Argo convergence verification for ${{ ci.branch }}"
              ;;
          esac
      - name: cleanup-beijing-promote-branch
        shell: bash
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        run: |
          REPO_ROOT="$(git rev-parse --show-toplevel)"
          cd "$REPO_ROOT"
          case "${{ ci.branch }}" in
            promote-beijing-sandbox-*)
              python3 scripts/gitops_cleanup_source_branch.py \
                --source-branch "${{ ci.branch }}" \
                --target-branch gitops \
                --wait-seconds 120 \
                --poll-seconds 5
              ;;
            *)
              echo "skip branch cleanup for ${{ ci.branch }}"
              ;;
          esac
