version: v2.0
name: GitOps 验收与自动合并

on:
  push:
    branches:
      - promote-*

stages:
  - name: GitOps MR 前置验收
    jobs:
      validate:
        name: 静态验收与严格 Kustomize 验收
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 校验 promote 分支
            shell: bash
            env:
              SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
              SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_manifest "${CI_RUNTIME_DIR}" ".ci/runtime/materialize-files.txt"
              ci_init_repo_root
              git diff --name-only HEAD~1..HEAD || true
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/update_image_pin.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/project_release_bundle.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/plan_release_gates.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/verify_db_contract.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/verify_shprod_sync_preflight.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/validate_gitops_static.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/validate_gitops_kustomize.py" --help >/dev/null
              python3 -m py_compile $(find \
                "${CI_RUNTIME_DIR}/.ci/runtime/contracts" \
                "${CI_RUNTIME_DIR}/.ci/runtime/gitops" \
                "${CI_RUNTIME_DIR}/.ci/runtime/db_gates" \
                "${CI_RUNTIME_DIR}/.ci/runtime/commands" \
                -name '*.py' | sort)
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*)
                  TARGET_ENV=beijing-sandbox-2
                  ;;
                promote-beijing-sandbox-*)
                  TARGET_ENV=beijing-sandbox
                  ;;
                promote-shprod-*)
                  TARGET_ENV=shprod
                  ;;
                *)
                  TARGET_ENV=""
                  ;;
              esac
              if [[ -n "$TARGET_ENV" ]]; then
                ci_require_gitops_validation_tools
                ci_prepare_sops_age_key
                python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/validate_gitops_static.py" \
                  --repo-root "$REPO_ROOT" \
                  --env "$TARGET_ENV" \
                  --bundle-manifest "${CI_RUNTIME_DIR}/.ci/runtime/release-bundles.manifest"
                if [[ "$TARGET_ENV" == "shprod" ]]; then
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/validate_gitops_kustomize.py" \
                    --repo-root "$REPO_ROOT" \
                    --env "$TARGET_ENV" \
                    --changed-only
                else
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/validate_gitops_kustomize.py" \
                    --repo-root "$REPO_ROOT" \
                    --env "$TARGET_ENV"
                fi
              else
                echo "skip GitOps static/Kustomize validation for unsupported promote branch ${{ ci.branch }}"
              fi
              echo "gitops promotion check passed"

  - name: 自动合并 GitOps MR
    jobs:
      auto_merge:
        name: 等待检查通过并合并 MR
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 按环境策略自动合并 GitOps MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_manifest "${CI_RUNTIME_DIR}" ".ci/runtime/materialize-files.txt"
              ci_init_repo_root
              COMMIT_MESSAGE="$(git log -1 --format=%B)"
              trailer_value() {
                printf '%s\n' "$COMMIT_MESSAGE" | awk -F': ' -v key="$1" '$1 == key {print $2; exit}'
              }
              GATE_AUTO_MERGE_ALLOWED="$(trailer_value Release-gate-auto-merge)"
              GATE_ARGO_SYNC="$(trailer_value Release-gate-argo-sync)"
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*|promote-beijing-sandbox-*)
                  if [[ "$GATE_AUTO_MERGE_ALLOWED" != "true" ]]; then
                    echo "refuse Beijing GitOps auto-merge because release gate did not allow auto merge"
                    echo "Release-gate-auto-merge=${GATE_AUTO_MERGE_ALLOWED:-missing}"
                    exit 1
                  fi
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/gitops_merge_request.py" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --title "自动合并北京 GitOps 发布 MR" \
                    --description "promote 分支检查通过后自动合并到 gitops，并进入 Argo 收敛验收。" \
                    --auto-merge \
                    --remove-source-branch
                  ;;
                promote-shprod-*)
                  if [[ "$GATE_AUTO_MERGE_ALLOWED" != "true" ]]; then
                    echo "skip shprod GitOps auto-merge because release gate is not satisfied"
                    echo "Release-gate-auto-merge=${GATE_AUTO_MERGE_ALLOWED:-missing}"
                    exit 0
                  fi
                  if [[ "$GATE_ARGO_SYNC" != "manual" ]]; then
                    echo "refuse shprod GitOps auto-merge because Argo sync policy is not manual"
                    echo "Release-gate-argo-sync=${GATE_ARGO_SYNC:-missing}"
                    exit 1
                  fi
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/gitops_merge_request.py" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --title "自动合并上海生产 GitOps 待同步 MR" \
                    --description "promote 分支检查通过后自动合并到 gitops；上海生产仅进入待同步状态，不执行 Argo 自动 sync。" \
                    --auto-merge
                  ;;
                *)
                  echo "skip auto-merge for ${{ ci.branch }}"
                  ;;
              esac

  - name: GitOps 合并后验收
    jobs:
      post_merge_verify:
        name: 北京收敛与上海待同步验收
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 校验 GitOps 合并状态并评论 MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_manifest "${CI_RUNTIME_DIR}" ".ci/runtime/materialize-files.txt"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*|promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/verify_gitops_release.py" \
                    --repo-root "$REPO_ROOT" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops
                  ;;
                promote-shprod-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/verify_gitops_release.py" \
                    --repo-root "$REPO_ROOT" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --merge-only \
                    --merge-wait-seconds 3600 \
                    --merge-poll-seconds 15
                  ;;
                *)
                  echo "skip Argo convergence verification for ${{ ci.branch }}"
                  ;;
              esac

  - name: 上海生产人工 Sync 审批
    if: startsWith(ci.branch, 'promote-shprod-')
    check-in:
      reviews:
        flows:
          - name: 上海生产发布审批
            reviewers:
              - skipzhang
        description: |
          确认 GitOps MR 已合入、DB readiness 可通过，随后人工执行 Argo sync。
        content-format: markdown
        notify-type: [RTX]
      timeout-hours: 24
    jobs:
      shprod_sync_preflight:
        name: 人工审批后 DB readiness 只读校验
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 校验人工 Argo sync 前 DB readiness
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_manifest "${CI_RUNTIME_DIR}" ".ci/runtime/materialize-files.txt"
              ci_init_repo_root
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/verify_shprod_sync_preflight.py" \
                --repo-root "$REPO_ROOT" \
                --source-branch "${{ ci.branch }}" \
                --apply \
                --wait
              echo "上海生产同步前置校验通过；请在发布窗口人工执行 Argo sync。"

  - name: 清理 promote 分支
    jobs:
      cleanup_branch:
        name: GitOps 合并后清理源分支
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 清理北京发布分支
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_manifest "${CI_RUNTIME_DIR}" ".ci/runtime/materialize-files.txt"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*|promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/gitops_cleanup_source_branch.py" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --wait-seconds 120 \
                    --poll-seconds 5
                  ;;
                promote-shprod-*)
                  echo "skip source branch cleanup for production promote branch ${{ ci.branch }}; shprod keeps promote branches to avoid delete-event checkout failures"
                  ;;
                *)
                  echo "skip branch cleanup for ${{ ci.branch }}"
                  ;;
              esac
