version: v2.0
name: GitOps 发布验收与自动合并

on:
  push:
    branches:
      - promote-*

stages:
  - name: GitOps MR 前置验收
    jobs:
      validate:
        name: 静态验收与严格 Kustomize 验收
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 校验 promote 分支
            shell: bash
            env:
              SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
              SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/release-bundles.yaml" \
                ".ci/runtime/harness_ci/commands/update_image_pin.py" \
                ".ci/runtime/harness_ci/image_pin.py" \
                ".ci/runtime/harness_ci/commands/project_release_bundle.py" \
                ".ci/runtime/harness_ci/project_release_bundle.py" \
                ".ci/runtime/harness_ci/__init__.py" \
                ".ci/runtime/harness_ci/bundles.py" \
                ".ci/runtime/harness_ci/gongfeng.py" \
                ".ci/runtime/harness_ci/commands/gitops_merge_request.py" \
                ".ci/runtime/harness_ci/gitops_merge_request.py" \
                ".ci/runtime/harness_ci/commands/verify_gitops_release.py" \
                ".ci/runtime/harness_ci/gitops_release_verifier.py" \
                ".ci/runtime/harness_ci/commands/validate_gitops_static.py" \
                ".ci/runtime/harness_ci/gitops_static_validation.py" \
                ".ci/runtime/harness_ci/commands/validate_gitops_kustomize.py" \
                ".ci/runtime/harness_ci/gitops_kustomize_validation.py"
              ci_init_repo_root
              git diff --name-only HEAD~1..HEAD || true
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/update_image_pin.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/project_release_bundle.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/validate_gitops_static.py" --help >/dev/null
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/validate_gitops_kustomize.py" --help >/dev/null
              python3 -m py_compile \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/__init__.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/bundles.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/gongfeng.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/update_image_pin.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/image_pin.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/project_release_bundle.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/project_release_bundle.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/gitops_merge_request.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/gitops_merge_request.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/verify_gitops_release.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/gitops_release_verifier.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/validate_gitops_static.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/gitops_static_validation.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/validate_gitops_kustomize.py" \
                "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/gitops_kustomize_validation.py"
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*)
                  TARGET_ENV=beijing-sandbox-2
                  ;;
                promote-beijing-sandbox-*)
                  TARGET_ENV=beijing-sandbox
                  ;;
                *)
                  TARGET_ENV=""
                  ;;
              esac
              if [[ -n "$TARGET_ENV" ]]; then
                ci_require_gitops_validation_tools
                ci_prepare_sops_age_key
                python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/validate_gitops_static.py" \
                  --repo-root "$REPO_ROOT" \
                  --env "$TARGET_ENV" \
                  --bundle-manifest "${CI_RUNTIME_DIR}/.ci/runtime/release-bundles.yaml"
                python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/validate_gitops_kustomize.py" \
                  --repo-root "$REPO_ROOT" \
                  --env "$TARGET_ENV"
              else
                echo "skip Beijing AppSet GitOps validation for ${{ ci.branch }}"
              fi
              echo "gitops promotion check passed"

  - name: 自动合并 GitOps MR
    jobs:
      auto_merge:
        name: 等待检查通过并合并 MR
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 自动合并北京发布 MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/harness_ci/__init__.py" \
                ".ci/runtime/harness_ci/gongfeng.py" \
                ".ci/runtime/harness_ci/commands/gitops_merge_request.py" \
                ".ci/runtime/harness_ci/gitops_merge_request.py"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*|promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/gitops_merge_request.py" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --title "自动合并北京 GitOps 发布 MR" \
                    --description "promote 分支检查通过后自动合并到 gitops，并进入 Argo 收敛验收。" \
                    --auto-merge \
                    --remove-source-branch
                  ;;
                *)
                  echo "skip auto-merge for ${{ ci.branch }}"
                  ;;
              esac

  - name: Argo 收敛验收
    jobs:
      verify_convergence:
        name: 校验 Argo 同步健康与镜像
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 校验 Argo 收敛并评论 MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/harness_ci/__init__.py" \
                ".ci/runtime/harness_ci/commands/verify_gitops_release.py" \
                ".ci/runtime/harness_ci/gitops_release_verifier.py"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*|promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/verify_gitops_release.py" \
                    --repo-root "$REPO_ROOT" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops
                  ;;
                *)
                  echo "skip Argo convergence verification for ${{ ci.branch }}"
                  ;;
              esac

  - name: 清理 promote 分支
    jobs:
      cleanup_branch:
        name: GitOps 合并后清理源分支
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: 清理北京发布分支
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci" "${CI_RUNTIME_DIR}/.ci/runtime"
              git show HEAD:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_prepare_runtime_ref "${CI_RUNTIME_REF:-origin/master}"
              ci_export_gongfeng_defaults
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_export_gongfeng_defaults
              ci_materialize_runtime_files "${CI_RUNTIME_DIR}" \
                ".ci/init.sh" \
                ".ci/runtime/harness_ci/__init__.py" \
                ".ci/runtime/harness_ci/gongfeng.py" \
                ".ci/runtime/harness_ci/commands/gitops_cleanup_source_branch.py" \
                ".ci/runtime/harness_ci/gitops_cleanup_source_branch.py"
              ci_init_repo_root
              case "${{ ci.branch }}" in
                promote-beijing-sandbox-2-*|promote-beijing-sandbox-*)
                  python3 "${CI_RUNTIME_DIR}/.ci/runtime/harness_ci/commands/gitops_cleanup_source_branch.py" \
                    --source-branch "${{ ci.branch }}" \
                    --target-branch gitops \
                    --wait-seconds 120 \
                    --poll-seconds 5
                  ;;
                *)
                  echo "skip branch cleanup for ${{ ci.branch }}"
                  ;;
              esac
