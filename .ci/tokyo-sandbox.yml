version: v2.0
name: 构建 sandbox 东京

on:
  push:
    branches:
      - master
      - playground/sandbox-jp-*
    paths:
      - sandbox/**
      - argocd/services/sandbox/**
      - argocd/apps/beijing-sandbox/sandbox-family-appset.yaml
      - argocd/catalogs/sandbox/*/sandbox.yaml
      - argocd/secrets/*/sandbox-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-tokyo-sandbox
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: sandbox
    BUNDLE: sandbox
    DISPLAY_NAME: sandbox 东京
    DEFAULT_TARGET_ENV: sandbox-jp-1
    MASTER_BUILD_ENVS: sandbox-jp-1
    MASTER_AUTO_PIN_ENVS: sandbox-jp-1
    ENABLE_MASTER_PROD_PROMOTE: false
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
