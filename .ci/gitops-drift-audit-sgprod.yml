version: v2.0
name: 新加坡生产 GitOps 漂移审计

on:
  schedules:
    cron: "17 */2 * * *"
    branches: [ master ]
    always: true
  manual: enabled

stages:
  - name: 新加坡生产 GitOps 漂移审计
    jobs:
      audit:
        name: 对比 origin/gitops 与 live Argo
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          WEWORK_DRIFT_AUDIT_WEBHOOK: ${{ settings.WEWORK_DRIFT_AUDIT_WEBHOOK }}
          WEWORK_DRIFT_AUDIT_WEBHOOK_FALLBACK: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=a7c3f30c-7dcc-42e7-9f92-440b26216119"
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 执行新加坡生产 GitOps 漂移审计
            shell: bash
            run: |
              source .ci/init.sh
              ci_init_repo_root
              ci_require_commands git python3
              git fetch --tags origin master gitops
              python3 .ci/runtime/commands/audit_gitops_drift.py \
                --repo-root "$REPO_ROOT" \
                --env sgprod \
                --gitops-ref origin/gitops
