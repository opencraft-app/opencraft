version: v2.0
name: 构建 gateway-dashboard

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - gateway-dashboard/**
      - argocd/services/gateway-dashboard/**
      - argocd/apps/*/gateway-dashboard.yaml
      - argocd/secrets/*/gateway-dashboard-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-master-release
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: gateway-dashboard
    BUNDLE: gateway-dashboard
    DISPLAY_NAME: gateway-dashboard
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: beijing-sandbox-2
    PLAYGROUND_AUTO_PIN_ENVS: beijing-sandbox-2
