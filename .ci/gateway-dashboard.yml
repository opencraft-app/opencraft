version: v2.0
name: 构建 gateway-dashboard

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - gateway-dashboard/**
      - argocd/services/gateway-dashboard/**
      - argocd/apps/*/gateway-dashboard.yaml
      - argocd/secrets/*/gateway-dashboard-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template:
    path: .ci/templates/service-release.yml
    variables:
      SERVICE: gateway-dashboard
      BUNDLE: gateway-dashboard
      DISPLAY_NAME: gateway-dashboard
