version: v2.0
name: 发布 frontend EdgeOne 正式站编排

# 历史说明：
# 本文件最初用于验证 subpipeline call / fan-out 能力。当前保留文件路径，
# 是为了复用已创建的 BK-CI pipeline id，由构建 frontend 通过 build_start
# API 自动启动本编排流水线。
#
# 已验证的边界：
# - Stream YAML 不能直接用 `uses: subPipelineCallAtom@...` 调用子流水线；
#   它会按市场 atom 解析并报 PIPELINE_RUN_ERROR。
# - `manualReviewUserTask@...` 也不能作为 job step 级审核使用。
# - 可用模型是 stage `check-in` + job DAG fan-out + build_start API。

on:
  manual: enabled

concurrency:
  group: mono2-frontend-edgeone-release-orchestrator
  cancel-in-progress: false
  queue-length: 10
  queue-timeout-minutes: 480

variables:
  FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_EDGEONE_ARTIFACT_REF:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 0 打印 frontend EdgeOne 编排上下文
    jobs:
      context:
        name: 打印编排上下文
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA=${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              echo "variables.FRONTEND_EDGEONE_ARTIFACT_REF=${{ variables.FRONTEND_EDGEONE_ARTIFACT_REF }}"
              echo "说明：本流水线只编排 frontend EdgeOne 正式站候选发布。"
              echo "通过生产入口审核后，会并行启动国内/国际两个独立发布流水线。"
              echo "目标发布流水线自身仍有 EdgeOne 发布 check-in，不会绕过正式发布审批。"

  - name: 1 是否准备进入生产 frontend EdgeOne
    check-in:
      reviews:
        flows:
          - name: 是否准备进入生产
            reviewers: [ "skipzhang" ]
        description: |
          本阶段只确认是否允许本次 frontend 构建进入 EdgeOne 正式站候选发布流程。

          点击通过后，下一阶段会在 YAML 图中分出两个独立 job，分别启动：
          - 发布 frontend EdgeOne 国内正式站
          - 发布 frontend EdgeOne 国际正式站

          本阶段不直接发布 EdgeOne。两个目标流水线仍需要各自的人工 check-in 后才会发布正式站。
      timeout-hours: 24
    jobs:
      approve:
        name: 确认进入 frontend EdgeOne 生产候选流程
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: frontend EdgeOne 生产候选流程已确认
            shell: bash
            run: |
              echo "frontend EdgeOne production candidate creation approved"

  - name: 2 fan-out 启动 frontend EdgeOne 发布候选
    jobs:
      plan:
        name: 生成 frontend EdgeOne fan-out 调用计划
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印调用计划
            shell: bash
            run: |
              SOURCE_SHA="${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              ARTIFACT_REF="${{ variables.FRONTEND_EDGEONE_ARTIFACT_REF }}"
              echo "source_sha=$SOURCE_SHA"
              echo "artifact_ref=$ARTIFACT_REF"
              echo "fan-out jobs:"
              echo "  - cn: 发布 frontend EdgeOne 国内正式站"
              echo "  - intl: 发布 frontend EdgeOne 国际正式站"

      cn:
        name: 启动国内 EdgeOne 发布审批流水线
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 发起国内 EdgeOne 发布审批流水线
            shell: bash
            env:
              BK_CI_ACCESS_TOKEN: ${{ settings.BK_CI_ACCESS_TOKEN }}
            run: |
              SOURCE_SHA="${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              python3 .ci/runtime/commands/trigger_frontend_edgeone_releases.py \
                --source-sha "$SOURCE_SHA" \
                --target cn

      intl:
        name: 启动国际 EdgeOne 发布审批流水线
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 发起国际 EdgeOne 发布审批流水线
            shell: bash
            env:
              BK_CI_ACCESS_TOKEN: ${{ settings.BK_CI_ACCESS_TOKEN }}
            run: |
              SOURCE_SHA="${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              python3 .ci/runtime/commands/trigger_frontend_edgeone_releases.py \
                --source-sha "$SOURCE_SHA" \
                --target intl
