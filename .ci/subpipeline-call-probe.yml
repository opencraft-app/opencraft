version: v2.0
name: 发布 frontend EdgeOne 正式站编排

# 历史说明：
# 本文件最初用于验证 subpipeline call / fan-out 能力。当前保留文件路径，
# 是为了复用已创建的 BK-CI pipeline id，由构建 frontend 通过 build_start
# API 自动启动本编排流水线。
#
# 已验证的边界：
# - Stream YAML 不能直接用 `uses: subPipelineCallAtom@...` 调用子流水线；
#   它会按市场 atom 解析并报 PIPELINE_RUN_ERROR。
# - `manualReviewUserTask@...` 也不能作为 job step 级审核使用。
# - 可用模型是 job DAG fan-out + step `can-pause-before-run`；国内/国际两个发布 step 各自前置暂停。

on:
  manual: enabled

concurrency:
  group: mono2-frontend-edgeone-release-orchestrator
  cancel-in-progress: false
  queue-length: 10
  queue-timeout-minutes: 480

variables:
  FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_EDGEONE_ARTIFACT_REF:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 0 打印 frontend EdgeOne 编排上下文
    jobs:
      context:
        name: 打印编排上下文
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA=${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              echo "variables.FRONTEND_EDGEONE_ARTIFACT_REF=${{ variables.FRONTEND_EDGEONE_ARTIFACT_REF }}"
              echo "说明：本流水线只编排 frontend EdgeOne 正式站候选发布。"
              echo "本编排流水线不做共享 stage 审批，会并行进入国内/国际两个独立发布 job。"
              echo "两个发布 step 各自配置 can-pause-before-run，可分别点继续。"

  - name: 1 fan-out 启动 frontend EdgeOne 发布候选
    jobs:
      plan:
        name: 生成 frontend EdgeOne fan-out 调用计划
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印调用计划
            shell: bash
            run: |
              SOURCE_SHA="${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              ARTIFACT_REF="${{ variables.FRONTEND_EDGEONE_ARTIFACT_REF }}"
              echo "source_sha=$SOURCE_SHA"
              echo "artifact_ref=$ARTIFACT_REF"
              echo "fan-out jobs:"
              echo "  - cn: 前置暂停后发布 frontend EdgeOne 国内正式站"
              echo "  - intl: 前置暂停后发布 frontend EdgeOne 国际正式站"

      cn:
        name: 发布 frontend EdgeOne 国内正式站
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          EDGEONE_API_TOKEN_REQUIRED: "1"
          EDGEONE_LIGHTVELA_PROD_TOKEN: ${{ settings.EDGEONE_LIGHTVELA_PROD_TOKEN }}
          EDGEONE_LIGHTVELA_INTL_PROD_TOKEN: ${{ settings.EDGEONE_LIGHTVELA_INTL_PROD_TOKEN }}
          TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
          FRONTEND_ARTIFACT_REPOSITORY: lightclaw-shprod.tencentcloudcr.com/lightclaw/frontend-pages
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 暂停确认后发布国内 EdgeOne 正式站
            can-pause-before-run: true
            pause-notice-receivers:
              - skipzhang
            shell: bash
            run: |
              export FRONTEND_EDGEONE_CI_BRANCH="${{ ci.branch }}"
              export FRONTEND_EDGEONE_CI_SHA="${{ ci.sha }}"
              export FRONTEND_EDGEONE_COMBO="eo:cn-lightvela-prod"
              export FRONTEND_EDGEONE_DISPLAY_NAME="frontend EdgeOne 国内正式站"
              export FRONTEND_EDGEONE_ARTIFACT_REF="${{ variables.FRONTEND_EDGEONE_ARTIFACT_REF }}"
              export FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA="${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              bash .ci/runtime/commands/release_frontend_edgeone_artifact.sh

      intl:
        name: 发布 frontend EdgeOne 国际正式站
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          EDGEONE_API_TOKEN_REQUIRED: "1"
          EDGEONE_LIGHTVELA_PROD_TOKEN: ${{ settings.EDGEONE_LIGHTVELA_PROD_TOKEN }}
          EDGEONE_LIGHTVELA_INTL_PROD_TOKEN: ${{ settings.EDGEONE_LIGHTVELA_INTL_PROD_TOKEN }}
          TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
          FRONTEND_ARTIFACT_REPOSITORY: lightclaw-shprod.tencentcloudcr.com/lightclaw/frontend-pages
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 暂停确认后发布国际 EdgeOne 正式站
            can-pause-before-run: true
            pause-notice-receivers:
              - skipzhang
            shell: bash
            run: |
              export FRONTEND_EDGEONE_CI_BRANCH="${{ ci.branch }}"
              export FRONTEND_EDGEONE_CI_SHA="${{ ci.sha }}"
              export FRONTEND_EDGEONE_COMBO="eo:global-lightvela-intl-prod"
              export FRONTEND_EDGEONE_DISPLAY_NAME="frontend EdgeOne 国际正式站"
              export FRONTEND_EDGEONE_ARTIFACT_REF="${{ variables.FRONTEND_EDGEONE_ARTIFACT_REF }}"
              export FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA="${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              bash .ci/runtime/commands/release_frontend_edgeone_artifact.sh
