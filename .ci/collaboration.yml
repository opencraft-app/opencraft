version: v2.0
name: 构建 Collaboration

on:
  push:
    branches:
      - master
    paths:
      - collaboration/**
      - argocd/services/collaboration/**
      - argocd/catalogs/candidates/beijing-sandbox/collaboration.yaml
      - argocd/catalogs/candidates/beijing-sandbox/collaboration-foundation.yaml
      - argocd/catalogs/sandbox/beijing-sandbox/collaboration.yaml
      - argocd/secrets/beijing-sandbox/collaboration-runtime-secrets.sops.yaml
      - scripts/ssm_manifest.collaboration.beijing-sandbox.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-collaboration
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: collaboration
    BUNDLE: collaboration
    DISPLAY_NAME: Collaboration
    DEFAULT_TARGET_ENV: beijing-sandbox
    MASTER_BUILD_ENVS: beijing-sandbox
    MASTER_AUTO_PIN_ENVS: none
    ENABLE_MASTER_PROD_PROMOTE: false
