version: v2.0
name: ci-runtime-validation

on:
  push:
    branches: [ master ]
    paths:
      - .ci/**
      - .ci/runtime/**
      - .ci/runtime/tests/**
  manual: enabled

jobs:
  validate:
    runs-on:
      self-hosted: true
      pool-name: env
    steps:
      - checkout: self
        with:
          fetchDepth: 50
      - name: validate-ci-runtime
        shell: bash
        run: |
          source .ci/init.sh
          ci_init_repo_root
          ci_require_commands bash python3

          bash -n \
            .ci/init.sh \
            .ci/runtime/build_and_promote_to_gitops.sh \
            .ci/runtime/pin_image_to_gitops.sh \
            .ci/runtime/promote_bundle_image_to_gitops.sh

          PY_COMPILE_TARGETS=(
            .ci/runtime/build-release-image.py
            .ci/runtime/gitops_cleanup_source_branch.py
            .ci/runtime/gitops_merge_request.py
            .ci/runtime/harness_ci/__init__.py
            .ci/runtime/harness_ci/bundles.py
            .ci/runtime/project_release_bundle.py
            .ci/runtime/release_bundle_lib.py
            .ci/runtime/resolve_release_bundle.py
            .ci/runtime/update_image_pin.py
            .ci/runtime/verify_gitops_release.py
            .ci/runtime/audit_gitops_drift.py
          )

          for optional_target in \
            .ci/runtime/validate_gitops_static.py \
            .ci/runtime/validate_gitops_kustomize.py
          do
            if [[ -f "$optional_target" ]]; then
              PY_COMPILE_TARGETS+=("$optional_target")
            fi
          done

          python3 -m py_compile "${PY_COMPILE_TARGETS[@]}"
          python3 -m unittest discover -s .ci/runtime/tests
