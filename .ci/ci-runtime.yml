version: v2.0
name: 构建 CI runtime

on:
  push:
    branches: [ master ]
    paths:
      - .ci/**
      - .ci/runtime/**
      - .ci/runtime/tests/**
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

jobs:
  validate:
    runs-on:
      self-hosted: true
      pool-name: env
    steps:
      - checkout: self
        name: 拉取代码
        with:
          fetchDepth: 50
      - name: 构建 CI runtime 脚本与测试
        shell: bash
        run: |
          bash .ci/runtime/check_ci_runtime.sh
