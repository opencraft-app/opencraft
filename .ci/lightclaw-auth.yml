version: v2.0
name: 构建 lightclaw-auth

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - user/auth/**
      - argocd/services/lightclaw-auth/**
      - argocd/apps/*/lightclaw-auth.yaml
      - argocd/secrets/*/lightclaw-auth-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-master-release
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: user-auth
    BUNDLE: lightclaw-auth
    DISPLAY_NAME: lightclaw-auth
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: beijing-sandbox-2
    PLAYGROUND_AUTO_PIN_ENVS: beijing-sandbox-2
