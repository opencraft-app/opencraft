version: v2.0
name: 构建 lightclaw-auth

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
    paths:
      - user/auth/**
      - argocd/services/lightclaw-auth/**
      - argocd/apps/*/lightclaw-auth.yaml
      - argocd/catalogs/playground/beijing-playground/*/lightclaw-auth.yaml
      - argocd/secrets/*/lightclaw-auth-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-lightclaw-auth
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  # Refresh compiled Stream pipeline after service-release template changes.
  parameters:
    SERVICE: user-auth
    BUNDLE: lightclaw-auth
    DISPLAY_NAME: lightclaw-auth
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    ENABLE_MASTER_PROD_DB_MIGRATION: true
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
