version: v2.0
name: 构建 lightclaw-auth

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
    paths:
      - user/auth/**
      - argocd/services/lightclaw-auth/**
      - argocd/apps/*/lightclaw-auth.yaml
      - argocd/catalogs/playground/beijing-playground/*/lightclaw-auth.yaml
      - argocd/secrets/*/lightclaw-auth-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-lightclaw-auth
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 构建 lightclaw-auth
    jobs:
      release:
        name: 构建 lightclaw-auth 镜像
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 打印 lightclaw-auth 构建上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
              echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
              echo "SERVICE=user-auth"
              echo "BUNDLE=lightclaw-auth"
              echo "MASTER_BUILD_ENVS=beijing-sandbox,shprod,sgprod"
              echo "MASTER_AUTO_PIN_ENVS=beijing-sandbox"
              echo "PLAYGROUND_BUILD_ENVS=auto"
              echo "PLAYGROUND_AUTO_PIN_ENVS=auto"
          - id: prepare
            name: 准备 lightclaw-auth 构建标签
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              SHORT_SHA="${{ ci.sha }}"
              SHORT_SHA="${SHORT_SHA:0:12}"
              echo "::set-output name=tag::user-auth-${SHORT_SHA}"
          - name: 构建并推进 lightclaw-auth 北京测试
            shell: bash
            env:
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              TCR_SGPROD_PASSWORD: ${{ settings.TCR_SGPROD_PASSWORD }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}"
              export REMOTE_URL GITOPS_BRANCH BUILD_TAG_OVERRIDE
              resolve_playground_envs() {
                local configured="$1"
                local branch_env="$2"
                case "$configured" in
                  ""|auto|__branch__)
                    printf '%s' "$branch_env"
                    ;;
                  *)
                    printf '%s' "$configured"
                    ;;
                esac
              }
              case "${{ ci.branch }}" in
                master)
                  BUILD_ENVS="beijing-sandbox,shprod,sgprod"
                  AUTO_PIN_ENVS="beijing-sandbox"
                  ;;
                playground/sandbox-bj-*)
                  PLAYGROUND_ENV="${{ ci.branch }}"
                  PLAYGROUND_ENV="${PLAYGROUND_ENV#playground/}"
                  BUILD_ENVS="$(resolve_playground_envs "auto" "$PLAYGROUND_ENV")"
                  AUTO_PIN_ENVS="$(resolve_playground_envs "auto" "$PLAYGROUND_ENV")"
                  echo "Playground 发布决策：分支 ${{ ci.branch }} 自动映射目标环境 ${PLAYGROUND_ENV}"
                  ;;
                *)
                  echo "unsupported source branch for release: ${{ ci.branch }}" >&2
                  exit 1
                  ;;
              esac
              echo "BUILD_ENVS=${BUILD_ENVS}"
              echo "AUTO_PIN_ENVS=${AUTO_PIN_ENVS}"
              bash .ci/runtime/build_and_promote_to_gitops.sh user-auth lightclaw-auth "${BUILD_ENVS}" "${AUTO_PIN_ENVS}"
          - name: 手动发布 lightclaw-auth 到 GitOps
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "promote" ]]; then
                echo "skip promote step because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              SOURCE_SHA="${{ variables.SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
                echo "SOURCE_SHA not provided; default to ci.sha=$SOURCE_SHA"
              fi
              test -n "$SOURCE_SHA"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              bash .ci/runtime/promote_bundle_image_to_gitops.sh user-auth lightclaw-auth "${{ variables.TARGET_ENV }}" "$SOURCE_SHA"
