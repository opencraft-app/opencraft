version: v2.0
name: BK-CI DB migration 审核跳过探针

on:
  manual: enabled

variables:
  PROBE_DECISION:
    value: skip_migration
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 1 生成 dry-run 决策输出
    jobs:
      plan:
        name: 模拟生产 DB migration dry-run
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - id: decide
            name: 写入模拟 migration decision
            shell: bash
            run: |
              set -euo pipefail
              decision="${{ variables.PROBE_DECISION }}"
              case "$decision" in
                skip_migration|run_migration|block)
                  ;;
                *)
                  echo "unsupported PROBE_DECISION=$decision" >&2
                  exit 1
                  ;;
              esac
              if [[ "$decision" == "run_migration" ]]; then
                should_review=true
              else
                should_review=false
              fi
              echo "============================================================"
              echo "DB migration 审核跳过探针：dry-run 决策"
              echo "PROBE_DECISION=$decision"
              echo "should_review=$should_review"
              echo "预期：skip_migration/block 不进入人工审核；run_migration 进入人工审核。"
              echo "============================================================"
              echo "::set-output name=decision::$decision"
              echo "::set-output name=should_review::$should_review"

  - name: 2A 动态输出驱动人工审核
    if: "${{ steps.decide.outputs.should_review }} == true"
    check-in:
      reviews:
        flows:
          - name: 动态输出审核探针
            reviewers: [ "skipzhang" ]
      description: |
        如果 PROBE_DECISION=skip_migration 时仍然出现本审核，说明 stage if 不能可靠读取上一阶段 step output。
        如果 PROBE_DECISION=run_migration 时出现本审核，且 skip_migration 时跳过，才说明可以用动态输出跳过生产 DB migration 人工审核。
      timeout-hours: 1
    jobs:
      approve:
        name: 记录动态输出审核通过
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 动态输出审核通过
            shell: bash
            run: |
              echo "dynamic-output check-in reached"

  - name: 2B 启动变量驱动人工审核 对照组
    if: "${{ variables.PROBE_DECISION }} == run_migration"
    check-in:
      reviews:
        flows:
          - name: 启动变量审核探针
            reviewers: [ "skipzhang" ]
      description: |
        对照组：只验证 stage if 能否读取启动变量 PROBE_DECISION。
        这不能证明 dry-run 动态结果可用，只用于区分“表达式语法失效”和“跨 stage 输出不可见”。
      timeout-hours: 1
    jobs:
      approve:
        name: 记录启动变量审核通过
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 启动变量审核通过
            shell: bash
            run: |
              echo "startup-variable check-in reached"

  - name: 3 结果说明
    jobs:
      explain:
        name: 打印判定方法
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 打印探针判定方法
            shell: bash
            run: |
              echo "============================================================"
              echo "探针判定方法"
              echo "默认 PROBE_DECISION=skip_migration："
              echo "- 2A 如果跳过：动态 output 可能可用于跳过 check-in"
              echo "- 2A 如果没有跳过或表达式异常：不能用这个模型"
              echo "- 2B 应该跳过，用于证明启动变量条件表达式有效"
              echo "重新运行 PROBE_DECISION=run_migration："
              echo "- 2A 和 2B 都应进入人工审核；否则不要把该模型用于生产 DB migration"
              echo "============================================================"
