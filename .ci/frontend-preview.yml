version: v2.0
name: 发布 frontend 分支预览

on:
  push:
    branches:
      - master
      - frontsandbox/*
      - playground/sandbox-bj-*
      - playground/sandbox-kr-*
    paths:
      - frontend/**
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: frontend-preview-${{ ci.branch }}
  cancel-in-progress: true
  queue-length: 1
  queue-timeout-minutes: 60

variables:
  STATICPAGES_API_URL:
    value: https://staticpages-api.preview.lightclaw.tech/api/upload
    readonly: false
    allow-modify-at-startup: true
stages:
  - name: 发布 frontend 分支预览
    jobs:
      upload-preview:
        name: 构建并上传 frontend 预览站点
        runs-on:
          self-hosted: true
          pool-name: cn-pool
        env:
          STATICPAGES_UPLOAD_TOKEN: ${{ settings.STATICPAGES_UPLOAD_TOKEN }}
          SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印 frontend 预览上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "STATICPAGES_API_URL=${{ variables.STATICPAGES_API_URL }}"
          - name: 构建并上传 frontend 预览站点
            shell: bash
            env:
              STATICPAGES_API_URL: ${{ variables.STATICPAGES_API_URL }}
            run: |
              echo "============================================================"
              echo "frontend 预览发布决策：进入 StaticPages 分支预览流程"
              echo "触发分支：${{ ci.branch }}"
              echo "目标规则：master -> https://master.preview.lightclaw.tech 和 https://intl-master.preview.lightclaw.tech"
              echo "目标规则：frontsandbox/<name> -> https://<name>.preview.lightclaw.tech 和 https://intl-<name>.preview.lightclaw.tech"
              echo "目标规则：playground/sandbox-bj-N -> https://sandbox-bj-N.preview.lightclaw.tech 和 https://intl-sandbox-bj-N.preview.lightclaw.tech"
              echo "目标规则：playground/sandbox-kr-N -> https://sandbox-kr-N.preview.lightclaw.tech 和 https://intl-sandbox-kr-N.preview.lightclaw.tech"
              echo "发布方式：构建 Next 产物后顺序上传到 StaticPages，不创建 GitOps MR"
              echo "============================================================"
              set -euo pipefail

              FRONTEND_PREVIEW_RUNTIME_REF="${FRONTEND_PREVIEW_RUNTIME_REF:-origin/master}"
              FRONTEND_PREVIEW_RUNTIME_DIR="$(mktemp -d)"
              cleanup_frontend_preview_runtime() {
                rm -rf "$FRONTEND_PREVIEW_RUNTIME_DIR"
              }
              trap cleanup_frontend_preview_runtime EXIT

              echo "frontend 预览发布器来源：${FRONTEND_PREVIEW_RUNTIME_REF}"
              git fetch --no-tags --depth=1 origin +master:refs/remotes/origin/master
              git archive --format=tar "$FRONTEND_PREVIEW_RUNTIME_REF" .ci | tar -xf - -C "$FRONTEND_PREVIEW_RUNTIME_DIR"
              FRONTEND_PREVIEW_RUNTIME_CI_DIR="$FRONTEND_PREVIEW_RUNTIME_DIR/.ci"

              export FRONTEND_PREVIEW_BRANCH="${{ ci.branch }}"
              export FRONTEND_PREVIEW_SHA="${{ ci.sha }}"
              bash "$FRONTEND_PREVIEW_RUNTIME_CI_DIR/runtime/commands/publish_frontend_preview.sh"
