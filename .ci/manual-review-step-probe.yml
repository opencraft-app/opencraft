version: v2.0
name: BK-CI job 内人工审核 DAG 探针

on:
  push:
    branches:
      - master
    paths:
      - ci-probes/manual-review-step-probe.trigger
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-manual-review-step-probe
  cancel-in-progress: false
  queue-length: 5
  queue-timeout-minutes: 120

variables:
  PROBE_SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 0 打印 job 内人工审核探针上下文
    jobs:
      probe:
        name: 打印探针上下文
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "variables.PROBE_SOURCE_SHA=${{ variables.PROBE_SOURCE_SHA }}"
              echo "说明：本探针验证 manualReviewUserTask 是否能在 DAG 分支 job 内作为独立审批点。"

  - name: 1 job 内人工审核 DAG 探针
    jobs:
      plan:
        name: 生成独立审批分支计划
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印审批分支计划
            shell: bash
            run: |
              SOURCE_SHA="${{ variables.PROBE_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              echo "source_sha=$SOURCE_SHA"
              echo "branch jobs:"
              echo "  - cn: job 内人工审核后继续"
              echo "  - intl: job 内人工审核后继续"

      cn:
        name: 国内分支 job 内人工审核
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 国内分支人工审核
            uses: manualReviewUserTask@1.*
            with:
              reviewUsers:
                - skipzhang
              desc: |
                国内 EdgeOne 分支 job 内人工审核探针。

                通过后只会继续执行本 job 的后续 echo step，不会发布 EdgeOne。
              markdownContent: false
              suggestRequired: false
          - name: 国内分支审核后继续
            shell: bash
            run: |
              SOURCE_SHA="${{ variables.PROBE_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              echo "cn branch manual review passed"
              echo "source_sha=$SOURCE_SHA"

      intl:
        name: 国际分支 job 内人工审核
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 国际分支人工审核
            uses: manualReviewUserTask@1.*
            with:
              reviewUsers:
                - skipzhang
              desc: |
                国际 EdgeOne 分支 job 内人工审核探针。

                通过后只会继续执行本 job 的后续 echo step，不会发布 EdgeOne。
              markdownContent: false
              suggestRequired: false
          - name: 国际分支审核后继续
            shell: bash
            run: |
              SOURCE_SHA="${{ variables.PROBE_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              echo "intl branch manual review passed"
              echo "source_sha=$SOURCE_SHA"
