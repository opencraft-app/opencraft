version: v2.0
name: 构建 ai-gateway

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
    paths:
      - ai-gateway/**
      - argocd/services/ai-gateway/**
      - argocd/apps/*/ai-gateway.yaml
      - argocd/secrets/*/ai-gateway-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-ai-gateway
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: ai-gateway
    BUNDLE: ai-gateway
    DISPLAY_NAME: ai-gateway
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
