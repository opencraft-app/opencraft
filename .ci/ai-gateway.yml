version: v2.0
name: 构建 ai-gateway

on:
  push:
    branches: [ master ]
    paths:
      - ai-gateway/**
      - argocd/services/ai-gateway/**
      - argocd/apps/*/ai-gateway.yaml
      - argocd/secrets/*/ai-gateway-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template:
    path: .ci/templates/service-release.yml
    variables:
      SERVICE: ai-gateway
      BUNDLE: ai-gateway
      DISPLAY_NAME: ai-gateway
