version: v2.0
name: 构建 ai-gateway

on:
  push:
    branches: [ master ]
    paths:
      - ai-gateway/**
      - argocd/services/ai-gateway/**
      - argocd/apps/*/ai-gateway.yaml
      - argocd/secrets/*/ai-gateway-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template: .ci/templates/service-release.yml
  parameters:
    SERVICE: ai-gateway
    BUNDLE: ai-gateway
    DISPLAY_NAME: ai-gateway
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: beijing-sandbox-2
    PLAYGROUND_AUTO_PIN_ENVS: beijing-sandbox-2
