version: v2.0
name: 构建 ticket

on:
  manual: enabled

concurrency:
  group: mono2-service-release-ticket
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

jobs:
  disabled:
    runs-on:
      self-hosted: true
      pool-name: env
    steps:
      - checkout: self
        name: 拉取代码
        with:
          fetchDepth: 1
      - name: ticket release bundle contract disabled
        shell: bash
        run: |
          echo "ticket release bundle contract is temporarily disabled."
