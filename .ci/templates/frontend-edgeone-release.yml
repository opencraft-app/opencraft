version: v2.0

parameters:
  - name: COMBO
    type: string
  - name: DISPLAY_NAME
    type: string

variables:
  FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_EDGEONE_ARTIFACT_REF:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 确认发布 ${{ parameters.DISPLAY_NAME }}
    check-in:
      reviews:
        flows:
          - name: frontend EdgeOne 正式发布确认
            reviewers: [ "skipzhang" ]
        description: |
          本次流水线会发布单个 frontend EdgeOne 正式站。

          默认发布当前手动流水线所在 commit 对应的 frontend artifact。
          回放历史 artifact 时，可填写其中一个输入：
          - FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA：构建 frontend 中归档 artifact 的源码 SHA
          - FRONTEND_EDGEONE_ARTIFACT_REF：高级覆盖，完整 OCI artifact ref

          点击通过后会从已归档 frontend artifact 发布到 EdgeOne 正式项目。
      timeout-hours: 24
    jobs:
      approve:
        name: 等待人工确认 ${{ parameters.DISPLAY_NAME }}
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: frontend EdgeOne 发布已确认
            shell: bash
            run: |
              echo "frontend EdgeOne release approved: ${{ parameters.COMBO }}"

  - name: 发布 ${{ parameters.DISPLAY_NAME }}
    jobs:
      release:
        name: 发布 ${{ parameters.DISPLAY_NAME }}
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          EDGEONE_API_TOKEN_REQUIRED: "1"
          EDGEONE_LIGHTVELA_PROD_TOKEN: ${{ settings.EDGEONE_LIGHTVELA_PROD_TOKEN }}
          EDGEONE_LIGHTVELA_INTL_PROD_TOKEN: ${{ settings.EDGEONE_LIGHTVELA_INTL_PROD_TOKEN }}
          TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
          FRONTEND_ARTIFACT_REPOSITORY: lightclaw-shprod.tencentcloudcr.com/lightclaw/frontend-pages
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 发布 frontend EdgeOne 正式站
            shell: bash
            run: |
              if [[ "${{ ci.branch }}" != "master" ]]; then
                echo "EdgeOne production release only allows master branch; got ${{ ci.branch }}" >&2
                exit 1
              fi

              COMBO="${{ parameters.COMBO }}"
              case "$COMBO" in
                eo:cn-lightvela-prod)
                  export EDGEONE_API_TOKEN_FILE=/etc/lightclaw-ci/edgeone_lightvela_prod_token
                  export EDGEONE_API_TOKEN="$EDGEONE_LIGHTVELA_PROD_TOKEN"
                  ;;
                eo:global-lightvela-intl-prod)
                  export EDGEONE_API_TOKEN_FILE=/etc/lightclaw-ci/edgeone_lightvela_intl_prod_token
                  export EDGEONE_API_TOKEN="$EDGEONE_LIGHTVELA_INTL_PROD_TOKEN"
                  ;;
                *)
                  echo "unsupported EdgeOne combo: ${COMBO}" >&2
                  exit 1
                  ;;
              esac

              ARTIFACT_REF="${{ variables.FRONTEND_EDGEONE_ARTIFACT_REF }}"
              ARTIFACT_SOURCE_SHA="${{ variables.FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA }}"
              if [[ -z "$ARTIFACT_REF" && -z "$ARTIFACT_SOURCE_SHA" ]]; then
                ARTIFACT_SOURCE_SHA="${{ ci.sha }}"
              fi
              if [[ -z "$ARTIFACT_REF" && -z "$ARTIFACT_SOURCE_SHA" ]]; then
                echo "FRONTEND_EDGEONE_ARTIFACT_SOURCE_SHA is empty and ci.sha is unavailable" >&2
                exit 1
              fi

              echo "============================================================"
              echo "frontend 发布决策：进入 EdgeOne 正式 artifact 发布流程"
              echo "目标站点：${{ parameters.DISPLAY_NAME }}"
              echo "发布 combo：${COMBO}"
              echo "artifact 仓库：${FRONTEND_ARTIFACT_REPOSITORY}"
              echo "artifact source sha：${ARTIFACT_SOURCE_SHA}"
              echo "artifact ref override：${ARTIFACT_REF}"
              echo "============================================================"

              source .ci/init.sh
              ci_init_repo_root
              ci_set_registry_credentials shprod
              ci_ensure_oras
              ci_ensure_node
              ci_ensure_pnpm

              "$NODE_BIN" --version
              "$NPM_BIN" --version

              cd "$REPO_ROOT/frontend"
              rm -rf node_modules
              "$PNPM_BIN" --version
              "$PNPM_BIN" install --frozen-lockfile

              export FRONTEND_RELEASE_MATRIX="$COMBO"
              export FRONTEND_ARTIFACT_SOURCE_SHA="$ARTIFACT_SOURCE_SHA"
              export FRONTEND_ARTIFACT_REF="$ARTIFACT_REF"

              echo "============================================================"
              echo "发布 frontend EdgeOne combo：${COMBO}"
              echo "FRONTEND_RELEASE_MATRIX=${FRONTEND_RELEASE_MATRIX}"
              echo "FRONTEND_ARTIFACT_SOURCE_SHA=${FRONTEND_ARTIFACT_SOURCE_SHA}"
              echo "FRONTEND_ARTIFACT_REF=${FRONTEND_ARTIFACT_REF}"
              echo "============================================================"
              ci_load_edgeone_credentials
              "$PNPM_BIN" release:eo:artifact
