version: v2.0

parameters:
  - name: TARGET_ENV
    type: string
  - name: DISPLAY_NAME
    type: string

stages:
  - name: ${{ parameters.DISPLAY_NAME }} GitOps MR 前置验收
    jobs:
      validate:
        name: 静态验收与严格 Kustomize 验收
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - name: 校验 promote 分支
            shell: bash
            env:
              GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
              SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
              SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              CI_RUNTIME_DIR="$(mktemp -d)"
              source .ci/runtime/gitops_promotion_bootstrap.sh
              RESOLVED_RUNTIME_REF="$(ci_resolve_gitops_promotion_runtime_ref "${CI_RUNTIME_REF:-origin/master}")"
              echo "resolved_runtime_ref=${RESOLVED_RUNTIME_REF}"
              ci_bootstrap_gitops_promotion_runtime "${CI_RUNTIME_DIR}" "$RESOLVED_RUNTIME_REF"
              SOURCE_BRANCH="$(ci_resolve_gitops_promotion_source_branch "${{ ci.branch }}")"
              echo "resolved_source_branch=${SOURCE_BRANCH}"
              git diff --name-only HEAD~1..HEAD || true
              ci_require_gitops_validation_tools
              ci_prepare_sops_age_key
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/validate_gitops_promotion.py" \
                --repo-root "$REPO_ROOT" \
                --source-branch "$SOURCE_BRANCH" \
                --target-branch gitops \
                --bundle-manifest "${CI_RUNTIME_DIR}/.ci/runtime/release-bundles.manifest"

  - name: Dry-run ${{ parameters.DISPLAY_NAME }} DB migration
    jobs:
      dry_run_db:
        name: 生成 ${{ parameters.DISPLAY_NAME }} DB migration 计划
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - name: Dry-run 生产 DB migration
            shell: bash
            run: |
              release_trailer() {
                local key="${1:?trailer key required}"
                git log --format=%B -n 20 HEAD | awk -F': ' -v key="$key" '$1 == key { print substr($0, length(key) + 3); exit }'
              }

              CI_RUNTIME_DIR="$(mktemp -d)"
              source .ci/runtime/gitops_promotion_bootstrap.sh
              RESOLVED_RUNTIME_REF="$(ci_resolve_gitops_promotion_runtime_ref "${CI_RUNTIME_REF:-origin/master}")"
              echo "resolved_runtime_ref=${RESOLVED_RUNTIME_REF}"
              ci_bootstrap_gitops_promotion_runtime "${CI_RUNTIME_DIR}" "$RESOLVED_RUNTIME_REF"

              BUNDLE_SERVICE="$(release_trailer Release-bundle)"
              TARGET_ENV="$(release_trailer Release-target-env)"
              SOURCE_REVISION="$(release_trailer Source-revision)"
              if [[ "$TARGET_ENV" != "${{ parameters.TARGET_ENV }}" ]]; then
                echo "unexpected Release-target-env=${TARGET_ENV}; expected ${{ parameters.TARGET_ENV }}" >&2
                exit 1
              fi
              echo "生产 DB migration dry-run：service=${BUNDLE_SERVICE} env=${TARGET_ENV} source=${SOURCE_REVISION}"
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/run_prod_db_migration.py" \
                --service "$BUNDLE_SERVICE" \
                --env "$TARGET_ENV" \
                --source-sha "$SOURCE_REVISION" \
                --timeout-seconds 1800 \
                --skip-if-no-migration-change

  - name: 确认 ${{ parameters.DISPLAY_NAME }} GitOps 待同步
    check-in:
      reviews:
        flows:
          - name: ${{ parameters.DISPLAY_NAME }} 发布确认
            reviewers: [ "skipzhang" ]
        description: |
          本阶段只确认 ${{ parameters.DISPLAY_NAME }} 单个环境。

          请先检查上一阶段 dry-run 日志：
          - 若 SOURCE_SHA 未包含 migration 路径变更，日志应显示跳过 DB migration Job
          - 若包含 migration 变更，点击通过后会先执行该环境 DB migration/readiness Job
          - DB migration 通过后才会自动合并该环境 GitOps 待同步 MR

          本审批不影响另一个生产环境；另一个环境会在自己的 promote 分支流水线中单独审批。
      timeout-hours: 24
    jobs:
      approve:
        name: 等待人工确认 ${{ parameters.DISPLAY_NAME }}
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: ${{ parameters.DISPLAY_NAME }} 发布已确认
            shell: bash
            run: |
              echo "${{ parameters.DISPLAY_NAME }} GitOps pending-sync approval passed"

  - name: 执行 ${{ parameters.DISPLAY_NAME }} DB migration
    jobs:
      apply_db:
        name: 执行 ${{ parameters.DISPLAY_NAME }} DB migration
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - name: 执行生产 DB migration
            shell: bash
            run: |
              release_trailer() {
                local key="${1:?trailer key required}"
                git log --format=%B -n 20 HEAD | awk -F': ' -v key="$key" '$1 == key { print substr($0, length(key) + 3); exit }'
              }

              CI_RUNTIME_DIR="$(mktemp -d)"
              source .ci/runtime/gitops_promotion_bootstrap.sh
              RESOLVED_RUNTIME_REF="$(ci_resolve_gitops_promotion_runtime_ref "${CI_RUNTIME_REF:-origin/master}")"
              echo "resolved_runtime_ref=${RESOLVED_RUNTIME_REF}"
              ci_bootstrap_gitops_promotion_runtime "${CI_RUNTIME_DIR}" "$RESOLVED_RUNTIME_REF"

              BUNDLE_SERVICE="$(release_trailer Release-bundle)"
              TARGET_ENV="$(release_trailer Release-target-env)"
              SOURCE_REVISION="$(release_trailer Source-revision)"
              if [[ "$TARGET_ENV" != "${{ parameters.TARGET_ENV }}" ]]; then
                echo "unexpected Release-target-env=${TARGET_ENV}; expected ${{ parameters.TARGET_ENV }}" >&2
                exit 1
              fi
              echo "生产 DB migration apply：service=${BUNDLE_SERVICE} env=${TARGET_ENV} source=${SOURCE_REVISION}"
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/run_prod_db_migration.py" \
                --service "$BUNDLE_SERVICE" \
                --env "$TARGET_ENV" \
                --source-sha "$SOURCE_REVISION" \
                --timeout-seconds 1800 \
                --skip-if-no-migration-change \
                --apply

  - name: 自动合并 ${{ parameters.DISPLAY_NAME }} GitOps MR
    jobs:
      auto_merge:
        name: 等待检查通过并合并 MR
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - name: 按环境策略自动合并 GitOps MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              source .ci/runtime/gitops_promotion_bootstrap.sh
              RESOLVED_RUNTIME_REF="$(ci_resolve_gitops_promotion_runtime_ref "${CI_RUNTIME_REF:-origin/master}")"
              echo "resolved_runtime_ref=${RESOLVED_RUNTIME_REF}"
              ci_bootstrap_gitops_promotion_runtime "${CI_RUNTIME_DIR}" "$RESOLVED_RUNTIME_REF"
              SOURCE_BRANCH="$(ci_resolve_gitops_promotion_source_branch "${{ ci.branch }}")"
              echo "resolved_source_branch=${SOURCE_BRANCH}"
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/merge_gitops_promotion.py" \
                --repo-root "$REPO_ROOT" \
                --source-branch "$SOURCE_BRANCH" \
                --target-branch gitops

  - name: ${{ parameters.DISPLAY_NAME }} GitOps 合并后验收
    jobs:
      post_merge_verify:
        name: ${{ parameters.DISPLAY_NAME }} 待同步验收
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CI_RUNTIME_REF: origin/master
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - name: 校验 GitOps 合并状态并评论 MR
            shell: bash
            run: |
              CI_RUNTIME_DIR="$(mktemp -d)"
              source .ci/runtime/gitops_promotion_bootstrap.sh
              RESOLVED_RUNTIME_REF="$(ci_resolve_gitops_promotion_runtime_ref "${CI_RUNTIME_REF:-origin/master}")"
              echo "resolved_runtime_ref=${RESOLVED_RUNTIME_REF}"
              ci_bootstrap_gitops_promotion_runtime "${CI_RUNTIME_DIR}" "$RESOLVED_RUNTIME_REF"
              SOURCE_BRANCH="$(ci_resolve_gitops_promotion_source_branch "${{ ci.branch }}")"
              echo "resolved_source_branch=${SOURCE_BRANCH}"
              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/verify_gitops_promotion.py" \
                --repo-root "$REPO_ROOT" \
                --source-branch "$SOURCE_BRANCH" \
                --target-branch gitops
