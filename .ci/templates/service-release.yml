version: v2.0

parameters:
  - name: SERVICE
    type: string
  - name: BUNDLE
    type: string
  - name: DISPLAY_NAME
    type: string
  - name: DEFAULT_TARGET_ENV
    type: string
    default: shprod
  - name: MASTER_BUILD_ENVS
    type: string
    default: beijing-sandbox,shprod,sgprod
  - name: MASTER_AUTO_PIN_ENVS
    type: string
    default: beijing-sandbox
  - name: ENABLE_MASTER_PROD_PROMOTE
    type: boolean
    default: true
  - name: ENABLE_MASTER_PROD_DB_MIGRATION
    type: boolean
    default: false
  - name: PLAYGROUND_BUILD_ENVS
    type: string
    default: auto
  - name: PLAYGROUND_AUTO_PIN_ENVS
    type: string
    default: auto

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: ${{ parameters.DEFAULT_TARGET_ENV }}
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 构建 ${{ parameters.DISPLAY_NAME }}
    jobs:
      release:
        name: 构建 ${{ parameters.DISPLAY_NAME }} 镜像
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 打印 ${{ parameters.DISPLAY_NAME }} 构建上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
              echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
              echo "SERVICE=${{ parameters.SERVICE }}"
              echo "BUNDLE=${{ parameters.BUNDLE }}"
              echo "DEFAULT_TARGET_ENV=${{ parameters.DEFAULT_TARGET_ENV }}"
              echo "MASTER_BUILD_ENVS=${{ parameters.MASTER_BUILD_ENVS }}"
              echo "MASTER_AUTO_PIN_ENVS=${{ parameters.MASTER_AUTO_PIN_ENVS }}"
              echo "PLAYGROUND_BUILD_ENVS=${{ parameters.PLAYGROUND_BUILD_ENVS }}"
              echo "PLAYGROUND_AUTO_PIN_ENVS=${{ parameters.PLAYGROUND_AUTO_PIN_ENVS }}"
          - id: prepare
            name: 准备 ${{ parameters.DISPLAY_NAME }} 构建标签
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              SHORT_SHA="${{ ci.sha }}"
              SHORT_SHA="${SHORT_SHA:0:12}"
              echo "::set-output name=tag::${{ parameters.SERVICE }}-${SHORT_SHA}"
          - name: 构建 ${{ parameters.DISPLAY_NAME }} 镜像矩阵
            shell: bash
            env:
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              TCR_SGPROD_PASSWORD: ${{ settings.TCR_SGPROD_PASSWORD }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}"
              RELEASE_CI_NAME="构建 ${{ parameters.DISPLAY_NAME }}"
              RELEASE_DISPLAY_NAME="${{ parameters.DISPLAY_NAME }}"
              export REMOTE_URL GITOPS_BRANCH BUILD_TAG_OVERRIDE RELEASE_CI_NAME RELEASE_DISPLAY_NAME
              RELEASE_IMAGE_DIR=".ci/.release-images/${{ parameters.SERVICE }}-${{ steps.prepare.outputs.tag }}"
              rm -rf "$RELEASE_IMAGE_DIR"
              mkdir -p "$RELEASE_IMAGE_DIR"
              export RELEASE_IMAGE_DIR
              resolve_playground_envs() {
                local configured="$1"
                local branch_env="$2"
                case "$configured" in
                  ""|auto|__branch__)
                    printf '%s' "$branch_env"
                    ;;
                  *)
                    printf '%s' "$configured"
                    ;;
                esac
              }
              case "${{ ci.branch }}" in
                master)
                  BUILD_ENVS="${{ parameters.MASTER_BUILD_ENVS }}"
                  AUTO_PIN_ENVS="${{ parameters.MASTER_AUTO_PIN_ENVS }}"
                  ;;
                playground/sandbox-bj-*)
                  PLAYGROUND_ENV="${{ ci.branch }}"
                  PLAYGROUND_ENV="${PLAYGROUND_ENV#playground/}"
                  BUILD_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_BUILD_ENVS }}" "$PLAYGROUND_ENV")"
                  AUTO_PIN_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_AUTO_PIN_ENVS }}" "$PLAYGROUND_ENV")"
                  echo "Playground 发布决策：分支 ${{ ci.branch }} 自动映射目标环境 ${PLAYGROUND_ENV}"
                  ;;
                *)
                  echo "unsupported source branch for release: ${{ ci.branch }}" >&2
                  exit 1
                  ;;
              esac
              echo "BUILD_ENVS=${BUILD_ENVS}"
              echo "AUTO_PIN_ENVS=${AUTO_PIN_ENVS}"
              BUILD_ONLY=true bash "$REPO_ROOT/.ci/runtime/build_and_promote_to_gitops.sh" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "${BUILD_ENVS}" "${AUTO_PIN_ENVS}"
          - name: 北京测试 DB 变更检查与 GitOps auto-pin
            shell: bash
            env:
              GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              TCR_SGPROD_PASSWORD: ${{ settings.TCR_SGPROD_PASSWORD }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip Beijing DB change gate / auto-pin because PIPELINE_MODE=promote"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}"
              RELEASE_CI_NAME="构建 ${{ parameters.DISPLAY_NAME }}"
              RELEASE_DISPLAY_NAME="${{ parameters.DISPLAY_NAME }}"
              RELEASE_IMAGE_DIR=".ci/.release-images/${{ parameters.SERVICE }}-${{ steps.prepare.outputs.tag }}"
              trap 'rm -rf "$RELEASE_IMAGE_DIR"' EXIT
              export REMOTE_URL GITOPS_BRANCH BUILD_TAG_OVERRIDE RELEASE_CI_NAME RELEASE_DISPLAY_NAME RELEASE_IMAGE_DIR
              resolve_playground_envs() {
                local configured="$1"
                local branch_env="$2"
                case "$configured" in
                  ""|auto|__branch__)
                    printf '%s' "$branch_env"
                    ;;
                  *)
                    printf '%s' "$configured"
                    ;;
                esac
              }
              case "${{ ci.branch }}" in
                master)
                  BUILD_ENVS="${{ parameters.MASTER_BUILD_ENVS }}"
                  AUTO_PIN_ENVS="${{ parameters.MASTER_AUTO_PIN_ENVS }}"
                  ;;
                playground/sandbox-bj-*)
                  PLAYGROUND_ENV="${{ ci.branch }}"
                  PLAYGROUND_ENV="${PLAYGROUND_ENV#playground/}"
                  BUILD_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_BUILD_ENVS }}" "$PLAYGROUND_ENV")"
                  AUTO_PIN_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_AUTO_PIN_ENVS }}" "$PLAYGROUND_ENV")"
                  echo "Playground 发布决策：分支 ${{ ci.branch }} 自动映射目标环境 ${PLAYGROUND_ENV}"
                  ;;
                *)
                  echo "unsupported source branch for release: ${{ ci.branch }}" >&2
                  exit 1
                  ;;
              esac
              echo "BUILD_ENVS=${BUILD_ENVS}"
              echo "AUTO_PIN_ENVS=${AUTO_PIN_ENVS}"
              AUTO_PIN_ONLY=true bash "$REPO_ROOT/.ci/runtime/build_and_promote_to_gitops.sh" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "${BUILD_ENVS}" "${AUTO_PIN_ENVS}"
          - name: 手动发布 ${{ parameters.DISPLAY_NAME }} 到 GitOps
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "promote" ]]; then
                echo "skip promote step because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              SOURCE_SHA="${{ variables.SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
                echo "SOURCE_SHA not provided; default to ci.sha=$SOURCE_SHA"
              fi
              test -n "$SOURCE_SHA"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              bash "$REPO_ROOT/.ci/runtime/promote_bundle_image_to_gitops.sh" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "${{ variables.TARGET_ENV }}" "$SOURCE_SHA"
  - name: Dry-run 生产 DB migration ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_DB_MIGRATION }} == true && ${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    jobs:
      dry_run:
        name: 生成 ${{ parameters.DISPLAY_NAME }} 生产 DB migration 计划
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - name: Dry-run 生产 DB migration
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "build" ]]; then
                echo "skip production DB migration dry-run because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              if [[ "${{ ci.branch }}" != "master" ]]; then
                echo "skip production DB migration dry-run because branch=${{ ci.branch }}"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_ensure_db_job_tools

              SOURCE_SHA="$(git rev-parse HEAD)"
              PROD_ENVS="$(python3 "$REPO_ROOT/.ci/runtime/commands/resolve_prod_promote_envs.py" \
                --build-envs "${{ parameters.MASTER_BUILD_ENVS }}" \
                --auto-pin-envs "${{ parameters.MASTER_AUTO_PIN_ENVS }}")"
              if [[ -z "$PROD_ENVS" ]]; then
                echo "no shprod/sgprod env needs production DB migration dry-run"
                exit 0
              fi

              echo "============================================================"
              echo "生产 DB migration dry-run 计划：${{ parameters.DISPLAY_NAME }}"
              echo "SERVICE=${{ parameters.SERVICE }}"
              echo "BUNDLE=${{ parameters.BUNDLE }}"
              echo "SOURCE_SHA=${SOURCE_SHA}"
              echo "TIMEOUT_SECONDS=1800"
              echo "说明：只生成计划；若 SOURCE_SHA 未包含 migration 路径变更，命令会跳过实际 migration Job 计划。"
              echo "============================================================"

              while IFS= read -r TARGET_ENV_NAME; do
                if [[ -z "$TARGET_ENV_NAME" ]]; then
                  continue
                fi
                echo "Dry-run 生产 DB migration：${TARGET_ENV_NAME}"
                python3 "$REPO_ROOT/.ci/runtime/commands/run_prod_db_migration.py" \
                  --service "${{ parameters.SERVICE }}" \
                  --env "$TARGET_ENV_NAME" \
                  --source-sha "$SOURCE_SHA" \
                  --timeout-seconds 1800 \
                  --skip-if-no-migration-change
              done <<<"$PROD_ENVS"
  - name: 确认生产 promote ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    check-in:
      reviews:
        flows:
          - name: 生产发布确认
            reviewers: [ "skipzhang" ]
        description: |
          本次 master 构建已生成 ${{ parameters.DISPLAY_NAME }} 正式环境镜像。

          模板渲染探针：service=${{ parameters.SERVICE }}，display=${{ parameters.DISPLAY_NAME }}

          如果本服务启用了生产 DB migration 阶段，请先检查上一阶段 dry-run 日志：
          - 生产 DB migration dry-run 已自动使用本次 SOURCE_SHA 和目标生产环境生成计划
          - 若 SOURCE_SHA 未包含 migration 路径变更，日志应显示跳过 migration Job
          - 若包含 migration 变更，点击通过后下一阶段会先执行生产 migration/readiness Job，再创建 GitOps promote

          点击通过后，下一阶段会自动创建上海/新加坡 GitOps promote：
          - SERVICE=${{ parameters.SERVICE }}
          - BUNDLE=${{ parameters.BUNDLE }}
          - SOURCE_SHA 以构建阶段“可发布版本汇总”和下一阶段“生产 promote 计划”日志为准
          - 候选环境来自 MASTER_BUILD_ENVS=${{ parameters.MASTER_BUILD_ENVS }}
          - 会自动跳过 MASTER_AUTO_PIN_ENVS=${{ parameters.MASTER_AUTO_PIN_ENVS }}

          注意：
          - 独立 CI「生产 DB migration」仍保留为故障恢复 / 单独补跑入口。
          - 本阶段审批通过后，生产 DB migration apply 与 GitOps promote 使用同一个 SOURCE_SHA。
          - shprod/sgprod Argo 仍按生产策略进入待同步，后续需要人工检查 diff/sync。
      timeout-hours: 24
    jobs:
      approve:
        name: 等待人工确认生产 promote
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 生产 promote 已确认
            shell: bash
            run: |
              echo "production promote check-in approved for ${{ parameters.DISPLAY_NAME }}"
  - name: 执行生产 DB migration ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_DB_MIGRATION }} == true && ${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    jobs:
      apply:
        name: 执行 ${{ parameters.DISPLAY_NAME }} 生产 DB migration
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - name: 执行生产 DB migration
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "build" ]]; then
                echo "skip production DB migration apply because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              if [[ "${{ ci.branch }}" != "master" ]]; then
                echo "skip production DB migration apply because branch=${{ ci.branch }}"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_ensure_db_job_tools

              SOURCE_SHA="$(git rev-parse HEAD)"
              PROD_ENVS="$(python3 "$REPO_ROOT/.ci/runtime/commands/resolve_prod_promote_envs.py" \
                --build-envs "${{ parameters.MASTER_BUILD_ENVS }}" \
                --auto-pin-envs "${{ parameters.MASTER_AUTO_PIN_ENVS }}")"
              if [[ -z "$PROD_ENVS" ]]; then
                echo "no shprod/sgprod env needs production DB migration apply"
                exit 0
              fi

              echo "============================================================"
              echo "生产 DB migration 执行：${{ parameters.DISPLAY_NAME }}"
              echo "SERVICE=${{ parameters.SERVICE }}"
              echo "BUNDLE=${{ parameters.BUNDLE }}"
              echo "SOURCE_SHA=${SOURCE_SHA}"
              echo "TIMEOUT_SECONDS=1800"
              echo "说明：若 SOURCE_SHA 未包含 migration 路径变更，命令会自动跳过 migration Job。"
              echo "============================================================"

              while IFS= read -r TARGET_ENV_NAME; do
                if [[ -z "$TARGET_ENV_NAME" ]]; then
                  continue
                fi
                echo "执行生产 DB migration：${TARGET_ENV_NAME}"
                python3 "$REPO_ROOT/.ci/runtime/commands/run_prod_db_migration.py" \
                  --service "${{ parameters.SERVICE }}" \
                  --env "$TARGET_ENV_NAME" \
                  --source-sha "$SOURCE_SHA" \
                  --timeout-seconds 1800 \
                  --skip-if-no-migration-change \
                  --apply
              done <<<"$PROD_ENVS"
  - name: 自动创建生产 promote ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    jobs:
      promote:
        name: 创建 ${{ parameters.DISPLAY_NAME }} 生产 GitOps promote
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 创建 shprod/sgprod promote
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "build" ]]; then
                echo "skip production promote because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              if [[ "${{ ci.branch }}" != "master" ]]; then
                echo "skip production promote because branch=${{ ci.branch }}"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults

              SOURCE_SHA="$(git rev-parse HEAD)"
              CI_RUNTIME_REF="${CI_RUNTIME_REF:-${{ ci.branch }}}"
              CI_RUNTIME_COMMIT="${CI_RUNTIME_COMMIT:-$SOURCE_SHA}"
              export CI_RUNTIME_REF CI_RUNTIME_COMMIT
              PROD_ENVS="$(python3 "$REPO_ROOT/.ci/runtime/commands/resolve_prod_promote_envs.py" \
                --build-envs "${{ parameters.MASTER_BUILD_ENVS }}" \
                --auto-pin-envs "${{ parameters.MASTER_AUTO_PIN_ENVS }}")"
              if [[ -z "$PROD_ENVS" ]]; then
                echo "no shprod/sgprod env needs production promote"
                exit 0
              fi

              echo "============================================================"
              echo "生产 promote 计划：${{ parameters.DISPLAY_NAME }}"
              echo "SERVICE=${{ parameters.SERVICE }}"
              echo "BUNDLE=${{ parameters.BUNDLE }}"
              echo "SOURCE_SHA=${SOURCE_SHA}"
              echo "DB 变更提示：生产 DB migration 已内嵌到本流水线"
              echo "独立 CI=生产 DB migration 仅作为故障恢复 / 单独补跑入口"
              echo "SERVICE=${{ parameters.SERVICE }}"
              echo "SOURCE_SHA=${SOURCE_SHA}"
              while IFS= read -r TARGET_ENV_NAME; do
                if [[ -n "$TARGET_ENV_NAME" ]]; then
                  echo "TARGET_ENV=${TARGET_ENV_NAME}"
                fi
              done <<<"$PROD_ENVS"
              echo "============================================================"

              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              export REMOTE_URL GITOPS_BRANCH
              RUNTIME_SNAPSHOT="$(ci_create_runtime_snapshot "$REPO_ROOT/.ci")"
              cleanup_runtime_snapshot() {
                rm -rf "$RUNTIME_SNAPSHOT"
              }
              trap cleanup_runtime_snapshot EXIT
              PROMOTE_BUNDLE_SCRIPT="$RUNTIME_SNAPSHOT/.ci/runtime/promote_bundle_image_to_gitops.sh"
              while IFS= read -r TARGET_ENV_NAME; do
                if [[ -z "$TARGET_ENV_NAME" ]]; then
                  continue
                fi
                echo "create GitOps promote: TARGET_ENV=${TARGET_ENV_NAME} SOURCE_SHA=${SOURCE_SHA}"
                bash "$PROMOTE_BUNDLE_SCRIPT" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "$TARGET_ENV_NAME" "$SOURCE_SHA"
              done <<<"$PROD_ENVS"
