version: v2.0

parameters:
  - name: SERVICE
    type: string
  - name: BUNDLE
    type: string
  - name: DISPLAY_NAME
    type: string
  - name: DEFAULT_TARGET_ENV
    type: string
    default: shprod
  - name: MASTER_BUILD_ENVS
    type: string
    default: beijing-sandbox,shprod,sgprod
  - name: MASTER_AUTO_PIN_ENVS
    type: string
    default: beijing-sandbox
  - name: ENABLE_MASTER_PROD_PROMOTE
    type: boolean
    default: true
  - name: ENABLE_MASTER_PROD_DB_MIGRATION
    type: boolean
    default: false
  - name: ENABLE_MASTER_SHPROD_DB_MIGRATION
    type: boolean
    default: true
  - name: ENABLE_MASTER_SGPROD_DB_MIGRATION
    type: boolean
    default: true
  - name: PLAYGROUND_BUILD_ENVS
    type: string
    default: auto
  - name: PLAYGROUND_AUTO_PIN_ENVS
    type: string
    default: auto
  - name: PROD_REVIEWERS
    type: string
    default: '["skipzhang"]'

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: ${{ parameters.DEFAULT_TARGET_ENV }}
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 构建 ${{ parameters.DISPLAY_NAME }}
    jobs:
      release:
        name: 构建 ${{ parameters.DISPLAY_NAME }} 镜像
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 打印 ${{ parameters.DISPLAY_NAME }} 构建上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
              echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
              echo "SERVICE=${{ parameters.SERVICE }}"
              echo "BUNDLE=${{ parameters.BUNDLE }}"
              echo "DEFAULT_TARGET_ENV=${{ parameters.DEFAULT_TARGET_ENV }}"
              echo "MASTER_BUILD_ENVS=${{ parameters.MASTER_BUILD_ENVS }}"
              echo "MASTER_AUTO_PIN_ENVS=${{ parameters.MASTER_AUTO_PIN_ENVS }}"
              echo "PLAYGROUND_BUILD_ENVS=${{ parameters.PLAYGROUND_BUILD_ENVS }}"
              echo "PLAYGROUND_AUTO_PIN_ENVS=${{ parameters.PLAYGROUND_AUTO_PIN_ENVS }}"
          - id: prepare
            name: 准备 ${{ parameters.DISPLAY_NAME }} 构建标签
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              SHORT_SHA='${{ ci.sha }}'
              if [[ -z "$SHORT_SHA" || "$SHORT_SHA" == *'${{'* ]]; then
                SHORT_SHA="${BK_CI_GIT_HEAD_COMMITS%%,*}"
              fi
              SHORT_SHA="$(printf '%.12s' "$SHORT_SHA")"
              echo "::set-output name=tag::${{ parameters.SERVICE }}-${SHORT_SHA}"
          - name: 构建 ${{ parameters.DISPLAY_NAME }} 镜像矩阵
            shell: bash
            env:
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_KR1_PASSWORD: ${{ settings.TCR_KR1_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              TCR_SGPROD_PASSWORD: ${{ settings.TCR_SGPROD_PASSWORD }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip build step because PIPELINE_MODE=promote"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}"
              RELEASE_CI_NAME="构建 ${{ parameters.DISPLAY_NAME }}"
              RELEASE_DISPLAY_NAME="${{ parameters.DISPLAY_NAME }}"
              export REMOTE_URL GITOPS_BRANCH BUILD_TAG_OVERRIDE RELEASE_CI_NAME RELEASE_DISPLAY_NAME
              RELEASE_IMAGE_DIR=".ci/.release-images/${{ parameters.SERVICE }}-${{ steps.prepare.outputs.tag }}"
              rm -rf "$RELEASE_IMAGE_DIR"
              mkdir -p "$RELEASE_IMAGE_DIR"
              export RELEASE_IMAGE_DIR
              resolve_playground_envs() {
                local configured="$1"
                local branch_env="$2"
                case "$configured" in
                  ""|auto|__branch__)
                    printf '%s' "$branch_env"
                    ;;
                  *)
                    printf '%s' "$configured"
                    ;;
                esac
              }
              case "${{ ci.branch }}" in
                master)
                  BUILD_ENVS="${{ parameters.MASTER_BUILD_ENVS }}"
                  AUTO_PIN_ENVS="${{ parameters.MASTER_AUTO_PIN_ENVS }}"
                  ;;
                playground/sandbox-bj-*|playground/sandbox-kr-*)
                  PLAYGROUND_ENV="${{ ci.branch }}"
                  PLAYGROUND_ENV="${PLAYGROUND_ENV#playground/}"
                  BUILD_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_BUILD_ENVS }}" "$PLAYGROUND_ENV")"
                  AUTO_PIN_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_AUTO_PIN_ENVS }}" "$PLAYGROUND_ENV")"
                  echo "Playground 发布决策：分支 ${{ ci.branch }} 自动映射目标环境 ${PLAYGROUND_ENV}"
                  ;;
                *)
                  echo "unsupported source branch for release: ${{ ci.branch }}" >&2
                  exit 1
                  ;;
              esac
              echo "BUILD_ENVS=${BUILD_ENVS}"
              echo "AUTO_PIN_ENVS=${AUTO_PIN_ENVS}"
              BUILD_ONLY=true bash "$REPO_ROOT/.ci/runtime/build_and_promote_to_gitops.sh" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "${BUILD_ENVS}" "${AUTO_PIN_ENVS}"
          - name: 北京测试 DB 变更检查与 GitOps auto-pin
            shell: bash
            env:
              GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_KR1_PASSWORD: ${{ settings.TCR_KR1_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
              TCR_SGPROD_PASSWORD: ${{ settings.TCR_SGPROD_PASSWORD }}
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" == "promote" ]]; then
                echo "skip Beijing DB change gate / auto-pin because PIPELINE_MODE=promote"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}"
              RELEASE_CI_NAME="构建 ${{ parameters.DISPLAY_NAME }}"
              RELEASE_DISPLAY_NAME="${{ parameters.DISPLAY_NAME }}"
              RELEASE_IMAGE_DIR=".ci/.release-images/${{ parameters.SERVICE }}-${{ steps.prepare.outputs.tag }}"
              trap 'rm -rf "$RELEASE_IMAGE_DIR"' EXIT
              export REMOTE_URL GITOPS_BRANCH BUILD_TAG_OVERRIDE RELEASE_CI_NAME RELEASE_DISPLAY_NAME RELEASE_IMAGE_DIR
              resolve_playground_envs() {
                local configured="$1"
                local branch_env="$2"
                case "$configured" in
                  ""|auto|__branch__)
                    printf '%s' "$branch_env"
                    ;;
                  *)
                    printf '%s' "$configured"
                    ;;
                esac
              }
              case "${{ ci.branch }}" in
                master)
                  BUILD_ENVS="${{ parameters.MASTER_BUILD_ENVS }}"
                  AUTO_PIN_ENVS="${{ parameters.MASTER_AUTO_PIN_ENVS }}"
                  ;;
                playground/sandbox-bj-*|playground/sandbox-kr-*)
                  PLAYGROUND_ENV="${{ ci.branch }}"
                  PLAYGROUND_ENV="${PLAYGROUND_ENV#playground/}"
                  BUILD_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_BUILD_ENVS }}" "$PLAYGROUND_ENV")"
                  AUTO_PIN_ENVS="$(resolve_playground_envs "${{ parameters.PLAYGROUND_AUTO_PIN_ENVS }}" "$PLAYGROUND_ENV")"
                  echo "Playground 发布决策：分支 ${{ ci.branch }} 自动映射目标环境 ${PLAYGROUND_ENV}"
                  ;;
                *)
                  echo "unsupported source branch for release: ${{ ci.branch }}" >&2
                  exit 1
                  ;;
              esac
              echo "BUILD_ENVS=${BUILD_ENVS}"
              echo "AUTO_PIN_ENVS=${AUTO_PIN_ENVS}"
              AUTO_PIN_ONLY=true bash "$REPO_ROOT/.ci/runtime/build_and_promote_to_gitops.sh" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "${BUILD_ENVS}" "${AUTO_PIN_ENVS}"
          - name: 手动发布 ${{ parameters.DISPLAY_NAME }} 到 GitOps
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "promote" ]]; then
                echo "skip promote step because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              SOURCE_SHA="${{ variables.SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA='${{ ci.sha }}'
                if [[ -z "$SOURCE_SHA" || "$SOURCE_SHA" == *'${{'* ]]; then
                  SOURCE_SHA="${BK_CI_GIT_HEAD_COMMITS%%,*}"
                fi
                echo "SOURCE_SHA not provided; default to ci.sha=$SOURCE_SHA"
              fi
              test -n "$SOURCE_SHA"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              bash "$REPO_ROOT/.ci/runtime/promote_bundle_image_to_gitops.sh" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "${{ variables.TARGET_ENV }}" "$SOURCE_SHA"
  - name: 是否准备进入生产 ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    check-in:
      reviews:
        flows:
          - name: 是否准备进入生产
            reviewers: ${{ parameters.PROD_REVIEWERS }}
        description: |
          本阶段确认是否允许本次构建进入生产候选流程。

          点击通过后，流水线会进入生产候选流程：
          - 若本服务启用生产 DB migration，会先发起 shprod / sgprod DB 子流水线
          - DB 子流水线会执行真实 DB 版本探测；current == latest 时跳过 migration，current < latest 时必须显式确认后才允许执行 migration
          - 若本服务未启用生产 DB migration，会直接进入生产镜像升级二次确认
          - 若 DB dirty 或版本超前，DB 子流水线会阻断

          本阶段不创建 GitOps promote 分支，不合并 GitOps，也不触发 Argo sync。
      timeout-hours: 24
    jobs:
      approve:
        name: 确认进入生产候选流程
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 生产候选流程已确认
            shell: bash
            run: |
              echo "production candidate flow approved for ${{ parameters.DISPLAY_NAME }}"
  - name: 发起 shprod DB migration ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ parameters.ENABLE_MASTER_PROD_DB_MIGRATION }} == true && ${{ parameters.ENABLE_MASTER_SHPROD_DB_MIGRATION }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    jobs:
      trigger:
        name: 判断并发起 ${{ parameters.DISPLAY_NAME }} shprod DB migration 流水线
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - id: plan
            name: 判断 shprod 是否会产生实际 DB 变更
            shell: bash
            run: |
              set -euo pipefail
              source .ci/init.sh
              ci_init_repo_root
              ci_ensure_db_job_tools
              python3 "$REPO_ROOT/.ci/runtime/commands/run_prod_db_migration.py" \
                --service "${{ parameters.BUNDLE }}" \
                --env shprod \
                --source-sha "${{ ci.sha }}" \
                --timeout-seconds 1800 \
                --skip-if-no-migration-change \
                --decision-output shprod-db-migration-decision.json
              echo "shprod-db-migration-decision.json:"
              cat shprod-db-migration-decision.json
              DECISION="$(python3 -c 'import json; print(json.load(open("shprod-db-migration-decision.json", encoding="utf-8"))["decision"])')"
              case "$DECISION" in
                run_migration|skip_migration|block)
                  ;;
                *)
                  echo "unexpected shprod DB migration decision: $DECISION" >&2
                  exit 1
                  ;;
              esac
              echo "::set-output name=decision::$DECISION"
              echo "shprod DB migration decision=$DECISION"
          - name: 调用 shprod 生产 DB migration 子流水线
            uses: "SubPipelineExecStream@1.*"
            with:
              repositoryType: "URL"
              repositoryFromUrl: "https://git.woa.com/wisp/mono2.git"
              targetBranchFromUrl: "master"
              targetPathFromUrl: ".ci/db-migration.yml"
              buildInfo: "shprod DB migration: ${{ parameters.BUNDLE }} @ ${{ ci.sha }} decision=${{ steps.plan.outputs.decision }}"
              paramsInput:
                - key: "SERVICE"
                  value: "${{ parameters.BUNDLE }}"
                - key: "TARGET_ENV"
                  value: "shprod"
                - key: "SOURCE_SHA"
                  value: "${{ ci.sha }}"
                - key: "TIMEOUT_SECONDS"
                  value: "1800"
                - key: "SKIP_IF_NO_MIGRATION_CHANGE"
                  value: "true"
                - key: "MIGRATION_DECISION"
                  value: "${{ steps.plan.outputs.decision }}"
  - name: 发起 sgprod DB migration ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ parameters.ENABLE_MASTER_PROD_DB_MIGRATION }} == true && ${{ parameters.ENABLE_MASTER_SGPROD_DB_MIGRATION }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    jobs:
      trigger:
        name: 判断并发起 ${{ parameters.DISPLAY_NAME }} sgprod DB migration 流水线
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          SOPS_AGE_KEY: ${{ settings.SOPS_AGE_KEY }}
          SOPS_AGE_KEY_FILE: ${{ settings.SOPS_AGE_KEY_FILE }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 0
          - id: plan
            name: 判断 sgprod 是否会产生实际 DB 变更
            shell: bash
            run: |
              set -euo pipefail
              source .ci/init.sh
              ci_init_repo_root
              ci_ensure_db_job_tools
              python3 "$REPO_ROOT/.ci/runtime/commands/run_prod_db_migration.py" \
                --service "${{ parameters.BUNDLE }}" \
                --env sgprod \
                --source-sha "${{ ci.sha }}" \
                --timeout-seconds 1800 \
                --skip-if-no-migration-change \
                --decision-output sgprod-db-migration-decision.json
              echo "sgprod-db-migration-decision.json:"
              cat sgprod-db-migration-decision.json
              DECISION="$(python3 -c 'import json; print(json.load(open("sgprod-db-migration-decision.json", encoding="utf-8"))["decision"])')"
              case "$DECISION" in
                run_migration|skip_migration|block)
                  ;;
                *)
                  echo "unexpected sgprod DB migration decision: $DECISION" >&2
                  exit 1
                  ;;
              esac
              echo "::set-output name=decision::$DECISION"
              echo "sgprod DB migration decision=$DECISION"
          - name: 调用 sgprod 生产 DB migration 子流水线
            uses: "SubPipelineExecStream@1.*"
            with:
              repositoryType: "URL"
              repositoryFromUrl: "https://git.woa.com/wisp/mono2.git"
              targetBranchFromUrl: "master"
              targetPathFromUrl: ".ci/db-migration.yml"
              buildInfo: "sgprod DB migration: ${{ parameters.BUNDLE }} @ ${{ ci.sha }} decision=${{ steps.plan.outputs.decision }}"
              paramsInput:
                - key: "SERVICE"
                  value: "${{ parameters.BUNDLE }}"
                - key: "TARGET_ENV"
                  value: "sgprod"
                - key: "SOURCE_SHA"
                  value: "${{ ci.sha }}"
                - key: "TIMEOUT_SECONDS"
                  value: "1800"
                - key: "SKIP_IF_NO_MIGRATION_CHANGE"
                  value: "true"
                - key: "MIGRATION_DECISION"
                  value: "${{ steps.plan.outputs.decision }}"
  - name: 二次确认生产镜像升级 ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    check-in:
      reviews:
        flows:
          - name: 二次确认生产镜像升级
            reviewers: ${{ parameters.PROD_REVIEWERS }}
        description: |
          本阶段是创建生产 GitOps promote 分支前的二次确认。

          点击通过前请确认：
          - 本次镜像 tag / SOURCE_SHA 确实允许进入 shprod / sgprod GitOps 待同步流程
          - 若本服务启用生产 DB migration，shprod / sgprod DB 子流水线已经完成
          - 若 DB 子流水线显示实际执行 migration，pending SQL 和执行结果符合预期
          - 若 DB 子流水线显示 skip_migration，目标库 current/latest 已经一致

          点击通过后，流水线才会创建 shprod / sgprod promote 分支。
          promote 分支合并后会更新生产 GitOps desired state；Argo 仍按生产策略由人工检查 diff/sync。
      timeout-hours: 24
    jobs:
      approve:
        name: 二次确认生产镜像升级
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 生产镜像升级已二次确认
            shell: bash
            run: |
              echo "production image upgrade second approval passed for ${{ parameters.DISPLAY_NAME }}"
  - name: 创建生产 promote 候选 ${{ parameters.DISPLAY_NAME }}
    if: "${{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && ${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    jobs:
      promote:
        name: 创建 ${{ parameters.DISPLAY_NAME }} shprod/sgprod GitOps promote 候选
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 创建 shprod/sgprod promote
            shell: bash
            run: |
              if [[ "${{ variables.PIPELINE_MODE }}" != "build" ]]; then
                echo "skip production promote because PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
                exit 0
              fi
              if [[ "${{ ci.branch }}" != "master" ]]; then
                echo "skip production promote because branch=${{ ci.branch }}"
                exit 0
              fi
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults

              SOURCE_SHA="$(git rev-parse HEAD)"
              CI_RUNTIME_REF="${CI_RUNTIME_REF:-${{ ci.branch }}}"
              CI_RUNTIME_COMMIT="${CI_RUNTIME_COMMIT:-$SOURCE_SHA}"
              export CI_RUNTIME_REF CI_RUNTIME_COMMIT
              PROD_ENVS="$(python3 "$REPO_ROOT/.ci/runtime/commands/resolve_prod_promote_envs.py" \
                --build-envs "${{ parameters.MASTER_BUILD_ENVS }}" \
                --auto-pin-envs "${{ parameters.MASTER_AUTO_PIN_ENVS }}")"
              if [[ -z "$PROD_ENVS" ]]; then
                echo "no shprod/sgprod env needs production promote"
                exit 0
              fi

              echo "============================================================"
              echo "生产 promote 候选计划：${{ parameters.DISPLAY_NAME }}"
              echo "SERVICE=${{ parameters.SERVICE }}"
              echo "BUNDLE=${{ parameters.BUNDLE }}"
              echo "SOURCE_SHA=${SOURCE_SHA}"
              echo "说明：本阶段只创建 per-env promote 分支；shprod/sgprod 将各自触发独立审批流水线。"
              while IFS= read -r TARGET_ENV_NAME; do
                if [[ -n "$TARGET_ENV_NAME" ]]; then
                  echo "TARGET_ENV=${TARGET_ENV_NAME}"
                fi
              done <<<"$PROD_ENVS"
              echo "============================================================"

              REMOTE_URL="$(ci_gitops_remote_url)"
              GITOPS_BRANCH=gitops
              export REMOTE_URL GITOPS_BRANCH
              RUNTIME_SNAPSHOT="$(ci_create_runtime_snapshot "$REPO_ROOT/.ci")"
              cleanup_runtime_snapshot() {
                rm -rf "$RUNTIME_SNAPSHOT"
              }
              trap cleanup_runtime_snapshot EXIT
              PROMOTE_BUNDLE_SCRIPT="$RUNTIME_SNAPSHOT/.ci/runtime/promote_bundle_image_to_gitops.sh"
              while IFS= read -r TARGET_ENV_NAME; do
                if [[ -z "$TARGET_ENV_NAME" ]]; then
                  continue
                fi
                echo "create GitOps promote: TARGET_ENV=${TARGET_ENV_NAME} SOURCE_SHA=${SOURCE_SHA}"
                bash "$PROMOTE_BUNDLE_SCRIPT" "${{ parameters.SERVICE }}" "${{ parameters.BUNDLE }}" "$TARGET_ENV_NAME" "$SOURCE_SHA"
              done <<<"$PROD_ENVS"
