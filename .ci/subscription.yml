version: v2.0
name: 构建 subscription

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - subscription/**
      - argocd/services/subscription/**
      - argocd/apps/*/subscription.yaml
      - argocd/secrets/*/subscription-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template:
    path: .ci/templates/service-release.yml
    variables:
      SERVICE: subscription
      BUNDLE: subscription
      DISPLAY_NAME: subscription
