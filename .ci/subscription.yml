version: v2.0
name: release-subscription

on:
  push:
    branches: [ master ]
    paths:
      - subscription/**
      - argocd/services/subscription/**
      - argocd/apps/*/subscription.yaml
      - argocd/secrets/*/subscription-runtime-secrets.sops.yaml
  manual: enabled

concurrency:
  group: mono2-master-release
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 服务发布
    jobs:
      release:
        name: 构建镜像并推进 GitOps 发布
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
        steps:
          - checkout: self
            with:
              fetchDepth: 50
          - name: debug-context
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
              echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
          - id: prepare
            if: ${{ variables.PIPELINE_MODE }} != 'promote'
            shell: bash
            run: |
              SHORT_SHA="${{ ci.sha }}"
              SHORT_SHA="${SHORT_SHA:0:12}"
              echo "::set-output name=tag::subscription-${SHORT_SHA}"
          - name: build-and-promote-beijing
            if: ${{ variables.PIPELINE_MODE }} != 'promote'
            shell: bash
            env:
              TCR_BEIJING_PASSWORD: ${{ settings.TCR_BEIJING_PASSWORD }}
              TCR_SHPROD_PASSWORD: ${{ settings.TCR_SHPROD_PASSWORD }}
            run: |
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              BUILD_TAG_OVERRIDE="${{ steps.prepare.outputs.tag }}" \
              bash .ci/runtime/build_and_promote_to_gitops.sh subscription subscription beijing-sandbox,beijing-sandbox-2,shprod beijing-sandbox,beijing-sandbox-2
          - name: promote-manual
            if: ${{ variables.PIPELINE_MODE }} == 'promote'
            shell: bash
            run: |
              test -n "${{ variables.SOURCE_SHA }}"
              source .ci/init.sh
              ci_init_repo_root
              ci_export_gongfeng_defaults
              REMOTE_URL="$(ci_gitops_remote_url)" \
              GITOPS_BRANCH=gitops \
              bash .ci/runtime/promote_bundle_image_to_gitops.sh subscription subscription "${{ variables.TARGET_ENV }}" "${{ variables.SOURCE_SHA }}"
