version: v2.0
name: release-subscription

on:
  push:
    branches: [ master ]
    paths:
      - subscription/**
      - scripts/build-release-image.py
      - scripts/resolve_release_bundle.py
      - scripts/release-bundles.yaml
      - scripts/update_image_pin.py
      - scripts/pin_image_to_gitops.sh
      - scripts/promote_bundle_image_to_gitops.sh
  manual: enabled

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

jobs:
  release:
    runs-on:
      self-hosted: true
      pool-name: env
    steps:
      - checkout: self
        with:
          fetchDepth: 50
      - name: debug-context
        shell: bash
        run: |
          echo "ci.event=${{ ci.event }}"
          echo "ci.branch=${{ ci.branch }}"
          echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
          echo "TARGET_ENV=${{ variables.TARGET_ENV }}"
          echo "SOURCE_SHA=${{ variables.SOURCE_SHA }}"
      - id: prepare
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        shell: bash
        run: |
          SHORT_SHA="${{ ci.sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"
          echo "::set-output name=tag::subscription-${SHORT_SHA}"
      - name: build-beijing
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        uses: DockerBuildAndPushImage@3.*
        with:
          targetTicketId: ${{ settings.TCR_BEIJING_SANDBOX_TICKET }}
          targetImage: lightclaw-bj8.tencentcloudcr.com/lightclaw/subscription
          targetImageTag: ${{ steps.prepare.outputs.tag }}
          dockerBuildDir: ./subscription
          dockerFilePath: ./subscription/Dockerfile
      - name: build-shprod
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        uses: DockerBuildAndPushImage@3.*
        with:
          targetTicketId: ${{ settings.TCR_SHPROD_TICKET }}
          targetImage: lightclaw-shprod.tencentcloudcr.com/lightclaw/subscription
          targetImageTag: ${{ steps.prepare.outputs.tag }}
          dockerBuildDir: ./subscription
          dockerFilePath: ./subscription/Dockerfile
      - name: promote-beijing
        if: ${{ variables.PIPELINE_MODE }} != 'promote'
        shell: bash
        run: |
          REMOTE_URL="git@git.woa.com:wisp/mono2.git" \
          GITOPS_BRANCH=gitops \
          bash scripts/pin_image_to_gitops.sh "subscription" "beijing-sandbox" "lightclaw-bj8.tencentcloudcr.com/lightclaw/subscription:${{ steps.prepare.outputs.tag }}"
      - name: promote-manual
        if: ${{ variables.PIPELINE_MODE }} == 'promote'
        shell: bash
        run: |
          test -n "${{ variables.SOURCE_SHA }}"
          REMOTE_URL="git@git.woa.com:wisp/mono2.git" \
          GITOPS_BRANCH=gitops \
          bash scripts/promote_bundle_image_to_gitops.sh subscription subscription "${{ variables.TARGET_ENV }}" "${{ variables.SOURCE_SHA }}"
