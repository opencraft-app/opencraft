version: v2.0
name: BK-CI stage-if 探针

on:
  push:
    branches:
      - master
    paths:
      - ci-probes/stage-if-probe.trigger
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-stage-if-probe
  cancel-in-progress: false
  queue-length: 5
  queue-timeout-minutes: 120

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_EDGEONE_RELEASE_MATRIX:
    value: eo:cn-lightvela-prod,eo:global-lightvela-intl-prod
    readonly: false
    allow-modify-at-startup: true
  FRONTEND_EDGEONE_RELEASE_ENABLED:
    value: true
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 0 打印上下文
    jobs:
      probe:
        name: 打印 BK-CI 表达式上下文
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "variables.PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "variables.FRONTEND_EDGEONE_RELEASE_ENABLED=${{ variables.FRONTEND_EDGEONE_RELEASE_ENABLED }}"
              echo "variables.FRONTEND_EDGEONE_RELEASE_MATRIX=${{ variables.FRONTEND_EDGEONE_RELEASE_MATRIX }}"
              echo "env.BK_CI_EVENT=${BK_CI_EVENT:-}"
              echo "env.BK_CI_GIT_REPO_BRANCH=${BK_CI_GIT_REPO_BRANCH:-}"
              echo "env.BK_CI_GIT_REPO_REF=${BK_CI_GIT_REPO_REF:-}"

  - name: 1A 裸表达式 variables.PIPELINE_MODE
    if: "variables.PIPELINE_MODE == 'build'"
    jobs:
      probe:
        name: 裸表达式 PIPELINE_MODE 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 裸表达式 PIPELINE_MODE stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: variables.PIPELINE_MODE == 'build'"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"

  - name: 1B 表达式块 variables.PIPELINE_MODE
    if: "${{ variables.PIPELINE_MODE == 'build' }}"
    jobs:
      probe:
        name: 表达式块 PIPELINE_MODE 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 表达式块 PIPELINE_MODE stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: expression block variables.PIPELINE_MODE == 'build'"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"

  - name: 1C 插值比较 variables.PIPELINE_MODE
    if: "${{ variables.PIPELINE_MODE }} == build"
    jobs:
      probe:
        name: 插值比较 PIPELINE_MODE 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 插值比较 PIPELINE_MODE stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: interpolated variables.PIPELINE_MODE == build"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"

  - name: 2A 裸表达式 ci.branch
    if: "ci.branch == 'master'"
    jobs:
      probe:
        name: 裸表达式 ci.branch 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 裸表达式 ci.branch stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: ci.branch == 'master'"
              echo "ci.branch=${{ ci.branch }}"

  - name: 2B 表达式块 ci.branch
    if: "${{ ci.branch == 'master' }}"
    jobs:
      probe:
        name: 表达式块 ci.branch 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 表达式块 ci.branch stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: expression block ci.branch == 'master'"
              echo "ci.branch=${{ ci.branch }}"

  - name: 2C 插值比较 ci.branch
    if: "${{ ci.branch }} == master"
    jobs:
      probe:
        name: 插值比较 ci.branch 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 插值比较 ci.branch stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: interpolated ci.branch == master"
              echo "ci.branch=${{ ci.branch }}"

  - name: 3A 裸表达式生产审核组合条件
    if: "variables.PIPELINE_MODE == 'build' && ci.branch == 'master'"
    check-in:
      reviews:
        flows:
          - name: 裸表达式 stage-if 探针审核
            reviewers: [ "skipzhang" ]
        description: |
          BK-CI stage-if 裸表达式探针命中。

          期望命中条件：
          - variables.PIPELINE_MODE == 'build'
          - ci.branch == 'master'

          如果这个审核阶段出现并可点击，说明生产审核 stage 可以使用裸表达式：
          if: "parameters.ENABLE_MASTER_PROD_PROMOTE == true && variables.PIPELINE_MODE == 'build' && ci.branch == 'master'"
      timeout-hours: 2
    jobs:
      probe:
        name: 裸表达式生产审核组合条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 裸表达式组合条件 stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: variables.PIPELINE_MODE == 'build' && ci.branch == 'master'"

  - name: 3B 表达式块生产审核组合条件
    if: "${{ variables.PIPELINE_MODE == 'build' && ci.branch == 'master' }}"
    check-in:
      reviews:
        flows:
          - name: 表达式块 stage-if 探针审核
            reviewers: [ "skipzhang" ]
        description: |
          BK-CI stage-if 表达式块探针命中。

          期望命中条件：
          - variables.PIPELINE_MODE == 'build'
          - ci.branch == 'master'

          如果这个审核阶段出现并可点击，说明生产审核 stage 应该使用：
          if: "$ {{ parameters.ENABLE_MASTER_PROD_PROMOTE == true && variables.PIPELINE_MODE == 'build' && ci.branch == 'master' }}"
      timeout-hours: 2
    jobs:
      probe:
        name: 表达式块生产审核组合条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 表达式块组合条件 stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: expression block variables.PIPELINE_MODE == 'build' && ci.branch == 'master'"

  - name: 3C 无条件审核基线
    check-in:
      reviews:
        flows:
          - name: 无条件审核基线
            reviewers: [ "skipzhang" ]
        description: |
          这是无条件审核基线。

          如果 3A/3B 都跳过，但本阶段出现并可点击，说明 check-in 本身没问题，问题集中在 stage if 表达式。
      timeout-hours: 2
    jobs:
      probe:
        name: 无条件审核基线命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 无条件审核基线命中
            shell: bash
            run: |
              echo "unconditional check-in baseline reached"

  - name: 3D 插值比较生产审核组合条件
    if: "${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master"
    check-in:
      reviews:
        flows:
          - name: 插值比较 stage-if 探针审核
            reviewers: [ "skipzhang" ]
        description: |
          BK-CI stage-if 插值比较探针命中。

          期望命中条件：
          - variables.PIPELINE_MODE 插值后等于 build
          - ci.branch 插值后等于 master

          如果这个审核阶段出现并可点击，说明生产审核 stage 可以使用插值比较：
          if: "$ {{ parameters.ENABLE_MASTER_PROD_PROMOTE }} == true && $ {{ variables.PIPELINE_MODE }} == build && $ {{ ci.branch }} == master"
      timeout-hours: 2
    jobs:
      probe:
        name: 插值比较生产审核组合条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 插值比较组合条件 stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: interpolated PIPELINE_MODE == build && ci.branch == master"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "ci.branch=${{ ci.branch }}"

  - name: 4 反向验证 promote 模式应跳过
    if: "${{ variables.PIPELINE_MODE == 'promote' && ci.branch == 'master' }}"
    jobs:
      probe:
        name: promote 模式条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: promote 条件 stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: variables.PIPELINE_MODE == 'promote' && ci.branch == 'master'"

  - name: 4A 前端 EO 布尔开关正式条件
    if: "${{ variables.FRONTEND_EDGEONE_RELEASE_ENABLED }} == true"
    jobs:
      probe:
        name: 前端 EO 布尔开关正式条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 前端 EO 布尔开关正式条件命中
            shell: bash
            run: |
              echo "stage-if matched: FRONTEND_EDGEONE_RELEASE_ENABLED == true"
              echo "FRONTEND_EDGEONE_RELEASE_ENABLED=${{ variables.FRONTEND_EDGEONE_RELEASE_ENABLED }}"

  - name: 4B 前端 EO 布尔开关反向条件
    if: "${{ variables.FRONTEND_EDGEONE_RELEASE_ENABLED }} == false"
    jobs:
      probe:
        name: 前端 EO 布尔开关反向条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 前端 EO 布尔开关反向条件命中
            shell: bash
            run: |
              echo "stage-if matched: FRONTEND_EDGEONE_RELEASE_ENABLED == false"
              echo "FRONTEND_EDGEONE_RELEASE_ENABLED=${{ variables.FRONTEND_EDGEONE_RELEASE_ENABLED }}"

  - name: 5A 前端 EO 发布审核候选条件
    if: "${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master && ${{ variables.FRONTEND_EDGEONE_RELEASE_MATRIX }} != none"
    check-in:
      reviews:
        flows:
          - name: 前端 EO 发布审核候选条件
            reviewers: [ "skipzhang" ]
        description: |
          BK-CI frontend EdgeOne 发布审核候选条件探针命中。

          期望命中条件：
          - PIPELINE_MODE 插值后等于 build
          - ci.branch 插值后等于 master
          - FRONTEND_EDGEONE_RELEASE_MATRIX 插值后不等于 none

          正式 frontend 合并流水线预计使用同类条件控制人工审核阶段：
          if: "$ {{ variables.PIPELINE_MODE }} == build && $ {{ ci.branch }} == master && $ {{ variables.FRONTEND_EDGEONE_RELEASE_MATRIX }} != none"
      timeout-hours: 2
    jobs:
      probe:
        name: 前端 EO 发布审核候选条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 前端 EO 发布审核候选条件命中
            shell: bash
            run: |
              echo "stage-if matched: frontend EO release candidate"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "FRONTEND_EDGEONE_RELEASE_MATRIX=${{ variables.FRONTEND_EDGEONE_RELEASE_MATRIX }}"

  - name: 5B 前端 EO none 反向条件
    if: "${{ variables.PIPELINE_MODE }} == build && ${{ ci.branch }} == master && ${{ variables.FRONTEND_EDGEONE_RELEASE_MATRIX }} == none"
    jobs:
      probe:
        name: 前端 EO none 反向条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 前端 EO none 反向条件命中
            shell: bash
            run: |
              echo "stage-if matched: frontend EO release matrix == none"
              echo "FRONTEND_EDGEONE_RELEASE_MATRIX=${{ variables.FRONTEND_EDGEONE_RELEASE_MATRIX }}"
