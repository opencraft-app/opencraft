version: v2.0
name: BK-CI stage-if 探针

on:
  push:
    branches:
      - master
    paths:
      - ci-probes/stage-if-probe.trigger
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-stage-if-probe
  cancel-in-progress: false
  queue-length: 5
  queue-timeout-minutes: 120

variables:
  PIPELINE_MODE:
    value: build
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 0 打印上下文
    jobs:
      probe:
        name: 打印 BK-CI 表达式上下文
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "variables.PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"
              echo "env.BK_CI_EVENT=${BK_CI_EVENT:-}"
              echo "env.BK_CI_GIT_REPO_BRANCH=${BK_CI_GIT_REPO_BRANCH:-}"
              echo "env.BK_CI_GIT_REPO_REF=${BK_CI_GIT_REPO_REF:-}"

  - name: 1 只验证 variables.PIPELINE_MODE
    if: "variables.PIPELINE_MODE == 'build'"
    jobs:
      probe:
        name: PIPELINE_MODE 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: PIPELINE_MODE stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: variables.PIPELINE_MODE == 'build'"
              echo "PIPELINE_MODE=${{ variables.PIPELINE_MODE }}"

  - name: 2 只验证 ci.branch
    if: "ci.branch == 'master'"
    jobs:
      probe:
        name: ci.branch 条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: ci.branch stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: ci.branch == 'master'"
              echo "ci.branch=${{ ci.branch }}"

  - name: 3 验证生产审核组合条件
    if: "variables.PIPELINE_MODE == 'build' && ci.branch == 'master'"
    check-in:
      reviews:
        flows:
          - name: stage-if 探针审核
            reviewers: [ "skipzhang" ]
        description: |
          BK-CI stage-if 探针命中。

          期望命中条件：
          - variables.PIPELINE_MODE == 'build'
          - ci.branch == 'master'

          如果这个审核阶段出现并可点击，说明生产审核 stage 可以使用：
          if: "parameters.ENABLE_MASTER_PROD_PROMOTE == true && variables.PIPELINE_MODE == 'build' && ci.branch == 'master'"
      timeout-hours: 2
    jobs:
      probe:
        name: 生产审核组合条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 组合条件 stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: variables.PIPELINE_MODE == 'build' && ci.branch == 'master'"

  - name: 4 反向验证 promote 模式应跳过
    if: "variables.PIPELINE_MODE == 'promote' && ci.branch == 'master'"
    jobs:
      probe:
        name: promote 模式条件命中
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: promote 条件 stage-if 命中
            shell: bash
            run: |
              echo "stage-if matched: variables.PIPELINE_MODE == 'promote' && ci.branch == 'master'"
