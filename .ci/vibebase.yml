version: v2.0
name: 构建 vibebase

on:
  push:
    branches:
      - master
    paths:
      - vibebase/**
      - argocd/apps/*/vibebase.yaml
      - argocd/projects/*vibebase.yaml
      - argocd/services/vibebase/**
      - argocd/catalogs/sandbox/*/vibebase.yaml
      - argocd/secrets/*/vibebase-runtime-secrets.sops.yaml
      - argocd/services/service-gateway/**
      - service-gateway/**
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-vibebase
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: vibebase
    BUNDLE: vibebase
    DISPLAY_NAME: vibebase
    DEFAULT_TARGET_ENV: beijing-sandbox
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    ENABLE_MASTER_PROD_PROMOTE: true
    PLAYGROUND_BUILD_ENVS: ""
    PLAYGROUND_AUTO_PIN_ENVS: ""
