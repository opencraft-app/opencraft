version: v2.0
name: 构建 nextgen-dashboard

on:
  push:
    branches: [ master ]
    paths:
      - nextgen-dashboard/**
      - argocd/services/nextgen-dashboard/**
      - argocd/apps/*/nextgen-dashboard.yaml
      - argocd/secrets/*/nextgen-dashboard-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template:
    path: .ci/templates/service-release.yml
    variables:
      SERVICE: nextgen-dashboard
      BUNDLE: nextgen-dashboard
      DISPLAY_NAME: nextgen-dashboard
