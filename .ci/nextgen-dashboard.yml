version: v2.0
name: 构建 nextgen-dashboard

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
    paths:
      - nextgen-dashboard/**
      - argocd/services/nextgen-dashboard/**
      - argocd/apps/*/nextgen-dashboard.yaml
      - argocd/secrets/*/nextgen-dashboard-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-nextgen-dashboard
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  # Refresh compiled Stream pipeline after service-release template changes.
  parameters:
    SERVICE: nextgen-dashboard
    BUNDLE: nextgen-dashboard
    DISPLAY_NAME: nextgen-dashboard
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
