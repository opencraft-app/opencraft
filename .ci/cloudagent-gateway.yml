version: v2.0
name: 构建 cloudagent-gateway

on:
  push:
    branches:
      - master
    paths:
      - cloudagent/gateway/**
      - cloudagent/sandbox-host/**
      - argocd/services/cloudagent-gateway/**
      - argocd/apps/*/cloudagent-gateway.yaml
      - argocd/secrets/*/cloudagent-gateway-runtime-secrets.sops.yaml
      - argocd/secrets/*/cloudagent-wsa-search-secrets.sops.yaml
      - argocd/secrets/*/cloudagent-wisp-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-cloudagent-gateway
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: cloudagent-gateway
    BUNDLE: cloudagent-gateway
    DISPLAY_NAME: cloudagent-gateway
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: devcloud-dep,shprod
    MASTER_AUTO_PIN_ENVS: devcloud-dep
    PLAYGROUND_BUILD_ENVS: none
    PLAYGROUND_AUTO_PIN_ENVS: none
    PROD_REVIEWERS: '["skipzhang", "roberttwang", "cocofhu"]'
