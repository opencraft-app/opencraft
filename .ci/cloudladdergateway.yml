version: v2.0
name: 构建 cloudladdergateway

on:
  push:
    branches:
      - master
    paths:
      - cloudladdergateway/**
      - shared/cloudladdertransport/**
      - argocd/services/cloudladdergateway/**
      - argocd/apps/*/cloudladdergateway.yaml
      - argocd/secrets/*/cloudladdergateway-runtime-secrets.sops.yaml
      - argocd/secrets/*/cloudladdergateway-callback-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-cloudladdergateway
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  parameters:
    SERVICE: cloudladdergateway
    BUNDLE: cloudladdergateway
    DISPLAY_NAME: cloudladdergateway
    DEFAULT_TARGET_ENV: tkexgz
    MASTER_BUILD_ENVS: tkexgz,tkexsg
    MASTER_AUTO_PIN_ENVS: tkexgz,tkexsg
    ENABLE_MASTER_PROD_PROMOTE: false
    PLAYGROUND_BUILD_ENVS: none
    PLAYGROUND_AUTO_PIN_ENVS: none
