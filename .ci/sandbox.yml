version: v2.0
name: 构建 sandbox

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - sandbox/**
      - argocd/services/sandbox/**
      - argocd/apps/beijing-sandbox/sandbox-family-appset.yaml
      - argocd/catalogs/sandbox/*/sandbox.yaml
      - argocd/secrets/*/sandbox-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template: .ci/templates/service-release.yml
  parameters:
    SERVICE: sandbox
    BUNDLE: sandbox
    DISPLAY_NAME: sandbox
    DEFAULT_TARGET_ENV: beijing-sandbox-2
    MASTER_BUILD_ENVS: beijing-sandbox
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    PLAYGROUND_BUILD_ENVS: beijing-sandbox-2
    PLAYGROUND_AUTO_PIN_ENVS: beijing-sandbox-2
