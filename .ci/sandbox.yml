version: v2.0
name: 构建 sandbox

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
      - playground/sandbox-kr-*
    paths:
      - sandbox/**
      - argocd/services/sandbox/**
      - argocd/apps/beijing-sandbox/sandbox-family-appset.yaml
      - argocd/catalogs/sandbox/*/sandbox.yaml
      - argocd/secrets/*/sandbox-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-sandbox
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  # Refresh compiled Stream pipeline after service-release template changes.
  parameters:
    SERVICE: sandbox
    BUNDLE: sandbox
    DISPLAY_NAME: sandbox
    DEFAULT_TARGET_ENV: beijing-sandbox-2
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    ENABLE_MASTER_PROD_DB_MIGRATION: true
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
