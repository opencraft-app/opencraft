version: v2.0
name: 生产 DB migration

# Stream snapshots the checkout revision when this YAML definition is imported.
# Keep this entrypoint versioned with runtime DB-runner additions (including Trade)
# so manual and sub-pipeline builds execute the matching runtime implementation.

on:
  manual: enabled

concurrency:
  group: mono2-prod-db-migration
  cancel-in-progress: false
  queue-length: 1
  queue-timeout-minutes: 480

extends:
  template: db-migration.yml
