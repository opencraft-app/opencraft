version: v2.0
name: release-lightclaw-auth

on:
  push:
    branches: [ master ]
    paths:
      - user/auth/**
      - scripts/build-release-image.py
      - scripts/resolve_release_bundle.py
      - scripts/release-bundles.yaml
      - scripts/update_image_pin.py
      - scripts/pin_image_to_gitops.sh
      - scripts/promote_bundle_image_to_gitops.sh
  manual: enabled

variables:
  TARGET_ENV:
    value: shprod
    readonly: false
    allow-modify-at-startup: true
  SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

jobs:
  release:
    runs-on:
      self-hosted: true
      pool-name: env
    steps:
      - checkout: self
        with:
          fetchDepth: 50
      - id: prepare
        if: ${{ ci.event }} == 'push'
        shell: bash
        run: |
          SHORT_SHA="${{ ci.sha }}"
          SHORT_SHA="${SHORT_SHA:0:12}"
          echo "::set-output name=tag::user-auth-${SHORT_SHA}"
      - name: build-beijing
        if: ${{ ci.event }} == 'push'
        uses: DockerBuildAndPushImage@3.*
        with:
          targetTicketId: ${{ settings.TCR_BEIJING_SANDBOX_TICKET }}
          targetImage: lightclaw-bj8.tencentcloudcr.com/lightclaw/lightclaw-auth
          targetImageTag: ${{ steps.prepare.outputs.tag }}
          dockerBuildDir: ./user/auth
          dockerFilePath: ./user/auth/Dockerfile
      - name: build-shprod
        if: ${{ ci.event }} == 'push'
        uses: DockerBuildAndPushImage@3.*
        with:
          targetTicketId: ${{ settings.TCR_SHPROD_TICKET }}
          targetImage: lightclaw-shprod.tencentcloudcr.com/lightclaw/lightclaw-auth
          targetImageTag: ${{ steps.prepare.outputs.tag }}
          dockerBuildDir: ./user/auth
          dockerFilePath: ./user/auth/Dockerfile
      - name: promote-beijing
        if: ${{ ci.event }} == 'push'
        shell: bash
        run: |
          REMOTE_URL="git@git.woa.com:wisp/mono2.git" \
          GITOPS_BRANCH=gitops \
          bash scripts/pin_image_to_gitops.sh "lightclaw-auth" "beijing-sandbox" "lightclaw-bj8.tencentcloudcr.com/lightclaw/lightclaw-auth:${{ steps.prepare.outputs.tag }}"
      - name: promote-manual
        if: ${{ ci.event }} == 'manual'
        shell: bash
        run: |
          test -n "${{ variables.SOURCE_SHA }}"
          REMOTE_URL="git@git.woa.com:wisp/mono2.git" \
          GITOPS_BRANCH=gitops \
          bash scripts/promote_bundle_image_to_gitops.sh user-auth lightclaw-auth "${{ variables.TARGET_ENV }}" "${{ variables.SOURCE_SHA }}"
