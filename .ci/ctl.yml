version: v2.0
name: 构建 ctl

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-*
      - playground/sandbox-kr-*
    paths:
      - ctl/**
      - argocd/services/ctl/**
      - argocd/apps/*/ctl.yaml
      - argocd/secrets/*/ctl-conf-common.sops.yaml
      - argocd/secrets/*/ctl-conf-rewrite.sops.yaml
      - argocd/secrets/*/ctl-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-service-release-ctl
  cancel-in-progress: false
  queue-length: 20
  queue-timeout-minutes: 480

extends:
  template: service-release.yml
  # Refresh compiled Stream pipeline after service-release template changes.
  parameters:
    SERVICE: ctl
    BUNDLE: ctl
    DISPLAY_NAME: ctl
    DEFAULT_TARGET_ENV: shprod
    MASTER_BUILD_ENVS: beijing-sandbox,shprod,sgprod
    MASTER_AUTO_PIN_ENVS: beijing-sandbox
    ENABLE_MASTER_PROD_DB_MIGRATION: true
    PLAYGROUND_BUILD_ENVS: auto
    PLAYGROUND_AUTO_PIN_ENVS: auto
