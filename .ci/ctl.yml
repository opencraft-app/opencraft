version: v2.0
name: 构建 ctl

on:
  push:
    branches:
      - master
      - playground/sandbox-bj-2
    paths:
      - ctl/**
      - argocd/services/ctl/**
      - argocd/apps/*/ctl.yaml
      - argocd/secrets/*/ctl-conf-common.sops.yaml
      - argocd/secrets/*/ctl-conf-rewrite.sops.yaml
      - argocd/secrets/*/ctl-runtime-secrets.sops.yaml
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

extends:
  template:
    path: .ci/templates/service-release.yml
    variables:
      SERVICE: ctl
      BUNDLE: ctl
      DISPLAY_NAME: ctl
