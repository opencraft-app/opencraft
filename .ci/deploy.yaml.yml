version: v2.0
on:
  push: [ master ]
  mr: [ master ]

variables:
  IMAGE_URL: mirrors.tencent.com/ci/tlinux3_ci
  IMAGE_TAG: latest

runs-on:
  self-hosted: true
  pool-name: env
 
steps:
- checkout: self
- uses: DockerBuildAndPushImage@3.*
  with:
    # MIRROS_PUBLIC 为凭据服务下创建的 username + password 类型的凭据 Key，如何创建凭据：https://iwiki.woa.com/x/cMS4Lw
    targetTicketId: MIRROS_PUBLIC
    targetImage: ${{ variables.IMAGE_URL }}
    targetImageTag: ${{ variables.IMAGE_TAG }}
    dockerBuildDir: ./
    dockerFilePath: ./tlinux3.Dockerfile
notices:
- type: wework-message
