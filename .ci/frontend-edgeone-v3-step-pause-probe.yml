version: v3.0
name: BK-CI frontend EdgeOne V3 分支暂停探针

on:
  repo-name: wisp/mono2
  type: git
  push:
    branches:
      - master
    paths:
      - ci-probes/frontend-edgeone-v3-step-pause-probe.trigger
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

stages:
  - name: 0 打印 frontend EdgeOne V3 暂停探针上下文
    jobs:
      context:
        name: 打印 V3 暂停探针上下文
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
          - name: 打印上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "说明：本探针只验证 v3 step pause 能否保存和触发。"
              echo "不会调用 frontend EdgeOne 正式发布脚本，也不会启动正式发布流水线。"

  - name: 1 验证 frontend EdgeOne 国内国际分支可独立暂停
    jobs:
      plan:
        name: 生成 V3 暂停探针计划
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
          - name: 打印探针计划
            shell: bash
            run: |
              echo "fan-out jobs:"
              echo "  - cn: 验证国内分支 step pause"
              echo "  - intl: 验证国际分支 step pause"
              echo "预期：cn / intl 两个 job 在各自 run step 前分别暂停，可独立继续。"

      cn:
        name: V3 探针国内 EdgeOne 分支暂停
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
          - name: 暂停后继续国内分支
            shell: bash
            can-pause-before-run: true
            pause-notice-receivers:
              - skipzhang
            run: |
              echo "cn branch resumed"
              echo "probe_only=true"

      intl:
        name: V3 探针国际 EdgeOne 分支暂停
        depend-on:
          - plan
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
          - name: 暂停后继续国际分支
            shell: bash
            can-pause-before-run: true
            pause-notice-receivers:
              - skipzhang
            run: |
              echo "intl branch resumed"
              echo "probe_only=true"
