version: v2.0
name: BK-CI frontend EdgeOne 编排 DAG 探针

on:
  push:
    branches:
      - master
    paths:
      - ci-probes/frontend-edgeone-orchestrator-probe.trigger
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-frontend-edgeone-orchestrator-probe
  cancel-in-progress: false
  queue-length: 5
  queue-timeout-minutes: 120

variables:
  PROBE_ARTIFACT_SOURCE_SHA:
    value: ""
    readonly: false
    allow-modify-at-startup: true

stages:
  - name: 0 打印 frontend EdgeOne 编排探针上下文
    jobs:
      context:
        name: 打印探针上下文
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印上下文
            shell: bash
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              echo "variables.PROBE_ARTIFACT_SOURCE_SHA=${{ variables.PROBE_ARTIFACT_SOURCE_SHA }}"
              echo "说明：本探针验证 frontend EdgeOne 编排 DAG 的 SubPipelineExecStream fan-out。"
              echo "只调用 harmless child probe，不启动正式发布候选流水线。"

  - name: 1 fan-out 验证 frontend EdgeOne 发布候选调用
    jobs:
      plan:
        name: 生成 frontend EdgeOne 编排探针计划
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 打印调用计划
            shell: bash
            run: |
              SOURCE_SHA="${{ variables.PROBE_ARTIFACT_SOURCE_SHA }}"
              if [[ -z "$SOURCE_SHA" ]]; then
                SOURCE_SHA="${{ ci.sha }}"
              fi
              echo "source_sha=$SOURCE_SHA"
              echo "fan-out jobs:"
              echo "  - cn: 调用国内分支 harmless child probe"
              echo "  - intl: 调用国际分支 harmless child probe"

      cn:
        name: 探针国内 EdgeOne 发布候选调用
        depend-on:
          - plan
        steps:
          - name: 探针国内 EdgeOne 发布候选调用
            uses: "SubPipelineExecStream@1.*"
            with:
              repositoryType: "URL"
              repositoryFromUrl: "https://git.woa.com/wisp/mono2.git"
              targetBranchFromUrl: "master"
              targetPathFromUrl: ".ci/frontend-edgeone-subpipeline-child-probe.yml"
              buildInfo: ""
              paramsInput:
                - key: "PROBE_TARGET"
                  value: "cn"
                - key: "PROBE_ARTIFACT_SOURCE_SHA"
                  value: "${{ variables.PROBE_ARTIFACT_SOURCE_SHA }}"

      intl:
        name: 探针国际 EdgeOne 发布候选调用
        depend-on:
          - plan
        steps:
          - name: 探针国际 EdgeOne 发布候选调用
            uses: "SubPipelineExecStream@1.*"
            with:
              repositoryType: "URL"
              repositoryFromUrl: "https://git.woa.com/wisp/mono2.git"
              targetBranchFromUrl: "master"
              targetPathFromUrl: ".ci/frontend-edgeone-subpipeline-child-probe.yml"
              buildInfo: ""
              paramsInput:
                - key: "PROBE_TARGET"
                  value: "intl"
                - key: "PROBE_ARTIFACT_SOURCE_SHA"
                  value: "${{ variables.PROBE_ARTIFACT_SOURCE_SHA }}"
