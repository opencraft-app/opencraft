version: v2.0
name: MR 占位检查

on:
  mr:
    target-branches: [ master ]
    action: [ open, reopen, push-update ]
    report-commit-check: true
    block-mr: true
  manual: enabled

concurrency:
  group: mr-placeholder-${{ ci.branch }}
  cancel-in-progress: true
  queue-length: 1
  queue-timeout-minutes: 60

stages:
  - name: MR 占位检查
    jobs:
      changed_guards:
        name: 运行变更目录约束
        runs-on:
          self-hosted: true
          pool-name: env
        steps:
          - name: 修复复用工作区 Git index
            shell: bash
            run: |
              if [[ ! -d .git ]]; then
                exit 0
              fi

              status_log="$(mktemp)"
              index_needs_repair=false
              if [[ -f .git/index ]]; then
                index_size="$(wc -c < .git/index | tr -d '[:space:]')"
                if [[ "$index_size" =~ ^[0-9]+$ && "$index_size" -eq 0 ]]; then
                  index_needs_repair=true
                  echo "detected empty .git/index size: ${index_size} bytes"
                fi
              fi

              if [[ "$index_needs_repair" != true ]] && git status --short >/dev/null 2>"$status_log"; then
                rm -f "$status_log"
                exit 0
              fi

              if [[ "$index_needs_repair" == true ]] || grep -Eq 'index file smaller than expected|bad index file|index file corrupt' "$status_log"; then
                echo "repairing corrupt Git index before checkout"
                ts="$(date +%Y%m%dT%H%M%S)"
                mv .git/index ".git/index.corrupt.${ts}" 2>/dev/null || true
                if git rev-parse --verify HEAD >/dev/null 2>&1 && git reset --mixed HEAD; then
                  rm -f "$status_log" ".git/index.corrupt.${ts}"
                  exit 0
                fi
                echo "index repair failed; removing .git to force a fresh checkout"
                rm -rf .git
              fi
              rm -f "$status_log"
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 50
          - name: 校验并修复 MR checkout
            shell: bash
            env:
              GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
            run: |
              CI_EXPECTED_BRANCH='${{ ci.branch }}'
              CI_EXPECTED_SHA='${{ ci.sha }}'
              if [[ -z "$CI_EXPECTED_SHA" || "$CI_EXPECTED_SHA" == *'${{'* ]]; then
                CI_EXPECTED_SHA="${BK_CI_GIT_HEAD_COMMITS%%,*}"
              fi
              if [[ -z "$CI_EXPECTED_BRANCH" || "$CI_EXPECTED_BRANCH" == *'${{'* ]]; then
                echo "无法解析 MR 期望分支，拒绝在未知 checkout 上继续。" >&2
                exit 1
              fi
              if [[ ! "$CI_EXPECTED_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "无法解析 MR 期望提交：${CI_EXPECTED_SHA}" >&2
                exit 1
              fi

              source .ci/init.sh
              ci_git_fetch_origin master "$CI_EXPECTED_BRANCH"
              if ! git cat-file -e "${CI_EXPECTED_SHA}^{commit}"; then
                echo "MR 期望提交不存在：${CI_EXPECTED_SHA}" >&2
                exit 1
              fi

              CI_ACTUAL_SHA="$(git rev-parse HEAD)"
              if [[ "$CI_ACTUAL_SHA" != "$CI_EXPECTED_SHA" ]]; then
                echo "检测到复用工作区 checkout 串分支：actual=${CI_ACTUAL_SHA} expected=${CI_EXPECTED_SHA}"
                git reset --hard "$CI_EXPECTED_SHA"
                git clean -ffd
              fi
              test "$(git rev-parse HEAD)" = "$CI_EXPECTED_SHA"
          - name: 派发变更目录约束
            shell: bash
            env:
              GIT_WOA_PRIVATE_TOKEN: ${{ settings.GIT_WOA_PRIVATE_TOKEN }}
            run: |
              echo "ci.event=${{ ci.event }}"
              echo "ci.branch=${{ ci.branch }}"
              echo "ci.sha=${{ ci.sha }}"
              source .ci/init.sh
              ci_git_fetch_origin master

              CHANGED_FILES_FILE="$(mktemp)"
              if git diff --name-only origin/master...HEAD > "$CHANGED_FILES_FILE"; then
                echo "变更目录约束：使用 origin/master...HEAD 计算 MR 变更文件"
              elif git diff --name-only origin/master..HEAD > "$CHANGED_FILES_FILE"; then
                echo "变更目录约束：fallback 使用 origin/master..HEAD 计算 MR 变更文件"
              else
                echo "变更目录约束：无法计算 MR 变更文件" >&2
                exit 1
              fi
              echo "变更目录约束：MR 变更文件清单"
              sed 's/^/  - /' "$CHANGED_FILES_FILE"

              CI_RUNTIME_DIR="$(mktemp -d)"
              mkdir -p "${CI_RUNTIME_DIR}/.ci"
              git show origin/master:.ci/init.sh > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              export CI_RUNTIME_REF="origin/master"
              export CI_RUNTIME_COMMIT="$(git rev-parse "${CI_RUNTIME_REF}")"
              echo "MR 占位检查 runtime：CI_RUNTIME_REF=${CI_RUNTIME_REF} CI_RUNTIME_COMMIT=${CI_RUNTIME_COMMIT}"
              git show "${CI_RUNTIME_COMMIT}:.ci/init.sh" > "${CI_RUNTIME_DIR}/.ci/init.sh"
              source "${CI_RUNTIME_DIR}/.ci/init.sh"
              ci_materialize_runtime_manifest "${CI_RUNTIME_DIR}" ".ci/runtime/materialize-files.txt"

              python3 "${CI_RUNTIME_DIR}/.ci/runtime/commands/run_changed_guards.py" \
                --repo-root "$PWD" \
                --base-ref origin/master \
                --head-ref HEAD \
                --trusted-ref origin/master \
                --changed-files-file "$CHANGED_FILES_FILE" || {
                  TRUSTED_GUARD_EXIT="$?"
                  echo "============================================================"
                  echo "变更目录约束：trusted guard 失败，检查是否允许 .ci 自修复 fallback"
                  echo "trusted guard exit_code=${TRUSTED_GUARD_EXIT}"
                  echo "fallback 条件：所有变更必须位于 .ci/**，且当前分支存在 .ci/checks/guard.sh"
                  echo "============================================================"

                  if grep -Ev '^\s*$|^\.ci(/|$)' "$CHANGED_FILES_FILE"; then
                    echo "变更目录约束：存在非 .ci/** 变更，禁止 fallback，保持失败。" >&2
                    exit "$TRUSTED_GUARD_EXIT"
                  fi
                  if [[ ! -f .ci/checks/guard.sh ]]; then
                    echo "变更目录约束：当前分支缺少 .ci/checks/guard.sh，禁止 fallback。" >&2
                    exit "$TRUSTED_GUARD_EXIT"
                  fi

                  echo "变更目录约束：进入 .ci 自修复 fallback，执行当前分支 .ci/checks/guard.sh"
                  GUARD_NAME="ci-runtime-candidate" \
                  GUARD_REPO_ROOT="$PWD" \
                  GUARD_CHANGED_FILES_FILE="$CHANGED_FILES_FILE" \
                  GUARD_BASE_REF="origin/master" \
                  GUARD_HEAD_REF="HEAD" \
                  bash .ci/checks/guard.sh
                  echo "变更目录约束：.ci 自修复 fallback 通过"
                }
