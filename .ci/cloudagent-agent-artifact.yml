version: v2.0
name: 构建并发布 CloudAgent Runtime Artifacts

on:
  push:
    branches:
      - master
    paths:
      - cloudagent/research/hermes-rs/**
      - cloudagent/agent-loader/**
      - cloudagent/wisp/**
      - cloudagent/gateway/build/cloudagent-sidecar/**
      - cloudagent/gateway/scripts/ci_signupload_cloudagent_sidecar_shanghai.sh
      - cloudagent/gateway/scripts/ci_publish_cloudagent_artifacts_shanghai.sh
      - cloudagent/gateway/scripts/publish_cloudagent_wisp_package.sh
      - cloudagent/gateway/scripts/signupload_cloudagent_sidecar.sh
      - cloudagent/gateway/scripts/lib/**
      - cloudagent/gateway/Makefile
    paths-ignore:
      - OWNERS
      - "**/OWNERS"
  manual: enabled

concurrency:
  group: mono2-cloudagent-runtime-artifacts-shanghai
  cancel-in-progress: false
  queue-length: 3
  queue-timeout-minutes: 480

stages:
  - name: 构建并发布 Runtime Artifacts
    jobs:
      build:
        name: 构建 Agent + Wisp、签名并上传上海 COS
        runs-on:
          self-hosted: true
          pool-name: env
        env:
          CLOUDAGENT_AGENT_COS_SECRET_ID: ${{ settings.CLOUDAGENT_AGENT_COS_SECRET_ID }}
          CLOUDAGENT_AGENT_COS_SECRET_KEY: ${{ settings.CLOUDAGENT_AGENT_COS_SECRET_KEY }}
          CLOUDAGENT_AGENT_RELEASE_ED25519_SEED_B64: ${{ settings.CLOUDAGENT_AGENT_RELEASE_ED25519_SEED_B64 }}
        steps:
          - checkout: self
            name: 拉取代码
            with:
              fetchDepth: 1
          - name: 构建、签名并上传到上海 COS
            shell: bash
            run: |
              set -euo pipefail
              source .ci/init.sh
              ci_init_repo_root
              ci_require_commands bash docker make python3 curl shasum

              export CLOUDAGENT_AGENT_COS_BUCKET="${CLOUDAGENT_AGENT_COS_BUCKET:-cloudagent-sidecar-shanghai-1388575217}"
              export CLOUDAGENT_AGENT_COS_REGION="${CLOUDAGENT_AGENT_COS_REGION:-ap-shanghai}"
              export CLOUDAGENT_AGENT_COS_OBJECT_PREFIX="${CLOUDAGENT_AGENT_COS_OBJECT_PREFIX:-/agent-sidecar/releases}"
              export CLOUDAGENT_AGENT_VERSION_PREFIX="${CLOUDAGENT_AGENT_VERSION_PREFIX:-cloudagent.v1}"
              export CLOUDAGENT_WISP_COS_OBJECT_PREFIX="${CLOUDAGENT_WISP_COS_OBJECT_PREFIX:-/workspace/releases}"
              export CLOUDAGENT_WORKSPACE_VERSION_PREFIX="${CLOUDAGENT_WORKSPACE_VERSION_PREFIX:-wisp.v1}"
              export DOCKER_BUILDKIT=1

              cloudagent/gateway/scripts/ci_publish_cloudagent_artifacts_shanghai.sh
