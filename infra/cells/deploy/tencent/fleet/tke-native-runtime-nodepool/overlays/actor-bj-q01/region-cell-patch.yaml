apiVersion: node.tke.cloud.tencent.com/v1beta1
kind: MachineSet
metadata:
  name: np-runtime0
spec:
  displayName: actor-bj-q01-compute-native
  replicas: 3
  # A serverless pool must not bind scale-out to one transient AZ/SKU stock
  # pool. Keep identical 4-vCPU/8-GiB fallbacks in reviewed preference order.
  instanceTypes: [SA9.LARGE8, SA9e.LARGE8, SA5.LARGE8, S9.LARGE8]
  subnetIDs: [subnet-qljvksy9, subnet-k1rounhb, subnet-kx0feejb]
  scaling:
    createPolicy: ZoneEquality
    minReplicas: 3
    # HPA stops at 30 Hosts. The 31st Machine is reserved exclusively for one
    # exact repair surge and never represents Actor placement demand.
    maxReplicas: 31
  template:
    metadata:
      annotations:
        node.tke.cloud.tencent.com/machine-cloud-tags: '[{"tagKey":"cell","tagValue":"actor-bj-q01"}]'
    spec:
      displayName: actor-bj-q01-compute-native-worker
      taints:
        - key: rivet.dev/compute
          value: "true"
          effect: NoSchedule
        - key: fleet.actor.dev/runtime-admission
          value: pending
          effect: NoSchedule
      metadata:
        labels:
          fleet.actor.dev/cell: actor-bj-q01
          fleet.actor.dev/cell-name: actor-bj-q01
      providerSpec:
        value:
          keyIDs: [skey-g2mcgx6l]
          securityGroupIDs: [sg-6m67d62b]
