apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-cell-control
rules:
  - apiGroups: ["fleet.actor.dev"]
    resources: ["rivetcellprofiles", "shardclasses"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-cell-control
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-cell-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-cell-control
  namespace: actor-fdb-cell-system
rules:
  - apiGroups: ["fleet.actor.dev"]
    resources: ["rivetcells"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-cell-control
  namespace: actor-fdb-cell-system
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-cell-control
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-cell-control
  namespace: fdb-operator-actor-fleet-controller-system
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fleet.actor.dev"]
    resources: ["rivetcells"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-cell-control
  namespace: fdb-operator-actor-fleet-controller-system
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-cell-control
---
# Argo's cache evaluates every included namespaced kind in every namespace on
# the cluster Secret. This release-namespace grant is deliberately read-only;
# mutation remains owned by argocd-runtime-release.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-cell-control-cache
  namespace: actor-release-system
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["fleet.actor.dev"]
    resources: ["rivetcells"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-cell-control-cache
  namespace: actor-release-system
subjects:
  - kind: ServiceAccount
    name: argocd-application-controller
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-cell-control-cache
---
# A cloud FDB autoscaling qualification has to perturb the Argo-owned
# autoscaling policy long enough to exercise the real planner.  This account
# can only re-enable self-heal on the exact q01 control Application.  It cannot
# read Secrets, edit the Cell/FDB, delete resources, or broaden its own RBAC.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: actor-fdb-autoscaling-recovery
  namespace: argocd
automountServiceAccountToken: true
imagePullSecrets:
  - name: actor-fleet-tcr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actor-fdb-autoscaling-recovery
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["applications"]
    resourceNames: ["actor-cell-control-q01"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actor-fdb-autoscaling-recovery
  namespace: argocd
subjects:
  - kind: ServiceAccount
    name: actor-fdb-autoscaling-recovery
    namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: actor-fdb-autoscaling-recovery
