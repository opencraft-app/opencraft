apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: e2e-actor-fleet-controller-system
namePrefix: e2e-
resources:
  - ../controller
images:
  - name: ghcr.io/skipzhang/actor-fleet-controller
    newName: actor-fleet-controller
    newTag: e2e
patches:
  - target:
      kind: Deployment
      name: actor-fleet-controller
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Never
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: e2e-actor-fleet-controller-system
  - target:
      kind: RoleBinding
      name: actor-fleet-controller-leader-election
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: e2e-actor-fleet-controller
      - op: replace
        path: /subjects/0/namespace
        value: e2e-actor-fleet-controller-system
  - target:
      kind: ClusterRoleBinding
      name: actor-fleet-controller
    patch: |-
      - op: replace
        path: /subjects/0/name
        value: e2e-actor-fleet-controller
      - op: replace
        path: /subjects/0/namespace
        value: e2e-actor-fleet-controller-system
