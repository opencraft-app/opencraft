apiVersion: v1
kind: Service
metadata:
  name: actor-fleet-controller-metrics
  labels:
    app.kubernetes.io/name: actor-fleet-controller
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "8080"
spec:
  selector:
    app.kubernetes.io/name: actor-fleet-controller
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
