                      type: integer
                      minimum: 0
                    pendingReservations:
                      type: integer
                      minimum: 0
                    activeWriters:
                      type: integer
                      minimum: 0
                    inFlightCommits:
                      type: integer
                      minimum: 0
                    migrationBacklog:
                      type: integer
                      minimum: 0
                    compactionBacklog:
                      type: integer
                      minimum: 0
                    gcBacklog:
                      type: integer
                      minimum: 0
                    reconciliationBacklog:
                      type: integer
                      minimum: 0
                    fdbStorageHeadroomBytes:
                      type: integer
                      minimum: 0
                    fdbLogicalBytes:
                      type: integer
                      minimum: 0
                    fdbStorageHeadroomETAKnown:
