                mobilityPolicy:
                  type: string
                  enum: [DriverControlled]
                retirementPolicy:
                  type: string
                  enum: [ProofRequired]
      additionalPrinterColumns:
        - name: ABI
          type: string
          jsonPath: .spec.driverABI
        - name: Profile
          type: string
          jsonPath: .spec.profileRef.name
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rivetcells.fleet.actor.dev
spec:
  group: fleet.actor.dev
  scope: Namespaced
  names:
    plural: rivetcells
    singular: rivetcell
    kind: RivetCell
    shortNames: [rc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [cellId, className, region, managementCluster, desiredState, foundationDB, cos, retirement]
              x-kubernetes-validations:
                - rule: "self.cellId == oldSelf.cellId && self.className == oldSelf.className && self.region == oldSelf.region && self.managementCluster == oldSelf.managementCluster"
                  message: "Cell identity, class, region and management cluster are immutable"
                - rule: "!has(oldSelf.claimRef) || self.claimRef == oldSelf.claimRef"
                  message: "a bound Cell claim is immutable"
                - rule: "self.cos == oldSelf.cos"
                  message: "Cell COS domain identity is immutable"
                - rule: "self.retirement.generation >= oldSelf.retirement.generation"
                  message: "retirement generation cannot decrease"
              properties:
                cellId:
                  type: string
                  pattern: '^actor-[a-z0-9]+-[a-z][0-9]{2}$'
                className:
                  type: string
                region:
                  type: string
                  pattern: '^[a-z][a-z0-9-]+$'
                managementCluster:
                  type: string
                claimRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name:
                      type: string
                    uid:
                      type: string
                desiredState:
                  type: string
                  enum: [Provisioning, Qualifying, Ready, Draining, Frozen, Retired]
                foundationDB:
                  type: object
                  required: [exclusive]
                  x-kubernetes-validations:
                    - rule: "!has(oldSelf.clusterIdentityHash) || self.clusterIdentityHash == oldSelf.clusterIdentityHash"
                      message: "an observed FDB cluster identity is immutable"
                    - rule: "(has(self.nodeRefs) && !has(self.clusterRef)) || (!has(self.nodeRefs) && has(self.clusterRef))"
                      message: "a Cell must bind either native FDB nodes or one FoundationDBCluster, never both"
                    - rule: "!has(oldSelf.clusterRef) || has(self.clusterRef)"
                      message: "a FoundationDBCluster binding cannot be removed or changed back to native nodes"
                  properties:
                    exclusive:
                      type: boolean
                      enum: [true]
                    clusterIdentityHash:
                      type: string
                      pattern: '^sha256:[0-9a-f]{64}$'
                    nodeRefs:
                      type: array
                      maxItems: 128
                      x-kubernetes-list-type: map
                      x-kubernetes-list-map-keys: [instanceId]
                      items:
                        type: object
                        required: [instanceId, zone]
                        properties:
                          instanceId:
                            type: string
                            pattern: '^ins-[a-z0-9]+$'
                          zone:
                            type: string
                            minLength: 1
                          privateIp:
                            type: string
                            format: ipv4
                    clusterRef:
                      type: object
                      required: [name, namespace]
                      x-kubernetes-validations:
                        - rule: "!has(oldSelf.uid) || (has(self.uid) && self.uid == oldSelf.uid)"
                          message: "a bound FoundationDBCluster UID is immutable"
                      properties:
                        name:
                          type: string
                          minLength: 1
                          maxLength: 220
                          x-kubernetes-validations:
                            - rule: "self == oldSelf"
                              message: "the FoundationDBCluster name is immutable"
                        namespace:
                          type: string
                          minLength: 1
                          maxLength: 63
                          x-kubernetes-validations:
                            - rule: "self == oldSelf"
                              message: "the FoundationDBCluster namespace is immutable"
                        uid:
                          type: string
                          minLength: 1
                          maxLength: 128
                cos:
                  type: object
                  required: [coldBucket, backupBucket]
                  properties:
                    coldBucket:
                      type: string
                    backupBucket:
                      type: string
                retirement:
                  type: object
                  required: [generation, proofRequired, rollbackRetentionSeconds]
                  properties:
                    generation:
                      type: integer
                      minimum: 1
                    requestId:
                      type: string
                      minLength: 1
                      maxLength: 128
                    proofRequired:
                      type: boolean
                      enum: [true]
                    rollbackRetentionSeconds:
                      type: integer
                      minimum: 3600
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                phase:
                  type: string
                  enum: [Unknown, Provisioning, NonConforming, Qualifying, Ready, Draining, Frozen, Retired, Failed]
                readyForPlacement:
                  type: boolean
                placementCount:
                  type: integer
                  minimum: 0
                pendingReservations:
                  type: integer
                  minimum: 0
                activeWriters:
                  type: integer
                  minimum: 0
                inFlightCommits:
                  type: integer
                  minimum: 0
                migrationBacklog:
                  type: integer
                  minimum: 0
                compactionBacklog:
                  type: integer
                  minimum: 0
                gcBacklog:
                  type: integer
                  minimum: 0
                reconciliationBacklog:
                  type: integer
                  minimum: 0
                scaleInEvidenceReady:
                  type: boolean
                placementUtilizationPercent:
                  type: integer
                  minimum: 0
                  maximum: 100
                runtimeUtilizationPercent:
                  type: integer
                  minimum: 0
                  maximum: 100
                fdbWriteUtilizationPercent:
                  type: integer
                  minimum: 0
                  maximum: 100
                spokeCellRef:
                  type: object
                  properties:
                    uid:
                      type: string
                    observedGeneration:
                      type: integer
                      minimum: 1
                reportObservedAt:
                  type: string
                  format: date-time
                profileDigest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                capacityRisk:
                  type: string
                  enum: [Unknown, Normal, AdmissionClosed, Protect, Emergency]
                scaleOutEpoch:
                  type: integer
                  minimum: 0
                retirementProofVerified:
                  type: boolean
                retirementProofReady:
                  type: boolean
                fdbOperatorReady:
                  type: boolean
                foundationDBAutoscaling:
                  type: object
                  required:
                    - mode
                    - phase
                    - desiredProcessCount
                    - recommendedProcessCount
                    - observedProcessCount
                    - reason
                    - volumeRetentionSeconds
                    - volumeGCMode
                  properties:
                    mode:
                      type: string
                      enum: [Disabled, ObserveOnly, Automatic]
                    phase:
                      type: string
                      enum: [Disabled, InsufficientData, Blocked, Stable, ScaleUpRecommended, ScaleDownRecommended, ScalingUp, ScalingDown]
                    desiredProcessCount:
                      type: integer
                      minimum: 1
                    recommendedProcessCount:
                      type: integer
                      minimum: 1
                    observedProcessCount:
                      type: integer
                      minimum: 0
                    scaleUpSignalSince:
                      type: string
                      format: date-time
                    scaleDownSignalSince:
                      type: string
                      format: date-time
                    lastScaleTime:
                      type: string
                      format: date-time
                    lastScaleDirection:
                      type: string
                      enum: [Up, Down]
                    reason:
                      type: string
                    volumeRetentionSeconds:
                      type: integer
                      minimum: 86400
                    volumeGCMode:
                      type: string
                      enum: [ObserveOnly, Automatic]
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                      lastTransitionTime:
                        type: string
                        format: date-time
      additionalPrinterColumns:
        - name: Cell
          type: string
          jsonPath: .spec.cellId
        - name: Desired
          type: string
          jsonPath: .spec.desiredState
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: boolean
          jsonPath: .status.readyForPlacement
        - name: Actors
          type: integer
          jsonPath: .status.placementCount
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shardpools.fleet.actor.dev
spec:
  group: fleet.actor.dev
  scope: Namespaced
  names:
    plural: shardpools
    singular: shardpool
    kind: ShardPool
    shortNames: [sp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [className, minCells, maxCells, maxConcurrentCellProvisioning, placement, routing, reservation, rebalance]
              x-kubernetes-validations:
                - rule: "self.minCells <= self.maxCells"
                  message: "minCells must not exceed maxCells"
              properties:
                className:
                  type: string
                minCells:
                  type: integer
                  minimum: 2
                maxCells:
                  type: integer
                  minimum: 2
                  maximum: 1000
                maxConcurrentCellProvisioning:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: Global Pool credit for Claims whose target Cell has not yet materialized and bound.
                placement:
                  type: object
                  required: [region, managementClusters]
                  properties:
                    region:
                      type: string
                      pattern: '^[a-z][a-z0-9-]+$'
                    managementClusters:
                      type: array
                      minItems: 1
                      x-kubernetes-list-type: set
                      items:
                        type: string
                routing:
                  type: object
                  required: [strategy, exactExceptionDirectory, perActorKubernetesObjects]
                  properties:
                    strategy:
                      type: string
                      enum: [route-hinted-v1]
                    exactExceptionDirectory:
                      type: string
                      enum: [versioned-exact-v1]
                    perActorKubernetesObjects:
                      type: boolean
                      enum: [false]
                reservation:
                  type: object
                  required: [mode, maxPendingPerCell, ttlSeconds]
                  properties:
                    mode:
                      type: string
                      enum: [CAS]
                    maxPendingPerCell:
                      type: integer
                      minimum: 1
                    ttlSeconds:
                      type: integer
                      minimum: 5
                      maximum: 300
                rebalance:
                  type: object
                  required: [onScaleOut, migrationBatchSize]
                  properties:
                    onScaleOut:
                      type: string
