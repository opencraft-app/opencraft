apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: rivetcellprofiles.fleet.actor.dev
spec:
  group: fleet.actor.dev
  scope: Cluster
  names:
    plural: rivetcellprofiles
    singular: rivetcellprofile
    kind: RivetCellProfile
    shortNames: [rcp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [driverABI, region, availabilityMode, foundationDB, runtime, cos, capacity]
              x-kubernetes-validations:
                - rule: "has(self.zones) != has(self.topology)"
                  message: "a profile must use either explicit native zones or portable Kubernetes topology, but not both"
                - rule: "self.foundationDB.supervisor == 'foundationdb-kubernetes-operator' ? has(self.topology) : has(self.zones)"
                  message: "Kubernetes Operator profiles use portable topology; native fdbmonitor profiles inventory explicit zones"
                - rule: "has(self.zones) ? has(self.foundationDB.processesPerZone) && self.foundationDB.processCount == size(self.zones) * self.foundationDB.processesPerZone : true"
                  message: "native processCount must equal explicit zones times processesPerZone"
                - rule: "has(self.topology) ? self.foundationDB.processCount >= self.topology.zoneCount : true"
                  message: "Kubernetes processCount must cover every required topology zone"
                - rule: "self.foundationDB.supervisor == 'foundationdb-kubernetes-operator' ? has(self.foundationDB.kubernetes) : !has(self.foundationDB.kubernetes)"
                  message: "the Kubernetes supervisor requires Kubernetes settings, while native fdbmonitor must not carry them"
                - rule: "self.availabilityMode == 'production-multi-zone' ? ((has(self.zones) && size(self.zones) >= 3) || (has(self.topology) && self.topology.zoneCount == 3)) : (has(self.topology) && self.topology.zoneCount == 1)"
                  message: "production profiles require at least three zones; qualification-single-zone profiles require one portable topology zone"
                - rule: "self.foundationDB.supervisor == 'foundationdb-kubernetes-operator' && self.availabilityMode == 'production-multi-zone' ? self.foundationDB.processCount >= 9 && self.foundationDB.processCount % 3 == 0 && self.foundationDB.coordinatorCount == 9 && self.foundationDB.redundancyMode == 'three_data_hall' : true"
                  message: "production operator profiles require three_data_hall with nine coordinators and at least nine hostname fault domains"
                - rule: "self.foundationDB.supervisor == 'foundationdb-kubernetes-operator' && self.availabilityMode == 'qualification-single-zone' ? self.foundationDB.processCount >= 3 && self.foundationDB.coordinatorCount == 3 && self.foundationDB.redundancyMode == 'double' : true"
                  message: "single-zone qualification operator profiles require double redundancy and three coordinators"
                - rule: "(has(self.cos.coldBucketPrefix) && has(self.cos.backupBucketPrefix) && self.cos.coldBucketPrefix != self.cos.backupBucketPrefix) || (has(self.cos.coldBucket) && has(self.cos.backupBucket) && self.cos.coldBucket != self.cos.backupBucket)"
                  message: "COS policy requires different cold and backup bucket names or prefixes"
                - rule: "self.cos.versioning == 'NeverEnabled' && self.cos.multiAZ == false"
                  message: "Actor COS buckets must be created without versioning; Tencent multi-AZ buckets cannot satisfy this contract"
              properties:
                driverABI:
                  type: string
                  enum: [rivet-fdb-cos-v1, rivet-fdb-cos-kubernetes-v1]
                region:
                  type: string
                  pattern: '^[a-z][a-z0-9-]+$'
                availabilityMode:
                  type: string
                  enum: [production-multi-zone, qualification-single-zone]
                zones:
                  type: array
                  minItems: 1
                  maxItems: 9
                  x-kubernetes-list-type: set
                  items:
                    type: string
                    minLength: 1
                topology:
                  type: object
                  required: [zoneLabelKey, zoneCount, maxSkew, whenUnsatisfiable]
                  properties:
                    zoneLabelKey:
                      type: string
                      enum: [topology.kubernetes.io/zone]
                    zoneCount:
                      type: integer
                      minimum: 1
                      maximum: 9
                    maxSkew:
                      type: integer
                      minimum: 1
                      maximum: 1
                    whenUnsatisfiable:
                      type: string
                      enum: [DoNotSchedule]
                foundationDB:
                  type: object
                  required:
                    - version
                    - processCount
                    - coordinatorCount
                    - redundancyMode
                    - localityKey
                    - storageEngine
                    - exclusiveCluster
                    - supervisor
                    - dataDisk
                  x-kubernetes-validations:
                    - rule: "!has(self.autoscaling) || (self.supervisor == 'foundationdb-kubernetes-operator' && self.processCount >= self.autoscaling.minProcessCount && self.processCount <= self.autoscaling.maxProcessCount)"
                      message: "FDB autoscaling is operator-only and the baseline processCount must be inside its bounds"
                  properties:
                    version:
                      type: string
                      pattern: '^7\.3\.[0-9]+$'
                    processCount:
                      type: integer
                      minimum: 3
                    processesPerZone:
                      type: integer
                      minimum: 2
                    coordinatorCount:
                      type: integer
                      minimum: 3
                    redundancyMode:
                      type: string
                      enum: [double, three_data_hall]
                    localityKey:
                      type: string
                      enum: [data_hall]
                    storageEngine:
                      type: string
                      enum: [ssd-2]
                    exclusiveCluster:
                      type: boolean
                      enum: [true]
                    supervisor:
                      type: string
                      enum: [systemd-fdbmonitor, foundationdb-kubernetes-operator]
                    kubernetes:
                      type: object
                      required:
                        - operatorVersion
                        - imageType
                        - imageRepository
                        - imageTagDigest
                        - storageClassName
                        - fdbServiceAccountName
                        - placementMode
                        - priorityClassName
                        - faultDomainKey
                        - nodeSelector
                        - nodeCapacity
                        - resources
                        - tls
                      properties:
                        operatorVersion:
                          type: string
                          pattern: '^v2\.[0-9]+\.[0-9]+$'
                        imageType:
                          type: string
                          enum: [unified]
                        imageRepository:
                          type: string
                          pattern: '^[a-z0-9./_-]+$'
                        imageTagDigest:
                          type: string
                          pattern: '^7\.3\.[0-9]+@sha256:[0-9a-f]{64}$'
                        storageClassName:
                          type: string
                          minLength: 1
                        fdbServiceAccountName:
                          type: string
                          minLength: 1
                        placementMode:
                          type: string
                          enum: [DedicatedNodes, MixedEligibleNodes]
                        priorityClassName:
                          type: string
                          minLength: 1
                        faultDomainKey:
                          type: string
                          enum: [kubernetes.io/hostname]
                        dataHallNodeLabel:
                          type: string
                          enum: [topology.kubernetes.io/zone]
                        nodeSelector:
                          type: object
                          minProperties: 1
                          additionalProperties:
                            type: string
                        nodeCapacity:
                          type: object
                          required: [provider, machineSetName, processesPerNode]
                          properties:
                            provider:
                              type: string
                              enum: [TKENativeMachineSet]
                            machineSetName:
                              type: string
                              pattern: '^np-[a-z0-9]{8}$'
                            processesPerNode:
                              type: integer
                              enum: [1]
                        resources:
                          type: object
                          required: [cpuRequest, memoryRequest, cpuLimit, memoryLimit]
                          x-kubernetes-validations:
                            - rule: "self.cpuRequest == self.cpuLimit && self.memoryRequest == self.memoryLimit"
                              message: "FDB Pods require equal requests and limits for Guaranteed QoS"
                          properties:
                            cpuRequest:
                              type: string
                              minLength: 1
                            memoryRequest:
                              type: string
                              minLength: 1
                            cpuLimit:
                              type: string
                              minLength: 1
                            memoryLimit:
                              type: string
                              minLength: 1
                        tls:
                          type: object
                          required: [mode]
                          x-kubernetes-validations:
                            - rule: "self.mode == 'Required' ? has(self.secretNameTemplate) && has(self.peerVerificationRules) : true"
                              message: "TLS-required profiles need a per-Cell secret template and peer verification rules"
                          properties:
                            mode:
                              type: string
                              enum: [Required, DisabledForQualification]
                            secretNameTemplate:
                              type: string
                              pattern: '^\{clusterName\}-[a-z0-9-]+$'
                            peerVerificationRules:
                              type: string
                              minLength: 1
                    autoscaling:
                      type: object
                      required:
                        - mode
                        - minProcessCount
                        - maxProcessCount
                        - stepProcessCount
                        - scaleUp
                        - scaleDown
                        - volumeRetentionSeconds
                        - volumeGCMode
                      x-kubernetes-validations:
                        - rule: "self.minProcessCount <= self.maxProcessCount"
                          message: "autoscaling minProcessCount must not exceed maxProcessCount"
                        - rule: "self.minProcessCount % 3 == 0 && self.maxProcessCount % 3 == 0 && self.stepProcessCount % 3 == 0"
                          message: "three-zone FDB autoscaling counts and steps must be multiples of three"
                        - rule: "self.scaleDown.headroomBytes > self.scaleUp.headroomBytes"
                          message: "scale-down headroom must be above the scale-up threshold to provide hysteresis"
                      properties:
                        mode:
                          type: string
                          enum: [Disabled, ObserveOnly, Automatic]
                        minProcessCount:
                          type: integer
                          minimum: 9
                          maximum: 126
                        maxProcessCount:
                          type: integer
                          minimum: 9
                          maximum: 126
                        stepProcessCount:
                          type: integer
                          minimum: 3
                          maximum: 12
                        scaleUp:
                          type: object
                          required: [headroomBytes, etaSeconds, sustainSeconds, cooldownSeconds, minimumSamples]
                          properties:
                            headroomBytes:
                              type: integer
                              minimum: 10737418240
                            etaSeconds:
                              type: integer
                              minimum: 3600
                            sustainSeconds:
                              type: integer
                              minimum: 300
                            cooldownSeconds:
                              type: integer
                              minimum: 300
                            minimumSamples:
                              type: integer
                              minimum: 1
                        scaleDown:
                          type: object
                          required: [headroomBytes, writeUtilizationPercent, sustainSeconds, cooldownSeconds, minimumSamples]
                          properties:
                            headroomBytes:
                              type: integer
                              minimum: 10737418240
                            writeUtilizationPercent:
                              type: integer
                              minimum: 0
                              maximum: 50
                            sustainSeconds:
                              type: integer
                              minimum: 3600
                            cooldownSeconds:
                              type: integer
                              minimum: 3600
                            minimumSamples:
                              type: integer
                              minimum: 1
                        volumeRetentionSeconds:
                          type: integer
                          default: 2592000
                          minimum: 86400
                          maximum: 31536000
                        volumeGCMode:
                          type: string
                          default: ObserveOnly
                          enum: [ObserveOnly, Automatic]
                    dataDisk:
                      type: object
                      required: [type, sizeGiB, encrypted, retain]
                      properties:
                        type:
                          type: string
                          enum: [CLOUD_BSSD, CLOUD_SSD, LOCAL_NVME]
                        sizeGiB:
                          type: integer
                          minimum: 100
                        encrypted:
                          type: boolean
                        retain:
                          type: boolean
                          enum: [true]
                runtime:
                  type: object
                  required: [deploymentMode, minEngineHosts, minWorkerdHosts, localStateDisposable]
                  properties:
                    deploymentMode:
                      type: string
                      enum: [native-systemd, kubernetes]
                    minEngineHosts:
                      type: integer
                      minimum: 1
                    minWorkerdHosts:
                      type: integer
                      minimum: 1
                    localStateDisposable:
                      type: boolean
                      enum: [true]
                gasolineRetention:
                  type: object
                  required: [historyGraceSeconds, terminalGraceSeconds, pruneIntervalSeconds, fdbLogicalSoftBytes, fdbLogicalHardBytes]
                  x-kubernetes-validations:
                    - rule: "self.terminalGraceSeconds >= self.historyGraceSeconds"
                      message: "terminal retention must not be shorter than history retention"
                    - rule: "self.fdbLogicalHardBytes > self.fdbLogicalSoftBytes"
                      message: "the FDB logical hard watermark must exceed the soft watermark"
                  properties:
                    historyGraceSeconds:
                      type: integer
                      minimum: 60
                      maximum: 31536000
                    terminalGraceSeconds:
                      type: integer
                      minimum: 60
                      maximum: 31536000
                    pruneIntervalSeconds:
                      type: integer
                      minimum: 1
                      maximum: 86400
                    fdbLogicalSoftBytes:
                      type: integer
                      minimum: 1073741824
                    fdbLogicalHardBytes:
                      type: integer
                      minimum: 1073741825
                cos:
                  type: object
                  required: [multiAZ, versioning, objectKeyLayout, exactKeyRecovery, listIndependent, inCommitPath]
                  properties:
                    coldBucket:
                      type: string
                      minLength: 3
                    backupBucket:
                      type: string
                      minLength: 3
                    coldBucketPrefix:
                      type: string
                      minLength: 3
                    backupBucketPrefix:
                      type: string
                      minLength: 3
                    multiAZ:
                      type: boolean
                      enum: [false]
                    versioning:
                      type: string
                      enum: [NeverEnabled]
                    objectKeyLayout:
                      type: string
                      enum: [depot-cold-v2]
                    exactKeyRecovery:
                      type: boolean
                      enum: [true]
                    listIndependent:
                      type: boolean
                      enum: [true]
                    inCommitPath:
                      type: boolean
                      enum: [false]
                capacity:
                  type: object
                  required: [healthyWriteUtilizationLimitPercent, degradedWriteUtilizationLimitPercent, scaleOutAtPercent]
                  properties:
                    healthyWriteUtilizationLimitPercent:
                      type: integer
                      minimum: 1
                      maximum: 50
                    degradedWriteUtilizationLimitPercent:
                      type: integer
                      minimum: 1
                      maximum: 70
                    scaleOutAtPercent:
                      type: integer
                      minimum: 1
                      maximum: 80
      additionalPrinterColumns:
        - name: ABI
          type: string
          jsonPath: .spec.driverABI
        - name: FDB
          type: string
          jsonPath: .spec.foundationDB.version
        - name: Processes
          type: integer
          jsonPath: .spec.foundationDB.processCount
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: shardclasses.fleet.actor.dev
spec:
  group: fleet.actor.dev
  scope: Cluster
  names:
    plural: shardclasses
    singular: shardclass
    kind: ShardClass
    shortNames: [sc]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
