apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fdbscaleoperations.fleet.actor.dev
spec:
  group: fleet.actor.dev
  scope: Namespaced
  names:
    plural: fdbscaleoperations
    singular: fdbscaleoperation
    kind: FDBScaleOperation
    shortNames: [fdbso]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [cellRef, foundationDBClusterRef, direction, fromProcessCount, toProcessCount, requestedAt, profileDigest, volumeInventory, volumeRetentionSeconds, volumeGCMode]
              x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "an FDB scale operation is an immutable decision receipt"
                - rule: "self.fromProcessCount >= 9 && self.toProcessCount >= 9 && self.fromProcessCount % 3 == 0 && self.toProcessCount % 3 == 0"
                  message: "three-zone FDB scale operations use process counts of at least nine in multiples of three"
                - rule: "self.direction == 'Up' ? self.toProcessCount > self.fromProcessCount : self.toProcessCount < self.fromProcessCount"
                  message: "scale direction must agree with from/to process counts"
                - rule: "!has(self.selectedProcessGroups) || (self.direction == 'Up' ? size(self.selectedProcessGroups) == 0 : size(self.selectedProcessGroups) == self.fromProcessCount - self.toProcessCount)"
                  message: "a persisted scale-down selection must contain the exact number of process groups being removed"
                - rule: "!has(self.selectedProcessGroupTopology) || (has(self.selectedProcessGroups) && size(self.selectedProcessGroupTopology) == size(self.selectedProcessGroups))"
                  message: "persisted scale-down topology evidence must cover every selected process group"
              properties:
                cellRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1}
                    uid: {type: string, minLength: 1}
                foundationDBClusterRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1}
                    uid: {type: string, minLength: 1}
                direction:
                  type: string
                  enum: [Up, Down]
                fromProcessCount: {type: integer, minimum: 9}
                toProcessCount: {type: integer, minimum: 9}
                requestedAt:
                  type: string
                  format: date-time
                profileDigest:
                  type: string
                  pattern: '^sha256:[0-9a-f]{64}$'
                volumeRetentionSeconds:
                  type: integer
                  default: 2592000
                  minimum: 86400
                  maximum: 31536000
                volumeGCMode:
                  type: string
                  default: ObserveOnly
                  enum: [ObserveOnly, Automatic]
                nodeCapacityRef:
                  type: object
                  required: [provider, machineSetName, processesPerNode]
                  properties:
                    provider:
                      type: string
                      enum: [TKENativeMachineSet]
                    machineSetName:
                      type: string
                      pattern: '^np-[a-z0-9]{8}$'
                    processesPerNode:
                      type: integer
                      enum: [1]
                selectedProcessGroups:
                  type: array
                  maxItems: 126
                  x-kubernetes-list-type: set
                  items: {type: string, pattern: '^storage-[0-9]+$'}
                selectedProcessGroupTopology:
                  type: array
                  maxItems: 126
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [processGroupID]
                  items:
                    type: object
                    required: [processGroupID, nodeName, zone]
                    properties:
                      processGroupID: {type: string, pattern: '^storage-[0-9]+$'}
                      nodeName: {type: string, minLength: 1}
                      zone: {type: string, minLength: 1}
                volumeInventory:
                  type: array
                  maxItems: 126
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [processGroupID]
                  items:
                    type: object
                    required: [processGroupID, pvcName, pvcUID, pvName, pvUID, cbsDiskID]
                    properties:
                      processGroupID: {type: string, pattern: '^storage-[0-9]+$'}
                      pvcName: {type: string, minLength: 1}
                      pvcUID: {type: string, minLength: 1}
                      pvName: {type: string, minLength: 1}
                      pvUID: {type: string, minLength: 1}
                      cbsDiskID: {type: string, pattern: '^disk-[a-z0-9]+$'}
            status:
              type: object
              properties:
                observedGeneration: {type: integer}
                phase:
                  type: string
                  enum: [Pending, ProvisioningCapacity, Scaling, Verifying, QuarantiningVolumes, ReclaimingCapacity, Succeeded, Failed, RolledBack]
                foundationDBGeneration: {type: integer}
                targetReadyAt:
                  type: string
                  format: date-time
                selectedProcessGroups:
                  type: array
                  x-kubernetes-list-type: set
                  items: {type: string, pattern: '^storage-[0-9]+$'}
                receiptRef: {type: string}
                receiptDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                nodeCapacity:
                  type: object
                  properties:
                    provider: {type: string}
                    machineSetName: {type: string}
                    desiredNodes: {type: integer}
                    primaryStorageProcesses: {type: integer}
