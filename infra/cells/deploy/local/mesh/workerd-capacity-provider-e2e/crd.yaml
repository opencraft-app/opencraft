apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workerdcapacityrequests.local.fleet.actor.dev
spec:
  group: local.fleet.actor.dev
  scope: Namespaced
  names:
    plural: workerdcapacityrequests
    singular: workerdcapacityrequest
    kind: WorkerdCapacityRequest
    shortNames: [wcr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [runID, cluster, cell, ordinal, nodeName, workloadRef, podRef]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: CapacityRequest identity is immutable
              properties:
                runID: {type: string, minLength: 8, maxLength: 16}
                cluster: {type: string, minLength: 1}
                cell: {type: string, minLength: 1}
                ordinal: {type: integer, minimum: 1}
                nodeName: {type: string, minLength: 1}
                workloadRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1}
                    uid: {type: string, minLength: 1}
                podRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1}
                    uid: {type: string, minLength: 1}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Draining, Deleting, Deleted, Failed]
                nodeUID: {type: string, minLength: 1}
                reason: {type: string, maxLength: 512}
                lastTransitionTime: {type: string, format: date-time}
                history:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [phase, at, reason]
                    properties:
                      phase: {type: string}
                      at: {type: string, format: date-time}
                      reason: {type: string, maxLength: 512}
