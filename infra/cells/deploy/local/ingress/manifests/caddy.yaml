apiVersion: v1
kind: Namespace
metadata:
  name: local-ingress-system
  labels:
    app.kubernetes.io/part-of: rivet-local-ingress
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-ingress
  namespace: local-ingress-system
  labels:
    app.kubernetes.io/name: local-ingress
    app.kubernetes.io/part-of: rivet-local-ingress
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-ingress
  template:
    metadata:
      annotations:
        local.ingress.rivet.dev/config-sha256: __CADDY_CONFIG_SHA256__
      labels:
        app.kubernetes.io/name: local-ingress
        app.kubernetes.io/part-of: rivet-local-ingress
    spec:
      serviceAccountName: local-ingress
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-caddy
          image: __CADDY_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [/bin/cp]
          args: [/usr/bin/caddy, /opt/caddy/caddy]
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: binary
              mountPath: /opt/caddy
      containers:
        - name: caddy
          image: __CADDY_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [/opt/caddy/caddy]
          args: [run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
          env:
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/config
            - name: XDG_DATA_HOME
              value: /tmp/data
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: binary
              mountPath: /opt/caddy
              readOnly: true
            - name: config
              mountPath: /etc/caddy
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: binary
          emptyDir:
            sizeLimit: 64Mi
        - name: config
          configMap:
            name: local-ingress
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-ingress
  namespace: local-ingress-system
  labels:
    app.kubernetes.io/part-of: rivet-local-ingress
---
apiVersion: v1
kind: Service
metadata:
  name: local-ingress
  namespace: local-ingress-system
  labels:
    app.kubernetes.io/name: local-ingress
    app.kubernetes.io/part-of: rivet-local-ingress
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: local-ingress
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
