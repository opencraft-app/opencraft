apiVersion: v1
kind: Namespace
metadata:
  name: minisandbox-system
  labels:
    app.kubernetes.io/part-of: minisandbox
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: minisandbox-kvm-device-plugin
  namespace: minisandbox-system
  labels:
    app.kubernetes.io/name: minisandbox-kvm-device-plugin
    app.kubernetes.io/part-of: minisandbox
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: minisandbox-kvm-device-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minisandbox-kvm-device-plugin
        app.kubernetes.io/part-of: minisandbox
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        rivet.dev/compute: "true"
        rivet.dev/pvm: "true"
      priorityClassName: system-node-critical
      tolerations:
        - key: rivet.dev/compute
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: device-plugin
          image: squat/generic-device-plugin@sha256:dc192e164c69b03f156765793a1be62ca437709ae477b27ca7d8f3dcf5021576
          args:
            - --domain=rivet.dev
            - --device={"name":"kvm","groups":[{"count":1,"paths":[{"path":"/dev/kvm"}]}]}
            - --log-level=info
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: kvm
              mountPath: /dev/kvm
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
