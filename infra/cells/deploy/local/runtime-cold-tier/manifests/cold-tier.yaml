apiVersion: v1
kind: Namespace
metadata:
  name: runtime-cold-tier-system
  labels:
    app.kubernetes.io/part-of: rivet-local-runtime
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: runtime-cold-tier-data
  namespace: runtime-cold-tier-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: runtime-cold-tier
  namespace: runtime-cold-tier-system
  labels:
    app.kubernetes.io/name: runtime-cold-tier
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: runtime-cold-tier
  template:
    metadata:
      labels:
        app.kubernetes.io/name: runtime-cold-tier
      annotations:
        local.rivet.dev/script-sha256: __SCRIPT_SHA256__
        rivet.dev/storage-profile: __STORAGE_PROFILE_ID__
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: s3
          image: python:3.12-alpine@sha256:1887c114801a8c82a4ec01daa52cfe7fc3f63573640e2247320289807ac1c3bb
          imagePullPolicy: IfNotPresent
          command: [python3, /opt/local-s3/local_s3.py]
          env:
            - name: LOCAL_S3_ROOT
              value: /data/objects
            - name: LOCAL_S3_BUCKETS
              value: __LOCAL_S3_BUCKETS__
            - name: LOCAL_S3_MAX_OBJECT_BYTES
              value: "__LOCAL_S3_MAX_OBJECT_BYTES__"
            - name: LOCAL_S3_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: runtime-cold-tier-admin
                  key: token
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /__health
              port: http
            periodSeconds: 1
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /__health
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: script
              mountPath: /opt/local-s3
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: script
          configMap:
            name: runtime-cold-tier-script
        - name: data
          persistentVolumeClaim:
            claimName: runtime-cold-tier-data
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: runtime-cold-tier
  namespace: runtime-cold-tier-system
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: runtime-cold-tier
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30082
