# Review/render only. Do NOT apply as-is. All resources except ClusterRole/Binding
# are in the existing Cell namespace. Provision Lease first, then pin its UID
# in the public config.json ConfigMap before starting the Deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-session-renewer
  namespace: actor-fdb-cell-system
automountServiceAccountToken: false
---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: actor-kr-q01-storage-session-renewer
  namespace: actor-fdb-cell-system
  ownerReferences:
    - apiVersion: fleet.actor.dev/v1alpha1
      kind: RivetCell
      name: actor-kr-q01
      uid: REPLACE_CELL_UID
spec: {}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: storage-session-renewer
  namespace: actor-fdb-cell-system
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [actor-kr-q01-cold-credentials, actor-kr-q01-backup-credentials, actor-kr-q01-code-credentials]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [actor-kr-q01-storage-session-renewer]
    verbs: [get, update]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcells]
    resourceNames: [actor-kr-q01]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: storage-session-renewer
  namespace: actor-fdb-cell-system
subjects:
  - kind: ServiceAccount
    name: storage-session-renewer
    namespace: actor-fdb-cell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: storage-session-renewer
---
# Namespace is cluster-scoped: its UID check requires this exact-name GET grant.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actor-kr-q01-storage-session-renewer-namespace-read
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [actor-fdb-cell-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actor-kr-q01-storage-session-renewer-namespace-read
subjects:
  - kind: ServiceAccount
    name: storage-session-renewer
    namespace: actor-fdb-cell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actor-kr-q01-storage-session-renewer-namespace-read
---
# Supply separate ConfigMap storage-session-renewer-config with exactly the
# reviewed config.json (see config.example.json). It contains no credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-session-renewer
  namespace: actor-fdb-cell-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: storage-session-renewer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: storage-session-renewer
    spec:
      serviceAccountName: storage-session-renewer
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: renewer
          image: REPLACE_REGISTRY/storage-session-renewer@sha256:REPLACE_DIGEST
          args: ["-config=/etc/storage-session-renewer/config.json", "-listen=:8080"]
          ports:
            - name: health
              containerPort: 8080
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet: {path: /livez, port: health}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
            failureThreshold: 1
          volumeMounts:
            - {name: config, mountPath: /etc/storage-session-renewer, readOnly: true}
            - {name: kube-api, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
            - {name: oidc, mountPath: /var/run/secrets/storage-oidc, readOnly: true}
      volumes:
        - name: config
          configMap:
            name: storage-session-renewer-config
        - name: kube-api
          projected:
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
        - name: oidc
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: REPLACE_OIDC_AUDIENCE
                  expirationSeconds: 3600
