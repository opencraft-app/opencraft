apiVersion: v1
kind: ServiceAccount
metadata:
  name: actor-fleet-controller
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actor-fleet-controller
rules:
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcellprofiles, shardclasses]
    verbs: [get, list, watch]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcells, shardpools]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcells/status, shardpools/status]
    verbs: [get, patch, update]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcells/finalizers]
    verbs: [update]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcellclaims]
    verbs: [get, list, watch, create]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcellclaims/status]
    verbs: [get, patch, update]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcellregistrations]
    verbs: [get, list, watch]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcellreports]
    verbs: [get, list, watch]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetenvironmentreports]
    verbs: [get, list, watch]
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclusters]
    verbs: [get, list, watch]
  - apiGroups: [work.open-cluster-management.io]
    resources: [manifestworks]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [fleet.actor.dev]
    resources: [fdbscaleoperations, fdbvolumeretirements]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [fleet.actor.dev]
    resources: [fdbscaleoperations/status, fdbvolumeretirements/status]
    verbs: [get, patch, update]
  - apiGroups: [apps.foundationdb.org]
    resources: [foundationdbclusters]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [storage.k8s.io]
    resources: [volumeattachments]
    verbs: [get, list, watch]
  - apiGroups: [node.tke.cloud.tencent.com]
    resources: [machinesets]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [node.tke.cloud.tencent.com]
    resources: [machines]
    verbs: [get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actor-fleet-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actor-fleet-controller
subjects:
  - kind: ServiceAccount
    name: actor-fleet-controller
    namespace: actor-fleet-controller-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actor-fleet-controller-leader-election
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch, update]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actor-fleet-controller-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: actor-fleet-controller-leader-election
subjects:
  - kind: ServiceAccount
    name: actor-fleet-controller
    namespace: actor-fleet-controller-system
