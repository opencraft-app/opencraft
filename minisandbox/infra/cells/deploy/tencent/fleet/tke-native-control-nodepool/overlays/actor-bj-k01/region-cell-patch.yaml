# Regional candidate subnets are inventory, not scheduling policy. TKE creates
# one of the three control nodes in each available zone via ZoneEquality.
apiVersion: node.tke.cloud.tencent.com/v1beta1
kind: MachineSet
metadata:
  name: np-control0
spec:
  displayName: actor-bj-k01-control-native
  replicas: 3
  instanceTypes:
    - SA9.4XLARGE32
  subnetIDs:
    - subnet-qljvksy9
    - subnet-k1rounhb
    - subnet-kx0feejb
  scaling:
    createPolicy: ZoneEquality
    minReplicas: 3
    maxReplicas: 3
  template:
    metadata:
      annotations:
        node.tke.cloud.tencent.com/machine-cloud-tags: '[{"tagKey":"cell","tagValue":"actor-bj-k01"},{"tagKey":"role","tagValue":"control"}]'
    spec:
      displayName: actor-bj-k01-control-native-worker
      metadata:
        labels:
          fleet.actor.dev/cell: actor-bj-k01
          fleet.actor.dev/cell-name: actor-bj-k01
      providerSpec:
        value:
          keyIDs:
            - skey-g2mcgx6l
          securityGroupIDs:
            - sg-jfy27iab
