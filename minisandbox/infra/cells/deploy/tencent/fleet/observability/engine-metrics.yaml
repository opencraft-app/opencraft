apiVersion: v1
kind: Service
metadata:
  name: actor-fleet-engine-metrics
  namespace: actor-fdb-cell-system
  labels:
    app.kubernetes.io/name: actor-fleet-engine-metrics
    app.kubernetes.io/part-of: actor-fleet
spec:
  clusterIP: None
  selector:
    fleet.actor.dev/component: engine
  ports:
    - name: metrics
      port: 6430
      targetPort: 6430
      protocol: TCP
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: actor-fleet-engine
  namespace: observability
  labels:
    release: actor-observability
    app.kubernetes.io/part-of: actor-fleet
spec:
  namespaceSelector:
    matchNames: [actor-fdb-cell-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: actor-fleet-engine-metrics
  targetLabels:
    - app.kubernetes.io/part-of
  sampleLimit: 50000
  targetLimit: 100
  labelLimit: 50
  bodySizeLimit: 5MB
  endpoints:
    - port: metrics
      path: /
      scheme: http
      interval: 30s
      scrapeTimeout: 10s
      honorLabels: false
      filterRunning: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_fleet_actor_dev_cell_name]
          targetLabel: cell
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: actor-static-release
  namespace: observability
  labels:
    release: actor-observability
    app.kubernetes.io/part-of: actor-fleet
spec:
  namespaceSelector:
    matchNames: [actor-fdb-cell-system]
  selector:
    matchLabels:
      app.kubernetes.io/name: actor-static-release-metrics
  sampleLimit: 100
  targetLimit: 100
  labelLimit: 20
  bodySizeLimit: 64KB
  endpoints:
    - port: metrics
      path: /metrics
      scheme: http
      interval: 30s
      scrapeTimeout: 5s
      honorLabels: false
      filterRunning: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: actor-stateless-executor
  namespace: observability
  labels:
    release: actor-observability
    app.kubernetes.io/part-of: actor-fleet
spec:
  namespaceSelector:
    matchNames: [actor-stateless-system]
  selector:
    matchLabels:
      fleet.actor.dev/component: stateless-executor
      app.kubernetes.io/name: actor-stateless-executor
  sampleLimit: 1000
  targetLimit: 1000
  labelLimit: 30
  bodySizeLimit: 256KB
  endpoints:
    - port: http
      path: /metrics
      scheme: http
      interval: 15s
      scrapeTimeout: 5s
      honorLabels: false
      filterRunning: true
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_fleet_actor_dev_cell_name]
          targetLabel: cell
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
