# Region inventory belongs in an overlay. Candidate subnet order is not an AZ
# placement contract: ZoneEquality and Kubernetes topology labels own spread.
apiVersion: node.tke.cloud.tencent.com/v1beta1
kind: MachineSet
metadata:
  name: np-fdbpool0
spec:
  displayName: actor-bj-k01-fdb-native
  # One FDB process group per node. Compact profiles may declare 3 or 5; the
  # current three_data_hall production profile requires 9.
  replicas: 9
  instanceTypes:
    - SA9.LARGE16
  subnetIDs:
    - subnet-qljvksy9
    - subnet-k1rounhb
    - subnet-kx0feejb
  scaling:
    createPolicy: ZoneEquality
    minReplicas: 9
    # Matches RivetCellProfile.foundationDB.autoscaling.maxProcessCount. TKE's
    # managed autoscaler may add nodes only after pending dedicated FDB Pods
    # exist; the fleet controller remains the sole owner of the FDB target.
    maxReplicas: 30
  template:
    metadata:
      annotations:
        node.tke.cloud.tencent.com/machine-cloud-tags: '[{"tagKey":"cell","tagValue":"actor-bj-k01"}]'
    spec:
      displayName: actor-bj-k01-fdb-native-worker
      metadata:
        labels:
          fleet.actor.dev/cell: actor-bj-k01
          fleet.actor.dev/cell-name: actor-bj-k01
      providerSpec:
        value:
          keyIDs:
            - skey-g2mcgx6l
          securityGroupIDs:
            - sg-jfy27iab
