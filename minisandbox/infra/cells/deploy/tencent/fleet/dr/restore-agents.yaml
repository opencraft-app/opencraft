apiVersion: apps/v1
kind: Deployment
metadata:
  name: actor-bj-k01-dr-20260818-restore-agents
  namespace: actor-fdb-cell-system
  labels:
    fleet.actor.dev/purpose: disaster-recovery-qualification
spec:
  # Restore correctness does not depend on matching the source cluster's nine
  # storage processes.  One backup_agent in each AZ keeps the recovery path
  # failure-domain aware without requiring nine GiB of permanently idle
  # ordinary worker capacity just to enter a DR drill.
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: actor-bj-k01-dr-20260818-restore-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actor-bj-k01-dr-20260818-restore-agent
        fleet.actor.dev/purpose: disaster-recovery-qualification
    spec:
      serviceAccountName: fdb-kubernetes
      imagePullSecrets:
        - name: actor-fleet-tcr
      priorityClassName: actor-fdb-critical
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 4059
        runAsGroup: 4059
        fsGroup: 4059
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: actor-bj-k01-dr-20260818-restore-agent
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: 3
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: actor-bj-k01-dr-20260818-restore-agent
      initContainers:
        - name: foundationdb-kubernetes-init
          image: foundationdb/fdb-kubernetes-monitor:7.3.79@sha256:45f5b7632984a4835326f45a7bcfd662886db64d82333796ee14cbb3a7537c8c
          args:
            - --copy-file
            - fdb.cluster
            - --require-not-empty
            - fdb.cluster
            - --mode
            - init
            - --output-dir
            - /var/output-files
            - --input-dir
            - /var/input-files
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 4059
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config-map
              mountPath: /var/input-files
            - name: dynamic-conf
              mountPath: /var/output-files
      containers:
        - name: foundationdb
          image: foundationdb/fdb-kubernetes-monitor:7.3.79@sha256:45f5b7632984a4835326f45a7bcfd662886db64d82333796ee14cbb3a7537c8c
          command: ["backup_agent"]
          args:
            - --log
            - --logdir
            - /var/log/fdb-trace-logs
            - --locality_zoneid=$(FDB_ZONE_ID)
            - --locality_machineid=$(FDB_MACHINE_ID)
            - --locality_dcid=ap-beijing
          env:
            - name: FDB_CLUSTER_FILE
              value: /var/dynamic-conf/fdb.cluster
            - name: FDB_BLOB_CREDENTIALS
              value: /var/backup-credentials/credentials
            - name: FDB_TLS_CERTIFICATE_FILE
              value: /var/fdb-tls/cert.pem
            - name: FDB_TLS_CA_FILE
              value: /var/fdb-tls/ca.pem
            - name: FDB_TLS_KEY_FILE
              value: /var/fdb-tls/key.pem
            - name: FDB_ZONE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: FDB_MACHINE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 4059
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: backup-credentials
              mountPath: /var/backup-credentials
              readOnly: true
            - name: fdb-tls
              mountPath: /var/fdb-tls
              readOnly: true
            - name: logs
              mountPath: /var/log/fdb-trace-logs
            - name: dynamic-conf
              mountPath: /var/dynamic-conf
      volumes:
        - name: config-map
          configMap:
            name: actor-bj-k01-dr-20260818-config
            items:
              - key: cluster-file
                path: fdb.cluster
        - name: backup-credentials
          secret:
            secretName: actor-bj-k01-backup-credentials
            defaultMode: 0400
        - name: fdb-tls
          secret:
            secretName: actor-bj-k01-backup-tls
            defaultMode: 0440
        - name: logs
          emptyDir: {}
        - name: dynamic-conf
          emptyDir: {}
