metadata:
  name: actor-bj-k01-cell-reporter
rules:
  - apiGroups: [fleet.actor.dev]
    resources: [shardclasses, rivetcellprofiles]
    verbs: [get]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actor-bj-k01-cell-reporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actor-bj-k01-cell-reporter
subjects:
  - kind: ServiceAccount
    name: actor-bj-k01-cell-reporter
    namespace: actor-fdb-cell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: actor-bj-k01-cell-reporter
  namespace: actor-fdb-cell-system
  labels:
    fleet.actor.dev/cell-name: actor-bj-k01
    fleet.actor.dev/component: cell-reporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      fleet.actor.dev/cell-name: actor-bj-k01
      fleet.actor.dev/component: cell-reporter
  template:
    metadata:
      labels:
        fleet.actor.dev/cell-name: actor-bj-k01
        fleet.actor.dev/component: cell-reporter
      annotations:
        fleet.actor.dev/reporter-source-commit: __RIVET_REPORTER_SOURCE_REVISION__
        fleet.actor.dev/reporter-source-manifest-sha256: __RIVET_REPORTER_SOURCE_MANIFEST_SHA256__
    spec:
      serviceAccountName: actor-bj-k01-cell-reporter
      terminationGracePeriodSeconds: 10
      nodeSelector:
        fleet.actor.dev/control-pool: "true"
      containers:
        - name: reporter
          image: __RIVET_REPORTER_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/rivet-cell-reporter]
          env:
            - name: CELL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CELL_NAME
              value: actor-bj-k01
            - name: RELEASE_DIGEST
              value: __RIVET_RUNTIME_DIGEST__
            - name: REPORT_INTERVAL
              value: 30s
            - name: PROMETHEUS_URL
              value: http://actor-observability-prometheus.observability.svc:9090
            - name: RIVET_WORKER_REGISTRY_URL
              value: "__RIVET_WORKER_REGISTRY_URL__"
            - name: HOST_DRAIN_MODE
              value: Disabled
          ports:
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
      securityContext:
        seccompProfile:
          type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: actor-bj-k01-cell-reporter
  namespace: actor-fdb-cell-system
  labels:
    app.kubernetes.io/name: actor-static-release-metrics
    app.kubernetes.io/part-of: actor-fleet
spec:
  selector:
    fleet.actor.dev/cell-name: actor-bj-k01
    fleet.actor.dev/component: cell-reporter
  ports:
    - name: metrics
      port: 8081
      targetPort: health
      protocol: TCP
