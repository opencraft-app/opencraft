metadata:
  name: actor-bj-k01-cell-reporter
  namespace: actor-fdb-cell-system
rules:
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcells]
    verbs: [get]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcellreports]
    verbs: [get, create, update]
  - apiGroups: [apps.foundationdb.org]
    resources: [foundationdbclusters, foundationdbbackups]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [actor-bj-k01-release-ledger, actor-bj-k01-runtime-config, actor-bj-k01-nats-config]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [actor-bj-k01-runtime-cos, actor-bj-k01-runtime-auth, actor-bj-k01-backup-tls]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actor-bj-k01-cell-reporter
  namespace: actor-fdb-cell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: actor-bj-k01-cell-reporter
subjects:
  - kind: ServiceAccount
    name: actor-bj-k01-cell-reporter
    namespace: actor-fdb-cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
