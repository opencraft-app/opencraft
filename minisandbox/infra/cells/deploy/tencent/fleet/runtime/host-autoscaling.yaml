apiVersion: v1
kind: ServiceAccount
metadata:
  name: __CELL_NAME__-host-drain
  namespace: __NAMESPACE__
imagePullSecrets:
  - name: actor-fleet-tcr
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: __CELL_NAME__-host-drain
  namespace: __NAMESPACE__
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [__CELL_NAME__-runtime-auth]
    verbs: [get]
  - apiGroups: [apps]
    resources: [statefulsets]
    resourceNames: [__CELL_NAME__-runtime-hosts]
    verbs: [get, patch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    resourceNames: [__CELL_NAME__-runtime-hosts-actor-capacity]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: __CELL_NAME__-host-drain
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: __CELL_NAME__-host-drain
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: __CELL_NAME__-host-drain
subjects:
  - kind: ServiceAccount
    name: __CELL_NAME__-host-drain
    namespace: __NAMESPACE__
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: __CELL_NAME__-host-drain
  namespace: __NAMESPACE__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: __CELL_NAME__-host-drain
subjects:
  - kind: ServiceAccount
    name: __CELL_NAME__-host-drain
    namespace: __NAMESPACE__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: __CELL_NAME__-host-drain
  namespace: __NAMESPACE__
  labels:
    fleet.actor.dev/cell-name: __CELL_NAME__
    fleet.actor.dev/component: host-drain-controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      fleet.actor.dev/cell-name: __CELL_NAME__
      fleet.actor.dev/component: host-drain-controller
  template:
    metadata:
      labels:
        fleet.actor.dev/cell-name: __CELL_NAME__
        fleet.actor.dev/component: host-drain-controller
      annotations:
        fleet.actor.dev/runtime-release-hold-protocol: statefulset-uid-cas-v1
    spec:
      serviceAccountName: __CELL_NAME__-host-drain
      imagePullSecrets:
        - name: actor-fleet-tcr
      nodeSelector:
        fleet.actor.dev/control-pool: "true"
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: __CONTROLLER_IMAGE__
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/workerd-host-drain-controller]
          env:
            - name: CELL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CELL_NAME
              value: __CELL_NAME__
            - name: HOST_DRAIN_MIN_REPLICAS
              value: "__MIN_REPLICAS__"
            - name: HOST_DRAIN_MAX_REMAINING_USAGE_PERCENT
              value: "70"
            - name: HOST_DRAIN_METRICS_FRESHNESS
              value: 45s
            - name: HOST_DRAIN_STABILIZATION
              value: 5m
            - name: HOST_DRAIN_TIMEOUT
              value: 10m
            - name: HOST_DRAIN_RECONCILE_INTERVAL
              value: 5s
            - name: HOST_DRAIN_TOPOLOGY_KEY
              value: topology.kubernetes.io/zone
            - name: HOST_DRAIN_REQUIRED_ZONES
              value: "3"
            - name: HOST_DRAIN_TOPOLOGY_MAX_SKEW
              value: "__TOPOLOGY_MAX_SKEW__"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: __CELL_NAME__-runtime-hosts-actor-capacity
  namespace: __NAMESPACE__
  labels:
    fleet.actor.dev/cell-name: __CELL_NAME__
    fleet.actor.dev/purpose: runtime-autoscaling
spec:
  minReplicas: __MIN_REPLICAS__
  maxReplicas: __MAX_REPLICAS__
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: __CELL_NAME__-runtime-hosts
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      # HPA's default tolerance intentionally waits for about ten percent of
      # demand before changing replicas. At hundreds of Hosts, selecting the
      # Percent policy therefore admits tens of Envoys at once and creates an
      # Actor allocation/wake storm. Six Hosts/minute stays ahead of the
      # qualified one-Agent/second/Cell arrival rate at a 16-Actor target while
      # keeping each control-plane cohort bounded. Percent=100 only prevents a
      # tiny floor from being asked for more than one doubling; Min is the
      # safety invariant.
      selectPolicy: Min
      policies:
        - type: Pods
          value: 6
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      # The standalone UID-fenced drain controller is the only scale-in
      # writer. HPA computes demand but must never delete a live Host itself.
      selectPolicy: Disabled
  metrics:
    - type: External
      external:
        metric:
          name: rivet_workerd_active_actors_total
          selector:
            matchLabels:
              cell: __CELL_NAME__
        target:
          type: AverageValue
          averageValue: "__TARGET_ACTIVE_ACTORS__"
