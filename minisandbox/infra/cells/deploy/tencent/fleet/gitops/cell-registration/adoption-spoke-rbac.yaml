apiVersion: v1
kind: ServiceAccount
metadata:
  name: actor-fleet-adopter
  namespace: actor-fdb-cell-system
  labels:
    fleet.actor.dev/cell: __CELL_ID__
---
apiVersion: v1
kind: Secret
metadata:
  name: actor-fleet-adopter-token
  namespace: actor-fdb-cell-system
  annotations:
    kubernetes.io/service-account.name: actor-fleet-adopter
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actor-fleet-adopter-__CELL_ID__
rules:
  - apiGroups: [""]
    resources: [namespaces]
    resourceNames: [kube-system]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actor-fleet-adopter-__CELL_ID__
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actor-fleet-adopter-__CELL_ID__
subjects:
  - kind: ServiceAccount
    name: actor-fleet-adopter
    namespace: actor-fdb-cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actor-fleet-adopter
  namespace: actor-fdb-cell-system
rules:
  - apiGroups: [fleet.actor.dev]
    resources: [rivetcells]
    resourceNames: [__CELL_ID__]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actor-fleet-adopter
  namespace: actor-fdb-cell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: actor-fleet-adopter
subjects:
  - kind: ServiceAccount
    name: actor-fleet-adopter
    namespace: actor-fdb-cell-system
