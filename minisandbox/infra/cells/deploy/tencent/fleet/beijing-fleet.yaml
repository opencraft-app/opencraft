apiVersion: v1
kind: Namespace
metadata:
  name: actor-fleet-system
  labels:
    app.kubernetes.io/part-of: actor-fleet
---
apiVersion: fleet.actor.dev/v1alpha1
kind: RivetCellProfile
metadata:
  name: rivet-fdb-cos-beijing-v1
spec:
  driverABI: rivet-fdb-cos-v1
  region: ap-beijing
  availabilityMode: production-multi-zone
  zones: [ap-beijing-6, ap-beijing-7, ap-beijing-8]
  foundationDB:
    version: 7.3.79
    processCount: 6
    processesPerZone: 2
    coordinatorCount: 5
    redundancyMode: three_data_hall
    localityKey: data_hall
    storageEngine: ssd-2
    exclusiveCluster: true
    supervisor: systemd-fdbmonitor
    dataDisk:
      type: CLOUD_BSSD
      sizeGiB: 200
      encrypted: false
      retain: true
  runtime:
    deploymentMode: native-systemd
    minEngineHosts: 1
    minWorkerdHosts: 3
    localStateDisposable: true
  cos:
    coldBucketPrefix: actor-depot-cold-prod-bj-
    backupBucketPrefix: actor-fdb-backup-prod-bj-
    multiAZ: false
    versioning: NeverEnabled
    objectKeyLayout: depot-cold-v2
    exactKeyRecovery: true
    listIndependent: true
    inCommitPath: false
  capacity:
    healthyWriteUtilizationLimitPercent: 50
    degradedWriteUtilizationLimitPercent: 70
    scaleOutAtPercent: 80
---
apiVersion: fleet.actor.dev/v1alpha1
kind: ShardClass
metadata:
  name: rivet-fdb-cos-v1
spec:
  controllerName: fleet.actor.dev/rivet-fdb-cos
  driverABI: rivet-fdb-cos-v1
  profileRef:
    name: rivet-fdb-cos-beijing-v1
    digest: sha256:523b9c2510a6401b7123b4176a12cf631ee5e929436a8f34e6ef16947637d6fa
  mobilityPolicy: DriverControlled
  retirementPolicy: ProofRequired
---
apiVersion: fleet.actor.dev/v1alpha1
kind: ShardPool
metadata:
  name: actor-beijing
  namespace: actor-fleet-system
spec:
  className: rivet-fdb-cos-v1
  minCells: 2
  maxCells: 20
  maxConcurrentCellProvisioning: 1
  placement:
    region: ap-beijing
    managementClusters: [cls-0zvm1btp]
  routing:
    strategy: route-hinted-v1
    exactExceptionDirectory: versioned-exact-v1
    perActorKubernetesObjects: false
  reservation:
    mode: CAS
    maxPendingPerCell: 1024
    ttlSeconds: 30
  rebalance:
    onScaleOut: NewActorsOnly
    migrationBatchSize: 128
---
