apiVersion: v1
kind: ServiceAccount
metadata:
  name: fdb-kubernetes
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actor-fdb-pod-monitor
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actor-fdb-pod-monitor
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: actor-fdb-pod-monitor
subjects:
  - kind: ServiceAccount
    name: fdb-kubernetes
    namespace: actor-fdb-cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actor-fdb-node-locality-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actor-fdb-node-locality-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actor-fdb-node-locality-reader
subjects:
  - kind: ServiceAccount
    name: fdb-kubernetes
    namespace: actor-fdb-cell-system
