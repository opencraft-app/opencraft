apiVersion: v1
kind: ServiceAccount
metadata:
  name: fdb-kubernetes-operator-controller-manager
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actor-fdb-kubernetes-operator-node-reader
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actor-fdb-kubernetes-operator-node-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actor-fdb-kubernetes-operator-node-reader
subjects:
  - kind: ServiceAccount
    name: fdb-kubernetes-operator-controller-manager
    namespace: actor-fdb-cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fdb-kubernetes-operator-manager
rules:
  - apiGroups: [""]
    resources: [configmaps, events, persistentvolumeclaims, pods, secrets, services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps.foundationdb.org]
    resources: [foundationdbbackups, foundationdbclusters, foundationdbrestores]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps.foundationdb.org]
    resources: [foundationdbbackups/status, foundationdbclusters/status, foundationdbrestores/status]
    verbs: [get, patch, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, patch, update, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fdb-kubernetes-operator-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fdb-kubernetes-operator-manager
subjects:
  - kind: ServiceAccount
    name: fdb-kubernetes-operator-controller-manager
    namespace: actor-fdb-cell-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fdb-kubernetes-operator-controller-manager
  labels:
    app.kubernetes.io/name: fdb-kubernetes-operator
    app.kubernetes.io/version: v2.34.0
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fdb-kubernetes-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fdb-kubernetes-operator
        app.kubernetes.io/version: v2.34.0
    spec:
      serviceAccountName: fdb-kubernetes-operator-controller-manager
      terminationGracePeriodSeconds: 15
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: fdb-kubernetes-operator
      initContainers:
        - name: foundationdb-kubernetes-init-7-3
          image: foundationdb/fdb-kubernetes-monitor@sha256:45f5b7632984a4835326f45a7bcfd662886db64d82333796ee14cbb3a7537c8c
          args:
            - --copy-library
            - "7.3"
            - --copy-binary
            - fdbcli
            - --copy-binary
            - fdbbackup
            - --copy-binary
            - fdbrestore
            - --output-dir
            - /var/output-files
            - --mode
            - init
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 4059
          volumeMounts:
            - name: fdb-binaries
              mountPath: /var/output-files
      containers:
        - name: manager
          image: foundationdb/fdb-kubernetes-operator@sha256:0b1538e0e6b87ac580c9874a22bee452cf0c2ccc618339f81c4ebe01627bfb2d
          command: [/manager]
          args:
            - --allowed-service-account-names=fdb-kubernetes
            - --allowed-additional-volume-sources=secret
            - --allowed-additional-volume-mounts=fdb-tls
            - --allowed-additional-volume-mounts=backup-credentials
            - --allow-host-network=false
            - --allow-host-pid=false
            - --allow-host-ipc=false
          env:
            - name: WATCH_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: logs
              mountPath: /var/log/fdb
            - name: fdb-binaries
              mountPath: /usr/bin/fdb
      securityContext:
        runAsNonRoot: true
        runAsUser: 4059
        runAsGroup: 4059
        fsGroup: 4059
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: tmp
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: fdb-binaries
          emptyDir: {}
