apiVersion: v1
kind: Namespace
metadata:
  name: worker-registry-system
  labels:
    app.kubernetes.io/part-of: rivet-worker-registry
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker-registry
  namespace: worker-registry-system
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker-registry
  namespace: worker-registry-system
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-registry
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-registry
  namespace: worker-registry-system
  labels:
    app.kubernetes.io/name: worker-registry
    app.kubernetes.io/part-of: rivet-worker-registry
spec:
  replicas: 3
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker-registry
  template:
    metadata:
      annotations:
        worker-registry.rivet.dev/image-id: __WORKER_REGISTRY_IMAGE_ID__
      labels:
        app.kubernetes.io/name: worker-registry
        app.kubernetes.io/part-of: rivet-worker-registry
    spec:
      serviceAccountName: worker-registry
      automountServiceAccountToken: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: worker-registry
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker-registry
          image: __WORKER_REGISTRY_IMAGE__
          imagePullPolicy: IfNotPresent
          args:
            - --listen-address=:8080
            - --backend=fdb-cos
            - --fdb-cluster-file=/etc/foundationdb/fdb.cluster
            - --fdb-key-prefix=code-plane-local
            - --cos-bucket-url=http://worker-registry-cos:8080
            - --cos-object-prefix=worker-registry/v5
            - --version-retention=5
            - --max-compatibility-date=2026-08-14
          env:
            - name: TENCENTCLOUD_SECRET_ID
              value: local-code-registry
            - name: TENCENTCLOUD_SECRET_KEY
              value: local-code-registry-secret
          ports:
            - name: http
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: fdb-cluster-file
              mountPath: /etc/foundationdb
              readOnly: true
      volumes:
        - name: fdb-cluster-file
          configMap:
            name: worker-registry-fdb
            items:
              - key: fdb.cluster
                path: fdb.cluster
      terminationGracePeriodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: worker-registry
  namespace: worker-registry-system
  labels:
    app.kubernetes.io/name: worker-registry
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: worker-registry
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30081
