apiVersion: v1
kind: ServiceAccount
metadata:
  name: local-environment-reporter
  namespace: actor-fleet-controller-system
  labels:
    app.kubernetes.io/part-of: rivet-local-mesh
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: local-environment-reporter
  labels:
    app.kubernetes.io/part-of: rivet-local-mesh
rules:
  - apiGroups: [cluster.open-cluster-management.io]
    resources: [managedclusters]
    verbs: [get]
  - apiGroups: [fleet.actor.dev]
    resources: [rivetenvironmentreports]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: local-environment-reporter
  labels:
    app.kubernetes.io/part-of: rivet-local-mesh
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: local-environment-reporter
subjects:
  - kind: ServiceAccount
    name: local-environment-reporter
    namespace: actor-fleet-controller-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-environment-reporter
  namespace: actor-fleet-controller-system
  labels:
    app.kubernetes.io/name: local-environment-reporter
    app.kubernetes.io/part-of: rivet-local-mesh
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: local-environment-reporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: local-environment-reporter
        app.kubernetes.io/part-of: rivet-local-mesh
    spec:
      serviceAccountName: local-environment-reporter
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: reporter
          image: docker.io/alpine/kubectl:1.35.4@sha256:9ccd823647622b620dce092d0f1406b8b41d152ce08ac963e3d4683770b14dfd
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, -ec]
          args:
            - |
              prometheus='http://actor-mesh-observability-prometheus.mesh-observability.svc:9090'
              while true; do
                for cluster in runtime-a runtime-b; do
                  query="${prometheus}/api/v1/query?query=up%7Bfederation%3D%22actor-cell%22%2Ccluster%3D%22${cluster}%22%7D"
                  if ! wget -qO- --timeout=5 "${query}" | grep -Fq ',"1"]'; then
                    continue
                  fi
                  uid=$(kubectl get managedcluster "${cluster}" -o jsonpath='{.metadata.uid}')
                  generation=$(kubectl get managedcluster "${cluster}" -o jsonpath='{.metadata.generation}')
                  report="local-${cluster}"
                  if kubectl get rivetenvironmentreport "${report}" >/dev/null 2>&1; then
                    old_uid=$(kubectl get rivetenvironmentreport "${report}" -o jsonpath='{.spec.managedClusterRef.uid}')
                    old_generation=$(kubectl get rivetenvironmentreport "${report}" -o jsonpath='{.spec.managedClusterRef.generation}')
                    if [ "${old_uid}" != "${uid}" ] || [ "${old_generation}" != "${generation}" ]; then
                      kubectl delete rivetenvironmentreport "${report}" --wait=true
                    fi
                  fi
                  observed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
                  cat <<EOF | kubectl apply -f -
              apiVersion: fleet.actor.dev/v1alpha1
              kind: RivetEnvironmentReport
              metadata:
                name: ${report}
                annotations:
                  local.fleet.actor.dev/evidence: hub-federated-prometheus
                  local.fleet.actor.dev/simulated-components: fdb-operator,cell-controller
              spec:
                managedClusterRef:
                  name: ${cluster}
                  uid: ${uid}
                  generation: ${generation}
                observedManagedClusterGeneration: ${generation}
                observedAt: ${observed_at}
                region: local
                health:
                  reachable: true
                  apiReady: true
                  cellControllerReady: true
                  fdbOperatorReady: true
                capacity:
                  maxCells: 1
                  currentCells: 1
                  provisioningCells: 0
                  availableCellSlots: 0
                  allocatableCellUnits: 1
                  maxConcurrentProvisioning: 1
              EOF
                done
                sleep 15
              done
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {cpu: 100m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 5
