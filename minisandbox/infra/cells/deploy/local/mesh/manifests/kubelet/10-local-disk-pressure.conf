apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
# The local mesh shares the developer workstation's multi-terabyte /data
# filesystem. Percentage thresholds would require hundreds of GiB of unused
# space before a k3d node becomes schedulable again, even though the local
# qualification workloads need only a few GiB. Production Cells do not consume
# this file and retain their independently managed percentage thresholds.
evictionHard:
  imagefs.available: 1Gi
  nodefs.available: 1Gi
evictionMinimumReclaim:
  imagefs.available: "0"
  nodefs.available: "0"
evictionPressureTransitionPeriod: 30s
