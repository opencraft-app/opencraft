apiVersion: v1
kind: Service
metadata:
  name: actor-observability-federate
  namespace: observability
  labels:
    app.kubernetes.io/part-of: actor-fleet
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: prometheus
    prometheus: actor-observability-prometheus
  ports:
    - name: http-web
      port: 9090
      targetPort: http-web
      nodePort: 30090
