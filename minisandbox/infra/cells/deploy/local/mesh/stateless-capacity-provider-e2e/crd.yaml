apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: statelesscapacityrequests.local.fleet.actor.dev
spec:
  group: local.fleet.actor.dev
  scope: Namespaced
  names:
    plural: statelesscapacityrequests
    singular: statelesscapacityrequest
    kind: StatelessCapacityRequest
    shortNames: [scr]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [runID, cluster, cell, nodeName, runtimeImageID, workloadRef, podRef]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: StatelessCapacityRequest identity is immutable
              properties:
                runID: {type: string, minLength: 8, maxLength: 16}
                cluster: {type: string, minLength: 1}
                cell: {type: string, minLength: 1}
                nodeName: {type: string, minLength: 1}
                runtimeImageID: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
                workloadRef:
                  type: object
                  required: [kind, name, uid]
                  properties:
                    kind: {type: string, enum: [Deployment]}
                    name: {type: string, minLength: 1}
                    uid: {type: string, minLength: 1}
                podRef:
                  type: object
                  required: [name, uid]
                  properties:
                    name: {type: string, minLength: 1}
                    uid: {type: string, minLength: 1}
            status:
              type: object
              properties:
                observedGeneration: {type: integer, format: int64}
                phase:
                  type: string
                  enum: [Pending, Provisioning, Ready, Draining, Deleting, Deleted, Failed]
                nodeUID: {type: string, minLength: 1}
                reason: {type: string, maxLength: 512}
                lastTransitionTime: {type: string, format: date-time}
                history:
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [phase, at, reason]
                    properties:
                      phase: {type: string}
                      at: {type: string, format: date-time}
                      reason: {type: string, maxLength: 512}
