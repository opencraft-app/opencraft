name: rivet-orbstack

services:
  engine:
    image: rivetdev/engine:2.3.10
    command: start
    restart: unless-stopped
    environment:
      RIVET__FILE_SYSTEM__PATH: /var/lib/rivet-engine
    volumes:
      - engine-data:/var/lib/rivet-engine
    ports:
      - "6420:6420"
      - "6421:6421"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6421/health"]
      interval: 2s
      timeout: 10s
      retries: 15
      start_period: 10s

  runner:
    image: rivet-local/test-envoy:source
    build:
      context: .
      dockerfile: Dockerfile.runner
      additional_contexts:
        rivet-source: ../../../../..
    restart: unless-stopped
    environment:
      RIVET_ENDPOINT: http://engine:6420
      INTERNAL_SERVER_PORT: "5050"
      RIVET_POOL_NAME: test-envoy
      AUTOSTART_ENVOY: "1"
      AUTOCONFIGURE_SERVERLESS: "0"
    stop_grace_period: 4s
    ports:
      - "5050:5050"
    depends_on:
      engine:
        condition: service_healthy

volumes:
  engine-data:
    name: rivet-orbstack-data
    external: true
