apiVersion: v1
kind: ServiceAccount
metadata:
  name: actor-argocd-static
  namespace: actor-fdb-cell-system
---
apiVersion: v1
kind: Secret
metadata:
  name: actor-argocd-static-token
  namespace: actor-fdb-cell-system
  annotations:
    kubernetes.io/service-account.name: actor-argocd-static
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: actor-argocd-static
  namespace: actor-fdb-cell-system
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # Argo resource.inclusions is global to the management instance. Every
  # registered target therefore needs discovery access to all included kinds,
  # even when this static fixture never owns those resources.
  - apiGroups: ["fleet.actor.dev"]
    resources: ["rivetcells"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: actor-argocd-static
  namespace: actor-fdb-cell-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: actor-argocd-static
subjects:
  - kind: ServiceAccount
    name: actor-argocd-static
    namespace: actor-fdb-cell-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: actor-argocd-static-inventory
rules:
  - apiGroups: ["node.tke.cloud.tencent.com"]
    resources: ["machinesets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: actor-argocd-static-inventory
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: actor-argocd-static-inventory
subjects:
  - kind: ServiceAccount
    name: actor-argocd-static
    namespace: actor-fdb-cell-system
