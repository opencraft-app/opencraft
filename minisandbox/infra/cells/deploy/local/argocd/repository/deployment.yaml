apiVersion: apps/v1
kind: Deployment
metadata:
  name: actor-gitops-repository
  namespace: argocd
  labels:
    app.kubernetes.io/name: actor-gitops-repository
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: actor-gitops-repository
  template:
    metadata:
      labels:
        app.kubernetes.io/name: actor-gitops-repository
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: repository
          image: actor/argocd-local-repo:v3
          imagePullPolicy: IfNotPresent
          ports:
            - name: git
              containerPort: 9418
          readinessProbe:
            tcpSocket:
              port: git
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              memory: 96Mi
---
apiVersion: v1
kind: Service
metadata:
  name: actor-gitops-repository
  namespace: argocd
spec:
  selector:
    app.kubernetes.io/name: actor-gitops-repository
  ports:
    - name: git
      port: 9418
      targetPort: git
