apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-registry-fdb-cos-e2e
  namespace: actor-fdb-cell-system
spec:
  podSelector:
    matchLabels:
      foundationdb.org/fdb-cluster-name: local-runtime-a
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: worker-registry-fdb-cos-e2e
      ports:
        - {protocol: TCP, port: 4501}
