language = "C"
include_guard = "MINISANDBOX_H"
autogen_warning = "/* Generated by `cargo xtask header`; do not edit manually. */"
documentation = true
usize_is_size_t = true
cpp_compat = false

[enum]
prefix_with_name = true
rename_variants = "ScreamingSnakeCase"

[export.rename]
"ABI_VERSION_MAJOR" = "MINISANDBOX_ABI_VERSION_MAJOR"
"ABI_VERSION_MINOR" = "MINISANDBOX_ABI_VERSION_MINOR"
"ByteSlice" = "MinisandboxByteSlice"
"GuestFile" = "MinisandboxGuestFile"
"Handle" = "MinisandboxHandle"
"OutputCallback" = "MinisandboxOutputCallback"
"RunOptions" = "MinisandboxRunOptions"
"RuntimeOptions" = "MinisandboxRuntimeOptions"
"Status" = "MinisandboxStatus"
