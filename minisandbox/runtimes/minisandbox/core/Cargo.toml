[workspace]
members = [
    "crates/minisandbox-cli",
    "crates/minisandbox-capi",
    "crates/minisandbox-core",
    "crates/minisandbox-init",
    "crates/minisandbox-macros",
    "crates/minisandbox-pvm-sys",
    "conformance",
    "console/device",
    "console/runner",
    "block-service",
    "control-protocol",
    "stream-mailbox",
    "socket-service",
    "xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
