[package]
name = "minisandbox-block-backend"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"

[features]
default = []
fault-injection = []

[dependencies]
minisandbox-block-engine = { path = "../block-engine" }
minisandbox-cos-emulator = { path = "../cos-emulator" }
thiserror = "=2.0.20"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
