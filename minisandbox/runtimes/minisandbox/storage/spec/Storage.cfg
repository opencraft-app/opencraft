CONSTANTS
    Blocks = {"b0", "b1"}
    Values = {"A", "B"}
    Writers = {"w0", "w1"}
    MaxVersion = 2
    MaxEpoch = 2
    MaxCommits = 2
    Mutation = "None"

SPECIFICATION Spec

INVARIANTS
    TypeOK
    ObjectAuthenticity
    CbsHeadIsDurable
    VerifiedObjectsExist
    ManifestObjectsExist
    AcknowledgedDataRecoverable
    ManifestNeverRegresses
    CbsHeadNeverBehindManifest
    StaleEpochsAreFenced

