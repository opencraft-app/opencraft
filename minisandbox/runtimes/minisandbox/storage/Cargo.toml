[package]
name = "minisandbox-storage-service"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"

[workspace]
members = [
    "block-backend",
    "block-engine",
    "cos-emulator",
    "fdb-adapter",
    "nbd-frontend",
    "benchmarks/sqlite-block",
]
resolver = "3"

[features]
default = []
fault-injection = []

[dependencies]
libc = "=0.2.189"
rusqlite = { version = "=0.32.1", default-features = false, features = ["bundled", "hooks"] }
sha2 = "=0.11.0"
stateright = "=0.31.0"
thiserror = "=2.0.20"

[dev-dependencies]
tempfile = "=3.27.0"

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
