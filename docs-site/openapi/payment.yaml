openapi: 3.0.3
info:
  title: Lightclaw Payment API
  version: 0.1.0
servers:
  - url: /
paths:
  /internal/payment/orders:
    post:
      operationId: createPaymentOrder
      summary: Create an internal payment order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /internal/payment/orders/{orderId}:
    get:
      operationId: getPaymentOrder
      summary: Get a payment order
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /internal/payment/orders/{orderId}/mark-paid:
    post:
      operationId: markPaymentOrderPaid
      summary: Mark an order as paid and notify subscription service
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkPaidRequest'
      responses:
        '200':
          description: Order updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentOrder'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
components:
  responses:
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    CreateOrderRequest:
      type: object
      required:
        - externalUserId
        - code
      properties:
        externalUserId:
          type: string
        code:
          type: string
          enum: [lite, pro]
    MarkPaidRequest:
      type: object
      properties:
        providerOrderId:
          type: string
    PaymentOrder:
      type: object
      required:
        - id
        - externalUserId
        - code
        - status
        - provider
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        externalUserId:
          type: string
        code:
          type: string
        status:
          type: string
          enum: [pending, paid, failed, cancelled]
        provider:
          type: string
        providerOrderId:
          type: string
        checkoutUrl:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
