name: Restore verified owned Electron
description: Consume a selected native build run; never download a stock runtime
inputs:
  run-id:
    description: >-
      Successful Electron fork native artifacts run ID in this repository. Leave empty to use the
      newest successful run on the default or current branch built from this fork.json and args.gn.
    required: false
    default: ''
  target:
    description: Native artifact target, such as linux-x64 or macos-arm64
    required: true
  kind:
    description: browser or desktop
    default: desktop
outputs:
  distribution:
    description: Verified absolute distribution directory
    value: ${{ steps.paths.outputs.distribution }}
runs:
  using: composite
  steps:
    - id: run
      shell: bash
      env:
        PINNED_RUN_ID: ${{ inputs.run-id }}
        ARTIFACT_TARGET: ${{ inputs.target }}
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_API_URL: ${{ github.api_url }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        CURRENT_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        if test -n "$PINNED_RUN_ID"; then
          echo "Using pinned native artifacts run $PINNED_RUN_ID"
          echo "id=$PINNED_RUN_ID" >> "$GITHUB_OUTPUT"
        else
          id="$(node scripts/ci/resolve-electron-artifact-run.mjs "$ARTIFACT_TARGET")"
          echo "Using native artifacts run $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
        fi
    - shell: bash
      env:
        NATIVE_RUN_ID: ${{ steps.run.outputs.id }}
        ARTIFACT_KIND: ${{ inputs.kind }}
        ARTIFACT_TARGET: ${{ inputs.target }}
        GH_TOKEN: ${{ github.token }}
        GH_REPOSITORY: ${{ github.repository }}
        GH_API_URL: ${{ github.api_url }}
      run: |
        if ! [[ "$NATIVE_RUN_ID" =~ ^[0-9]+$ ]]; then
          echo 'The native artifacts run ID must be numeric.' >&2
          exit 1
        fi
        if ! [[ "$ARTIFACT_KIND" =~ ^(browser|desktop)$ && "$ARTIFACT_TARGET" =~ ^(linux-x64|windows-x64|macos-arm64|macos-x64)$ ]]; then
          echo 'Unsupported native artifact kind or target.' >&2
          exit 1
        fi
        node --input-type=module - <<'JS'
        const response = await fetch(`${process.env.GH_API_URL}/repos/${process.env.GH_REPOSITORY}/actions/runs/${process.env.NATIVE_RUN_ID}`, {
          headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' },
        });
        if (!response.ok) throw new Error(`Cannot read selected native build run (${response.status})`);
        const run = await response.json();
        if (run.path !== '.github/workflows/electron-native-artifacts.yml' || run.conclusion !== 'success'
          || run.head_repository?.full_name !== process.env.GH_REPOSITORY)
          throw new Error('Select a successful Electron fork native artifacts run');
        JS
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: opencraft-electron-${{ inputs.target }}
        run-id: ${{ steps.run.outputs.id }}
        github-token: ${{ github.token }}
        path: ${{ runner.temp }}/owned-electron-download-${{ inputs.kind }}-${{ inputs.target }}
    - id: paths
      shell: bash
      env:
        ARTIFACT_KIND: ${{ inputs.kind }}
        ARTIFACT_TARGET: ${{ inputs.target }}
      run: |
        distribution="$RUNNER_TEMP/owned-electron-$ARTIFACT_KIND-$ARTIFACT_TARGET"
        python3 vendor/electron/restore-artifact.py \
          --directory "$RUNNER_TEMP/owned-electron-download-$ARTIFACT_KIND-$ARTIFACT_TARGET" \
          --distribution "$distribution" --kind "$ARTIFACT_KIND"
        node scripts/build/verify-owned-electron-artifact.mjs "$ARTIFACT_KIND" "$ARTIFACT_TARGET" "$distribution" vendor/electron/fork.json
        if test "$ARTIFACT_KIND" = browser; then
          echo "OPENCRAFT_BROWSER_ELECTRON_DISTRIBUTION=$distribution" >> "$GITHUB_ENV"
        else
          echo "OPENCRAFT_ELECTRON_DISTRIBUTION=$distribution" >> "$GITHUB_ENV"
        fi
        echo "distribution=$distribution" >> "$GITHUB_OUTPUT"
