version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    ignore:
      # Pinned: scripts/patch-novnc-desktop-events.mjs patches this exact release
      # (checked by hash). Upgrade it by hand together with that patch and a
      # cloud-desktop check, never as part of a grouped bump.
      - dependency-name: "@novnc/novnc"
    groups:
      compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /runtime/dsh
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /apps/bridges/hermes
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compatible:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      compatible-actions:
        patterns: ["*"]
        update-types: [minor, patch]
