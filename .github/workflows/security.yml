name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output checksums.txt "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt | sha256sum --check --status
          tar -xzf "$archive" gitleaks
      - name: Scan source
        run: '"${{ runner.temp }}/gitleaks" dir . --redact --no-banner --config .gitleaks.toml'

  dependency-audit:
    needs: plan
    if: needs.plan.outputs.has-audits == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.plan.outputs.audits) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - run: npm audit --audit-level=high

  managed-web:
    needs: plan
    if: needs.plan.outputs.managed-web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - run: npm run typecheck --workspace @opencraft/workbench-web
      - run: npm run test:web-release
      - run: npm run test:web-updates
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web-updates:e2e

  security-checks:
    if: always()
    needs: [plan, secrets, dependency-audit, managed-web]
    runs-on: ubuntu-latest
    steps:
      - name: Require selected security checks to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          WEB_RESULT: ${{ needs.managed-web.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SECRETS_RESULT" = success
          for result in "$AUDIT_RESULT" "$WEB_RESULT"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
