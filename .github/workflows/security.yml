name: security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output checksums.txt "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt | sha256sum --check --status
          tar -xzf "$archive" gitleaks
      - name: Scan source
        run: '"${{ runner.temp }}/gitleaks" dir . --redact --no-banner --config .gitleaks.toml'
      - name: Scan reachable commit history
        run: '"${{ runner.temp }}/gitleaks" git . --log-opts=--all --redact --no-banner --config .gitleaks.toml'

  dependency-audit:
    needs: plan
    if: needs.plan.outputs.has-audits == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.plan.outputs.audits) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - name: Audit dependencies and retain findings
        env:
          NPM_AUDIT_REPORT_ONLY: 'true'
          NPM_AUDIT_REPORT: ${{ runner.temp }}/npm-audit.json
        run: node "$GITHUB_WORKSPACE/scripts/dependency-audit.mjs"
      - name: Retain complete dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/npm-audit.json
          retention-days: 3
          if-no-files-found: warn

  managed-web:
    needs: plan
    if: needs.plan.outputs.managed-web == 'true'
    runs-on: ubuntu-latest
    # Slow system-package mirrors can consume most of the setup budget.
    # Leave time for the full browser suite after Chromium is installed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - run: npm run typecheck --workspace @opencraft/workbench-web
      - run: npm run test:web-release
      - run: npm run test:web-updates
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web-updates:e2e

  security-checks:
    if: always()
    needs: [plan, secrets, dependency-audit, managed-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require selected security checks to succeed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          WEB_RESULT: ${{ needs.managed-web.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$SECRETS_RESULT" = success
          for result in "$AUDIT_RESULT" "$WEB_RESULT"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
