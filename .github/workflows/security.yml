name: security

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "41 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admission:
    uses: ./.github/workflows/contribution-admission.yml

  plan:
    needs: admission
    uses: ./.github/workflows/ci-plan.yml

  secrets:
    needs: admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -B -m unittest discover -s scripts/tests -p test_contribution_admission.py
      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output checksums.txt "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt | sha256sum --check --status
          tar -xzf "$archive" gitleaks
      - name: Test downstream contribution boundary
        env:
          GITLEAKS_TEST_BIN: ${{ runner.temp }}/gitleaks
        run: python3 -B -m unittest discover -s scripts/tests -p test_contribute_upstream.py
      - name: Test downstream boundary audit
        run: python3 -B -m unittest discover -s scripts/tests -p test_downstream_boundary.py
      - name: Scan source
        run: '"${{ runner.temp }}/gitleaks" dir . --redact --no-banner --config .gitleaks.toml'
      - name: Scan reachable commit history
        # checkout fetches every remote branch at depth 0. Scanning --all lets an
        # unrelated branch fail every pull request; HEAD still covers the full
        # history reachable from the pull request's synthetic merge commit.
        run: '"${{ runner.temp }}/gitleaks" git . --log-opts=HEAD --redact --no-banner --config .gitleaks.toml'

  dependency-audit:
    needs: plan
    if: needs.plan.outputs.has-audits == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        directory: ${{ fromJSON(needs.plan.outputs.audits) }}
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - name: Audit dependencies and retain findings
        env:
          NPM_AUDIT_REPORT_ONLY: 'true'
          NPM_AUDIT_REPORT: ${{ runner.temp }}/npm-audit.json
        run: node "$GITHUB_WORKSPACE/scripts/check/dependency-audit.mjs"
      - name: Retain complete dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-audit-${{ strategy.job-index }}
          path: ${{ runner.temp }}/npm-audit.json
          retention-days: 3
          if-no-files-found: warn

  managed-web:
    needs: plan
    if: needs.plan.outputs.managed-web == 'true'
    name: managed-web (${{ matrix.suite }})
    runs-on: ubuntu-latest
    # Slow system-package mirrors can consume most of the setup budget.
    # Leave time for the full browser suite after Chromium is installed.
    timeout-minutes: 30
    # Three independent groups run side by side instead of one 9-minute series.
    # The browser smokes serve the source through Vite, so they do not need the
    # release build the e2e group makes. Within a group every suite still runs
    # after an earlier one fails, so one failure does not hide the next.
    strategy:
      fail-fast: false
      matrix:
        suite: [release, browser-e2e, browser-smoke]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: dependencies
        run: npm ci --no-audit --no-fund
      - run: git diff --exit-code -- package-lock.json
      - run: npm run typecheck --workspace @opencraft/workbench-web
        if: always() && steps.dependencies.outcome == 'success' && matrix.suite == 'release'
      - run: npm run test:web-release
        if: always() && steps.dependencies.outcome == 'success' && matrix.suite == 'release'
      - run: npm run test:web-updates
        if: always() && steps.dependencies.outcome == 'success' && matrix.suite == 'release'
      - id: browser
        run: bash scripts/ci/install-playwright-chromium.sh
        if: matrix.suite != 'release'
      - run: npm run test:web-updates:e2e
        if: always() && steps.browser.outcome == 'success' && matrix.suite == 'browser-e2e'
      - run: npm run smoke:attachment-upload-recovery
        if: always() && steps.browser.outcome == 'success' && matrix.suite == 'browser-smoke'
      - run: npm run smoke:image-metadata-preview
        if: always() && steps.browser.outcome == 'success' && matrix.suite == 'browser-smoke'
      - run: npm run smoke:offline-startup-continuity
        if: always() && steps.browser.outcome == 'success' && matrix.suite == 'browser-smoke'
      - run: npm run test:queue-delivery-retry
        if: always() && steps.dependencies.outcome == 'success' && matrix.suite == 'browser-smoke'
      - run: npm run smoke:queue-delivery-retry
        if: always() && steps.browser.outcome == 'success' && matrix.suite == 'browser-smoke'

  security-checks:
    if: always()
    needs: [admission, plan, secrets, dependency-audit, managed-web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require selected security checks to succeed
        env:
          ADMISSION_RESULT: ${{ needs.admission.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          SECRETS_RESULT: ${{ needs.secrets.result }}
          AUDIT_RESULT: ${{ needs.dependency-audit.result }}
          WEB_RESULT: ${{ needs.managed-web.result }}
        run: |
          test "$ADMISSION_RESULT" = success
          test "$PLAN_RESULT" = success
          test "$SECRETS_RESULT" = success
          for result in "$AUDIT_RESULT" "$WEB_RESULT"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
