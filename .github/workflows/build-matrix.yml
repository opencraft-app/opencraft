name: build-matrix

on:
  pull_request:
  # Each merge is tested again on main: PRs that each passed against an older
  # main are only tested together here, right after they land.
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      validation:
        description: Validation scope (non-Web platforms are opt-in)
        type: choice
        options: [web, full]
        default: web
      package_macos:
        description: Build the macOS DMG (also selects full validation)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  # A newer PR commit replaces the old run; each main commit keeps its own run,
  # so a regression points at the merge that introduced it.
  group: build-matrix-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    uses: ./.github/workflows/ci-plan.yml
    with:
      full-matrix: ${{ github.event_name == 'workflow_dispatch' && (inputs.validation == 'full' || inputs.package_macos) }}

  hover-policy:
    runs-on: ubuntu-latest
    # Slow system-package mirrors must leave time for the browser smoke checks.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: dependencies
        run: npm ci --no-audit --no-fund
      - run: npm run check:hover
      - run: npm run test:hover-policy
        if: always() && steps.dependencies.outcome == 'success'
      - id: browser
        run: bash scripts/ci/install-playwright-chromium.sh
        if: always() && steps.dependencies.outcome == 'success'
      - run: npm run smoke:touch-hover
        if: always() && steps.browser.outcome == 'success'

  portable:
    needs: plan
    if: needs.plan.outputs.has-builds == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Check project internationalization
        run: npm run check:i18n && npm run test:i18n
        if: matrix.target == 'web-browser'
      - run: npm run test:react-runtime
        if: matrix.target == 'web-browser'
      - run: npm run typecheck --workspace @opencraft/workbench-web
        if: matrix.target == 'web-browser'
      - run: npm run matrix:check
      - run: npm run matrix:build -- "$MATRIX_TARGET"
        env:
          MATRIX_TARGET: ${{ matrix.target }}
      - name: Browser bootstrap regression (current engine)
        if: matrix.target == 'web-browser'
        run: |
          bash scripts/ci/install-playwright-chromium.sh
          npm run smoke:browser-bootstrap
          npm run smoke:subagent-activity
          npm run smoke:queue-markdown
      - name: Browser bootstrap regression (Chrome 116)
        if: matrix.target == 'web-browser'
        env:
          OPENCRAFT_EXPECT_CHROMIUM_MAJOR: '116'
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://storage.googleapis.com/chrome-for-testing-public/116.0.5845.96/linux64/chrome-linux64.zip \
            --output "$RUNNER_TEMP/chrome116.zip"
          unzip -q "$RUNNER_TEMP/chrome116.zip" -d "$RUNNER_TEMP/chrome116"
          OPENCRAFT_CHROMIUM_EXECUTABLE="$RUNNER_TEMP/chrome116/chrome-linux64/chrome" npm run smoke:browser-bootstrap

  extensions:
    needs: plan
    if: needs.plan.outputs.extensions == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:extension-example
      - run: npm run test:extensions
      - run: npm run test:extension-storage
      - run: npm run typecheck --workspace @opencraft/extension-contract
      - run: npm run typecheck --workspace @opencraft/extension-runtime
      - run: npm exec -- tsc --ignoreConfig --allowJs --checkJs --strict --noEmit --module ESNext --moduleResolution Bundler --target ES2022 --skipLibCheck examples/extensions/hello.mjs

  macos-native:
    needs: plan
    if: needs.plan.outputs.native == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.package_macos)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:identity
      - run: npm run build:electron:host
      - run: npm run test:native-speech

  macos-electron:
    needs: plan
    if: github.event_name == 'workflow_dispatch' && inputs.package_macos
    runs-on: macos-15
    timeout-minutes: 30
    env:
      OPENCRAFT_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
      OPENCRAFT_SOURCE_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:identity
      - run: npm run prepare:dsh-runtime
      - run: npm run smoke:local-agent
      - run: npm run build:electron:release
      - uses: ./.github/actions/owned-electron
        with:
          run-id: ${{ vars.OPENCRAFT_ELECTRON_ARTIFACT_RUN_ID }}
          target: macos-arm64
      - name: Package an ad-hoc signed CI DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: node scripts/packaging/package-electron-desktop.mjs --mac dmg --config.mac.identity=- --config.forceCodeSigning=true
      - name: Verify and launch the app from the final DMG
        env:
          OPENCRAFT_SMOKE_OUTPUT: ${{ runner.temp }}/opencraft-macos-smoke
        run: node scripts/smoke/desktop/smoke-macos-dmg.mjs apps/desktop/release/OpenCraft-*.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: electron-macos-smoke
          path: ${{ runner.temp }}/opencraft-macos-smoke
          retention-days: 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: electron-macos-native
          path: apps/desktop/release/OpenCraft-*
          retention-days: 3

  linux-headless:
    needs: plan
    if: needs.plan.outputs.headless-tests == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check:storage && npm run test:sqlite-node
      - name: AppServer client protocol and connection lifetime
        run: npm run test:appserver-client
      - name: DSH routing Worker persistence and network liveness
        run: npx tsx --test tests/execution/dsh-session-routing-worker.test.ts
      - name: Codex account Core operator lease
        run: npx tsx --test tests/execution/fence-operator-lease.test.ts
      - run: npm run test:headless-server
      - uses: ./.github/actions/owned-electron
        if: needs.plan.outputs.headless-package == 'true'
        with:
          run-id: ${{ vars.OPENCRAFT_ELECTRON_ARTIFACT_RUN_ID }}
          target: linux-x64
          kind: browser
      - name: Protected full-target pin copy and installer regressions
        run: sudo "$(command -v node)" --test tests/execution/full-parent.test.mjs tests/execution/full-install-parent.test.mjs
      - run: npm run matrix:build -- headless-linux-amd64-tar
        if: needs.plan.outputs.headless-package == 'true'
      - run: npm run smoke:headless:linux
        if: needs.plan.outputs.headless-package == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.headless-package == 'true'
        with:
          name: headless-linux-amd64-tar
          path: release/OpenCraft-server-*-linux-amd64.tar.gz
          retention-days: 3

  # Every product change runs the full typecheck and each `npm test` suite.
  # Suites are separate steps so one failure cannot hide the others.
  core-tests:
    needs: plan
    if: needs.plan.outputs.has-builds == 'true' || needs.plan.outputs.headless-tests == 'true'
    name: core-tests (${{ matrix.part }})
    runs-on: ubuntu-latest
    # Two halves run side by side: static checks (typecheck alone is ~2.5 min)
    # and the test suites. build-checks reads their combined result.
    strategy:
      fail-fast: false
      matrix:
        part: [static, tests]
    # Each suite has its own limit so a hang fails that step with its log kept,
    # instead of cancelling the job and losing every log.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit's first parent is the base the format check compares against.
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: dependencies
        run: npm ci --no-audit --no-fund
      # From here on every test file gets a private HOME/TMPDIR, and processes a
      # test leaves running fail the run (tests/support/test-isolation.mjs). It is
      # set after checkout because the actions themselves run on Node.
      - name: Enable test isolation
        run: |
          isolation_env="$(mktemp "$RUNNER_TEMP/opencraft-isolation.XXXXXX")"
          printf 'export NODE_OPTIONS=%q\n' "--import $GITHUB_WORKSPACE/tests/support/test-isolation.mjs --test-global-setup=$GITHUB_WORKSPACE/tests/support/test-isolation-global.mjs" > "$isolation_env"
          echo "BASH_ENV=$isolation_env" >> "$GITHUB_ENV"
      - name: Format files this pull request adds
        run: npm run check:format -- --base HEAD^1
        if: always() && steps.dependencies.outcome == 'success' && github.event_name == 'pull_request' && matrix.part == 'static'
      - name: Lint files this pull request adds
        run: npm run lint:changed -- --base HEAD^1
        if: always() && steps.dependencies.outcome == 'success' && github.event_name == 'pull_request' && matrix.part == 'static'
      # Same system packages as Claude Code cloud sessions (.claude/hooks/session-start.sh).
      - name: Ensure system packages for Git identity and token tests
        run: bash scripts/ci/setup-toolchain.sh system
        if: matrix.part == 'tests'
      - name: Install Chromium for browser-backed unit tests
        run: bash scripts/ci/install-playwright-chromium.sh
        if: matrix.part == 'tests'
      - id: dsh
        run: npm run prepare:dsh-runtime
        if: always() && steps.dependencies.outcome == 'success'
      - run: npm run typecheck
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'static'
        timeout-minutes: 15
      - run: npm run check:boundaries
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'static'
        timeout-minutes: 10
      - run: npm run test:cli
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:storage-ports
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:storage-ports:workerd
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:installation-core:workerd
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:client-do:workerd
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:login-entry:workerd
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:relay-hub:workerd
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:sqlite-node
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:local-agent-storage
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:control-standards
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:identity
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:extensions
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:connectors
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:appserver
        if: always() && steps.dsh.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:dsh-bridge
        if: always() && steps.dsh.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:chat
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:adaptive-navigation
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:text-selection
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10
      - run: npm run test:workbench:unit
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'tests'
        timeout-minutes: 10

  # Suites that npm run gate requires but npm test does not include. They run
  # in parallel with core-tests so neither job grows; each step keeps its log.
  # Sharded by measured step time so no shard holds the critical path alone;
  # every step belongs to exactly one part (tests/tooling/ci-workflows.test.mjs).
  gate-tests:
    name: gate-tests (${{ matrix.part }})
    needs: plan
    if: needs.plan.outputs.has-builds == 'true' || needs.plan.outputs.headless-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        part: [runtime, convergence, platform]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: dependencies
        run: npm ci --no-audit --no-fund
      # Same isolation as core-tests: private HOME/TMPDIR, leaked processes fail.
      - name: Enable test isolation
        run: |
          isolation_env="$(mktemp "$RUNNER_TEMP/opencraft-isolation.XXXXXX")"
          printf 'export NODE_OPTIONS=%q\n' "--import $GITHUB_WORKSPACE/tests/support/test-isolation.mjs --test-global-setup=$GITHUB_WORKSPACE/tests/support/test-isolation-global.mjs" > "$isolation_env"
          echo "BASH_ENV=$isolation_env" >> "$GITHUB_ENV"
      # Same system packages as Claude Code cloud sessions (.claude/hooks/session-start.sh).
      - name: Ensure system packages for Git identity and token tests
        run: bash scripts/ci/setup-toolchain.sh system
      - name: Install Chromium for browser-backed unit tests
        run: bash scripts/ci/install-playwright-chromium.sh
      - run: npm run test:controls
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:typography
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:sandbox
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:assistant-runtime
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 20
      - run: npm run test:convergence
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'convergence'
        timeout-minutes: 30
      - run: npm run test:cloud-desktop
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10
      - run: npm run test:electron-launch
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'convergence'
        timeout-minutes: 10
      - run: npm run test:file-preview
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:projects
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10
      - run: npm run test:tasks
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10
      - run: npm run test:schedules
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:thread-lifecycle
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10
      - run: npm run test:hunyuan-speech
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:startup
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:appserver:lab
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:mcp-apps
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:shell-space
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:workspace-presentation
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:environments
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:desktop-login
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'runtime'
        timeout-minutes: 10
      - run: npm run test:relay
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'convergence'
        timeout-minutes: 10
      - run: npm run test:hub-network
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10
      - run: npm run test:identity-storage
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'convergence'
        timeout-minutes: 10
      - run: npm run test:actors
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10
      - run: npm run test:human-auth
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'convergence'
        timeout-minutes: 10
      - run: npm run test:codex-core
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10
      - name: Startup cache evidence
        run: npm run build:preview-bridge && npm run check:startup:cache
        if: always() && steps.dependencies.outcome == 'success' && matrix.part == 'platform'
        timeout-minutes: 10

  build-checks:
    if: always()
    needs: [plan, portable, extensions, macos-native, macos-electron, linux-headless, core-tests, gate-tests, hover-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require selected builds to succeed
        env:
          EXTENSIONS_RESULT: ${{ needs.extensions.result }}
          EXTENSIONS_SELECTED: ${{ needs.plan.outputs.extensions }}
          HOVER_RESULT: ${{ needs.hover-policy.result }}
          PLAN_RESULT: ${{ needs.plan.result }}
          BUILD_RESULT: ${{ needs.portable.result }}
          NATIVE_RESULT: ${{ needs.macos-native.result }}
          PACKAGE_RESULT: ${{ needs.macos-electron.result }}
          HEADLESS_RESULT: ${{ needs.linux-headless.result }}
          BUILD_SELECTED: ${{ needs.plan.outputs.has-builds }}
          NATIVE_SELECTED: ${{ needs.plan.outputs.native == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.package_macos) }}
          PACKAGE_SELECTED: ${{ github.event_name == 'workflow_dispatch' && inputs.package_macos }}
          HEADLESS_SELECTED: ${{ needs.plan.outputs.headless-tests }}
          CORE_RESULT: ${{ needs.core-tests.result }}
          CORE_SELECTED: ${{ needs.plan.outputs.has-builds == 'true' || needs.plan.outputs.headless-tests == 'true' }}
          GATE_RESULT: ${{ needs.gate-tests.result }}
        run: |
          test "$PLAN_RESULT" = success
          test "$HOVER_RESULT" = success
          require_selected() {
            if [ "$1" = true ]; then
              test "$2" = success
            else
              test "$1" = false && test "$2" = skipped
            fi
          }
          require_selected "$EXTENSIONS_SELECTED" "$EXTENSIONS_RESULT"
          require_selected "$BUILD_SELECTED" "$BUILD_RESULT"
          require_selected "$NATIVE_SELECTED" "$NATIVE_RESULT"
          require_selected "$PACKAGE_SELECTED" "$PACKAGE_RESULT"
          require_selected "$HEADLESS_SELECTED" "$HEADLESS_RESULT"
          require_selected "$CORE_SELECTED" "$CORE_RESULT"
          require_selected "$CORE_SELECTED" "$GATE_RESULT"
