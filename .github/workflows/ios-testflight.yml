name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      check_build:
        description: Inspect this existing build number without creating or uploading an IPA
        required: false
        type: string
      check_version:
        description: Marketing version for check_build (defaults to the current app version)
        required: false
        type: string
      check_availability:
        description: Wait for and require external TestFlight availability after uploading
        type: boolean
        default: true
      distribute:
        description: Add the uploaded (or check_build) build to the external group and submit it for beta review
        type: boolean
        default: false
  # The app release uploads its build here. Beta review can take hours, so a
  # release does not wait for external availability.
  workflow_call:
    inputs:
      check_availability:
        type: boolean
        default: false
      distribute:
        type: boolean
        default: false
      release_tag:
        description: Release whose notes the build's "What to Test" links to
        type: string
        default: ""
    outputs:
      version:
        description: Marketing version of the uploaded build
        value: ${{ jobs.build.outputs.version }}
      number:
        description: Build number of the uploaded build
        value: ${{ jobs.build.outputs.number }}
    secrets:
      ASC_API_KEY_ID:
        required: true
      ASC_API_ISSUER_ID:
        required: true
      ASC_API_PRIVATE_KEY_BASE64:
        required: true
      APPLE_TEAM_ID:
        required: true
      IOS_CERTIFICATE_P12_BASE64:
        required: true
      IOS_CERTIFICATE_PASSWORD:
        required: true
      IOS_PROVISIONING_PROFILE_BASE64:
        required: true

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'opencraft-app/opencraft' && github.ref == 'refs/heads/main' && !inputs.check_build
    runs-on: macos-26
    timeout-minutes: 70
    environment: ios-testflight
    outputs:
      version: ${{ steps.plan.outputs.version }}
      number: ${{ steps.plan.outputs.number }}
    env:
      BUNDLE_ID: app.opencraft
      APP_STORE_APP_ID: ${{ vars.OPENCRAFT_IOS_APP_STORE_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Plan the next iOS build
        id: plan
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
        run: node scripts/release/testflight-ios.mjs plan
      - name: Install dependencies
        run: |
          [[ "$APP_STORE_APP_ID" =~ ^[0-9]+$ ]]
          xcodebuild -version
          npm ci --no-audit --no-fund
      - name: Install iOS signing assets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          umask 077
          signing_dir="$RUNNER_TEMP/opencraft-ios-signing"
          keychain="$signing_dir/signing.keychain-db"
          mkdir "$signing_dir"
          test -n "$APPLE_TEAM_ID" && test -n "$IOS_CERTIFICATE_PASSWORD"
          printf '%s' "$IOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$signing_dir/distribution.p12"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | /usr/bin/base64 -D > "$signing_dir/app.mobileprovision"
          security cms -D -i "$signing_dir/app.mobileprovision" > "$signing_dir/profile.plist"
          profile_value() { /usr/libexec/PlistBuddy -c "Print :$1" "$signing_dir/profile.plist"; }
          test "$(profile_value Name)" = 'OpenCraft TestFlight CI'
          test "$(profile_value Entitlements:application-identifier)" = "$APPLE_TEAM_ID.$BUNDLE_ID"
          test "$(profile_value Entitlements:get-task-allow)" = false
          profile_dir="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$profile_dir"
          profile_uuid="$(profile_value UUID)"
          [[ "$profile_uuid" =~ ^[0-9A-Fa-f-]{36}$ ]]
          install -m 600 "$signing_dir/app.mobileprovision" "$profile_dir/$profile_uuid.mobileprovision"
          keychain_password="$(openssl rand -hex 32)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$signing_dir/distribution.p12" -k "$keychain" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep 'Apple Distribution:' > /dev/null
          rm "$signing_dir/distribution.p12"
      - name: Archive and export OpenCraft
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          OPENCRAFT_IOS_RELEASE: '1'
          OPENCRAFT_IOS_BUILD_NUMBER: ${{ steps.plan.outputs.number }}
          OPENCRAFT_IOS_EXPORT_METHOD: app-store-connect
        run: npm run build:expo:ios:ipa
      - name: Verify exported iOS application
        env:
          IOS_VERSION: ${{ steps.plan.outputs.version }}
          IOS_BUILD_NUMBER: ${{ steps.plan.outputs.number }}
        run: |
          ipa="$PWD/apps/mobile/release/OpenCraft-ios-testflight.ipa"
          inspection="$(mktemp -d "$RUNNER_TEMP/opencraft-ios-verify.XXXXXX")"
          unzip -q "$ipa" -d "$inspection"
          application="$(find "$inspection/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$application"
          plist_value() { /usr/libexec/PlistBuddy -c "Print :$1" "$application/Info.plist"; }
          test "$(plist_value CFBundleIdentifier)" = "$BUNDLE_ID"
          test "$(plist_value CFBundleVersion)" = "$IOS_BUILD_NUMBER"
          version="$(plist_value CFBundleShortVersionString)"
          test "$version" = "$IOS_VERSION"
          # Export compliance is declared in the app (only exempt encryption), so TestFlight
          # does not hold each build for a manual answer.
          test "$(plist_value ITSAppUsesNonExemptEncryption)" = "false"
          test -s "$application/main.jsbundle"
          codesign --verify --deep --strict "$application"
      - name: Seal the verified IPA for retention
        env:
          IOS_VERSION: ${{ steps.plan.outputs.version }}
          IOS_BUILD_NUMBER: ${{ steps.plan.outputs.number }}
          ARCHIVE_CERTIFICATE_BASE64: ${{ vars.OPENCRAFT_IOS_IPA_ARCHIVE_CERTIFICATE_BASE64 }}
        run: |
          umask 077
          ipa="$PWD/apps/mobile/release/OpenCraft-ios-testflight.ipa"
          archive="$RUNNER_TEMP/opencraft-testflight-archive"
          mkdir "$archive"
          cert="$(mktemp "$RUNNER_TEMP/opencraft-ipa-recipient.XXXXXX")"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$ARCHIVE_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$cert"
          /usr/bin/openssl x509 -checkend 0 -in "$cert" -noout
          name="OpenCraft-$IOS_VERSION-$IOS_BUILD_NUMBER.ipa"
          /usr/bin/openssl cms -encrypt -binary -aes256 -outform DER -in "$ipa" -out "$archive/$name.cms" "$cert"
          (
            cd "$archive"
            digest="$(shasum -a 256 "$ipa" | cut -d ' ' -f 1)"
            printf '%s  %s\n' "$digest" "$name" > IPA-SHA256SUMS.txt
            shasum -a 256 "$name.cms" > ARCHIVE-SHA256SUMS.txt
            jq -n --arg bundleId "$BUNDLE_ID" --arg version "$IOS_VERSION" --arg number "$IOS_BUILD_NUMBER" \
              --arg commit "$GITHUB_SHA" --arg sha256 "$digest" --arg archive "$name.cms" \
              '{bundleId:$bundleId,version:$version,number:$number,commit:$commit,sha256:$sha256,archive:$archive}' > manifest.json
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencraft-testflight-${{ steps.plan.outputs.version }}-${{ steps.plan.outputs.number }}
          path: ${{ runner.temp }}/opencraft-testflight-archive/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Upload the IPA to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          IOS_VERSION: ${{ steps.plan.outputs.version }}
          IOS_BUILD_NUMBER: ${{ steps.plan.outputs.number }}
        run: |
          umask 077
          [[ "$ASC_API_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]
          [[ "$ASC_API_ISSUER_ID" =~ ^[0-9a-fA-F-]{36}$ ]]
          api_dir="$(mktemp -d "$RUNNER_TEMP/opencraft-asc.XXXXXX")"
          api_key="$api_dir/AuthKey_$ASC_API_KEY_ID.p8"
          trap 'rm -f "$api_key"; rmdir "$api_dir"' EXIT
          printf '%s' "$ASC_API_PRIVATE_KEY_BASE64" | /usr/bin/base64 -D > "$api_key"
          test -s "$api_key"
          xcrun altool --upload-package apps/mobile/release/OpenCraft-ios-testflight.ipa \
            --platform ios --apple-id "$APP_STORE_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-short-version-string "$IOS_VERSION" --bundle-version "$IOS_BUILD_NUMBER" \
            --api-key "$ASC_API_KEY_ID" --api-issuer "$ASC_API_ISSUER_ID" --p8-file-path "$api_key" \
            --output-format normal
          printf 'Uploaded **OpenCraft %s (%s)** for %s.\n' "$IOS_VERSION" "$IOS_BUILD_NUMBER" "$BUNDLE_ID" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the temporary signing keychain
        if: always()
        run: |
          signing_dir="$RUNNER_TEMP/opencraft-ios-signing"
          keychain="$signing_dir/signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi

  status:
    needs: build
    if: >-
      !cancelled() && github.repository == 'opencraft-app/opencraft' &&
      github.ref == 'refs/heads/main' &&
      (inputs.check_build || (inputs.check_availability && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ios-testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Check the exact build's external TestFlight availability
        env:
          APP_STORE_APP_ID: ${{ vars.OPENCRAFT_IOS_APP_STORE_APP_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          IOS_VERSION: ${{ inputs.check_build && inputs.check_version || needs.build.outputs.version }}
          IOS_BUILD_NUMBER: ${{ inputs.check_build || needs.build.outputs.number }}
          OPENCRAFT_TESTFLIGHT_GROUP: ${{ vars.OPENCRAFT_TESTFLIGHT_GROUP }}
          TESTFLIGHT_STATUS_FILE: ${{ runner.temp }}/testflight-status.json
        run: node scripts/release/testflight-ios.mjs status
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: opencraft-testflight-status-${{ github.run_attempt }}
          path: ${{ runner.temp }}/testflight-status.json
          retention-days: 30
          if-no-files-found: warn

  # Beta review can take hours, so this does not wait for it, and a failure here
  # does not fail the release: the status job and a later dispatch report it.
  distribute:
    needs: build
    if: >-
      !cancelled() && inputs.distribute && github.repository == 'opencraft-app/opencraft' &&
      github.ref == 'refs/heads/main' &&
      (inputs.check_build || needs.build.result == 'success')
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: ios-testflight
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Add the build to the external group and submit it for beta review
        env:
          APP_STORE_APP_ID: ${{ vars.OPENCRAFT_IOS_APP_STORE_APP_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY_BASE64: ${{ secrets.ASC_API_PRIVATE_KEY_BASE64 }}
          IOS_VERSION: ${{ inputs.check_build && inputs.check_version || needs.build.outputs.version }}
          IOS_BUILD_NUMBER: ${{ inputs.check_build || needs.build.outputs.number }}
          OPENCRAFT_TESTFLIGHT_GROUP: ${{ vars.OPENCRAFT_TESTFLIGHT_GROUP }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TESTFLIGHT_STATUS_FILE: ${{ runner.temp }}/testflight-distribution.json
        run: node scripts/release/testflight-ios.mjs distribute
