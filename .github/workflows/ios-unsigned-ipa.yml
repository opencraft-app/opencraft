name: iOS unsigned IPA

# Builds the iOS app without any signing, for people who sign it with their own
# Apple ID (AltStore, SideStore). It needs no secrets, so any branch may run it.
# The signed TestFlight build is the iOS TestFlight workflow's job.
on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ipa:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Release packages must not depend on a cache a pull request could write.
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Archive without signing
        env:
          OPENCRAFT_IOS_RELEASE: '1'
          OPENCRAFT_IOS_EXPORT_METHOD: unsigned
        run: npm run build:expo:ios:ipa
      - name: Verify the unsigned application
        run: |
          ipa="$PWD/apps/mobile/release/OpenCraft-ios-unsigned.ipa"
          (cd apps/mobile && shasum -a 256 -c release/OpenCraft-ios-unsigned.ipa.sha256)
          inspection="$(mktemp -d "$RUNNER_TEMP/opencraft-ios-unsigned.XXXXXX")"
          unzip -q "$ipa" -d "$inspection"
          application="$(find "$inspection/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -n "$application"
          plist_value() { /usr/libexec/PlistBuddy -c "Print :$1" "$application/Info.plist"; }
          test "$(plist_value CFBundleIdentifier)" = "$(jq -er .expo.ios.bundleIdentifier apps/mobile/app.json)"
          test "$(plist_value CFBundleShortVersionString)" = "$(jq -er .expo.version apps/mobile/app.json)"
          test -s "$application/main.jsbundle"
          # Unsigned means no signature and no provisioning profile to leak.
          test ! -e "$application/_CodeSignature"
          test ! -e "$application/embedded.mobileprovision"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencraft-ios-unsigned-${{ github.sha }}
          path: |
            apps/mobile/release/OpenCraft-ios-unsigned.ipa
            apps/mobile/release/OpenCraft-ios-unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 14
