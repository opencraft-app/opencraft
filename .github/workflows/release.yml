# This filename and npm-release Environment are part of the Trusted Publisher identity.
name: Release OpenCraft

on:
  push:
    branches: [main]
    paths: [packaging/web-server/package.json]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  NPM_VERSION: 11.18.0
  NPM_REGISTRY: https://registry.npmjs.org/
  KIT: .github/secure-release/v1/secure_release.py

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.request.outputs.tag }}
      publish: ${{ steps.request.outputs.publish }}
    steps:
      - name: Check out the main event commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Test release selection
        run: node --test tests/release-request.test.mjs
      - name: Select the exact release request
        id: request
        run: node scripts/release-request.mjs
      - name: Create an immutable automatic version tag
        if: steps.request.outputs.create-tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.request.outputs.tag }}
        run: |
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$GITHUB_SHA"
          fi

  preflight:
    needs: request
    if: needs.request.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the primary workflow ref
        env:
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Dispatch this release from the main workflow ref.' >&2
          exit 1

      - name: Require a stable release tag
        env:
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Release tag must be a stable vX.Y.Z value.' >&2
            exit 1
          fi

      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned release npm
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/opencraft-npmrc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
          npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install verified Gitleaks release
        env:
          GITLEAKS_VERSION: 8.30.1
        working-directory: ${{ runner.temp }}
        run: |
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output checksums.txt "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          awk -v archive="$archive" '$2 == archive { print; found=1 } END { if (!found) exit 1 }' checksums.txt | sha256sum --check --status
          tar -xzf "$archive" gitleaks
      - name: Scan source
        run: '"${{ runner.temp }}/gitleaks" dir . --redact --no-banner --config .gitleaks.toml'


      - name: Validate source identity
        env:
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
        run: |
          VERSION="$(node -p "require('./packaging/web-server/package.json').version")"
          python3 "$KIT" source --tag "$RELEASE_TAG" --version "$VERSION" --primary-ref origin/main


      - name: Install frozen dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check renderer types
        run: npm run typecheck --workspace @opencraft/workbench-web

      - name: Check translations
        run: npm run check:i18n

      - name: Test website release behavior
        run: npm run test:web-release

      - name: Test website updates
        run: npm run test:web-updates

      - name: Test server updates
        run: npm run test:server-updates

      - name: Test public archive behavior
        run: node --test tests/public-release.test.mjs

      - name: Identify the locked Playwright version
        id: playwright
        run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser downloads
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Gate formal releases on performance regressions
        run: npm run gate:performance -- --output "$RUNNER_TEMP/opencraft-performance"

      - name: Retain performance samples and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-${{ needs.request.outputs.tag }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/opencraft-performance
          retention-days: 30
          if-no-files-found: error

      - name: Build and test website updates in the browser
        run: npm run test:web-updates:e2e

      - name: Test the release kit
        run: python3 .github/secure-release/v1/test_secure_release.py

      - name: Package once and extract committed release notes
        env:
          # Public resource publication is not enabled yet; keep this path self-contained.
          OPENCRAFT_SPLIT_WEB_RESOURCES: "0"
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
        run: |
          export OPENCRAFT_RELEASE_VERSION="${RELEASE_TAG#v}"
          export OPENCRAFT_SOURCE_REVISION="$(git rev-parse HEAD)"
          export OPENCRAFT_WEB_PACKAGE_OUTPUT="$RUNNER_TEMP/opencraft-package"
          npm run package:web:server:execution
          mkdir release
          cp "$OPENCRAFT_WEB_PACKAGE_OUTPUT"/*.tgz release/
          node scripts/inspect-public-release.mjs release/*.tgz
          python3 "$KIT" changelog --tag "$RELEASE_TAG" --changelog CHANGELOG.md --notes release/release-notes.md
          VERSION="${RELEASE_TAG#v}"
          mapfile -t TARBALLS < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          python3 "$KIT" manifest-create --tag "$RELEASE_TAG" --version "$VERSION" --artifact "${TARBALLS[0]}" --artifact release/release-notes.md --output release/manifest.json

      - name: Upload the verified handoff bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release-${{ needs.request.outputs.tag }}
          path: release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [request, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pinned release npm
        run: |
          export NPM_CONFIG_USERCONFIG="$RUNNER_TEMP/opencraft-npmrc"
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_CONFIG_USERCONFIG"
          npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Download the preflight bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ needs.request.outputs.tag }}
          path: release

      - name: Reverify and publish exact bytes
        env:
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/opencraft-npmrc
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE="$(node -p "require('./packaging/web-server/package.json').name")"
          mapfile -t TARBALLS < <(find release -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#TARBALLS[@]}" -eq 1
          TARBALL="$(realpath -- "${TARBALLS[0]}")"
          python3 "$KIT" manifest-verify --manifest release/manifest.json --directory release --tag "$RELEASE_TAG" --version "$VERSION"
          if python3 "$KIT" npm-absent --package "$PACKAGE" --version "$VERSION" --registry "$NPM_REGISTRY"; then
            python3 "$KIT" npm-publish --artifact "$TARBALL" --registry "$NPM_REGISTRY" --provenance true
          else
            python3 "$KIT" npm-existing --package "$PACKAGE" --version "$VERSION" --artifact "$TARBALL" --registry "$NPM_REGISTRY"
          fi

      - name: Verify public metadata and clean npm installation
        env:
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/opencraft-npmrc
        run: |
          PACKAGE="$(node -p "require('./packaging/web-server/package.json').name")"
          METADATA_ARGS=()
          # The exact tag may contain a kit predating the public version API.
          if python3 "$KIT" npm-smoke --help | grep -Fq -- '--metadata-source'; then
            METADATA_ARGS=(--metadata-source version-api)
          fi
          python3 "$KIT" npm-smoke --package "$PACKAGE" --version "${RELEASE_TAG#v}" --registry "$NPM_REGISTRY" "${METADATA_ARGS[@]}"

  github-release:
    needs: [request, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.request.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the published bytes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-release-${{ needs.request.outputs.tag }}
          path: release

      - name: Create or reconcile the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.request.outputs.tag }}
        run: |
          if ! gh release create "$RELEASE_TAG" release/*.tgz release/manifest.json release/release-notes.md --verify-tag --title "$RELEASE_TAG" --notes-file release/release-notes.md; then
            gh release view "$RELEASE_TAG" >/dev/null
          fi
          mkdir published-release
          gh release download "$RELEASE_TAG" --dir published-release
          gh release view "$RELEASE_TAG" --json assets,body,isDraft,isPrerelease,tagName > release-metadata.json
          test "$(jq -r .tagName release-metadata.json)" = "$RELEASE_TAG"
          test "$(jq -r .isDraft release-metadata.json)" = false
          test "$(jq -r .isPrerelease release-metadata.json)" = false
          test "$(jq -r .body release-metadata.json)" = "$(cat release/release-notes.md)"
          cmp release/manifest.json published-release/manifest.json
          python3 "$KIT" manifest-verify --manifest published-release/manifest.json --directory published-release --tag "$RELEASE_TAG"
