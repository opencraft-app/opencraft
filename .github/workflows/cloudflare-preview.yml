name: Cloudflare Preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'opencraft-app/opencraft' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build:web:release
      - name: Prepare Cloudflare Workbench assets
        run: node scripts/cloudflare/prepare-workbench-assets.mjs apps/workbench-web/dist "$RUNNER_TEMP/cf-preview-assets"
      - name: Publish fixed Cloudflare preview
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENCRAFT_PREVIEW_SOURCE_REVISION: ${{ github.sha }}
        run: node --import tsx scripts/cloudflare/publish-fixed-preview.ts --assets "$RUNNER_TEMP/cf-preview-assets"
