name: Docker Compose
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  docker-compose:
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/server/container-deployment.test.mjs tests/browser/remote-browser-owner.test.mjs
      - run: node --import tsx --test tests/execution/hands-unix-sandbox.test.ts
      - name: Build identified container candidate
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          docker buildx build -f docker/Dockerfile \
            --platform "linux/${{ matrix.architecture }}" \
            --build-arg "OPENCRAFT_BUILD_ID=github-${GITHUB_SHA}" \
            --build-arg "OPENCRAFT_SOURCE_REVISION=${GITHUB_SHA}" \
            --build-arg "SOURCE_DATE_EPOCH=${source_date_epoch}" \
            --target runtime --tag opencraft:local --load .
      - run: node --test tests/tooling/container-publication.test.mjs
      - run: node scripts/smoke/server/smoke-container.mjs
      - name: Export the tested image (main only)
        if: github.repository == 'opencraft-app/opencraft' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker save opencraft:local | gzip -1 > "/tmp/image.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.repository == 'opencraft-app/opencraft' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: container-${{ matrix.architecture }}
          path: /tmp/image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  distribute:
    needs: docker-compose
    if: github.repository == 'opencraft-app/opencraft' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: container-${{ matrix.architecture }}
          path: /tmp/container
      - name: Publish and anonymously verify the exact tested image
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.architecture }}
        run: bash scripts/ci/distribute-container.sh

  promote:
    needs: distribute
    if: github.repository == 'opencraft-app/opencraft' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    concurrency:
      group: container-ghcr-promotion
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish multi-architecture references
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/promote-container.sh
