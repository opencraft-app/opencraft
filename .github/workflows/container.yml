name: Docker Compose
on:
  workflow_dispatch:
  pull_request:
    paths:
      - docker/**
      - .dockerignore
      - .nvmrc
      - package.json
      - package-lock.json
      - apps/**
      - packages/**
      - runtime/**
      - scripts/server-deployment/**
      - scripts/headless-*.mjs
      - scripts/package-*-runtime.mjs
      - scripts/container-deployment/**
      - scripts/package-container.mjs
      - scripts/package-headless-linux.mjs
      - scripts/smoke/server/smoke-container.mjs
      - tests/server/container-deployment.test.mjs
      - .github/workflows/container.yml
permissions:
  contents: read
concurrency:
  group: container-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  docker-compose:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: node --test tests/server/container-deployment.test.mjs
      - run: docker buildx build -f docker/Dockerfile --platform linux/arm64 --target runtime --tag opencraft:local --load .
      - run: node scripts/smoke/server/smoke-container.mjs
