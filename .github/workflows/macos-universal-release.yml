name: macOS Universal release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-universal-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENCRAFT_BUILD_ID: github-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
  OPENCRAFT_SOURCE_REVISION: ${{ github.sha }}

jobs:
  credentials:
    if: github.repository == 'opencraft-app/opencraft' && (github.event_name == 'push' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: macos-release
    steps:
      - name: Check release credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if test -z "${!name}"; then echo "Missing macos-release secret: ${name}"; missing=1; fi
          done
          test "$missing" -eq 0

  arm64:
    needs: credentials
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test "$(uname -m)" = arm64
      - run: npm ci --no-audit --no-fund
      - run: npm run test:identity
      - run: npm run build:electron:release
      - name: Assemble unsigned arm64 app
        working-directory: apps/workbench-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ../../node_modules/.bin/electron-builder --mac dir --arm64 --publish never --config.mac.identity=null --config.directories.output=release/ci-arm64
      - run: ditto -c -k --sequesterRsrc --keepParent apps/workbench-electron/release/ci-arm64/mac-arm64/OpenCraft.app OpenCraft-arm64-app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencraft-macos-arm64-app
          path: OpenCraft-arm64-app.zip
          if-no-files-found: error
          retention-days: 3

  x64:
    needs: credentials
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: test "$(uname -m)" = x86_64
      - run: npm ci --no-audit --no-fund
      - run: npm run test:identity
      - run: npm run build:electron:release
      - name: Assemble unsigned x64 app
        working-directory: apps/workbench-electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ../../node_modules/.bin/electron-builder --mac dir --x64 --publish never --config.mac.identity=null --config.directories.output=release/ci-x64
      - run: ditto -c -k --sequesterRsrc --keepParent apps/workbench-electron/release/ci-x64/mac/OpenCraft.app OpenCraft-x64-app.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencraft-macos-x64-app
          path: OpenCraft-x64-app.zip
          if-no-files-found: error
          retention-days: 3

  universal:
    needs: [arm64, x64]
    runs-on: macos-15
    environment: macos-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run test:macos-release
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: opencraft-macos-*-app
          path: .artifacts
      - name: Extract architecture apps
        run: |
          mkdir -p .release/x64 .release/arm64 .release/universal
          ditto -x -k .artifacts/opencraft-macos-x64-app/OpenCraft-x64-app.zip .release/x64
          ditto -x -k .artifacts/opencraft-macos-arm64-app/OpenCraft-arm64-app.zip .release/arm64
      - name: Merge Universal app
        run: node scripts/merge-macos-universal.mjs --x64 .release/x64/OpenCraft.app --arm64 .release/arm64/OpenCraft.app --output .release/universal/OpenCraft.app
      - name: Import Developer ID
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/opencraft-signing.keychain-db"
          keychain_password="$(openssl rand -base64 32)"
          certificate="$RUNNER_TEMP/opencraft-developer-id.p12"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | /usr/bin/base64 -D > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)"
          test -n "$identity"
          echo "CSC_NAME=$identity" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - name: Sign and notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/sign-notarize-macos.mjs .release/universal/OpenCraft.app
      - name: Package signed DMG and ZIP
        working-directory: apps/workbench-electron
        run: |
          builder_identity="${CSC_NAME#Developer ID Application: }"
          ../../node_modules/.bin/electron-builder \
            --prepackaged ../../.release/universal/OpenCraft.app \
            --mac dmg zip --universal --publish never \
            --config.mac.identity="$builder_identity" \
            --config.forceCodeSigning=true \
            --config.dmg.sign=true \
            --config.directories.output=release/ci-universal
      - name: Notarize final DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/notarize-macos-dmg.mjs apps/workbench-electron/release/ci-universal/OpenCraft-0.1.0-universal.dmg
      - name: Verify final artifacts
        run: |
          app=.release/universal/OpenCraft.app
          dmg=apps/workbench-electron/release/ci-universal/OpenCraft-0.1.0-universal.dmg
          zip=apps/workbench-electron/release/ci-universal/OpenCraft-0.1.0-mac-universal.zip
          test "$(lipo -archs "$app/Contents/MacOS/OpenCraft")" = "x86_64 arm64" || test "$(lipo -archs "$app/Contents/MacOS/OpenCraft")" = "arm64 x86_64"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=4 "$app"
          codesign --verify --verbose=2 "$dmg"
          hdiutil verify "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$dmg"
          unzip -t "$zip"
          shasum -a 256 "$dmg" "$zip" > apps/workbench-electron/release/ci-universal/SHA256SUMS
      - name: Launch and inspect the final notarized DMG
        env:
          OPENCRAFT_SMOKE_OUTPUT: ${{ runner.temp }}/opencraft-universal-smoke
        run: node scripts/smoke/desktop/smoke-macos-dmg.mjs apps/workbench-electron/release/ci-universal/OpenCraft-0.1.0-universal.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: opencraft-macos-universal-smoke-${{ github.sha }}
          path: ${{ runner.temp }}/opencraft-universal-smoke
          retention-days: 3
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: opencraft-macos-universal-${{ github.sha }}
          path: |
            apps/workbench-electron/release/ci-universal/OpenCraft-0.1.0-universal.dmg
            apps/workbench-electron/release/ci-universal/OpenCraft-0.1.0-mac-universal.zip
            apps/workbench-electron/release/ci-universal/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary credentials
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/opencraft-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/opencraft-developer-id.p12"

  publish:
    if: github.ref_type == 'tag'
    needs: universal
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: opencraft-macos-universal-${{ github.sha }}
          path: .release-artifacts
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            .release-artifacts/OpenCraft-0.1.0-universal.dmg \
            .release-artifacts/OpenCraft-0.1.0-mac-universal.zip \
            .release-artifacts/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
