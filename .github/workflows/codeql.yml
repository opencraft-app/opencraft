name: CodeQL

# Pull requests scan only their changes; main gets one full analysis a day as the
# baseline they compare with. CodeQL is not a required check, so merge-queue
# groups and each push to main would only repeat that work and hold runners.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admission:
    uses: ./.github/workflows/contribution-admission.yml

  analyze:
    needs: admission
    # Private-repository Code Security is not enabled; run automatically on publication.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    # A full analysis of main took about 19 minutes before the codebase grew past 20.
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
