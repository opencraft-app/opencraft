name: Performance gate

# The browser performance suite (npm run gate:performance): behavior smokes
# plus p50/p95 budgets against config/performance-baseline.json. It is not a
# build gate. Stable app releases call it before staging, and it runs nightly on
# main so a stale behavior check or budget shows up long before a release.
on:
  workflow_call:
    inputs:
      evidence_name:
        description: Artifact name for the retained samples and failure evidence
        required: true
        type: string
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  gate:
    if: github.repository == 'opencraft-app/opencraft'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium and system dependencies
        run: bash scripts/ci/install-playwright-chromium.sh
      - name: Gate on performance regressions
        run: npm run gate:performance -- --output "$RUNNER_TEMP/opencraft-performance"
      - name: Retain performance samples and failure evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.evidence_name || format('performance-{0}-{1}', github.sha, github.run_attempt) }}
          path: ${{ runner.temp }}/opencraft-performance
          retention-days: 30
          if-no-files-found: error
