[workspace]
members = [
  "crates/vela-core",
  "crates/vela-store",
  "crates/vela-backends",
  "crates/vela-runtime",
  "crates/vela-projection",
  "crates/vela-protocol",
  "crates/velad",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
futures = "0.3"
http-body-util = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "json"] }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }
vela-core = { path = "crates/vela-core" }
vela-store = { path = "crates/vela-store" }
vela-backends = { path = "crates/vela-backends" }
vela-projection = { path = "crates/vela-projection" }
vela-protocol = { path = "crates/vela-protocol" }
vela-runtime = { path = "crates/vela-runtime" }

[profile.dev]
debug = 1
incremental = true
split-debuginfo = "unpacked"

[profile.test]
debug = 1
incremental = true
split-debuginfo = "unpacked"
