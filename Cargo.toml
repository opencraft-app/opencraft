[workspace]
members = [
  "crates/vela-core",
  "crates/vela-store",
  "crates/vela-backends",
  "crates/vela-runtime",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "chrono", "json"] }
tempfile = "3.23"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util"] }
tokio-stream = "0.1"
uuid = { version = "1.18", features = ["v4", "serde"] }
vela-core = { path = "crates/vela-core" }
vela-store = { path = "crates/vela-store" }
vela-backends = { path = "crates/vela-backends" }
