openapi: 3.0.3
info:
  title: Lightclaw Auth API
  version: 0.1.0
  description: Shared auth service for the Lightclaw web prototype and future clients.
servers:
  - url: http://localhost:8081
paths:
  /auth/password/sign-in:
    post:
      operationId: signInWithPassword
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/password/sign-up:
    post:
      operationId: signUpWithPassword
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignUpRequest'
      responses:
        '200':
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Trigger forgot-password flow placeholder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Accepted
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/sms/send:
    post:
      operationId: sendSmsCode
      summary: Send an SMS verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSmsRequest'
      responses:
        '200':
          description: Code issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendSmsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
  /auth/sms/verify:
    post:
      operationId: verifySmsCode
      summary: Verify SMS code and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySmsRequest'
      responses:
        '200':
          description: Verified and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
  /auth/invite/validate:
    post:
      operationId: validateInviteCode
      summary: Validate an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteValidationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteValidation'
  /auth/invite/activate:
    post:
      operationId: activateInviteCode
      summary: Activate the current authenticated user with an invite code
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteValidationRequest'
      responses:
        '200':
          description: Activated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current session
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: signOut
      summary: Delete the current session
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '204':
          description: Signed out
  /.well-known/openid-configuration:
    get:
      operationId: getOpenIdConfiguration
      summary: Get OIDC discovery metadata
      responses:
        '200':
          description: OIDC discovery document
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCDiscoveryDocument'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /.well-known/jwks.json:
    get:
      operationId: getOpenIdJwks
      summary: Get OIDC signing keys
      responses:
        '200':
          description: OIDC JWKS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCJWKS'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /oauth2/authorize:
    get:
      operationId: getOidcAuthorize
      summary: Validate OIDC request and redirect to the authorization page
      parameters:
        - $ref: '#/components/parameters/OIDCClientId'
        - $ref: '#/components/parameters/OIDCRedirectUri'
        - $ref: '#/components/parameters/OIDCResponseType'
        - $ref: '#/components/parameters/OIDCScope'
        - $ref: '#/components/parameters/OIDCState'
        - $ref: '#/components/parameters/OIDCNonce'
        - $ref: '#/components/parameters/OIDCCodeChallenge'
        - $ref: '#/components/parameters/OIDCCodeChallengeMethod'
      responses:
        '302':
          description: Redirect to the first-party authorization page
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    post:
      operationId: authorizeOidc
      summary: Confirm an OIDC authorization request and issue a code
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OIDCAuthorizeRequest'
      responses:
        '200':
          description: Exact registered callback with the authorization code for frontend navigation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCAuthorizeResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /oauth2/authorize/context:
    get:
      operationId: getOidcAuthorizeContext
      summary: Validate an OIDC authorization request and return session context
      parameters:
        - $ref: '#/components/parameters/OIDCClientId'
        - $ref: '#/components/parameters/OIDCRedirectUri'
        - $ref: '#/components/parameters/OIDCResponseType'
        - $ref: '#/components/parameters/OIDCScope'
        - $ref: '#/components/parameters/OIDCState'
        - $ref: '#/components/parameters/OIDCNonce'
        - $ref: '#/components/parameters/OIDCCodeChallenge'
        - $ref: '#/components/parameters/OIDCCodeChallengeMethod'
      responses:
        '200':
          description: Validated OIDC authorization context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCAuthorizeContextResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /oauth2/token:
    post:
      operationId: exchangeOidcToken
      summary: Exchange an OIDC authorization code for tokens
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OIDCTokenRequest'
      responses:
        '200':
          description: OIDC token response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OIDCTokenResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /auth/federation/context:
    get:
      operationId: getFederationContext
      summary: Validate a federation authorization request
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: state
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 2048
      responses:
        '200':
          description: Validated federation context
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationContextResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
  /auth/federation/tickets:
    post:
      operationId: issueFederationTicket
      summary: Issue a short-lived federation handoff ticket
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationTicketRequest'
      responses:
        '200':
          description: Validated callback redirect containing the opaque ticket
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationTicketResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
  /auth/federation/exchange:
    post:
      operationId: exchangeFederationTicket
      summary: Exchange a handoff ticket for an opaque delegated session
      security:
        - FederationServiceSignature: []
      parameters:
        - $ref: '#/components/parameters/FederationClientId'
        - $ref: '#/components/parameters/FederationKeyId'
        - $ref: '#/components/parameters/FederationTimestamp'
        - $ref: '#/components/parameters/FederationRequestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationExchangeRequest'
      responses:
        '200':
          description: Delegated session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationExchangeResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
  /auth/federation/bots/{bot_id}/tat/session:
    post:
      operationId: createFederationTatSession
      summary: Create a fresh Bot-scoped TAT transport
      security:
        - FederationServiceSignature: []
      parameters:
        - $ref: '#/components/parameters/FederationClientId'
        - $ref: '#/components/parameters/FederationKeyId'
        - $ref: '#/components/parameters/FederationTimestamp'
        - $ref: '#/components/parameters/FederationRequestId'
        - name: bot_id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FederationTatSessionRequest'
      responses:
        '200':
          description: Sanitized TAT bootstrap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationTatBootstrap'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'
        '413':
          $ref: '#/components/responses/ErrorResponse'
  /auth/profile:
    get:
      operationId: getProfile
      summary: Get the current user profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: updateProfile
      summary: Update the current user profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/email/bind/request:
    post:
      operationId: requestEmailBind
      summary: Send a magic-link email to bind an address to the current user
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailBindRequest'
      responses:
        '200':
          description: Magic-link email accepted for delivery
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailBindRequestResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/faceid/attempts:
    post:
      operationId: startRealnameFaceIDAttempt
      summary: Start a FaceID real-name verification attempt
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnameFaceIDStartRequest'
      responses:
        '200':
          description: Attempt created or reused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameFaceIDAttemptResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/faceid/attempts/{attemptId}:
    get:
      operationId: getRealnameFaceIDAttempt
      summary: Reconcile and read an owned FaceID attempt
      security:
        - SessionCookie: []
        - SessionBearer: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current attempt state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameFaceIDAttemptResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/faceid/attempts/current:
    get:
      operationId: getCurrentRealnameFaceIDAttempt
      summary: Read the current recoverable FaceID attempt for the authenticated user
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Current recoverable attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameFaceIDAttemptResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/faceid/attempts/{attemptId}/verify-phone:
    post:
      operationId: verifyRealnameFaceIDPhone
      summary: Verify the current phone through Shadow binding for a FaceID attempt
      security:
        - SessionCookie: []
        - SessionBearer: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnameFaceIDPhoneRequest'
      responses:
        '200':
          description: Phone proof recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameFaceIDAttemptResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/faceid/attempts/{attemptId}/send-phone-code:
    post:
      operationId: sendRealnameFaceIDPhoneCode
      summary: Send a Shadow verification code to the current phone for a FaceID attempt
      security:
        - SessionCookie: []
        - SessionBearer: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnameFaceIDPhoneCodeRequest'
      responses:
        '200':
          description: Code issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendSmsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/faceid/attempts/{attemptId}/finalize:
    post:
      operationId: finalizeRealnameFaceIDAttempt
      summary: Synchronize an attempt to Shadow and activate final verification
      security:
        - SessionCookie: []
        - SessionBearer: []
      parameters:
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Final verification activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameFaceIDAttemptResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/faceid/callback:
    get:
      operationId: handleRealnameFaceIDCallback
      summary: Receive a Tencent FaceID browser redirect
      parameters:
        - name: BizToken
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Safe browser completion page
          content:
            text/html:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/verify:
    post:
      operationId: verifyRealname
      summary: Verify current user's real-name identity
      description: Re-submitting after verification updates the current real-name identity and keeps an internal change history.
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnameVerifyRequest'
      responses:
        '200':
          description: Real-name verification succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameVerifyResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/verify-phone:
    post:
      operationId: verifyRealnamePhone
      summary: Verify current user's phone as the third real-name factor
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnamePhoneVerifyRequest'
      responses:
        '200':
          description: Phone verification succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnamePhoneVerifyResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/sync/retry:
    post:
      operationId: retryRealnameSync
      summary: Retry syncing current user's verified real-name identity to the account system
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Real-name sync retry succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameSyncRetryResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/shadow/binding:
    get:
      operationId: getShadowBinding
      summary: Get current user's Lightvela shadow binding status
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Current binding status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowBindingResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/shadow/binding/retry:
    post:
      operationId: retryShadowBinding
      summary: Retry current user's failed Lightvela shadow binding
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Current binding status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShadowBindingResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/tencent-cloud/redirect:
    post:
      operationId: createTencentCloudRedirect
      summary: Create a one-time Tencent Cloud console login redirect for the current user
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TencentCloudRedirectRequest'
      responses:
        '200':
          description: One-time Tencent Cloud console login redirect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TencentCloudRedirectResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/payment-methods:
    get:
      operationId: listPaymentMethods
      summary: List the current user's signed payment cards
      security:
        - SessionCookie: []
        - SessionBearer: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Current signed payment cards
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodListResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/payment-methods/sign-orders:
    post:
      operationId: createPaymentMethodSignOrder
      summary: Create a hosted card signing order for the current user
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodSignOrderRequest'
      responses:
        '200':
          description: Hosted card signing order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSignOrderResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/payment-methods/{contractCode}/default:
    put:
      operationId: setDefaultPaymentMethod
      summary: Set one of the current user's signed cards as default
      security:
        - SessionCookie: []
        - SessionBearer: []
      parameters:
        - $ref: '#/components/parameters/PaymentMethodContractCode'
      responses:
        '204':
          description: Default payment card updated
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/payment-methods/{contractCode}:
    delete:
      operationId: deletePaymentMethod
      summary: Delete one of the current user's non-default signed cards
      security:
        - SessionCookie: []
        - SessionBearer: []
      parameters:
        - $ref: '#/components/parameters/PaymentMethodContractCode'
      responses:
        '204':
          description: Payment card deleted
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/profile/avatar:
    get:
      operationId: getProfileAvatar
      summary: Redirect to the current user's avatar asset
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '302':
          description: Redirect to signed avatar URL
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: updateProfileAvatar
      summary: Upload and replace the current user's avatar
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
components:
  parameters:
    OIDCClientId:
      name: client_id
      in: query
      required: true
      schema:
        type: string
    OIDCRedirectUri:
      name: redirect_uri
      in: query
      required: true
      schema:
        type: string
        format: uri
    OIDCResponseType:
      name: response_type
      in: query
      required: true
      schema:
        type: string
    OIDCScope:
      name: scope
      in: query
      required: true
      schema:
        type: string
    OIDCState:
      name: state
      in: query
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 2048
    OIDCNonce:
      name: nonce
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OIDCCodeChallenge:
      name: code_challenge
      in: query
      required: true
      schema:
        type: string
        minLength: 1
    OIDCCodeChallengeMethod:
      name: code_challenge_method
      in: query
      required: true
      schema:
        type: string
    FederationClientId:
      name: X-LightVela-Client-Id
      in: header
      required: true
      schema:
        type: string
    FederationKeyId:
      name: X-LightVela-Key-Id
      in: header
      required: true
      schema:
        type: string
    FederationTimestamp:
      name: X-LightVela-Timestamp
      in: header
      required: true
      schema:
        type: string
        format: date-time
    FederationRequestId:
      name: X-LightVela-Request-Id
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    PaymentMethodContractCode:
      name: contractCode
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: lc_session
    SessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
    FederationServiceSignature:
      type: apiKey
      in: header
      name: X-LightVela-Signature
  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    OIDCDiscoveryDocument:
      type: object
      required:
        - issuer
        - authorization_endpoint
        - token_endpoint
        - jwks_uri
        - response_types_supported
        - subject_types_supported
        - id_token_signing_alg_values_supported
        - scopes_supported
        - token_endpoint_auth_methods_supported
        - grant_types_supported
        - code_challenge_methods_supported
      properties:
        issuer:
          type: string
        authorization_endpoint:
          type: string
        token_endpoint:
          type: string
        jwks_uri:
          type: string
        response_types_supported:
          type: array
          items:
            type: string
        subject_types_supported:
          type: array
          items:
            type: string
        id_token_signing_alg_values_supported:
          type: array
          items:
            type: string
        scopes_supported:
          type: array
          items:
            type: string
        token_endpoint_auth_methods_supported:
          type: array
          items:
            type: string
        grant_types_supported:
          type: array
          items:
            type: string
        code_challenge_methods_supported:
          type: array
          items:
            type: string
    OIDCJWK:
      type: object
      required:
        - kty
        - crv
        - use
        - alg
        - kid
        - x
      properties:
        kty:
          type: string
        crv:
          type: string
        use:
          type: string
        alg:
          type: string
        kid:
          type: string
        x:
          type: string
    OIDCJWKS:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            $ref: '#/components/schemas/OIDCJWK'
    OIDCAuthorizeRequest:
      type: object
      required:
        - client_id
        - redirect_uri
        - response_type
        - scope
        - state
        - nonce
        - code_challenge
        - code_challenge_method
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        response_type:
          type: string
        scope:
          type: string
        state:
          type: string
        nonce:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
    OIDCAuthorizeContextResponse:
      type: object
      required:
        - client
        - redirect_uri
        - state
        - response_type
        - scope
        - code_challenge
        - code_challenge_method
        - nonce
        - session
      properties:
        client:
          $ref: '#/components/schemas/FederationClient'
        redirect_uri:
          type: string
          format: uri
        state:
          type: string
        response_type:
          type: string
        scope:
          type: string
        code_challenge:
          type: string
        code_challenge_method:
          type: string
        nonce:
          type: string
        session:
          $ref: '#/components/schemas/FederationSessionSummary'
    OIDCAuthorizeResponse:
      type: object
      required:
        - redirect_url
        - expires_at
      properties:
        redirect_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    OIDCTokenRequest:
      type: object
      required:
        - grant_type
        - code
        - client_id
        - redirect_uri
        - code_verifier
      properties:
        grant_type:
          type: string
        code:
          type: string
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        code_verifier:
          type: string
    OIDCTokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - scope
        - id_token
      properties:
        access_token:
          type: string
        token_type:
          type: string
        expires_in:
          type: integer
          format: int64
        scope:
          type: string
        id_token:
          type: string
    FederationClient:
      type: object
      required:
        - id
        - display_name
      properties:
        id:
          type: string
        display_name:
          type: string
    FederationSessionSummary:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
    FederationContextResponse:
      type: object
      required:
        - client
        - redirect_uri
        - state
        - session
      properties:
        client:
          $ref: '#/components/schemas/FederationClient'
        redirect_uri:
          type: string
          format: uri
        state:
          type: string
        session:
          $ref: '#/components/schemas/FederationSessionSummary'
    FederationTicketRequest:
      type: object
      required:
        - client_id
        - redirect_uri
        - state
      properties:
        client_id:
          type: string
        redirect_uri:
          type: string
          format: uri
        state:
          type: string
          minLength: 1
          maxLength: 2048
    FederationTicketResponse:
      type: object
      required:
        - redirect_url
        - expires_at
      properties:
        redirect_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    FederationExchangeRequest:
      type: object
      required:
        - ticket
        - redirect_uri
      properties:
        ticket:
          type: string
        redirect_uri:
          type: string
          format: uri
    FederationExchangeResponse:
      type: object
      required:
        - delegated_session
        - expires_at
      properties:
        delegated_session:
          type: string
        expires_at:
          type: string
          format: date-time
    FederationTatSessionRequest:
      type: object
      required:
        - delegated_session
      additionalProperties: false
      properties:
        delegated_session:
          type: string
    FederationTatBootstrap:
      type: object
      required:
        - sessionId
        - region
        - instanceId
        - ownerUin
        - loginUin
        - appId
        - wsUrl
        - cols
        - rows
        - timeoutSeconds
      additionalProperties: false
      properties:
        sessionId:
          type: string
        region:
          type: string
        instanceId:
          type: string
        ownerUin:
          type: string
        loginUin:
          type: string
        appId:
          type: integer
          format: int64
        wsUrl:
          type: string
          format: uri
        cols:
          type: integer
          format: int64
        rows:
          type: integer
          format: int64
        timeoutSeconds:
          type: integer
          format: int64
        username:
          type: string
        workingDirectory:
          type: string
    User:
      type: object
      required:
        - id
        - name
        - inviteRequired
        - realnameVerified
        - emailVerified
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        pendingName:
          type: string
          description: Pending nickname waiting for content safety approval.
        nameAuditStatus:
          type: string
          description: Nickname content safety status.
          enum:
            - pending
            - passed
            - failed
        email:
          type: string
        emailVerified:
          type: boolean
        phone:
          type: string
        avatarUrl:
          type: string
        pendingAvatarUrl:
          type: string
          description: Pending avatar URL visible only to the current user while waiting for content safety approval.
        avatarAuditStatus:
          type: string
          description: Avatar content safety status.
          enum:
            - pending
            - passed
            - failed
        inviteRequired:
          type: boolean
        realnameVerified:
          type: boolean
        realnameLevel:
          type: string
        realnameAssuranceMode:
          type: string
          enum:
            - legacy
            - faceless
            - observe
            - face_required
        realnameSyncStatus:
          type: string
          description: Status of syncing the verified real-name identity to the account system.
          enum:
            - pending
            - failed
            - succeeded
        createdAt:
          type: string
          format: date-time
    RealnameVerifyRequest:
      type: object
      required:
        - name
        - idCard
      properties:
        name:
          type: string
        idCard:
          type: string
    RealnameFaceIDStartRequest:
      type: object
      required:
        - name
        - idCard
        - consent
      properties:
        name:
          type: string
        idCard:
          type: string
        consent:
          type: boolean
    RealnameFaceIDPhoneRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
        phone:
          type: string
    RealnameFaceIDPhoneCodeRequest:
      type: object
      properties:
        phone:
          type: string
    RealnameFaceIDAttemptResponse:
      type: object
      required:
        - attemptId
        - state
      properties:
        attemptId:
          type: string
        state:
          type: string
          enum:
            - pending
            - face_succeeded
            - phone_pending
            - shadow_pending
            - succeeded
            - failed
            - expired
        verificationUrl:
          type: string
        expiresAt:
          type: string
          format: date-time
    RealnameVerifyResponse:
      type: object
      required:
        - ok
        - verified
        - nameMasked
        - idCardMasked
        - requestId
        - phoneVerificationRequired
      properties:
        ok:
          type: boolean
        verified:
          type: boolean
        nameMasked:
          type: string
        idCardMasked:
          type: string
        requestId:
          type: string
        phoneVerificationRequired:
          type: boolean
          description: Whether the client must complete the phone SMS step after ID card verification.
        phoneVerificationSkipped:
          type: boolean
          description: True when the backend completed phone verification using the current SMS login session.
        realnameLevel:
          type: string
        shadowBindingStatus:
          type: string
    RealnamePhoneVerifyRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    RealnamePhoneVerifyResponse:
      type: object
      required:
        - ok
        - realnameLevel
        - shadowBindingStatus
      properties:
        ok:
          type: boolean
        realnameLevel:
          type: string
        realnameSyncStatus:
          type: string
          enum:
            - pending
            - failed
            - succeeded
        shadowBindingStatus:
          type: string
    RealnameSyncRetryResponse:
      type: object
      required:
        - ok
        - user
        - realnameSyncStatus
        - shadowBindingStatus
      properties:
        ok:
          type: boolean
        user:
          $ref: '#/components/schemas/User'
        realnameSyncStatus:
          type: string
          enum:
            - pending
            - failed
            - succeeded
        shadowBindingStatus:
          type: string
    ShadowBinding:
      type: object
      required:
        - status
      properties:
        status:
          type: string
        userId:
          type: string
        shadowUserName:
          type: string
        uin:
          type: integer
          format: int64
        ownerUin:
          type: integer
          format: int64
        appId:
          type: integer
          format: int64
        lastErrorCode:
          type: string
        lastErrorMessage:
          type: string
        basicAuthStatus:
          type: string
          enum:
            - failed
            - succeeded
        basicAuthSyncedAt:
          type: string
          format: date-time
        basicAuthLastErrorCode:
          type: string
        basicAuthLastErrorMessage:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ShadowBindingResponse:
      type: object
      required:
        - binding
      properties:
        binding:
          $ref: '#/components/schemas/ShadowBinding'
    TencentCloudRedirectRequest:
      type: object
      properties:
        targetPath:
          type: string
          description: Relative path inside console.cloud.tencent.com. Defaults to the account cancellation page.
    TencentCloudRedirectResponse:
      type: object
      required:
        - redirectUrl
        - expiresAt
      properties:
        redirectUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      required:
        - user
        - authenticatedAt
        - impersonated
      properties:
        user:
          $ref: '#/components/schemas/User'
        authenticatedAt:
          type: string
          format: date-time
        impersonated:
          type: boolean
        sessionToken:
          type: string
          description: Opaque session token for non-cookie clients.
    SessionResponse:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AuthSession'
    ProfileResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    PasswordSignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    PasswordSignUpRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        inviteCode:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    EmailBindRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    EmailBindRequestResponse:
      type: object
      required:
        - cooldownSeconds
      properties:
        cooldownSeconds:
          type: integer
    SendSmsRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
    SendSmsResponse:
      type: object
      required:
        - cooldownSeconds
      properties:
        cooldownSeconds:
          type: integer
          minimum: 0
    UpdateProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    VerifySmsRequest:
      type: object
      required:
        - phone
        - code
      properties:
        name:
          type: string
        phone:
          type: string
        code:
          type: string
        inviteCode:
          type: string
    InviteValidationRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    InviteValidation:
      type: object
      required:
        - code
        - state
        - message
      properties:
        code:
          type: string
        state:
          type: string
          enum: [idle, valid, invalid, expired, used]
        message:
          type: string
    PaymentMethod:
      type: object
      required:
        - contractCode
        - maskedNumber
        - payerName
        - type
        - isDefault
      properties:
        contractCode:
          type: string
        maskedNumber:
          type: string
          description: Masked card number returned by Tencent Billing.
        payerName:
          type: string
        type:
          type: string
          example: CREDIT_CARD
        isDefault:
          type: boolean
    PaymentMethodListResponse:
      type: object
      required:
        - total
        - items
      properties:
        total:
          type: integer
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
    PaymentMethodSignOrderRequest:
      type: object
      properties:
        languageCode:
          type: string
          enum: [en, zh, hk]
          default: en
    PaymentMethodSignOrderResponse:
      type: object
      required:
        - contractCode
        - redirectUrl
      properties:
        contractCode:
          type: string
        redirectUrl:
          type: string
          format: uri
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 0
