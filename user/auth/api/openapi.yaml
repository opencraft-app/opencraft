openapi: 3.0.3
info:
  title: Lightclaw Auth API
  version: 0.1.0
  description: Shared auth service for the Lightclaw web prototype and future clients.
servers:
  - url: http://localhost:8081
paths:
  /auth/password/sign-in:
    post:
      operationId: signInWithPassword
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignInRequest'
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/password/sign-up:
    post:
      operationId: signUpWithPassword
      summary: Register with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordSignUpRequest'
      responses:
        '200':
          description: Registered and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
  /auth/password/forgot:
    post:
      operationId: forgotPassword
      summary: Trigger forgot-password flow placeholder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: Accepted
        '400':
          $ref: '#/components/responses/ErrorResponse'
  /auth/sms/send:
    post:
      operationId: sendSmsCode
      summary: Send an SMS verification code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendSmsRequest'
      responses:
        '200':
          description: Code issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendSmsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
  /auth/sms/verify:
    post:
      operationId: verifySmsCode
      summary: Verify SMS code and create a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifySmsRequest'
      responses:
        '200':
          description: Verified and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/invite/validate:
    post:
      operationId: validateInviteCode
      summary: Validate an invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteValidationRequest'
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteValidation'
  /auth/invite/activate:
    post:
      operationId: activateInviteCode
      summary: Activate the current authenticated user with an invite code
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteValidationRequest'
      responses:
        '200':
          description: Activated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/session:
    get:
      operationId: getCurrentSession
      summary: Get the current session
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Current session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: signOut
      summary: Delete the current session
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '204':
          description: Signed out
  /auth/profile:
    get:
      operationId: getProfile
      summary: Get the current user profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '200':
          description: Current profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: updateProfile
      summary: Update the current user profile
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /auth/realname/verify:
    post:
      operationId: verifyRealname
      summary: Verify current user's real-name identity
      description: Re-submitting after verification updates the current real-name identity and keeps an internal change history.
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealnameVerifyRequest'
      responses:
        '200':
          description: Real-name verification succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealnameVerifyResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /auth/profile/avatar:
    get:
      operationId: getProfileAvatar
      summary: Redirect to the current user's avatar asset
      security:
        - SessionCookie: []
        - SessionBearer: []
      responses:
        '302':
          description: Redirect to signed avatar URL
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
    put:
      operationId: updateProfileAvatar
      summary: Upload and replace the current user's avatar
      security:
        - SessionCookie: []
        - SessionBearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: lc_session
    SessionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-session
  responses:
    ErrorResponse:
      description: Request failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - inviteRequired
        - realnameVerified
        - createdAt
      properties:
        id:
          type: string
        name:
          type: string
        pendingName:
          type: string
          description: Pending nickname waiting for content safety approval.
        nameAuditStatus:
          type: string
          description: Nickname content safety status.
          enum:
            - pending
            - passed
            - failed
        email:
          type: string
        phone:
          type: string
        avatarUrl:
          type: string
        pendingAvatarUrl:
          type: string
          description: Pending avatar URL visible only to the current user while waiting for content safety approval.
        avatarAuditStatus:
          type: string
          description: Avatar content safety status.
          enum:
            - pending
            - passed
            - failed
        inviteRequired:
          type: boolean
        realnameVerified:
          type: boolean
        createdAt:
          type: string
          format: date-time
    RealnameVerifyRequest:
      type: object
      required:
        - name
        - idCard
      properties:
        name:
          type: string
        idCard:
          type: string
    RealnameVerifyResponse:
      type: object
      required:
        - ok
        - verified
        - nameMasked
        - idCardMasked
        - requestId
      properties:
        ok:
          type: boolean
        verified:
          type: boolean
        nameMasked:
          type: string
        idCardMasked:
          type: string
        requestId:
          type: string
    AuthSession:
      type: object
      required:
        - user
        - authenticatedAt
        - impersonated
      properties:
        user:
          $ref: '#/components/schemas/User'
        authenticatedAt:
          type: string
          format: date-time
        impersonated:
          type: boolean
        sessionToken:
          type: string
          description: Opaque session token for non-cookie clients.
    SessionResponse:
      type: object
      required:
        - session
      properties:
        session:
          $ref: '#/components/schemas/AuthSession'
    ProfileResponse:
      type: object
      required:
        - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    PasswordSignInRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
        password:
          type: string
    PasswordSignUpRequest:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        inviteCode:
          type: string
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
    SendSmsRequest:
      type: object
      required:
        - phone
      properties:
        phone:
          type: string
    SendSmsResponse:
      type: object
      required:
        - cooldownSeconds
      properties:
        cooldownSeconds:
          type: integer
          minimum: 0
    UpdateProfileRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    VerifySmsRequest:
      type: object
      required:
        - name
        - phone
        - code
      properties:
        name:
          type: string
        phone:
          type: string
        code:
          type: string
        inviteCode:
          type: string
    InviteValidationRequest:
      type: object
      required:
        - code
      properties:
        code:
          type: string
    InviteValidation:
      type: object
      required:
        - code
        - state
        - message
      properties:
        code:
          type: string
        state:
          type: string
          enum: [idle, valid, invalid, expired, used]
        message:
          type: string
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
        retryAfterSeconds:
          type: integer
          minimum: 0
