apiVersion: v1
kind: Namespace
metadata:
  name: user-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: user-auth
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lightclaw-auth-config
  namespace: user-auth
data:
  GIN_MODE: "release"
  LIGHTCLAW_AUTH_ADDR: ":8081"
  LIGHTCLAW_COOKIE_SECURE: "true"
  LIGHTCLAW_COOKIE_SAME_SITE: "none"
  LIGHTCLAW_LOG_LEVEL: "info"
  LIGHTCLAW_SEED_DEFAULT_INVITES: "true"
  LIGHTCLAW_SEED_DEMO_USER: "false"
  LIGHTCLAW_FRONTEND_BASE_URL: "REPLACE_AUTH_FRONTEND_BASE_URL"
  LIGHTCLAW_OAUTH_RETURN_TO_ALLOWED_HOSTS: "REPLACE_AUTH_OAUTH_RETURN_TO_ALLOWED_HOSTS"
  LIGHTCLAW_PUBLIC_BASE_URL: "REPLACE_AUTH_PUBLIC_BASE_URL"
  LIGHTCLAW_QQ_APP_ID: "REPLACE_AUTH_QQ_APP_ID"
  LIGHTCLAW_QQ_REDIRECT_URI: "REPLACE_AUTH_QQ_REDIRECT_URI"
  LIGHTCLAW_WECHAT_APP_ID: "REPLACE_AUTH_WECHAT_APP_ID"
  LIGHTCLAW_WECHAT_REDIRECT_URI: "REPLACE_AUTH_WECHAT_REDIRECT_URI"
  LIGHTVELA_WECHAT_WEBSITE_APP_ID: "REPLACE_AUTH_WECHAT_APP_ID"
  LIGHTVELA_WECHAT_WEBSITE_REDIRECT_URI: "REPLACE_AUTH_WECHAT_REDIRECT_URI"
  LIGHTVELA_WECHAT_OFFICIAL_ACCOUNT_APP_ID: "REPLACE_AUTH_WECHAT_OFFICIAL_ACCOUNT_APP_ID"
  LIGHTVELA_WECHAT_OFFICIAL_ACCOUNT_REDIRECT_URI: "REPLACE_AUTH_WECHAT_OFFICIAL_ACCOUNT_REDIRECT_URI"
  LIGHTCLAW_GITHUB_CLIENT_ID: "REPLACE_AUTH_GITHUB_CLIENT_ID"
  LIGHTCLAW_GITHUB_REDIRECT_URI: "REPLACE_AUTH_GITHUB_REDIRECT_URI"
  MYSQL_HOST: "REPLACE_AUTH_MYSQL_HOST"
  MYSQL_PORT: "REPLACE_AUTH_MYSQL_PORT"
  CTL_INTERNAL_BASE_URL: "http://ctl-api.ctl.svc.cluster.local"
  MYSQL_ROOT_USER: "root"
  LIGHTCLAW_AUTH_DB: "lightclaw_auth"
  LIGHTCLAW_AUTH_DB_USER: "lightclaw_auth"
  LIGHTCLAW_EMAIL_BIND_ENABLED: "false"
  LIGHTCLAW_FEDERATION_ENABLED: "false"
  LIGHTCLAW_FEDERATION_ENVIRONMENT: ""
  LIGHTCLAW_FEDERATION_ACTIVE_AEAD_KEY_ID: ""
  LIGHTCLAW_FEDERATION_CTL_BASE_URL: ""
  LIGHTCLAW_FEDERATION_TAT_TIMEOUT_SECONDS: "5"
  LIGHTCLAW_FEDERATION_DELEGATED_SESSION_TTL_SECONDS: "28800"
  LIGHTCLAW_OIDC_ENABLED: "false"
  LIGHTCLAW_OIDC_ISSUER: ""
  LIGHTCLAW_OIDC_SIGNING_KEY_ID: ""
  LIGHTCLAW_OIDC_CLIENTS_JSON: ""
  LIGHTCLAW_OIDC_AUTHORIZATION_CODE_TTL_SECONDS: "5"
  LIGHTCLAW_OIDC_ID_TOKEN_TTL_SECONDS: "300"
  LIGHTCLAW_OIDC_ACCESS_TOKEN_TTL_SECONDS: "300"
  LIGHTCLAW_OIDC_ACCESS_TOKEN_AUDIENCE: ""
  LIGHTCLAW_PAYMENT_METHODS_ENABLED: "false"
  LIGHTCLAW_SES_REGION: "ap-guangzhou"
  LIGHTCLAW_SES_FROM: "LightVela <noreply@service.lightvela.com>"
  CONTENT_AUDIT_ENABLED: "false"
  CONTENT_AUDIT_AVATAR_ENABLED: "false"
  CONTENT_AUDIT_WORKER_INTERVAL_SECONDS: "30"
  CONTENT_AUDIT_WORKER_BATCH_SIZE: "20"
  CONTENT_AUDIT_TIMEOUT_MINUTES: "15"
  SHADOW_BASIC_AUTH_SYNC_ENABLED: "false"
  LIGHTCLAW_TRUSTED_PROXY_CIDRS: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightclaw-auth
  namespace: user-auth
spec:
  replicas: 3
  selector:
    matchLabels:
      app: lightclaw-auth
  template:
    metadata:
      labels:
        app: lightclaw-auth
      annotations:
        lightclaw-auth.clawhub.dev/redeploy-at: "REPLACE_AUTH_DEPLOYED_AT"
    spec:
      nodeSelector:
        pool: REPLACE_AUTH_NODE_POOL
      initContainers:
        - name: wait-db-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: lightclaw-auth-config
            - secretRef:
                name: lightclaw-auth-secrets
            - secretRef:
                name: lightclaw-auth-content-audit-secrets
                optional: true
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${LIGHTCLAW_AUTH_DB_USER}" \
                --password="${LIGHTCLAW_AUTH_DB_PASSWORD}" \
                -Nse "SELECT IF((SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='${LIGHTCLAW_AUTH_DB}' AND TABLE_NAME IN ('users','invites','auth_sessions','verification_rate_limits','oidc_authorization_codes')) = 5 AND (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='${LIGHTCLAW_AUTH_DB}' AND TABLE_NAME='sms_challenges' AND COLUMN_NAME IN ('generation','reservation_id')) = 2 AND (SELECT COUNT(*) FROM information_schema.COLUMNS WHERE TABLE_SCHEMA='${LIGHTCLAW_AUTH_DB}' AND TABLE_NAME='phone_auth_challenges' AND COLUMN_NAME IN ('generation','reservation_id')) = 2, 1, 0)" | grep -qx '1'; do
                echo "waiting for auth schema"
                sleep 3
              done
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: lightclaw-auth
      containers:
        - name: auth
          image: REPLACE_AUTH_IMAGE
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: lightclaw-auth-config
            - secretRef:
                name: lightclaw-auth-secrets
            - secretRef:
                name: lightclaw-auth-content-audit-secrets
                optional: true
          env:
            - name: CONTENT_AUDIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: lightclaw-auth-config
                  key: CONTENT_AUDIT_ENABLED
            - name: CONTENT_AUDIT_AVATAR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: lightclaw-auth-config
                  key: CONTENT_AUDIT_AVATAR_ENABLED
            - name: LIGHTCLAW_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lightclaw-auth-secrets
                  key: LIGHTCLAW_ADMIN_TOKEN
            - name: LIGHTCLAW_GITHUB_CLIENT_ID
              valueFrom:
                configMapKeyRef:
                  name: lightclaw-auth-config
                  key: LIGHTCLAW_GITHUB_CLIENT_ID
            - name: LIGHTCLAW_GITHUB_REDIRECT_URI
              valueFrom:
                configMapKeyRef:
                  name: lightclaw-auth-config
                  key: LIGHTCLAW_GITHUB_REDIRECT_URI
          ports:
            - name: http
              containerPort: 8081
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightclaw-auth-content-audit-worker
  namespace: user-auth
spec:
  replicas: 0
  selector:
    matchLabels:
      app: lightclaw-auth-content-audit-worker
  template:
    metadata:
      labels:
        app: lightclaw-auth-content-audit-worker
      annotations:
        lightclaw-auth.clawhub.dev/redeploy-at: "REPLACE_AUTH_DEPLOYED_AT"
    spec:
      nodeSelector:
        pool: REPLACE_AUTH_NODE_POOL
      containers:
        - name: content-audit-worker
          image: REPLACE_AUTH_IMAGE
          imagePullPolicy: Always
          command:
            - lightclaw-auth-content-audit-worker
          envFrom:
            - configMapRef:
                name: lightclaw-auth-config
            - secretRef:
                name: lightclaw-auth-secrets
            - secretRef:
                name: lightclaw-auth-content-audit-secrets
                optional: true
          env:
            - name: CONTENT_AUDIT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: lightclaw-auth-config
                  key: CONTENT_AUDIT_ENABLED
            - name: CONTENT_AUDIT_AVATAR_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: lightclaw-auth-config
                  key: CONTENT_AUDIT_AVATAR_ENABLED
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: lightclaw-auth
  namespace: user-auth
spec:
  selector:
    app: lightclaw-auth
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: lightclaw-auth-internal
  namespace: user-auth
  annotations:
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: REPLACE_AUTH_INTERNAL_SUBNET_ID
spec:
  type: LoadBalancer
  selector:
    app: lightclaw-auth
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lightclaw-auth
  namespace: user-auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lightclaw-auth
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 3
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
