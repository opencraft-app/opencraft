apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raft-api-data
  namespace: raft-platform
  labels:
    app.kubernetes.io/name: raft-api
    app.kubernetes.io/part-of: raft-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: cbs-bj8-wffc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raft-api
  namespace: raft-platform
  labels:
    app.kubernetes.io/name: raft-api
    app.kubernetes.io/part-of: raft-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: raft-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: raft-api
        app.kubernetes.io/part-of: raft-platform
    spec:
      imagePullSecrets:
        - name: tcr.ipstcr-regcred
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      initContainers:
        - name: data-permissions
          image: busybox:1.37.0
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              chown 65532:65532 /var/lib/chatserver
              chmod 0700 /var/lib/chatserver
              if [ -f /var/lib/chatserver/chatserver.db ]; then
                chown 65532:65532 /var/lib/chatserver/chatserver.db
                chmod 0600 /var/lib/chatserver/chatserver.db
              fi
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/chatserver
      containers:
        - name: api
          image: lightclaw-bj8.tencentcloudcr.com/lightclaw/raft-platform-api@sha256:3bb3ad8f1aed54d1b4152f502a87a4f541120ffcc90baf80aab0b23d875ba987
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --database
            - /var/lib/chatserver/chatserver.db
            - --listen
            - 0.0.0.0:8080
            - --jwt-key-file
            - /var/run/secrets/chatserver/jwt.key
            - --im-sdk-app-id
            - "1600154578"
            - --im-admin-user-id
            - administrator
            - --im-secret-key-file
            - /var/run/secrets/chatserver/im-secret.key
            - --im-identity-key-file
            - /var/run/secrets/chatserver/im-identity.key
            - --im-callback-token-file
            - /var/run/secrets/chatserver/im-callback.token
            - --agent-artifact-base-url
            - https://raft.lightvela.com/artifacts
            - --agent-artifact-version
            - v0.1.3-canary.20260731
            - --platform-public-url
            - https://raft.lightvela.com
            - --cors-origin
            - https://raft.lightvela.com
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
          volumeMounts:
            - name: data
              mountPath: /var/lib/chatserver
            - name: secrets
              mountPath: /var/run/secrets/chatserver
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: raft-api-data
        - name: secrets
          secret:
            secretName: raft-api-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: raft-api
  namespace: raft-platform
  labels:
    app.kubernetes.io/name: raft-api
    app.kubernetes.io/part-of: raft-platform
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: raft-api
  ports:
    - name: http
      port: 80
      targetPort: http
