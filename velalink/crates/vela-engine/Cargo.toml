[package]
name = "vela-engine"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
codex-core-local = [
  "dep:allocative",
  "dep:codex-core",
  "dep:codex-exec-server",
  "dep:codex-extension-api",
  "dep:codex-login",
  "dep:codex-protocol",
  "dep:hashbrown",
  "dep:tempfile",
]

[dependencies]
allocative = { version = "=0.3.4", optional = true }
anyhow.workspace = true
async-trait.workspace = true
hashbrown = { version = "=0.14.5", optional = true }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true
vela-backends.workspace = true
vela-core.workspace = true

codex-core = { path = "../../vendor/openai-codex/codex-rs/core", optional = true, default-features = false }
codex-exec-server = { path = "../../vendor/openai-codex/codex-rs/exec-server", optional = true }
codex-extension-api = { path = "../../vendor/openai-codex/codex-rs/ext/extension-api", optional = true }
codex-login = { path = "../../vendor/openai-codex/codex-rs/login", optional = true }
codex-protocol = { path = "../../vendor/openai-codex/codex-rs/protocol", optional = true }

[dev-dependencies]
tempfile.workspace = true
