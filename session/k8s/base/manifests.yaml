apiVersion: v1
kind: ConfigMap
metadata:
  name: session-config
  namespace: user-auth
data:
  SESSION_ADDR: ":8087"
  SESSION_ALLOWED_ORIGINS: "REPLACE_SESSION_ALLOWED_ORIGINS"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: session
  namespace: user-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session
  template:
    metadata:
      labels:
        app: session
      annotations:
        session.clawhub.dev/redeploy-at: "REPLACE_SESSION_DEPLOYED_AT"
    spec:
      nodeSelector:
        pool: REPLACE_SESSION_NODE_POOL
      containers:
        - name: session
          image: REPLACE_SESSION_IMAGE
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: session-config
            - secretRef:
                name: session-runtime-secrets
          ports:
            - name: http
              containerPort: 8087
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: session
  namespace: user-auth
spec:
  selector:
    app: session
  ports:
    - name: http
      port: 80
      targetPort: http
