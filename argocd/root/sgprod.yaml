apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-sgprod
  namespace: argocd
spec:
  project: sgprod-root
  sources:
    - repoURL: git@git.woa.com:wisp/mono2.git
      targetRevision: gitops
      path: argocd/apps/sgprod
    - repoURL: git@git.woa.com:wisp/mono2.git
      targetRevision: gitops
      path: argocd/projects
      directory:
        include: sgprod*.yaml
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
