apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-root-mono
  source:
    repoURL: https://code.lightclaw.tech/root/mono-source.git
    targetRevision: master
    path: argocd/apps/beijing-sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
