apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-devcloud-dep
  namespace: argocd
spec:
  project: devcloud-dep-root
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/apps/devcloud-dep
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
