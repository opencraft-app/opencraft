apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-shprod
  namespace: argocd
spec:
  project: shprod-root-mono
  source:
    repoURL: https://code.lightclaw.tech/root/mono-source.git
    targetRevision: master
    path: argocd/apps/shprod
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
