apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-shprod
  namespace: argocd
spec:
  project: shprod-root
  sources:
    - repoURL: git@git.woa.com:wisp/mono2.git
      targetRevision: gitops
      path: argocd/apps/shprod
    - repoURL: git@git.woa.com:wisp/mono2.git
      targetRevision: gitops
      path: argocd/projects
      directory:
        include: shprod*.yaml
  destination:
    namespace: argocd
    server: https://kubernetes.default.svc
