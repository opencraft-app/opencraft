apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-shprod
  namespace: argocd
spec:
  project: shprod
  source:
    repoURL: https://code.lightclaw.tech/<group-or-user>/<repo>.git
    targetRevision: gitops
    path: argocd/apps/shprod
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

# 说明：
# - 这是 root app 模板，不是可直接应用的现网入口
# - 真正启用前，需要把 repoURL 改成实际中心 Git 仓库地址
# - 上海正式环境默认不启用 syncPolicy.automated；GitOps 合入后由人工或发布系统执行 Argo sync
