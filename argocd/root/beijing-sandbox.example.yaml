apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-sandbox
  source:
    repoURL: https://code.lightclaw.tech/<group-or-user>/<repo>.git
    targetRevision: master
    path: argocd/apps/beijing-sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

# 说明：
# - 这是 root app 模板，不是可直接应用的现网入口
# - 真正启用前，需要把 repoURL 改成实际中心 GitLab 仓库地址
