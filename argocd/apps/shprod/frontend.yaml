apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-shprod
  namespace: argocd
spec:
  project: shprod-frontend
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: master
    path: argocd/services/frontend/shprod
  destination:
    namespace: frontend
    name: shprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
