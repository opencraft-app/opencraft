apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admin-gateway-shprod
  namespace: argocd
spec:
  project: shprod-admin-gateway
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/admin-gateway/shprod
  destination:
    namespace: lightclaw-gateway
    name: shprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
