apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai-gateway-shprod
  namespace: argocd
spec:
  project: shprod-ai-gateway
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/ai-gateway/shprod
  destination:
    namespace: ai-gateway
    name: shprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
