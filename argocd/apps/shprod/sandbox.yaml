apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sandbox-shprod
  namespace: argocd
spec:
  project: shprod-sandbox
  source:
    repoURL: https://code.lightclaw.tech/root/mono-source.git
    targetRevision: master
    path: argocd/services/sandbox/shprod
  destination:
    namespace: sandbox
    name: shprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
