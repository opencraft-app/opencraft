apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ctl-shprod
  namespace: argocd
spec:
  project: shprod-ctl
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: master
    path: argocd/services/ctl/shprod
  destination:
    namespace: ctl
    name: shprod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
