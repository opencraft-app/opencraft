apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velagw-sgprod
  namespace: argocd
spec:
  project: sgprod-velagw
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/velagw/sgprod
  destination:
    namespace: llmgateway
    name: johorbahru-llmgateway-prod
  syncPolicy:
    syncOptions:
      - PruneLast=true
      - ServerSideApply=true
