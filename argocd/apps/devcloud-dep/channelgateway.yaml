apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: channelgateway-devcloud-dep
  namespace: argocd
spec:
  project: devcloud-dep
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/channelgateway/devcloud-dep
  destination:
    namespace: dep
    name: devcloud-dep
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
