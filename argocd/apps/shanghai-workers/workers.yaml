apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: workers-shanghai-workers
  namespace: argocd
spec:
  project: shanghai-workers
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/workers/shanghai-workers
  destination:
    namespace: temporal-workers
    name: shanghai-workers
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
