apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velagw-beijing-llmgateway
  namespace: argocd
spec:
  project: beijing-llmgateway
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/velagw/beijing-llmgateway
  destination:
    namespace: llmgateway
    name: beijing-llmgateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - PruneLast=true
      - RespectIgnoreDifferences=true
      - ServerSideApply=true
