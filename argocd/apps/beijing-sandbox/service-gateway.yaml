apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: service-gateway-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-sandbox
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/service-gateway/beijing-sandbox
  destination:
    name: beijing-sandbox
    namespace: lightclaw-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
