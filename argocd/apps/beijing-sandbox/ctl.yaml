apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ctl-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-sandbox-mono
  source:
    repoURL: https://code.lightclaw.tech/root/mono-source.git
    targetRevision: master
    path: argocd/services/ctl/beijing-sandbox
  destination:
    name: beijing-sandbox
    namespace: ctl
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
