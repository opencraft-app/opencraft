apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: session-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-sandbox
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/session/beijing-sandbox
  destination:
    name: beijing-sandbox
    namespace: user-auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
