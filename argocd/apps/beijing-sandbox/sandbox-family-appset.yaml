apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sandbox-family
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - git:
        repoURL: git@git.woa.com:wisp/mono2.git
        revision: gitops
        files:
          - path: argocd/catalogs/sandbox/*/*.yaml
          - path: argocd/catalogs/playground/beijing-playground/*/*.yaml
  template:
    metadata:
      name: '{{ .service }}-{{ .env }}'
      labels:
        lightclaw.dev/environment-family: sandbox
        lightclaw.dev/environment-name: '{{ .env }}'
        lightclaw.dev/service: '{{ .service }}'
    spec:
      project: '{{ .project }}'
      source:
        repoURL: git@git.woa.com:wisp/mono2.git
        targetRevision: gitops
        path: '{{ .sourcePath }}'
      destination:
        name: '{{ .destinationName }}'
        namespace: '{{ .namespace }}'
      ignoreDifferences:
        - group: ""
          kind: ServiceAccount
          name: default
          jsonPointers:
            - /imagePullSecrets
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
