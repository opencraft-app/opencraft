apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-runtime-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-argocd-runtime
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/runtime/beijing-sandbox
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
