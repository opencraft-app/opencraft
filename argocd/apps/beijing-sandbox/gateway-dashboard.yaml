apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-dashboard-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-sandbox
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: master
    path: argocd/services/gateway-dashboard/beijing-sandbox
  destination:
    name: beijing-sandbox
    namespace: ai-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
