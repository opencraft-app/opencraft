apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: subscription-beijing-sandbox
  namespace: argocd
spec:
  project: beijing-sandbox
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: master
    path: argocd/services/subscription/beijing-sandbox
  destination:
    name: beijing-sandbox
    namespace: user-auth
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
