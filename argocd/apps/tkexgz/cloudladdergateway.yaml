apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cloudladdergateway-tkexgz
  namespace: argocd
spec:
  project: tkexgz
  source:
    repoURL: git@git.woa.com:wisp/mono2.git
    targetRevision: gitops
    path: argocd/services/cloudladdergateway/tkexgz
  destination:
    namespace: ns-prjqt8dd-867795-production
    name: tkexgz
  ignoreDifferences:
    - group: platform.stke
      kind: StatefulSetPlus
      name: lightvela-proxy-testing
      namespace: ns-prjqt8dd-867795-production
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /spec/template/metadata/creationTimestamp
      jqPathExpressions:
        - '.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"'
        - .spec.template.metadata.creationTimestamp
    - group: platform.stke
      kind: StatefulSetPlus
      name: lightvela-proxy-staging
      namespace: ns-prjqt8dd-867795-production
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /metadata/annotations/tkex-samename-count
        - /spec/template/metadata/creationTimestamp
      jqPathExpressions:
        - '.metadata.annotations."kubectl.kubernetes.io/last-applied-configuration"'
        - .spec.template.metadata.creationTimestamp
    - group: extensions
      kind: Ingress
      name: vela-proxy-ingress-prod
      namespace: ns-prjqt8dd-867795-production
      jsonPointers:
        - /metadata/annotations/ingress.cloud.tencent.com~1client-token
        - /metadata/annotations/ingress.cloud.tencent.com~1status.conditions
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /metadata/finalizers
    - group: extensions
      kind: Ingress
      name: vela-proxy-ingress-testing
      namespace: ns-prjqt8dd-867795-production
      jsonPointers:
        - /metadata/annotations/ingress.cloud.tencent.com~1client-token
        - /metadata/annotations/ingress.cloud.tencent.com~1status.conditions
        - /metadata/annotations/kubernetes.io~1ingress.qcloud-loadbalance-id
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /metadata/finalizers
    - group: extensions
      kind: Ingress
      name: vela-proxy-ingress-staging
      namespace: ns-prjqt8dd-867795-production
      jsonPointers:
        - /metadata/annotations/ingress.cloud.tencent.com~1client-token
        - /metadata/annotations/ingress.cloud.tencent.com~1status.conditions
        - /metadata/annotations/kubernetes.io~1ingress.qcloud-loadbalance-id
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /metadata/finalizers
    - kind: Service
      name: lightvela-proxy-service-prod
      namespace: ns-prjqt8dd-867795-production
      jsonPointers:
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /metadata/annotations/service.cloud.tencent.com~1sync-begin-time
        - /metadata/annotations/service.cloud.tencent.com~1sync-end-time
    - kind: Service
      name: lightvela-proxy-service-testing
      namespace: ns-prjqt8dd-867795-production
      jsonPointers:
        - /spec/clusterIP
        - /spec/clusterIPs
        - /metadata/annotations/kubectl.kubernetes.io~1last-applied-configuration
        - /metadata/annotations/service.cloud.tencent.com~1sync-begin-time
        - /metadata/annotations/service.cloud.tencent.com~1sync-end-time
    - kind: Service
      name: lightvela-proxy-service-staging
      namespace: ns-prjqt8dd-867795-production
