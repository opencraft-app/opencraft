apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
  namespace: argocd
spec:
  template:
    spec:
      volumes:
        - name: custom-tools
          emptyDir: {}
        - name: kustomize-plugin-home
          emptyDir: {}
        - name: sops-age
          secret:
            secretName: sops-age
      initContainers:
        - name: install-ksops
          image: viaductoss/ksops:v4.5.1
          command:
            - /usr/local/bin/ksops
            - install
            - --with-kustomize
            - /custom-tools
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
        - name: install-ksops-plugin
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - mkdir -p /plugins/viaduct.ai/v1/ksops && cp /custom-tools/ksops /plugins/viaduct.ai/v1/ksops/ksops && chmod +x /plugins/viaduct.ai/v1/ksops/ksops
          volumeMounts:
            - mountPath: /custom-tools
              name: custom-tools
            - mountPath: /plugins
              name: kustomize-plugin-home
      containers:
        - name: argocd-repo-server
          env:
            - name: XDG_CONFIG_HOME
              value: /.config
            - name: SOPS_AGE_KEY_FILE
              value: /.config/sops/age/keys.txt
            - name: KUSTOMIZE_PLUGIN_HOME
              value: /.config/kustomize/plugin
          volumeMounts:
            - mountPath: /usr/local/bin/kustomize
              name: custom-tools
              subPath: kustomize
            - mountPath: /usr/local/bin/ksops
              name: custom-tools
              subPath: ksops
            - mountPath: /.config/sops/age
              name: sops-age
            - mountPath: /.config/kustomize/plugin
              name: kustomize-plugin-home
