server:
  proxyPort: 8080
  apiPort: 8081

proxy:
  maxIdleConns: 1000
  maxIdleConnsPerHost: 500
  timeout: 30s
  compression: true

cors:
  allowedOrigins:
    - "*"

output:
  format: short

pages:
  - domain: preview.lightclaw.tech
    bucket:
      applicationId: ENV(STATICPAGES_COS_SECRET_ID)
      name: webhosting-1388575217
      region: ap-beijing
      secret: ENV(STATICPAGES_COS_SECRET_KEY)
      url: https://cos.ap-beijing.myqcloud.com
      usePathStyle: false
      publicRead: true
    git:
      provider: bearer
      repository: wisp/mono2
      mainBranch: master
      bearer:
        token: ENV(STATICPAGES_UPLOAD_TOKEN)
    preview:
      enabled: true
      branch: true
      environment: false
      sha: false
    proxy:
      url: https://webhosting-1388575217.cos.ap-beijing.myqcloud.com
      path: ""
      originBypass: false
      searchPath:
        - /index.html
        - /index.htm
      notFound: index.html
