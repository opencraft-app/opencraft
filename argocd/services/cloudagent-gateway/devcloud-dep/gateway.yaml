apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudagent-gateway-config
  labels:
    app.kubernetes.io/name: cloudagent-gateway
    cloudagent.dev/environment: devcloud-dep
data:
  GATEWAY_ADDR: ":8080"
  GATEWAY_DATA_DIR: "/data/gateway"
  GATEWAY_WORKER_MODE: "agent_injected"
  GATEWAY_AGS_REQUEST_TIMEOUT_SECONDS: "300"
  GATEWAY_DEFAULT_TENANT_ID: "tenant-devcloud-dep"
  GATEWAY_DEFAULT_PROJECT_ID: "project-devcloud-dep"
  TOKENHUB_MODEL: "minimax-m2.7"
  GATEWAY_AGS_DOMAIN: "ap-shanghai.tencentags.com"
  GATEWAY_AGS_API_URL: "https://api.ap-shanghai.tencentags.com"
  E2B_DOMAIN: "ap-shanghai.tencentags.com"
  GATEWAY_AGENT_OUTER_RUNTIME: "wisp"
  GATEWAY_AGS_TEMPLATE: "REPLACE_ME_DEVCLOUD_DEP_AGS_TEMPLATE"
  GATEWAY_AGENT_SIDECAR_INNER_TEMPLATE: "REPLACE_ME_DEVCLOUD_DEP_AGS_TEMPLATE"
  GATEWAY_TALOS_TEMPLATE: "REPLACE_ME_DEVCLOUD_DEP_TALOS_TEMPLATE"
  GATEWAY_AGENT_SIDECAR_URL: "REPLACE_ME_DEVCLOUD_DEP_CLOUDAGENT_SIDECAR_URL"
  GATEWAY_AGENT_SIDECAR_SHA256: "REPLACE_ME_DEVCLOUD_DEP_CLOUDAGENT_SIDECAR_SHA256"
  GATEWAY_SANDBOX_HOST_URL: "REPLACE_ME_DEVCLOUD_DEP_SANDBOX_HOST_URL"
  GATEWAY_SANDBOX_HOST_SHA256: "REPLACE_ME_DEVCLOUD_DEP_SANDBOX_HOST_SHA256"
  GATEWAY_SANDBOX_HOST_TRANSPORT: "cli"
  GATEWAY_SANDBOX_HOST_ALLOW_CLI_FALLBACK: "false"
  GATEWAY_WISP_SMH_LIBRARY_ID: "smh37laghvp09llc"
  GATEWAY_WISP_SMH_ACCESS_DOMAIN: "https://smh37laghvp09llc.ap-shanghai.api.tencentsmh.cn"
  GATEWAY_WISP_PACKAGE_FORMAT: "erofs"
  GATEWAY_WISP_PACKAGE_URL: "REPLACE_ME_DEVCLOUD_DEP_WISP_PACKAGE_URL"
  GATEWAY_WISP_PACKAGE_SHA256: "REPLACE_ME_DEVCLOUD_DEP_WISP_PACKAGE_SHA256"
  GATEWAY_WISP_JFS_PREFIX: "cloudagent-devcloud-dep"
  GATEWAY_WISP_ROOT_UPPER_SIZE: "10G"
  GATEWAY_WISP_WORKSPACE_LEASE_TTL_SECONDS: "180"
  GATEWAY_RUNTIME_WARM_POOL_ENABLED: "false"
  GATEWAY_RUNTIME_WARM_POOL_SHARED_STORE_CONFIRMED: "true"
  GATEWAY_DB_DRIVER: "mysql"
  GATEWAY_RUNTIME_WARM_POOL_DB_DRIVER: "mysql"
  GATEWAY_RUNTIME_WARM_POOL_DESIRED_READY: "5"
  GATEWAY_RUNTIME_WARM_POOL_RECHECK_SECONDS: "15"
  GATEWAY_RUNTIME_WARM_POOL_AGENT_VERSION: "builtin.v1"
  GATEWAY_RUNTIME_WARM_POOL_WORKSPACE_VERSION: "builtin.v1"
  GATEWAY_RUNTIME_WARM_POOL_WORKFLOW_ID: "cloudagent-runtime-pool-devcloud-dep-v8-1a586956"
  TEMPORAL_ADDRESS: "101.42.133.109:443"
  TEMPORAL_NAMESPACE: "default"
  TEMPORAL_TLS: "true"
  TEMPORAL_TLS_SERVER_NAME: "temporal-frontend.lightclaw.tech"
  TEMPORAL_TASK_QUEUE: "cloudagent-runtime-pool-devcloud-dep"
  CLOUDAGENT_WEB_SEARCH_PROVIDER: "tencent_wsa"
  TENCENTCLOUD_WSA_ENDPOINT: "https://api.wsa.cloud.tencent.com/SearchPro"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudagent-gateway
  labels:
    app.kubernetes.io/name: cloudagent-gateway
    cloudagent.dev/environment: devcloud-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudagent-gateway
  template:
    metadata:
      annotations:
        cloudagent.dev/redeploy-at: 2026-06-03T00:00:00Z
      labels:
        app.kubernetes.io/name: cloudagent-gateway
        cloudagent.dev/environment: devcloud-dep
    spec:
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: csighub-skipzhang
        - name: csighub-xinqishang
      containers:
        - name: gateway
          image: csighub.tencentyun.com/skipzhang/cloudagent-gateway:devcloud-dep-bootstrap
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: cloudagent-gateway-config
          env:
            - name: GATEWAY_AGS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-gateway-runtime-secrets
                  key: GATEWAY_AGS_API_KEY
            - name: GATEWAY_TOKENHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-gateway-runtime-secrets
                  key: GATEWAY_TOKENHUB_API_KEY
            - name: GATEWAY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-gateway-runtime-secrets
                  key: GATEWAY_API_KEY
                  optional: true
            - name: GATEWAY_TALOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-gateway-runtime-secrets
                  key: GATEWAY_TALOS_API_KEY
                  optional: true
            - name: TENCENTCLOUD_WSA_APIKEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-wsa-search-secrets
                  key: TENCENTCLOUD_WSA_APIKEY
                  optional: true
            - name: GATEWAY_WISP_SMH_LIBRARY_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudagent-wisp-secrets
                  key: GATEWAY_WISP_SMH_LIBRARY_SECRET
            - name: GATEWAY_RUNTIME_WARM_POOL_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: cloudagent-runtime-pool-secrets
                  key: GATEWAY_RUNTIME_WARM_POOL_DB_DSN
            - name: GATEWAY_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: cloudagent-runtime-pool-secrets
                  key: GATEWAY_RUNTIME_WARM_POOL_DB_DSN
          volumeMounts:
            - name: gateway-data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
      volumes:
        - name: gateway-data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudagent-runtime-pool-worker
  labels:
    app.kubernetes.io/name: cloudagent-runtime-pool-worker
    cloudagent.dev/environment: devcloud-dep
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudagent-runtime-pool-worker
  template:
    metadata:
      annotations:
        cloudagent.dev/redeploy-at: 2026-06-03T00:00:00Z
      labels:
        app.kubernetes.io/name: cloudagent-runtime-pool-worker
        cloudagent.dev/environment: devcloud-dep
    spec:
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: csighub-skipzhang
        - name: csighub-xinqishang
      containers:
        - name: runtime-pool-worker
          image: csighub.tencentyun.com/skipzhang/cloudagent-gateway:devcloud-dep-bootstrap
          imagePullPolicy: Always
          command:
            - /usr/local/bin/runtime-pool-worker
          envFrom:
            - configMapRef:
                name: cloudagent-gateway-config
          env:
            - name: GATEWAY_AGS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-gateway-runtime-secrets
                  key: GATEWAY_AGS_API_KEY
            - name: GATEWAY_TOKENHUB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-gateway-runtime-secrets
                  key: GATEWAY_TOKENHUB_API_KEY
            - name: GATEWAY_TALOS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: cloudagent-gateway-runtime-secrets
                  key: GATEWAY_TALOS_API_KEY
                  optional: true
            - name: GATEWAY_WISP_SMH_LIBRARY_SECRET
              valueFrom:
                secretKeyRef:
                  name: cloudagent-wisp-secrets
                  key: GATEWAY_WISP_SMH_LIBRARY_SECRET
            - name: TEMPORAL_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudagent-runtime-pool-secrets
                  key: TEMPORAL_AUTH_TOKEN
            - name: GATEWAY_RUNTIME_WARM_POOL_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: cloudagent-runtime-pool-secrets
                  key: GATEWAY_RUNTIME_WARM_POOL_DB_DSN
            - name: GATEWAY_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: cloudagent-runtime-pool-secrets
                  key: GATEWAY_RUNTIME_WARM_POOL_DB_DSN
          volumeMounts:
            - name: runtime-pool-worker-data
              mountPath: /data
      volumes:
        - name: runtime-pool-worker-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: cloudagent-gateway
  annotations:
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: "REPLACE_ME_DEVCLOUD_DEP_INTERNAL_SUBNET_ID"
  labels:
    app.kubernetes.io/name: cloudagent-gateway
    cloudagent.dev/environment: devcloud-dep
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: cloudagent-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
