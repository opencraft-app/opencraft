apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: cloudagent

resources:
  - ../../../../cloudagent/gateway/k8s/base

generators:
  - ksops-secret-generator.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: cloudagent-gateway-platform-values
    envs:
      - cloudagent-gateway-platform.env

patches:
  - target:
      kind: Deployment
      name: gateway
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations
        value:
          cloudagent.dev/redeploy-at: bootstrap

replacements:
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_IMAGE
    targets:
      - select:
          kind: Deployment
          name: gateway
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: gateway
        fieldPaths:
          - spec.template.metadata.annotations.[cloudagent.dev/redeploy-at]
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_PUBLIC_HOST
    targets:
      - select:
          kind: Ingress
          name: gateway-public
        fieldPaths:
          - spec.rules.0.host
      - select:
          kind: TkeServiceConfig
          name: gateway-public-config
        fieldPaths:
          - spec.loadBalancer.l7Listeners.0.domains.0.domain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.0.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.1.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.2.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.3.healthCheck.httpCheckDomain
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_AGS_TEMPLATE
    targets:
      - select:
          kind: ConfigMap
          name: gateway-config
        fieldPaths:
          - data.GATEWAY_AGS_TEMPLATE
          - data.GATEWAY_AGENT_SIDECAR_INNER_TEMPLATE
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_AGENT_SIDECAR_URL
    targets:
      - select:
          kind: ConfigMap
          name: gateway-config
        fieldPaths:
          - data.GATEWAY_AGENT_SIDECAR_URL
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_AGENT_SIDECAR_SHA256
    targets:
      - select:
          kind: ConfigMap
          name: gateway-config
        fieldPaths:
          - data.GATEWAY_AGENT_SIDECAR_SHA256
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_SANDBOX_HOST_URL
    targets:
      - select:
          kind: ConfigMap
          name: gateway-config
        fieldPaths:
          - data.GATEWAY_SANDBOX_HOST_URL
  - source:
      kind: ConfigMap
      name: cloudagent-gateway-platform-values
      fieldPath: data.CLOUDAGENT_GATEWAY_SANDBOX_HOST_SHA256
    targets:
      - select:
          kind: ConfigMap
          name: gateway-config
        fieldPaths:
          - data.GATEWAY_SANDBOX_HOST_SHA256
