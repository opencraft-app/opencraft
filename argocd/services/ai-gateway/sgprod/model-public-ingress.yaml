apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-model-public
  namespace: ai-gateway
  annotations:
    kubernetes.io/ingress.class: qcloud
    ingress.cloud.tencent.com/tke-service-config: gateway-model-public-config
    ingress.cloud.tencent.com/modification-protection: "false"
    ingress.cloud.tencent.com/direct-access: "true"
    ingress.cloud.tencent.com/pass-to-target: "true"
    ingress.cloud.tencent.com/rewrite-support: "true"
    ingress.cloud.tencent.com/auto-rewrite: "true"
spec:
  ingressClassName: qcloud
  tls:
    - hosts:
        - REPLACE_AI_GATEWAY_MODEL_PUBLIC_HOST
      secretName: REPLACE_AI_GATEWAY_MODEL_PUBLIC_TLS_SECRET_NAME
  rules:
    - host: REPLACE_AI_GATEWAY_MODEL_PUBLIC_HOST
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
          - path: /v1beta
            pathType: Prefix
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
          - path: /
            pathType: Exact
            backend:
              service:
                name: gateway-model-ingress
                port:
                  number: 80
---
apiVersion: cloud.tencent.com/v1alpha1
kind: TkeServiceConfig
metadata:
  name: gateway-model-public-config
  namespace: ai-gateway
spec:
  loadBalancer:
    l7Listeners:
      - protocol: HTTP
        port: 80
        domains:
          - domain: REPLACE_AI_GATEWAY_MODEL_PUBLIC_HOST
            rules:
              - url: /v1
                forwardType: HTTP
                healthCheck: &modelPublicHealthCheck
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /health
                  httpCheckDomain: REPLACE_AI_GATEWAY_MODEL_PUBLIC_HOST
                  httpCheckMethod: GET
                  httpCode: 2
              - url: /v1beta
                forwardType: HTTP
                healthCheck: *modelPublicHealthCheck
              - url: =/health
                forwardType: HTTP
                healthCheck: *modelPublicHealthCheck
              - url: =/
                forwardType: HTTP
                healthCheck: *modelPublicHealthCheck
      - protocol: HTTPS
        port: 443
        defaultServer: REPLACE_AI_GATEWAY_MODEL_PUBLIC_HOST
        domains:
          - domain: REPLACE_AI_GATEWAY_MODEL_PUBLIC_HOST
            rules:
              - url: /v1
                forwardType: HTTP
                healthCheck: *modelPublicHealthCheck
              - url: /v1beta
                forwardType: HTTP
                healthCheck: *modelPublicHealthCheck
              - url: =/health
                forwardType: HTTP
                healthCheck: *modelPublicHealthCheck
              - url: =/
                forwardType: HTTP
                healthCheck: *modelPublicHealthCheck
