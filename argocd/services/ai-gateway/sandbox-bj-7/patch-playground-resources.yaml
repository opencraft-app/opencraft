apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-backend
  namespace: ai-gateway
spec:
  template:
    spec:
      containers:
        - name: aigateway
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
        - name: portkey
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
