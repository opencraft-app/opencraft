apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-bj-7
components:
- ../common
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: ai-gateway-platform-values
  envs:
  - ai-gateway-platform.env
- name: gateway-backend-config
  files:
  - config.yaml=config.yaml
patches:
- path: delete-shared-namespace.yaml
- path: delete-shared-serviceaccount.yaml
- path: patch-playground-replicas.yaml
- path: patch-playground-hpa.yaml
- path: patch-playground-db.yaml
- path: patch-playground-resources.yaml
