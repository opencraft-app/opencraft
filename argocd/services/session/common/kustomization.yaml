apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: user-auth
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: session-platform-values
    fieldPath: data.SESSION_ALLOWED_ORIGINS
  targets:
  - select:
      kind: ConfigMap
      name: session-config
    fieldPaths:
    - data.SESSION_ALLOWED_ORIGINS
- source:
    kind: ConfigMap
    name: session-platform-values
    fieldPath: data.SESSION_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: session
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: session-platform-values
    fieldPath: data.SESSION_IMAGE
  targets:
  - select:
      kind: Deployment
      name: session
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: session-platform-values
    fieldPath: data.SESSION_DEPLOYED_AT
  targets:
  - select:
      kind: Deployment
      name: session
    fieldPaths:
    - spec.template.metadata.annotations.[session.clawhub.dev/redeploy-at]
resources:
- ../../../../session/k8s/base
