apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandbox
resources:
- tls-secrets.yaml
components:
- ../common
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: sandbox-platform-values
  envs:
  - sandbox-platform.env
patches:
- path: delete-servicemonitor.yaml
- path: delete-podmonitor.yaml
- target:
    kind: Job
    name: sandbox-db-migrate-v2
  patch: "- op: replace\n  path: /metadata/name\n  value: sandbox-db-migrate-v3"
