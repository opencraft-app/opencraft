apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sandbox

resources:
  - ../../../../sandbox/k8s/base

patches:
  - path: patch-ingressproxy-router-service.yaml
  - path: delete-ingressproxy-router-ingress.yaml
  - path: delete-sandbox-ingress.yaml
  - path: delete-sandbox-ingress-config.yaml
  - path: delete-servicemonitor.yaml
  - path: delete-podmonitor.yaml
  - path: delete-migration-job.yaml

generators:
  - ksops-secret-generator.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: sandbox-platform-values
    envs:
      - sandbox-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.WEBSITE_CREDENTIAL_TAT_COMMAND_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.WEBSITE_CREDENTIAL_TAT_COMMAND_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_REDIS_ADDR
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.REDIS_ADDR
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_MYSQL_HOST
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.MYSQL_HOST
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.TENCENT_REGION
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.TENCENT_REGION
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_VPC_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_VPC_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: sandbox-api
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-router
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g0
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g1
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g2
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g3
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_SUPPORT_SUBNET_ID
    targets:
      - select:
          kind: Service
          name: sandbox-api-internal
        fieldPaths:
          - metadata.annotations.[service.kubernetes.io/qcloud-loadbalancer-internal-subnetid]
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_BJ8_SUBNET_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_BJ8_SUBNET_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_BJ8_ZONE
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_BJ8_ZONE
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C0_SUBNET_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C0_SUBNET_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C0_ZONE
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C0_ZONE
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C1_SUBNET_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C1_SUBNET_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C1_ZONE
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C1_ZONE
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C2_SUBNET_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C2_SUBNET_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C2_ZONE
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C2_ZONE
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C3_SUBNET_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C3_SUBNET_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C3_ZONE
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C3_ZONE
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C4_SUBNET_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C4_SUBNET_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C4_ZONE
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C4_ZONE
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C5_SUBNET_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C5_SUBNET_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_POOL_C5_ZONE
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_POOL_C5_ZONE
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_API_IMAGE
    targets:
      - select:
          kind: Deployment
          name: sandbox-api
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_MIGRATE_IMAGE
    targets:
      - select:
          kind: Job
          name: sandbox-db-migrate-v3
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_WORKER_IMAGE
    targets:
      - select:
          kind: Deployment
          name: sandbox-worker
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: StatefulSet
          name: sandbox-worker-sharded
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_INGRESSPROXY_ROUTER_IMAGE
    targets:
      - select:
          kind: Deployment
          name: ingressproxy-router
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_INGRESSPROXY_SHARD_IMAGE
    targets:
      - select:
          kind: Deployment
          name: ingressproxy-g0
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: ingressproxy-g1
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: ingressproxy-g2
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: ingressproxy-g3
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_API_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: sandbox-api
        fieldPaths:
          - spec.template.metadata.annotations.[sandbox.clawhub.dev/redeploy-at]
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_WORKER_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: sandbox-worker
        fieldPaths:
          - spec.template.metadata.annotations.[sandbox.clawhub.dev/redeploy-at]
      - select:
          kind: StatefulSet
          name: sandbox-worker-sharded
        fieldPaths:
          - spec.template.metadata.annotations.[sandbox.clawhub.dev/redeploy-at]
