apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sandbox
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_REDIS_ADDR
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.REDIS_ADDR
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_MYSQL_HOST
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.MYSQL_HOST
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.TENCENT_REGION
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.TENCENT_REGION
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_VPC_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_VPC_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: sandbox-api
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
  - select:
      kind: Deployment
      name: ingressproxy-router
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
  - select:
      kind: Deployment
      name: ingressproxy-g0
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
  - select:
      kind: Deployment
      name: ingressproxy-g1
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
  - select:
      kind: Deployment
      name: ingressproxy-g2
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
  - select:
      kind: Deployment
      name: ingressproxy-g3
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_SUPPORT_SUBNET_ID
  targets:
  - select:
      kind: Service
      name: sandbox-api-internal
    fieldPaths:
    - metadata.annotations.[service.kubernetes.io/qcloud-loadbalancer-internal-subnetid]
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_BJ8_SUBNET_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_BJ8_SUBNET_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_BJ8_ZONE
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_BJ8_ZONE
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C0_SUBNET_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C0_SUBNET_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C0_ZONE
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C0_ZONE
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C1_SUBNET_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C1_SUBNET_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C1_ZONE
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C1_ZONE
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C2_SUBNET_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C2_SUBNET_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C2_ZONE
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C2_ZONE
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C3_SUBNET_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C3_SUBNET_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C3_ZONE
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C3_ZONE
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C4_SUBNET_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C4_SUBNET_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C4_ZONE
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C4_ZONE
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C5_SUBNET_ID
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C5_SUBNET_ID
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_POOL_C5_ZONE
  targets:
  - select:
      kind: ConfigMap
      name: sandbox-runtime-config
    fieldPaths:
    - data.SANDBOX_POOL_C5_ZONE
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_INGRESSPROXY_PUBLIC_HOST
  targets:
  - select:
      kind: Ingress
      name: sandbox-ingressproxy-public
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0
  - select:
      kind: TkeServiceConfig
      name: sandbox-ingressproxy-public-config
    fieldPaths:
    - spec.loadBalancer.l7Listeners.0.domains.0.domain
    - spec.loadBalancer.l7Listeners.1.defaultServer
    - spec.loadBalancer.l7Listeners.1.domains.0.domain
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_INGRESSPROXY_HEALTHCHECK_HOST
  targets:
  - select:
      kind: TkeServiceConfig
      name: sandbox-ingressproxy-public-config
    fieldPaths:
    - spec.loadBalancer.l7Listeners.0.domains.0.rules.0.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.1.domains.0.rules.0.healthCheck.httpCheckDomain
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_INGRESSPROXY_TLS_SECRET_NAME
  targets:
  - select:
      kind: Ingress
      name: sandbox-ingressproxy-public
    fieldPaths:
    - spec.tls.0.secretName
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_API_IMAGE
  targets:
  - select:
      kind: Deployment
      name: sandbox-api
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_MIGRATE_IMAGE
  targets:
  - select:
      kind: Job
      name: sandbox-db-migrate-v3
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_WORKER_IMAGE
  targets:
  - select:
      kind: Deployment
      name: sandbox-worker
    fieldPaths:
    - spec.template.spec.containers.0.image
  - select:
      kind: StatefulSet
      name: sandbox-worker-sharded
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_INGRESSPROXY_ROUTER_IMAGE
  targets:
  - select:
      kind: Deployment
      name: ingressproxy-router
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_INGRESSPROXY_SHARD_IMAGE
  targets:
  - select:
      kind: Deployment
      name: ingressproxy-g0
    fieldPaths:
    - spec.template.spec.containers.0.image
  - select:
      kind: Deployment
      name: ingressproxy-g1
    fieldPaths:
    - spec.template.spec.containers.0.image
  - select:
      kind: Deployment
      name: ingressproxy-g2
    fieldPaths:
    - spec.template.spec.containers.0.image
  - select:
      kind: Deployment
      name: ingressproxy-g3
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_API_DEPLOYED_AT
  targets:
  - select:
      kind: Deployment
      name: sandbox-api
    fieldPaths:
    - spec.template.metadata.annotations.[sandbox.clawhub.dev/redeploy-at]
- source:
    kind: ConfigMap
    name: sandbox-platform-values
    fieldPath: data.SANDBOX_WORKER_DEPLOYED_AT
  targets:
  - select:
      kind: Deployment
      name: sandbox-worker
    fieldPaths:
    - spec.template.metadata.annotations.[sandbox.clawhub.dev/redeploy-at]
  - select:
      kind: StatefulSet
      name: sandbox-worker-sharded
    fieldPaths:
    - spec.template.metadata.annotations.[sandbox.clawhub.dev/redeploy-at]
resources:
- ../../../../sandbox/k8s/base
