apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingressproxy-router
  namespace: sandbox
spec:
  template:
    spec:
      containers:
        - name: ingressproxy-router
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
