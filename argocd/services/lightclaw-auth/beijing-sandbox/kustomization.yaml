apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: user-auth
components:
- ../common
- ../profiles/sandbox
resources:
- realname-faceid-reconciliation-worker.yaml
generators:
- ksops-secret-generator.yaml
- ksops-content-audit-secret-generator.yaml
- ksops-shadow-runtime-secret-generator.yaml
- ksops-cloudladder-callback-secret-generator.yaml
patches:
- target:
    kind: ConfigMap
    name: lightclaw-auth-config
  patch: |-
    - op: add
      path: /data/LIGHTVELA_E2E_AUTH_ENABLED
      value: "true"
- target:
    kind: Deployment
    name: lightclaw-auth
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/envFrom/-
      value:
        secretRef:
          name: lightvela-e2e-auth-secrets
- path: patch-shadowbinding.yaml
configMapGenerator:
- name: auth-platform-values
  envs:
  - auth-platform.env
replacements:
- source:
    kind: ConfigMap
    name: auth-platform-values
    fieldPath: data.AUTH_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: lightclaw-auth-realname-faceid-worker
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: auth-platform-values
    fieldPath: data.AUTH_IMAGE
  targets:
  - select:
      kind: Deployment
      name: lightclaw-auth-realname-faceid-worker
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: auth-platform-values
    fieldPath: data.AUTH_DEPLOYED_AT
  targets:
  - select:
      kind: Deployment
      name: lightclaw-auth-realname-faceid-worker
    fieldPaths:
    - spec.template.metadata.annotations.[lightclaw-auth.clawhub.dev/redeploy-at]
