apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-kr-1
components:
- ../common
generators:
- ksops-secret-generator.yaml
- ksops-cloudladder-callback-secret-generator.yaml
configMapGenerator:
- name: auth-platform-values
  envs:
  - auth-platform.env
patches:
- path: delete-shared-namespace.yaml
- path: delete-shared-serviceaccount.yaml
- path: patch-playground-db.yaml
- path: patch-playground-replicas.yaml
- path: patch-shadow-routing.yaml
