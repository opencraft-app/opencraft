apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: user-auth

resources:
  - ../../../../user/auth/k8s/base

patches:
  - path: delete-namespace.yaml
  - path: delete-default-serviceaccount.yaml
  - path: delete-lightclaw-auth-internal.yaml
  - path: patch-payment-method-channel-merchant.yaml

generators:
  - ksops-secret-generator.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: auth-platform-values
    envs:
      - auth-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_TRUSTED_PROXY_CIDRS
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_TRUSTED_PROXY_CIDRS
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_PUBLIC_BASE_URL
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_PUBLIC_BASE_URL
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_FRONTEND_BASE_URL
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_FRONTEND_BASE_URL
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_OAUTH_RETURN_TO_ALLOWED_HOSTS
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_OAUTH_RETURN_TO_ALLOWED_HOSTS
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_QQ_APP_ID
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_QQ_APP_ID
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_QQ_REDIRECT_URI
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_QQ_REDIRECT_URI
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_WECHAT_APP_ID
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_WECHAT_APP_ID
          - data.LIGHTVELA_WECHAT_WEBSITE_APP_ID
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_WECHAT_REDIRECT_URI
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_WECHAT_REDIRECT_URI
          - data.LIGHTVELA_WECHAT_WEBSITE_REDIRECT_URI
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_WECHAT_OFFICIAL_ACCOUNT_APP_ID
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTVELA_WECHAT_OFFICIAL_ACCOUNT_APP_ID
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_WECHAT_OFFICIAL_ACCOUNT_REDIRECT_URI
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTVELA_WECHAT_OFFICIAL_ACCOUNT_REDIRECT_URI
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_GITHUB_CLIENT_ID
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_GITHUB_CLIENT_ID
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_GITHUB_REDIRECT_URI
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.LIGHTCLAW_GITHUB_REDIRECT_URI
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_MYSQL_HOST
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.MYSQL_HOST
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_MYSQL_PORT
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.MYSQL_PORT
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: lightclaw-auth
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: lightclaw-auth-content-audit-worker
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_IMAGE
    targets:
      - select:
          kind: Deployment
          name: lightclaw-auth
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: lightclaw-auth-content-audit-worker
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: lightclaw-auth
        fieldPaths:
          - spec.template.metadata.annotations.[lightclaw-auth.clawhub.dev/redeploy-at]
      - select:
          kind: Deployment
          name: lightclaw-auth-content-audit-worker
        fieldPaths:
          - spec.template.metadata.annotations.[lightclaw-auth.clawhub.dev/redeploy-at]
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_CONTENT_AUDIT_WORKER_REPLICAS
    targets:
      - select:
          kind: Deployment
          name: lightclaw-auth-content-audit-worker
        fieldPaths:
          - spec.replicas
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_CONTENT_AUDIT_ENABLED
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.CONTENT_AUDIT_ENABLED
  - source:
      kind: ConfigMap
      name: auth-platform-values
      fieldPath: data.AUTH_CONTENT_AUDIT_AVATAR_ENABLED
    targets:
      - select:
          kind: ConfigMap
          name: lightclaw-auth-config
        fieldPaths:
          - data.CONTENT_AUDIT_AVATAR_ENABLED
