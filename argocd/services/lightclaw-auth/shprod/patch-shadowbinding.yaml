apiVersion: v1
kind: ConfigMap
metadata:
  name: lightclaw-auth-config
  namespace: user-auth
data:
  SHADOW_BINDING_ENABLED: "true"
  SHADOW_BASIC_AUTH_SYNC_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightclaw-auth
  namespace: user-auth
spec:
  template:
    spec:
      containers:
        - name: auth
          env:
            - name: SHADOW_BINDING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lightclaw-auth-secrets
                  key: LIGHTCLAW_INTERNAL_SERVICE_TOKEN
