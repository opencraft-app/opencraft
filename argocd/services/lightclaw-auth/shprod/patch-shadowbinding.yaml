apiVersion: v1
kind: ConfigMap
metadata:
  name: lightclaw-auth-config
  namespace: user-auth
data:
  LIGHTCLAW_REALNAME_ASSURANCE_MODE: "observe"
  SHADOW_BINDING_ENABLED: "true"
  SHADOW_BASIC_AUTH_SYNC_ENABLED: "true"
  SHADOW_CLOUDLADDER_ENABLED: "true"
  SHADOW_CLOUDLADDER_GATEWAY_BASE_URL: "http://81.71.196.13"
  SHADOW_CLOUDLADDER_ROUTE_ID: "tcapi-account-cn-prod"
  SHADOW_CLOUDLADDER_CAM_ROUTE_ID: "tcapi-cam-cn-prod"
  SHADOW_CLOUDLADDER_STS_ROUTE_ID: "tcapi-sts-cn-prod"
  SHADOW_CLOUDLADDER_CALLER: "shadow"
  SHADOW_ACCOUNT_ENDPOINT: "account.tencentcloudapi.com"
  SHADOW_CAM_ENDPOINT: "cam.tencentcloudapi.com"
  SHADOW_STS_ENDPOINT: "sts.tencentcloudapi.com"
  SHADOW_REGION: "ap-guangzhou"
  SHADOW_PLATFORM: "lightclaw"
  SHADOW_REQUEST_TIMEOUT: "10s"
  SHADOW_AUTH_CODE_TTL: "10m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightclaw-auth
  namespace: user-auth
spec:
  template:
    spec:
      containers:
        - name: auth
          env:
            - name: SHADOW_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: SHADOW_SECRET_ID
            - name: SHADOW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: SHADOW_SECRET_KEY
            - name: CLOUDLADDER_SHADOW_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: CLOUDLADDER_SHADOW_HMAC_SECRET
            - name: SHADOW_BINDING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: lightclaw-auth-secrets
                  key: LIGHTCLAW_INTERNAL_SERVICE_TOKEN
            - name: SHADOW_TENCENT_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: SHADOW_TENCENT_CALLBACK_TOKEN
