apiVersion: v1
kind: ConfigMap
metadata:
  name: lightclaw-auth-config
  namespace: user-auth
data:
  SHADOW_BINDING_ENABLED: "true"
  SHADOW_CLOUDLADDER_ENABLED: "true"
  SHADOW_CLOUDLADDER_GATEWAY_BASE_URL: "http://81.71.196.13"
  SHADOW_CLOUDLADDER_ROUTE_ID: "tcapi-account-cn-test"
  SHADOW_CLOUDLADDER_CAM_ROUTE_ID: "tcapi-cam-cn-test"
  SHADOW_CLOUDLADDER_STS_ROUTE_ID: "tcapi-sts-cn-test"
  SHADOW_CLOUDLADDER_CALLER: "shadow"
  PERSONAL_DEV_ROUTE_CONTROL_ENABLED: "true"
  PERSONAL_DEV_ROUTE_CONTROL_ENVIRONMENT: "sandbox-bj-7"
  PERSONAL_DEV_ROUTE_EXPLICIT_TARGET_IP_ENABLED: "true"
  PERSONAL_DEV_ROUTE_CLOUDLADDER_GATEWAY_BASE_URL: "http://1.12.212.56"
  PERSONAL_DEV_ROUTE_CLOUDLADDER_ROUTE_ID: "developer-route-control"
  PERSONAL_DEV_ROUTE_CLOUDLADDER_CALLER: "lightclaw-auth"
  PERSONAL_DEV_ROUTE_CLOUDLADDER_TIMEOUT: "10s"
  SHADOW_ACCOUNT_ENDPOINT: "account.test.tencentcloudapi.com"
  SHADOW_CAM_ENDPOINT: "cam.test.tencentcloudapi.com"
  SHADOW_STS_ENDPOINT: "sts.test.tencentcloudapi.com"
  SHADOW_REGION: "ap-guangzhou"
  SHADOW_PLATFORM: "lightclaw"
  SHADOW_REQUEST_TIMEOUT: "10s"
  SHADOW_AUTH_CODE_TTL: "10m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightclaw-auth
  namespace: user-auth
spec:
  template:
    spec:
      containers:
        - name: auth
          env:
            - name: SHADOW_SECRET_ID
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: SHADOW_SECRET_ID
            - name: SHADOW_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: SHADOW_SECRET_KEY
            - name: CLOUDLADDER_SHADOW_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: CLOUDLADDER_SHADOW_HMAC_SECRET
            - name: SHADOW_BINDING_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: shadow-runtime-secrets
                  key: LIGHTCLAW_INTERNAL_SERVICE_TOKEN
            - name: SHADOW_TENCENT_CALLBACK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudladder-callback-secrets
                  key: SHADOW_TENCENT_CALLBACK_TOKEN
