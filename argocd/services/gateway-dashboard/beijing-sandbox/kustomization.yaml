apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-gateway
components:
- ../common
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: gateway-dashboard-platform-values
  envs:
  - gateway-dashboard-platform.env
patches:
- target:
    kind: ConfigMap
    name: gateway-dashboard-config
  patch: |-
    - op: add
      path: /data/COLLABORATION_API_URL
      value: http://collaboration.lightvela-collaboration.svc.cluster.local
