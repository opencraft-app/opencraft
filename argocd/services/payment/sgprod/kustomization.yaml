apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: user-auth

resources:
  - ../../../../payment/k8s/base

patches:
  - path: delete-namespace.yaml
  - path: delete-default-serviceaccount.yaml

generators:
  - ksops-secret-generator.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: payment-platform-values
    envs:
      - payment-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: payment-platform-values
      fieldPath: data.PAYMENT_MYSQL_HOST
    targets:
      - select:
          kind: ConfigMap
          name: payment-config
        fieldPaths:
          - data.MYSQL_HOST
  - source:
      kind: ConfigMap
      name: payment-platform-values
      fieldPath: data.PAYMENT_MYSQL_PORT
    targets:
      - select:
          kind: ConfigMap
          name: payment-config
        fieldPaths:
          - data.MYSQL_PORT
  - source:
      kind: ConfigMap
      name: payment-platform-values
      fieldPath: data.PAYMENT_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: payment
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: payment-platform-values
      fieldPath: data.PAYMENT_IMAGE
    targets:
      - select:
          kind: Deployment
          name: payment
        fieldPaths:
          - spec.template.spec.containers.0.image
