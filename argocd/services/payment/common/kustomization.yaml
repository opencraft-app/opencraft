apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: user-auth
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: payment-platform-values
    fieldPath: data.PAYMENT_MYSQL_HOST
  targets:
  - select:
      kind: ConfigMap
      name: payment-config
    fieldPaths:
    - data.MYSQL_HOST
- source:
    kind: ConfigMap
    name: payment-platform-values
    fieldPath: data.PAYMENT_MYSQL_PORT
  targets:
  - select:
      kind: ConfigMap
      name: payment-config
    fieldPaths:
    - data.MYSQL_PORT
- source:
    kind: ConfigMap
    name: payment-platform-values
    fieldPath: data.PAYMENT_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: payment
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: payment-platform-values
    fieldPath: data.PAYMENT_IMAGE
  targets:
  - select:
      kind: Deployment
      name: payment
    fieldPaths:
    - spec.template.spec.containers.0.image
resources:
- ../../../../payment/k8s/base
