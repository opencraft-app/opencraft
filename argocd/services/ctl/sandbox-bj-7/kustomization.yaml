apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-bj-7
components:
- ../common
- ../profiles/sandbox
generators:
- ksops-assets-generator.yaml
configMapGenerator:
- name: ctl-platform-values
  envs:
  - ctl-platform.env
- name: ctl-soul-templates
  files:
  - SOUL-gentle.md=souls/SOUL-gentle.md
  - SOUL-humor.md=souls/SOUL-humor.md
  - SOUL-pro.md=souls/SOUL-pro.md
patches:
- path: delete-shared-namespace.yaml
- path: delete-shared-serviceaccount.yaml
- path: delete-servicemonitor.yaml
- path: delete-logconfig.yaml
- path: patch-ctl-conf-rewrite.yaml
