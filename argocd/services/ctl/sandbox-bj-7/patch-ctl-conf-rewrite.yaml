apiVersion: v1
kind: ConfigMap
metadata:
  name: ctl-conf-rewrite
  namespace: ctl
data:
  server_conf_rewrite.toml: |
    # CTL 测试环境覆盖配置
    # 此文件覆盖 common/server_conf.toml 中的同名字段
    # 密码加密方法：cd ctl && go test -v -test.run=TestCipherEncrypt ./pkg/util/ -args <明文密码>

    [api]
    enable_inner_sign = false

    [api.instance]
    default_template_class_id = "openclaw-default"
    default_template_id = "pool-c3"
    default_sku_id = "sku-hermes-2c4g"
    candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

    # bundle-instance-spec-design.md §3.3 Q2=a / §10 Q7=a / §13.2 R1f / §13.4 上线纪律：
    # bundle.instance_spec_id 命中字典但 server_conf 未配 spec_pools 时直接 fail（ErrBundleInstanceSpecNoPool）。
    # migration 022 已把所有存量 bundle 回填 instance_spec_id=spec-2c4g50g，因此必须为该 spec 显式声明候选池，
    # 否则 ctl.CreateInstance 立即报 "no candidate pools configured for instance_spec_id"。
    # 这里给 spec-2c4g50g 复用现网原有 default + candidate（pool-c3 + pool-c0..c5），保持兼容期行为不变。
    # spec-2c4g50g 不显式设 template_class_id，复用全局 default_template_class_id=openclaw-default。
    #
    # sku_id 显式声明（v1.7.32 新增 §13.2 R1f 对偶项）：sandbox `selectTemplateSKUBindingsForAllocation`
    # 严格校验 sku.template_class_id == requested.templateClassID，否则返 ErrSKUNotFound。
    # 此处显式声明 sku-hermes-2c4g（其 template_class_id=openclaw-default）以匹配全局
    # default_template_class_id；不依赖全局 default_sku_id 兜底以避免多 spec 部署时 sku 漂移。
    [[api.instance.spec_pools]]
    spec_id                = "spec-2c4g50g"
    sku_id                 = "sku-hermes-2c4g"
    default_template_id    = "pool-c3"
    candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

    # spec-4c8g80g 多规格上线（Q1=C 隔离方案 / §13.2 R1f 教训）：
    # 必须用独立 template_class_id=openclaw-4c8g80g，避免 sandbox sandbox_primary 模式下
    # 按 template_pool_bindings.priority 自主选池导致 4C8G 用户被错路由到 2C4G 池（资金风险）。
    # 配套 sandbox DB 录入：template_classes(openclaw-4c8g80g) + pools(pool-bj7-4c8g80g, SA5.LARGE8, system_disk_size=80)
    # + template_pool_bindings(openclaw-4c8g80g ↔ pool-bj7-4c8g80g, priority=1)。
    #
    # sku_id=sku-hermes-4c8g（其 template_class_id=openclaw-4c8g80g）：与 4C8G 链路严格对齐，
    # 避免 ctl 全局 default_sku_id（sku-hermes-2c4g）传到 4C8G 链路被 sandbox sku 校验拒绝。
    [[api.instance.spec_pools]]
    spec_id                = "spec-4c8g80g"
    template_class_id      = "openclaw-4c8g80g"
    sku_id                 = "sku-hermes-4c8g"
    default_template_id    = "pool-bj7-4c8g80g"
    candidate_template_ids = ["pool-bj7-4c8g80g"]

    [db]
    host = "mysql.lightvela-playground-sandbox-bj-7.svc.cluster.local"
    port = 3306
    user = "root"
    password = "aWBNWqb2dxMGWKw38ey6Y/N6ZMKzB+DRv7wB/qPxZ0jMX8GB/HzyMHqIqZPN+WHF" # pragma: allowlist secret -- ctl 自定义 AES-CBC 密文（key=md5("lighthouse")，见 ctl/pkg/util/cipher.go）
    database = "ctl_sandbox_bj_7"
    rw_timeout_seconds = 10

    [redis]
    host = "redis.lightvela-playground-sandbox-bj-7.svc.cluster.local"
    pass = "ygMFaJsKUqCIiAifrli0w+84lNZRLgARIT63fLaoHf7QxHbdbiCnEDdOSYIUKmAp" # pragma: allowlist secret -- ctl 自定义 AES-CBC 密文，同 db.password
    port = 6379
    connect_timeout_seconds = 5
    rw_timeout_seconds = 5
    mq_rw_timeout_seconds = 300
    pool_size = 16

    [mq]
    stream_key = "ctl_sandbox_bj_7"
    group_name = "ctl_service_sandbox_bj_7"
    max_len = 100000

    [monitor.api]
    enable_pprof = true
    port = 9591

    [monitor.service]
    enable_pprof = true
    port = 9592

    [monitor.bypass]
    enable_pprof = false
    port = 9593

    [adapter.sandbox]
    baseUrl = "http://sandbox-api.lightvela-playground-sandbox-bj-7.svc.cluster.local"
    processBaseUrl = "http://ingressproxy-router.lightvela-playground-sandbox-bj-7.svc.cluster.local"
    apiKey = ""
    timeout = 60
    maxRetries = 3
    retryInterval = 1000

    # Historical adapter name; endpoint is now served by lightclaw-auth shadowbinding.
    [adapter.shadow]
    base_url = "http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local"

    # v1.7.28 BUG-16 修复（2026-05-21）：sandbox-bj-7 集群里 ai-gateway 部署在
    # 当前 ns（lightvela-playground-sandbox-bj-7）下，svc 名为 `gateway`；
    # ctl-conf-common 默认 base_url 写的 `http://gateway.ai-gateway.svc.cluster.local`
    # 在该集群无法 DNS 解析，导致 ctl.completePass 调 ensure-user 时
    # `dial tcp: lookup gateway.ai-gateway.svc.cluster.local: no such host`，
    # 阻断 jifei → trade → ctl → ai-gateway 整条 createResource 链路。
    # 这里用 rewrite 覆盖 base_url 到本集群本 ns 的 svc FQDN（其余 admin_token /
    # internal_service_token / timeout / default_* 字段继续走 common 默认值）。
    [adapter.aigateway]
    base_url = "http://gateway.lightvela-playground-sandbox-bj-7.svc.cluster.local"

    # 测试环境不可用的 adapter，设置 use_mock = true
    [adapter.lightpro]
    use_mock = true

    [adapter.sts]
    use_mock = true

    [log.api]
    enable_color = false

    [log.service]
    enable_color = false

    [log.bypass]
    enable_color = false

    [translate]
    dir = "/usr/local/lightglobal/i18n"

    [tracing]
    protocol = ""
    async = false
    grpc_endpoint = ""
    http_endpoint = ""
    tenant_id = "default"
    service_namespace = "test"

    [misc]
    region = "ap-beijing"
    object_id_password_suffix = "sandbox_bj_7"
    apps_data_dir = "/data/lightglobal/apps"
    block_bypass_and_service = false
    use_random_machine_id = true
    account_area = "0"

    [global_quota]
    valid_modify_resource_names = ["OPENCLAW_INSTANCE"]

    [global_quota.resource_default_quotas]
    OPENCLAW_INSTANCE = 5
