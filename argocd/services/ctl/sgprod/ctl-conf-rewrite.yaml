apiVersion: v1
kind: ConfigMap
metadata:
  name: ctl-conf-rewrite
  namespace: ctl
  labels:
    app.kubernetes.io/name: ctl
    app.kubernetes.io/managed-by: argocd
  annotations:
    managed-by: argocd/services/ctl/sgprod/ctl-conf-rewrite.yaml
data:
  server_conf_rewrite.toml: |
    # CTL 新加坡生产环境覆盖配置。
    # 非敏感运行策略放在这里；密码/token 通过 ctl-runtime-secrets 注入。

    [api]
    enable_inner_sign = false

    [api.instance]
    default_template_id = "pool-c3"
    default_template_class_id = "hermes"
    default_sku_id = "sku-hermes-2c4g"
    candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

    # Keep bundle-spec routing aligned with shprod. CTL discovers the current
    # active Singapore pools from Sandbox and filters them by class and SKU.
    [[api.instance.spec_pools]]
    spec_id                = "spec-2c4g50g"
    sku_id                 = "sku-hermes-2c4g"
    default_template_id    = "pool-1778850277827939648-1"
    candidate_template_ids = ["pool-1778850277827939648-1"]

    [db]
    host = "10.15.192.12"
    port = 3306
    user = "root"
    database = "ctl"
    rw_timeout_seconds = 10

    [redis]
    host = "10.15.192.14"
    port = 6379
    connect_timeout_seconds = 5
    rw_timeout_seconds = 5
    mq_rw_timeout_seconds = 300
    pool_size = 16

    [mq]
    stream_key = "ctl"
    group_name = "ctl_service"
    max_len = 100000

    [monitor.api]
    enable_pprof = true
    port = 9591

    [monitor.service]
    enable_pprof = true
    port = 9592

    [monitor.bypass]
    enable_pprof = false
    port = 9593

    [adapter.sandbox]
    baseUrl = "http://sandbox-api.sandbox.svc.cluster.local"
    processBaseUrl = "http://ingressproxy-router.sandbox.svc.cluster.local"
    apiKey = ""
    timeout = 60
    maxRetries = 3
    retryInterval = 1000

    # 当前环境不可用的 adapter，设置 use_mock = true
    [adapter.lightpro]
    use_mock = true

    [adapter.sts]
    use_mock = true

    [adapter.shadow]
    base_url = "http://shadow-api.shadow.svc.cluster.local"
    timeout = 10

    [log.api]
    enable_color = false

    [log.service]
    enable_color = false

    [log.bypass]
    enable_color = false

    [translate]
    dir = "/usr/local/lightglobal/i18n"

    [tracing]
    protocol = ""
    async = false
    grpc_endpoint = ""
    http_endpoint = ""
    tenant_id = "default"
    service_namespace = "test"

    [misc]
    region = "ap-singapore"
    object_id_password_suffix = "test_env"
    apps_data_dir = "/data/lightglobal/apps"
    block_bypass_and_service = false
    use_random_machine_id = true
    account_area = "0"

    [global_quota]
    valid_modify_resource_names = ["OPENCLAW_INSTANCE"]

    [global_quota.resource_default_quotas]
    OPENCLAW_INSTANCE = 5
