apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctl-api
  namespace: ctl
spec:
  template:
    spec:
      containers:
        - name: api
          env:
            - name: REFERRAL_ENABLED
              value: "true"
            - name: REFERRAL_OUTBOX_RELAY_ENABLED
              value: "true"
            - name: REFERRAL_PULSAR_URL
              value: "http://pulsar-7j4z44nzn3za.eap-nzekhasa.tdmq.ap-sg.qcloud.tencenttdmq.com:8080"
            - name: REFERRAL_PULSAR_TOPIC
              value: "persistent://pulsar-7j4z44nzn3za/lightvela-ref/lightvela.referral.events.v1"
