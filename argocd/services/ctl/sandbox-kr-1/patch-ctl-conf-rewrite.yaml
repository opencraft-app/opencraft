apiVersion: v1
kind: ConfigMap
metadata:
  name: ctl-conf-rewrite
  namespace: ctl
data:
  server_conf_rewrite.toml: |
    # CTL 测试环境覆盖配置
    # 此文件覆盖 common/server_conf.toml 中的同名字段
    # 密码加密方法：cd ctl && go test -v -test.run=TestCipherEncrypt ./pkg/util/ -args <明文密码>

    [api]
    enable_inner_sign = false

    [api.instance]
    default_template_class_id = "openclaw-default"
    default_template_id = "pool-c3"
    default_sku_id = "sku-hermes-2c4g"
    candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

    # migration 022 backfills existing bundles to spec-2c4g50g. A non-empty
    # instance_spec_id must have an explicit per-spec pool mapping or ctl fails
    # closed with BUNDLE_INSTANCE_SPEC_NO_POOL before calling sandbox.
    [[api.instance.spec_pools]]
    spec_id                = "spec-2c4g50g"
    sku_id                 = "sku-hermes-2c4g"
    default_template_id    = "pool-kr-2c4g-01"
    candidate_template_ids = ["pool-kr-2c4g-01"]

    # spec-4c8g80g 是巡游/巡游 AI 的规格，同 SP 变配（TAPD 1010132091137784162）的目标端。
    # 独立 template_class_id 与 bj-7 / beijing-sandbox 同范式：sandbox_primary 模式下若共用
    # openclaw-default，sandbox 会按 template_pool_bindings.priority 自主选池，4C8G 用户可能被
    # 路由到 2C4G 池（用户按巡游付费却拿到启航配置）。
    # 配套 sandbox-kr-1 DB 录入：template_classes(openclaw-4c8g80g) +
    # pools(pool-kr-4c8g-01, SA5.LARGE8, system_disk_size=80) +
    # template_pool_bindings(openclaw-4c8g80g ↔ pool-kr-4c8g-01, priority=1)。
    [[api.instance.spec_pools]]
    spec_id                = "spec-4c8g80g"
    template_class_id      = "openclaw-4c8g80g"
    sku_id                 = "sku-hermes-4c8g"
    default_template_id    = "pool-kr-4c8g-01"
    candidate_template_ids = ["pool-kr-4c8g-01"]

    [db]
    host = "10.47.192.15"
    port = 3306
    user = "root"
    password = "Bc2Yp3b3ZJxCO1msBuLaSORhZ6xS8q7DXw2JO1CoPZU=" # pragma: allowlist secret -- ctl custom AES-CBC ciphertext
    database = "ctl_sandbox_kr_1"
    rw_timeout_seconds = 10

    [redis]
    host = "10.47.192.14"
    pass = "iobYxIakOLGWVdDXlimNQZPe6EReIv/0Fn4rHWYCNI8vSIkWIF6cV2uzIRRVfjSa" # pragma: allowlist secret -- ctl custom AES-CBC ciphertext
    port = 6379
    connect_timeout_seconds = 5
    rw_timeout_seconds = 5
    mq_rw_timeout_seconds = 300
    pool_size = 16

    [mq]
    stream_key = "ctl_sandbox_kr_1"
    group_name = "ctl_service_sandbox_kr_1"
    max_len = 100000

    [monitor.api]
    enable_pprof = true
    port = 9591

    [monitor.service]
    enable_pprof = true
    port = 9592

    [monitor.bypass]
    enable_pprof = false
    port = 9593

    [adapter.sandbox]
    baseUrl = "http://sandbox-api.lightvela-playground-sandbox-kr-1.svc.cluster.local"
    processBaseUrl = "http://ingressproxy-router.lightvela-playground-sandbox-kr-1.svc.cluster.local"
    apiKey = ""
    timeout = 60
    maxRetries = 3
    retryInterval = 1000

    # 测试环境不可用的 adapter，设置 use_mock = true
    [adapter.lightpro]
    use_mock = true

    [adapter.sts]
    use_mock = true

    [adapter.trade]
    base_url = "http://trade.lightvela-playground-sandbox-kr-1.svc.cluster.local"
    # token 从 ctl-runtime-secrets 的 CTL_INTERNAL_TOKEN 注入，避免在 ConfigMap 写入明文。
    # Must exceed the 50s pay-url logic budget; http.Client uses the smaller
    # of this value and the per-request context deadline.
    timeout = 55

    [log.api]
    enable_color = false

    [log.service]
    enable_color = false

    [log.bypass]
    enable_color = false

    [translate]
    dir = "/usr/local/lightglobal/i18n"

    [tracing]
    protocol = ""
    async = false
    grpc_endpoint = ""
    http_endpoint = ""
    tenant_id = "default"
    service_namespace = "test"

    [misc]
    region = "ap-seoul"
    object_id_password_suffix = "test_env"
    apps_data_dir = "/data/lightglobal/apps"
    block_bypass_and_service = false
    use_random_machine_id = true
    account_area = "0"

    [global_quota]
    valid_modify_resource_names = ["OPENCLAW_INSTANCE"]

    [global_quota.resource_default_quotas]
    OPENCLAW_INSTANCE = 5
