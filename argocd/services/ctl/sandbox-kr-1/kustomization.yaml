apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-kr-1
components:
- ../common
- ../profiles/sandbox
generators:
- ksops-assets-generator.yaml
configMapGenerator:
- name: ctl-platform-values
  envs:
  - ctl-platform.env
- name: ctl-soul-templates
  files:
  - SOUL-gentle.md=souls/SOUL-gentle.md
  - SOUL-humor.md=souls/SOUL-humor.md
  - SOUL-pro.md=souls/SOUL-pro.md
patches:
- target:
    kind: Deployment
    name: ctl-api
  patch: |-
    - op: add
      path: /spec/template/metadata/labels/ctl.clawhub.dev~1role
      value: api
- path: delete-shared-namespace.yaml
- path: delete-shared-serviceaccount.yaml
- path: delete-servicemonitor.yaml
- path: delete-logconfig.yaml
- path: patch-ctl-conf-rewrite.yaml
replacements:
- source:
    kind: Deployment
    name: ctl-api
    fieldPath: spec.template.spec
  targets:
  - select:
      kind: Deployment
      name: ctl-desktop
    fieldPaths:
    - spec.template.spec
    options:
      create: true
- source:
    kind: Deployment
    name: ctl-api
    fieldPath: spec.template.metadata.annotations
  targets:
  - select:
      kind: Deployment
      name: ctl-desktop
    fieldPaths:
    - spec.template.metadata.annotations
    options:
      create: true
