apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ctl
components:
- ../common
- ../profiles/sandbox
resources:
- ctl-conf-rewrite.yaml
patches:
- target:
    kind: Deployment
    name: ctl-api
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: CTL_LLMGATEWAY_NEW_USER_ALLOWLIST
        value: usr_31b0bd10d198d7aa7012fbf0,usr_cd57811ec414ce48e8d40c6c
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: CTL_LLMGATEWAY_BOT_CREATE_MIGRATION_ALLOWLIST
        value: usr_31b0bd10d198d7aa7012fbf0
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: CTL_CLOUDAPI_ALLOWED_REGIONS
        value: ap-guangzhou,ap-beijing
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: REFERRAL_ENABLED
        value: "true"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: REFERRAL_OUTBOX_RELAY_ENABLED
        value: "true"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: REFERRAL_PULSAR_URL
        value: http://pulsar-n57ovqb7r7gv.eap-vle3kjgi.tdmq.ap-bj.qcloud.tencenttdmq.com:8080
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: REFERRAL_PULSAR_TOPIC
        value: persistent://pulsar-n57ovqb7r7gv/lightvela-ref/lightvela.referral.events.v1
- target:
    kind: Deployment
    name: ctl-service
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: CTL_LLMGATEWAY_NEW_USER_ALLOWLIST
        value: usr_31b0bd10d198d7aa7012fbf0,usr_cd57811ec414ce48e8d40c6c
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: CTL_LLMGATEWAY_BOT_CREATE_MIGRATION_ALLOWLIST
        value: usr_31b0bd10d198d7aa7012fbf0
- target:
    kind: Deployment
    name: ctl-bypass
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: CTL_LLMGATEWAY_NEW_USER_ALLOWLIST
        value: usr_31b0bd10d198d7aa7012fbf0,usr_cd57811ec414ce48e8d40c6c
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: CTL_LLMGATEWAY_BOT_CREATE_MIGRATION_ALLOWLIST
        value: usr_31b0bd10d198d7aa7012fbf0
generators:
- ksops-assets-generator.yaml
configMapGenerator:
- name: ctl-platform-values
  envs:
  - ctl-platform.env
- name: ctl-conf-common
  files:
  - server_conf.toml=conf/server_conf.toml
- name: ctl-soul-templates
  files:
  - SOUL-gentle.md=souls/SOUL-gentle.md
  - SOUL-humor.md=souls/SOUL-humor.md
  - SOUL-pro.md=souls/SOUL-pro.md
