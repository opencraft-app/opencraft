apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ctl

resources:
  - ../../../../ctl/k8s/base

generators:
  - ksops-assets-generator.yaml

components:
  - ../../../../ctl/k8s/overlays/beijing-sandbox

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: ctl-platform-values
    envs:
      - ctl-platform.env
  - name: ctl-soul-templates
    files:
      - SOUL-gentle.md=souls/SOUL-gentle.md
      - SOUL-humor.md=souls/SOUL-humor.md
      - SOUL-pro.md=souls/SOUL-pro.md
