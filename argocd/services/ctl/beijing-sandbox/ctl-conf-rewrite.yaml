apiVersion: v1
kind: ConfigMap
metadata:
  name: ctl-conf-rewrite
  namespace: ctl
  labels:
    app.kubernetes.io/name: ctl
    app.kubernetes.io/managed-by: argocd
  annotations:
    managed-by: argocd/services/ctl/beijing-sandbox/ctl-conf-rewrite.yaml
data:
  server_conf_rewrite.toml: |
    # CTL 测试环境覆盖配置
    # 此文件覆盖 common/server_conf.toml 中的同名字段
    # 密码加密方法：cd ctl && go test -v -test.run=TestCipherEncrypt ./pkg/util/ -args <明文密码>

    [api]
    enable_inner_sign = false

    [api.instance]
    default_template_class_id = "openclaw-default"
    default_template_id = "pool-c3"
    default_sku_id = "sku-hermes-2c4g"
    candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

    # bundle-instance-spec-design.md §3.3 Q2=a / §10 Q7=a / §13.2 R1f / §13.4 上线纪律：
    # bundle.instance_spec_id 命中字典但 server_conf 未配 spec_pools 时直接 fail（ErrBundleInstanceSpecNoPool）。
    # beijing-sandbox 的 ctl bundle 表已有 instance_spec_id=spec-2c4g50g（free_trial/launch）
    # 与 spec-4c8g80g（cruise/voyage），此处两段都已补齐：
    #   - 2C4G 链路（B 方案）：spec-2c4g50g → openclaw-default + sku-hermes-2c4g + pool-c0..c5
    #   - 4C8G 链路（A 方案）：spec-4c8g80g → openclaw-4c8g80g + sku-hermes-4c8g + pool-c-4c8g-01
    # spec-2c4g50g 复用现网 default + candidate（pool-c3 + pool-c0..c5），保持兼容期行为不变。
    # 不显式设 template_class_id，复用全局 default_template_class_id=openclaw-default。
    #
    # sku_id 显式声明（v1.7.32 §13.2 R1f 对偶项）：sandbox `selectTemplateSKUBindingsForAllocation`
    # 严格校验 sku.template_class_id == requested.templateClassID，否则返 ErrSKUNotFound。
    # 此处显式声明 sku-hermes-2c4g（其 template_class_id=openclaw-default）以匹配全局
    # default_template_class_id；不依赖全局 default_sku_id 兜底以避免多 spec 部署时 sku 漂移。
    [[api.instance.spec_pools]]
    spec_id                = "spec-2c4g50g"
    sku_id                 = "sku-hermes-2c4g"
    default_template_id    = "pool-c3"
    candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

    # spec-4c8g80g（cruise / voyage bundle）链路（A 方案）：
    # 与 2C4G 不同，4C8G 必须显式声明 template_class_id（与全局 default_template_class_id=openclaw-default
    # 不同），否则 ctl `templateCandidatesForSpec` 拼出来的 templateClassID=openclaw-default 会和
    # sku-hermes-4c8g.template_class_id=openclaw-4c8g80g 不一致，sandbox AllocateForRequest 报 ErrSKUNotFound。
    #
    # 配套 sandbox 侧 DML（已在 beijing-sandbox cvm 库执行，2026-06-18）：
    # - INSERT template_classes(openclaw-4c8g80g) [region=ap-beijing, sandbox_primary, active]
    # - INSERT skus(sku-hermes-4c8g, template_class_id=openclaw-4c8g80g, instance_type=SA9.LARGE8)
    # - INSERT pools(pool-c-4c8g-01, template_class_id=openclaw-4c8g80g, sku_id=sku-hermes-4c8g,
    #   instance_type=SA9.LARGE8, system_disk_size=80, zone=ap-beijing-8, subnet=subnet-1iiuss0v,
    #   image=img-geawjwkl, sg=sg-hrhn5nf5, capacity_state=active, status=active, desired_capacity=1)
    # - INSERT template_pool_bindings(openclaw-4c8g80g ↔ pool-c-4c8g-01 P=1 admission=active)
    # - INSERT template_sku_bindings(openclaw-4c8g80g ↔ sku-hermes-4c8g P=1 eligibility=1)
    [[api.instance.spec_pools]]
    spec_id                = "spec-4c8g80g"
    template_class_id      = "openclaw-4c8g80g"
    sku_id                 = "sku-hermes-4c8g"
    default_template_id    = "pool-c-4c8g-01"
    candidate_template_ids = ["pool-c-4c8g-01"]

    [db]
    host = "10.15.224.4"
    port = 3306
    user = "root"
    database = "ctl"
    rw_timeout_seconds = 10

    [redis]
    host = "10.15.231.163"
    port = 6379
    connect_timeout_seconds = 5
    rw_timeout_seconds = 5
    mq_rw_timeout_seconds = 300
    pool_size = 16

    [mq]
    stream_key = "ctl"
    group_name = "ctl_service"
    max_len = 100000

    [monitor.api]
    enable_pprof = true
    port = 9591

    [monitor.service]
    enable_pprof = true
    port = 9592

    [monitor.bypass]
    enable_pprof = false
    port = 9593

    [adapter.sandbox]
    baseUrl = "http://sandbox-api.sandbox.svc.cluster.local"
    processBaseUrl = "http://ingressproxy-router.sandbox.svc.cluster.local"
    apiKey = ""
    timeout = 60
    maxRetries = 3
    retryInterval = 1000

    # 测试环境不可用的 adapter，设置 use_mock = true
    [adapter.lightpro]
    use_mock = true

    [adapter.sts]
    use_mock = true

    [log.api]
    enable_color = false

    [log.service]
    enable_color = false

    [log.bypass]
    enable_color = false

    [translate]
    dir = "/usr/local/lightglobal/i18n"

    [tracing]
    protocol = ""
    async = false
    grpc_endpoint = ""
    http_endpoint = ""
    tenant_id = "default"
    service_namespace = "test"

    [misc]
    region = "ap-beijing"
    object_id_password_suffix = "test_env"
    apps_data_dir = "/data/lightglobal/apps"
    block_bypass_and_service = false
    use_random_machine_id = true
    account_area = "0"

    [global_quota]
    valid_modify_resource_names = ["OPENCLAW_INSTANCE"]

    [global_quota.resource_default_quotas]
    OPENCLAW_INSTANCE = 5
