apiVersion: v1
kind: ConfigMap
metadata:
  name: ctl-conf-rewrite
  namespace: ctl
  labels:
    app.kubernetes.io/name: ctl
    app.kubernetes.io/managed-by: argocd
  annotations:
    managed-by: argocd/services/ctl/shprod/ctl-conf-rewrite.yaml
data:
  server_conf_rewrite.toml: |
    # CTL 测试环境覆盖配置
    # 此文件覆盖 common/server_conf.toml 中的同名字段
    # 密码加密方法：cd ctl && go test -v -test.run=TestCipherEncrypt ./pkg/util/ -args <明文密码>

    [api]
    enable_inner_sign = false

    [api.instance]
    default_template_class_id = "hermes"
    default_template_id = "pool-1779142341361006934-114"
    default_sku_id = "sku-hermes-2c4g"
    candidate_template_ids = ["pool-1779142341361006934-114", "pool-1779142637960095668-265", "pool-1780305211975190544-2478", "pool-1782454138147183486-5972"]

    # bundle.instance_spec_id 非空时，ctl 会走 per-spec pool 选择；若这里缺配
    # spec_pools，CreateInstance 会直接返回 BUNDLE_INSTANCE_SPEC_NO_POOL。
    # shprod 2C4G 规格使用当前 sandbox 中 active 的 Hermes 2C4G 池。
    [[api.instance.spec_pools]]
    spec_id                = "spec-2c4g50g"
    sku_id                 = "sku-hermes-2c4g"
    default_template_id    = "pool-1779142341361006934-114"
    candidate_template_ids = ["pool-1779142341361006934-114", "pool-1779142637960095668-265", "pool-1780305211975190544-2478", "pool-1782454138147183486-5972"]

    # shprod 4C8G 规格使用独立 template class 和资源池，供后续付费 bundle 使用。
    [[api.instance.spec_pools]]
    spec_id                = "spec-4c8g80g"
    template_class_id      = "openclaw-4c8g80g"
    sku_id                 = "sku-hermes-4c8g"
    default_template_id    = "pool-sh-4c8g80g-01"
    candidate_template_ids = ["pool-sh-4c8g80g-01"]

    [db]
    host = "10.15.192.13"
    port = 3306
    user = "root"
    database = "ctl"
    rw_timeout_seconds = 10

    [redis]
    host = "10.15.192.90"
    port = 6379
    connect_timeout_seconds = 5
    rw_timeout_seconds = 5
    mq_rw_timeout_seconds = 300
    pool_size = 16

    [mq]
    stream_key = "ctl"
    group_name = "ctl_service"
    max_len = 100000

    [monitor.api]
    enable_pprof = true
    port = 9591

    [monitor.service]
    enable_pprof = true
    port = 9592

    [monitor.bypass]
    enable_pprof = false
    port = 9593

    [adapter.sandbox]
    baseUrl = "http://sandbox-api.sandbox.svc.cluster.local"
    processBaseUrl = "http://ingressproxy-router.sandbox.svc.cluster.local"
    apiKey = ""
    timeout = 60
    maxRetries = 3
    retryInterval = 1000

    # 测试环境不可用的 adapter，设置 use_mock = true
    [adapter.lightpro]
    use_mock = true

    [adapter.sts]
    use_mock = true

    [log.api]
    enable_color = false

    [log.service]
    enable_color = false

    [log.bypass]
    enable_color = false

    [translate]
    dir = "/usr/local/lightglobal/i18n"

    [tracing]
    protocol = "grpc"
    async = false
    grpc_endpoint = ""
    http_endpoint = ""
    tenant_id = "default"
    service_namespace = "test"

    [misc]
    region = "ap-shanghai"
    object_id_password_suffix = "test_env"
    apps_data_dir = "/data/lightglobal/apps"
    block_bypass_and_service = false
    use_random_machine_id = true
    account_area = "0"

    [global_quota]
    valid_modify_resource_names = ["OPENCLAW_INSTANCE"]

    [global_quota.resource_default_quotas]
    OPENCLAW_INSTANCE = 5
