apiVersion: platform.stke/v1alpha1
kind: StatefulSetPlus
metadata:
  annotations:
    analysis.crane.io/replicas-recommendation: 'replicas: 1

      '
    analysis.crane.io/resource-recommendation: "containers:\n- containerName: gateway\n\
      \  target:\n    cpu: 100m\n    memory: \"120586239\"\n"
    deployImageSource: hub
    enablesystemd: disable
    platform.stke/pause-auto-batchDeploy: 'false'
    platform.stke/stsp-is-updating: 'false'
    platform.stke/upgrade-in-place: 'false'
    platform.tkex/scaleDown-PendingPod-first: 'true'
    stkeUpateVersionTag: v3
    tkex-samename-count: '2'
  labels:
    clusterId: cls-5vzjheeo
    env: production
    k8s-app: lightvela-proxy
    moduleFourId: '867795'
    projectName: prjqt8dd
    qcloud-app: lightvela-proxy
    region: ap-guangzhou
    workload-kind: statefulsetplus
  name: lightvela-proxy
  namespace: ns-prjqt8dd-867795-production
spec:
  batchDeployConfig: {}
  podManagementPolicy: Parallel
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      clusterId: cls-5vzjheeo
      env: production
      k8s-app: lightvela-proxy
      moduleFourId: '867795'
      projectName: prjqt8dd
      qcloud-app: lightvela-proxy
      region: ap-guangzhou
      workload-kind: statefulsetplus
  serviceName: lightvela-proxy
  template:
    metadata:
      annotations:
        cloudladdergateway.lightvela.com/redeploy-at: 2026-06-03T00:00:00Z
        eks.tke.cloud.tencent.com/spec-auto-upgrade: 'true'
      labels:
        clusterId: cls-5vzjheeo
        env: production
        k8s-app: lightvela-proxy
        moduleFourId: '867795'
        projectName: prjqt8dd
        qcloud-app: lightvela-proxy
        region: ap-guangzhou
        workload-kind: statefulsetplus
    spec:
      affinity: {}
      containers:
      - env:
        - name: CLOUDLADDER_PAYMENT_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              key: CLOUDLADDER_PAYMENT_HMAC_SECRET
              name: cloudladdergateway-runtime-secrets
        - name: CLOUDLADDER_SHADOW_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              key: CLOUDLADDER_SHADOW_HMAC_SECRET
              name: cloudladdergateway-runtime-secrets
        - name: CLOUDLADDER_TENCENT_CALLBACK_TOKEN
          valueFrom:
            secretKeyRef:
              key: CLOUDLADDER_TENCENT_CALLBACK_TOKEN
              name: cloudladdergateway-callback-secrets
        - name: CLOUDLADDERGATEWAY_TENCENTCLOUD_ACCOUNT_CALLBACK_BJSBX_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_TENCENTCLOUD_ACCOUNT_CALLBACK_SHPROD_BASE_URL
          value: https://api.lightvela.com
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_BJ_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_SH_BASE_URL
          value: https://api.lightvela.com
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_GZ_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_CD_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_NJ_BASE_URL
          value: https://lightclaw.tech
        image: csighub.tencentyun.com/skipzhang/cloudladdergateway:604530a7c2ad
        imagePullPolicy: Always
        name: gateway
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 2Gi
        stdin: true
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
      dnsConfig:
        options:
        - name: ndots
          value: '2'
      imagePullSecrets:
      - name: csighub-skipzhang
      - name: csighub-xinqishang
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
        name: shm
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
