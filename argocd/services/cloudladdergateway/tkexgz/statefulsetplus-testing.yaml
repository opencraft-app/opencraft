apiVersion: platform.stke/v1alpha1
kind: StatefulSetPlus
metadata:
  annotations:
    deployImageSource: hub
    enablesystemd: disable
    platform.tkex/scaleDown-PendingPod-first: 'true'
    stkeUpateVersionTag: v3
    tkex-samename-count: '2'
  labels:
    clusterId: cls-5vzjheeo
    env: production
    k8s-app: lightvela-proxy-testing
    moduleFourId: '867795'
    projectName: prjqt8dd
    qcloud-app: lightvela-proxy-testing
    region: ap-guangzhou
    workload-kind: statefulsetplus
  name: lightvela-proxy-testing
  namespace: ns-prjqt8dd-867795-production
spec:
  batchDeployConfig: {}
  podManagementPolicy: Parallel
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      clusterId: cls-5vzjheeo
      env: production
      k8s-app: lightvela-proxy-testing
      moduleFourId: '867795'
      projectName: prjqt8dd
      qcloud-app: lightvela-proxy-testing
      region: ap-guangzhou
      workload-kind: statefulsetplus
  serviceName: lightvela-proxy-testing
  template:
    metadata:
      annotations:
        eks.tke.cloud.tencent.com/spec-auto-upgrade: 'true'
        cloudladdergateway.lightvela.com/redeploy-at: '2026-06-03T00:00:00Z'
      labels:
        clusterId: cls-5vzjheeo
        env: production
        k8s-app: lightvela-proxy-testing
        moduleFourId: '867795'
        projectName: prjqt8dd
        qcloud-app: lightvela-proxy-testing
        region: ap-guangzhou
        workload-kind: statefulsetplus
    spec:
      affinity: {}
      containers:
      - env:
        - name: CLOUDLADDER_PAYMENT_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              key: CLOUDLADDER_PAYMENT_HMAC_SECRET
              name: cloudladdergateway-runtime-secrets
        - name: CLOUDLADDER_TRADE_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              key: CLOUDLADDER_PAYMENT_HMAC_SECRET
              name: cloudladdergateway-runtime-secrets
        - name: CLOUDLADDER_SHADOW_HMAC_SECRET
          valueFrom:
            secretKeyRef:
              key: CLOUDLADDER_SHADOW_HMAC_SECRET
              name: cloudladdergateway-runtime-secrets
        - name: CLOUDLADDER_TENCENT_CALLBACK_TOKEN
          valueFrom:
            secretKeyRef:
              key: CLOUDLADDER_TENCENT_CALLBACK_TOKEN
              name: cloudladdergateway-callback-secrets
        - name: CLOUDLADDERGATEWAY_TENCENTCLOUD_ACCOUNT_CALLBACK_KRSBX_BASE_URL
          value: https://api-sandbox-kr-1.lightclaw.tech
        - name: CLOUDLADDER_TENCENT_CALLBACK_KRSBX_TOKEN
          valueFrom:
            secretKeyRef:
              name: cloudladdergateway-krsbx-callback-secrets
              key: CLOUDLADDER_TENCENT_CALLBACK_KRSBX_TOKEN
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_BASE_URL
          value: https://api-sandbox-bj-7.lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_BJ_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_SH_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_GZ_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_CD_BASE_URL
          value: https://lightclaw.tech
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_NJ_BASE_URL
          value: https://lightclaw.tech
        # 按影子账号 uin 把 jifei 回调分派到各开发者的个人测试环境。
        # 表里没有的 uin 走 jifei-callback 自身的 base_url 兜底（sandbox-bj-7）。
        # 加人时改这一行 + 对应 DEV_<N>_BASE_URL 即可，不需要重建镜像。
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_UIN_ROUTES
          value: 700003135209=jifei-callback-dev-1
        # 各开发者环境的可达地址（config.example.yaml 里是黑洞占位，必须在这里覆盖）。
        - name: CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_DEV_1_BASE_URL
          value: http://9.134.214.121:18084
        - name: CLOUDLADDERGATEWAY_ROUTE_DEVTUNNEL_BASE_URL
          value: http://devtunnel-testing.ns-prjqt8dd-867795-production.svc.cluster.local:8080
        - name: DEVTUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              key: DEVTUNNEL_TOKEN
              name: cloudladdergateway-devtunnel-secrets
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_ENABLED
          value: "true"
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_ROUTE_ID
          value: jifei-callback
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_STORE
          value: http
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_REGISTRY_BASE_URL
          value: https://api-sandbox-bj-7.lightclaw.tech
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_REGISTRY_ROUTE_ID
          value: developer-route-registry
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_REGISTRY_CALLER
          value: cloudladdergateway
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_REGISTRY_SECRET_ENV
          value: CLOUDLADDER_SHADOW_HMAC_SECRET
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_REGISTRY_TIMEOUT
          value: 10s
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_REGISTRATION_ROUTE
          value: developer-route-control
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_REGISTRATION_CALLER
          value: lightclaw-auth
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_DELIVERY_MODE
          value: devtunnel
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_TUNNEL_BASE_URL
          value: http://devtunnel-testing.ns-prjqt8dd-867795-production.svc.cluster.local:8080
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_TUNNEL_HOST_SUFFIX
          value: cn.tunnel.internal
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_TUNNEL_TOKEN_ENV
          value: DEVTUNNEL_TOKEN
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_ALLOWED_CIDRS
          value: 9.0.0.0/8
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_ALLOWED_PORTS
          value: "18084"
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_DEFAULT_TTL
          value: 8h
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_MAX_TTL
          value: 24h
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_PROBE_PATH
          value: /healthz
        - name: CLOUDLADDERGATEWAY_DEVELOPER_ROUTES_PROBE_TIMEOUT
          value: 5s
        image: csighub.tencentyun.com/skipzhang/cloudladdergateway:604530a7c2ad
        imagePullPolicy: Always
        name: gateway
        resources:
          limits:
            cpu: '1'
            memory: 2Gi
          requests:
            cpu: '1'
            memory: 2Gi
        stdin: true
        volumeMounts:
        - mountPath: /dev/shm
          name: shm
      dnsConfig:
        options:
        - name: ndots
          value: '2'
      imagePullSecrets:
      - name: csighub-skipzhang
      - name: csighub-xinqishang
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          medium: Memory
        name: shm
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
