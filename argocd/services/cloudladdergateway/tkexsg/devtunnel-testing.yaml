# devtunnel 反向回调隧道 —— tkexsg 测试实例（国际站联调用）。
#
# 作用：承接云梯改派来的 jifei 回调，按 Host 分流到各开发者 DevCloud 上出站长轮询的
# agent。详见 cloudladdergateway/internal/devtunnel 包注释。
#
# 为什么两个集群各要一份：国内站的 jifei 回调落到 tkexgz 实例，国际站落到 tkexsg 实例
# （站点由 trade 的 JIFEI_CGW_GATEWAY_URL 指向哪套云梯决定，tkexgz 的 jifei-test route
# 会把 Host 重写成国内站的地址，打不到国际站计费）。所以国际站联调必须在 tkexsg 这边
# 也有一份 hub，不能复用广州那份。
#
# 复用 cloudladdergateway 镜像（devtunnel 二进制已打进同一镜像），仅用 command 覆盖入口，
# 因此镜像 tag 跟随 cloudladdergateway 的 CI pin，无需单独构建流水线。
#
# 部署前置（都属于 gitops 侧改动）：
#   1) 新增 argocd/secrets/tkexsg/cloudladdergateway-devtunnel-secrets.sops.yaml，含
#      DEVTUNNEL_TOKEN（32 字节随机串）。与 tkexgz 那份**各自独立**，不共用 token：
#      两个集群的 hub 是两套进程，串了只会让排障时分不清是哪边在鉴权。
#   2) 在 lightvela-proxy-testing 工作负载上加 env：
#        CLOUDLADDERGATEWAY_ROUTE_DEVTUNNEL_BASE_URL=http://devtunnel-testing.<ns>.svc.cluster.local:8080
#        CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_DEV_1_BASE_URL=<同上>
#        CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_DEV_1_HOST_HEADER=sg1.tunnel.internal
#        CLOUDLADDERGATEWAY_ROUTE_JIFEI_CALLBACK_UIN_ROUTES=<国际站影子账号 uin>=jifei-callback-dev-1
#        DEVTUNNEL_TOKEN（同一份 secret，供 route 的 headers_from_env 注入 ingest 鉴权）
#      Host 刻意用 sg1 而不是 dev1：两个集群的 host 命名空间分开，避免开发者本机同时挂
#      两条 agent 时把国内站和国际站的回调投到同一个落点。
apiVersion: platform.stke/v1alpha1
kind: StatefulSetPlus
metadata:
  annotations:
    deployImageSource: hub
    enablesystemd: disable
    platform.tkex/scaleDown-PendingPod-first: 'true'
    stkeUpateVersionTag: v3
    tkex-samename-count: '2'
  labels:
    clusterId: cls-hq6qk3i6
    env: production
    k8s-app: devtunnel-testing
    moduleFourId: '867795'
    projectName: prjqt8dd
    qcloud-app: devtunnel-testing
    region: ap-singapore
    workload-kind: statefulsetplus
  name: devtunnel-testing
  namespace: ns-prjqt8dd-867795-production
spec:
  batchDeployConfig: {}
  podManagementPolicy: Parallel
  # 必须是 1：hub 的队列是**进程内内存**，没有跨副本共享。多副本时 agent 的长轮询
  # 挂在其中一个 Pod 上，而云梯的 ingest 会被 ClusterIP 轮到另一个 Pod，那边没有
  # agent 来取 → 回调稳定超时 504。要扩副本必须先把队列外置（Redis 等）。
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      clusterId: cls-hq6qk3i6
      env: production
      k8s-app: devtunnel-testing
      moduleFourId: '867795'
      projectName: prjqt8dd
      qcloud-app: devtunnel-testing
      region: ap-singapore
      workload-kind: statefulsetplus
  serviceName: devtunnel-testing
  template:
    metadata:
      annotations:
        eks.tke.cloud.tencent.com/spec-auto-upgrade: 'true'
      labels:
        clusterId: cls-hq6qk3i6
        env: production
        k8s-app: devtunnel-testing
        moduleFourId: '867795'
        projectName: prjqt8dd
        qcloud-app: devtunnel-testing
        region: ap-singapore
        workload-kind: statefulsetplus
    spec:
      affinity: {}
      containers:
      - command:
        - /usr/local/bin/devtunnel
        env:
        - name: DEVTUNNEL_LISTEN
          value: ':8080'
        - name: DEVTUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              key: DEVTUNNEL_TOKEN
              name: cloudladdergateway-devtunnel-secrets
        # 占位值：kustomization.yaml 的 replacements 会用
        # cloudladdergateway-platform-testing.env 的 CLOUDLADDERGATEWAY_IMAGE 盖掉这里，
        # 与 lightvela-proxy-testing 始终同一个镜像（devtunnel 二进制在同一镜像里）。
        image: csighub.tencentyun.com/skipzhang/cloudladdergateway:604530a7c2ad
        imagePullPolicy: Always
        name: devtunnel
        ports:
        - containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          limits:
            cpu: '500m'
            memory: 512Mi
          requests:
            cpu: '250m'
            memory: 256Mi
      dnsConfig:
        options:
        - name: ndots
          value: '2'
      imagePullSecrets:
      - name: csighub-skipzhang
      - name: csighub-xinqishang
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
---
apiVersion: v1
kind: Service
metadata:
  annotations:
    description: "devtunnel 反向隧道控制面 + 回调 ingest（集群内，供云梯访问）"
  name: devtunnel-testing
  namespace: ns-prjqt8dd-867795-production
spec:
  ports:
    - name: tcp-8080
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    k8s-app: devtunnel-testing
    qcloud-app: devtunnel-testing
    region: ap-singapore
    workload-kind: statefulsetplus
  sessionAffinity: None
  type: ClusterIP
