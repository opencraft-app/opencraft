apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ctl

resources:
  - ../../../../site-gateway/k8s/base

generators:
  - ksops-secret-generator.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: site-gateway-platform-values
    envs:
      - site-gateway-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_IMAGE
    targets:
      - select:
          kind: Deployment
          name: site-gateway
        fieldPaths:
          - spec.template.spec.containers.[name=site-gateway].image
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: site-gateway
        fieldPaths:
          - spec.template.metadata.annotations.[site-gateway.lightclaw.dev/redeploy-at]
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_ROOT_DOMAINS
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_ROOT_DOMAINS
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_COS_BUCKET
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_COS_BUCKET
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_COS_REGION
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_COS_REGION
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_CTL_BASE_URL
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_CTL_BASE_URL
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_DSH_DOMAINS
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_DSH_DOMAINS
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_DSH_FEDERATION_AUTHORIZE_URL
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_DSH_FEDERATION_AUTHORIZE_URL
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_DSH_FEDERATION_BASE_URL
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_DSH_FEDERATION_BASE_URL
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_DSH_FEDERATION_CLIENT_ID
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_DSH_FEDERATION_CLIENT_ID
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_DSH_FEDERATION_KEY_ID
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_DSH_FEDERATION_KEY_ID
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_WILDCARD_HOST
    targets:
      - select:
          kind: Ingress
          name: lightclaw-sites-public
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_TLS_SECRET_NAME
    targets:
      - select:
          kind: Ingress
          name: lightclaw-sites-public
        fieldPaths:
          - spec.tls.0.secretName
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_MODE
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_MODE
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_ENDPOINTS_ENABLED
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_ENDPOINTS_ENABLED
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_FIXED_HOST
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_FIXED_HOST
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_OIDC_ISSUER
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_OIDC_ISSUER
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_OIDC_AUTHORIZE_URL
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_OIDC_AUTHORIZE_URL
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_OIDC_TOKEN_URL
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_OIDC_TOKEN_URL
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_OIDC_JWKS_URL
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_OIDC_JWKS_URL
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_OIDC_CLIENT_ID
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_OIDC_CLIENT_ID
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_AEAD_ACTIVE_KEY_ID
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_AEAD_ACTIVE_KEY_ID
  - source:
      kind: ConfigMap
      name: site-gateway-platform-values
      fieldPath: data.SITE_GATEWAY_AUTH_SESSION_TTL
    targets:
      - select:
          kind: ConfigMap
          name: site-gateway-config
        fieldPaths:
          - data.SITE_GATEWAY_AUTH_SESSION_TTL
