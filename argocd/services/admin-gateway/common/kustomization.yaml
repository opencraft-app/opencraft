apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: lightclaw-gateway
generatorOptions:
  disableNameSuffixHash: true
resources:
- ../../../../admin-gateway/k8s/base
replacements:
- source:
    kind: ConfigMap
    name: admin-gateway-platform-values
    fieldPath: data.ADMIN_GATEWAY_IMAGE
  targets:
  - select:
      kind: Deployment
      name: admin-gateway
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: admin-gateway-platform-values
    fieldPath: data.ADMIN_GATEWAY_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: admin-gateway
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: admin-gateway-platform-values
    fieldPath: data.ADMIN_GATEWAY_DEPLOYED_AT
  targets:
  - select:
      kind: Deployment
      name: admin-gateway
    fieldPaths:
    - spec.template.metadata.annotations.[admin-gateway.clawhub.dev/redeploy-at]
- source:
    kind: ConfigMap
    name: admin-gateway-platform-values
    fieldPath: data.ADMIN_GATEWAY_PUBLIC_HOST
  targets:
  - select:
      kind: Ingress
      name: admin-lightclaw-public
    fieldPaths:
    - spec.rules.0.host
    - spec.tls.0.hosts.0
  - select:
      kind: TkeServiceConfig
      name: admin-lightclaw-public-config
    fieldPaths:
    - spec.loadBalancer.l7Listeners.0.domains.0.domain
    - spec.loadBalancer.l7Listeners.0.domains.0.rules.0.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.0.domains.0.rules.1.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.0.domains.0.rules.2.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.0.domains.0.rules.3.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.0.domains.0.rules.4.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.1.defaultServer
    - spec.loadBalancer.l7Listeners.1.domains.0.domain
    - spec.loadBalancer.l7Listeners.1.domains.0.rules.0.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.1.domains.0.rules.1.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.1.domains.0.rules.2.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.1.domains.0.rules.3.healthCheck.httpCheckDomain
    - spec.loadBalancer.l7Listeners.1.domains.0.rules.4.healthCheck.httpCheckDomain
- source:
    kind: ConfigMap
    name: admin-gateway-platform-values
    fieldPath: data.ADMIN_GATEWAY_TLS_SECRET_NAME
  targets:
  - select:
      kind: Ingress
      name: admin-lightclaw-public
    fieldPaths:
    - spec.tls.0.secretName
- source:
    kind: ConfigMap
    name: admin-gateway-platform-values
    fieldPath: data.ADMIN_GATEWAY_CLS_TOPIC_ID
  targets:
  - select:
      kind: LogConfig
      name: admin-gateway-access
    fieldPaths:
    - spec.clsDetail.topicId
