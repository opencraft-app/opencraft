apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-bj-7
resources:
- tls-secrets.yaml
components:
- ../common
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: admin-gateway-config
  files:
  - config.yaml=config.yaml
- name: admin-gateway-platform-values
  envs:
  - admin-gateway-platform.env
patches:
- path: delete-shared-namespace.yaml
- path: delete-shared-serviceaccount.yaml
- path: delete-servicemonitor.yaml
- path: delete-logconfig.yaml
- target:
    kind: Ingress
    name: admin-lightclaw-public
  patch: |-
    - op: add
      path: /metadata/annotations/ingress.cloud.tencent.com~1direct-access
      value: "true"
- target:
    kind: Service
    name: admin-gateway-ingress
  patch: |-
    - op: remove
      path: /spec/ports/0/nodePort
