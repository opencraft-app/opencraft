apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightclaw-gateway
resources:
- ../common
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: admin-gateway-config
  files:
  - config.yaml=config.yaml
- name: admin-gateway-platform-values
  envs:
  - admin-gateway-platform.env
