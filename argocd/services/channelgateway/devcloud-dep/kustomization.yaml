apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: dep

resources:
  - channelgateway.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: channelgateway-platform-values
    envs:
      - channelgateway-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: channelgateway-platform-values
      fieldPath: data.CHANNELGATEWAY_IMAGE
    targets:
      - select:
          kind: Deployment
          name: channelgateway
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: channelgateway-platform-values
      fieldPath: data.CHANNELGATEWAY_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: channelgateway
        fieldPaths:
          - spec.template.metadata.annotations.[cloudagent.dev/redeploy-at]
