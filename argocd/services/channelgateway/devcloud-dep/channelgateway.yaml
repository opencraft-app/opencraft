apiVersion: v1
kind: ConfigMap
metadata:
  name: channelgateway-config
  labels:
    app.kubernetes.io/name: channelgateway
    cloudagent.dev/environment: devcloud-dep
data:
  CHANNELGATEWAY_DB_DRIVER: "mysql"
  CHANNELGATEWAY_ACP_URL: "ws://cloudagent-gateway.dep.svc.cluster.local/acp"
  CHANNELGATEWAY_TENANT_ID: "tenant-devcloud-dep"
  CHANNELGATEWAY_PROJECT_ID: "project-devcloud-dep"
  CHANNELGATEWAY_OWNER_ID: "channelgateway-devcloud-dep"
  CHANNELGATEWAY_LISTEN_ADDR: ":8094"
  CHANNELGATEWAY_LEASE_TTL: "90s"
  CHANNELGATEWAY_REQUEST_TIMEOUT: "60s"
  CHANNELGATEWAY_WECOM_ENABLED: "true"
  CHANNELGATEWAY_WECOM_ACCOUNT_ID: "wecom-devcloud-dep"
  WECOM_WEBSOCKET_URL: "wss://openws.work.weixin.qq.com"
  CHANNELGATEWAY_AGENT_ID: "cloudagent-main"
  CHANNELGATEWAY_WECOM_DM_POLICY: "open"
  CHANNELGATEWAY_WECOM_GROUP_POLICY: "open"
  CHANNELGATEWAY_WECOM_HANDLER_WORKERS: "4"
  CHANNELGATEWAY_WECOM_HANDLER_QUEUE_SIZE: "128"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: channelgateway
  labels:
    app.kubernetes.io/name: channelgateway
    cloudagent.dev/environment: devcloud-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: channelgateway
  template:
    metadata:
      annotations:
        cloudagent.dev/redeploy-at: 2026-06-03T00:00:00Z
      labels:
        app.kubernetes.io/name: channelgateway
        cloudagent.dev/environment: devcloud-dep
    spec:
      securityContext:
        fsGroup: 10001
      imagePullSecrets:
        - name: csighub-skipzhang
        - name: csighub-xinqishang
      containers:
        - name: channelgateway
          image: csighub.tencentyun.com/skipzhang/channelgateway:devcloud-dep-bootstrap
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8094
          envFrom:
            - configMapRef:
                name: channelgateway-config
          env:
            - name: CHANNELGATEWAY_DB_PATH
              valueFrom:
                secretKeyRef:
                  name: channelgateway-runtime-secrets
                  key: CHANNELGATEWAY_DB_PATH
            - name: WECOM_BOT_ID
              valueFrom:
                secretKeyRef:
                  name: channelgateway-wecom-secrets
                  key: WECOM_BOT_ID
            - name: WECOM_SECRET
              valueFrom:
                secretKeyRef:
                  name: channelgateway-wecom-secrets
                  key: WECOM_SECRET
            - name: CHANNELGATEWAY_ACP_AUTHORIZATION
              valueFrom:
                secretKeyRef:
                  name: channelgateway-wecom-secrets
                  key: CHANNELGATEWAY_ACP_AUTHORIZATION
                  optional: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: channelgateway
  labels:
    app.kubernetes.io/name: channelgateway
    cloudagent.dev/environment: devcloud-dep
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: channelgateway
  ports:
    - name: http
      port: 8094
      targetPort: http
