apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightclaw-gateway
components:
- ../common
- ../profiles/sandbox
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: service-gateway-config
  files:
  - config.yaml=config.yaml
- name: service-gateway-platform-values
  envs:
  - service-gateway-platform.env
patches:
- path: delete-servicemonitor.yaml
