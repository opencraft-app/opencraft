apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-bj-7
resources:
- tls-secrets.yaml
components:
- ../common
- ../profiles/sandbox
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: service-gateway-config
  files:
  - config.yaml=config.yaml
- name: service-gateway-platform-values
  envs:
  - service-gateway-platform.env
patches:
- path: delete-servicemonitor.yaml
- path: delete-logconfig.yaml
- target:
    kind: Service
    name: service-gateway-ingress
  patch: |-
    - op: remove
      path: /spec/ports/0/nodePort
- target:
    kind: Ingress
    name: lightclaw-public
  patch: |-
    - op: add
      path: /metadata/annotations/ingress.cloud.tencent.com~1direct-access
      value: "true"
- target:
    kind: Ingress
    name: lightclaw-public
  patch: |-
    - op: add
      path: /spec/rules/0/http/paths/3
      value:
        path: /trade/jifei/callback
        pathType: Exact
        backend:
          service:
            name: trade-nodeport
            port:
              number: 80
# v1.7.28 BUG-05 排障：clgateway 跨集群不可达 trade ClusterIP (172.18.255.193),
# 走 lightclaw-public Ingress 公网 LB (lb-7wwvu33f-wech4zxypn75v068.clb.bj-tencentclb.com)
# 路由到 trade NodePort Service (api-sandbox-bj-7.lightclaw.tech/trade/jifei/callback
# → trade-nodeport ns 80).
# pathType=Exact 防与现有 / catch-all (paths[3]) 冲突, 插入位置 paths[3] 在 /v1/chatclaw/runtime
# 之后 / 之前, qcloud Ingress 按最长前缀+精确匹配优先.
# **后端 Service "trade-nodeport"**: 不是主 Service "trade" (ClusterIP, 给 ctl 内部 RPC 用).
# direct-access=true 直连模式要求后端 NodePort, 故起独立 NodePort Service 不动 trade 主 Service
# (与 service-gateway-ingress NodePort 同范式). 由 trade overlay 提供, 详见
# argocd/services/trade/sandbox-bj-7/trade-nodeport.yaml.
