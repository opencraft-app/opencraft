auth_service_url: http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local
allowed_origins:
- "*"
trusted_proxy_cidrs:
- 100.64.0.0/10
routes:
- name: users
  prefix: /users
  methods:
  - GET
  - OPTIONS
  upstream: http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: public
- name: shadow-binding-verify-phone
  prefix: /v1/shadow/binding/verify-phone
  methods:
  - POST
  - OPTIONS
  upstream: http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
- name: shadow-binding-send-sms
  prefix: /v1/shadow/binding/send-sms
  methods:
  - POST
  - OPTIONS
  upstream: http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
- name: shadow-binding-free-trial-compat
  prefix: /v1/shadow/register/free-trial
  methods:
  - POST
  - OPTIONS
  upstream: http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
- name: shadow-binding-send-sms-compat
  prefix: /v1/shadow/register/send-sms
  methods:
  - POST
  - OPTIONS
  upstream: http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
- name: shadow
  prefix: /v1/shadow
  methods:
  - GET
  - POST
  - OPTIONS
  upstream: http://shadow.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: public
- name: sandbox
  prefix: /sandboxes
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  upstream: http://sandbox-api.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  auth_strategy: session
- name: ctl
  prefix: /v1/instances
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  upstream: http://ctl-api.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  require_realname: true
  auth_strategy: shadow_api_key_or_session
  response_header_timeout: 60s
- name: ctl-me
  prefix: /v1/me
  methods:
  - GET
  - OPTIONS
  upstream: http://ctl-api.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  auth_strategy: session
- name: ctl-soul-templates
  prefix: /v1/soul-templates
  methods:
  - GET
  - OPTIONS
  upstream: http://ctl-api.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  auth_strategy: session
- name: ctl-bundles
  prefix: /v1/bundles
  methods:
  - GET
  - OPTIONS
  upstream: http://ctl-api.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  auth_strategy: session
- name: ctl-passes
  prefix: /v1/passes
  methods:
  - GET
  - POST
  - OPTIONS
  upstream: http://ctl-api.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  require_realname: true
  auth_strategy: session
  optional_auth_allow:
  - method: POST
    path: /v1/passes/order-url
  - method: POST
    path: /v1/passes/{pass_id}/renew/order-url
- name: subscriptions
  prefix: /subscriptions
  methods:
  - GET
  - POST
  - OPTIONS
  upstream: http://subscription.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  auth_strategy: session
- name: sessions
  prefix: /v1/sessions
  methods:
  - GET
  - POST
  - DELETE
  - OPTIONS
  upstream: http://session.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  auth_strategy: session
- name: chatclaw-runtime
  prefix: /v1/chatclaw/runtime
  methods:
  - GET
  - POST
  - OPTIONS
  upstream: http://chatclaw-runtime.chatclaw-runtime.svc.cluster.local
  access: authenticated
  auth_strategy: session
- name: auth
  prefix: /auth
  methods:
  - GET
  - POST
  - PUT
  - DELETE
  - OPTIONS
  upstream: http://lightclaw-auth.lightvela-playground-sandbox-bj-7.svc.cluster.local
  access: authenticated
  auth_strategy: session
  public_allow:
  - method: POST
    path: /auth/password/sign-in
  - method: POST
    path: /auth/password/sign-up
  - method: POST
    path: /auth/password/forgot
  - method: POST
    path: /auth/sms/send
  - method: POST
    path: /auth/sms/verify
  - method: POST
    path: /auth/invite/validate
  - method: POST
    path: /auth/invite/prepare
  - method: POST
    path: /auth/internal/tencentcloud/account
  - method: GET
    path: /auth/oauth/qq/start
  - method: GET
    path: /auth/oauth/qq/callback
  - method: GET
    path: /auth/oauth/wechat/start
  - method: GET
    path: /auth/oauth/wechat/callback
  - method: GET
    path: /auth/oauth/google/start
  - method: GET
    path: /auth/oauth/google/callback
  - method: GET
    path: /auth/oauth/github/start
  - method: GET
    path: /auth/oauth/github/callback
  - method: GET
    path: /auth/email/bind/confirm
