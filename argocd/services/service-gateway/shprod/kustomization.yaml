apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lightclaw-gateway

components:
  - ../common

resources:
  - tls-secrets.yaml
  - api-lightvela-com-ingress.yaml

generators:
  - ksops-secret-generator.yaml

patches:
  - path: delete-namespace.yaml
  - path: delete-default-serviceaccount.yaml
  - path: delete-servicemonitor.yaml
  - target:
      kind: Ingress
      name: lightclaw-public
    patch: |-
      - op: add
        path: /spec/tls/1
        value:
          hosts:
            - api.lightvela.tencent.com
          secretName: api-lightvela-tencent-com-tls
      - op: add
        path: /spec/rules/1
        value:
          host: api.lightvela.tencent.com
          http:
            paths:
              - path: /auth
                pathType: Prefix
                backend:
                  service:
                    name: service-gateway-ingress
                    port:
                      number: 80
              - path: /sandboxes
                pathType: Prefix
                backend:
                  service:
                    name: service-gateway-ingress
                    port:
                      number: 80
              - path: /v1/chatclaw/runtime
                pathType: Prefix
                backend:
                  service:
                    name: service-gateway-ingress
                    port:
                      number: 80
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: service-gateway-ingress
                    port:
                      number: 80
              - path: /healthz
                pathType: Exact
                backend:
                  service:
                    name: service-gateway-ingress
                    port:
                      number: 80
  - target:
      kind: TkeServiceConfig
      name: lightclaw-public-config
    patch: |-
      - op: add
        path: /spec/loadBalancer/l7Listeners/0/domains/1
        value:
          domain: api.lightvela.tencent.com
          rules:
            - url: /auth
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
            - url: /sandboxes
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
            - url: /v1/chatclaw/runtime
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
            - url: /
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
      - op: add
        path: /spec/loadBalancer/l7Listeners/1/domains/1
        value:
          domain: api.lightvela.tencent.com
          rules:
            - url: /auth
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
            - url: /sandboxes
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
            - url: /v1/chatclaw/runtime
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
            - url: /
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
            - url: =/healthz
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: api.lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2


configMapGenerator:
  - name: service-gateway-config
    files:
      - config.yaml=config.yaml
  - name: service-gateway-platform-values
    envs:
      - service-gateway-platform.env
