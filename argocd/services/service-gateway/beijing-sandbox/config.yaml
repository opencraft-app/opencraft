auth_service_url: http://lightclaw-auth.user-auth.svc.cluster.local
allowed_origins:
  - "*"
trusted_proxy_cidrs:
  - 100.64.0.0/10
worker_actions:
  enabled: true
  temporal:
    address: temporal.lightvela.com:443
    namespace: default
    tls: true
    server_name: temporal.lightvela.com
    token_env: TEMPORAL_BEARER_TOKEN
    task_queue: tencent-cvm-rescue-export
    timeout: 10s
  rescue_export:
    task_queue: tencent-cvm-rescue-export
    cos_upload_bucket: https://lightclawuser-1388575217.cos.ap-beijing.myqcloud.com
    cos_upload_region: ap-beijing
    cos_upload_key_prefix: rescue-exports
    cos_upload_url_ttl_seconds: 28800
    region_candidates: [ap-beijing, ap-shanghai, ap-guangzhou]
  hermes_import:
    task_queue: hermes-import
    upload_key_prefix: rescue-imports
    upload_url_ttl_seconds: 900
routes:
  - name: users
    prefix: /users
    methods: [GET, OPTIONS]
    upstream: http://lightclaw-auth.user-auth.svc.cluster.local
    access: public
  - name: ctl-agentchat-introspect
    prefix: /v1/integrations/agentchat
    methods: [POST, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: public
  - name: ctl-cloudapi
    prefix: /cloudapi
    methods: [POST, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: public
  - name: ctl
    prefix: /v1/instances
    methods: [GET, POST, DELETE, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: authenticated
    path_policy: allowlist
    path_allow:
      - { method: GET, path: "/v1/instances" }
      - { method: POST, path: "/v1/instances" }
      - { method: GET, path: "/v1/instances/{instance_id}" }
      - { method: DELETE, path: "/v1/instances/{instance_id}" }
      - { method: GET, path: "/v1/instances/{instance_id}/borncard" }
      - { method: POST, path: "/v1/instances/{instance_id}/debug/exec" }
      - { method: POST, path: "/v1/instances/{instance_id}/tat/session" }
      - { method: POST, path: "/v1/instances/{instance_id}/config/reset" }
      - { method: POST, path: "/v1/instances/{instance_id}/agentchat/launch-token" }
      - { method: POST, path: "/v1/instances/{instance_id}/channels/config" }
      - { method: POST, path: "/v1/instances/{instance_id}/channels/weixin/login-sessions" }
      - { method: GET, path: "/v1/instances/{instance_id}/channels/weixin/login-sessions/{session_id}" }
      - { method: GET, path: "/v1/instances/{instance_id}/channels/weixin/login-sessions/{session_id}/events" }
      - { method: POST, path: "/v1/instances/{instance_id}/channels/weixin/login-sessions/{session_id}/cancel" }
    require_realname: true
    auth_strategy: shadow_api_key_or_session
    response_header_timeout: 60s
  - name: sandbox-legacy
    prefix: /sandboxes
    methods: [POST, OPTIONS]
    upstream: http://sandbox-api.sandbox.svc.cluster.local
    access: authenticated
    auth_strategy: session
    path_policy: allowlist
    path_allow:
      - { method: POST, path: "/sandboxes" }
    response_header_timeout: 60s
  - name: ctl-me
    prefix: /v1/me
    methods: [GET, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: ctl-soul-templates
    prefix: /v1/soul-templates
    methods: [GET, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: ctl-bundles
    prefix: /v1/bundles
    methods: [GET, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: ctl-passes
    prefix: /v1/passes
    methods: [GET, POST, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: authenticated
    require_realname: true
    auth_strategy: session
    optional_auth_allow:
      - method: POST
        path: /v1/passes/order-url
      - method: POST
        path: /v1/passes/{pass_id}/renew/order-url
  - name: ctl-orders
    prefix: /v1/orders
    methods: [GET, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: subscriptions
    prefix: /subscriptions
    methods: [GET, POST, OPTIONS]
    upstream: http://subscription.user-auth.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: sessions
    prefix: /v1/sessions
    methods: [GET, POST, DELETE, OPTIONS]
    upstream: http://session.user-auth.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: chatclaw-runtime
    prefix: /v1/chatclaw/runtime
    methods: [GET, POST, OPTIONS]
    upstream: http://chatclaw-runtime.chatclaw-runtime.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: vibebase
    prefix: /v1/vibebase
    rewrite_prefix: /v1
    methods: [GET, PUT, DELETE, OPTIONS]
    upstream: http://vibebase.ai-gateway.svc.cluster.local
    access: authenticated
    auth_strategy: session
  - name: content-audit-callback
    prefix: /contentaudit/callback
    methods: [POST, OPTIONS]
    upstream: http://lightclaw-auth.user-auth.svc.cluster.local
    access: public
  - name: trade-jifei-callback
    prefix: /trade/jifei/callback
    methods: [POST, OPTIONS]
    upstream: http://trade.trade.svc.cluster.local
    access: public
  - name: ctl-frontend
    prefix: /v1/frontend
    methods: [GET, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: public
    response_header_timeout: 10s

  - name: ctl-websites
    prefix: /v1/websites
    methods: [GET, POST, DELETE, OPTIONS]
    upstream: http://ctl-api.ctl.svc.cluster.local
    access: authenticated
    auth_strategy: session
    allow_vela_instance_key: true
    vela_instance_key_allow:
      - { method: GET, path: "/v1/websites/capability" }
      - { method: GET, path: "/v1/websites" }
      - { method: POST, path: "/v1/websites" }
      - { method: GET, path: "/v1/websites/{site_id}" }
      - { method: DELETE, path: "/v1/websites/{site_id}" }
      - { method: GET, path: "/v1/websites/{site_id}/releases" }
      - { method: POST, path: "/v1/websites/{site_id}/releases" }
      - { method: GET, path: "/v1/websites/{site_id}/operations/{operation_id}" }
    response_header_timeout: 30s

  - name: auth
    prefix: /auth
    methods: [GET, POST, PUT, DELETE, OPTIONS]
    upstream: http://lightclaw-auth.user-auth.svc.cluster.local
    access: authenticated
    auth_strategy: session
    public_allow:
      - method: GET
        path: /auth/federation/context
      - method: POST
        path: /auth/federation/tickets
      - method: POST
        path: /auth/federation/exchange
      - method: POST
        path: /auth/federation/bots/{bot_id}/tat/session
      - method: POST
        path: /auth/password/sign-in
      - method: POST
        path: /auth/password/sign-up
      - method: POST
        path: /auth/password/forgot
      - method: POST
        path: /auth/sms/send
      - method: POST
        path: /auth/sms/verify
      - method: POST
        path: /auth/invite/validate
      - method: POST
        path: /auth/invite/prepare
      - method: POST
        path: /auth/tat/device-bind
      - method: POST
        path: /auth/internal/tencentcloud/account
      - method: GET
        path: /auth/realname/faceid/callback
      - method: GET
        path: /auth/oauth/qq/start
      - method: GET
        path: /auth/oauth/qq/callback
      - method: GET
        path: /auth/oauth/wechat/start
      - method: GET
        path: /auth/oauth/wechat/callback
      - method: GET
        path: /auth/oauth/google/start
      - method: GET
        path: /auth/oauth/google/callback
      - method: GET
        path: /auth/oauth/github/start
      - method: GET
        path: /auth/oauth/github/callback
      - method: GET
        path: /auth/email/bind/confirm
  # 用户反馈系统：用户提交(presign) 与运营读取(list/sign) 均走此路由。
  # 网关仅做登录态校验(access: authenticated 注入 X-User-Id)，
  # 具体权限(presign 任意登录用户 / list·sign 白名单)由 ticket 内部判定。
  - name: support-feedback
    prefix: /support/feedback
    methods: [GET, POST, OPTIONS]
    upstream: http://ticket.ticket.svc.cluster.local
    access: authenticated
    auth_strategy: session
