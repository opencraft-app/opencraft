apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-kr-1
resources:
- tls-secrets.yaml
components:
- ../common
- ../profiles/sandbox
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: service-gateway-config
  files:
  - config.yaml=config.yaml
- name: service-gateway-platform-values
  envs:
  - service-gateway-platform.env
patches:
- path: delete-servicemonitor.yaml
- path: delete-logconfig.yaml
- target:
    kind: Service
    name: service-gateway-ingress
  patch: |-
    - op: remove
      path: /spec/ports/0/nodePort
- target:
    kind: Ingress
    name: lightclaw-public
  patch: |-
    - op: add
      path: /metadata/annotations/ingress.cloud.tencent.com~1direct-access
      value: "true"
    - op: add
      path: /metadata/annotations/ingress.cloud.tencent.com~1pass-to-target
      value: "true"
    - op: add
      path: /metadata/annotations/ingress.cloud.tencent.com~1rewrite-support
      value: "true"
    - op: add
      path: /metadata/annotations/ingress.cloud.tencent.com~1auto-rewrite
      value: "true"
