apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: lightclaw-gateway

resources:
  - ../../../../service-gateway/k8s/base
  - tls-secrets.yaml

generators:
  - ksops-secret-generator.yaml

patches:
  - path: delete-namespace.yaml
  - path: delete-default-serviceaccount.yaml
  - path: delete-servicemonitor.yaml
  - target:
      kind: Ingress
      name: lightclaw-public
    patch: |-
      - op: add
        path: /metadata/annotations/ingress.cloud.tencent.com~1direct-access
        value: "true"

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: service-gateway-config
    files:
      - config.yaml=config.yaml
  - name: service-gateway-platform-values
    envs:
      - service-gateway-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: service-gateway-platform-values
      fieldPath: data.SERVICE_GATEWAY_IMAGE
    targets:
      - select:
          kind: Deployment
          name: service-gateway
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: service-gateway-platform-values
      fieldPath: data.SERVICE_GATEWAY_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: service-gateway
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: service-gateway-platform-values
      fieldPath: data.SERVICE_GATEWAY_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: service-gateway
        fieldPaths:
          - spec.template.metadata.annotations.[service-gateway.clawhub.dev/redeploy-at]
  - source:
      kind: ConfigMap
      name: service-gateway-platform-values
      fieldPath: data.SERVICE_GATEWAY_PUBLIC_HOST
    targets:
      - select:
          kind: Ingress
          name: lightclaw-public
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
      - select:
          kind: TkeServiceConfig
          name: lightclaw-public-config
        fieldPaths:
          - spec.loadBalancer.l7Listeners.0.domains.0.domain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.0.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.1.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.2.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.0.domains.0.rules.3.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.1.defaultServer
          - spec.loadBalancer.l7Listeners.1.domains.0.domain
          - spec.loadBalancer.l7Listeners.1.domains.0.rules.0.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.1.domains.0.rules.1.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.1.domains.0.rules.2.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.1.domains.0.rules.3.healthCheck.httpCheckDomain
          - spec.loadBalancer.l7Listeners.1.domains.0.rules.4.healthCheck.httpCheckDomain
  - source:
      kind: ConfigMap
      name: service-gateway-platform-values
      fieldPath: data.SERVICE_GATEWAY_TLS_SECRET_NAME
    targets:
      - select:
          kind: Ingress
          name: lightclaw-public
        fieldPaths:
          - spec.tls.0.secretName
  - source:
      kind: ConfigMap
      name: service-gateway-platform-values
      fieldPath: data.SERVICE_GATEWAY_CLS_TOPIC_ID
    targets:
      - select:
          kind: LogConfig
          name: service-gateway-access
        fieldPaths:
          - spec.clsDetail.topicId
