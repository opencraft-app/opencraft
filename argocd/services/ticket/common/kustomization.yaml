apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: ticket
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: ticket-platform-values
    fieldPath: data.TICKET_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: ticket
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: ticket-platform-values
    fieldPath: data.TICKET_IMAGE
  targets:
  - select:
      kind: Deployment
      name: ticket
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: ticket-platform-values
    fieldPath: data.TICKET_DEPLOYED_AT
  targets:
  - select:
      kind: Deployment
      name: ticket
    fieldPaths:
    - spec.template.metadata.annotations.[ticket.clawhub.dev/redeploy-at]
- source:
    kind: ConfigMap
    name: ticket-platform-values
    fieldPath: data.TICKET_SUPPORT_COS_BUCKET_URL
  targets:
  - select:
      kind: ConfigMap
      name: ticket-runtime-config
    fieldPaths:
    - data.SUPPORT_COS_BUCKET_URL
- source:
    kind: ConfigMap
    name: ticket-platform-values
    fieldPath: data.TICKET_SUPPORT_AGENT_IDS
  targets:
  - select:
      kind: ConfigMap
      name: ticket-runtime-config
    fieldPaths:
    - data.SUPPORT_AGENT_IDS
resources:
- ../../../../ticket/k8s/base
