apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ticket
components:
  - ../common
generators:
  - ksops-secret-generator.yaml
configMapGenerator:
  - name: ticket-platform-values
    envs:
      - ticket-platform.env
patches:
  - target:
      kind: ConfigMap
      name: ticket-runtime-config
    patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: ticket-runtime-config
      data:
        TICKET_ALLOWED_ORIGINS: "https://lightclaw.site,https://admin.lightclaw.site"
  - target:
      kind: Deployment
      name: ticket
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ticket
      spec:
        template:
          spec:
            containers:
            - name: ticket
              env:
              - name: MYSQL_HOST
                valueFrom:
                  configMapKeyRef:
                    name: ticket-platform-values
                    key: TICKET_MYSQL_HOST
              - name: MYSQL_PORT
                valueFrom:
                  configMapKeyRef:
                    name: ticket-platform-values
                    key: TICKET_MYSQL_PORT
              - name: TICKET_DB
                valueFrom:
                  configMapKeyRef:
                    name: ticket-platform-values
                    key: TICKET_DB
              - name: TICKET_DB_USER
                valueFrom:
                  configMapKeyRef:
                    name: ticket-platform-values
                    key: TICKET_DB_USER
