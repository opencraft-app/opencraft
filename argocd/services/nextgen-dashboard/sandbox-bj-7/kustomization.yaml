apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-bj-7
components:
- ../common
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: nextgen-dashboard-platform-values
  envs:
  - nextgen-dashboard-platform.env
patches:
- path: delete-shared-namespace.yaml
- path: delete-shared-serviceaccount.yaml
- target:
    kind: Service
    name: nextgen-dashboard-ingress
  patch: |-
    - op: remove
      path: /spec/ports/0/nodePort
- target:
    kind: Deployment
    name: nextgen-dashboard
  patch: "- op: replace\n  path: /spec/template/spec/containers/0/envFrom/1/secretRef/name\n\
    \  value: nextgen-dashboard-secrets\n- op: replace\n  path: /spec/template/spec/containers/1/envFrom\n\
    \  value:\n    - configMapRef:\n        name: nextgen-dashboard-config\n- op:\
    \ add\n  path: /spec/template/spec/containers/1/env\n  value:\n    - name: NEXTGEN_RUNNER_TOKEN\n\
    \      valueFrom:\n        secretKeyRef:\n          name: nextgen-dashboard-secrets\n\
    \          key: NEXTGEN_DASHBOARD_RUNNER_TOKEN"
