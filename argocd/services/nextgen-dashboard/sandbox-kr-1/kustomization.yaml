apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-kr-1
components:
- ../common
generators:
- ksops-secret-generator.yaml
configMapGenerator:
- name: nextgen-dashboard-platform-values
  envs:
  - nextgen-dashboard-platform.env
patches:
- path: delete-shared-namespace.yaml
- path: delete-shared-serviceaccount.yaml
- target:
    kind: Service
    name: nextgen-dashboard-ingress
  patch: |-
    - op: remove
      path: /spec/ports/0/nodePort
- target:
    kind: Deployment
    name: nextgen-dashboard
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/envFrom/1/secretRef/name
      value: nextgen-dashboard-secrets
    - op: replace
      path: /spec/template/spec/containers/1/envFrom
      value:
        - configMapRef:
            name: nextgen-dashboard-config
    - op: add
      path: /spec/template/spec/containers/1/env
      value:
        - name: NEXTGEN_RUNNER_TOKEN
          valueFrom:
            secretKeyRef:
              name: nextgen-dashboard-secrets
              key: NEXTGEN_DASHBOARD_RUNNER_TOKEN
