apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: velagwsets.gateway.lightvela.com
spec:
  group: gateway.lightvela.com
  scope: Namespaced
  names:
    kind: VelaGWSet
    listKind: VelaGWSetList
    plural: velagwsets
    singular: velagwset
    shortNames:
      - vgs
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Policy
          type: string
          jsonPath: .spec.managementPolicy
        - name: Ready
          type: string
          jsonPath: .status.conditions[?(@.type=="Ready")].status
        - name: Shard
          type: string
          jsonPath: .spec.shardRef
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              x-kubernetes-validations:
                - rule: "!has(oldSelf.decommissionApproval) || self.decommissionApproval == oldSelf.decommissionApproval"
                  message: decommissionApproval is immutable once written
              required:
                - fleetRef
                - shardRef
                - databaseName
                - redisDB
                - runtimeSecretRef
                - admin
                - trafficRuntimes
              properties:
                fleetRef:
                  type: string
                  minLength: 1
                  maxLength: 32
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: fleetRef is immutable
                shardRef:
                  type: string
                  minLength: 1
                  maxLength: 32
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: shardRef is immutable
                databaseName:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^[A-Za-z0-9_]+$
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: databaseName is immutable
                redisDB:
                  type: integer
                  format: int32
                  minimum: 0
                  maximum: 255
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: redisDB is immutable
                runtimeSecretRef:
                  type: object
                  required:
                    - name
                  properties:
                    name:
                      type: string
                      minLength: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: runtimeSecretRef is immutable
                managementPolicy:
                  type: string
                  default: Managed
                  enum:
                    - Observe
                    - AdoptionPending
                    - Managed
                  x-kubernetes-validations:
                    - rule: "oldSelf != 'Managed' || self == 'Managed'"
                      message: Managed policy cannot transition back to Observe or AdoptionPending
                scheduling:
                  type: object
                  properties:
                    priorityClassName:
                      type: string
                      maxLength: 253
                    imagePullSecret:
                      type: string
                      maxLength: 253
                    serverlessTraffic:
                      type: boolean
                trafficAvailability:
                  type: object
                  properties:
                    topologyKey:
                      type: string
                      maxLength: 253
                    pdbMinAvailable:
                      type: integer
                      format: int32
                      minimum: 1
                      maximum: 100
                decommissionApproval:
                  type: object
                  required:
                    - requestID
                    - attempt
                    - approvedAt
                    - crUID
                    - fleetRef
                    - shardRef
                    - databaseName
                    - redisDB
                  properties:
                    requestID:
                      type: string
                      minLength: 1
                      maxLength: 128
                    attempt:
                      type: integer
                      format: int32
                      minimum: 1
                    approvedAt:
                      type: string
                      format: date-time
                    crUID:
                      type: string
                      minLength: 1
                    fleetRef:
                      type: string
                      minLength: 1
                    shardRef:
                      type: string
                      minLength: 1
                    databaseName:
                      type: string
                      minLength: 1
                    redisDB:
                      type: integer
                      format: int32
                      minimum: 0
                      maximum: 255
                admin:
                  type: object
                  required:
                    - image
                  properties:
                    image:
                      type: string
                      minLength: 1
                      maxLength: 512
                      pattern: ^.+@sha256:[a-f0-9]{64}$
                trafficRuntimes:
                  type: array
                  minItems: 1
                  maxItems: 8
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - generation
                  items:
                    type: object
                    required:
                      - generation
                      - image
                      - replicas
                    properties:
                      generation:
                        type: integer
                        format: int64
                        minimum: 0
                      image:
                        type: string
                        minLength: 1
                        maxLength: 512
                        pattern: ^.+@sha256:[a-f0-9]{64}$
                        x-kubernetes-validations:
                          - rule: self == oldSelf
                            message: traffic runtime image is immutable within a generation
                      replicas:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 100
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                adminReadyReplicas:
                  type: integer
                  format: int32
                trafficRuntimes:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - generation
                  items:
                    type: object
                    required:
                      - generation
                    properties:
                      generation:
                        type: integer
                        format: int64
                      desiredReplicas:
                        type: integer
                        format: int32
                      readyReplicas:
                        type: integer
                        format: int32
                      availableReplicas:
                        type: integer
                        format: int32
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - type
                  items:
                    type: object
                    required:
                      - lastTransitionTime
                      - message
                      - reason
                      - status
                      - type
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
                      reason:
                        type: string
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      type:
                        type: string
