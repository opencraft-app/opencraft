apiVersion: batch/v1
kind: Job
metadata:
  name: llmgateway-release-bootstrap
  namespace: llmgateway
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "10"
spec:
  activeDeadlineSeconds: 300
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: llmgateway-release-bootstrap
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: tcr-pull-secret
      containers:
        - name: bootstrap
          image: lightclaw-shprod.tencentcloudcr.com/llmgateway/llmgateway@sha256:7bf2cd88628e78936e071b66d4aaa5b785fa6cc1dc023cda8ad917000075dd13
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/llmgateway-release-bootstrap"]
          env:
            - name: LLMGATEWAY_CONTROL_URL
              value: http://llmgateway-control
            - name: CLUSTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-runtime
                  key: CLUSTER_ADMIN_TOKEN
            - name: LLMGATEWAY_RELEASE_SOURCE
              value: prod
            - name: LLMGATEWAY_RELEASE_NAMESPACE
              value: llmgateway
            - name: LLMGATEWAY_RELEASE_FLEET
              value: prod
            - name: LLMGATEWAY_RELEASE_ID
              value: newapi-r3125e24-baseline
            - name: LLMGATEWAY_RELEASE_VERSION
              value: 3125e24-baseline
            - name: LLMGATEWAY_RELEASE_IMAGE
              value: calciumion/new-api@sha256:3125e24f119fa5e767563226a5208f2902b3faed3f27b69ea275b32c9f04a066
