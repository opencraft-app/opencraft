apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmgateway-shard-manager
  namespace: llmgateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmgateway-shard-manager
  namespace: llmgateway
rules:
  - apiGroups: ["llmgateway.io"]
    resources: ["llmfleets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmgateway-shard-manager
  namespace: llmgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmgateway-shard-manager
subjects:
  - kind: ServiceAccount
    name: llmgateway-shard-manager
    namespace: llmgateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llmgateway-shard-manager
  namespace: llmgateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmgateway-shard-manager
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-shard-manager
  namespace: llmgateway
  labels:
    app.kubernetes.io/name: llmgateway-shard-manager
    app.kubernetes.io/part-of: velagw
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmgateway-shard-manager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmgateway-shard-manager
        app.kubernetes.io/part-of: velagw
    spec:
      serviceAccountName: llmgateway-shard-manager
      imagePullSecrets:
        - name: tcr-pull-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: shard-manager
          image: lightclaw-shprod.tencentcloudcr.com/llmgateway/llmgateway@sha256:7bf2cd88628e78936e071b66d4aaa5b785fa6cc1dc023cda8ad917000075dd13
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/llmgateway-shard-manager"]
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: LLMGATEWAY_CONTROL_URL
              value: http://llmgateway-control
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-runtime
                  key: INTERNAL_SERVICE_TOKEN
            - name: LLMGATEWAY_FLEET
              value: prod
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
