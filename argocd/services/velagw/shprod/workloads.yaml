apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-control
  namespace: llmgateway
  labels:
    app: llmgateway-control
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llmgateway-control
  template:
    metadata:
      labels:
        app: llmgateway-control
    spec:
      imagePullSecrets:
        - name: tcr-pull-secret
      terminationGracePeriodSeconds: 150
      containers:
        - name: control
          image: lightclaw-shprod.tencentcloudcr.com/llmgateway/llmgateway@sha256:7bf2cd88628e78936e071b66d4aaa5b785fa6cc1dc023cda8ad917000075dd13
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/llmgateway-control"]
          ports:
            - name: http
              containerPort: 18080
          envFrom:
            - secretRef:
                name: llmgateway-control-runtime
          env:
            - name: PORT
              value: "18080"
            - name: LLMGATEWAY_CONSOLE_DIST
              value: /opt/llmgateway/console
            - name: LLMGATEWAY_NEWAPI_CLIENT_TIMEOUT
              value: 120s
            - name: LLMGATEWAY_TRAFFIC_BASE_URL
              value: http://llmgateway-traffic
            - name: LLMGATEWAY_TRAFFIC_PROBE_TIMEOUT
              value: 120s
            - name: LLMGATEWAY_SQL_STARTUP_TIMEOUT
              value: 10m
            - name: LLMGATEWAY_OTEL_STDOUT_ENABLE
              value: "true"
            - name: OTEL_SERVICE_NAME
              value: llmgateway-control
            - name: LLMGATEWAY_ENVIRONMENT
              value: prod
            - {name: OTEL_SERVICE_VERSION, value: "348b446"}
            - {name: K8S_CLUSTER_NAME, value: "shanghai-llmgateway-prod"}
            - name: K8S_NAMESPACE_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: K8S_POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: K8S_POD_UID
              valueFrom: {fieldRef: {fieldPath: metadata.uid}}
            - {name: K8S_CONTAINER_NAME, value: control}
            - {name: CLOUD_REGION, value: "ap-shanghai"}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
