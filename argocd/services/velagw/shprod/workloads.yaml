apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-traffic
  namespace: llmgateway
  labels:
    app: llmgateway-traffic
spec:
  replicas: 2
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: llmgateway-traffic
  template:
    metadata:
      labels:
        app: llmgateway-traffic
    spec:
      imagePullSecrets:
        - name: tcr-pull-secret
      terminationGracePeriodSeconds: 330
      containers:
        - name: traffic
          image: lightclaw-shprod.tencentcloudcr.com/llmgateway/llmgateway@sha256:7bf2cd88628e78936e071b66d4aaa5b785fa6cc1dc023cda8ad917000075dd13
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/llmgateway-traffic"]
          ports:
            - name: http
              containerPort: 18080
          envFrom:
            - secretRef:
                name: llmgateway-traffic-runtime
          env:
            - name: PORT
              value: "18080"
            - name: LLMGATEWAY_UPSTREAM_MAX_IDLE_CONNS
              value: "1000"
            - name: LLMGATEWAY_UPSTREAM_MAX_IDLE_CONNS_PER_HOST
              value: "200"
            - name: LLMGATEWAY_UPSTREAM_IDLE_CONN_TIMEOUT
              value: 90s
            - name: LLMGATEWAY_SET_RUNTIME_ROUTE_REQUIRED
              value: "true"
            - name: LLMGATEWAY_TRAFFIC_TRANSPORT_DRAIN_TIMEOUT
              value: 330s
            - name: LLMGATEWAY_DRAIN_WAIT
              value: 45s
            - name: LLMGATEWAY_SHUTDOWN_TIMEOUT
              value: 240s
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llmgateway-traffic
  namespace: llmgateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llmgateway-traffic
---
apiVersion: v1
kind: Service
metadata:
  name: llmgateway-traffic
  namespace: llmgateway
  annotations:
    service.cloud.tencent.com/direct-access: "true"
    service.cloud.tencent.com/specify-protocol: '{"80":{"protocol":["HTTP"],"hosts":{"token.lightvela.com":{}}},"443":{"protocol":["HTTPS"],"hosts":{"token.lightvela.com":{"tls":"token-lightvela-com-cert"}}}}'
spec:
  type: LoadBalancer
  selector:
    app: llmgateway-traffic
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: https
      port: 443
      targetPort: http
      protocol: TCP
