apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llmgateway

resources:
  - ../../../../velagw/deploy/k8s/prod/gitops-base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: velagw-platform-values
    envs:
      - velagw-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_IMAGE
    targets:
      - select:
          kind: Deployment
          name: llmgateway-control
        fieldPaths:
          - spec.template.spec.containers.[name=control].image
      - select:
          kind: Deployment
          name: llmgateway-traffic
        fieldPaths:
          - spec.template.spec.containers.[name=traffic].image
      - select:
          kind: Deployment
          name: llmgateway-worker-maintenance
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-core
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-admin
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-byok
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-observer
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: velagwset-controller
        fieldPaths:
          - spec.template.spec.containers.[name=controller].image
      - select:
          kind: Deployment
          name: llmgateway-shard-manager
        fieldPaths:
          - spec.template.spec.containers.[name=shard-manager].image
      - select:
          kind: Deployment
          name: velagwset-provisioner
        fieldPaths:
          - spec.template.spec.containers.[name=provisioner].image
          - spec.template.spec.containers.[name=provisioner].env.[name=LLMGATEWAY_IMAGE].value
      - select:
          kind: Job
          name: llmgateway-release-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=bootstrap].image
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_OTEL_SERVICE_VERSION
    targets:
      - select:
          kind: Deployment
          labelSelector: velagw.lightvela.com/regional-observability=true
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=OTEL_SERVICE_VERSION].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_CLUSTER_NAME
    targets:
      - select:
          kind: Deployment
          labelSelector: velagw.lightvela.com/regional-observability=true
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=K8S_CLUSTER_NAME].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_CLOUD_REGION
    targets:
      - select:
          kind: Deployment
          labelSelector: velagw.lightvela.com/regional-observability=true
        fieldPaths:
          - spec.template.spec.containers.0.env.[name=CLOUD_REGION].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_CONTROL_PROTOCOL
    targets:
      - select:
          kind: Service
          name: llmgateway-control-public
        fieldPaths:
          - metadata.annotations.[service.cloud.tencent.com/specify-protocol]
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_TRAFFIC_PROTOCOL
    targets:
      - select:
          kind: Service
          name: llmgateway-traffic
        fieldPaths:
          - metadata.annotations.[service.cloud.tencent.com/specify-protocol]
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_SET_AUTOSCALER_MIN_WARM_SETS
    targets:
      - select:
          kind: Deployment
          name: llmgateway-worker-core
        fieldPaths:
          - spec.template.spec.containers.[name=worker].env.[name=LLMGATEWAY_SET_AUTOSCALER_MIN_WARM_SETS].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_VELAGWSET_SERVERLESS_TRAFFIC
    targets:
      - select:
          kind: Deployment
          name: velagwset-provisioner
        fieldPaths:
          - spec.template.spec.containers.[name=provisioner].env.[name=LLMGATEWAY_VELAGWSET_SERVERLESS_TRAFFIC].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_SUBSCRIPTION_QUOTA_PACING_EFFECTIVE_AT
    targets:
      - select:
          kind: Deployment
          name: velagwset-controller
        fieldPaths:
          - spec.template.spec.containers.[name=controller].env.[name=SUBSCRIPTION_QUOTA_PACING_EFFECTIVE_AT].value
      - select:
          kind: ResourceGraphDefinition
          name: llmfleets.llmgateway.io
        fieldPaths:
          - spec.resources.[id=newapiAdminMasterDeployments].template.spec.template.spec.containers.[name=newapi].env.[name=SUBSCRIPTION_QUOTA_PACING_EFFECTIVE_AT].value
          - spec.resources.[id=newapiVersionedTrafficDeployments].template.spec.template.spec.containers.[name=newapi].env.[name=SUBSCRIPTION_QUOTA_PACING_EFFECTIVE_AT].value
          - spec.resources.[id=newapiTrafficDeployments].template.spec.template.spec.containers.[name=newapi].env.[name=SUBSCRIPTION_QUOTA_PACING_EFFECTIVE_AT].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_NEWAPI_IMAGE
    targets:
      - select:
          kind: ResourceGraphDefinition
          name: llmfleets.llmgateway.io
        fieldPaths:
          - spec.schema.spec.newapiImage
        options:
          delimiter: '"'
          index: 1
      - select:
          kind: Job
          name: llmgateway-release-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=bootstrap].env.[name=LLMGATEWAY_RELEASE_IMAGE].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_NEWAPI_RELEASE_ID
    targets:
      - select:
          kind: Job
          name: llmgateway-release-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=bootstrap].env.[name=LLMGATEWAY_RELEASE_ID].value
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_NEWAPI_RELEASE_VERSION
    targets:
      - select:
          kind: Job
          name: llmgateway-release-bootstrap
        fieldPaths:
          - spec.template.spec.containers.[name=bootstrap].env.[name=LLMGATEWAY_RELEASE_VERSION].value
