apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llmgateway

resources:
  - workloads.yaml
  - set-manager.yaml
  - llmfleet-rgd.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: velagw-platform-values
    envs:
      - velagw-platform.env

replacements:
  - source:
      kind: ConfigMap
      name: velagw-platform-values
      fieldPath: data.VELAGW_IMAGE
    targets:
      - select:
          kind: Deployment
          name: llmgateway-control
        fieldPaths:
          - spec.template.spec.containers.[name=control].image
      - select:
          kind: Deployment
          name: llmgateway-traffic
        fieldPaths:
          - spec.template.spec.containers.[name=traffic].image
      - select:
          kind: Deployment
          name: llmgateway-worker-maintenance
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-core
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-admin
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-byok
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: Deployment
          name: llmgateway-worker-observer
        fieldPaths:
          - spec.template.spec.containers.[name=worker].image
      - select:
          kind: CronJob
          name: llmgateway-set-manager
        fieldPaths:
          - spec.jobTemplate.spec.template.spec.containers.[name=set-manager].image
          - spec.jobTemplate.spec.template.spec.containers.[name=set-manager].env.[name=LLMGATEWAY_SET_MANAGER_RUNTIME_CLEANER_IMAGE].value
