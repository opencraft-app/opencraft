  namespace: llmgateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmgateway-set-manager
  namespace: llmgateway
rules:
- apiGroups:
  - llmgateway.io
  resources:
  - llmfleets
  verbs:
  - get
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmgateway-set-manager
  namespace: llmgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmgateway-set-manager
subjects:
- kind: ServiceAccount
  name: llmgateway-set-manager
  namespace: llmgateway
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llmgateway-set-manager
  namespace: llmgateway
spec:
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      creationTimestamp: null
    spec:
      backoffLimit: 1
      template:
        metadata: {}
        spec:
          containers:
          - command:
            - /usr/local/bin/llmgateway-set-manager
            env:
            - name: LLMGATEWAY_CONTROL_URL
              value: http://llmgateway-control
            - name: LLMGATEWAY_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  key: INTERNAL_SERVICE_TOKEN
                  name: llmgateway-set-manager-runtime
            - name: LLMGATEWAY_SET_MANAGER_SOURCE
              value: prod
            - name: LLMGATEWAY_SET_MANAGER_FLEET
              value: prod
            - name: LLMGATEWAY_SET_UPGRADE_LEASE_SECONDS
              value: '90'
            - name: LLMGATEWAY_SET_UPGRADE_PROBE_MODEL
              value: llmgw-mock-chat
            - name: OTEL_SERVICE_VERSION
              value: cd2c849
            image: lightclaw-bj82.tencentcloudcr.com/llmgateway/llmgateway@sha256:73de9bd035564d13c9e0e19f6c4ded63adc68ea21e811be64edbe12a65b5f7f8
            imagePullPolicy: IfNotPresent
            name: set-manager
            resources: {}
            terminationMessagePath: /dev/termination-log
            terminationMessagePolicy: File
          dnsPolicy: ClusterFirst
          imagePullSecrets:
          - name: tcr-pull-secret
          restartPolicy: OnFailure
          schedulerName: default-scheduler
          securityContext: {}
          serviceAccount: llmgateway-set-manager
          serviceAccountName: llmgateway-set-manager
          terminationGracePeriodSeconds: 30
  schedule: '*/1 * * * *'
  successfulJobsHistoryLimit: 1
  suspend: false
