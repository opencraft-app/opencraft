apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: llmgateway-control
  name: llmgateway-control
  namespace: llmgateway
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: llmgateway-control
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: llmgateway-control
    spec:
      containers:
      - command:
        - /usr/local/bin/llmgateway-control
        env:
        - name: PORT
          value: '18080'
        - name: LLMGATEWAY_CONSOLE_DIST
          value: /opt/llmgateway/console
        - name: LLMGATEWAY_NEWAPI_CLIENT_TIMEOUT
          value: 120s
        - name: LLMGATEWAY_TRAFFIC_BASE_URL
          value: http://llmgateway-traffic
        - name: LLMGATEWAY_TRAFFIC_PROBE_TIMEOUT
          value: 120s
        - name: LLMGATEWAY_SQL_STARTUP_TIMEOUT
          value: 10m
        - name: LLMGATEWAY_OTEL_STDOUT_ENABLE
          value: 'true'
        - name: OTEL_SERVICE_NAME
          value: llmgateway-control
        - name: LLMGATEWAY_ENVIRONMENT
          value: prod
        - name: OTEL_SERVICE_VERSION
          value: cd2c849
        envFrom:
        - secretRef:
            name: llmgateway-control-runtime
        image: lightclaw-bj82.tencentcloudcr.com/llmgateway/llmgateway@sha256:73de9bd035564d13c9e0e19f6c4ded63adc68ea21e811be64edbe12a65b5f7f8
        imagePullPolicy: IfNotPresent
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          timeoutSeconds: 2
        name: control
        ports:
        - containerPort: 18080
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 6
          httpGet:
            path: /readyz
            port: http
            scheme: HTTP
          initialDelaySeconds: 3
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        resources:
          limits:
            cpu: '1'
            memory: 1Gi
          requests:
            cpu: 250m
            memory: 256Mi
        startupProbe:
          failureThreshold: 120
          httpGet:
            path: /healthz
            port: http
            scheme: HTTP
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 2
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: tcr-pull-secret
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 150
---
