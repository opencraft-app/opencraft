apiVersion: v1
kind: ServiceAccount
metadata:
  name: velagwset-controller
  namespace: llmgateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velagwset-controller
  namespace: llmgateway
rules:
  - apiGroups: ["gateway.lightvela.com"]
    resources: ["velagwsets", "velagwsets/status", "velagwsets/finalizers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velagwset-controller
  namespace: llmgateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velagwset-controller
subjects:
  - kind: ServiceAccount
    name: velagwset-controller
    namespace: llmgateway
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: velagwset-controller
  namespace: llmgateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velagwset-controller
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velagwset-controller
  namespace: llmgateway
  labels:
    app.kubernetes.io/name: velagwset-controller
    app.kubernetes.io/part-of: velagw
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: velagwset-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velagwset-controller
        app.kubernetes.io/part-of: velagw
    spec:
      serviceAccountName: velagwset-controller
      imagePullSecrets:
        - name: tcr-pull-secret
      terminationGracePeriodSeconds: 30
      containers:
        - name: controller
          image: lightclaw-bj82.tencentcloudcr.com/llmgateway/llmgateway@sha256:cdadce421ce47e03877aa499fd8d7155bba0eff29ff1c564ec37bc948320e26f
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/velagwset-controller"]
          args:
            - --leader-elect
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: SUBSCRIPTION_QUOTA_PACING_EFFECTIVE_AT
              value: "0"
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
