apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: user-auth
generatorOptions:
  disableNameSuffixHash: true
replacements:
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_MYSQL_HOST
  targets:
  - select:
      kind: ConfigMap
      name: subscription-config
    fieldPaths:
    - data.MYSQL_HOST
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_MYSQL_PORT
  targets:
  - select:
      kind: ConfigMap
      name: subscription-config
    fieldPaths:
    - data.MYSQL_PORT
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_ALLOWED_ORIGINS
  targets:
  - select:
      kind: ConfigMap
      name: subscription-config
    fieldPaths:
    - data.SUBSCRIPTION_ALLOWED_ORIGINS
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_AI_GATEWAY_BASE_URL
  targets:
  - select:
      kind: ConfigMap
      name: subscription-config
    fieldPaths:
    - data.AI_GATEWAY_BASE_URL
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_FREE_PLAN_ID
  targets:
  - select:
      kind: ConfigMap
      name: subscription-config
    fieldPaths:
    - data.SUBSCRIPTION_FREE_PLAN_ID
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_LITE_PLAN_ID
  targets:
  - select:
      kind: ConfigMap
      name: subscription-config
    fieldPaths:
    - data.SUBSCRIPTION_LITE_PLAN_ID
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_PRO_PLAN_ID
  targets:
  - select:
      kind: ConfigMap
      name: subscription-config
    fieldPaths:
    - data.SUBSCRIPTION_PRO_PLAN_ID
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_NODE_POOL
  targets:
  - select:
      kind: Deployment
      name: subscription
    fieldPaths:
    - spec.template.spec.nodeSelector.pool
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_IMAGE
  targets:
  - select:
      kind: Deployment
      name: subscription
    fieldPaths:
    - spec.template.spec.containers.0.image
- source:
    kind: ConfigMap
    name: subscription-platform-values
    fieldPath: data.SUBSCRIPTION_DEPLOYED_AT
  targets:
  - select:
      kind: Deployment
      name: subscription
    fieldPaths:
    - spec.template.metadata.annotations.[subscription.clawhub.dev/redeploy-at]
resources:
- ../../../../subscription/k8s/base
