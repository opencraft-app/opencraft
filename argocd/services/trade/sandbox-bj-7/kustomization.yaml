apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: lightvela-playground-sandbox-bj-7
components:
  - ../common
generators:
  - ksops-secret-generator.yaml
configMapGenerator:
  - name: trade-platform-values
    envs:
      - trade-platform.env
resources:
  - trade-migration-job.yaml
patches:
  - path: delete-shared-namespace.yaml
  - path: delete-shared-serviceaccount.yaml
  - path: patch-playground-db.yaml
