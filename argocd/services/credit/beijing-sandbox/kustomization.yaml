apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: credit
components:
  - ../common
generators:
  - ksops-secret-generator.yaml
configMapGenerator:
  - name: credit-platform-values
    envs:
      - credit-platform.env
resources:
  - credit-lifecycle-worker.yaml
  - credit-usage-worker.yaml
patches:
  - path: patch-credit-redis.yaml
replacements:
  - source:
      kind: ConfigMap
      name: credit-platform-values
      fieldPath: data.CREDIT_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: credit-usage-worker
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: credit-lifecycle-worker
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: credit-platform-values
      fieldPath: data.CREDIT_IMAGE
    targets:
      - select:
          kind: Deployment
          name: credit-usage-worker
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: credit-lifecycle-worker
        fieldPaths:
          - spec.template.spec.containers.0.image
