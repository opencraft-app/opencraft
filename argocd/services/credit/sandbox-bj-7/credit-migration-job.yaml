apiVersion: batch/v1
kind: Job
metadata:
  name: credit-migrate
  labels:
    app: credit
    job: credit-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: credit
        job: credit-migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: db-bootstrap
          image: mysql:8.0
          env:
            - name: MYSQL_HOST
              value: mysql.lightvela-playground-sandbox-bj-7.svc.cluster.local
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: playground-runtime-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: CREDIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credit-runtime-secrets
                  key: CREDIT_DB_PASSWORD
          command:
            - /bin/sh
            - -ec
          args:
            - |
              until mysql --host="$MYSQL_HOST" --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" -e 'SELECT 1'; do  # pragma: allowlist secret
                echo "waiting for mysql"
                sleep 5
              done
              mysql --host="$MYSQL_HOST" --port=3306 --user=root --password="$MYSQL_ROOT_PASSWORD" <<SQL  # pragma: allowlist secret
              CREATE DATABASE IF NOT EXISTS \`credit_sandbox_bj_7\` CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci;
              CREATE USER IF NOT EXISTS 'credit'@'%' IDENTIFIED BY '${CREDIT_DB_PASSWORD}';  # pragma: allowlist secret
              ALTER USER 'credit'@'%' IDENTIFIED BY '${CREDIT_DB_PASSWORD}';  # pragma: allowlist secret
              GRANT ALL PRIVILEGES ON \`credit_sandbox_bj_7\`.* TO 'credit'@'%';
              FLUSH PRIVILEGES;
              SQL
      containers:
        - name: credit-migrate
          image: lightclaw-bj8.tencentcloudcr.com/lightclaw/credit:credit-7a23a50873bd
          command:
            - /usr/local/bin/credit-migrate
          envFrom:
            - configMapRef:
                name: credit-config
            - secretRef:
                name: credit-runtime-secrets
