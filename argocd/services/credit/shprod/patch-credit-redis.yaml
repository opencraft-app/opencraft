apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit
  namespace: credit
spec:
  template:
    spec:
      containers:
        - name: credit
          env:
            - name: CREDIT_REDIS_ADDR
              value: 10.15.192.90:6379
            - name: CREDIT_REDIS_DB
              value: "0"
            - name: CREDIT_AUTH_CODE_TTL
              value: 10m
