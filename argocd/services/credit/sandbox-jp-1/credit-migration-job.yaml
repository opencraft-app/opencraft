apiVersion: batch/v1
kind: Job
metadata:
  name: credit-migrate
  labels:
    app: credit
    job: credit-migrate
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: credit
        job: credit-migrate
    spec:
      restartPolicy: OnFailure
      containers:
        - name: credit-migrate
          image: REPLACE_CREDIT_IMAGE
          command:
            - /usr/local/bin/credit-migrate
          envFrom:
            - configMapRef:
                name: credit-config
            - secretRef:
                name: credit-runtime-secrets
