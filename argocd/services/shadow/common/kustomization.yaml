apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
namespace: shadow
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: shadow-platform-values
      fieldPath: data.SHADOW_IMAGE
    targets:
      - select:
          kind: Deployment
          name: shadow
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: shadow-platform-values
      fieldPath: data.SHADOW_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: shadow
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: shadow-platform-values
      fieldPath: data.SHADOW_CLOUDLADDER_GATEWAY_BASE_URL
    targets:
      - select:
          kind: ConfigMap
          name: shadow-config
        fieldPaths:
          - data.SHADOW_CLOUDLADDER_GATEWAY_BASE_URL
resources:
  - ../../../../shadow/k8s/base
