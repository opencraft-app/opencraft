apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sgprod-trade
  namespace: argocd
spec:
  description: Trade cutover project for Singapore production international billing rollout.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: trade
      name: sgprod
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
