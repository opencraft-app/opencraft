apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shprod-root-mono
  namespace: argocd
spec:
  description: Historical root app boundary for Shanghai production.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
