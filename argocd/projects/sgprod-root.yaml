apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sgprod-root
  namespace: argocd
spec:
  description: Root app boundary for Singapore production environment bootstrap.
  sourceRepos:
    - ssh://git@git.woa.com:443/wisp/mono2.git
  destinations:
    - namespace: "argocd"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: "argoproj.io"
      kind: "Application"
