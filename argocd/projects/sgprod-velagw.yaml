apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sgprod-velagw
  namespace: argocd
spec:
  description: Manually synchronized VelaGW project for the Johor Bahru sgprod cell.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: llmgateway
      name: johorbahru-llmgateway-prod
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  clusterResourceWhitelist:
    - group: kro.run
      kind: ResourceGraphDefinition
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicy
    - group: admissionregistration.k8s.io
      kind: ValidatingAdmissionPolicyBinding
  roles:
    - name: mono-observe
      policies:
        - p, proj:sgprod-velagw:mono-observe, applications, get, sgprod-velagw/*, allow
    - name: mono-sync
      policies:
        - p, proj:sgprod-velagw:mono-sync, applications, sync, sgprod-velagw/*, allow
