apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sgprod-service-gateway
  namespace: argocd
spec:
  description: Service gateway cutover project for Singapore migration onto mono2.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: lightclaw-gateway
      name: sgprod
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
