apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sgprod-payment
  namespace: argocd
spec:
  description: Payment cutover project for Singapore migration onto mono2.
  sourceRepos:
    - ssh://git@git.woa.com:443/wisp/mono2.git
  destinations:
    - namespace: user-auth
      name: sgprod
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
