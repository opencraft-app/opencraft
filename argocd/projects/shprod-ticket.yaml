apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shprod-ticket
  namespace: argocd
spec:
  description: Ticket feedback service project for shprod production.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: ticket
      name: shprod
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
