apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devcloud-dep
  namespace: argocd
spec:
  description: GitOps project for the empty DevCloud dep Kubernetes cluster.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: "*"
      name: devcloud-dep
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
  roles:
    - name: mono-observe
      description: Read access for mono leaf apps in DevCloud dep.
      groups:
        - mono-release-groups/mono-devcloud-dep-release
        - mono-release-groups/mono-devcloud-dep-readonly
      policies:
        - p, proj:devcloud-dep:mono-observe, applications, get, devcloud-dep/*, allow
    - name: mono-logs
      description: Log access for mono leaf apps in DevCloud dep.
      groups:
        - mono-release-groups/mono-devcloud-dep-release
        - mono-release-groups/mono-devcloud-dep-readonly
      policies:
        - p, proj:devcloud-dep:mono-logs, logs, get, devcloud-dep/*, allow
    - name: mono-sync
      description: Sync access for mono leaf apps in DevCloud dep.
      groups:
        - mono-release-groups/mono-devcloud-dep-release
      policies:
        - p, proj:devcloud-dep:mono-sync, applications, sync, devcloud-dep/*, allow
