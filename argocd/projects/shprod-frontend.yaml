apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shprod-frontend
  namespace: argocd
spec:
  description: Frontend cutover project for Shanghai migration onto mono2.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: frontend
      name: shprod
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
