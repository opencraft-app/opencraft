apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: devcloud-dep-root
  namespace: argocd
spec:
  description: Root app boundary for DevCloud dep environment bootstrap.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: argoproj.io
      kind: Application
