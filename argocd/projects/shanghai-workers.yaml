apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shanghai-workers
  namespace: argocd
spec:
  description: GitOps project for the dedicated Shanghai Temporal worker cluster.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: '*'
      name: shanghai-workers
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: mono-observe
      description: Read access for Shanghai worker cluster apps.
      policies:
        - p, proj:shanghai-workers:mono-observe, applications, get, shanghai-workers/*, allow
    - name: mono-logs
      description: Log access for Shanghai worker cluster apps.
      policies:
        - p, proj:shanghai-workers:mono-logs, logs, get, shanghai-workers/*, allow
    - name: mono-sync
      description: Sync access for Shanghai worker cluster apps.
      policies:
        - p, proj:shanghai-workers:mono-sync, applications, sync, shanghai-workers/*, allow
