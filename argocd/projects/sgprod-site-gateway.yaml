apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sgprod-site-gateway
  namespace: argocd
spec:
  description: Public static website gateway for Singapore production.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: ctl
      name: sgprod
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
