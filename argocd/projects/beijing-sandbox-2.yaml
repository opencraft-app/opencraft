apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: beijing-sandbox-2
  namespace: argocd
spec:
  description: GitOps project for the second Beijing sandbox environment.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: '*'
      name: beijing-sandbox-2
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: mono-observe
      description: Read access for mono leaf apps in Beijing sandbox 2.
      groups:
        - mono-release-groups/mono-beijing-sandbox-2-release
        - mono-release-groups/mono-beijing-sandbox-2-readonly
      policies:
        - p, proj:beijing-sandbox-2:mono-observe, applications, get, beijing-sandbox-2/*, allow
        - p, proj:beijing-sandbox-2:mono-observe, projects, get, beijing-sandbox-2, allow
    - name: mono-logs
      description: Log access for mono leaf apps in Beijing sandbox 2.
      groups:
        - mono-release-groups/mono-beijing-sandbox-2-release
        - mono-release-groups/mono-beijing-sandbox-2-readonly
      policies:
        - p, proj:beijing-sandbox-2:mono-logs, logs, get, beijing-sandbox-2/*, allow
    - name: mono-sync
      description: Sync access for mono leaf apps in Beijing sandbox 2.
      groups:
        - mono-release-groups/mono-beijing-sandbox-2-release
      policies:
        - p, proj:beijing-sandbox-2:mono-sync, applications, sync, beijing-sandbox-2/*, allow
