apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: beijing-llmgateway
  namespace: argocd
spec:
  description: GitOps project for the Beijing LLMGateway integration cluster.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: llmgateway
      name: beijing-llmgateway
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: mono-observe
      description: Read access for Beijing LLMGateway apps.
      policies:
        - p, proj:beijing-llmgateway:mono-observe, applications, get, beijing-llmgateway/*, allow
    - name: mono-logs
      description: Log access for Beijing LLMGateway apps.
      policies:
        - p, proj:beijing-llmgateway:mono-logs, logs, get, beijing-llmgateway/*, allow
    - name: mono-sync
      description: Sync access for Beijing LLMGateway apps.
      policies:
        - p, proj:beijing-llmgateway:mono-sync, applications, sync, beijing-llmgateway/*, allow
