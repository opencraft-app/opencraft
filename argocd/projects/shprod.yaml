apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shprod
  namespace: argocd
spec:
  description: GitOps project for Shanghai production environment.
  sourceRepos:
    - https://code.lightclaw.tech/root/mono.git
  destinations:
    - namespace: '*'
      server: https://lb-gc8vs2zx-b5g21pfnmuajzy6x.clb.sh-tencentclb.com:443
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
  roles:
    - name: mono-observe
      description: Read access for mono leaf apps in Shanghai production.
      groups:
        - mono-release-groups/mono-shprod-release
        - mono-release-groups/mono-shprod-readonly
      policies:
        - p, proj:shprod:mono-observe, applications, get, shprod/*, allow
        - p, proj:shprod:mono-observe, projects, get, shprod, allow
    - name: mono-logs
      description: Log access for mono leaf apps in Shanghai production.
      groups:
        - mono-release-groups/mono-shprod-release
        - mono-release-groups/mono-shprod-readonly
      policies:
        - p, proj:shprod:mono-logs, logs, get, shprod/*, allow
    - name: mono-sync
      description: Sync access for mono leaf apps in Shanghai production.
      groups:
        - mono-release-groups/mono-shprod-release
      policies:
        - p, proj:shprod:mono-sync, applications, sync, shprod/*, allow
