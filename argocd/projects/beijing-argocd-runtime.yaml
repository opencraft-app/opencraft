apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: beijing-argocd-runtime
  namespace: argocd
spec:
  description: Runtime patch boundary for the Beijing Argo CD control plane.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: argocd
      server: https://kubernetes.default.svc
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: apps
      kind: Deployment
