apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: shprod-site-gateway
  namespace: argocd
spec:
  description: Authenticated static website gateway for Shanghai production.
  sourceRepos:
    - git@git.woa.com:wisp/mono2.git
  destinations:
    - namespace: ctl
      name: shprod
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
  namespaceResourceWhitelist:
    - group: '*'
      kind: '*'
