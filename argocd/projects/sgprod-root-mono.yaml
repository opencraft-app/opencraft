apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: sgprod-root-mono
  namespace: argocd
spec:
  description: Historical root app boundary for Singapore production.
  sourceRepos:
    - ssh://git@git.woa.com:443/wisp/mono2.git
  destinations:
