.gitops_db_job:
  stage: db-job
  image: python:3.11-alpine
  tags:
    - hk
    - tke
    - gitops
  before_script:
    - apk add --no-cache bash curl jq kubectl
  script:
    - test -n "${DB_JOB_SERVICE}"
    - test -n "${DB_JOB_ENV}"
    - test -n "${DB_JOB_OPERATION}"
    - test -n "${DB_JOB_REVISION}"
    - test -n "${DB_JOB_KUBECONFIG_B64}"
    - mkdir -p .tmp
    - |
      set -eu
      if [ -n "${DB_JOB_IMAGE_OVERRIDE:-}" ]; then
        python3 scripts/run_gitops_db_job.py \
          --service "${DB_JOB_SERVICE}" \
          --env "${DB_JOB_ENV}" \
          --operation "${DB_JOB_OPERATION}" \
          --revision "${DB_JOB_REVISION}" \
          --image-override "${DB_JOB_IMAGE_OVERRIDE}" \
          --apply \
          --wait \
          --timeout-seconds "${DB_JOB_TIMEOUT_SECONDS:-1800}" \
          --output-json .tmp/db-job-result.json
      else
        python3 scripts/run_gitops_db_job.py \
          --service "${DB_JOB_SERVICE}" \
          --env "${DB_JOB_ENV}" \
          --operation "${DB_JOB_OPERATION}" \
          --revision "${DB_JOB_REVISION}" \
          --apply \
          --wait \
          --timeout-seconds "${DB_JOB_TIMEOUT_SECONDS:-1800}" \
          --output-json .tmp/db-job-result.json
      fi
    - cat .tmp/db-job-result.json | jq .
  artifacts:
    when: always
    paths:
      - .tmp/db-job-result.json
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true" && $DB_JOB_SERVICE && $DB_JOB_ENV && $DB_JOB_OPERATION && $DB_JOB_REVISION'
      when: manual
    - when: never

gitops-db-job:
  extends: .gitops_db_job
  allow_failure: false
  environment:
    name: db-job/$DB_JOB_ENV
