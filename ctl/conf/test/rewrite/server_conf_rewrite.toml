# CTL 测试环境覆盖配置
# 此文件覆盖 common/server_conf.toml 中的同名字段
# 密码加密方法：cd ctl && go test -v -test.run=TestCipherEncrypt ./pkg/util/ -args <明文密码>

[api]
enable_inner_sign = false

[api.instance]
default_template_id = "pool-c3"
default_sku_id = "sku-hermes-4c8g"
candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

[db]
host = "${CTL_TEST_MYSQL_HOST}"
port = 3306
user = "root"
password = "${CTL_TEST_DB_PASSWORD_ENC}"
database = "ctl"
rw_timeout_seconds = 10

[redis]
host = "${CTL_TEST_REDIS_HOST}"
pass = "${CTL_TEST_REDIS_PASSWORD_ENC}"
port = 6379
connect_timeout_seconds = 5
rw_timeout_seconds = 5
mq_rw_timeout_seconds = 300
pool_size = 16

[mq]
stream_key = "ctl"
group_name = "ctl_service"
max_len = 100000

[monitor.api]
enable_pprof = true
port = 9591

[monitor.service]
enable_pprof = true
port = 9592

[monitor.bypass]
enable_pprof = false
port = 9593

[adapter.sandbox]
baseUrl = "http://sandbox-api.sandbox.svc.cluster.local"
processBaseUrl = "http://ingressproxy-router.sandbox.svc.cluster.local"
apiKey = ""
timeout = 60
maxRetries = 3
retryInterval = 1000

# 测试环境不可用的 adapter，设置 use_mock = true
[adapter.lightpro]
use_mock = true

[adapter.sts]
use_mock = true

[adapter.shadow]
base_url = "http://shadow-api.shadow.svc.cluster.local"
token = "${CTL_TEST_SHADOW_TOKEN}"
timeout = 10
enabled = false

[log.api]
enable_color = false

[log.service]
enable_color = false

[log.bypass]
enable_color = false

[translate]
dir = "/usr/local/lightglobal/i18n"

[tracing]
protocol = ""
async = false
grpc_endpoint = ""
http_endpoint = ""
tenant_id = "default"
service_namespace = "test"

[misc]
region = "${CTL_TEST_REGION}"
object_id_password_suffix = "test_env"
apps_data_dir = "/data/lightglobal/apps"
block_bypass_and_service = false
use_random_machine_id = true
account_area = "0"

[global_quota]
valid_modify_resource_names = ["OPENCLAW_INSTANCE"]

[global_quota.resource_default_quotas]
OPENCLAW_INSTANCE = 5
