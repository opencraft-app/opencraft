#配置名称：redis
#配置含义：redis相关配置
#配置项结构与含义：
#host = "" # redis host
#pass = "" # redis password，需要加密,需要加密
#port = 6379 # redis port
#connect_timeout_seconds = 3 # 连接超时
#rw_timeout_seconds = 3 # 读写超时
#mq_rw_timeout_seconds = 300 # 用stream做mq的读写超时
#pool_size = 256 # 连接池大小
#pool_keepalive_interval_seconds = 10 # 连接探活间隔，避免连接断开
#pool_client_max_idle_seconds = 30 # 连接最大空闲时间，超时释放连接
[redis]
host = ""
pass = ""
port = 6379
connect_timeout_seconds = 3
rw_timeout_seconds = 3
mq_rw_timeout_seconds = 300
pool_size = 256
pool_keepalive_interval_seconds = 10
pool_client_max_idle_seconds = 30

#配置名称：mq
#配置含义：mq相关配置
#配置项结构与含义：
#stream_key = "lightglobal" # stream key
#group_name = "lightglobal_service" # steam group name
#max_len = 100000 # stream最大长度
[mq]
stream_key = "lightglobal"
group_name = "lightglobal_service"
max_len = 100000

