# 配置中用到的加密方法：pkg/util/cipher_test.go

#配置名称：api
#配置含义：对外提供的api相关配置
#配置项结构与含义：
#host = "0.0.0.0" # bind主机
#port = 9590 # bind端口
#pid_file = "lightglobal.pid" # pid文件
#shutdown_timeout = 10 # 关闭超时
#enable_inner_sign = true # 内网api是否开启签名校验，线上需要开启，开发测试时可关闭。
[api]
host = "0.0.0.0"
port = 9590
pid_file = "lightglobal.pid"
shutdown_timeout = 10
enable_inner_sign = true

[api.instance]
default_template_class_id = "openclaw-default"
default_template_id = "openclaw-default"
default_sku_id = "sku-hermes-4c8g"
soul_template_dir = "/etc/ctl/souls"

#配置名称：bypass
#配置含义：bypass相关配置
#配置项结构与含义：
#specify_names = [] # 可以指定要执行的bypass名称，留空会执行全部bypass。
[bypass]
specify_names = []

#配置名称：log
#配置含义：系统中log相关配置
#使用场景：api、service、bypass的log配置
#配置项结构与含义：
#log.xxx 如log.api 定义各个组件的log配置
#path = "/dev/stdout" # log路径
#level = 7 # log级别 https://github.com/goinbox/golog/blob/master/common.go
#async_queue_size = 0 # 异步队列长度，这个选项大于0会开启单独routine写log，写stdout时不用开启。
#bufsize = 0 # 写log时的buffer，写stdout时不用开启。
#formater = "json" # 结构化日志格式，保持json。
#enable_color = false # 日志控制台显示增加颜色，开发调试时可开启。
[log]

[log.api] # api组件log配置
path = "/dev/stdout"
level = 7
async_queue_size = 0
bufsize = 0
formater = "json"
enable_color = false

[log.service] # service组件log配置
path = "/dev/stdout"
level = 7
async_queue_size = 0
bufsize = 0
formater = "json"
enable_color = false

[log.bypass] # bypass组件log配置
path = "/dev/stdout"
level = 7
async_queue_size = 0
bufsize = 0
formater = "json"
enable_color = false

#配置名称：monitor
#配置含义：对外暴露的prometheus metric相关配置
#配置项结构与含义：
#enable_pprof = false # 是否开启pprof
#port = 9591 # metric端口
[monitor]

[monitor.api] # api组件metric配置
enable_pprof = false
port = 9591

[monitor.service] # service组件metric配置
enable_pprof = false
port = 9592

[monitor.bypass] # bypass组件metric配置
enable_pprof = false
port = 9593

#配置名称：db
