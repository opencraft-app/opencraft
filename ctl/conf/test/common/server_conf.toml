#配置名称：tracing
#配置含义：tracing相关配置
#使用场景：tracing数据上报天机阁
#配置项结构与含义：
#protocol = "grpc"  # 上报天机阁传输协议，可选grpc、http
#async = true  # 异步上报
#grpc_endpoint = "otlp.tpstelemetry.woa.com:12520"  # 天机阁grpc地址
#http_endpoint = "otlp.tpstelemetry.woa.com"  # 天机阁http地址
#tenant_id = ""  # 申请的租户id，开发测试用default(clickhouse)或public(es)、线上国内站lighthouse、国际站lighthouseoversea
#service_namespace = "Production"  # 线上固定值，开发环境可指定dev或test
[tracing]
protocol = "grpc"
async = true
grpc_endpoint = "otlp.tpstelemetry.woa.com:12520"
http_endpoint = "otlp.tpstelemetry.woa.com"
tenant_id = ""
service_namespace = "Production"

[gray] # 云原生成熟度相关灰色配置，保持即可
enable = false
start_hour = 1
run_seconds = 600
cpu_percent = 50

#配置名称：misc
#配置含义：一些单独的杂项配置
#配置项结构与含义：
#region = "" # 服务部署地域
#object_id_password_suffix = "" # 生产环境这里保持为空，其它环境一定不能为空
#apps_data_dir = "/data/lightglobal/apps" # 请求lightglobal内网api的app的相关配置文件目录
#block_bypass_and_service = false # 是否阻塞 bypass 和 service。设置为 true 会一直阻塞
#use_random_machine_id = false # 使用随机的机器 ID。主要用于灾备地域启动时，防止初始化 machineID 需要写库，导致启动失败
#account_area = "0" # 账户区域，lightglobal分国内站和国际站部署，分别服务国内站和国际站的用户，国内站的部署区域为0，国际站的部署区域为1
[misc]
region = ""
object_id_password_suffix = "" # 生产环境这里保持为空
apps_data_dir = "/data/lightglobal/apps"
block_bypass_and_service = false
use_random_machine_id = false
account_area = "0"
