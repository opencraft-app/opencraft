#配置名称：global_quota
#配置含义：全局配额配置
#配置项结构与含义
#valid_modify_resource_names # 允许修改配额的资源名称列表
#resource_default_quotas = {} # 使用全局配额的资源名称与配额数值的映射，比如 BUDGET_BUNDLE_INSTANCE = 1
[global_quota]
