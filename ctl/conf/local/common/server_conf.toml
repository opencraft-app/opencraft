# ctl 本地调试配置 - 连接 sandbox 测试集群
# 启动: go run ./main/api -conf-dir ./conf/local

[api]
host = "0.0.0.0"
port = 9590
pid_file = "/tmp/lightglobal-local.pid"
shutdown_timeout = 10
enable_inner_sign = false

[api.instance]
default_template_id = "pool-c0"
candidate_template_ids = ["pool-c0", "pool-bj8", "pool-c2"]
create_pool_max_attempts = 2
soul_template_dir = "../../assets/souls"
churn_guard_enabled = true
churn_window_seconds = 600
churn_create_threshold = 3
churn_destroy_threshold = 2
pressure_snapshot_refresh_seconds = 5
pressure_snapshot_ttl_seconds = 15
pressure_clean_ratio_threshold = 0.25
pressure_min_clean_floor = 2

[bypass]
specify_names = []

[log]

[log.api]
path = "/dev/stdout"
level = 7
async_queue_size = 0
bufsize = 0
formater = "json"
enable_color = true

[log.service]
path = "/dev/stdout"
level = 7
async_queue_size = 0
bufsize = 0
formater = "json"
enable_color = true

[log.bypass]
path = "/dev/stdout"
level = 7
async_queue_size = 0
bufsize = 0
formater = "json"
enable_color = true

[monitor]

[monitor.api]
enable_pprof = true
port = 9591

[monitor.service]
enable_pprof = true
port = 9592

[monitor.bypass]
enable_pprof = false
port = 9593

# ctl 独立的本地 MySQL (docker-compose, 端口映射 13306)
# 密码经过 util.EncryptString 加密: go test -v -test.run=TestCipherEncrypt ./pkg/util/ -args <password>
[db]
host = "127.0.0.1"
port = 13306
user = "root"
password = "${CTL_LOCAL_DB_PASSWORD_ENC}"
database = "ctl"
rw_timeout_seconds = 10

# ctl 独立的本地 Redis (docker-compose, 端口映射 16379)
[redis]
host = "127.0.0.1"
pass = "${CTL_LOCAL_REDIS_PASSWORD_ENC}"
port = 16379
connect_timeout_seconds = 5
rw_timeout_seconds = 5
mq_rw_timeout_seconds = 300
pool_size = 16
pool_keepalive_interval_seconds = 10
pool_client_max_idle_seconds = 30

[mq]
stream_key = "lightglobal"
group_name = "lightglobal_service"
max_len = 100000

[adapter]

[adapter.sandbox]
# sandbox-api 公网 CLB 地址
baseUrl = "http://lb-a8iar6q7-6v49t2ofpg7zwed8.clb.bj-tencentclb.com"
apiKey = ""
timeout = 60
maxRetries = 3
retryInterval = 1000

[adapter.aigateway]
base_url = ""
admin_token = ""
internal_service_token = ""
timeout = 10
default_base_url = ""
default_model_id = ""
default_compatibility = "openai"
default_gateway_port = 18789
default_provider_id = ""

[adapter.lightpro]
api_static_url = ""
api_dynamic_url_suffix = "api.lightpro.polaris:9580"
use_mock = false
describe_mcp_servers_timeout_seconds = 10

[adapter.lighthouse]
api_static_url = ""
api_dynamic_url_suffix = "api.lighthouse.polaris:9570"
tcloud_url = ""

[adapter.sts]
url = "https://sts.tencentcloudapi.com"
internal_url = ""
use_mock = false

[adapter.dnspod]
url = ""

[adapter.domain]
inner_url = ""
inner_ip = ""
inner_secret_id = ""
inner_secret_key = ""

[adapter.shadow]
base_url = "http://127.0.0.1:18080"
token = "local-dev-token"
timeout = 5

[adapter.clouddc]
url = "https://clouddc.tencentcloudapi.com"
internal_url = "https://clouddc.ap-guangzhou.tencentcloudapi.woa.com"

[adapter.whitelist]
url = ""
hostname = ""

[service_role]

[service_role.dns_ssl]
role_name = "Lighthouse_QCSLinkedRoleInDnsAndSsl"
secret_id = ""
secret_key = ""
credential_duration_seconds = 7200
cache_seconds = 7000
expect_cache_version = "first"

[service_role.basic]
role_name = "Lighthouse_QCSLinkedRoleInBasic"
secret_id = ""
secret_key = ""
credential_duration_seconds = 7200
cache_seconds = 7000
expect_cache_version = "first"

[service_account]

[service_account.base]
secret_id = ""
secret_key = ""

[service_account.lighthouse]
secret_id = ""
secret_key = ""
credential_duration_seconds = 7200
cache_seconds = 7000
expect_cache_version = "first"

[translate]
dir = ""

[tracing]
protocol = "grpc"
async = false
grpc_endpoint = "otlp.tpstelemetry.woa.com:12520"
http_endpoint = "otlp.tpstelemetry.woa.com"
tenant_id = "default"
service_namespace = "dev"

[gray]
enable = false
start_hour = 1
run_seconds = 600
cpu_percent = 50

[misc]
region = "ap-beijing"
object_id_password_suffix = "local_dev"
apps_data_dir = "/tmp/lightglobal/apps"
block_bypass_and_service = false
use_random_machine_id = true
account_area = "0"

[global_quota]
valid_modify_resource_names = ["OPENCLAW_INSTANCE"]

[global_quota.resource_default_quotas]
