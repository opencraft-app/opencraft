apiVersion: v1
kind: Namespace
metadata:
  name: ctl
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ctl
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: batch/v1
kind: Job
metadata:
  name: REPLACE_CTL_MIGRATION_JOB_NAME
  namespace: ctl
  labels:
    app: ctl-migrate
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: ctl-migrate
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      restartPolicy: OnFailure
      nodeSelector:
        pool: REPLACE_CTL_NODE_POOL
      initContainers:
        - name: mysql-init
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_HOST
              value: REPLACE_CTL_TEST_MYSQL_HOST
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_ROOT_USER
              value: "root"
            - name: CTL_DB
              value: "ctl"
          envFrom:
            - secretRef:
                name: ctl-migrate-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_ROOT_USER}" \
                --password="${MYSQL_ROOT_PASSWORD}" <<SQL
              CREATE DATABASE IF NOT EXISTS \`${CTL_DB}\` CHARACTER SET utf8mb4 COLLATE utf8mb4_general_ci;
              FLUSH PRIVILEGES;
              SQL
      containers:
        - name: migrate
          image: migrate/migrate:v4.18.3
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: ctl-migrate-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              migrate -path=/migrations -database "${CTL_MIGRATE_DSN}" up
          volumeMounts:
            - name: migrations
              mountPath: /migrations
      volumes:
        - name: migrations
          configMap:
            name: ctl-migrations-runtime
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ctl-api
  namespace: ctl
  labels:
    app: ctl-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ctl-api
  template:
    metadata:
      labels:
        app: ctl-api
      annotations:
        ctl.clawhub.dev/redeploy-at: REPLACE_CTL_DEPLOYED_AT
    spec:
      nodeSelector:
        pool: REPLACE_CTL_NODE_POOL
      containers:
        - name: api
          image: REPLACE_CTL_IMAGE
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: ctl-runtime-secrets
          env:
            - name: SHADOW_ACCOUNT_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: ctl-platform-values
                  key: SHADOW_ACCOUNT_ENABLED
                  optional: true
            - name: SHADOW_BINDING_REQUIRED
              valueFrom:
                configMapKeyRef:
                  name: ctl-platform-values
                  key: SHADOW_BINDING_REQUIRED
                  optional: true
            - name: LIGHTVELA_SITE_KIND
              valueFrom:
                configMapKeyRef:
                  name: ctl-platform-values
                  key: LIGHTVELA_SITE_KIND
                  optional: true
            - name: SHADOW_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: ctl-platform-values
                  key: SHADOW_BASE_URL
                  optional: true
          command: ["/usr/local/lightglobal/bin/api"]
          args: ["-conf-dir", "/etc/ctl/conf"]
          ports:
            - name: http
              containerPort: 9590
            - name: metrics
              containerPort: 9591
          volumeMounts:
            - name: ctl-conf-common
              mountPath: /etc/ctl/conf/common/server_conf.toml
              subPath: server_conf.toml
              readOnly: true
            - name: ctl-conf-rewrite
              mountPath: /etc/ctl/conf/rewrite/server_conf_rewrite.toml
              subPath: server_conf_rewrite.toml
              readOnly: true
            - name: ctl-soul-templates
              mountPath: /etc/ctl/souls
              readOnly: true
            - name: apps-data
              mountPath: /data/lightglobal/apps
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
      volumes:
        - name: ctl-conf-common
          configMap:
            name: ctl-conf-common
        - name: ctl-conf-rewrite
          configMap:
            name: ctl-conf-rewrite
        - name: ctl-soul-templates
          configMap:
            name: ctl-soul-templates
        - name: apps-data
          emptyDir: {}
---
