---
apiVersion: v1
kind: Service
metadata:
  name: ctl-api
  namespace: ctl
  labels:
    app: ctl-api
    metrics-target: "true"
spec:
  selector:
    app: ctl-api
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: metrics
      port: 9591
      targetPort: metrics
---
apiVersion: v1
kind: Service
metadata:
  name: ctl-api-internal
  namespace: ctl
  annotations:
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: REPLACE_CTL_INTERNAL_SUBNET_ID
  labels:
    app: ctl-api
spec:
  type: LoadBalancer
  selector:
    app: ctl-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ctl-service-metrics
  namespace: ctl
  labels:
    app: ctl-service
    metrics-target: "true"
spec:
