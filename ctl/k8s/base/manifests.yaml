---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ctl-workloads
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames:
      - ctl
  selector:
    matchLabels:
      metrics-target: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
