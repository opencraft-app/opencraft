---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ctl-api
  namespace: ctl
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ctl-api
  minReplicas: 1
  maxReplicas: 5
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ctl-service
  namespace: ctl
spec:
