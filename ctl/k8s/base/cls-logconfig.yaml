apiVersion: cls.cloud.tencent.com/v1
kind: LogConfig
metadata:
  name: ctl-runtime
spec:
  clsDetail:
    topicId: REPLACE_CTL_CLS_TOPIC_ID
    logType: json_log
  inputDetail:
    type: container_stdout
    containerStdout:
      workloads:
        - namespace: ctl
          name: ctl-api
          kind: deployment
          container: api
        - namespace: ctl
          name: ctl-service
          kind: deployment
          container: service
        - namespace: ctl
          name: ctl-bypass
          kind: deployment
          container: bypass
