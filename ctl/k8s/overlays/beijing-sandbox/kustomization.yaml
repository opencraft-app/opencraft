apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - path: delete-migration-job.yaml

replacements:
  - source:
      kind: ConfigMap
      name: ctl-platform-values
      fieldPath: data.CTL_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: ctl-api
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ctl-service
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ctl-bypass
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: ctl-platform-values
      fieldPath: data.CTL_IMAGE
    targets:
      - select:
          kind: Deployment
          name: ctl-api
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: ctl-service
        fieldPaths:
          - spec.template.spec.containers.0.image
      - select:
          kind: Deployment
          name: ctl-bypass
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: ctl-platform-values
      fieldPath: data.CTL_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: ctl-api
        fieldPaths:
          - spec.template.metadata.annotations.[ctl.clawhub.dev/redeploy-at]
      - select:
          kind: Deployment
          name: ctl-service
        fieldPaths:
          - spec.template.metadata.annotations.[ctl.clawhub.dev/redeploy-at]
      - select:
          kind: Deployment
          name: ctl-bypass
        fieldPaths:
          - spec.template.metadata.annotations.[ctl.clawhub.dev/redeploy-at]
  - source:
      kind: ConfigMap
      name: ctl-platform-values
      fieldPath: data.CTL_INTERNAL_SUBNET_ID
    targets:
      - select:
          kind: Service
          name: ctl-api-internal
        fieldPaths:
          - metadata.annotations.[service.kubernetes.io/qcloud-loadbalancer-internal-subnetid]
  - source:
      kind: ConfigMap
      name: ctl-platform-values
      fieldPath: data.CTL_CLS_TOPIC_ID
    targets:
      - select:
          kind: LogConfig
          name: ctl-runtime
        fieldPaths:
          - spec.clsDetail.topicId
  - source:
      kind: ConfigMap
      name: ctl-platform-values
      fieldPath: data.CTL_TEST_MYSQL_HOST
    targets:
      - select:
          kind: Job
          name: REPLACE_CTL_MIGRATION_JOB_NAME
        fieldPaths:
          - spec.template.spec.initContainers.0.env.0.value
