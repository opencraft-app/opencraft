[api]
enable_inner_sign = false

[api.instance]
default_template_id = "pool-c3"
candidate_template_ids = ["pool-c0", "pool-c1", "pool-c2", "pool-c3", "pool-c4", "pool-c5"]

[db]
host = "10.15.224.4"
port = 3306
user = "root"
password = "REPLACE_WITH_ENCRYPTED_MYSQL_PASSWORD"
database = "ctl"
rw_timeout_seconds = 10

[redis]
host = "10.15.224.15"
port = 6379
pass = "REPLACE_WITH_ENCRYPTED_REDIS_PASSWORD"
connect_timeout_seconds = 5
rw_timeout_seconds = 5
mq_rw_timeout_seconds = 300
pool_size = 64
pool_keepalive_interval_seconds = 10
pool_client_max_idle_seconds = 30

[adapter.sandbox]
baseUrl = "http://sandbox-api.sandbox.svc.cluster.local"
apiKey = ""
timeout = 60
maxRetries = 3
retryInterval = 1000

[adapter.shadow]
base_url = "http://shadow-api.shadow.svc.cluster.local"
token = ""
timeout = 10

[tracing]
tenant_id = "default"
service_namespace = "dev"

[misc]
region = "ap-beijing"
object_id_password_suffix = "lightclaw-ctl"
apps_data_dir = "/data/lightglobal/apps"
use_random_machine_id = true
