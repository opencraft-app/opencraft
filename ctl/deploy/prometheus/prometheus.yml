# Prometheus 配置文件
# 用于独立验证 ctl 三服务 metrics；测试环境请以托管 Prometheus 配置为准。

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: 'openclaw-api'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['host.docker.internal:9591']

  - job_name: 'openclaw-service'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['host.docker.internal:9592']

  - job_name: 'openclaw-bypass'
    metrics_path: '/metrics'
    scheme: 'http'
    static_configs:
      - targets: ['host.docker.internal:9593']
