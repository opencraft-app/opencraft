apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chatserver-computer-update
  namespace: dep
  labels:
    app.kubernetes.io/name: chatserver-computer-update
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: chatserver-computer-update
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - ipBlock:
            cidr: 192.0.2.0/32
      ports:
        - protocol: TCP
          port: 8090
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
