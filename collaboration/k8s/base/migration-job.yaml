apiVersion: batch/v1
kind: Job
metadata:
  name: collaboration-migrate-template
  namespace: lightvela-collaboration
  labels:
    app.kubernetes.io/name: collaboration
    app.kubernetes.io/component: migration
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collaboration
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: migration
          image: REPLACE_COLLABORATION_IMAGE
          imagePullPolicy: IfNotPresent
          args:
            - database
            - migrate
            - --database-driver
            - tdsql
            - --database-dsn-file
            - /var/run/secrets/collaboration/database.dsn
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/collaboration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: collaboration-runtime-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {}

