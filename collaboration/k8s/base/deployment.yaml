apiVersion: apps/v1
kind: Deployment
metadata:
  name: collaboration
  namespace: lightvela-collaboration
  labels:
    app.kubernetes.io/name: collaboration
    app.kubernetes.io/component: control-plane
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: collaboration
  template:
    metadata:
      labels:
        app.kubernetes.io/name: collaboration
        app.kubernetes.io/component: control-plane
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      containers:
        - name: collaboration
          image: REPLACE_COLLABORATION_IMAGE
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - --collaboration-only
            - --database-driver
            - mysql
            - --database-dsn-file
            - /var/run/secrets/collaboration/database.dsn
            - --database-auto-migrate=false
            - --listen
            - 0.0.0.0:8080
            - --jwt-key-file
            - /var/run/secrets/collaboration/jwt.key
            - --lightvela-gateway-token-file
            - /var/run/secrets/collaboration/gateway.token
            - --im-sdk-app-id
            - REPLACE_TENCENT_IM_SDK_APP_ID
            - --im-admin-user-id
            - REPLACE_TENCENT_IM_ADMIN_USER_ID
            - --im-secret-key-file
            - /var/run/secrets/collaboration/im-secret.key
            - --im-identity-key-file
            - /var/run/secrets/collaboration/im-identity.key
            - --im-callback-token-file
            - /var/run/secrets/collaboration/im-callback.token
            - --cors-origin
            - https://chat.lightvela.com
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: secrets
              mountPath: /var/run/secrets/collaboration
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: secrets
          secret:
            secretName: collaboration-runtime-secrets
            defaultMode: 0440
        - name: tmp
          emptyDir: {}
