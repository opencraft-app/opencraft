{
  "id": "collaboration",
  "name": "LightVela Collaboration 控制面",
  "kind": "service",
  "path": "collaboration",
  "owner": "wisp/mono2-maintainers",
  "lifecycle": "experimental",
  "domains": ["identity-access", "agent-gateway-runtime"],
  "summary": "维护 Server、Member、Channel、Task、Reminder、IM 资源映射与托管 Computer 绑定。",
  "runtime": "Go HTTP API + Worker",
  "interfaces": ["OpenAPI HTTP", "Tencent IM REST", "Runtime API"],
  "dependencies": ["service-gateway", "user-auth", "ctl", "Tencent Cloud IM"],
  "source_docs": ["collaboration/README.md", "collaboration/AGENTS.md", "collaboration/platform/v1/README.md"],
  "agent_entry": "collaboration/AGENTS.md",
  "service_docs": "collaboration/docs/README.md",
  "deploy": ["collaboration/deploy/k8s"],
  "generated_paths": ["collaboration/internal/ent", "collaboration/internal/api/openapi"]
}
