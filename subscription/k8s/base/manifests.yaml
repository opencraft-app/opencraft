apiVersion: v1
kind: Namespace
metadata:
  name: user-auth
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: user-auth
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: subscription-config
  namespace: user-auth
data:
  SUBSCRIPTION_ADDR: ":8086"
  SUBSCRIPTION_ALLOWED_ORIGINS: "REPLACE_SUBSCRIPTION_ALLOWED_ORIGINS"
  PAYMENT_INTERNAL_BASE_URL: "http://payment.user-auth.svc.cluster.local"
  AI_GATEWAY_BASE_URL: "REPLACE_SUBSCRIPTION_AI_GATEWAY_BASE_URL"
  SUBSCRIPTION_FREE_PLAN_ID: "REPLACE_SUBSCRIPTION_FREE_PLAN_ID"
  SUBSCRIPTION_LITE_PLAN_ID: "REPLACE_SUBSCRIPTION_LITE_PLAN_ID"
  SUBSCRIPTION_PRO_PLAN_ID: "REPLACE_SUBSCRIPTION_PRO_PLAN_ID"
  MYSQL_HOST: "REPLACE_SUBSCRIPTION_MYSQL_HOST"
  MYSQL_PORT: "REPLACE_SUBSCRIPTION_MYSQL_PORT"
  MYSQL_ROOT_USER: "root"
  SUBSCRIPTION_DB: "lightclaw_subscription"
  SUBSCRIPTION_DB_USER: "lightclaw_subscription"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription
  namespace: user-auth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: subscription
  template:
    metadata:
      labels:
        app: subscription
      annotations:
        subscription.clawhub.dev/redeploy-at: "REPLACE_SUBSCRIPTION_DEPLOYED_AT"
    spec:
      nodeSelector:
        pool: REPLACE_SUBSCRIPTION_NODE_POOL
      initContainers:
        - name: wait-db-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: subscription-config
            - secretRef:
                name: subscription-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${SUBSCRIPTION_DB_USER}" \
                --password="${SUBSCRIPTION_DB_PASSWORD}" \
                -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='${SUBSCRIPTION_DB}' AND TABLE_NAME IN ('subscriptions','subscription_events','subscription_plans')" | grep -qx '3'; do
                echo "waiting for subscription schema"
                sleep 3
              done
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: subscription
      containers:
        - name: subscription
          image: REPLACE_SUBSCRIPTION_IMAGE
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: subscription-config
            - secretRef:
                name: subscription-runtime-secrets
          ports:
            - name: http
              containerPort: 8086
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: subscription
  namespace: user-auth
spec:
  selector:
    app: subscription
  ports:
    - name: http
      port: 80
      targetPort: http
