# Vela IM test environment (yuehuali.devcloud.woa.com root). dsh-voice-proxy forwards "/" here.
worker_processes 1;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  # API timings for diagnosing slow requests: path only (no query string, no headers), so no tokens are written.
  log_format timing '$time_iso8601 $status $request_method $uri rt=$request_time upstream=$upstream_response_time';
  server_tokens off;
  map $http_upgrade $connection_upgrade { default upgrade; "" close; }
  upstream lightvela_api { server api.lightvela.com:443; keepalive 8; }
  server {
    listen 127.0.0.1:13090;
    root /srv/vela-web;
    index index.html;
    client_max_body_size 24m;

    # Collaboration (Vela IM) through the dev gateway; ^~ keeps the LightVela /v1 regex below from taking it.
    location ^~ /v1/collaboration/ {
      proxy_pass http://127.0.0.1:18786;
      access_log /dev/stdout timing;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 120s;
    }

    # gateway-dashboard admin console (install-admin.sh); only its 「IM 群聊」 page works on the dev machine.
    location ^~ /admin/gateway/ {
      proxy_pass http://127.0.0.1:13000;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 120s;
    }

    # LightVela API (same paths the frontend dev server rewrites in local-proxy mode); static pages win first.
    location ~ ^/(auth|subscriptions|support/feedback|v1|api/worker-actions)(/|$) {
      try_files $uri $uri/index.html @lightvela;
    }
    location @lightvela {
      proxy_pass https://lightvela_api;
      access_log /dev/stdout timing;
      proxy_http_version 1.1;
      proxy_set_header Host api.lightvela.com;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_ssl_server_name on;
      proxy_ssl_name api.lightvela.com;
      proxy_buffering off;
      proxy_read_timeout 300s;
      proxy_cookie_domain ~.* $host;
    }

    location /_next/static/ { expires 30d; add_header Cache-Control "public, immutable"; try_files $uri =404; }
    location / { try_files $uri $uri/index.html $uri.html /404.html; }
  }
}
