x-log-volume: &log_volume
  volumes:
    - ./logs:/logs

x-run-as-root: &run_as_root
  user: "0:0"

x-worker-env: &worker_env
  # Used by Tencent provider to verify private instance health via ingressproxy IP-backdoor.
  INGRESSPROXY_BASE_URL: "http://21.255.92.10:16167"

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${SANDBOX_REDIS_PASSWORD:?set in /root/code/mono/.secret/sandbox/local.env}"]
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - ../.secret/sandbox/local.env
    environment:
      REDIS_ADDR: 21.255.92.20:16312
      REDIS_PASSWORD: ${SANDBOX_REDIS_PASSWORD:?set in /root/code/mono/.secret/sandbox/local.env}
      REDIS_DB: "0"
      REDIS_ROUTE_PREFIX: "route:sandbox:"
      <<: *worker_env
      LOG_FILE: "/logs/server.log"
    ports:
      - "8080:8080"
    <<: [*log_volume, *run_as_root]

  worker-0:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - ../.secret/sandbox/local.env
    environment:
      <<: *worker_env
      LOG_FILE: "/logs/worker-0.log"
    command: ["worker", "-refill-interval", "5s", "-cleanup-interval", "30s", "-shard-total", "8", "-shard-index", "0"]
    depends_on:
      - api
    <<: [*log_volume, *run_as_root]

  worker-1:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file:
      - ../.secret/sandbox/local.env
    environment:
      <<: *worker_env
