apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-db-reconcile
  namespace: sandbox
spec:
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-reconcile
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --password="${MYSQL_PASSWORD}" <<'SQL'
              USE `cvm`;
              SELECT id, pool_id, state, cloud_id, address, created_at, updated_at
              FROM instances
              WHERE pool_id = 'pool-bj8'
              ORDER BY created_at DESC;

              DELETE FROM instances
              WHERE pool_id = 'pool-bj8'
                AND state IN ('CREATING', 'FAILED')
                AND (cloud_id IS NULL OR cloud_id = '');

              SELECT id, pool_id, state, cloud_id, address, created_at, updated_at
              FROM instances
              WHERE pool_id = 'pool-bj8'
              ORDER BY created_at DESC;
              SQL
