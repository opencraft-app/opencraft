apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingressproxy-router
  namespace: sandbox
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: ingressproxy-router
  template:
    metadata:
      labels:
        app: ingressproxy-router
    spec:
      terminationGracePeriodSeconds: 1860
      nodeSelector:
        pool: REPLACE_SANDBOX_NODE_POOL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: ingressproxy-router
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: ingressproxy-router
      containers:
        - name: ingressproxy-router
          image: REPLACE_REGISTRY_SERVER/lightclaw/sandbox-ingressproxy-router:bj8-20260401-ingressproxy-health-1
          imagePullPolicy: Always
          env:
            - name: PROXY_ADDR
              value: ":8084"
            - name: PROXY_METRICS_ADDR
              value: ":9094"
            - name: PROXY_ENABLE_IP_BACKDOOR
              value: "true"
            - name: INGRESSPROXY_SHARD_COUNT
              value: "4"
            - name: INGRESSPROXY_SHARD_SERVICE_TEMPLATE
              value: "http://ingressproxy-g%d.sandbox.svc.cluster.local"
          ports:
            - name: http
              containerPort: 8084
            - name: metrics
              containerPort: 9094
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - wget -qO- http://127.0.0.1:8084/drain >/dev/null 2>&1 || true; sleep 15
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingressproxy-router
  namespace: sandbox
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ingressproxy-router
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingressproxy-router
  namespace: sandbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ingressproxy-router
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: v1
kind: Service
metadata:
  name: ingressproxy-router
  namespace: sandbox
spec:
  selector:
    app: ingressproxy-router
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: ingressproxy-router-ingress
  namespace: sandbox
spec:
  type: NodePort
  selector:
    app: ingressproxy-router
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sandbox-ingressproxy-public
  namespace: sandbox
  annotations:
    kubernetes.io/ingress.class: qcloud
    ingress.cloud.tencent.com/modification-protection: "false"
    ingress.cloud.tencent.com/tke-service-config: sandbox-ingressproxy-public-config
    ingress.cloud.tencent.com/direct-access: "true"
spec:
  ingressClassName: qcloud
  tls:
    - hosts:
        - REPLACE_SANDBOX_INGRESSPROXY_PUBLIC_HOST
      secretName: REPLACE_SANDBOX_INGRESSPROXY_TLS_SECRET_NAME
  rules:
    - host: REPLACE_SANDBOX_INGRESSPROXY_PUBLIC_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ingressproxy-router-ingress
                port:
                  number: 80
---
apiVersion: cloud.tencent.com/v1alpha1
kind: TkeServiceConfig
metadata:
  name: sandbox-ingressproxy-public-config
  namespace: sandbox
spec:
  loadBalancer:
    l7Listeners:
      - protocol: HTTP
        port: 80
        domains:
          - domain: REPLACE_SANDBOX_INGRESSPROXY_PUBLIC_HOST
            rules:
              - url: /
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /health
                  httpCheckDomain: REPLACE_SANDBOX_INGRESSPROXY_HEALTHCHECK_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
      - protocol: HTTPS
        port: 443
        defaultServer: REPLACE_SANDBOX_INGRESSPROXY_PUBLIC_HOST
        domains:
          - domain: REPLACE_SANDBOX_INGRESSPROXY_PUBLIC_HOST
            rules:
              - url: /
                forwardType: HTTP
                healthCheck:
                  enable: true
                  intervalTime: 10
                  timeout: 5
                  healthNum: 2
                  unHealthNum: 2
                  httpCheckPath: /health
                  httpCheckDomain: REPLACE_SANDBOX_INGRESSPROXY_HEALTHCHECK_HOST
                  httpCheckMethod: HEAD
                  httpCode: 2
---
