apiVersion: v1
kind: Namespace
metadata:
  name: sandbox
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: sandbox
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sandbox-runtime-config
  namespace: sandbox
data:
  CLOUD_PROVIDER: tencent
  API_ADDR: ":8080"
  REDIS_ADDR: "REPLACE_SANDBOX_REDIS_ADDR"
  REDIS_DB: "0"
  REDIS_ROUTE_PREFIX: "route:sandbox:"
  MYSQL_HOST: "REPLACE_SANDBOX_MYSQL_HOST"
  MYSQL_PORT: "3306"
  MYSQL_DB: cvm
  TENCENT_REGION: "REPLACE_TENCENT_REGION"
  TENCENT_CVM_ENDPOINT: cvm.internal.tencentcloudapi.com
  TENCENT_INSTANCE_TYPE: SA5.LARGE8
  TENCENT_ADDRESS_TYPE: private
  TENCENT_PUBLIC_EGRESS_MBPS: "0"
  INGRESSPROXY_BASE_URL: "http://ingressproxy-router.sandbox.svc.cluster.local"
  AUTH_SERVICE_URL: "http://lightclaw-auth.user-auth.svc.cluster.local"
  SANDBOX_VPC_ID: "REPLACE_SANDBOX_VPC_ID"
  SANDBOX_POOL_INSTANCE_TYPE: SA5.LARGE8
  SANDBOX_POOL_DESIRED_CAPACITY: "24"
  SANDBOX_POOL_BJ8_SUBNET_ID: "REPLACE_SANDBOX_POOL_BJ8_SUBNET_ID"
  SANDBOX_POOL_BJ8_ZONE: "REPLACE_SANDBOX_POOL_BJ8_ZONE"
  SANDBOX_POOL_C0_SUBNET_ID: "REPLACE_SANDBOX_POOL_C0_SUBNET_ID"
  SANDBOX_POOL_C0_ZONE: "REPLACE_SANDBOX_POOL_C0_ZONE"
  SANDBOX_POOL_C1_SUBNET_ID: "REPLACE_SANDBOX_POOL_C1_SUBNET_ID"
  SANDBOX_POOL_C1_ZONE: "REPLACE_SANDBOX_POOL_C1_ZONE"
  SANDBOX_POOL_C2_SUBNET_ID: "REPLACE_SANDBOX_POOL_C2_SUBNET_ID"
  SANDBOX_POOL_C2_ZONE: "REPLACE_SANDBOX_POOL_C2_ZONE"
  SANDBOX_POOL_C3_SUBNET_ID: "REPLACE_SANDBOX_POOL_C3_SUBNET_ID"
  SANDBOX_POOL_C3_ZONE: "REPLACE_SANDBOX_POOL_C3_ZONE"
  SANDBOX_POOL_C4_SUBNET_ID: "REPLACE_SANDBOX_POOL_C4_SUBNET_ID"
  SANDBOX_POOL_C4_ZONE: "REPLACE_SANDBOX_POOL_C4_ZONE"
  SANDBOX_POOL_C5_SUBNET_ID: "REPLACE_SANDBOX_POOL_C5_SUBNET_ID"
  SANDBOX_POOL_C5_ZONE: "REPLACE_SANDBOX_POOL_C5_ZONE"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-db-migrate-v2
  namespace: sandbox
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: REPLACE_REGISTRY_SERVER/lightclaw/sandbox-migrate:bj8-20260418-pool-sg-c0c7a32a
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              db_url="mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@tcp(${MYSQL_HOST}:${MYSQL_PORT})/${MYSQL_DB}?multiStatements=true"
              migrate -path /migrations -database "${db_url}" up
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-api
  namespace: sandbox
spec:
  replicas: 10
  selector:
    matchLabels:
      app: sandbox-api
  template:
    metadata:
      labels:
        app: sandbox-api
      annotations:
        sandbox.clawhub.dev/redeploy-at: "2026-03-25T14:45:00Z"
    spec:
      nodeSelector:
        pool: REPLACE_SANDBOX_NODE_POOL
      initContainers:
        - name: wait-db-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --password="${MYSQL_PASSWORD}" \
                -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='${MYSQL_DB}' AND TABLE_NAME IN ('pools','instances','sandboxes')" | grep -qx '3'; do
                echo "waiting for sandbox schema"
                sleep 3
              done
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sandbox-api
      containers:
        - name: api
          image: REPLACE_REGISTRY_SERVER/lightclaw/sandbox-api:bj8-20260418-pool-sg-c0c7a32a
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-api
  namespace: sandbox
  labels:
    app: sandbox-api
    metrics-target: "true"
spec:
  selector:
    app: sandbox-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: sandbox-api
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames:
      - sandbox
  selector:
    matchLabels:
      metrics-target: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-api-internal
  namespace: sandbox
  annotations:
    service.kubernetes.io/qcloud-loadbalancer-internal-subnetid: REPLACE_SANDBOX_SUPPORT_SUBNET_ID
  labels:
    app: sandbox-api
spec:
  type: LoadBalancer
  selector:
    app: sandbox-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sandbox-api
  namespace: sandbox
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sandbox-api
  minReplicas: 10
  maxReplicas: 30
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Percent
          value: 100
          periodSeconds: 60
        - type: Pods
          value: 4
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandbox-worker
  namespace: sandbox
spec:
  replicas: 0
  selector:
    matchLabels:
      app: sandbox-worker
  template:
    metadata:
      labels:
        app: sandbox-worker
      annotations:
        sandbox.clawhub.dev/redeploy-at: "2026-03-22T11:40:00Z"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: wait-db-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --password="${MYSQL_PASSWORD}" \
                -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='${MYSQL_DB}' AND TABLE_NAME IN ('pools','instances','sandboxes')" | grep -qx '3'; do
                echo "waiting for sandbox schema"
                sleep 3
              done
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: sandbox-worker
              topologyKey: kubernetes.io/hostname
      hostAliases:
        - ip: 169.254.0.95
          hostnames:
            - cvm.internal.tencentcloudapi.com
      containers:
        - name: worker
          image: REPLACE_REGISTRY_SERVER/lightclaw/sandbox-worker:bj8-20260418-pool-sg-c0c7a32a
          imagePullPolicy: Always
          command:
            - worker
          args:
            - -refill-count
            - "0"
            - -refill-concurrency
            - "1"
            - -refill-interval
            - 30s
            - -reset-concurrency
            - "1"
            - -cleanup-interval
            - 30s
            - -waterline-interval
            - 1m
            - -waterline-sample
            - "1"
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          ports:
            - name: metrics
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: sandbox-worker-sharded
  namespace: sandbox
spec:
  clusterIP: None
  selector:
    app: sandbox-worker-sharded
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sandbox-worker-sharded
  namespace: sandbox
spec:
  serviceName: sandbox-worker-sharded
  podManagementPolicy: Parallel
  replicas: 8
  selector:
    matchLabels:
      app: sandbox-worker-sharded
  template:
    metadata:
      labels:
        app: sandbox-worker-sharded
      annotations:
        sandbox.clawhub.dev/redeploy-at: "2026-03-22T11:40:00Z"
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        - name: wait-db-schema
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --password="${MYSQL_PASSWORD}" \
                -Nse "SELECT COUNT(*) FROM information_schema.TABLES WHERE TABLE_SCHEMA='${MYSQL_DB}' AND TABLE_NAME IN ('pools','instances','sandboxes')" | grep -qx '3'; do
                echo "waiting for sandbox schema"
                sleep 3
              done
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: sandbox-worker-sharded
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: sandbox-worker-sharded
      hostAliases:
        - ip: 169.254.0.95
          hostnames:
            - cvm.internal.tencentcloudapi.com
      containers:
        - name: worker
          image: REPLACE_REGISTRY_SERVER/lightclaw/sandbox-worker:bj8-20260418-pool-sg-c0c7a32a
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 8080
          command:
            - /bin/sh
            - -lc
          args:
            - |
              ordinal="${POD_NAME##*-}"
              exec worker \
                -refill-count 0 \
                -refill-concurrency 1 \
                -refill-interval 30s \
                -reset-concurrency 1 \
                -cleanup-interval 30s \
                -waterline-interval 1m \
                -waterline-sample 1 \
                -shard-total 8 \
                -shard-index "${ordinal}"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: sandbox-worker-sharded
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames:
      - sandbox
  selector:
    matchLabels:
      app: sandbox-worker-sharded
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
