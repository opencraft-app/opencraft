apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sandbox

resources:
  - ../../base

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: sandbox-platform-values
    envs:
      - generated/platform.env

secretGenerator:
  - name: sandbox-runtime-secrets
    envs:
      - generated/sandbox-runtime-secrets.env

replacements:
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_REDIS_ADDR
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.REDIS_ADDR
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_MYSQL_HOST
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.MYSQL_HOST
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.TENCENT_REGION
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.TENCENT_REGION
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_VPC_ID
    targets:
      - select:
          kind: ConfigMap
          name: sandbox-runtime-config
        fieldPaths:
          - data.SANDBOX_VPC_ID
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: sandbox-api
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-router
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g0
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g1
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g2
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
      - select:
          kind: Deployment
          name: ingressproxy-g3
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.SANDBOX_SUPPORT_SUBNET_ID
    targets:
      - select:
          kind: Service
          name: sandbox-api-internal
        fieldPaths:
          - metadata.annotations.[service.kubernetes.io/qcloud-loadbalancer-internal-subnetid]
  - source:
      kind: ConfigMap
      name: sandbox-platform-values
      fieldPath: data.REGISTRY_SERVER
    targets:
      - select:
          kind: Job
          name: sandbox-db-migrate-v2
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: sandbox-api
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: sandbox-worker
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: sandbox-worker-sharded
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: StatefulSet
          name: sandbox-worker-sharded
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: ingressproxy-router
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: ingressproxy-g0
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: ingressproxy-g1
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: ingressproxy-g2
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
      - select:
          kind: Deployment
          name: ingressproxy-g3
        fieldPaths:
          - spec.template.spec.containers.0.image
        options:
          delimiter: /
          index: 0
