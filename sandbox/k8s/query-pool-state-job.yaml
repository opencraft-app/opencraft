apiVersion: batch/v1
kind: Job
metadata:
  name: sandbox-db-query-pool-state-v1
  namespace: sandbox
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 300
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: mysql-query
          image: mysql:8.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: sandbox-runtime-config
            - secretRef:
                name: sandbox-runtime-secrets
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              mysql \
                --host="${MYSQL_HOST}" \
                --port="${MYSQL_PORT}" \
                --user="${MYSQL_USER}" \
                --password="${MYSQL_PASSWORD}" \
                --database="${MYSQL_DB}" <<'SQL'
              SELECT 'POOL_CONFIG' AS section, id, zone, subnet_id, base_image, desired_capacity, '' AS state, 0 AS count
              FROM pools
              ORDER BY id;

              SELECT 'INSTANCE_STATE' AS section, pool_id AS id, '' AS zone, '' AS subnet_id, '' AS base_image, 0 AS desired_capacity, state, COUNT(*) AS count
              FROM instances
              GROUP BY pool_id, state
              ORDER BY pool_id, state;

              SELECT 'SANDBOX_COUNT' AS section, pool_id AS id, '' AS zone, '' AS subnet_id, '' AS base_image, 0 AS desired_capacity, '' AS state, COUNT(*) AS count
              FROM sandboxes
              GROUP BY pool_id
              ORDER BY pool_id;
              SQL
