schema_version: v1alpha1
source_region: ap-beijing
network_template_id: example-network-template
vpc_cidr: 10.0.0.0/16
support_subnet:
  name: support
  cidr: 10.0.0.0/24
  zone: ap-beijing-8
  role: support
  ordinal: 0
workload_subnets:
  - name: workload-a
    cidr: 10.0.1.0/24
    zone: ap-beijing-8
    role: workload
    ordinal: 1
nat_shape:
  mode: single
  gateways:
    - name: nat-main
      zone: ap-beijing-8
      subnet: support
route_shape:
  route_tables:
    - name: rt-main
      main: true
      associations:
        - target: support
        - target: workload:1
      routes:
        - destination: 10.0.0.0/16
          next_hop_type: LOCAL
          next_hop_ref: local
          enabled: true
        - destination: 0.0.0.0/0
          next_hop_type: NAT
          next_hop_ref: nat-main
          enabled: true
