apiVersion: 1
datasources:
  - name: OpenCraft metrics
    uid: opencraft-prometheus
    type: prometheus
    access: proxy
    url: http://127.0.0.1:23302
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  - name: OpenCraft diagnostics
    uid: opencraft-loki
    type: loki
    access: proxy
    url: http://127.0.0.1:23303
    editable: false
    jsonData:
      maxLines: 500
