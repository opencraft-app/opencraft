receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:23304
        max_request_body_size: 65536
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 128
    spike_limit_mib: 32
  batch:
    timeout: 10s
    send_batch_size: 32
    send_batch_max_size: 64
exporters:
  otlphttp/loki:
    endpoint: http://127.0.0.1:23303/otlp
    timeout: 4s
    sending_queue:
      queue_size: 32
      num_consumers: 1
    retry_on_failure:
      enabled: false
extensions:
  health_check:
    endpoint: 127.0.0.1:23308
service:
  extensions: [health_check]
  telemetry:
    logs:
      level: warn
    metrics:
      level: none
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
