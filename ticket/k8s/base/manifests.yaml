apiVersion: v1
kind: Namespace
metadata:
  name: ticket
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ticket
imagePullSecrets:
  - name: tcr.ipsqcloudregistrykey
  - name: tcr.ipstcr-regcred
  - name: tcr.ipstcr-lightclaw-secret
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ticket-runtime-config
  namespace: ticket
data:
  # 非敏感运行配置。敏感项（Token / DSN / COS 密钥）一律放 secret。
  TICKET_ADDR: ":8090"
  # 反馈后台经 admin-gateway(admin.lightclaw.tech) 访问；用户提交经
  # service-gateway(lightclaw.tech) 访问。两域都需在 CORS 白名单内。
  TICKET_ALLOWED_ORIGINS: "https://lightclaw.tech,https://admin.lightclaw.tech"
  # 反馈 COS 内容层（仅服务端持有密钥，前端永远拿不到 SecretKey）。
  SUPPORT_COS_BUCKET_URL: "REPLACE_TICKET_SUPPORT_COS_BUCKET_URL"
  SUPPORT_COS_PREFIX: "support-feedback"
  # 浏览器预签名 URL 走公网加速；服务端读桶走内网加速（需运行在腾讯云 VPC）。
  SUPPORT_COS_ACCELERATE: "true"
  SUPPORT_COS_INTERNAL: "true"
  # 反馈后台运营白名单（lightclaw 用户 ID，逗号分隔），与上游网关
  # access: authenticated 注入的 X-User-Id 一致。空则接口恒 401。
  SUPPORT_AGENT_IDS: "REPLACE_TICKET_SUPPORT_AGENT_IDS"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket
  namespace: ticket
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ticket
  template:
    metadata:
      labels:
        app: ticket
      annotations:
        ticket.clawhub.dev/redeploy-at: "REPLACE_TICKET_DEPLOYED_AT"
    spec:
      serviceAccountName: default
      nodeSelector:
        pool: REPLACE_TICKET_NODE_POOL
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: ticket
      containers:
        - name: ticket
          image: REPLACE_TICKET_IMAGE
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: ticket-runtime-config
            - secretRef:
                name: ticket-runtime-secrets
          ports:
            - name: http
              containerPort: 8090
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ticket
  namespace: ticket
  labels:
    app: ticket
    metrics-target: "true"
spec:
  selector:
    app: ticket
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ticket
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames:
      - ticket
  selector:
    matchLabels:
      metrics-target: "true"
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
