openapi: 3.0.3
info:
  title: LightVela Ticket API
  version: "0.1.0"
  description: |
    LightVela 反馈/工单系统 v1。
    - 用户 API：`/tickets/*`（session cookie 认证）
    - 管理 API：`/admin/tickets/*`（受 `TICKET_ADMIN_TOKEN` + realm 中间件保护）
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: 健康检查
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /tickets:
    get:
      operationId: listMyTickets
      summary: 列出当前用户提交的工单
      tags: [user]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"
    post:
      operationId: createTicket
      summary: 提交新反馈/工单
      tags: [user]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTicketRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

  /tickets/{id}:
    get:
      operationId: getMyTicket
      summary: 查看自己的工单详情（含消息线程）
      tags: [user]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"

  /tickets/{id}/messages:
    post:
      operationId: appendUserMessage
      summary: 用户追加消息
      tags: [user]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendMessageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"

  /admin/tickets:
    get:
      operationId: adminListTickets
      summary: 受理列表（按 realm 过滤）
      tags: [admin]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/TicketStatus"
        - name: assignee
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketList"

  /admin/tickets/{id}:
    get:
      operationId: adminGetTicket
      summary: 受理详情
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"

  /admin/tickets/{id}/reply:
    post:
      operationId: adminReplyTicket
      summary: 受理人回复
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AppendMessageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketMessage"

  /admin/tickets/{id}/status:
    patch:
      operationId: adminUpdateStatus
      summary: 变更工单状态（写审计）
      tags: [admin]
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateStatusRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ticket"

components:
  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    TicketStatus:
      type: string
      enum: [open, pending, resolved, closed]

    TicketCategory:
      type: string
      enum: [bug, feature, billing, other]

    Ticket:
      type: object
      required: [id, subject, status, category, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        subject:
          type: string
        status:
          $ref: "#/components/schemas/TicketStatus"
        category:
          $ref: "#/components/schemas/TicketCategory"
        realm:
          type: string
        assignee:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TicketList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"

    TicketMessage:
      type: object
      required: [id, ticket_id, author_type, body, created_at]
      properties:
        id:
          type: string
          format: uuid
        ticket_id:
          type: string
          format: uuid
        author_type:
          type: string
          enum: [user, agent, system]
        author_id:
          type: string
          nullable: true
        body:
          type: string
        created_at:
          type: string
          format: date-time

    TicketDetail:
      type: object
      required: [ticket, messages]
      properties:
        ticket:
          $ref: "#/components/schemas/Ticket"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/TicketMessage"

    CreateTicketRequest:
      type: object
      required: [subject, category, body]
      properties:
        subject:
          type: string
          minLength: 1
          maxLength: 200
        category:
          $ref: "#/components/schemas/TicketCategory"
        body:
          type: string
          minLength: 1
          maxLength: 10000

    AppendMessageRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 10000

    UpdateStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/TicketStatus"
        note:
          type: string
