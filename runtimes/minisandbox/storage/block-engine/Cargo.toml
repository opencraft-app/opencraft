[package]
name = "minisandbox-block-engine"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.96"

[features]
default = []
fault-injection = ["dep:libc"]

[dependencies]
libc = { version = "=0.2.189", optional = true }
rusqlite = { version = "=0.32.1", default-features = false, features = ["bundled", "hooks"] }
sha2 = "=0.11.0"
thiserror = "=2.0.20"

[dev-dependencies]
minisandbox-cos-emulator = { path = "../cos-emulator" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
stateright = "=0.31.0"
tempfile = "=3.27.0"

[[bin]]
name = "minisandbox-block-crash-probe"
path = "src/bin/crash_probe.rs"
required-features = ["fault-injection"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
