[package]
name = "pvm-linux-socket-long"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
bytes = "1"
futures-util = "0.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
minisandbox-core = { path = "../../crates/minisandbox-core" }
pvm-socket-service = { path = "../../socket-service" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = "0.27"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "warn"
pedantic = "warn"
