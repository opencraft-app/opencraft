groups:
  - name: llmgateway.p0.operator
    rules:
      - alert: LLMGatewaySetUnavailable
        expr: llmgateway_set_ready == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "LLMGateway Set 不可用"
          description: "Set {{ $labels.set_id }} 当前不可服务，状态为 {{ $labels.status }}。"

      - alert: LLMGatewaySetCapacityFull
        expr: llmgateway_set_accepting_new_users{status="full"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Set 用户水位已满"
          description: "Set {{ $labels.set_id }} 已达到用户上限或预留位，新的用户分配会避开该 Set。"

      - alert: LLMGatewaySetCapacityLow
        expr: llmgateway_set_free_users > 0 and llmgateway_set_free_users < 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Set 可用用户位偏低"
          description: "Set {{ $labels.set_id }} 剩余可分配用户位低于 500，请确认扩容意图或调高水位。"

      - alert: LLMGatewayNewAPI5xxHigh
        expr: sum by (set_id) (rate(llmgateway_traffic_requests_total{upstream_status=~"5.."}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "new-api 上游 5xx 升高"
          description: "Set {{ $labels.set_id }} 最近 5 分钟 new-api 5xx 持续升高。"

      - alert: LLMGatewayUpstreamModelFailureHigh
        expr: sum by (set_id,error_type) (rate(llmgateway_traffic_requests_total{error_type!=""}[5m])) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "模型调用失败率升高"
          description: "Set {{ $labels.set_id }} 出现持续 {{ $labels.error_type }}。"

      - alert: LLMGatewayKeyRouteCacheMissHigh
        expr: |
          sum(rate(llmgateway_key_route_cache_total{result="miss"}[5m]))
          /
          clamp_min(sum(rate(llmgateway_key_route_cache_total[5m])), 1)
          > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Key 路由缓存 miss 异常"
          description: "Key 路由缓存 miss 比例超过 50%，可能导致 MySQL 热查询。"

      - alert: LLMGatewayChannelDrift
        expr: llmgateway_channel_bundle_sync_state{status=~"drift|conflict"} == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "渠道配置存在漂移"
          description: "渠道包 {{ $labels.bundle_id }} 在 Set {{ $labels.set_id }} 存在漂移或冲突。"

      - alert: LLMGatewayChannelSyncError
        expr: llmgateway_channel_bundle_sync_state{status="error"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "渠道同步失败"
          description: "渠道包 {{ $labels.bundle_id }} 同步到 Set {{ $labels.set_id }} 失败。"

      - alert: LLMGatewayGroupRatioApplyError
        expr: llmgateway_group_ratio_apply_state{status="error"} == 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "用户模型分组配置下发失败"
          description: "Set {{ $labels.set_id }} 的平台倍率与 BYOK 分组完整快照持续下发失败。"

      - alert: LLMGatewayGroupRatioVersionLag
        expr: llmgateway_group_ratio_version_lag > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "用户模型分组配置长时间未收敛"
          description: "Set {{ $labels.set_id }} 的本地期望版本持续领先已下发版本 {{ $value }} 个版本。"

      - alert: LLMGatewayWorkerLongNoSuccess
        expr: llmgateway_worker_job_last_success_timestamp_seconds > 0 and time() - llmgateway_worker_job_last_success_timestamp_seconds > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "后台任务长时间没有成功"
          description: "任务 {{ $labels.job }} 超过 30 分钟没有成功记录。"

      - alert: LLMGatewayWorkerFailureIncreased
        expr: increase(llmgateway_worker_job_failure_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "后台任务失败"
          description: "任务 {{ $labels.job }} 最近 10 分钟出现失败。"

      - alert: LLMGatewayWorkerLeaseStuck
        expr: llmgateway_worker_job_lease_age_seconds > 300
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "后台任务租约疑似卡住"
          description: "任务 {{ $labels.job }} 被 {{ $labels.owner }} 持有超过 5 分钟。"

      - alert: LLMGatewayBYOKSyncFailure
        expr: llmgateway_byok_sync_failure > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BYOK 同步失败"
          description: "存在 {{ $value }} 个用户的 BYOK 设置处于 error。"

      - alert: LLMGatewayBYOKWorkerNoProgress
        expr: llmgateway_byok_sync_tasks{status="pending"} > 0 and (llmgateway_byok_sync_last_success_timestamp_seconds == 0 or time() - llmgateway_byok_sync_last_success_timestamp_seconds > 900)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "BYOK worker 长时间无进展"
          description: "存在待处理 BYOK 任务，但最近 15 分钟没有成功完成记录。"

      - alert: LLMGatewayTenantObservationSeedFailure
        expr: increase(llmgateway_worker_job_failure_total{job="refresh_tenant_observations"}[15m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "租户观测播种失败"
          description: "租户 cursor 扫描任务失败，可能导致后续租户没有进入观测队列。"

      - alert: LLMGatewayTenantObservationBacklog
        expr: llmgateway_tenant_observation_oldest_due_age_seconds > 900
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "租户观测队列积压"
          description: "最老的到期观测任务已等待超过 15 分钟。"

      - alert: LLMGatewayTenantObservationError
        expr: llmgateway_tenant_observation_tasks{status="error"} > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "租户观测持续失败"
          description: "存在 {{ $value }} 个租户观测任务处于错误状态。"

      - alert: LLMGatewayTenantObservationLeaseExpired
        expr: llmgateway_tenant_observation_expired_running_leases > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "租户观测租约过期"
          description: "存在运行中但租约已过期的观测任务，可能是 worker 卡死或退出。"

      - alert: LLMGatewayTenantObserverNoProgress
        expr: llmgateway_tenant_observation_due_tasks > 0 and (llmgateway_tenant_observation_last_success_timestamp_seconds == 0 or time() - llmgateway_tenant_observation_last_success_timestamp_seconds > 900)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "observer worker 长时间无进展"
          description: "存在已到期租户观测任务，但最近 15 分钟没有成功完成记录。"

      - alert: LLMGatewaySetUpgradeStuck
        expr: llmgateway_set_upgrade_state{status!~"completed|failed|rolled_back"} == 1 and llmgateway_set_upgrade_stage_age_seconds > 900
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Set 升级阶段长时间没有推进"
          description: "Set {{ $labels.set_id }} 的升级任务 {{ $labels.run_id }} 停留在 {{ $labels.status }} 超过 15 分钟。"

      - alert: LLMGatewaySetUpgradeProbeFailure
        expr: llmgateway_set_upgrade_probe_failures > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Set 新版本受控探针失败"
          description: "Set {{ $labels.set_id }} 的升级任务 {{ $labels.run_id }} 已连续失败 {{ $value }} 次。"

      - alert: LLMGatewaySetRuntimeRoutePublishBlocked
        expr: llmgateway_set_runtime_route_outbox_pending > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Set 运行时路由发布阻塞"
          description: "存在 {{ $value }} 个 MySQL 已提交、但尚未确认写入 Redis 的运行时路由。"
