services:
  llmgateway:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      PORT: "18080"
      CLUSTER_ADMIN_USERNAME: cluster-admin
      CLUSTER_ADMIN_PASSWORD: test-local-password
      CLUSTER_ADMIN_TOKEN: test-cluster-token
      INTERNAL_SERVICE_TOKEN: test-internal-token
      LEGACY_SUBSCRIPTION_CLIENT_COMPAT: "true"
      NEWAPI_SET_ROOT_USERNAME: set-root
      NEWAPI_SET_ROOT_PASSWORD: test-local-password
      LLMGATEWAY_SQL_DSN: root:test-local-password@tcp(mysql-gateway:3306)/llmgateway?parseTime=true&loc=UTC
      LLMGATEWAY_KEY_ROUTE_CACHE_REDIS_URL: redis://:test-local-password@redis-gateway:6379
      LLMGATEWAY_DRAIN_WAIT: 10s
      LLMGATEWAY_SHUTDOWN_TIMEOUT: 5s
      LLMGATEWAY_E2E_HOOKS: "true"
    depends_on:
      mysql-gateway:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
      newapi-a:
        condition: service_healthy
      newapi-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:18080/healthz | grep -q 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 30

  llmgateway-control:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["llmgateway-control"]
    environment:
      PORT: "18080"
      CLUSTER_ADMIN_USERNAME: cluster-admin
      CLUSTER_ADMIN_PASSWORD: test-local-password
      CLUSTER_ADMIN_TOKEN: test-cluster-token
      INTERNAL_SERVICE_TOKEN: test-internal-token
      LEGACY_SUBSCRIPTION_CLIENT_COMPAT: "true"
      NEWAPI_SET_ROOT_USERNAME: set-root
      NEWAPI_SET_ROOT_PASSWORD: test-local-password
      LLMGATEWAY_SQL_DSN: root:test-local-password@tcp(mysql-gateway:3306)/llmgateway?parseTime=true&loc=UTC
      LLMGATEWAY_KEY_ROUTE_CACHE_REDIS_URL: redis://:test-local-password@redis-gateway:6379
      LLMGATEWAY_DRAIN_WAIT: 10s
      LLMGATEWAY_SHUTDOWN_TIMEOUT: 5s
    depends_on:
      mysql-gateway:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
      newapi-a:
        condition: service_healthy
      newapi-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:18080/healthz | grep -q 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 30

  llmgateway-traffic:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["llmgateway-traffic"]
    environment:
      PORT: "18080"
      CLUSTER_ADMIN_TOKEN: test-cluster-token
      INTERNAL_SERVICE_TOKEN: test-internal-token
      NEWAPI_SET_ROOT_USERNAME: set-root
      NEWAPI_SET_ROOT_PASSWORD: test-local-password
      LLMGATEWAY_KEY_ROUTE_CACHE_REDIS_URL: redis://:test-local-password@redis-gateway:6379
      LLMGATEWAY_DRAIN_WAIT: 10s
      LLMGATEWAY_SHUTDOWN_TIMEOUT: 5s
    depends_on:
      redis-gateway:
        condition: service_healthy
      newapi-a:
        condition: service_healthy
      newapi-b:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:18080/healthz | grep -q 'ok'"]
      interval: 5s
      timeout: 3s
      retries: 30

  llmgateway-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["llmgateway-worker"]
    environment:
      LLMGATEWAY_WORKER_POOL: core
      CLUSTER_ADMIN_TOKEN: test-cluster-token
      INTERNAL_SERVICE_TOKEN: test-internal-token
      NEWAPI_SET_ROOT_USERNAME: set-root
      NEWAPI_SET_ROOT_PASSWORD: test-local-password
      LLMGATEWAY_SQL_DSN: root:test-local-password@tcp(mysql-gateway:3306)/llmgateway?parseTime=true&loc=UTC
      LLMGATEWAY_WORKER_POLL_INTERVAL: 2s
      LLMGATEWAY_WORKER_LEASE_TTL: 30s
    depends_on:
      mysql-gateway:
        condition: service_healthy
      newapi-a:
        condition: service_healthy
      newapi-b:
        condition: service_healthy

  llmgateway-worker-byok:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["llmgateway-worker"]
    environment:
      LLMGATEWAY_WORKER_POOL: byok
      NEWAPI_SET_ROOT_USERNAME: set-root
      NEWAPI_SET_ROOT_PASSWORD: test-local-password
      LLMGATEWAY_SQL_DSN: root:test-local-password@tcp(mysql-gateway:3306)/llmgateway?parseTime=true&loc=UTC
      LLMGATEWAY_KEY_ROUTE_CACHE_REDIS_URL: redis://:test-local-password@redis-gateway:6379
      LLMGATEWAY_BYOK_WORKER_POLL_INTERVAL: 100ms
      LLMGATEWAY_BYOK_WORKER_LEASE_TTL: 30s
      LLMGATEWAY_BYOK_WORKER_MAX_CONCURRENCY: "8"
      LLMGATEWAY_BYOK_WORKER_SET_CONCURRENCY: "4"
      LLMGATEWAY_SQL_MAX_OPEN_CONNS: "12"
      LLMGATEWAY_SQL_MAX_IDLE_CONNS: "4"
    depends_on:
      mysql-gateway:
        condition: service_healthy
      redis-gateway:
        condition: service_healthy
      newapi-a:
        condition: service_healthy
      newapi-b:
        condition: service_healthy

  llmgateway-worker-observer:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["llmgateway-worker"]
    environment:
      LLMGATEWAY_WORKER_POOL: observer
      NEWAPI_SET_ROOT_USERNAME: set-root
      NEWAPI_SET_ROOT_PASSWORD: test-local-password
      LLMGATEWAY_SQL_DSN: root:test-local-password@tcp(mysql-gateway:3306)/llmgateway?parseTime=true&loc=UTC
      LLMGATEWAY_WORKER_POLL_INTERVAL: 200ms
      LLMGATEWAY_WORKER_LEASE_TTL: 30s
      LLMGATEWAY_OBSERVER_SEED_BATCH_SIZE: "100"
      LLMGATEWAY_OBSERVER_WORKER_POLL_INTERVAL: 100ms
      LLMGATEWAY_OBSERVER_WORKER_LEASE_TTL: 30s
      LLMGATEWAY_OBSERVER_WORKER_MAX_CONCURRENCY: "8"
      LLMGATEWAY_OBSERVER_WORKER_SET_CONCURRENCY: "4"
      LLMGATEWAY_SQL_MAX_OPEN_CONNS: "12"
      LLMGATEWAY_SQL_MAX_IDLE_CONNS: "4"
    depends_on:
      mysql-gateway:
        condition: service_healthy
      newapi-a:
        condition: service_healthy
      newapi-b:
        condition: service_healthy

  mockllm:
    image: golang:1.25-alpine
    working_dir: /src
    volumes:
      - ../..:/src:ro
      - mockllm-go-mod:/go/pkg/mod
      - mockllm-go-build:/root/.cache/go-build
    command:
      - go
      - run
      - github.com/kagent-dev/mockllm/cmd/mockllm@fb3faa58b2e34caf636c567cf11942783820de47
      - --config
      - /src/test/e2e/mockllm/config.json
      - --listen-addr
      - 0.0.0.0:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/health | grep -q 'healthy'"]
      interval: 5s
      timeout: 3s
      retries: 60

  mysql-gateway:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql:rw,size=512m
    environment:
      MYSQL_ROOT_PASSWORD: "test-local-password"
      MYSQL_DATABASE: llmgateway
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ptest-local-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 60

  redis-gateway:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "test-local-password"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test-local-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60

  newapi-a:
    image: ${NEWAPI_IMAGE:-calciumion/new-api@sha256:3125e24f119fa5e767563226a5208f2902b3faed3f27b69ea275b32c9f04a066}
    command: --log-dir /app/logs
    environment:
      SQL_DSN: root:test-local-password@tcp(mysql-a:3306)/new-api
      REDIS_CONN_STRING: redis://:test-local-password@redis-a:6379
      SESSION_SECRET: llmgateway-e2e-set-a-session-secret
      TZ: Asia/Shanghai
      GLOBAL_API_RATE_LIMIT_ENABLE: "false"
      GLOBAL_WEB_RATE_LIMIT_ENABLE: "false"
      CRITICAL_RATE_LIMIT_ENABLE: "false"
      SEARCH_RATE_LIMIT_ENABLE: "false"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: newapi-a
    depends_on:
      mockllm:
        condition: service_healthy
      mysql-a:
        condition: service_healthy
      redis-a:
        condition: service_healthy
    volumes:
      - newapi-a-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q 'success'"]
      interval: 5s
      timeout: 3s
      retries: 60

  newapi-b:
    image: ${NEWAPI_IMAGE:-calciumion/new-api@sha256:3125e24f119fa5e767563226a5208f2902b3faed3f27b69ea275b32c9f04a066}
    command: --log-dir /app/logs
    environment:
      SQL_DSN: root:test-local-password@tcp(mysql-b:3306)/new-api
      REDIS_CONN_STRING: redis://:test-local-password@redis-b:6379
      SESSION_SECRET: llmgateway-e2e-set-b-session-secret
      TZ: Asia/Shanghai
      GLOBAL_API_RATE_LIMIT_ENABLE: "false"
      GLOBAL_WEB_RATE_LIMIT_ENABLE: "false"
      CRITICAL_RATE_LIMIT_ENABLE: "false"
      SEARCH_RATE_LIMIT_ENABLE: "false"
      BATCH_UPDATE_ENABLED: "true"
      NODE_NAME: newapi-b
    depends_on:
      mockllm:
        condition: service_healthy
      mysql-b:
        condition: service_healthy
      redis-b:
        condition: service_healthy
    volumes:
      - newapi-b-logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -q 'success'"]
      interval: 5s
      timeout: 3s
      retries: 60

  mysql-a:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql:rw,size=512m
    environment:
      MYSQL_ROOT_PASSWORD: "test-local-password"
      MYSQL_DATABASE: new-api
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ptest-local-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 60

  mysql-b:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql:rw,size=512m
    environment:
      MYSQL_ROOT_PASSWORD: "test-local-password"
      MYSQL_DATABASE: new-api
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -ptest-local-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 60

  redis-a:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "test-local-password"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test-local-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60

  redis-b:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "test-local-password"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "test-local-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 60

  e2e:
    image: golang:1.25-alpine
    working_dir: /src
    environment:
      LLMGATEWAY_E2E: "1"
      LLMGATEWAY_E2E_CLUSTER: /src/test/e2e/cluster.compose.yaml
    volumes:
      - ../..:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      llmgateway:
        condition: service_healthy
      llmgateway-control:
        condition: service_healthy
      llmgateway-traffic:
        condition: service_healthy
    command: ["go", "test", "-tags=integration", "./test/e2e", "-count=1", "-v"]

  load-runner:
    profiles: ["load"]
    image: golang:1.25-alpine
    working_dir: /src
    environment:
      LOAD_PROFILE: local
      LOAD_LLMGATEWAY_BASE_URL: http://llmgateway:18080
      LOAD_LLMGATEWAY_ADMIN_TOKEN: test-cluster-token
      LOAD_LLMGATEWAY_INTERNAL_TOKEN: test-internal-token
      LOAD_PROVIDER_BASE_URL: http://mockllm:8080
      LOAD_PROVIDER_API_KEY: test-mockllm-key
      LOAD_PROVIDER_MODEL: llmgw-mock-chat
      LOAD_CHAT_MODEL: auto
    volumes:
      - ../..:/src
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    depends_on:
      mockllm:
        condition: service_healthy
      llmgateway:
        condition: service_healthy
    command: ["go", "run", "./test/load/runner"]

volumes:
  newapi-a-logs:
  newapi-b-logs:
  go-mod:
  go-build:
  mockllm-go-mod:
  mockllm-go-build:
