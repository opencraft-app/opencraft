apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmgateway-regression-disruptive
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmgateway-regression-disruptive
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [batch]
    resources: [cronjobs]
    resourceNames: [llmgateway-set-manager]
    verbs: [get, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, create, delete]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      - llmgateway-control
      - llmgateway-worker-admin
      - llmgateway-worker-byok
      - llmgateway-worker-core
      - llmgateway-worker-maintenance
      - llmgateway-worker-observer
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmgateway-regression-disruptive-base
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: llmgateway-regression-disruptive
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmgateway-regression-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmgateway-regression-disruptive
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: llmgateway-regression-disruptive
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmgateway-regression-disruptive
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ${NODE_READER_NAME}
rules:
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ${NODE_READER_NAME}
subjects:
  - kind: ServiceAccount
    name: llmgateway-regression-disruptive
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ${NODE_READER_NAME}
