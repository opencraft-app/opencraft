apiVersion: v1
kind: ServiceAccount
metadata:
  name: llmgateway-regression-runner
  namespace: ${NAMESPACE}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: llmgateway-regression-runner
  namespace: ${NAMESPACE}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [llmgateway-traffic]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    resourceNames: [llmgateway-traffic]
    verbs: [get]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [llmgateway-regression-traffic-rollout]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: llmgateway-regression-runner
  namespace: ${NAMESPACE}
subjects:
  - kind: ServiceAccount
    name: llmgateway-regression-runner
    namespace: ${NAMESPACE}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: llmgateway-regression-runner
---
apiVersion: v1
kind: Service
metadata:
  name: llmgateway-regression-pacer
  namespace: ${NAMESPACE}
spec:
  selector:
    app: llmgateway-regression-pacer
  ports:
    - name: http
      port: 18082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-regression-pacer
  namespace: ${NAMESPACE}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: llmgateway-regression-pacer
  template:
    metadata:
      labels:
        app: llmgateway-regression-pacer
    spec:
      imagePullSecrets:
        - name: tcr-pull-secret
      containers:
        - name: pacer
          image: ${LLMGATEWAY_IMAGE}
          imagePullPolicy: IfNotPresent
          command: [/usr/local/bin/llmgateway-regression-pacer]
          env:
            - name: LLMGATEWAY_REGRESSION_PACER_UPSTREAM
              value: ${PACER_UPSTREAM}
            - name: LLMGATEWAY_REGRESSION_SSE_DURATION
              value: ${SSE_DURATION}
            - name: LLMGATEWAY_REGRESSION_LONG_MODEL
              value: ${LONG_STREAM_MODEL}
            - name: LLMGATEWAY_REGRESSION_FAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-runtime
                  key: INTERNAL_SERVICE_TOKEN
          ports:
            - name: http
              containerPort: 18082
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
