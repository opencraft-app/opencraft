apiVersion: v1
kind: ConfigMap
metadata:
  name: shared-mysql-a-init
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: shared-mysql-a
    app.kubernetes.io/part-of: llmgateway-kro-demo
    llmgateway.io/shard: shard-a
data:
  01-init.sql: |
    CREATE DATABASE IF NOT EXISTS `newapi_set_a`;
    CREATE DATABASE IF NOT EXISTS `newapi_set_b`;
---
apiVersion: v1
kind: Service
metadata:
  name: shared-mysql-a
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: shared-mysql-a
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: llmgateway-kro-demo
    llmgateway.io/shard: shard-a
spec:
  selector:
    app.kubernetes.io/name: shared-mysql-a
  ports:
    - name: mysql
      protocol: TCP
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-mysql-a
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: shared-mysql-a
    app.kubernetes.io/component: mysql
    app.kubernetes.io/part-of: llmgateway-kro-demo
    llmgateway.io/shard: shard-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shared-mysql-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shared-mysql-a
        app.kubernetes.io/component: mysql
        app.kubernetes.io/part-of: llmgateway-kro-demo
        llmgateway.io/shard: shard-a
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          imagePullPolicy: IfNotPresent
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: "123456"
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uroot -p123456 --silent
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: mysql-data
          emptyDir:
            sizeLimit: 1Gi
        - name: mysql-init
          configMap:
            name: shared-mysql-a-init
---
apiVersion: v1
kind: Service
metadata:
  name: shared-redis-a
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: shared-redis-a
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: llmgateway-kro-demo
    llmgateway.io/shard: shard-a
spec:
  selector:
    app.kubernetes.io/name: shared-redis-a
  ports:
    - name: redis
      protocol: TCP
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shared-redis-a
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: shared-redis-a
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: llmgateway-kro-demo
    llmgateway.io/shard: shard-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: shared-redis-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: shared-redis-a
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: llmgateway-kro-demo
        llmgateway.io/shard: shard-a
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - redis-server
            - --requirepass
            - "123456"
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - redis-cli
                - -a
                - "123456"
                - ping
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
---
