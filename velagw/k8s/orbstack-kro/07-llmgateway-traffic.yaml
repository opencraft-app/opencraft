apiVersion: v1
kind: Service
metadata:
  name: llmgateway-traffic
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-traffic
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  selector:
    app.kubernetes.io/name: llmgateway-traffic
  ports:
    - name: http
      protocol: TCP
      port: 18080
      targetPort: 18080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-traffic
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-traffic
    app.kubernetes.io/component: data-plane
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  replicas: 2
  progressDeadlineSeconds: 900
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: llmgateway-traffic
  template:
    metadata:
      labels:
        app: llmgateway-traffic
        app.kubernetes.io/name: llmgateway-traffic
        app.kubernetes.io/component: data-plane
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      terminationGracePeriodSeconds: 330
      containers:
        - name: traffic
          image: llmgateway:local
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/llmgateway-traffic
          env:
            - name: PORT
              value: "18080"
            - name: LLMGATEWAY_KEY_ROUTE_CACHE_REDIS_URL
              value: redis://:123456@shared-redis-a:6379/0
            - name: LLMGATEWAY_SET_RUNTIME_ROUTE_REQUIRED
              value: "true"
            - name: LLMGATEWAY_TRAFFIC_TRANSPORT_DRAIN_TIMEOUT
              value: 330s
            - name: CLUSTER_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: token
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: internal-token
            - name: NEWAPI_SET_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: set-root-username
            - name: NEWAPI_SET_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: set-root-password
            - name: LLMGATEWAY_KEY_ROUTE_CACHE_TTL
              value: 1m
            - name: LLMGATEWAY_KEY_ROUTE_CACHE_CAPACITY
              value: "100000"
            - name: LLMGATEWAY_DRAIN_WAIT
              value: 45s
            - name: LLMGATEWAY_SHUTDOWN_TIMEOUT
              value: 240s
            - name: LLMGATEWAY_UPSTREAM_MAX_IDLE_CONNS
              value: "500"
            - name: LLMGATEWAY_UPSTREAM_MAX_IDLE_CONNS_PER_HOST
              value: "100"
            - name: LLMGATEWAY_UPSTREAM_IDLE_CONN_TIMEOUT
              value: 90s
          ports:
            - name: http
              containerPort: 18080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: llmgateway-traffic
  namespace: llmgateway-kro-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: llmgateway-traffic
