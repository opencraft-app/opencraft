apiVersion: v1
kind: ServiceAccount
metadata:
  name: velagwset-provisioner
  namespace: llmgateway-kro-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: velagwset-provisioner
  namespace: llmgateway-kro-demo
rules:
  - apiGroups: ["llmgateway.io"]
    resources: ["llmfleets"]
    verbs: ["get"]
  - apiGroups: ["gateway.lightvela.com"]
    resources: ["velagwsets"]
    verbs: ["get", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "create"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: velagwset-provisioner
  namespace: llmgateway-kro-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: velagwset-provisioner
subjects:
  - kind: ServiceAccount
    name: velagwset-provisioner
    namespace: llmgateway-kro-demo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velagwset-provisioner
  namespace: llmgateway-kro-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: velagwset-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: velagwset-provisioner
    spec:
      serviceAccountName: velagwset-provisioner
      tolerations:
        - key: node.kubernetes.io/disk-pressure
          operator: Exists
          effect: NoSchedule
      containers:
        - name: provisioner
          image: llmgateway:local
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/velagwset-provisioner"]
          env:
            - {name: LLMGATEWAY_CONTROL_URL, value: "http://llmgateway-control:18080"}
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: {secretKeyRef: {name: llmgateway-control-admin, key: internal-token}}
            - {name: LLMGATEWAY_IMAGE, value: "llmgateway:local"}
            - {name: LLMGATEWAY_SET_SOURCE, value: "kro"}
            - {name: LLMGATEWAY_FLEET, value: "fleet-native"}
            - {name: LLMGATEWAY_VELAGWSET_PROVISION_INTERVAL, value: "1s"}
            - {name: LLMGATEWAY_VELAGWSET_PROVISION_LEASE, value: "30s"}
            - {name: LLMGATEWAY_VELAGWSET_UPGRADE_ENABLED, value: "true"}
            - {name: LLMGATEWAY_VELAGWSET_DECOMMISSION_ENABLED, value: "true"}
            - {name: LLMGATEWAY_SET_UPGRADE_PROBE_MODEL, value: "llmgw-mock-chat"}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
