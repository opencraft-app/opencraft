apiVersion: v1
kind: ConfigMap
metadata:
  name: llmgateway-e2e-mock-openai
  namespace: llmgateway-kro-demo
  annotations:
    llmgateway.io/e2e-path: /v1/chat/completions
  labels:
    app.kubernetes.io/name: llmgateway-e2e-mock-openai
    app.kubernetes.io/part-of: llmgateway-kro-demo
data:
  config.json: |
    {
      "listen_addr": "0.0.0.0:8080",
      "openai": [
        {
          "name": "llmgateway-set-upgrade-probe",
          "match": {
            "match_type": "contains",
            "message": {
              "role": "user",
              "content": "reply with ok"
            }
          },
          "response": {
            "id": "chatcmpl-llmgw-upgrade-probe",
            "object": "chat.completion",
            "created": 1783296000,
            "model": "llmgw-k8s-chat",
            "choices": [
              {
                "index": 0,
                "message": {
                  "role": "assistant",
                  "content": "ok"
                },
                "finish_reason": "stop"
              }
            ]
          }
        },
        {
          "name": "llmgateway-k8s-e2e-chat",
          "match": {
            "match_type": "contains",
            "message": {
              "role": "user",
              "content": "你好"
            }
          },
          "response": {
            "id": "chatcmpl-llmgw-k8s-e2e",
            "object": "chat.completion",
            "created": 1783296000,
            "model": "llmgw-k8s-chat",
            "choices": [
              {
                "index": 0,
                "message": {
                  "role": "assistant",
                  "content": "llmgateway k8s e2e: control bundle sync and traffic proxy are healthy."
                },
                "finish_reason": "stop"
              }
            ]
          }
        }
      ]
    }
---
apiVersion: v1
kind: Service
metadata:
  name: llmgateway-e2e-mock-openai
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-e2e-mock-openai
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  selector:
    app.kubernetes.io/name: llmgateway-e2e-mock-openai
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llmgateway-e2e-mock-openai
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-e2e-mock-openai
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: llmgateway-e2e-mock-openai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmgateway-e2e-mock-openai
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      containers:
        - name: mockllm
          image: golang:1.25-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /tmp/mockllm
          command:
            - go
            - run
            - github.com/kagent-dev/mockllm/cmd/mockllm@fb3faa58b2e34caf636c567cf11942783820de47
            - --config
            - /opt/llmgateway-e2e/config.json
            - --listen-addr
            - 0.0.0.0:8080
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 20
          volumeMounts:
            - name: mock-server
              mountPath: /opt/llmgateway-e2e
              readOnly: true
      volumes:
        - name: mock-server
          configMap:
            name: llmgateway-e2e-mock-openai
