apiVersion: v1
kind: ConfigMap
metadata:
  name: llmgateway-autoscale-request-e2e
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-autoscale-request-e2e
    app.kubernetes.io/part-of: llmgateway-kro-demo
data:
  main.go: |
    package main

    import (
      "bytes"
      "encoding/json"
      "fmt"
      "io"
      "net/http"
      "os"
      "strconv"
      "strings"
      "time"
    )

    type envelope struct {
      Success bool            `json:"success"`
      Message string          `json:"message"`
      Data    json.RawMessage `json:"data"`
    }

    type managedSet struct {
      ID          string `json:"id"`
      Status      string `json:"status"`
      Setup       bool   `json:"setup"`
      AdminUserID int64  `json:"admin_user_id"`
    }

    type capacityResult struct {
      ReadySets       int `json:"ready_sets"`
      ReadyFreeUsers  int `json:"ready_free_users"`
      RequiredFreeUsers int `json:"required_free_users"`
      CreatedRequests int `json:"created_requests"`
      Requests []struct {
        ID     string `json:"id"`
        SetID  string `json:"set_id"`
        Status string `json:"status"`
      } `json:"requests"`
    }

    var (
      controlURL = strings.TrimRight(env("LLMGATEWAY_CONTROL_URL", "http://llmgateway-control:18080"), "/")
      adminToken = os.Getenv("LLMGATEWAY_ADMIN_TOKEN")
      namespace = env("LLMGATEWAY_E2E_NAMESPACE", "llmgateway-kro-demo")
      fleet = env("LLMGATEWAY_E2E_FLEET", "fleet-demo")
      source = env("LLMGATEWAY_E2E_SOURCE", "kro")
      setPrefix = env("LLMGATEWAY_E2E_SET_PREFIX", "set-e2e")
    )

    func main() {
      must("control ready", waitReady(controlURL + "/readyz"))

      var sets []managedSet
      admin("GET", "/api/sets", nil, &sets)
      ready := 0
      for _, set := range sets {
        if set.Status == "active" && set.Setup && set.AdminUserID > 0 {
          ready++
        }
      }
      if ready == 0 {
        fail("no active managed sets available for autoscale e2e: %#v", sets)
      }

      body := map[string]any{
        "source": source,
        "namespace": namespace,
        "fleet": fleet,
        "shard_refs": []string{"shard-a", "shard-b"},
        "max_users_per_set": 1,
        "target_utilization": 0.50,
        "min_ready_free_users": ready + 1,
        "max_scale_up_per_cycle": 1,
        "set_id_prefix": setPrefix,
        "redis_db_start": envInt("LLMGATEWAY_E2E_REDIS_DB_START", 3),
        "redis_db_limit": envInt("LLMGATEWAY_E2E_REDIS_DB_LIMIT", 16),
      }
      var result capacityResult
      admin("POST", "/api/admin/set-capacity/reconcile", body, &result)
      if result.CreatedRequests != 1 || len(result.Requests) == 0 {
        fail("autoscale reconcile did not create exactly one request: %+v", result)
      }
      request := result.Requests[0]
      if !strings.HasPrefix(request.SetID, setPrefix + "-") || request.Status != "pending" {
        fail("unexpected autoscale request: %+v", request)
      }
      printJSON(map[string]any{
        "ok": true,
        "ready_sets": ready,
        "requested_set": request.SetID,
        "request_id": request.ID,
      })
    }

    func admin(method, path string, body any, out any) {
      raw := requestJSON(method, controlURL + path, body, map[string]string{
        "Authorization": "Bearer " + adminToken,
        "Accept": "application/json",
      })
      var parsed envelope
      must("decode control response", json.Unmarshal(raw, &parsed))
      if !parsed.Success {
        fail("control %s %s failed: %s", method, path, string(raw))
      }
      if out != nil && len(parsed.Data) > 0 {
        must("decode control data", json.Unmarshal(parsed.Data, out))
      }
    }

    func waitReady(endpoint string) error {
      deadline := time.Now().Add(180 * time.Second)
      var last error
      for time.Now().Before(deadline) {
        req, err := http.NewRequest("GET", endpoint, nil)
        if err != nil {
          return err
        }
        resp, err := (&http.Client{Timeout: 10 * time.Second}).Do(req)
        if err == nil {
          io.Copy(io.Discard, resp.Body)
          resp.Body.Close()
          if resp.StatusCode == http.StatusOK {
            return nil
          }
          last = fmt.Errorf("status %d", resp.StatusCode)
        } else {
          last = err
        }
        time.Sleep(2 * time.Second)
      }
      return last
    }

    func requestJSON(method, endpoint string, body any, headers map[string]string) []byte {
      var reader io.Reader
      if body != nil {
        raw, err := json.Marshal(body)
        must("encode request", err)
        reader = bytes.NewReader(raw)
      }
      req, err := http.NewRequest(method, endpoint, reader)
      must("build request", err)
      if body != nil {
        req.Header.Set("Content-Type", "application/json")
      }
      for key, value := range headers {
        req.Header.Set(key, value)
      }
      resp, err := (&http.Client{Timeout: 60 * time.Second}).Do(req)
      must("send request", err)
      defer resp.Body.Close()
      raw, err := io.ReadAll(resp.Body)
      must("read response", err)
      if resp.StatusCode < 200 || resp.StatusCode >= 300 {
        fail("%s %s status=%d body=%s", method, endpoint, resp.StatusCode, string(raw))
      }
      return raw
    }

    func env(key, fallback string) string {
      if value := strings.TrimSpace(os.Getenv(key)); value != "" {
        return value
      }
      return fallback
    }

    func envInt(key string, fallback int) int {
      raw := strings.TrimSpace(os.Getenv(key))
      if raw == "" {
        return fallback
      }
      value, err := strconv.Atoi(raw)
      if err != nil {
        fail("%s must be an integer: %q", key, raw)
      }
      return value
    }

    func printJSON(value any) {
      raw, err := json.Marshal(value)
      must("print json", err)
      fmt.Println(string(raw))
    }

    func must(label string, err error) {
      if err != nil {
        fail("%s: %v", label, err)
      }
    }

    func fail(format string, args ...any) {
      fmt.Fprintf(os.Stderr, format + "\n", args...)
      os.Exit(1)
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: llmgateway-autoscale-request-e2e
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-autoscale-request-e2e
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llmgateway-autoscale-request-e2e
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: golang:1.25-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /tmp/llmgateway-autoscale-e2e
          command:
            - go
            - run
            - /opt/llmgateway-autoscale-e2e/main.go
          env:
            - name: LLMGATEWAY_CONTROL_URL
              value: http://llmgateway-control:18080
            - name: LLMGATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: token
            - name: LLMGATEWAY_E2E_SET_PREFIX
              value: set-e2e
            - name: LLMGATEWAY_E2E_REDIS_DB_START
              value: "3"
            - name: LLMGATEWAY_E2E_REDIS_DB_LIMIT
              value: "16"
          volumeMounts:
            - name: runner-script
              mountPath: /opt/llmgateway-autoscale-e2e
              readOnly: true
      volumes:
        - name: runner-script
          configMap:
            name: llmgateway-autoscale-request-e2e
