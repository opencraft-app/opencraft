apiVersion: batch/v1
kind: Job
metadata:
  name: fleet-demo-set-fact-writer
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: fleet-demo-set-fact-writer
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fleet-demo-set-fact-writer
        app.kubernetes.io/part-of: llmgateway-kro-demo
    spec:
      restartPolicy: OnFailure
      containers:
        - name: curl
          image: curlimages/curl:8.8.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LLMGATEWAY_CONTROL_URL
              value: http://llmgateway-control:18080
            - name: LLMGATEWAY_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llmgateway-control-admin
                  key: token
          command:
            - sh
            - -c
            - |
              set -eu
              curl -fsS -X POST "${LLMGATEWAY_CONTROL_URL}/api/admin/set-reconcile-facts" \
                -H "Authorization: Bearer ${LLMGATEWAY_ADMIN_TOKEN}" \
                -H "Content-Type: application/json" \
                -d '{
                  "source": "kro",
                  "namespace": "llmgateway-kro-demo",
                  "fleet": "fleet-demo",
                  "sets": [
                    {"set_id":"set-a","name":"Set A","base_url":"http://fleet-demo-set-a-newapi-admin:3000","traffic_base_url":"http://fleet-demo-set-a-newapi-traffic:3000","shard_ref":"shard-a"},
                    {"set_id":"set-b","name":"Set B","base_url":"http://fleet-demo-set-b-newapi-admin:3000","traffic_base_url":"http://fleet-demo-set-b-newapi-traffic:3000","shard_ref":"shard-a"},
                    {"set_id":"set-c","name":"Set C","base_url":"http://fleet-demo-set-c-newapi-admin:3000","traffic_base_url":"http://fleet-demo-set-c-newapi-traffic:3000","shard_ref":"shard-b"},
                    {"set_id":"set-d","name":"Set D","base_url":"http://fleet-demo-set-d-newapi-admin:3000","traffic_base_url":"http://fleet-demo-set-d-newapi-traffic:3000","shard_ref":"shard-b"}
                  ]
                }'
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: llmgateway-set-fact-reconciler
  namespace: llmgateway-kro-demo
  labels:
    app.kubernetes.io/name: llmgateway-set-fact-reconciler
    app.kubernetes.io/part-of: llmgateway-kro-demo
spec:
  schedule: "*/1 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: llmgateway-set-fact-reconciler
            app.kubernetes.io/part-of: llmgateway-kro-demo
        spec:
          restartPolicy: OnFailure
          containers:
            - name: curl
              image: curlimages/curl:8.8.0
              imagePullPolicy: IfNotPresent
              env:
                - name: LLMGATEWAY_CONTROL_URL
                  value: http://llmgateway-control:18080
                - name: LLMGATEWAY_ADMIN_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: llmgateway-control-admin
                      key: token
              command:
                - sh
                - -c
                - |
                  set -eu
                  curl -fsS -X POST "${LLMGATEWAY_CONTROL_URL}/api/admin/set-reconcile-facts/reconcile" \
                    -H "Authorization: Bearer ${LLMGATEWAY_ADMIN_TOKEN}" \
                    -H "Content-Type: application/json" \
                    -d '{"source":"kro","namespace":"llmgateway-kro-demo","fleet":"fleet-demo","limit":20}'
