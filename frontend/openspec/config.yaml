  - input / textarea / label       表单控件
  - scroll-area                    滚动区域（基于 @radix-ui/react-scroll-area）
  - badge / stat-tile              徽章 / 指标块
  - ambient-glow                   环境光晕（品牌动效）
  - display-title / page-header    标题/页头
  - composer-panel / inset-panel   面板容器
  - state-panel                    空/异常态面板
  - chat-bubble                    聊天气泡
  - control-shell                  控制台外壳样式

  domain 层（业务领域组件 src/components/domain/）:
  - plan-card                      套餐卡片
  - alert-card / bot-status-card   告警 / Bot 状态
  - billing-summary-card           计费摘要
  - audit-log-table                审计日志
  - code-input                     验证码输入框
  - config-section                 配置区块
  - event-feed                     事件流
  - invite-status-card             邀请码状态
  - release-item                   发布项
  - scenario-switcher              场景切换
  - setup-step-timeline            初始化步骤时间线

  site 层（站点级组件 src/components/site/）:
  - brand-mark / homepage-grammar  品牌标识 / 首页文案构件
  - legal-footer                   页脚（法律/备案）
  - login-modal                    登录弹窗
  - marketing-header-actions       营销页头部动作
  - user-avatar-menu               用户头像菜单
  - language-switcher              语言切换下拉（EN / 中），支持 dropdown / inline 两种形态
                                   · 仅国际站（isGlobal）在 LandingNavbar 挂载：
                                     桌面端右上角 dropdown；移动端汉堡面板底部 inline
                                   · 切换后调用 i18n.setLocale()，持久化到 localStorage.lw-locale

  # 自定义 Hooks
  - useRepositories()                              注入数据层
  - useSession() / useSessionActions()             会话/会话动作
  - useOpenClaw()                                  OpenClaw 配置
  - useAsyncResource(fetcher, deps)                异步资源加载（loading/error/data）
  - useGeneratedNickname()                         随机昵称生成
  - useT()                                         i18n 翻译 hook（`t("中文原文")`）

  # 工具函数 (src/lib/)
  - auth-api-base.ts       解析认证 API base URL（支持构建时烘焙）
  - asset-url.ts           静态资源 URL 包装（CDN_BASE 硬编码常量，所有环境走 CDN）
  - oauth.ts               OAuth 提供商定义与跳转；`VISIBLE_OAUTH_PROVIDERS` 按
                           isGlobal 区分（国内 QQ/微信，国际 Google/GitHub）
  - avatar-image.ts        头像图片客户端压缩（压到 200KB 内）
  - region.ts              站点区域常量（`REGION` / `isCN` / `isGlobal` / `DEFAULT_LOCALE`），
                           由 NEXT_PUBLIC_REGION 编译期注入（兼容读取 VITE_REGION），未命中分支会被 Tree-shake

  # i18n (src/i18n/)
  - index.ts               i18next 初始化入口，读取 localStorage.lw-locale 覆盖或 region
                           默认语言；导出 `setLocale(locale)` 动作
  - t.ts                   `useT()` hook 与命令式 `t()`；接受中文原文，内部反查 hash key
  - generated/             脚本自动生成，**禁止手改**
                           · zh-CN.json / en-US.json / zh-to-key.json

  # 构建与部署脚本（package.json scripts）
  - dev / dev:cn / dev:global                      Next 本地开发
  - build:cn / build:global                        区域化 Next static export（out）
  - i18n:extract / i18n:check                      文案抽取 / 翻译完整性 CI 门禁
  - deploy:cf                                      Cloudflare Pages 发布（国际站）

  # 领域模型 (src/domain/)
  - types.ts               User / Bot / Plan / Pass / Bundle / AuditEvent ... 等核心类型
  - plan-catalog.ts        套餐目录常量

