schema: spec-driven

context: |
  # 项目概述
  Lightclaw 是一款面向 C 端的 AI Agent（智能体）SaaS 产品，提供"一分钟搞定、真的不难"
  的轻量接入体验。用户可以快速创建 AI Bot、订阅付费套餐、绑定 QQ / 微信 / 企业微信等
  多种通道，并在控制台中管理工作台、设置、终端等。

  本仓库 (`wisp/mono`) 是微服务 Monorepo，包含多个 Go 后端子服务（ai-gateway、ctl、
  subscription、payment、session、user、admin-gateway 等）和一套前端子目录
  (`frontend/`)。本文件的 context 聚焦于前端子目录 `frontend/`，这是日常迭代主阵地。

  # 技术栈
  - 框架: Next.js 16 App Router + React 19
  - UI 组件库: @radix-ui/*（Dialog/Label/Select/Tabs/ScrollArea/Slot）+ shadcn/ui 风格自封装；
                部分页面使用 @tencent/tea-sdk-lightclaw（本地 monorepo 旁路调试）
  - 样式方案: Tailwind CSS v4 + 设计 token + class-variance-authority + tailwind-merge
  - 状态管理: 纯 React Context + useReducer（无 Redux/Zustand/MobX 等外部库）
              · SessionProvider（会话 / 用户 / 订阅）
              · OpenClawProvider（OpenClaw 配置态）
              · RepositoryProvider（依赖注入 Repositories，可在 fake / http 间切换）
  - 路由: Next App Router（`src/app/**/*.next.tsx`），共享页面组件通过 `next-site/`
          的 client shell 接入；部分页面组件内部仍复用 react-router-dom 的 Link/Hook
          API，由 Next 侧适配层提供导航能力。
  - 语言: TypeScript 5.9（strict + noUncheckedIndexedAccess + noUnusedLocals/Parameters）
  - HTTP 请求: 基于 `repositories/` 封装的 Repository 模式（自定义 fetch 封装，未用 axios）
              请求入口: `frontend/src/repositories/http-repositories.ts`
              所有 API 通过 `AuthRepository` / `PlanRepository` / `BotRepository` 接口访问
  - 国际化: react-i18next v15 + 自研「中文即 key」方案（src/i18n/）
              · 业务侧调用 `useT()`，参数直接写中文原文；运行时通过 generated/zh-to-key.json
                反查 hash key，再向 i18next 查询 hash → 目标语言
              · 字典文件由 `pnpm i18n:extract` 扫描生成（src/i18n/generated/zh-CN.json /
                en-US.json / zh-to-key.json）；`pnpm i18n:check` 作为 CI 门禁
              · 默认语言由 `src/lib/region.ts::DEFAULT_LOCALE` 根据 NEXT_PUBLIC_REGION /
                VITE_REGION 兼容环境变量决定
                （cn→zh-CN，global→en-US）；用户可通过 `<LanguageSwitcher>` 手动切换
                并持久化到 localStorage `lw-locale`
  - 区域化: `src/lib/region.ts` 暴露 `REGION` / `isCN` / `isGlobal` / `DEFAULT_LOCALE`
              编译期常量（优先由 `NEXT_PUBLIC_REGION` 注入，保留 `VITE_REGION` 作为发布脚本兼容 env）
              用于国内 / 国际站差异化：OAuth 渠道、首页平台卡片、法律页脚、默认语言等
  - 测试: Vitest 4 + @testing-library/react + @testing-library/user-event + jsdom
  - 构建: Next 静态导出（`next build --webpack` + Fumadocs MDX + 后处理脚本）
              区域化：`pnpm build:cn` / `pnpm build:global`
  - 包管理: pnpm（workspace 形式，与 `tea-sdk-lightclaw` monorepo 联动）
  - 部署: Cloudflare Pages（静态托管，`pnpm deploy:cf`）+ shprod（Kubernetes Pod）双形态
              国内站走 shprod，国际站走 Cloudflare Pages

  # 入口与初始化流程
  入口文件: frontend/src/app/layout.next.tsx

  启动流程:
    1. Next 根据 `pageExtensions: ['next.tsx', 'next.ts']` 只消费 `.next.tsx/.next.ts` 路由文件。
    2. `src/app/layout.next.tsx` 提供 HTML shell 与全站 metadata。
    3. `src/app/(site)/layout.next.tsx` 装配站点级样式、SessionProvider、RepositoryProvider、
       ThemeStyleInjector、RUM bridge 等运行时上下文。
    4. 复杂业务页面通过 `next-site/*` client islands 接入，复用 `src/pages/*` 页面组件。
    5. URL 常量放在 `src/lib/agent-routes.ts`，不得再新增 `src/router/*` 作为应用入口。

  # 路由结构
  路由方案: Next App Router（静态导出友好）

  公开路由:
  - /                     → LandingPage          官网首页
  - /changelog            → ChangelogPage        更新日志（不需登录）

  Next App Router 路由:
  - /subscribe            → next-site/SubscribePage 套餐订阅/支付
                                                  国内 / 国际站差异通过 isGlobal 分支在同一组件内实现：
                                                  · 价格（¥49 / $7.5）、文案、布局微调（间距 / 字号 / 内边距）
                                                  · 仅国内站走实名认证拦截（realname_required → /account?modal=realname）
                                                  · 国际站当前走伪支付直创建路径（不弹实名）

  营销域路由（MarketingAuthGuard 已登录校验；挂在 /dashboard/* 与 /agents 命名空间）:
  - /dashboard/create     → CreateOpenClawPage   创建 OpenClaw 向导
  - /dashboard/setup      → OpenClawSetupPage    创建后初始化设置
  - /dashboard/success    → OpenClawSuccessPage  创建成功落地页
  - /agents               → OpenClawSettingsPage Agent 控制台（默认通道页，业务核心）
  - /agents/{channels|models|skills|persona|automations|memory|achievements|files|chat}
                           → OpenClawSettingsPage 对应 Agent 能力分区
  - /account              → AccountPage          个人中心（41KB / 1084 行，含实名认证入口）
  - /account/orders       → AccountOrdersPage    订单列表（14KB）
  - /dashboard（裸路径）  → Navigate             兼容跳 /agents
  - /dashboard/settings   → Navigate             兼容跳 /agents

  旧路径兼容重定向（客户端 Navigate，防止老书签/外链 404）:
  - /create-openclaw      → /dashboard/create
  - /openclaw/setup       → /dashboard/setup
  - /openclaw/success     → /dashboard/success
  - /openclaw/settings    → /agents
  - /console/settings     → /agents
  - /console/{create|setup|success} → /dashboard/{...}

  营销域认证路由（套 MarketingLayout + AuthRouteGuard）:
  - /auth/sign-in         → SignInPage           手机号 + 验证码登录
  - /auth/sign-up         → SignUpPage           注册（已收敛至 sign-in）
  - /auth/sign-up-code    → 重定向 /auth/sign-in
  - /auth/invite          → InvitePage           邀请码校验
  - /auth/forgot-password → 重定向 /auth/sign-in

  营销域需登录路由（AuthenticatedGuard + PlanGuard）:
  - /plans/select         → PlanSelectPage       首次登录选择套餐

  控制台 (App Shell) 路由（套 AppAccessGuard + AppShellLayout）:
  - /settings/account     → AccountProfilePage   账号设置
  - /bots/:id/workspace   → WorkspacePage        Bot 工作台
  - /bots/:id/settings    → SettingsPage         Bot 设置（调用 getSettingsSnapshot）
  - /bots/:id/terminal    → BotTerminalPage      Bot 终端
  - /*（AppShell 内兜底） → 重定向 /agents

  内部调试路由:
  - /internal/style-lab   → StyleLabPage         设计系统预览

  404 兜底:
  - /*                    → NotFoundPage

  路由守卫矩阵（src/router/guards.tsx）:
  - MarketingAuthGuard    营销域 /dashboard/*、/account/*、/subscribe
  - AuthRouteGuard        /auth/*（已登录跳首页）
  - AuthenticatedGuard    通用登录校验，供子守卫复用
  - PlanGuard             /plans/select 首次选套餐时序
  - AppAccessGuard        AppShell 域；当前等价 AuthenticatedGuard，预留订阅/权限扩展位

  # 状态管理
  架构: 纯 React Context + useReducer，无外部状态库。

  - SessionProvider (src/contexts/session-context.tsx):
      reducer 管理 { authReady, stage: anonymous|authenticated, user, currentSubscription,
                     firstBotId, inviteValidation, verificationCooldownUntil }
      对外暴露动作：signInWithCode / signUpWithCode / sendVerificationCode /
                     uploadAvatar / updateProfile / deleteAccount / signOut / refreshSession
      LocalStorage key: `lightclaw-ui-session-v1`（仅持久化 UI 态，非敏感）
      监听 AUTH_UNAUTHORIZED_EVENT 自动登出

  - OpenClawProvider (src/contexts/openclaw-context.tsx):
      管理 OpenClaw 配置状态（创建向导、当前 OpenClaw 实例等）

  - RepositoryProvider (src/contexts/repository-context.tsx):
      依赖注入层，运行时选择 http-repositories 或 fake-repositories
      通过 hook `useRepositories()` 暴露给业务层

  # API 请求层
  核心封装文件: frontend/src/repositories/http-repositories.ts

  设计模式: Repository Pattern（接口隔离）。所有 API 调用都通过 Repositories 接口访问，
           生产环境注入 http 实现，演示/测试环境注入 fake 实现。

  - 请求基址: 通过 `lib/auth-api-base.ts` 解析（支持构建时烘焙 VITE_AUTH_API_BASE_URL）
  - 通用封装: 内部实现 apiRequest，统一处理:
      · 鉴权 Cookie / Session Token
      · 统一 APIEnvelope<T> 响应解包 (code / message / data)
      · 401 自动广播 AUTH_UNAUTHORIZED_EVENT 触发登出
      · 网络/业务错误转换为 Error 抛出

  # 核心 API 列表

  AuthRepository (认证/用户):
  - signInWithCode({phone, code, inviteCode?})         手机号+验证码登录
  - sendVerificationCode(request)                      发送短信验证码（含冷却）
  - signUpWithCode({name, phone, code, inviteCode?})   注册
  - validateInviteCode(code)                           校验邀请码有效性
  - prepareInviteCode(code) / activateInviteCode(code) 邀请码准备/激活
  - getSession() / getProfile() / updateProfile()      会话/资料
  - uploadAvatar(file)                                 头像上传（客户端压缩到 200KB）
  - deleteAccount()                                    注销账号
  - getOAuthStartUrl(provider)                         OAuth 启动 URL（第三方登录）
  - signInAsGuest() / signOut()                        游客登录 / 登出

  PlanRepository (套餐/订阅):
  - getCurrentSubscription()                           当前订阅
  - getPlanPreview()                                   套餐预览（候选+确认标志）
  - updateSubscription(tier)                           切换套餐
  - listBundles()                                      GET /v1/bundles（上线套餐）
  - createPass(bundleId)                               POST /v1/passes（购买套餐）
  - listMyPasses()                                     GET /v1/passes（我的权益列表）

  BotRepository (Bot 全生命周期):
  - getDashboardSnapshot / getWorkspaceSnapshot / getSettingsSnapshot
  - createBot / destroyBot / updateBotProfile
  - sendWorkspaceMessage                               工作台消息
  - getTerminalSession / execDebugCommand              终端/调试
  - configureQQChannel                                 QQ 通道配置
  - createWeixinLoginSession / getWeixinLoginSession /
    cancelWeixinLoginSession / subscribeWeixinLoginSessionEvents    微信登录全流程（SSE）
  - listSoulTemplates                                  灵魂模板列表

  # 公共组件

