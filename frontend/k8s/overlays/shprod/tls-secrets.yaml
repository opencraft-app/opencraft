# Manual-only TLS binding for shprod.
# This file is intentionally NOT included in the default shprod kustomization.
# Daily deploys must not overwrite qcloud_cert_id, so apply this file only when
# initially binding or explicitly rotating the Tencent Cloud certificate.
apiVersion: v1
kind: Secret
metadata:
  name: lightclaw-site-tls
  annotations:
    qcloud_cert_id: WTMYCy04
type: Opaque
stringData:
  qcloud_cert_id: WTMYCy04
---
apiVersion: v1
kind: Secret
metadata:
  name: lightvela-tencent-com-tls
  namespace: frontend
  annotations:
    qcloud_cert_id: X5D1P2FI
type: Opaque
stringData:
  qcloud_cert_id: X5D1P2FI
