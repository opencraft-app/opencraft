apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: frontend

resources:
  - ../../base

patches:
  - target:
      kind: Ingress
      name: preview-lightclaw-public
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: lightclaw.site
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lightclaw.site
      - op: replace
        path: /spec/tls/0/secretName
        value: lightclaw-site-tls
      - op: add
        path: /spec/tls/-
        value:
          hosts:
            - lightvela.tencent.com
          secretName: lightvela-tencent-com-tls
      - op: add
        path: /spec/rules/-
        value:
          host: lightvela.tencent.com
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: frontend-web-ingress
                    port:
                      number: 80
  - target:
      kind: TkeServiceConfig
      name: preview-lightclaw-public-config
    patch: |-
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/domain
        value: lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/0/domains/0/rules/0/healthCheck/httpCheckDomain
        value: lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/defaultServer
        value: lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/domain
        value: lightclaw.site
      - op: replace
        path: /spec/loadBalancer/l7Listeners/1/domains/0/rules/0/healthCheck/httpCheckDomain
        value: lightclaw.site
      - op: add
        path: /spec/loadBalancer/l7Listeners/0/domains/-
        value:
          domain: lightvela.tencent.com
          rules:
            - url: /
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2
      - op: add
        path: /spec/loadBalancer/l7Listeners/1/domains/-
        value:
          domain: lightvela.tencent.com
          rules:
            - url: /
              forwardType: HTTP
              healthCheck:
                enable: true
                intervalTime: 10
                timeout: 5
                healthNum: 2
                unHealthNum: 2
                httpCheckPath: /healthz
                httpCheckDomain: lightvela.tencent.com
                httpCheckMethod: HEAD
                httpCode: 2

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: frontend-platform-values
    envs:
      - generated/platform.env

replacements:
  - source:
      kind: ConfigMap
      name: frontend-platform-values
      fieldPath: data.FRONTEND_IMAGE
    targets:
      - select:
          kind: Deployment
          name: frontend-web
        fieldPaths:
          - spec.template.spec.containers.0.image
  - source:
      kind: ConfigMap
      name: frontend-platform-values
      fieldPath: data.FRONTEND_NODE_POOL
    targets:
      - select:
          kind: Deployment
          name: frontend-web
        fieldPaths:
          - spec.template.spec.nodeSelector.pool
  - source:
      kind: ConfigMap
      name: frontend-platform-values
      fieldPath: data.FRONTEND_DEPLOYED_AT
    targets:
      - select:
          kind: Deployment
          name: frontend-web
        fieldPaths:
          - spec.template.metadata.annotations.[frontend.lightclaw.dev/redeploy-at]
