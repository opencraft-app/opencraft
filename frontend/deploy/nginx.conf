server {
    listen 8080;
    server_name lightvela.tencent.com www.lightvela.tencent.com;
    absolute_redirect off;
    port_in_redirect off;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location / {
        return 302 https://lightvela.com$request_uri;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location = /dashboard {
        return 301 https://$http_host/dashboard/settings;
    }

    location = /dashboard/ {
        return 301 https://$http_host/dashboard/settings;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
